<svg viewBox="0 0 800 346" role="img" aria-label="X-Forwarded-For growing as a request passes through a CDN and a reverse proxy, including a spoofed value sent by the client">
  <defs>
    <marker id="rx-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="rx-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">rate limiting and audit logs both need the client IP. there are four candidates.</text>

  <rect id="rx-c" x="16" y="48" width="150" height="52" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="91" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">attacker</text>
  <text id="rx-ct" x="91" y="88" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">203.0.113.9</text>

  <rect id="rx-cdn" x="206" y="48" width="150" height="52" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="281" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">CDN</text>
  <text id="rx-cdnt" x="281" y="88" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">198.51.100.4</text>

  <rect id="rx-lb" x="396" y="48" width="150" height="52" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="471" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">your proxy</text>
  <text id="rx-lbt" x="471" y="88" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">10.0.0.5</text>

  <rect id="rx-app" x="586" y="48" width="198" height="52" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="685" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">your app</text>
  <text id="rx-appt" x="685" y="88" font-size="9" text-anchor="middle" fill="#5f6f66">rate limits by "client IP"</text>

  <line x1="170" y1="74" x2="200" y2="74" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rx-arr)"/>
  <line x1="360" y1="74" x2="390" y2="74" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rx-arr)"/>
  <line x1="550" y1="74" x2="580" y2="74" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rx-arr)"/>

  <rect id="rx-panel" x="16" y="122" width="768" height="110" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rx-pt" x="30" y="142" font-size="11" fill="#23362e" font-weight="700">X-Forwarded-For as it travels</text>
  <text id="rx-p1" x="30" y="164" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rx-p2" x="30" y="184" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rx-p3" x="30" y="204" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rx-p4" x="30" y="224" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="rx-dec" x="16" y="244" width="768" height="62" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rx-d1" x="30" y="266" font-size="10.5" fill="#23362e" font-weight="700">how the app picks an address</text>
  <text id="rx-d2" x="30" y="288" font-size="10" fill="#5f6f66">&nbsp;</text>

  <rect id="rx-verd" x="16" y="318" width="768" height="26" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rx-v" x="400" y="336" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">X-Forwarded-For is client input until a proxy you trust overwrites it</text>
</svg>
