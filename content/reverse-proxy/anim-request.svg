<svg viewBox="0 0 800 356" role="img" aria-label="A request arriving at a reverse proxy, terminating TLS, matching a route, being rewritten and forwarded over a pooled connection to an upstream, then the response travelling back">
  <defs>
    <marker id="rp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="rp-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">a browser opens <tspan font-family="Fira Code, monospace">https://shop.example/api/orders/77</tspan></text>

  <rect id="rp-client" x="16" y="56" width="150" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="91" y="80" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">browser</text>
  <text id="rp-clientt" x="91" y="98" font-size="9.5" text-anchor="middle" fill="#5f6f66">203.0.113.9</text>

  <rect id="rp-proxy" x="300" y="46" width="200" height="76" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text id="rp-proxyt" x="400" y="70" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">reverse proxy</text>
  <text id="rp-proxyt2" x="400" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">listening on :443</text>
  <text id="rp-proxyt3" x="400" y="108" font-size="9.5" text-anchor="middle" fill="#5f6f66">idle</text>

  <rect id="rp-u1" x="620" y="36" width="164" height="42" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rp-u1t" x="702" y="62" font-size="10" text-anchor="middle" fill="#23362e">web · 10.0.1.11:8080</text>
  <rect id="rp-u2" x="620" y="88" width="164" height="42" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rp-u2t" x="702" y="114" font-size="10" text-anchor="middle" fill="#23362e">orders · 10.0.2.11:8080</text>
  <rect id="rp-u3" x="620" y="140" width="164" height="42" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rp-u3t" x="702" y="166" font-size="10" text-anchor="middle" fill="#23362e">assets · S3 origin</text>

  <line x1="170" y1="84" x2="294" y2="84" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rp-arr)"/>
  <line x1="506" y1="84" x2="614" y2="84" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rp-arr)"/>
  <text id="rp-leg1" x="232" y="76" font-size="9" text-anchor="middle" fill="#5f6f66">connection A</text>
  <text id="rp-leg2" x="560" y="76" font-size="9" text-anchor="middle" fill="#5f6f66">connection B</text>

  <g id="rp-msg" class="hidden">
    <rect x="16" y="150" width="150" height="26" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
    <text id="rp-msgt" x="91" y="167" font-size="8.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">TLS ClientHello</text>
  </g>

  <rect id="rp-inside" x="16" y="196" width="440" height="116" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rp-it" x="30" y="216" font-size="11" fill="#23362e" font-weight="700">inside the proxy</text>
  <text id="rp-i1" x="30" y="238" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="rp-i2" x="30" y="258" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="rp-i3" x="30" y="278" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="rp-i4" x="30" y="300" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="rp-hdr" x="472" y="196" width="312" height="116" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rp-ht" x="486" y="216" font-size="11" fill="#23362e" font-weight="700">what the upstream receives</text>
  <text id="rp-h1" x="486" y="236" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rp-h2" x="486" y="252" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rp-h3" x="486" y="268" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rp-h4" x="486" y="284" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rp-h5" x="486" y="302" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="rp-verd" x="16" y="324" width="768" height="26" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rp-v" x="400" y="342" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the client and the upstream never speak to each other</text>
</svg>
