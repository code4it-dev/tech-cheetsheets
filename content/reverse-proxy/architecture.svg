<svg viewBox="0 0 800 352" role="img" aria-label="A reverse proxy terminating TLS and routing by host and path to several internal services, contrasted with a forward proxy">
  <defs>
    <marker id="rv-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the direction of the arrow is the whole distinction</text>

  <rect x="16" y="36" width="380" height="88" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="30" y="56" font-size="11" fill="#5f6f66" font-weight="700">FORWARD PROXY &mdash; in front of clients</text>
  <rect x="30" y="66" width="90" height="44" rx="5" fill="#e8ece2" stroke="#a9b5a6"/><text x="75" y="93" font-size="10" text-anchor="middle" fill="#23362e">your users</text>
  <rect x="150" y="66" width="90" height="44" rx="5" fill="#fbf3c4" stroke="#d9c25a"/><text x="195" y="93" font-size="10" text-anchor="middle" fill="#23362e">proxy</text>
  <rect x="270" y="66" width="112" height="44" rx="5" fill="#e8ece2" stroke="#a9b5a6"/><text x="326" y="93" font-size="10" text-anchor="middle" fill="#23362e">the internet</text>
  <line x1="124" y1="88" x2="144" y2="88" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rv-arr)"/>
  <line x1="244" y1="88" x2="264" y2="88" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rv-arr)"/>

  <rect x="412" y="36" width="372" height="88" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="426" y="56" font-size="11" fill="#2f6b3f" font-weight="700">REVERSE PROXY &mdash; in front of servers</text>
  <rect x="426" y="66" width="90" height="44" rx="5" fill="#e8ece2" stroke="#a9b5a6"/><text x="471" y="93" font-size="10" text-anchor="middle" fill="#23362e">the internet</text>
  <rect x="546" y="66" width="90" height="44" rx="5" fill="#fbf3c4" stroke="#d9c25a"/><text x="591" y="93" font-size="10" text-anchor="middle" fill="#23362e">proxy</text>
  <rect x="666" y="66" width="104" height="44" rx="5" fill="#e3eedc" stroke="#2f6b3f"/><text x="718" y="93" font-size="10" text-anchor="middle" fill="#23362e">your servers</text>
  <line x1="520" y1="88" x2="540" y2="88" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rv-arr)"/>
  <line x1="640" y1="88" x2="660" y2="88" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rv-arr)"/>

  <rect x="16" y="140" width="188" height="150" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="110" y="162" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">clients</text>
  <text x="110" y="184" font-size="9.5" text-anchor="middle" fill="#5f6f66">browsers, apps, partners</text>
  <text x="110" y="206" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">https://shop.example</text>
  <text x="110" y="228" font-size="9.5" text-anchor="middle" fill="#5f6f66">one name, one certificate</text>
  <text x="110" y="256" font-size="9.5" text-anchor="middle" fill="#2f6b3f">knows nothing about what</text>
  <text x="110" y="272" font-size="9.5" text-anchor="middle" fill="#2f6b3f">is behind the door</text>

  <rect x="232" y="140" width="268" height="150" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="366" y="162" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">reverse proxy</text>
  <text x="246" y="184" font-size="9.5" fill="#5f6f66">terminate TLS · HTTP/2, HTTP/3</text>
  <text x="246" y="202" font-size="9.5" fill="#5f6f66">route by host, path, header</text>
  <text x="246" y="220" font-size="9.5" fill="#5f6f66">rewrite paths · normalise headers</text>
  <text x="246" y="238" font-size="9.5" fill="#5f6f66">timeouts · size limits · rate limits</text>
  <text x="246" y="256" font-size="9.5" fill="#5f6f66">compress · cache · buffer</text>
  <text x="246" y="274" font-size="9.5" fill="#5f6f66">access logs · request ids · retries</text>

  <rect x="528" y="140" width="256" height="40" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="542" y="165" font-size="10" fill="#23362e"><tspan font-family="Fira Code, monospace">/</tspan> &rarr; web &nbsp;·&nbsp; 10.0.1.11:8080</text>
  <rect x="528" y="188" width="256" height="40" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="542" y="213" font-size="10" fill="#23362e"><tspan font-family="Fira Code, monospace">/api/</tspan> &rarr; orders &nbsp;·&nbsp; 10.0.2.11:8080</text>
  <rect x="528" y="236" width="256" height="40" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="542" y="261" font-size="10" fill="#23362e"><tspan font-family="Fira Code, monospace">/static/</tspan> &rarr; assets &nbsp;·&nbsp; S3 origin</text>

  <line x1="208" y1="214" x2="226" y2="214" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rv-arr)"/>
  <line x1="504" y1="214" x2="522" y2="214" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rv-arr)"/>

  <text class="hand" x="400" y="322" fill="#c53b3b" font-size="16" text-anchor="middle">it is the only layer that sees every request. that is its power and its blast radius.</text>
</svg>
