<svg viewBox="0 0 560 240" role="img" aria-label="Animated daily traffic curve compared with its flat average">
  <line x1="30" y1="200" x2="535" y2="200" stroke="#5f6f66" stroke-width="1.5"/>
  <line x1="30" y1="30" x2="30" y2="200" stroke="#5f6f66" stroke-width="1.5"/>
  <text x="30" y="216" font-size="10" fill="#5f6f66">00:00</text>
  <text x="265" y="216" font-size="10" fill="#5f6f66">12:00</text>
  <text x="505" y="216" font-size="10" fill="#5f6f66">24:00</text>
  <text x="14" y="26" font-size="10.5" fill="#5f6f66">req/s</text>
  <line id="pk-avg" class="hidden" x1="30" y1="136" x2="535" y2="136" stroke="#5f6f66" stroke-width="2" stroke-dasharray="6 4"/>
  <text id="pk-avg-t" class="hidden" x="40" y="130" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">average = 50,000 /s</text>
  <polyline id="pk-curve" class="hidden" fill="none" stroke="#2f6b3f" stroke-width="2.5"
    points="30,182 72,190 113,194 155,182 197,140 238,116 280,104 322,116 363,104 405,80 447,44 488,140 530,176"/>
  <g id="pk-peak" class="hidden">
    <circle cx="447" cy="44" r="6" fill="#c53b3b"/>
    <text x="447" y="34" font-size="11" text-anchor="middle" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">125,000 /s</text>
  </g>
  <g id="pk-gap" class="hidden">
    <line x1="447" y1="50" x2="447" y2="130" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="460" y="96" font-size="12" fill="#c53b3b" font-weight="700">2.5x</text>
  </g>
  <text id="pk-note" class="hand hidden" x="34" y="236" font-size="15" fill="#c53b3b">provision for the peak, budget for the average</text>
</svg>
