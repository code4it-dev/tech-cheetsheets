<svg viewBox="0 0 800 340" role="img" aria-label="The estimation pipeline from users through QPS, storage and bandwidth to machines and cost, with the rounding rules alongside">
  <defs>
    <marker id="bo-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="24" font-size="13" text-anchor="middle" fill="#5f6f66">Almost every sizing question walks the same path. Only the multipliers change.</text>

  <g font-size="12" text-anchor="middle">
    <rect x="16" y="46" width="112" height="56" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="72" y="70" fill="#23362e" font-weight="600">Users</text><text x="72" y="88" fill="#5f6f66" font-size="11">DAU, sessions</text>
    <rect x="148" y="46" width="112" height="56" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="204" y="70" fill="#23362e" font-weight="600">Actions</text><text x="204" y="88" fill="#5f6f66" font-size="11">per user per day</text>
    <rect x="280" y="46" width="112" height="56" rx="7" fill="#fbf3c4" stroke="#d9c25a"/>
    <text x="336" y="70" fill="#23362e" font-weight="600">QPS</text><text x="336" y="88" fill="#5f6f66" font-size="11">&divide; 86,400</text>
    <rect x="412" y="46" width="112" height="56" rx="7" fill="#f9e3df" stroke="#c53b3b"/>
    <text x="468" y="70" fill="#23362e" font-weight="600">Peak QPS</text><text x="468" y="88" fill="#5f6f66" font-size="11">x 2&ndash;4</text>
    <rect x="544" y="46" width="112" height="56" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="600" y="70" fill="#23362e" font-weight="600">Machines</text><text x="600" y="88" fill="#5f6f66" font-size="11">&divide; per-box rate</text>
    <rect x="676" y="46" width="108" height="56" rx="7" fill="#e3eedc" stroke="#2f6b3f"/>
    <text x="730" y="70" fill="#23362e" font-weight="600">Cost</text><text x="730" y="88" fill="#5f6f66" font-size="11">x unit price</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#bo-arr)">
    <line x1="128" y1="74" x2="144" y2="74"/><line x1="260" y1="74" x2="276" y2="74"/>
    <line x1="392" y1="74" x2="408" y2="74"/><line x1="524" y1="74" x2="540" y2="74"/>
    <line x1="656" y1="74" x2="672" y2="74"/>
  </g>

  <path d="M336 102 L336 132" stroke="#5f6f66" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#bo-arr)"/>
  <g font-size="12" text-anchor="middle">
    <rect x="214" y="136" width="124" height="56" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="276" y="160" fill="#23362e" font-weight="600">Storage / day</text><text x="276" y="178" fill="#5f6f66" font-size="11">x bytes per item</text>
    <rect x="354" y="136" width="124" height="56" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="416" y="160" fill="#23362e" font-weight="600">Total storage</text><text x="416" y="178" fill="#5f6f66" font-size="11">x retention x replicas</text>
    <rect x="494" y="136" width="124" height="56" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="556" y="160" fill="#23362e" font-weight="600">Bandwidth</text><text x="556" y="178" fill="#5f6f66" font-size="11">QPS x payload</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#bo-arr)">
    <line x1="338" y1="164" x2="350" y2="164"/><line x1="478" y1="164" x2="490" y2="164"/>
  </g>
  <path d="M618 164 L694 110" stroke="#5f6f66" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#bo-arr)"/>

  <rect x="16" y="212" width="370" height="112" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="30" y="234" font-size="12.5" font-weight="600" fill="#23362e">The four rules</text>
  <g font-size="11.5" fill="#5f6f66">
    <text x="30" y="256">1. Round to <tspan fill="#c53b3b" font-weight="600">one significant figure</tspan>, before multiplying.</text>
    <text x="30" y="276">2. Guess each input within a <tspan fill="#c53b3b" font-weight="600">factor of two</tspan>; errors cancel.</text>
    <text x="30" y="296">3. Carry the <tspan fill="#c53b3b" font-weight="600">units</tspan> through every line. They catch mistakes.</text>
    <text x="30" y="316">4. End with a <tspan fill="#c53b3b" font-weight="600">sanity check</tspan> against something you know.</text>
  </g>

  <rect x="402" y="212" width="382" height="112" rx="8" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="416" y="234" font-size="12.5" font-weight="600" fill="#23362e">Numbers worth memorising</text>
  <g font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">
    <text x="416" y="256">86,400 s/day &asymp; 10^5      2^10 &asymp; 1 thousand</text>
    <text x="416" y="276">3.2 x 10^7 s/year          2^20 &asymp; 1 million</text>
    <text x="416" y="296">1 Gbps = 125 MB/s          2^30 &asymp; 1 billion</text>
    <text x="416" y="316">1 day = 100k s is the single most useful one</text>
  </g>
  <text class="hand" x="150" y="206" font-size="16" fill="#c53b3b">precision is not the goal &mdash; elimination is</text>
</svg>
