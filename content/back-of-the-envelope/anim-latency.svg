<svg viewBox="0 0 800 300" role="img" aria-label="Animated latency comparison where one nanosecond is stretched to one second">
  <text x="20" y="26" font-size="13" font-weight="600" fill="#23362e">Stretch time by a billion: <tspan font-family="Fira Code, monospace" fill="#c53b3b">1 ns = 1 second</tspan>. Now the gaps are things you have lived through.</text>

  <g id="bl-r1" class="hidden">
    <text x="20" y="64" font-size="11.5" fill="#23362e">L1 cache reference</text>
    <rect x="250" y="52" width="20" height="16" rx="3" fill="#2f6b3f"/>
    <text x="620" y="64" font-size="11.5" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">1 ns &rarr; 1 second</text>
  </g>
  <g id="bl-r2" class="hidden">
    <text x="20" y="96" font-size="11.5" fill="#23362e">Main memory reference</text>
    <rect x="250" y="84" width="55" height="16" rx="3" fill="#2f6b3f"/>
    <text x="620" y="96" font-size="11.5" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">100 ns &rarr; 2 minutes</text>
  </g>
  <g id="bl-r3" class="hidden">
    <text x="20" y="128" font-size="11.5" fill="#23362e">Compress 1 KB</text>
    <rect x="250" y="116" width="95" height="16" rx="3" fill="#8a6a0c"/>
    <text x="620" y="128" font-size="11.5" fill="#8a6a0c" font-weight="600" font-family="Fira Code, monospace">2 &micro;s &rarr; 33 minutes</text>
  </g>
  <g id="bl-r4" class="hidden">
    <text x="20" y="160" font-size="11.5" fill="#23362e">NVMe SSD random read</text>
    <rect x="250" y="148" width="140" height="16" rx="3" fill="#8a6a0c"/>
    <text x="620" y="160" font-size="11.5" fill="#8a6a0c" font-weight="600" font-family="Fira Code, monospace">20 &micro;s &rarr; 6 hours</text>
  </g>
  <g id="bl-r5" class="hidden">
    <text x="20" y="192" font-size="11.5" fill="#23362e">Round trip, same datacenter</text>
    <rect x="250" y="180" width="195" height="16" rx="3" fill="#c53b3b"/>
    <text x="620" y="192" font-size="11.5" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">500 &micro;s &rarr; 6 days</text>
  </g>
  <g id="bl-r6" class="hidden">
    <text x="20" y="224" font-size="11.5" fill="#23362e">Spinning-disk seek</text>
    <rect x="250" y="212" width="260" height="16" rx="3" fill="#c53b3b"/>
    <text x="620" y="224" font-size="11.5" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">5 ms &rarr; 2 months</text>
  </g>
  <g id="bl-r7" class="hidden">
    <text x="20" y="256" font-size="11.5" fill="#23362e">Round trip, Europe to California</text>
    <rect x="250" y="244" width="340" height="16" rx="3" fill="#c53b3b"/>
    <text x="620" y="256" font-size="11.5" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">150 ms &rarr; 5 years</text>
  </g>
  <text x="250" y="276" font-size="10.5" fill="#5f6f66">bar length is roughly logarithmic &mdash; linear would make the first six invisible</text>
  <text id="bl-note" class="hand hidden" x="20" y="294" font-size="16" fill="#c53b3b">avoid the network, avoid the disk, and never cross an ocean twice</text>
</svg>
