<svg viewBox="0 0 800 340" role="img" aria-label="Animated worksheet estimating QPS, storage, bandwidth and cost for a photo-sharing service">
  <text x="20" y="26" font-size="13" font-weight="600" fill="#23362e">Brief: a photo-sharing service, 100 million daily active users. Can we afford it?</text>

  <g id="be-r1" class="hidden" font-size="12">
    <text x="20" y="58" fill="#5f6f66">Users and behaviour</text>
    <text x="250" y="58" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">100M DAU, 0.2 uploads + 50 views each</text>
  </g>
  <g id="be-r2" class="hidden" font-size="12">
    <text x="20" y="86" fill="#5f6f66">Seconds in a day</text>
    <text x="250" y="86" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">86,400 &asymp; 100,000</text>
    <text x="520" y="86" fill="#c53b3b" font-size="11">memorise this one</text>
  </g>
  <g id="be-r3" class="hidden" font-size="12">
    <text x="20" y="114" fill="#5f6f66">Average QPS</text>
    <text x="250" y="114" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">200 writes/s &middot; 50,000 reads/s</text>
  </g>
  <g id="be-r4" class="hidden" font-size="12">
    <text x="20" y="142" fill="#5f6f66">Peak (x3)</text>
    <text x="250" y="142" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">600 writes/s &middot; 150,000 reads/s</text>
    <text x="520" y="142" fill="#c53b3b" font-size="11">size for peak, bill for average</text>
  </g>
  <g id="be-r5" class="hidden" font-size="12">
    <text x="20" y="170" fill="#5f6f66">Read : write ratio</text>
    <text x="250" y="170" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">250 : 1</text>
    <text x="520" y="170" fill="#5f6f66" font-size="11">cache + CDN + read replicas, decided</text>
  </g>
  <g id="be-r6" class="hidden" font-size="12">
    <text x="20" y="198" fill="#5f6f66">Storage per day</text>
    <text x="250" y="198" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">20M x 2 MB = 40 TB / day</text>
  </g>
  <g id="be-r7" class="hidden" font-size="12">
    <text x="20" y="226" fill="#5f6f66">5 years x 3 replicas</text>
    <text x="250" y="226" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">~200 PB</text>
    <text x="520" y="226" fill="#5f6f66" font-size="11">this is the real constraint</text>
  </g>
  <g id="be-r8" class="hidden" font-size="12">
    <text x="20" y="254" fill="#5f6f66">Metadata</text>
    <text x="250" y="254" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">200 B x 20M = 4 GB/day &rarr; 1.5 TB/yr</text>
    <text x="620" y="254" fill="#5f6f66" font-size="11">fits on one box</text>
  </g>
  <g id="be-r9" class="hidden" font-size="12">
    <text x="20" y="282" fill="#5f6f66">Peak egress</text>
    <text x="250" y="282" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">150k x 200 KB = 30 GB/s = 240 Gbps</text>
    <text x="620" y="282" fill="#5f6f66" font-size="11">CDN, not origin</text>
  </g>
  <g id="be-verdict" class="hidden">
    <rect x="20" y="296" width="760" height="34" rx="6" fill="#f9e3df" stroke="#c53b3b"/>
    <text x="400" y="318" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">200 PB x $0.02/GB/month &asymp; $4M / month &mdash; before a line of code is written</text>
  </g>
</svg>
