<svg viewBox="0 0 560 250" role="img" aria-label="Animated comparison of a closed-loop and an open-loop measurement of a one-second server stall">
  <text x="12" y="22" font-size="12" font-weight="600" fill="#23362e" font-family="Fira Code, monospace">target load: 10 req/s (one every 100 ms)</text>
  <line x1="20" y1="70" x2="540" y2="70" stroke="#5f6f66" stroke-width="1.5"/>
  <text x="20" y="90" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">0.0 s</text>
  <text x="270" y="90" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">1.0 s</text>
  <text x="505" y="90" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">2.0 s</text>
  <g id="co-marks" fill="#2f6b3f">
    <circle cx="40" cy="70" r="5"/><circle cx="63" cy="70" r="5"/><circle cx="86" cy="70" r="5"/>
    <circle cx="109" cy="70" r="5"/><circle cx="132" cy="70" r="5"/><circle cx="155" cy="70" r="5"/>
    <circle cx="178" cy="70" r="5"/><circle cx="201" cy="70" r="5"/><circle cx="224" cy="70" r="5"/><circle cx="247" cy="70" r="5"/>
  </g>
  <rect id="co-stall" class="hidden" x="270" y="46" width="235" height="48" rx="4" fill="#f9e3df" stroke="#c53b3b"/>
  <text id="co-stall-t" class="hidden" x="387" y="76" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="700">server stalled 1.0 s</text>
  <g id="co-missing" class="hidden" fill="#c53b3b">
    <circle cx="293" cy="70" r="5"/><circle cx="316" cy="70" r="5"/><circle cx="339" cy="70" r="5"/>
    <circle cx="362" cy="70" r="5"/><circle cx="385" cy="70" r="5"/><circle cx="408" cy="70" r="5"/>
    <circle cx="431" cy="70" r="5"/><circle cx="454" cy="70" r="5"/><circle cx="477" cy="70" r="5"/>
  </g>
  <rect x="12" y="112" width="256" height="76" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="140" y="132" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">What the tool reported</text>
  <text id="co-tool1" x="140" y="154" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="co-tool2" x="140" y="174" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <rect x="292" y="112" width="256" height="76" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="420" y="132" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">What users felt</text>
  <text id="co-real1" x="420" y="154" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="co-real2" x="420" y="174" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="co-fix" class="hidden" x="12" y="212" font-size="11.5" fill="#2f6b3f" font-family="Fira Code, monospace">fix: open-loop generator (wrk2, Gatling) or HdrHistogram expected-interval correction</text>
  <text id="co-note" class="hand hidden" x="12" y="240" font-size="15" fill="#c53b3b">the queue your tool never joined is the queue your users were standing in</text>
</svg>
