<svg viewBox="0 0 800 310" role="img" aria-label="Animated fan-out where a page calling ten services inherits a much worse tail than any single service">
  <defs>
    <marker id="ta-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="ta-page" x="20" y="100" width="160" height="104" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="100" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">One page load</text>
  <text x="100" y="146" font-size="11" text-anchor="middle" fill="#5f6f66">needs all ten calls</text>
  <text id="ta-lat" x="100" y="172" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">&mdash;</text>
  <text id="ta-lat2" x="100" y="192" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <line x1="180" y1="152" x2="246" y2="152" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#ta-arr)"/>

  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="ta-c1" x="250" y="24" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="40" fill="#23362e">profile-api        18 ms</text>
    <rect id="ta-c2" x="250" y="50" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="66" fill="#23362e">cart-api           21 ms</text>
    <rect id="ta-c3" x="250" y="76" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="92" fill="#23362e">catalogue-api      17 ms</text>
    <rect id="ta-c4" x="250" y="102" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="118" fill="#23362e">pricing-api        24 ms</text>
    <rect id="ta-c5" x="250" y="128" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="144" fill="#23362e">stock-api          19 ms</text>
    <rect id="ta-c6" x="250" y="154" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="170" fill="#23362e">reviews-api        22 ms</text>
    <rect id="ta-c7" x="250" y="180" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text id="ta-c7-t" x="258" y="196" fill="#23362e">recommend-api      20 ms</text>
    <rect id="ta-c8" x="250" y="206" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="222" fill="#23362e">shipping-api       23 ms</text>
    <rect id="ta-c9" x="250" y="232" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="248" fill="#23362e">loyalty-api        16 ms</text>
    <rect id="ta-c10" x="250" y="258" width="210" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="258" y="274" fill="#23362e">banner-api         18 ms</text>
  </g>
  <text x="355" y="296" font-size="11" text-anchor="middle" fill="#5f6f66">every service: p50 = 20 ms, p99 = 500 ms</text>

  <rect x="486" y="40" width="296" height="226" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="634" y="64" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">The arithmetic</text>
  <g font-size="12" font-family="Fira Code, monospace" fill="#23362e">
    <text id="ta-p1" class="hidden" x="500" y="94">P(one call is fast)      = 0.99</text>
    <text id="ta-p2" class="hidden" x="500" y="122">P(all 10 are fast)       = 0.99^10</text>
    <text id="ta-p3" class="hidden" x="500" y="146">                         = 0.904</text>
    <text id="ta-p4" class="hidden" x="500" y="176">P(page hits the tail)    = 9.6%</text>
    <text id="ta-p5" class="hidden" x="500" y="208" fill="#c53b3b" font-weight="700">service p99  =  page p90</text>
    <text id="ta-p6" class="hidden" x="500" y="240" fill="#c53b3b">100 calls &rarr; 63% of pages hit it</text>
  </g>
  <text id="ta-note" class="hand hidden" x="486" y="292" font-size="15" fill="#c53b3b">measure where the user waits</text>
</svg>
