<svg viewBox="0 0 800 330" role="img" aria-label="A long-tailed latency histogram with p50, p90, p99 and the mean marked, showing the mean sitting far above the median">
  <text x="400" y="22" font-size="13" text-anchor="middle" fill="#5f6f66">One million requests, bucketed by latency. This shape &mdash; not a bell curve &mdash; is what latency looks like.</text>

  <line x1="60" y1="240" x2="770" y2="240" stroke="#5f6f66" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="240" stroke="#5f6f66" stroke-width="1.5"/>
  <text x="34" y="150" font-size="11" fill="#5f6f66" transform="rotate(-90 34 150)" text-anchor="middle">requests</text>

  <g fill="#e3eedc" stroke="#2f6b3f">
    <rect x="64" y="196" width="26" height="44"/>
    <rect x="92" y="140" width="26" height="100"/>
    <rect x="120" y="82" width="26" height="158"/>
    <rect x="148" y="70" width="26" height="170"/>
    <rect x="176" y="96" width="26" height="144"/>
    <rect x="204" y="130" width="26" height="110"/>
    <rect x="232" y="162" width="26" height="78"/>
    <rect x="260" y="186" width="26" height="54"/>
    <rect x="288" y="202" width="26" height="38"/>
    <rect x="316" y="212" width="26" height="28"/>
    <rect x="344" y="218" width="26" height="22"/>
    <rect x="372" y="223" width="26" height="17"/>
    <rect x="400" y="226" width="26" height="14"/>
    <rect x="428" y="228" width="26" height="12"/>
    <rect x="456" y="230" width="26" height="10"/>
    <rect x="484" y="231" width="26" height="9"/>
    <rect x="512" y="232" width="26" height="8"/>
    <rect x="540" y="233" width="26" height="7"/>
    <rect x="568" y="234" width="26" height="6"/>
    <rect x="596" y="234" width="26" height="6"/>
    <rect x="624" y="235" width="26" height="5"/>
    <rect x="652" y="235" width="26" height="5"/>
    <rect x="680" y="236" width="26" height="4"/>
    <rect x="708" y="236" width="26" height="4"/>
    <rect x="736" y="237" width="26" height="3"/>
  </g>

  <line x1="174" y1="56" x2="174" y2="248" stroke="#2f6b3f" stroke-width="2"/>
  <text x="174" y="48" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">p50</text>
  <text x="174" y="264" font-size="11" text-anchor="middle" fill="#2f6b3f" font-family="Fira Code, monospace">46 ms</text>

  <line x1="370" y1="56" x2="370" y2="248" stroke="#8a6a0c" stroke-width="2"/>
  <text x="370" y="48" font-size="12" text-anchor="middle" fill="#8a6a0c" font-weight="700">p90</text>
  <text x="370" y="264" font-size="11" text-anchor="middle" fill="#8a6a0c" font-family="Fira Code, monospace">180 ms</text>

  <line x1="596" y1="56" x2="596" y2="248" stroke="#c53b3b" stroke-width="2"/>
  <text x="596" y="48" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="700">p99</text>
  <text x="596" y="264" font-size="11" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">1,400 ms</text>

  <line x1="738" y1="56" x2="738" y2="248" stroke="#c53b3b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="738" y="48" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="700">p99.9</text>
  <text x="738" y="264" font-size="11" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">6,200 ms</text>

  <line x1="262" y1="70" x2="262" y2="248" stroke="#5f6f66" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="262" y="62" font-size="12" text-anchor="middle" fill="#5f6f66" font-weight="700">mean</text>
  <text x="262" y="264" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">94 ms</text>

  <text x="415" y="286" font-size="12" text-anchor="middle" fill="#23362e">The mean is dragged right by the tail: it is slower than roughly 72% of requests and far faster than the worst 1%.</text>
  <text class="hand" x="430" y="312" font-size="16" fill="#c53b3b">the tail is thin, but it is where your users are angry</text>
</svg>
