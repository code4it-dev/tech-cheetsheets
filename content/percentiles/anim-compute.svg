      <rect x="324" y="116" width="35" height="30" rx="4"/>
      <rect id="pc-b50" x="362" y="116" width="35" height="30" rx="4"/>
      <rect x="400" y="116" width="35" height="30" rx="4"/><rect x="438" y="116" width="35" height="30" rx="4"/>
      <rect x="476" y="116" width="35" height="30" rx="4"/><rect x="514" y="116" width="35" height="30" rx="4"/>
      <rect x="552" y="116" width="35" height="30" rx="4"/><rect x="590" y="116" width="35" height="30" rx="4"/>
