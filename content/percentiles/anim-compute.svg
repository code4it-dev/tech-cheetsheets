<svg viewBox="0 0 800 320" role="img" aria-label="Animated computation of percentiles from twenty latency samples, sorted and indexed">
  <text x="20" y="28" font-size="12.5" font-weight="600" fill="#23362e">Twenty requests to <tspan font-family="Fira Code, monospace">GET /orders/{id}</tspan>, in arrival order (ms)</text>
