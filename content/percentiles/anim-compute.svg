      <text x="37" y="136">38</text><text x="75" y="136">39</text><text x="113" y="136">40</text><text x="151" y="136">41</text>
      <text x="189" y="136">42</text><text x="227" y="136">43</text><text x="265" y="136">44</text><text x="303" y="136">44</text>
      <text x="341" y="136">45</text><text x="379" y="136">46</text><text x="417" y="136">47</text><text x="455" y="136">48</text>
      <text x="493" y="136">49</text><text x="531" y="136">51</text><text x="569" y="136">52</text><text x="607" y="136">55</text>
      <text x="645" y="136">62</text><text x="683" y="136">120</text><text x="721" y="136">310</text>
      <text x="759" y="136" fill="#c53b3b" font-weight="700">2100</text>
