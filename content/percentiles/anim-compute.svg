      <text x="683" y="60">48</text><text x="721" y="60">310</text><text x="759" y="60">44</text>
    </g>
  </g>

  <g id="pc-sorted" class="hidden" font-size="10.5" font-family="Fira Code, monospace" text-anchor="middle">
    <text x="20" y="104" font-size="12.5" font-weight="600" fill="#23362e" text-anchor="start">Sorted &mdash; a percentile is a position in this list</text>
    <g fill="#fbfcf8" stroke="#a9b5a6">
      <rect x="20" y="116" width="35" height="30" rx="4"/><rect x="58" y="116" width="35" height="30" rx="4"/>
      <rect x="96" y="116" width="35" height="30" rx="4"/><rect x="134" y="116" width="35" height="30" rx="4"/>
      <rect x="172" y="116" width="35" height="30" rx="4"/><rect x="210" y="116" width="35" height="30" rx="4"/>
