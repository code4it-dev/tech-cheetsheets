      <rect x="590" y="40" width="35" height="30" rx="4"/><rect x="628" y="40" width="35" height="30" rx="4"/>
      <rect x="666" y="40" width="35" height="30" rx="4"/><rect x="704" y="40" width="35" height="30" rx="4"/>
      <rect x="742" y="40" width="35" height="30" rx="4"/>
    </g>
    <g fill="#23362e">
      <text x="37" y="60">42</text><text x="75" y="60">51</text><text x="113" y="60">38</text><text x="151" y="60">47</text>
      <text x="189" y="60" fill="#c53b3b" font-weight="700">2100</text>
      <text x="227" y="60">45</text><text x="265" y="60">39</text><text x="303" y="60">55</text><text x="341" y="60">44</text>
      <text x="379" y="60">120</text><text x="417" y="60">41</text><text x="455" y="60">49</text><text x="493" y="60">43</text>
