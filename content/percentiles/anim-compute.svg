    <g font-size="9.5" fill="#5f6f66">
      <text x="37" y="158">1</text><text x="379" y="158">10</text><text x="683" y="158">18</text><text x="721" y="158">19</text><text x="759" y="158">20</text>
    </g>
  </g>

  <g id="pc-m50" class="hidden">
    <path d="M379 182 L373 192 L385 192 Z" fill="#2f6b3f"/>
    <text x="379" y="208" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">p50 = 46 ms</text>
  </g>
  <g id="pc-m90" class="hidden">
    <path d="M683 182 L677 192 L689 192 Z" fill="#8a6a0c"/>
    <text x="672" y="208" font-size="12" text-anchor="middle" fill="#8a6a0c" font-weight="700">p90 = 120</text>
  </g>
  <g id="pc-m99" class="hidden">
    <path d="M759 182 L753 192 L765 192 Z" fill="#c53b3b"/>
    <text x="748" y="226" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="700">p99 = 2100</text>
  </g>
  <g id="pc-mmean" class="hidden">
    <path d="M702 182 L696 192 L708 192 Z" fill="#5f6f66"/>
    <text x="648" y="244" font-size="12" text-anchor="middle" fill="#5f6f66" font-weight="700">mean = 166 ms</text>
  </g>

  <rect x="20" y="252" width="500" height="58" rx="6" fill="#fbfcf8" stroke="#d5dccf"/>
  <text id="pc-stat1" x="34" y="274" font-size="12.5" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="pc-stat2" x="34" y="296" font-size="12.5" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="pc-note" class="hand hidden" x="532" y="282" font-size="15" fill="#c53b3b">17 of 20 beat the "average"</text>
</svg>
