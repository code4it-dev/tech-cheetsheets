title: OAuth 2.0
slug: oauth2
tagline: A way to let an app act on your behalf without ever showing it your password.
asof: Nov 2026 · RFC 6749 (2012), PKCE RFC 7636, Security BCP RFC 9700 · OAuth 2.1 is still an IETF draft (rev 16)
description: "OAuth 2.0 cheatsheet: the four roles, the authorization code flow with PKCE, what PKCE actually defends against, refresh token rotation, and the flows you should never use."
aliases:
  - OAuth
  - OAuth 2.0
  - OAuth2
