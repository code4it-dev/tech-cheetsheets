overview:
  - "OAuth 2.0 solves one problem: a third-party application needs to use an API <em>as you</em>, and handing it your password is unacceptable. Instead the app redirects you to the service you already trust, you authenticate and consent there, and the app receives a narrowly scoped, short-lived **access token**. It never sees your credentials, the token can be limited to \"read my calendar\", and it can be revoked without changing your password."
  - "The framework defines four roles — **resource owner** (you), **client** (the app), **authorization server** (issues tokens) and **resource server** (the API) — and several flows for getting a token. In 2026 the honest summary is that there are only two you should normally use: **authorization code with PKCE** for anything acting on behalf of a user, and **client credentials** for machine-to-machine. The implicit and password grants are removed in the OAuth 2.1 draft and should be treated as deleted."
  - "The most common misunderstanding is worth stating plainly: **OAuth 2.0 is authorization, not authentication**. An access token says \"the bearer may read this calendar\" — it does not reliably say who the user is, and using one as proof of identity is a well-known vulnerability class. The layer that does identity is OpenID Connect, which is built on top of this."
architecture:
  svg: oauth2/architecture.svg
  alt: The four OAuth roles and the order in which the browser, client, authorization server and resource server exchange a code and a token
  caption: Four roles and five arrows. Everything else in OAuth is a variation on who may ask for a token and how they prove they are allowed to.
howItWorks:
  - md: The first animation is the only user-facing flow you should be writing in 2026. The second is the attack that made PKCE mandatory.
  - note: if a flow puts a token in a URL or a password in your app, it is the wrong flow
  - anim:
      id: anim-flow
      title: 1 · Authorization code with PKCE, end to end
      svg: oauth2/anim-flow.svg
      alt: A client generating a PKCE verifier, redirecting the user to authenticate, exchanging the code for tokens and calling the API
      steps:
        - say: "A scheduling app wants to read your calendar. The requirement that shapes everything: it must never see your password, and its access must be revocable on its own."
          hl: [ of-app ]
        - say: First the client generates a random `code_verifier` and hashes it into a `code_challenge`. The verifier stays in the client and is never transmitted at this stage.
          unhl: [ of-app ]
          text:
            of-appt: generated PKCE pair
            of-ver: "code_verifier:  dBjftJeZ4CVP-mB92K27…"
            of-chal: "code_challenge: E9Melhoa2OwvFrEMTJgu… (SHA-256)"
            of-v: the verifier is a secret the client keeps; the challenge is safe to publish
        - say: The client redirects the browser to the authorization server, carrying client id, redirect URI, scope, `state` and the challenge. No token and no secret travel in this URL.
          show: [ of-msg ]
          hl: [ of-user ]
          text:
            of-msgt: GET /authorize?…challenge
            of-usert: being redirected
        - say: "Now the part that makes OAuth work: you authenticate <em>at the authorization server</em> and approve the requested scopes. The app is not in this conversation and never sees what you type."
          hl: [ of-as ]
          unhl: [ of-user ]
          move:
            of-msg: [ 380, 0 ]
          text:
            of-ast: you log in here, and only here
            of-usert: entering password
            of-v: the password exists only between you and the authorization server
        - say: On approval the server redirects back with a short-lived authorization code — single use, about a minute, and visible in the URL, the history and any log that records it.
          unhl: [ of-as ]
          move:
            of-msg: [ 190, 0 ]
          text:
            of-msgt: ?code=SplxlOBe…&state=af0if
            of-code: "code:   SplxlOBeZQQYbYS6WxSbIA"
            of-appt: received the code
            of-ast: code issued, 60 s to use it
            of-v: the code is deliberately useless on its own — that is the point of two steps
        - say: The client checks that `state` matches what it sent, which is what stops an attacker feeding it someone else’s code.
          hl: [ of-app ]
          text:
            of-appt: state matches ✓
        - say: Then it POSTs the code to the token endpoint on a back channel — server to server, no browser — together with the original verifier.
          hl: [ of-as ]
          unhl: [ of-app ]
          move:
            of-msg: [ 380, 0 ]
          text:
            of-msgt: POST /token  code + verifier
            of-ast: hashing the verifier…
        - say: The server hashes the verifier and compares it with the challenge from the first request. They match, so this is the same client that started the flow.
          text:
            of-ast: SHA-256(verifier) == challenge ✓
            of-v: "PKCE proves continuity: same client, start to finish"
        - say: It returns a short-lived access token and, because `offline_access` was requested, a refresh token. These travel only on the back channel.
          hl: [ of-app ]
          unhl: [ of-as ]
          text:
            of-tok: "tokens: access (5 min) + refresh"
            of-appt: holds tokens, server-side
            of-msgt: 200 OK  access + refresh token
        - say: "Finally the app calls the API with `Authorization: Bearer`. The API validates the signature, issuer, audience, expiry and scope locally — it never calls the authorization server."
          hl: [ of-api ]
          unhl: [ of-app ]
          move:
            of-msg: [ 590, 0 ]
          text:
            of-msgt: GET /events  Bearer eyJhbG…
            of-apit: signature, iss, aud, exp, scope ✓
            of-v: scoped to calendar.read, expires in 5 minutes, revocable without a password change
  - anim:
      id: anim-pkce
      title: 2 · The stolen code, and why PKCE makes it worthless
      svg: oauth2/anim-pkce.svg
      alt: A malicious app intercepting an authorization code on a shared custom scheme, succeeding without PKCE and failing with it
      steps:
        - say: On mobile, a custom scheme like `myapp://callback` is not owned by anyone. A second app can register the same scheme, and the OS may hand the redirect to it.
          hl: [ op-good, op-bad ]
        - say: Run it first with PKCE off. The real app starts the flow and the user logs in normally — nothing is wrong yet.
          hl: [ op-good ]
          unhl: [ op-good, op-bad ]
          text:
            op-goodt: started the flow
            op-goodt2: no verifier — PKCE is off
        - say: The authorization server redirects back with the code. But the malicious app receives it, because it claimed the same scheme.
          show: [ op-code ]
          hl: [ op-bad ]
          unhl: [ op-good ]
          text:
            op-badt2: intercepted the code
            op-v: interception is the easy part, and PKCE never prevents it
          fill:
            op-badt2: "#c53b3b"
        - say: It POSTs the code to the token endpoint. This is a public client, so there is no secret to present — and therefore nothing that distinguishes the attacker from the real app.
          show: [ op-a2 ]
          text:
            op-ast2: code valid, client_id valid
            op-p2: no secret, no verifier → nothing to check
        - say: Tokens are issued to the attacker. The user is now logged into someone else’s session, and nothing in the protocol noticed.
          unhl: [ op-bad ]
          text:
            op-ast2: tokens issued ✗
            op-badt2: holds access + refresh tokens
            op-v: authorization code interception — the attack PKCE was designed for
          fill:
            op-ast2: "#c53b3b"
            op-v: "#c53b3b"
            op-verd: "#f9e3df"
        - say: Now turn PKCE on and run it again. The real app generates a verifier and sends only its SHA-256 hash when starting the flow.
          hide: [ op-a2, op-code ]
          hl: [ op-good ]
          text:
            op-phase: same attack, PKCE on
            op-goodt: started the flow
            op-goodt2: kept verifier, sent challenge
            op-p1: "PKCE: S256"
            op-p2: ""
            op-ast2: ""
            op-badt2: ""
            op-v: the challenge is public; the verifier never left the client
          fill:
            op-badt2: "#5f6f66"
            op-ast2: "#5f6f66"
            op-v: "#23362e"
            op-verd: "#e8ece2"
        - say: The attacker intercepts the code exactly as before. Nothing about that has changed.
          show: [ op-code ]
          hl: [ op-bad ]
          unhl: [ op-good ]
          text:
            op-badt2: intercepted the code again
          fill:
            op-badt2: "#c53b3b"
        - say: But redeeming it now requires the verifier. The attacker has at most the challenge from the URL, and cannot reverse SHA-256 to get the verifier.
          show: [ op-a2 ]
          text:
            op-ast2: verifier missing / wrong
            op-p2: SHA-256(what they sent) ≠ challenge
        - say: The token request is rejected. The stolen code is worthless, and the real client — which does hold the verifier — completes the flow normally.
          show: [ op-a1 ]
          hl: [ op-good ]
          unhl: [ op-bad ]
          text:
            op-ast2: rejected ✓ — real client succeeds
            op-badt2: holds a useless code
            op-v: PKCE does not stop theft; it makes the stolen thing worthless
          fill:
            op-ast2: "#2f6b3f"
            op-badt2: "#5f6f66"
            op-v: "#2f6b3f"
            op-verd: "#e3eedc"
        - say: This is why PKCE moved from "mobile apps should" to "every client must" — it also blocks authorization code injection against confidential clients, where the secret alone does not help.
          unhl: [ op-good ]
          text:
            op-phase: required for every client in the OAuth 2.1 draft
            op-p3: two lines of code, and an entire attack class removed
concepts:
  - term: Resource owner
    short: The person who owns the data and grants consent — usually the end user, sitting in front of a browser.
    see: [ Client, Authorization server, Consent ]
    detail: |-
      The resource owner's defining property is that they authenticate <em>at the authorization server</em>, never at the client. That single arrangement is what lets you revoke an app's access without changing your password, and what stops a compromised app leaking credentials that work everywhere.

      In a client credentials flow there is no resource owner at all: the client is acting as itself, not on anyone's behalf, which is why no consent screen appears.

      #### How it relates

      - If your "OAuth integration" collects a username and password in your own form, there is no resource owner in the protocol sense — you have built a password proxy.
  - term: Client
    short: The application requesting access. Public if it cannot keep a secret, confidential if it can.
    see: [ PKCE, Client credentials, Redirect URI ]
    detail: |-
      The distinction decides everything about which protections apply. A single-page app, a mobile app and a desktop app are all **public**: their code ships to the user, so any embedded secret is readable. A server-side web app or a backend service is **confidential**: it can hold a client secret or, better, a private key or managed identity.

      Public clients cannot authenticate themselves at the token endpoint, which is exactly the gap PKCE fills.

      #### Classification

      | Client | Type | Proves itself with |
      | --- | --- | --- |
      | Server-rendered web app | confidential | secret / private key |
      | Backend service | confidential | secret / managed identity |
      | SPA in a browser | public | PKCE only |
      | Mobile / desktop app | public | PKCE only |

      #### How it relates

      - A BFF turns a public SPA into a confidential client by keeping tokens server-side.
  - term: Authorization server
    short: The component that authenticates the user, collects consent and issues tokens. The only place credentials are ever entered.
    see: [ Resource server, Access token, Token introspection ]
    detail: |-
      Entra ID, Auth0, Okta, Keycloak, Duende IdentityServer. It owns the authorization endpoint (browser-facing, where the user logs in), the token endpoint (back-channel, where codes become tokens) and usually a JWKS endpoint publishing the keys that sign tokens.

      Almost nobody should write one. The surface area — flows, token formats, key rotation, consent, revocation, session management — is large and the failure modes are security incidents.

      #### Its endpoints

      | Endpoint | Used by |
      | --- | --- |
      | `/authorize` | the browser, front channel |
      | `/token` | the client, back channel |
      | `/jwks` | APIs, to validate signatures |
      | `/introspect`, `/revoke` | APIs and clients |
      | `/.well-known/…` | discovery of all of the above |

      #### How it relates

      - An API gateway often validates tokens on the resource server's behalf.
  - term: Resource server
    short: The API holding the data. It validates the token and enforces scope — and should never call the authorization server per request.
    see: [ Access token, Audience, Scope ]
    detail: |-
      Validation of a JWT access token is local: check the signature against the cached JWKS, then the issuer, the audience, the expiry and the scopes. No network call, no shared session store, which is what makes bearer tokens scale.

      The two checks most often skipped are **audience** and **scope**. A token minted for a different API, or one with no relevant scope, must be rejected even though its signature is perfectly valid.

      #### Validation checklist

      | Check | Why |
      | --- | --- |
      | Signature against JWKS | it came from the right issuer |
      | `iss` | the issuer you expect |
      | `aud` | it was minted for <em>this</em> API |
      | `exp` / `nbf` | it is current |
      | `scope` / `roles` | it may do this operation |

      #### How it relates

      - The JWT page covers the validation traps in detail, including the `alg` confusion attack.
  - term: Authorization code flow
    short: The redirect-based flow where the browser carries a short-lived code and the client swaps it for tokens on a back channel.
    see: [ PKCE, Access token, Redirect URI ]
    detail: |-
      The two-step design exists so that tokens never travel through the browser. The front channel — URLs, redirects, history, referrers, logs — carries only a code that is single-use, expires in about a minute and is useless without the matching verifier or client secret.

      With PKCE it is now the correct flow for every kind of client, including SPAs and mobile apps that used to be told to use implicit.

      #### Front channel vs back channel

      | Channel | Carries | Visible to |
      | --- | --- | --- |
      | Front (browser redirects) | code, state | URL bar, history, logs |
      | Back (server to server) | tokens, verifier, secret | only the two endpoints |

      #### How it relates

      - The first animation walks this flow step by step.
  - term: PKCE
    short: "Proof Key for Code Exchange: the client proves at the token endpoint that it is the same client that started the flow."
    see: [ Authorization code flow, Client, Redirect URI ]
    detail: |-
      The client generates a high-entropy random `code_verifier`, sends only its SHA-256 hash (`code_challenge`) when starting the flow, and presents the verifier when redeeming the code. An attacker who intercepts the code cannot redeem it, because they never saw the verifier and cannot reverse the hash.

      Originally designed for mobile apps and custom URL schemes, it is now recommended for every client in the security BCP and required in the OAuth 2.1 draft — it also defends confidential clients against authorization code injection.

      #### Parameters

      | Parameter | Value |
      | --- | --- |
      | `code_verifier` | 43–128 chars, cryptographically random |
      | `code_challenge` | BASE64URL(SHA256(verifier)) |
      | `code_challenge_method` | `S256` — never `plain` |

      #### How it relates

      - The second animation is the attack PKCE was invented to stop.
  - term: Access token
    short: The credential the client presents to the API. Short-lived, scoped, and treated as a password by anyone who holds it.
    see: [ Refresh token, Scope, Audience, Bearer token ]
    detail: |-
      Usually a JWT, sometimes an opaque string the API has to introspect. Either way it is a **bearer** credential: possession is sufficient, so leaking one is equivalent to leaking a password for its lifetime and scope.

      That is why lifetimes are measured in minutes rather than days. The two defences are brevity and narrow scope, with sender-constraining as the stronger option where supported.

      #### Typical lifetimes

      | Token | Lifetime |
      | --- | --- |
      | Access token | 5–60 min |
      | Refresh token (rotating) | days to months |
      | Authorization code | ≤ 1 min, single use |
      | ID token (OIDC) | minutes — for login, not API calls |

      #### How it relates

      - Never send an ID token to an API, and never send an access token to your own frontend to parse for identity.
  - term: Refresh token
    short: A long-lived credential used to obtain new access tokens without involving the user again.
    see: [ Refresh token rotation, Access token, Client ]
    detail: |-
      It exists so access tokens can be short. The client keeps the refresh token, and when the access token expires it quietly exchanges the refresh token for a new one at the token endpoint — no redirect, no login prompt.

      Because it is long-lived it is the most valuable thing in the system. Public clients must rotate them; confidential clients should still bind them to the client and revoke on logout.

      #### Storage

      | Client | Store it in |
      | --- | --- |
      | Server-side web app | server session / encrypted store |
      | SPA | nowhere — use a BFF |
      | Mobile | Keychain / Keystore |
      | Anywhere | never `localStorage` |

      #### How it relates

      - Rotation plus reuse detection is what turns a stolen refresh token into a detectable incident.
  - term: Refresh token rotation
    short: Issuing a new refresh token on every use and invalidating the old one, so a replayed token exposes the theft.
    see: [ Refresh token, Access token, Client ]
    anim:
      key: rot
      title: Rotation and reuse detection
      svg: oauth2/rot.svg
      alt: A refresh token rotating on use, and a stolen old token triggering revocation of the whole family
      steps:
        - say: The client holds refresh token RT1. Unknown to anyone, an attacker has stolen a copy of it — from a log, a backup, a compromised device.
          hl: [ rt-cli, rt-att ]
        - say: The real client’s access token expires, so it presents RT1 for a new one. The server issues a fresh access token <em>and a new refresh token</em>, RT2, and marks RT1 as used.
          hl: [ rt-cli ]
          unhl: [ rt-cli, rt-att ]
          text:
            rt-clit: now holds RT2
            rt-ast: "family: RT1 used, RT2 active"
            rt-msg: "rotation: one use, one new token, old one dead"
        - say: Later the attacker tries RT1. Without rotation this would simply work, indefinitely and silently.
          hl: [ rt-att ]
          unhl: [ rt-cli ]
          text:
            rt-attt: presents RT1
            rt-msg: with no rotation, this is undetectable persistent access
        - say: "But RT1 is already marked used. A used token from an active family can only mean one thing: two parties hold tokens from the same chain."
          hl: [ rt-as ]
          unhl: [ rt-att ]
          text:
            rt-ast: reuse detected — RT1 already spent
            rt-msg: replay is the signal; the server cannot tell who is the thief
          fill:
            rt-ast: "#c53b3b"
        - say: So it revokes the whole family. Both parties are logged out and the user re-authenticates — turning a silent, permanent compromise into a visible, bounded one.
          unhl: [ rt-as ]
          text:
            rt-ast: family revoked — both logged out
            rt-clit: logged out
            rt-attt: access ended
            rt-msg: you cannot prevent the theft; you can refuse to let it be quiet
          fill:
            rt-ast: "#2f6b3f"
    detail: |-
      Without rotation, a stolen refresh token gives an attacker indefinite, silent access. With rotation, the old token is dead the moment it is used once — so if it is ever presented again, either the attacker or the legitimate client is replaying, and the server can revoke the entire token family.

      The consequence is that theft stops being silent. The user gets logged out and has to re-authenticate, which is a visible event rather than an invisible compromise.

      ::anim rot::

      #### How it relates

      - Mandatory for public clients in the OAuth 2.1 draft, unless the token is sender-constrained instead.
  - term: Scope
    short: The permissions a token carries, requested by the client and approved by the user.
    see: [ Consent, Access token, Audience ]
    detail: |-
      `calendar.read`, `invoices:write`. Scopes are coarse-grained delegation, not an authorization model: they say what the <em>app</em> may attempt, while whether <em>this user</em> may read <em>that</em> invoice remains the API's job.

      Ask for the least you need and ask late. An app that requests every scope at install time gets refused by cautious users and becomes a bigger prize when compromised.

      #### Scopes are not permissions

      | Question | Answered by |
      | --- | --- |
      | May this app try to read invoices? | scope |
      | May this user read invoice 42? | your authorization logic |
      | Which tenant is this? | a claim, not a scope |

      #### How it relates

      - Treating scopes as roles is how systems end up with a token that can do everything.
  - term: Redirect URI
    short: Where the authorization server sends the browser back. Registered in advance and matched exactly.
    see: [ PKCE, state parameter, Authorization code flow ]
    detail: |-
      This is the single most security-critical piece of client configuration. If an attacker can get the server to redirect to a URI they control, the authorization code goes to them. Wildcards, open redirects on the registered host and "just match the prefix" are all ways to lose the code.

      The current guidance is exact string matching — no wildcards, no partial paths — which the OAuth 2.1 draft makes a requirement.

      #### Rules

      | Rule | Why |
      | --- | --- |
      | Exact match, no wildcards | any flexibility is an attack surface |
      | HTTPS, except `localhost` | codes must not cross plaintext |
      | No open redirects on that host | they forward the code onward |
      | Mobile: claimed https links | custom schemes can be hijacked |

      #### How it relates

      - The second animation is exactly what a hijackable redirect target costs you.
  - term: state parameter
    short: An opaque, unguessable value the client sends and checks on return — the CSRF defence for the flow itself.
    see: [ Redirect URI, Authorization code flow, PKCE ]
    detail: |-
      Without it, an attacker can start their own authorization flow, capture the resulting code, and feed it to your redirect endpoint in a victim's browser — silently linking the victim's session to the attacker's account. Generating `state`, storing it in the session and rejecting any callback whose state does not match prevents that.

      `state` and PKCE solve different problems and you need both: PKCE protects the code, state protects the session.

      #### Two different jobs

      | Parameter | Defends against |
      | --- | --- |
      | `state` | CSRF / session fixation on the callback |
      | PKCE | stolen or injected authorization codes |
      | `nonce` (OIDC) | replayed ID tokens |

      #### How it relates

      - It is also the natural place to carry a return URL — signed or keyed, never as a raw redirect target.
  - term: Client credentials
    short: "The machine-to-machine flow: the client authenticates as itself and gets a token, with no user involved."
    see: [ Client, Access token, Scope ]
    detail: |-
      A background job calling an internal API, a service talking to a partner. There is no resource owner, no redirect and no consent — just the client proving its identity at the token endpoint and receiving a token representing itself.

      Prefer a certificate or a platform-managed identity over a shared secret. A secret in an environment variable is the thing that ends up in a repository.

      #### Authenticating the client

      | Method | Strength |
      | --- | --- |
      | Managed / workload identity | best — no secret exists |
      | Private key JWT, mTLS | strong |
      | Client secret | weakest; rotate it |

      #### How it relates

      - Tokens from this flow have no user, so an API must not look for a user id in them.
  - term: Device authorization flow
    short: "For input-constrained devices: the device shows a code, you approve it on your phone."
    see: [ Authorization code flow, Client, Access token ]
    detail: |-
      A TV, a CLI, a printer. The device asks the authorization server for a user code, displays it with a short URL, and polls the token endpoint while you complete the login on a device that actually has a keyboard.

      It is also the right flow for command-line tools, and much better than asking for a password or pasting a long-lived personal access token.

      #### How it relates

      - Rate-limit the polling: the spec defines `slow_down` and clients must honour it.
  - term: Token introspection & revocation
    short: Endpoints for asking whether an opaque token is still valid, and for actively killing one.
    see: [ Access token, Refresh token, Resource server ]
    detail: |-
      Introspection (RFC 7662) trades scale for immediacy: the API asks the authorization server about every token, so revocation is instant but every request now depends on that server. JWTs invert the trade — validation is local and fast, and revocation takes until expiry.

      The usual compromise is short-lived JWT access tokens plus revocable refresh tokens, so the worst-case window of a compromised session is the access token lifetime.

      #### Trade-off

      |  | JWT, local validation | Opaque + introspection |
      | --- | --- | --- |
      | Latency | none | a call per request |
      | Revocation | at expiry | immediate |
      | Coupling | JWKS only | hard dependency |

      #### How it relates

      - Caching introspection results reintroduces the revocation delay you were trying to avoid.
  - term: Audience
    short: Which API a token was minted for — and the check that stops one service replaying your token at another.
    see: [ Access token, Resource server, Scope ]
    detail: |-
      If service A accepts a token and forwards it to service B, and B does not check `aud`, then A can act as the user anywhere B is reachable. Validating the audience turns a token into a credential for one API rather than for your whole estate.

      When a service genuinely needs to call another on the user's behalf, exchange the token (RFC 8693) for one with the right audience rather than passing yours along.

      #### How it relates

      - "We pass the token through" is the most common way an internal API becomes a confused deputy.
  - term: Sender-constrained tokens
    short: Binding a token to the client that obtained it, so a stolen copy is useless — DPoP or mTLS.
    see: [ Access token, Bearer token, Refresh token ]
    detail: |-
      A bearer token is a password: whoever holds it wins. Sender-constraining attaches a proof-of-possession, so the API also requires a signature from a key only the legitimate client holds. DPoP (RFC 9449) does this at the application layer with a per-request proof JWT; mTLS does it at the transport layer with a client certificate.

      It is the strongest available defence against token theft, and the OAuth 2.1 draft treats it as the alternative to refresh token rotation for public clients.

      #### Options

      | Mechanism | Where | Cost |
      | --- | --- | --- |
      | DPoP | app layer, per request | client key handling |
      | mTLS | transport | certificate logistics |
      | Bearer | — | theft = full access |

      #### How it relates

      - Support is uneven; check your authorization server before designing around it.
commands:
  heading: Essential requests & code
  tocLabel: Requests & code
  groups:
    - group: The two requests that matter
      items:
        - lang: bash
          code: |-
            GET /authorize
              ?response_type=code
              &client_id=s6BhdRkqt3
              &redirect_uri=https%3A%2F%2Fapp.example%2Fcallback   # exact match, registered
              &scope=calendar.read%20offline_access
              &state=af0ifjsldkj                                   # CSRF defence, checked on return
              &code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
              &code_challenge_method=S256                          # never "plain"
          what: The front-channel redirect. Everything here is visible in the URL bar, history and logs — which is why it carries no secret and no token.
        - code: |-
            POST /token
            Content-Type: application/x-www-form-urlencoded

            grant_type=authorization_code
            &code=SplxlOBeZQQYbYS6WxSbIA
            &redirect_uri=https%3A%2F%2Fapp.example%2Fcallback
            &client_id=s6BhdRkqt3
            &code_verifier=dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk   # the proof

            # -> { "access_token": "...", "expires_in": 300, "refresh_token": "...",
            #      "token_type": "Bearer", "scope": "calendar.read" }
          what: The back-channel exchange. A confidential client also authenticates here, with a secret, a private-key JWT or mTLS.
    - group: PKCE, in C#
      items:
        - lang: csharp
          code: |-
            static (string Verifier, string Challenge) Pkce()
            {
                var bytes = RandomNumberGenerator.GetBytes(32);          // 43 chars once encoded
                var verifier = Base64UrlEncode(bytes);
                var challenge = Base64UrlEncode(SHA256.HashData(Encoding.ASCII.GetBytes(verifier)));
                return (verifier, challenge);
            }

            // Base64URL: standard Base64 with +/ swapped for -_ and the padding removed
            static string Base64UrlEncode(byte[] b) =>
                Convert.ToBase64String(b).TrimEnd('=').Replace('+', '-').Replace('/', '_');
          what: Keep the verifier in the session and send only the challenge. Getting the Base64URL encoding wrong is the most common PKCE bug.
        - lang: python
          code: |-
            import base64, hashlib, secrets

            def pkce() -> tuple[str, str]:
                verifier  = base64.urlsafe_b64encode(secrets.token_bytes(32)).rstrip(b"=").decode()
                digest    = hashlib.sha256(verifier.encode("ascii")).digest()
                challenge = base64.urlsafe_b64encode(digest).rstrip(b"=").decode()
                return verifier, challenge

            # secrets, never random — the verifier must be unguessable
          what: The same in Python. `urlsafe_b64encode` already does the character swap; you only have to strip the padding.
    - group: Being a client
      items:
        - lang: csharp
          code: |-
            // Server-side web app: the framework runs the whole flow for you
            builder.Services
                .AddAuthentication(o =>
                {
                    o.DefaultScheme          = CookieAuthenticationDefaults.AuthenticationScheme;
                    o.DefaultChallengeScheme = OpenIdConnectDefaults.AuthenticationScheme;
                })
                .AddCookie()
                .AddOpenIdConnect(o =>
                {
                    o.Authority    = "https://login.example.com";
                    o.ClientId     = "s6BhdRkqt3";
                    o.ClientSecret = builder.Configuration["Oidc:Secret"];
                    o.ResponseType = "code";          // authorization code, never "token"
                    o.UsePkce      = true;            // on by default; never turn it off
                    o.SaveTokens   = true;            // keep tokens server-side, not in the browser
                    o.Scope.Add("calendar.read");
                    o.Scope.Add("offline_access");    // ask for a refresh token explicitly
                });
          what: Hand-rolling redirects, state and code exchange is how subtle bugs get in. Use the framework's handler and configure it correctly.
        - lang: python
          code: |-
            # Python, with Authlib — same flow, same rules
            oauth = OAuth()
            oauth.register(
                name="example",
                server_metadata_url="https://login.example.com/.well-known/openid-configuration",
                client_id="s6BhdRkqt3",
                client_secret=os.environ["OIDC_SECRET"],
                client_kwargs={"scope": "openid calendar.read offline_access",
                               "code_challenge_method": "S256"},   # PKCE on
            )

            @app.get("/login")
            async def login(request: Request):
                return await oauth.example.authorize_redirect(request, REDIRECT_URI)

            @app.get("/callback")
            async def callback(request: Request):
                token = await oauth.example.authorize_access_token(request)   # verifies state + PKCE
                request.session["tokens"] = token                             # server-side session
          what: Authlib checks `state` and the PKCE verifier for you. Storing tokens in the server session keeps the browser out of it.
    - group: Machine to machine
      items:
        - lang: csharp
          code: |-
            // No user, no redirect — and ideally no secret either
            var credential = new DefaultAzureCredential();             // managed identity
            var token = await credential.GetTokenAsync(
                new TokenRequestContext(["api://orders/.default"]));

            // Or, with any authorization server:
            var form = new FormUrlEncodedContent(new Dictionary<string, string>
            {
                ["grant_type"]    = "client_credentials",
                ["client_id"]     = clientId,
                ["client_secret"] = secret,            // prefer a private-key JWT or mTLS
                ["scope"]         = "orders.read",
            });
            var res = await http.PostAsync("https://login.example.com/token", form);
          what: "A managed or workload identity is strictly better than a secret: there is no credential to leak, rotate or commit."
        - code: |-
            import httpx

            async def service_token() -> str:
                async with httpx.AsyncClient() as http:
                    res = await http.post("https://login.example.com/token", data={
                        "grant_type": "client_credentials",
                        "client_id": CLIENT_ID,
                        "client_secret": os.environ["CLIENT_SECRET"],
                        "scope": "orders.read",
                    })
                    res.raise_for_status()
                    return res.json()["access_token"]

            # cache it until shortly before `expires_in` — do not fetch one per request
          what: "Caching matters: a token request per API call turns the authorization server into your hardest dependency."
    - group: Being an API
      items:
        - lang: csharp
          code: |-
            builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)
                .AddJwtBearer(o =>
                {
                    o.Authority = "https://login.example.com";   // JWKS fetched and cached from here
                    o.TokenValidationParameters = new()
                    {
                        ValidateIssuer           = true,
                        ValidateAudience         = true,
                        ValidAudience            = "api://calendar",   // the check people skip
                        ValidateLifetime         = true,
                        ValidateIssuerSigningKey = true,
                    };
                });

            app.MapGet("/events", GetEvents)
               .RequireAuthorization(p => p.RequireClaim("scope", "calendar.read"));
          what: Validate audience and scope, not just the signature. A valid token minted for another API is still the wrong token.
    - group: Discovery
      items:
        - lang: bash
          code: |-
            curl -s https://login.example.com/.well-known/openid-configuration | jq '{
              authorization_endpoint, token_endpoint, jwks_uri,
              code_challenge_methods_supported, grant_types_supported
            }'
          what: Never hard-code endpoints or keys. Discovery plus a cached JWKS is what lets the provider rotate signing keys without breaking you.
prosCons:
  good:
    heading: Pros
    items:
      - Third-party apps never see the user's password, and access can be revoked independently of it.
      - Scopes let a user grant narrow access instead of all-or-nothing.
      - Short-lived bearer tokens validate locally, so APIs scale without a shared session store.
      - Universally implemented — every identity provider and HTTP client already speaks it.
      - Separates the identity provider from the APIs, so authentication is built once.
      - The same framework covers users, devices and machine-to-machine traffic.
  bad:
    heading: Cons
    items:
      - "A framework rather than a protocol: many options, and several historically bad ones."
      - Bearer tokens are passwords in practice — theft means full access until expiry.
      - Revocation is not immediate with JWTs unless you add introspection or very short lifetimes.
      - Easy to misuse as authentication, which is a documented vulnerability class.
      - Redirect URI and `state` handling are fiddly and security-critical.
      - Token storage in browsers and mobile apps has no genuinely good answer without a backend.
when:
  note: authorization code + PKCE, or client credentials. if you are writing anything else, check why.
  good:
    heading: Use it when…
    items:
      - A third-party or first-party app needs to call an API on a user's behalf.
      - You want revocable, scoped, time-limited access instead of shared credentials.
      - Several apps and APIs should share one identity provider.
      - Services need to authenticate to each other without embedded passwords.
      - You need an audit trail of which app did what, on whose behalf.
  bad:
    heading: Avoid it when…
    items:
      - You only need to know who the user is. Use **OpenID Connect** — OAuth alone is not authentication.
      - It is a single server-rendered app with its own users. Use **a session cookie**; OAuth adds nothing.
      - Two internal services need to trust each other on a private network. Use **mTLS**, which is simpler and stronger.
      - You are tempted by the password grant. Use **authorization code with PKCE**; ROPC is removed from the 2.1 draft.
      - You would have to write the authorization server. Use **an existing provider** — this is not a build-it-yourself component.
useCases:
  - title: "\"Connect your calendar\""
    body: A scheduling tool needs read access to a user's calendar. Authorization code with PKCE gets a token scoped to `calendar.read` only; the user can revoke it from their account page, and the tool never had a password to leak.
  - title: A nightly job calling an internal API
    body: No user is present, so client credentials with a workload identity issues a token scoped to `orders.read`. No secret exists anywhere, and the API enforces the scope without knowing anything about the job.
  - title: A CLI that should not ask for a password
    body: The device authorization flow prints a short code and a URL. The developer approves it in a browser they already trust, and the CLI receives a token with the scopes it asked for — no password prompt, no long-lived personal token pasted into a config file.
  - title: A SPA that should not hold tokens
    body: Rather than storing tokens in the browser where any XSS can read them, the SPA talks to a BFF that runs the code flow, keeps the tokens server-side and gives the browser only an httpOnly session cookie.
  - title: Partner API access
    body: A partner integrates once against your authorization server, receives narrowly scoped tokens per customer, and you can revoke one customer's access without touching anyone else's — something shared API keys cannot express.
gotchas:
  items:
    - mistake: Using an access token as proof of identity
      why: An access token is addressed to an API, not to you. Accepting one as "the user is logged in" lets a token obtained by a different app for a different purpose be replayed at your login endpoint.
      fix: use OpenID Connect and validate the **ID token**, including `aud`, `iss` and `nonce`. Never parse an access token for identity.
    - mistake: Skipping the audience check
      why: Validating only the signature means any token your issuer ever minted — for any API, for any client — is accepted. One service can then replay a token at another and act as the user.
      fix: always validate `aud` against your own identifier, and use token exchange rather than forwarding a token to a downstream service.
    - mistake: Tokens in browser storage
      why: "`localStorage` is readable by any script on the page, so one XSS or one compromised dependency is a full account takeover for the token's lifetime."
      fix: put a BFF in front of the SPA so tokens stay server-side and the browser only gets an httpOnly, SameSite cookie.
    - mistake: Wildcard or loose redirect URIs
      why: Prefix matching, wildcards and open redirects on the registered host all let an attacker have the authorization code delivered to them.
      fix: exact string matching, HTTPS everywhere except `localhost`, and audit the registered host for open redirects.
    - mistake: No `state`, or never checking it
      why: Generating `state` and then not comparing it on the callback is the same as not having it, and leaves the flow open to CSRF and account-linking attacks.
      fix: store it in the session, compare on return, reject on mismatch. PKCE does not cover this — it protects the code, not the session.
    - mistake: Long-lived access tokens
      why: A 24-hour access token means a stolen token is valid for 24 hours, and with JWTs you usually cannot revoke it.
      fix: minutes for access tokens, with a rotating refresh token for continuity. If you need instant revocation, add introspection and accept the dependency.
    - mistake: Treating scopes as an authorization model
      why: "`invoices:read` says the app may attempt to read invoices. It does not say this user may read <em>that</em> invoice, and APIs that stop at the scope check leak data across tenants."
      fix: check the scope at the edge and the actual permission in the domain. Scopes are delegation, not row-level security.
    - mistake: Implicit flow, still
      why: Returning tokens directly in the redirect puts them in the URL, the history and the referrer, with no way to use a refresh token safely. It was removed from the 2.1 draft.
      fix: authorization code with PKCE works in SPAs and mobile apps and is strictly better. If a tutorial says `response_type=token`, it predates 2019.
alternatives:
  columns:
    - Approach
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs OAuth 2.0
  rows:
    - self: true
      cells:
        - "**OAuth 2.0**"
        - delegated access to APIs
        - Medium
        - free; a provider to run or buy
        - —
    - cells:
        - "**OpenID Connect**"
        - knowing who the user is
        - Medium
        - free
        - An identity layer <em>on top of</em> OAuth; adds the ID token. Not an alternative — the other half
    - cells:
        - "**Session cookies**"
        - one app, its own users
        - Low
        - free
        - Server-side session, no tokens, no third parties; simpler and perfectly correct for a monolith
    - cells:
        - "**API keys**"
        - simple server-to-server
        - Very low
        - free
        - "One long-lived shared secret: no user context, no expiry, no scopes, hard to rotate"
    - cells:
        - "**mTLS**"
        - service-to-service on your own network
        - Medium
        - certificate infrastructure
        - Identity at the transport layer; strong, but no user delegation and no scopes
    - cells:
        - "**SAML 2.0**"
        - enterprise SSO to web apps
        - High
        - free
        - XML and browser POSTs, predates APIs; still common in enterprise SSO, poor fit for mobile and APIs
    - cells:
        - "**PATs**"
        - scripts and CI
        - Very low
        - free
        - A long-lived user-scoped token; convenient and routinely leaked in repositories
  notes:
    - "**Pick OpenID Connect** whenever the question is \"who is this?\" — you will almost always want both."
    - "**Pick session cookies** for a single application with its own login; OAuth buys you nothing there."
    - "**Pick mTLS** for internal service-to-service calls where no user is being represented."
    - "**Pick SAML** only when an enterprise customer requires it; new systems should not start there."
    - "**Pick API keys** for low-risk, non-user-scoped access — and set an expiry even though nothing forces you to."
resources:
  - url: https://datatracker.ietf.org/doc/html/rfc6749
    title: RFC 6749 — The OAuth 2.0 Authorization Framework
    why: the core specification, including every flow and its parameters.
  - url: https://datatracker.ietf.org/doc/html/rfc7636
    title: RFC 7636 — PKCE
    why: short, readable, and the thing to send anyone who asks why the verifier exists.
  - url: https://datatracker.ietf.org/doc/html/rfc9700
    title: RFC 9700 — OAuth 2.0 Security Best Current Practice
    why: what current guidance actually is, including the removals.
  - url: https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/
    title: OAuth 2.1 draft
    why: the consolidation of 2.0 plus the BCP. Still a draft — check the revision before quoting it.
  - url: https://oauth.net/2/
    title: oauth.net
    why: maintained map of the specs, extensions and which ones are deprecated.
  - url: https://www.oauth.com/playground/
    title: OAuth 2.0 Playground
    why: run the flows by hand and watch every parameter, which is the fastest way to understand them.
