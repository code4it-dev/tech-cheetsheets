<svg viewBox="0 0 800 330" role="img" aria-label="A ladder from user journey to SLI to SLO to error budget to SLA, each level derived from the one before">
  <defs>
    <marker id="sa-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">each rung is derived from the one above it &mdash; and only the top rung touches a real user</text>

  <rect x="40" y="40" width="300" height="56" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="56" y="62" font-size="13" font-weight="700" fill="#23362e">Critical user journey</text>
  <text x="56" y="82" font-size="11.5" fill="#5f6f66">"add to cart, pay, see the receipt"</text>

  <line x1="190" y1="96" x2="190" y2="120" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>

  <rect x="40" y="124" width="300" height="70" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="56" y="146" font-size="13" font-weight="700" fill="#23362e">SLI &mdash; the measurement</text>
  <text x="56" y="166" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">good events / valid events</text>
  <text x="56" y="184" font-size="11.5" fill="#5f6f66">checkout requests under 300 ms and not 5xx</text>

  <line x1="190" y1="194" x2="190" y2="218" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>

  <rect x="40" y="222" width="300" height="70" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="56" y="244" font-size="13" font-weight="700" fill="#23362e">SLO &mdash; the internal target</text>
  <text x="56" y="264" font-size="11.5" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">&ge; 99.9% over a rolling 28 days</text>
  <text x="56" y="282" font-size="11.5" fill="#5f6f66">chosen by the team, no lawyers involved</text>

  <line x1="340" y1="257" x2="392" y2="257" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>

  <rect x="396" y="124" width="364" height="168" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="578" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#23362e">Error budget = 100% &minus; SLO</text>
  <text x="578" y="168" font-size="11.5" text-anchor="middle" fill="#5f6f66">0.1% of 28 days = 40 min, or 40k of 40M requests</text>

  <rect x="422" y="186" width="312" height="28" rx="5" fill="#e3eedc" stroke="#a9b5a6"/>
  <rect x="422" y="186" width="218" height="28" rx="5" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="440" y="205" font-size="11.5" fill="#c53b3b" font-weight="600">spent 70%</text>
  <text x="660" y="205" font-size="11.5" fill="#2f6b3f" font-weight="600">30% left</text>

  <text x="422" y="240" font-size="11.5" fill="#5f6f66">budget healthy &rarr; ship features, take risks</text>
  <text x="422" y="260" font-size="11.5" fill="#5f6f66">budget burning fast &rarr; page someone</text>
  <text x="422" y="280" font-size="11.5" fill="#5f6f66">budget exhausted &rarr; freeze, fix reliability</text>

  <rect x="396" y="40" width="364" height="56" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="412" y="62" font-size="13" font-weight="700" fill="#23362e">SLA &mdash; the contract</text>
  <text x="412" y="82" font-size="11.5" fill="#5f6f66">99.5% or we refund 10% &mdash; deliberately looser than the SLO</text>

  <line x1="578" y1="124" x2="578" y2="100" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>

  <text class="hand" x="46" y="316" font-size="16" fill="#c53b3b">no SLI? then the SLO is a wish and the SLA is a gamble</text>
</svg>
