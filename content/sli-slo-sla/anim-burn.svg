<svg viewBox="0 0 800 300" role="img" aria-label="Error rate over 28 days, burn rate computed over fast and slow windows, triggering a page or a ticket">
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">SLO 99.9% over 28 days &mdash; burn rate 1&times; means the budget lasts exactly 28 days</text>

  <line x1="70" y1="190" x2="700" y2="190" stroke="#a9b5a6" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="190" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="62" y="66" font-size="10.5" text-anchor="end" fill="#5f6f66">2%</text>
  <text x="62" y="194" font-size="10.5" text-anchor="end" fill="#5f6f66">0%</text>
  <text x="385" y="210" font-size="11" text-anchor="middle" fill="#5f6f66">28-day window</text>
  <line x1="70" y1="177" x2="700" y2="177" stroke="#2f6b3f" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="706" y="181" font-size="10.5" fill="#2f6b3f">0.1% = burn 1&times;</text>

  <polyline id="bb-s1" class="hidden" points="70,187 150,186 230,188 310,186 390,187" fill="none" stroke="#2f6b3f" stroke-width="2.5"/>
  <polyline id="bb-s2" class="hidden" points="390,187 400,70 470,70" fill="none" stroke="#c53b3b" stroke-width="2.5"/>
  <polyline id="bb-s3" class="hidden" points="470,70 482,185 560,186 640,187 700,186" fill="none" stroke="#2f6b3f" stroke-width="2.5"/>
  <polyline id="bb-s4" class="hidden" points="470,70 482,163 560,162 640,163 700,162" fill="none" stroke="#c53b3b" stroke-width="2.5" stroke-dasharray="6 4"/>

  <g id="bb-deploy" class="hidden">
    <line x1="390" y1="46" x2="390" y2="190" stroke="#c53b3b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="394" y="44" font-size="11" fill="#c53b3b" font-weight="600">deploy v2.7</text>
  </g>
  <g id="bb-roll" class="hidden">
    <line x1="470" y1="46" x2="470" y2="190" stroke="#2f6b3f" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="474" y="44" font-size="11" fill="#2f6b3f" font-weight="600">rollback</text>
  </g>

  <rect id="bb-fast" x="70" y="230" width="196" height="54" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="82" y="250" font-size="11.5" font-weight="700" fill="#23362e">fast window &mdash; 1 h</text>
  <text id="bb-fastv" x="82" y="270" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">burn 0.2x · need 14.4x</text>

  <rect id="bb-slow" x="282" y="230" width="196" height="54" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="294" y="250" font-size="11.5" font-weight="700" fill="#23362e">slow window &mdash; 1 d</text>
  <text id="bb-slowv" x="294" y="270" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">burn 0.2x · need 3x</text>

  <rect id="bb-out" x="494" y="230" width="276" height="54" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="bb-outt" x="632" y="252" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">no alert &mdash; budget barely moving</text>
  <text id="bb-outs" x="632" y="272" font-size="11" text-anchor="middle" fill="#5f6f66">spend it on deploys instead</text>

  <text id="bb-budget" x="706" y="110" font-size="12" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">100%</text>
  <text x="706" y="126" font-size="10.5" fill="#5f6f66">budget left</text>
  <text id="bb-hand" class="hand hidden" x="120" y="222" font-size="16" fill="#c53b3b">long window qualifies, short window confirms</text>
</svg>
