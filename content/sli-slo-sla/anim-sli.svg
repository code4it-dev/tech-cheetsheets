<svg viewBox="0 0 800 300" role="img" aria-label="Requests classified as good or bad by an SLI rule, then aggregated into a ratio and an error budget">
  <defs>
    <marker id="sb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">SLI rule: a checkout request is good if status &lt; 500 and latency &le; 300 ms</text>

  <rect x="20" y="40" width="172" height="178" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="106" y="60" font-size="11.5" text-anchor="middle" fill="#5f6f66">load balancer log</text>

  <g id="sb-r1"><rect x="32" y="70" width="148" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="40" y="87" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">/pay 200 120ms</text></g>
  <g id="sb-r2"><rect x="32" y="104" width="148" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="40" y="121" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">/pay 200 410ms</text></g>
  <g id="sb-r3"><rect x="32" y="138" width="148" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="40" y="155" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">/pay 500  90ms</text></g>
  <g id="sb-r4"><rect x="32" y="172" width="148" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="40" y="189" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">/pay 429  12ms</text></g>

  <rect id="sb-rule" x="236" y="66" width="168" height="104" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="320" y="88" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">classifier</text>
  <text id="sb-verdict" x="320" y="192" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">waiting…</text>

  <line x1="196" y1="118" x2="230" y2="118" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sb-arr)"/>
  <line x1="410" y1="118" x2="444" y2="118" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sb-arr)"/>

  <rect x="450" y="40" width="170" height="72" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="sb-goodc" x="610" y="58" font-size="11.5" text-anchor="end" fill="#2f6b3f" font-weight="700">good 0</text>
  <rect x="450" y="146" width="170" height="72" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text id="sb-badc" x="610" y="164" font-size="11.5" text-anchor="end" fill="#c53b3b" font-weight="700">bad 0</text>
  <text id="sb-invalid" class="hidden" x="634" y="196" font-size="11" fill="#5f6f66">429 = not valid,</text>
  <text id="sb-invalid2" class="hidden" x="634" y="212" font-size="11" fill="#5f6f66">excluded entirely</text>

  <text id="sb-sli" x="640" y="100" font-size="13" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">SLI = ?</text>
  <text id="sb-sub" x="640" y="120" font-size="11" fill="#5f6f66">good / valid</text>

  <text x="20" y="248" font-size="11.5" fill="#5f6f66">error budget, 28 days</text>
  <g id="sb-bar">
    <rect x="20" y="256" width="580" height="24" rx="4" fill="#e3eedc" stroke="#a9b5a6"/>
    <rect id="sb-c1" class="hidden" x="20" y="256" width="58" height="24" fill="#f9e3df"/>
    <rect id="sb-c2" class="hidden" x="78" y="256" width="58" height="24" fill="#f9e3df"/>
    <rect id="sb-c3" class="hidden" x="136" y="256" width="58" height="24" fill="#f9e3df"/>
    <rect id="sb-c4" class="hidden" x="194" y="256" width="58" height="24" fill="#f9e3df"/>
    <rect id="sb-c5" class="hidden" x="252" y="256" width="58" height="24" fill="#f9e3df"/>
    <rect id="sb-c6" class="hidden" x="310" y="256" width="58" height="24" fill="#f9e3df"/>
    <rect x="20" y="256" width="580" height="24" rx="4" fill="none" stroke="#a9b5a6"/>
  </g>
  <text id="sb-budget" x="616" y="273" font-size="11.5" fill="#5f6f66">40,000 bad allowed</text>
  <text id="sb-note" class="hand hidden" x="400" y="242" font-size="16" fill="#c53b3b">75% gone, 7 days left</text>
</svg>
