title: Vector database
slug: vector-database
tagline: Every other index answers "equal to". This one answers "near" — and it is allowed to be slightly wrong about it.
asof: Nov 2026 · examples use pgvector, Qdrant and Postgres
description: "Vector database cheatsheet: HNSW and IVF indexes, recall and ef_search, quantisation, filtered search, sizing arithmetic and when Postgres is enough."
aliases:
