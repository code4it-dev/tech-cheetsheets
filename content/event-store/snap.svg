<svg viewBox="0 0 560 200" role="img" aria-label="Loading an aggregate by replaying ten thousand events, then by using a snapshot plus the tail">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">a long-lived stream, and the cost of rebuilding it</text>
  <rect id="sn-stream" x="30" y="46" width="340" height="52" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="200" y="68" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">stream account-7731</text>
  <text id="sn-streamt" x="200" y="86" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">10,000 events</text>
  <rect id="sn-snap" class="hidden" x="30" y="112" width="200" height="48" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="sn-snapt" class="hidden" x="130" y="132" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">snapshot @ v9,900</text>
  <text id="sn-snapt2" class="hidden" x="130" y="150" font-size="10" text-anchor="middle" fill="#5f6f66">a cache, never the truth</text>
  <rect id="sn-cost" x="390" y="46" width="140" height="52" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="460" y="68" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">load time</text>
  <text id="sn-costt" x="460" y="86" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">?</text>
  <text id="sn-msg" x="280" y="184" font-size="11" text-anchor="middle" fill="#5f6f66">every load replays the whole history</text>
</svg>
