<svg viewBox="0 0 800 340" role="img" aria-label="An append-only stream of events, folded into current state on the left and feeding subscriptions and projections on the right">
  <defs>
    <marker id="ev-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">one append-only truth on the left; everything on the right is derived and disposable</text>

  <rect x="20" y="44" width="430" height="126" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="235" y="66" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">stream &nbsp;<tspan font-family="Fira Code, monospace">order-42</tspan>&nbsp; &mdash; append only</text>

  <rect x="34" y="78" width="96" height="48" rx="5" fill="#f2c98a" stroke="#d9a45a"/>
  <text x="82" y="97" font-size="9.5" text-anchor="middle" fill="#23362e">OrderPlaced</text>
  <text x="82" y="113" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v1</text>
  <rect x="138" y="78" width="96" height="48" rx="5" fill="#f2c98a" stroke="#d9a45a"/>
  <text x="186" y="97" font-size="9.5" text-anchor="middle" fill="#23362e">ItemAdded</text>
  <text x="186" y="113" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v2</text>
  <rect x="242" y="78" width="96" height="48" rx="5" fill="#f2c98a" stroke="#d9a45a"/>
  <text x="290" y="97" font-size="9.5" text-anchor="middle" fill="#23362e">ItemAdded</text>
  <text x="290" y="113" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v3</text>
  <rect x="346" y="78" width="96" height="48" rx="5" fill="#f2c98a" stroke="#d9a45a"/>
  <text x="394" y="97" font-size="9.5" text-anchor="middle" fill="#23362e">OrderShipped</text>
  <text x="394" y="113" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v4</text>

  <text x="235" y="150" font-size="11" text-anchor="middle" fill="#5f6f66">immutable · ordered · nothing is ever updated or deleted</text>
  <text x="235" y="164" font-size="10.5" text-anchor="middle" fill="#c53b3b">append with expectedVersion = 4, or be rejected</text>

  <line x1="235" y1="174" x2="235" y2="198" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ev-arr)"/>
  <rect x="20" y="202" width="200" height="110" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="120" y="224" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">fold &rarr; current state</text>
  <text x="120" y="246" font-size="10.5" text-anchor="middle" fill="#5f6f66">2 lines · 5 items</text>
  <text x="120" y="264" font-size="10.5" text-anchor="middle" fill="#5f6f66">status: shipped</text>
  <text x="120" y="288" font-size="10" text-anchor="middle" fill="#2f6b3f">derived in memory,</text>
  <text x="120" y="302" font-size="10" text-anchor="middle" fill="#2f6b3f">never stored as truth</text>

  <rect x="250" y="202" width="200" height="110" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="350" y="224" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">snapshot (optional)</text>
  <text x="350" y="246" font-size="10.5" text-anchor="middle" fill="#5f6f66">state at v9,900 + 100 events</text>
  <text x="350" y="268" font-size="10.5" text-anchor="middle" fill="#5f6f66">a cache, never the truth</text>
  <text x="350" y="292" font-size="10" text-anchor="middle" fill="#5f6f66">delete and rebuild at will</text>

  <line x1="454" y1="107" x2="474" y2="107" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ev-arr)"/>

  <rect x="478" y="44" width="302" height="268" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="629" y="66" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">subscribers &mdash; each with its own checkpoint</text>

  <rect x="494" y="80" width="270" height="44" rx="6" fill="#bfd9b0" stroke="#7fae6b"/>
  <text x="629" y="98" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">projection &rarr; order_list_view</text>
  <text x="629" y="114" font-size="9.5" text-anchor="middle" fill="#5f6f66">the CQRS read model</text>

  <rect x="494" y="132" width="270" height="44" rx="6" fill="#cdbde0" stroke="#a48cc4"/>
  <text x="629" y="150" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">process manager &rarr; the saga</text>
  <text x="629" y="166" font-size="9.5" text-anchor="middle" fill="#5f6f66">reacts and issues commands</text>

  <rect x="494" y="184" width="270" height="44" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="629" y="202" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">other bounded contexts</text>
  <text x="629" y="218" font-size="9.5" text-anchor="middle" fill="#5f6f66">integration events</text>

  <rect x="494" y="236" width="270" height="60" rx="6" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="629" y="256" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">a projection written in 2028</text>
  <text x="629" y="272" font-size="9.5" text-anchor="middle" fill="#5f6f66">replayed from offset 0, answering</text>
  <text x="629" y="286" font-size="9.5" text-anchor="middle" fill="#5f6f66">a question nobody asked in 2026</text>
</svg>
