<svg viewBox="0 0 800 320" role="img" aria-label="Several subscribers consuming the same event log at their own checkpoints, and a new projection replaying history from the beginning">
  <defs>
    <marker id="rd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="rd-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the global log &mdash; every event ever written, in order</text>

  <rect id="rd-log" x="20" y="42" width="300" height="214" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="170" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">$all</text>
  <text x="36" y="90" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">#0  OrderPlaced       order-42</text>
  <text x="36" y="112" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">#1  ItemAdded         order-42</text>
  <text x="36" y="134" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">#2  ItemRemoved       order-42</text>
  <text x="36" y="156" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">#3  ItemAdded         order-42</text>
  <text x="36" y="178" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">#4  OrderPlaced       order-43</text>
  <text x="36" y="200" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">#5  OrderShipped      order-42</text>
  <text id="rd-logt" x="170" y="232" font-size="10.5" text-anchor="middle" fill="#5f6f66">6 events · append only · never rewritten</text>

  <rect id="rd-r1" x="380" y="42" width="400" height="48" rx="6" fill="#bfd9b0" stroke="#7fae6b" stroke-width="1.5"/>
  <text x="396" y="62" font-size="10.5" fill="#23362e" font-weight="600">projection &rarr; order_list_view</text>
  <text id="rd-r1t" x="396" y="80" font-size="9.5" fill="#5f6f66">not subscribed</text>

  <rect id="rd-r2" x="380" y="100" width="400" height="48" rx="6" fill="#cdbde0" stroke="#a48cc4" stroke-width="1.5"/>
  <text x="396" y="120" font-size="10.5" fill="#23362e" font-weight="600">process manager &rarr; reserve stock</text>
  <text id="rd-r2t" x="396" y="138" font-size="9.5" fill="#5f6f66">not subscribed</text>

  <rect id="rd-r3" x="380" y="158" width="400" height="48" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="396" y="178" font-size="10.5" fill="#23362e" font-weight="600">Billing context &rarr; integration events</text>
  <text id="rd-r3t" x="396" y="196" font-size="9.5" fill="#5f6f66">not subscribed</text>

  <rect id="rd-r4" x="380" y="216" width="400" height="48" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text id="rd-r4a" x="396" y="236" font-size="10.5" fill="#23362e" font-weight="600">&mdash;</text>
  <text id="rd-r4t" x="396" y="254" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <line id="rd-a1" class="hidden" x1="326" y1="66" x2="374" y2="66" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rd-arr)"/>
  <line id="rd-a2" class="hidden" x1="326" y1="124" x2="374" y2="124" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rd-arr)"/>
  <line id="rd-a3" class="hidden" x1="326" y1="182" x2="374" y2="182" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rd-arr)"/>
  <line id="rd-a4" class="hidden" x1="326" y1="240" x2="374" y2="240" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rd-arr)"/>

  <text id="rd-msg" x="400" y="292" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">one source of truth, any number of derived views</text>
  <text id="rd-msg2" x="400" y="310" font-size="10.5" text-anchor="middle" fill="#5f6f66">each subscriber keeps its own checkpoint and moves at its own speed</text>
</svg>
