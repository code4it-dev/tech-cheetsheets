<svg viewBox="0 0 800 320" role="img" aria-label="Events appended to a stream, folded into current state, and two concurrent writers resolved by expected version">
  <defs>
    <marker id="st-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="st-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one stream per aggregate &mdash; <tspan font-family="Fira Code, monospace">order-42</tspan></text>

  <rect id="st-stream" x="20" y="42" width="560" height="104" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text id="st-head" x="300" y="138" font-size="10.5" text-anchor="middle" fill="#5f6f66">stream is empty · version 0</text>

  <g id="st-v1" class="hidden"><rect x="36" y="58" width="100" height="58" rx="5" fill="#f2c98a" stroke="#d9a45a"/><text x="86" y="80" font-size="9.5" text-anchor="middle" fill="#23362e">OrderPlaced</text><text x="86" y="100" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v1</text></g>
  <g id="st-v2" class="hidden"><rect x="144" y="58" width="100" height="58" rx="5" fill="#f2c98a" stroke="#d9a45a"/><text x="194" y="80" font-size="9.5" text-anchor="middle" fill="#23362e">ItemAdded</text><text x="194" y="100" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v2 · 2x SKU-77</text></g>
  <g id="st-v3" class="hidden"><rect x="252" y="58" width="100" height="58" rx="5" fill="#f2c98a" stroke="#d9a45a"/><text x="302" y="80" font-size="9.5" text-anchor="middle" fill="#23362e">ItemAdded</text><text x="302" y="100" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v3 · 3x SKU-91</text></g>
  <g id="st-v4" class="hidden"><rect x="360" y="58" width="100" height="58" rx="5" fill="#f2c98a" stroke="#d9a45a"/><text x="410" y="80" font-size="9.5" text-anchor="middle" fill="#23362e">AddressChanged</text><text x="410" y="100" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v4</text></g>
  <g id="st-v5" class="hidden"><rect x="468" y="58" width="100" height="58" rx="5" fill="#f2c98a" stroke="#d9a45a"/><text x="518" y="80" font-size="9.5" text-anchor="middle" fill="#23362e">ItemAdded</text><text x="518" y="100" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">v5 · 1x SKU-12</text></g>

  <rect id="st-state" x="600" y="42" width="180" height="170" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="690" y="64" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">folded state</text>
  <text id="st-s1" x="690" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">&mdash;</text>
  <text id="st-s2" x="690" y="112" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <text id="st-s3" x="690" y="134" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <text id="st-s4" x="690" y="162" font-size="10" text-anchor="middle" fill="#2f6b3f">&nbsp;</text>
  <text id="st-s5" x="690" y="186" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <g id="st-wa" class="hidden">
    <rect x="20" y="176" width="270" height="62" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="155" y="198" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">writer A &mdash; change address</text>
    <text id="st-wat" x="155" y="220" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">read to v3</text>
  </g>
  <g id="st-wb" class="hidden">
    <rect x="310" y="176" width="270" height="62" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="445" y="198" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">writer B &mdash; add an item</text>
    <text id="st-wbt" x="445" y="220" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">read to v3</text>
  </g>

  <rect id="st-note" x="20" y="256" width="760" height="50" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="st-n" x="400" y="278" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">nothing here is ever updated &mdash; only appended</text>
  <text id="st-n2" x="400" y="296" font-size="10.5" text-anchor="middle" fill="#5f6f66">which is what makes history, audit and time travel free rather than features</text>
</svg>
