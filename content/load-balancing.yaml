title: L4 vs L7 load balancing
slug: load-balancing
tagline: One reads the envelope, the other opens the letter. That single difference explains every trade-off between them.
asof: Nov 2026 · examples use nginx, HAProxy, Envoy, YARP and Kubernetes Gateway API
description: "Load balancing cheatsheet: what an L4 balancer can and cannot see, what L7 buys you, why HTTP/2 breaks connection-level balancing, and the power of two choices."
aliases:
  - Load balancing
  - load balancer
  - L4
  - L7
  - layer 4
  - layer 7
  - least connections
  - round robin
