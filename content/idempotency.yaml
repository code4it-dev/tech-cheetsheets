title: Idempotency & deduplication
slug: idempotency
tagline: Exactly-once delivery does not exist. Exactly-once <em>effect</em> does, and this is how you build it.
asof: Nov 2026 · examples in C#, Python, SQL and Kafka · the impossibility result is the Two Generals Problem
description: "Idempotency cheatsheet: why exactly-once delivery is impossible, how idempotency keys and dedup windows give you effectively-once processing, and how to size the window."
aliases:
  - Idempotency
  - idempotency key
  - idempotent
  - deduplication
  - dedup window
  - at-least-once
