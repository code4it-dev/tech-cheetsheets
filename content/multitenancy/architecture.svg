<svg viewBox="0 0 800 330" role="img" aria-label="A request resolved to a tenant, routed through a tenant catalogue, reaching one of four storage layouts">
  <defs>
    <marker id="mt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">one deployment for everyone &mdash; the choice is how far down the sharing goes</text>

  <rect x="18" y="44" width="150" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="93" y="68" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Request</text>
  <text x="93" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">acme.app.com</text>
  <text x="93" y="110" font-size="10.5" text-anchor="middle" fill="#5f6f66">+ a signed token</text>

  <line x1="168" y1="86" x2="202" y2="86" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mt-arr)"/>

  <rect x="206" y="44" width="170" height="86" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="291" y="68" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Tenant resolution</text>
  <text x="291" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">host, path, header or claim</text>
  <text x="291" y="112" font-size="10.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">TenantId = acme</text>

  <line x1="376" y1="86" x2="410" y2="86" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mt-arr)"/>

  <rect x="414" y="44" width="170" height="86" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="499" y="68" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Tenant catalogue</text>
  <text x="499" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">plan, region, status</text>
  <text x="499" y="112" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">where does acme live?</text>

  <line x1="584" y1="86" x2="618" y2="86" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mt-arr)"/>

  <rect x="622" y="44" width="158" height="86" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="701" y="68" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Data access</text>
  <text x="701" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">filter, schema</text>
  <text x="701" y="110" font-size="10.5" text-anchor="middle" fill="#5f6f66">or connection string</text>

  <path d="M701 130 L701 152" stroke="#5f6f66" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#mt-arr)"/>
  <text x="400" y="172" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">&hellip; and one of these four layouts underneath</text>

  <g font-size="11" text-anchor="middle">
    <rect x="18" y="186" width="182" height="96" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="109" y="208" font-size="12" font-weight="600" fill="#23362e">Shared schema</text>
    <text x="109" y="228" fill="#5f6f66" font-family="Fira Code, monospace">WHERE tenant_id = ?</text>
    <text x="109" y="248" fill="#5f6f66">cheapest per tenant</text>
    <text x="109" y="268" fill="#c53b3b">weakest isolation</text>

    <rect x="212" y="186" width="182" height="96" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="303" y="208" font-size="12" font-weight="600" fill="#23362e">Schema per tenant</text>
    <text x="303" y="228" fill="#5f6f66" font-family="Fira Code, monospace">search_path = acme</text>
    <text x="303" y="248" fill="#5f6f66">one database still</text>
    <text x="303" y="268" fill="#c53b3b">N migrations</text>

    <rect x="406" y="186" width="182" height="96" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/>
    <text x="497" y="208" font-size="12" font-weight="600" fill="#23362e">Database per tenant</text>
    <text x="497" y="228" fill="#5f6f66" font-family="Fira Code, monospace">its own connection</text>
    <text x="497" y="248" fill="#2f6b3f">strongest isolation</text>
    <text x="497" y="268" fill="#c53b3b">highest cost</text>

    <rect x="600" y="186" width="182" height="96" rx="7" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
    <text x="691" y="208" font-size="12" font-weight="600" fill="#23362e">Sharded pools</text>
    <text x="691" y="228" fill="#5f6f66">tenants grouped</text>
    <text x="691" y="248" fill="#5f6f66">big ones promoted</text>
    <text x="691" y="268" fill="#2f6b3f">where SaaS lands</text>
  </g>

  <text class="hand" x="300" y="312" font-size="16" fill="#c53b3b">pick the blast radius you can live with</text>
</svg>
