  <text id="sh-s1" x="20" y="256" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">isolation: a WHERE clause</text>
  <text id="sh-s2" x="20" y="278" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">event: &mdash;</text>
  <text id="sh-note" class="hand hidden" x="390" y="276" font-size="15" fill="#c53b3b">cheapest to run, most expensive to get wrong</text>
