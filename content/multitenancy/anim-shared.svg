<svg viewBox="0 0 800 300" role="img" aria-label="Animated shared schema multitenancy with a tenant id column filtering rows">
  <defs>
    <marker id="sh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="sh-app" x="20" y="100" width="148" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="94" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">App</text>
  <text id="sh-app-t" x="94" y="146" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>
  <text id="sh-app-u" x="94" y="168" font-size="10.5" text-anchor="middle" fill="#5f6f66">one connection pool</text>
  <line x1="168" y1="140" x2="200" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sh-a)"/>
  <rect id="sh-f" x="204" y="104" width="172" height="84" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
