  <text id="sh-f-t" x="290" y="150" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">not applied</text>
  <text id="sh-f-s" x="290" y="172" font-size="10.5" text-anchor="middle" fill="#5f6f66">all that separates tenants</text>
  <line x1="376" y1="140" x2="408" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sh-a)"/>
  <rect x="412" y="38" width="368" height="194" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
