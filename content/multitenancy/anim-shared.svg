    <rect id="sh-r1" x="430" y="68" width="332" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="442" y="86" fill="#23362e">acme     | INV-1001 | 120.00</text>
    <rect id="sh-r2" x="430" y="98" width="332" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="442" y="116" fill="#23362e">globex   | INV-2001 | 980.00</text>
    <rect id="sh-r3" x="430" y="128" width="332" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="442" y="146" fill="#23362e">acme     | INV-1002 | 340.00</text>
    <rect id="sh-r4" x="430" y="158" width="332" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="442" y="176" fill="#23362e">initech  | INV-3001 | 15.00</text>
    <rect id="sh-r5" x="430" y="188" width="332" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="442" y="206" fill="#23362e">globex   | INV-2002 | 44.00</text>
