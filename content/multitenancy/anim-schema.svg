<svg viewBox="0 0 800 300" role="img" aria-label="Animated schema per tenant multitenancy with one schema per tenant inside a shared database">
  <defs>
    <marker id="sc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="sc-app" x="20" y="100" width="148" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="94" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">App</text>
  <text id="sc-app-t" x="94" y="146" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>
  <text id="sc-app-u" x="94" y="168" font-size="10.5" text-anchor="middle" fill="#5f6f66">pool per schema</text>
  <line x1="168" y1="140" x2="200" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sc-a)"/>
  <rect id="sc-f" x="204" y="104" width="172" height="84" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="290" y="128" font-size="12" font-weight="600" text-anchor="middle" fill="#23362e">Schema selector</text>
  <text id="sc-f-t" x="290" y="150" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">search_path = ?</text>
  <text id="sc-f-s" x="290" y="172" font-size="10.5" text-anchor="middle" fill="#5f6f66">set once, per connection</text>
  <line x1="376" y1="140" x2="408" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sc-a)"/>
  <rect x="412" y="38" width="368" height="194" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="596" y="58" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">one database &middot; three schemas</text>
  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="sc-s1" x="430" y="70" width="332" height="46" rx="5" fill="#eef1e8" stroke="#d5dccf"/>
    <text x="442" y="88" fill="#23362e">schema acme</text><text id="sc-v1" x="442" y="106" fill="#5f6f66">invoices, customers &middot; v41</text>
    <rect id="sc-s2" x="430" y="122" width="332" height="46" rx="5" fill="#eef1e8" stroke="#d5dccf"/>
    <text x="442" y="140" fill="#23362e">schema globex</text><text id="sc-v2" x="442" y="158" fill="#5f6f66">invoices, customers &middot; v41</text>
    <rect id="sc-s3" x="430" y="174" width="332" height="46" rx="5" fill="#eef1e8" stroke="#d5dccf"/>
    <text x="442" y="192" fill="#23362e">schema initech</text><text id="sc-v3" x="442" y="210" fill="#5f6f66">invoices, customers &middot; v41</text>
  </g>
  <text id="sc-st1" x="20" y="256" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">isolation: a namespace</text>
  <text id="sc-st2" x="20" y="278" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">event: &mdash;</text>
  <text id="sc-note" class="hand hidden" x="390" y="276" font-size="15" fill="#c53b3b">every deploy is now N deploys</text>
</svg>
