<svg viewBox="0 0 560 240" role="img" aria-label="Animated cross-tenant leak caused by a raw SQL report bypassing the query filter">
  <text x="12" y="22" font-size="12" font-weight="600" fill="#23362e">A Tuesday afternoon, one sprint before the audit</text>
  <text id="lk-s1" class="hidden" x="12" y="50" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">1. every LINQ query is filtered — all green</text>
  <text id="lk-s2" class="hidden" x="12" y="76" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">2. a report needs a window function → FromSqlRaw</text>
  <text id="lk-s3" class="hidden" x="12" y="102" font-size="11.5" fill="#c53b3b" font-family="Fira Code, monospace">3. raw SQL ignores HasQueryFilter entirely</text>
  <text id="lk-s4" class="hidden" x="12" y="128" font-size="11.5" fill="#c53b3b" font-family="Fira Code, monospace">4. the report returns every tenant's invoices</text>
  <text id="lk-s5" class="hidden" x="12" y="154" font-size="11.5" fill="#c53b3b" font-family="Fira Code, monospace">5. nothing errors — it just shows more rows</text>
  <rect x="330" y="30" width="218" height="46" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="439" y="50" font-size="11" text-anchor="middle" fill="#5f6f66">rows returned to acme</text>
  <text id="lk-rows" x="439" y="68" font-size="13" text-anchor="middle" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">2 of 2</text>
  <rect x="330" y="92" width="218" height="46" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="439" y="112" font-size="11" text-anchor="middle" fill="#5f6f66">detected by</text>
  <text id="lk-det" x="439" y="130" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">—</text>
  <text id="lk-fix" class="hidden" x="12" y="186" font-size="11.5" fill="#2f6b3f" font-family="Fira Code, monospace">fix: row-level security — the database refuses, not the ORM</text>
  <text id="lk-note" class="hand hidden" x="12" y="222" font-size="15" fill="#c53b3b">the filter was never the problem — the bypass was</text>
</svg>
