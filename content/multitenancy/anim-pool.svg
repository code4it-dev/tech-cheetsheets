<svg viewBox="0 0 800 300" role="img" aria-label="Animated pooled multitenancy where tenants are grouped into shards and large tenants are promoted">
  <defs>
    <marker id="pl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="pl-app" x="20" y="100" width="148" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="94" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">App</text>
  <text id="pl-app-t" x="94" y="146" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>
  <text id="pl-app-u" x="94" y="168" font-size="10.5" text-anchor="middle" fill="#5f6f66">pool per shard</text>
  <line x1="168" y1="140" x2="200" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#pl-a)"/>
  <rect id="pl-cat" x="204" y="104" width="172" height="84" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="290" y="128" font-size="12" font-weight="600" text-anchor="middle" fill="#23362e">Tenant catalogue</text>
  <text id="pl-cat-t" x="290" y="150" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">tenant &rarr; shard</text>
  <text id="pl-cat-s" x="290" y="172" font-size="10.5" text-anchor="middle" fill="#5f6f66">one row to move a tenant</text>
  <line x1="376" y1="140" x2="408" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#pl-a)"/>
  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="pl-p1" x="412" y="42" width="368" height="58" rx="7" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
    <text x="426" y="64" font-size="12" font-weight="600" fill="#23362e">shard-01 &mdash; shared schema</text>
    <text id="pl-t1" x="426" y="86" fill="#5f6f66">acme, globex + 198 more</text>
    <rect id="pl-p2" x="412" y="110" width="368" height="58" rx="7" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
    <text x="426" y="132" font-size="12" font-weight="600" fill="#23362e">shard-02 &mdash; shared schema</text>
    <text id="pl-t2" x="426" y="154" fill="#5f6f66">initech + 201 more</text>
    <rect id="pl-p3" x="412" y="178" width="368" height="58" rx="7" fill="#fbfcf8" stroke="#d5dccf" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text id="pl-t3h" x="426" y="200" font-size="12" font-weight="600" fill="#5f6f66">dedicated tier &mdash; empty</text>
    <text id="pl-t3" x="426" y="222" fill="#5f6f66">for tenants that outgrow a shard</text>
  </g>
  <text id="pl-s1" x="20" y="256" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">blast radius: one shard &middot; 200 tenants</text>
  <text id="pl-s2" x="20" y="278" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">event: &mdash;</text>
  <text id="pl-note" class="hand hidden" x="390" y="276" font-size="15" fill="#c53b3b">you choose the blast radius, per tenant</text>
</svg>
