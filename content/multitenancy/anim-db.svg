<svg viewBox="0 0 800 300" role="img" aria-label="Animated database per tenant multitenancy routed through a tenant catalogue">
  <defs>
    <marker id="db-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="db-app" x="20" y="100" width="148" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="94" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">App</text>
  <text id="db-app-t" x="94" y="146" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>
  <text id="db-app-u" x="94" y="168" font-size="10.5" text-anchor="middle" fill="#5f6f66">pool per database</text>
  <line x1="168" y1="140" x2="200" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#db-a)"/>
  <rect id="db-cat" x="204" y="104" width="172" height="84" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="290" y="128" font-size="12" font-weight="600" text-anchor="middle" fill="#23362e">Tenant catalogue</text>
  <text id="db-cat-t" x="290" y="150" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">tenant &rarr; connection</text>
  <text id="db-cat-s" x="290" y="172" font-size="10.5" text-anchor="middle" fill="#5f6f66">the only shared table</text>
  <line x1="376" y1="140" x2="408" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#db-a)"/>
  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="db-d1" x="412" y="42" width="368" height="56" rx="7" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
    <text x="426" y="64" font-size="12" font-weight="600" fill="#23362e">db_acme</text><text id="db-t1" x="426" y="84" fill="#5f6f66">own instance &middot; own backups &middot; eu-west</text>
    <rect id="db-d2" x="412" y="108" width="368" height="56" rx="7" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
    <text x="426" y="130" font-size="12" font-weight="600" fill="#23362e">db_globex</text><text id="db-t2" x="426" y="150" fill="#5f6f66">own instance &middot; own backups &middot; us-east</text>
    <rect id="db-d3" x="412" y="174" width="368" height="56" rx="7" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
    <text x="426" y="196" font-size="12" font-weight="600" fill="#23362e">db_initech</text><text id="db-t3" x="426" y="216" fill="#5f6f66">own instance &middot; own backups &middot; eu-west</text>
  </g>
  <text id="db-s1" x="20" y="256" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">isolation: a connection string</text>
  <text id="db-s2" x="20" y="278" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">event: &mdash;</text>
  <text id="db-note" class="hand hidden" x="390" y="276" font-size="15" fill="#c53b3b">perfect isolation, and a bill per tenant</text>
</svg>
