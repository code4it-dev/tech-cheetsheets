title: Multitenancy strategies
slug: multitenancy
tagline: One system, many customers — the only real question is where you draw the isolation line.
asof: Nov 2026 · the strategies are stable; examples are .NET 10 (LTS), EF Core and PostgreSQL
description: "Multitenancy cheatsheet: animated comparison of shared schema, schema per tenant, database per tenant and sharded pools, with tenant resolution, noisy neighbours, migrations, restores and cross-tenant leaks."
aliases:
  - Multitenancy strategies
  - multitenancy
  - multi-tenancy
  - multi-tenant
  - tenant isolation
keywords:
  - multitenancy
  - saas
  - tenant isolation
  - sharding
  - row level security
  - ef core
  - database per tenant
  - noisy neighbour
related: [ modular-monolith, backend-for-frontend ]
overview:
  - "A multi-tenant system serves many customers from one set of running code. That is what makes SaaS economics work: one deployment, one on-call rota, one upgrade, amortised across thousands of tenants. The architectural question is not <em>whether</em> to share — it is **how much**, and the answer lives almost entirely in the data layer."
  - There are four answers in practice. Put every tenant's rows in one table behind a **discriminator column**; give each tenant its own **schema** in a shared database; give each tenant its own **database**; or group tenants into **pools** of shared databases and promote the big ones. They differ in isolation, in what a noisy neighbour can do to you, in what a migration costs, in whether you can restore one customer, and in how much each tenant costs you per month.
  - Everything else — resolving which tenant a request belongs to, keeping caches from mixing tenants, enforcing per-tenant limits, onboarding and offboarding — sits on top and is largely the same whichever you pick. The four animations below run the same request, the same noisy neighbour and the same restore through each strategy, so the trade-offs are visible side by side.
architecture:
  svg: multitenancy/architecture.svg
  alt: A request resolved to a tenant, routed through a tenant catalogue, reaching one of four storage layouts
  caption: Resolution and routing look the same in all four. What changes is what sits at the end of the arrow — and that decides isolation, cost and how a bad day goes.
howItWorks:
  - md: "Three tenants — **acme**, **globex** and **initech** — and the same three events in every animation: a normal read, a noisy neighbour running a huge import, and a request to restore one tenant to yesterday. Watch how differently each layout handles them."
  - note: every strategy is the same system until something goes wrong
  - anim:
      id: anim-shared
      title: 1 · Shared database, shared schema
      svg: multitenancy/anim-shared.svg
      alt: Animated shared schema multitenancy with a tenant id column filtering rows
      steps:
        - say: Three tenants, one table. Every row carries a `tenant_id`, and that column is the entire isolation mechanism — there is nothing else separating acme from globex.
          hl: [ sh-f ]
        - say: A request arrives for **acme**. The tenant is resolved from the signed token before anything touches data, and the ORM adds the predicate to every query automatically.
          hl: [ sh-app ]
          unhl: [ sh-f ]
          text:
            sh-app-t: GET /invoices
            sh-f-t: WHERE tenant_id = 'acme'
            sh-s2: "event: a normal read"
        - say: Two of the five rows come back. The other three were never visible — but they were in the same table, on the same pages, one predicate away.
          unhl: [ sh-app ]
          text:
            sh-app-t: 2 rows · 1.8 ms
          fill:
            sh-r1: "#e3eedc"
            sh-r3: "#e3eedc"
        - say: Now the failure mode. A report needs a window function, so somebody writes raw SQL. Global query filters **do not apply** to raw SQL — and nothing errors. The report simply returns more rows than it should.
          text:
            sh-f-t: bypassed by FromSqlRaw
            sh-s1: "isolation: a WHERE clause — and it was skipped"
            sh-s2: "event: cross-tenant leak"
          fill:
            sh-r2: "#f9e3df"
            sh-r4: "#f9e3df"
            sh-r5: "#f9e3df"
        - say: The fix is to stop relying on the ORM. With **row-level security** the database applies the predicate itself, so raw SQL, Dapper, a stored procedure or a psql session all get filtered — a forgotten filter returns nothing instead of everything.
          text:
            sh-f-t: RLS policy on the table
            sh-f-s: enforced by the database
            sh-s1: "isolation: a database policy"
            sh-s2: "event: leak prevented"
          fill:
            sh-r2: "#fbfcf8"
            sh-r4: "#fbfcf8"
            sh-r5: "#fbfcf8"
        - say: "Second event: **globex** starts importing three years of history. Same table, same instance, same connection pool — so acme’s 1.8 ms query is now taking 400 ms. Nothing isolates them."
          hl: [ sh-app ]
          text:
            sh-app-t: 2 rows · 400 ms
            sh-app-u: pool exhausted by globex
            sh-s2: "event: noisy neighbour — everyone slows down"
          fill:
            sh-r2: "#fbf3c4"
            sh-r5: "#fbf3c4"
        - say: "Third event: acme asks to be restored to yesterday. There is no way to restore <em>part</em> of a database, so this means restoring the whole backup to a side instance, extracting acme’s rows, reconciling keys and re-importing. Hours, and risky."
          unhl: [ sh-app ]
          text:
            sh-s2: "event: restore one tenant — row surgery from a full backup"
        - say: "So: cents per tenant, instant onboarding, one migration, and cross-tenant analytics for free — against an isolation boundary that is only as strong as your weakest query, no defence against a noisy neighbour, and a painful restore. Start here, add row-level security on day one, and build the tenant catalogue before you need it."
          show: [ sh-note ]
          text:
            sh-s1: "isolation: a database policy · cost: cents per tenant"
  - anim:
      id: anim-schema
      title: 2 · Schema per tenant
      svg: multitenancy/anim-schema.svg
      alt: Animated schema per tenant multitenancy with one schema per tenant inside a shared database
      steps:
        - say: Same database, but now each tenant gets its own **schema** holding its own copy of the tables. No `tenant_id` column anywhere.
          hl: [ sc-s1, sc-s2, sc-s3 ]
        - say: Resolution sets the schema on the connection rather than adding a predicate to the query. In PostgreSQL that is the `search_path`; in EF Core it is the default schema on the model.
          hl: [ sc-f ]
          unhl: [ sc-s1, sc-s2, sc-s3 ]
          text:
            sc-f-t: search_path = acme
            sc-app-t: GET /invoices
            sc-st2: "event: a normal read"
        - say: The query itself has no tenant clause at all — and that is the real gain. A developer who forgets to filter gets <em>this</em> tenant’s data, not everyone’s. The failure mode from animation 1 simply does not exist.
          unhl: [ sc-f ]
          text:
            sc-app-t: 2 rows · 1.8 ms
            sc-st1: "isolation: a namespace — no filter to forget"
          fill:
            sc-s1: "#e3eedc"
        - say: "Restores improve too: acme can be restored from a dump of one schema, without touching globex or initech."
          text:
            sc-st2: "event: restore one tenant — restore one schema"
        - say: But here is the bill. A release that adds a column now runs **once per schema**. With three tenants that is invisible; with five hundred it is a fan-out job that takes an hour.
          text:
            sc-v1: invoices, customers · migrating
            sc-v2: invoices, customers · migrating
            sc-v3: invoices, customers · migrating
            sc-st2: "event: deploy — N migrations"
          fill:
            sc-s1: "#fbf3c4"
            sc-s2: "#fbf3c4"
            sc-s3: "#fbf3c4"
        - say: And some of them fail. Now the fleet is on two schema versions at once, while the application is running one version of the code — so every release needs expand-and-contract, a resumable runner and a recorded version per tenant.
          text:
            sc-v1: invoices, customers · v42
            sc-v2: FAILED · still v41
            sc-v3: invoices, customers · v42
            sc-st1: "isolation: a namespace · version skew: yes"
          fill:
            sc-s2: "#f9e3df"
        - say: Meanwhile globex starts its import. It is still the **same instance** — same CPU, same I/O, same connection pool — so the noisy neighbour hurts exactly as much as it did in animation 1. The isolation was logical, not physical.
          hl: [ sc-app ]
          text:
            sc-app-t: 2 rows · 400 ms
            sc-st2: "event: noisy neighbour — unchanged"
          fill:
            sc-s2: "#fbf3c4"
        - say: "Which is why this one is squeezed from both sides: it costs N migrations without buying the isolation that would justify them, and the catalogue bloat caps it at a few hundred tenants. Choose it when the tenant count is small and bounded — fifty enterprise customers — and rarely otherwise."
          show: [ sc-note ]
          unhl: [ sc-app ]
          fill:
            sc-s1: "#eef1e8"
            sc-s2: "#eef1e8"
            sc-s3: "#eef1e8"
  - anim:
      id: anim-db
      title: 3 · Database per tenant
      svg: multitenancy/anim-db.svg
      alt: Animated database per tenant multitenancy routed through a tenant catalogue
      steps:
        - say: "Now each tenant gets its own database. Note what appeared in the middle: a **tenant catalogue**, the one small shared table that maps a tenant to where its data lives."
          hl: [ db-cat ]
        - say: The request for acme resolves the tenant, looks up its connection string, and opens a connection to `db_acme`. Isolation is no longer a predicate or a namespace — it is a different database.
          hl: [ db-d1 ]
          unhl: [ db-cat ]
          text:
            db-cat-t: acme → db_acme
            db-app-t: GET /invoices
            db-s2: "event: a normal read"
        - say: A leak would now require connecting to the wrong database, which is a very different class of mistake from forgetting a `WHERE` clause. This is the answer that survives the compliance meeting.
          text:
            db-app-t: 2 rows · 1.8 ms
            db-s1: "isolation: a connection string"
          fill:
            db-d1: "#e3eedc"
        - say: Globex starts the same import — and this time it is on its own instance. Acme does not notice. The noisy neighbour problem is solved by construction rather than by limits and fair queuing.
          text:
            db-t2: own instance · importing hard · us-east
            db-app-t: 2 rows · 1.8 ms — unaffected
            db-s2: "event: noisy neighbour — contained"
          fill:
            db-d2: "#fbf3c4"
        - say: "The restore is now routine: a point-in-time restore of one database, with no effect on anyone else. Minutes, not hours, and no row surgery."
          text:
            db-s2: "event: restore one tenant — point-in-time, minutes"
          fill:
            db-d2: "#eef1e8"
            db-d1: "#e3eedc"
        - say: "And it unlocks things the other models simply cannot offer: each database lives in its tenant’s region, can use a customer-managed encryption key, and can be handed over as a backup when the customer leaves."
          text:
            db-t1: own instance · own key · eu-west
            db-t3: own instance · own key · eu-west
            db-s1: "isolation: a connection string · residency: per tenant"
        - say: Then the invoice arrives. Every database has a floor price whether or not the tenant logs in, migrations run N times across N instances, each app instance needs a connection pool per tenant, and onboarding takes minutes instead of milliseconds.
          hl: [ db-app ]
          text:
            db-app-u: one pool per tenant
            db-s2: "event: deploy — N migrations across N instances"
          fill:
            db-d1: "#fbf3c4"
            db-d2: "#fbf3c4"
            db-d3: "#fbf3c4"
        - say: So this is the right answer for a <em>few, large, demanding</em> tenants — and an impossible one for ten thousand small ones, where a free tier at tens of euros a month each would cost more than the company earns. Which is exactly why the fourth option exists.
          show: [ db-note ]
          unhl: [ db-app ]
          fill:
            db-d1: "#eef1e8"
            db-d2: "#eef1e8"
            db-d3: "#eef1e8"
  - anim:
      id: anim-pool
      title: 4 · Sharded pools (the hybrid)
      svg: multitenancy/anim-pool.svg
      alt: Animated pooled multitenancy where tenants are grouped into shards and large tenants are promoted
      steps:
        - say: The hybrid, and where most SaaS converges. Tenants are grouped into **shards** — each one an ordinary shared-schema database — and the catalogue maps each tenant to its shard.
          hl: [ pl-p1, pl-p2 ]
        - say: "Routing is identical to database-per-tenant: resolve the tenant, look up where it lives, connect. The application code does not know or care which model it is running under."
          hl: [ pl-cat ]
          unhl: [ pl-p1, pl-p2 ]
          text:
            pl-cat-t: acme → shard-01
            pl-app-t: GET /invoices
            pl-s2: "event: a normal read"
        - say: "Inside a shard it is animation 1 again — a tenant column, a query filter and row-level security. All the cost advantages come back: cents per tenant, instant onboarding, pooled capacity."
          unhl: [ pl-cat ]
          text:
            pl-app-t: 2 rows · 1.8 ms
            pl-s1: "blast radius: one shard · 200 tenants"
          fill:
            pl-p1: "#e3eedc"
        - say: The difference is the **blast radius**, and it is a number you choose. Globex’s import now degrades the 200 tenants on shard-01 — bad, but not the 40,000 on the platform.
          text:
            pl-t1: acme, globex + 198 more · degraded
            pl-app-t: 2 rows · 400 ms
            pl-s2: "event: noisy neighbour — bounded to 200 tenants"
          fill:
            pl-p1: "#fbf3c4"
        - say: "And here is the move that makes the pattern worth its machinery. Globex keeps growing, so it is **promoted**: its data is copied to a dedicated database, verified, and the catalogue row is flipped."
          text:
            pl-t3h: dedicated — db_globex
            pl-t3: promoted from shard-01 · own instance
            pl-t1: acme + 198 more · healthy
            pl-cat-t: globex → dedicated
            pl-s2: "event: promotion — one catalogue row"
          fill:
            pl-p3: "#e3eedc"
            pl-p1: "#eef1e8"
        - say: No code changed. That is why the catalogue must hold an explicit mapping rather than hashing tenants to shards — a hash makes exactly this operation impossible without rehashing everyone.
          text:
            pl-cat-s: explicit mapping, never a hash
        - say: "Migrations land in the middle too: one run per shard plus one per dedicated database. Tens of runs, not thousands — which is what keeps the operational cost flat as the tenant count grows."
          text:
            pl-s2: "event: deploy — one migration per shard"
          fill:
            pl-p1: "#fbf3c4"
            pl-p2: "#fbf3c4"
            pl-p3: "#fbf3c4"
        - say: "So you get shared-schema economics for the small tenants, dedicated isolation for the ones who pay for it, and one code path serving both. The price is real machinery: the catalogue, a per-shard migration runner, and tooling to move a tenant with verification — which is why you build the catalogue on day one, even when every row says `shard-01`."
          show: [ pl-note ]
          text:
            pl-s1: "blast radius: chosen per tenant · cost: cents, except where it matters"
          fill:
            pl-p1: "#eef1e8"
            pl-p2: "#eef1e8"
            pl-p3: "#e3eedc"
  - heading: Comparing them
    id: compare-strategies
  - md: Same three events, four very different days. The rows people underestimate are <em>migration</em> and <em>restore one tenant</em> — they are invisible until the system is two years old.
  - table:
      columns:
        - ""
        - Shared schema
        - Schema per tenant
        - Database per tenant
        - Sharded pools
      rows:
        - cells:
            - "**Isolation**"
            - a `WHERE` clause
            - a namespace
            - "**a connection string**"
            - per shard
        - cells:
            - "**Cross-tenant leak needs**"
            - one forgotten filter
            - a wrong `search_path`
            - connecting to the wrong database
            - one forgotten filter, within a shard
        - cells:
            - "**Noisy neighbour**"
            - hits everyone
            - hits everyone on the instance
            - "**contained**"
            - hits one shard
        - cells:
            - "**Cost per tenant**"
            - "**lowest**"
            - low
            - highest — idle tenants still cost
            - low
        - cells:
            - "**Practical tenant ceiling**"
            - 100,000+
            - hundreds
            - hundreds to low thousands
            - "**100,000+**"
        - cells:
            - "**A migration is**"
            - 1 run
            - N runs, and partial failure leaves mixed versions
            - N runs, across N instances
            - one run per shard — tens
        - cells:
            - "**Restore one tenant**"
            - row surgery from a backup
            - restore that schema
            - "**trivial**"
            - restore a shard, then extract one tenant
        - cells: [ "**Per-tenant region or key**", no, no, "**yes**", per shard ]
        - cells:
            - "**Onboarding a tenant**"
            - an `INSERT`
            - create a schema, migrate it
            - provision a database — minutes
            - an `INSERT`, usually
        - self: true
          cells:
            - "**Blast radius of an incident**"
            - every customer
            - every customer
            - one customer
            - one shard
  - md: |-
      What that actually tells you:

      - **Shared schema and database-per-tenant are the two honest extremes.** One optimises cost and operational simplicity, the other isolation and compliance. Everything in between is a compromise, and schema-per-tenant in particular gets the <em>worst</em> of both at scale: N migrations without the isolation that would justify them.
      - **The migration row is the one that decides your ceiling.** A shared schema deploys in seconds forever. Schema- or database-per-tenant turns every release into a fan-out job with partial failures, retries and version skew — and that is what caps you at hundreds of tenants rather than thousands.
      - **Sharded pools is where most SaaS ends up**, because it is the only option that lets you choose the blast radius <em>per tenant</em>: small customers share, big ones get promoted, and both run the same code with the same migrations.

      **Choosing, in one line each:**

      - **Shared schema** for a new product, many small tenants, no per-tenant compliance requirement. Start here.
      - **Sharded pools** once you can no longer tolerate every customer sharing one blast radius — design the tenant catalogue early so this is a config change, not a rewrite.
      - **Database per tenant** for a few large, demanding or regulated customers, or when contracts require data residency and separate keys.
      - **Schema per tenant** only when you have a bounded, small number of tenants and a strong reason — it is the least common end state for a reason.
concepts:
  - term: tenant
    short: "The unit of isolation and usually of billing: a customer organisation, not a user. Getting this definition wrong is expensive to undo."
    see: [ tenant resolution, tenant catalogue, tenant lifecycle ]
    detail: |-
      A tenant is the boundary inside which data may be shared and across which it must not be. Almost always a company, not a person — users belong to tenants.

      | Decision | Ask |
      | --- | --- |
      | Can a user belong to two tenants? | consultants, agencies, parent companies — usually yes, and retrofitting it is painful |
      | Can a tenant have sub-units? | departments, regions, franchises — a hierarchy you cannot add later for free |
      | Is the tenant the billing entity? | often, but not always — one contract can cover many tenants |
      | Can data move between tenants? | mergers and demergers happen; decide now whether it is supported or manual |

      Model the tenant id as a strongly-typed value from day one, not a bare `Guid` or `string`. It appears in every table, every cache key, every log line and every metric, and a type the compiler can check stops it being swapped with a user id in a method call.

      The single most important early decision is to make everything tenant-aware <em>from the first commit</em>. Adding a tenant column to a production schema with forty tables and no filtering is a project, not a change.
  - term: tenant resolution
    short: Deciding which tenant a request belongs to, before anything touches data. The first middleware in the pipeline, and a security boundary.
    see: [ tenant, tenant catalogue, global query filter ]
    detail: |-
      Resolution has to happen early, be unambiguous, and be impossible for the caller to forge.

      | Strategy | Example | Notes |
      | --- | --- | --- |
      | Subdomain | `acme.app.com` | clean URLs and easy cookie scoping; needs wildcard DNS and certificates |
      | Path segment | `app.com/acme/...` | simplest to deploy; every route carries the tenant |
      | Token claim | `tid` in the JWT | **the trustworthy one** — signed by your identity provider |
      | Header | `X-Tenant-Id` | fine service-to-service, never from a browser |

      The rule that prevents the worst class of bug: **resolve from the token, and treat anything in the URL as a hint to be validated against it**. If the host says `acme` and the token says `globex`, that is a `403`, not a judgement call.

      ```csharp
      var fromToken = user.FindFirstValue("tid");
      var fromHost  = HostToTenant(ctx.Request.Host);
      if (fromHost is not null && fromHost != fromToken) return Results.Forbid();
      ```

      Make an unresolved tenant a hard failure. A request with no tenant must never fall through to a default, because the default will eventually be "all of them".
  - term: discriminator column
    short: A `tenant_id` on every tenant-owned table. The entire isolation mechanism of the shared-schema model.
    see: [ global query filter, row-level security, shared schema ]
    detail: |-
      Cheap, simple and completely dependent on every single query remembering to use it.

      | Detail | Guidance |
      | --- | --- |
      | Place in the index | **first column** of every index — `(tenant_id, created_at)`, not the reverse |
      | Nullability | never nullable; a null tenant is a row nobody owns |
      | Composite keys | include it in the primary key for tables you may shard or extract later |
      | Foreign keys | include `tenant_id` in the FK so a child cannot point at another tenant's parent |
      | Type | short and fixed — it is on every row of every table |

      That first row matters more than it looks: an index on `(created_at)` alone makes every tenant scan every other tenant's rows before filtering. With thousands of tenants that is the difference between a 2 ms query and a 2 second one.

      The composite foreign key trick is underused and free: `FOREIGN KEY (tenant_id, order_id)` makes a cross-tenant reference impossible at the database level, so a bug produces a constraint violation instead of a leak.
  - term: global query filter
    short: Applying the tenant predicate automatically in the ORM so no developer has to remember it. Necessary, and not sufficient.
    see: [ discriminator column, row-level security, tenant resolution ]
    anim:
      key: leak
      title: How a cross-tenant leak actually happens
      svg: multitenancy/leak.svg
      alt: Animated cross-tenant leak caused by a raw SQL report bypassing the query filter
      steps:
        - say: Every query in the codebase goes through EF Core, and every entity has a global query filter. An audit of the LINQ is completely clean.
          show: [ lk-s1 ]
        - say: Then a reporting screen needs a window function that LINQ cannot express, so somebody reaches for `FromSqlRaw`. Entirely reasonable, and reviewed by two people.
          show: [ lk-s2 ]
        - say: But global query filters are an ORM concept. Raw SQL goes straight to the database, and the predicate is never added.
          show: [ lk-s3 ]
        - say: "The report returns every tenant’s invoices. Note what does <em>not</em> happen: no exception, no warning, no failed test. The page just shows more rows than it used to."
          show: [ lk-s4 ]
          text:
            lk-rows: 5 of 2
          fill:
            lk-rows: "#c53b3b"
        - say: So it is found by a customer, usually months later, usually in the worst possible way. There is nothing in the system that treats "more rows than expected" as an error.
          show: [ lk-s5 ]
          text:
            lk-det: a customer, in month 7
        - say: The fix is not more discipline — it is moving the check somewhere the bypass cannot reach. With row-level security the database refuses, so the same raw SQL returns two rows and the report is simply correct.
          show: [ lk-fix, lk-note ]
          text:
            lk-rows: 2 of 2
            lk-det: nothing to detect
          fill:
            lk-rows: "#2f6b3f"
    detail: |-
      In EF Core one line per entity makes the filter implicit on every LINQ query.

      ```csharp
      protected override void OnModelCreating(ModelBuilder b)
      {
          b.Entity<Invoice>().HasQueryFilter(i => i.TenantId == _tenant.Id);
          b.Entity<Customer>().HasQueryFilter(c => c.TenantId == _tenant.Id);
      }
      ```

      #### Where it does not reach

      | Bypass | Risk |
      | --- | --- |
      | `IgnoreQueryFilters()` | deliberate, and sometimes correct — ban it outside an audited helper |
      | `FromSqlRaw` and Dapper | no filter at all; the developer must write the predicate |
      | Stored procedures and views | outside the ORM entirely |
      | Background jobs | no request, so often no tenant in scope — a very common leak |
      | Admin and reporting tools | frequently built with the filter off "temporarily" |

      ::anim leak::

      So: use global filters, and do not rely on them alone. The database-level backstop in the next concept is what turns a leak into an empty result set.
  - term: row-level security
    short: The database enforcing the tenant predicate itself, so a forgotten filter returns nothing instead of everything. The backstop worth the setup.
    see: [ global query filter, discriminator column, shared schema ]
    detail: |-
      PostgreSQL, SQL Server and others can attach a policy to a table that is applied to every statement, whatever issued it — ORM, raw SQL, a psql session or a stored procedure.

      ```sql
      ALTER TABLE invoices ENABLE ROW LEVEL SECURITY;
      ALTER TABLE invoices FORCE ROW LEVEL SECURITY;      -- applies to the table owner too

      CREATE POLICY tenant_isolation ON invoices
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);
      ```

      ```csharp
      // set it once per connection, from resolved tenant context
      await using var cmd = conn.CreateCommand();
      cmd.CommandText = "SELECT set_config('app.tenant_id', $1, false)";
      cmd.Parameters.Add(new NpgsqlParameter { Value = tenant.Id.ToString() });
      await cmd.ExecuteNonQueryAsync(ct);
      ```

      | Watch out for | Why |
      | --- | --- |
      | Connection pooling | the setting must be applied on every checkout, or a connection carries the previous tenant's context |
      | The table owner | policies are bypassed by the owner unless you add `FORCE` |
      | Migration users | they need `BYPASSRLS`, so keep that account out of the application |
      | Query plans | the predicate is added to every statement — index for it |

      The cost is a few hours of setup and some care with pooling. The benefit is that the <em>most common and most damaging</em> bug in a shared-schema system becomes structurally impossible, including in the raw SQL and the admin tool nobody reviewed.
  - term: shared schema
    short: One database, one set of tables, every tenant's rows together. The cheapest model and the default starting point.
    see:
      - discriminator column
      - row-level security
      - noisy neighbour
      - cost per tenant
    detail: |-
      Everything is shared, so everything is cheap: one migration, one backup, one connection pool, one set of dashboards — and an idle tenant costs essentially nothing.

      | Property | Value |
      | --- | --- |
      | Tenants per database | tens of thousands, comfortably |
      | Onboarding | an `INSERT` — instant, free, no provisioning |
      | Migration | one run, seconds |
      | Isolation | a predicate — as strong as your weakest query |
      | Per-tenant restore | painful: restore a copy, extract rows, reconcile keys |

      The two things that eventually push people off it are the per-tenant restore and the compliance conversation. "Can you guarantee our data is not in the same table as our competitor's?" has no good answer here, however correct your filtering is.

      Start here anyway unless you already know otherwise. Design the tenant catalogue and route every query through tenant context from day one, and moving to pools later is a routing change rather than a rewrite.
  - term: schema per tenant
    short: One database, one schema per tenant, each with its own copy of the tables. A middle ground that gets squeezed from both sides.
    see:
      - shared schema
      - database per tenant
      - per-tenant migration
      - pooled model
    detail: |-
      Better isolation than a predicate — a missing filter returns the current tenant's data rather than everyone's — without a database per customer.

      | Gains | Costs |
      | --- | --- |
      | no tenant column, no filter to forget | a migration per schema on every release |
      | restore one schema | connection pooling fragments, or `search_path` is reset per checkout |
      | per-tenant customisation is possible | per-tenant customisation becomes a support nightmare |
      | easier compliance conversation | still one instance, so a noisy neighbour still hurts |

      The practical ceiling is low. Thousands of schemas × forty tables is hundreds of thousands of objects, and PostgreSQL's catalogue, `pg_dump` and your migration tool all slow down noticeably. Several hundred tenants is a realistic limit.

      Be honest about why you are choosing it. If the reason is isolation, database-per-tenant gives you more; if the reason is cost, shared schema gives you more. It fits when the tenant count is small and bounded — an enterprise product with fifty customers — and rarely otherwise.
  - term: database per tenant
    short: Each tenant gets its own database. The strongest isolation, the simplest restore, and a cost that scales with your customer count.
    see: [ tenant catalogue, noisy neighbour, data residency, cost per tenant ]
    detail: |-
      A leak now requires connecting to the wrong database, which is a very different class of mistake from forgetting a `WHERE` clause.

      | What it unlocks | Detail |
      | --- | --- |
      | Per-tenant restore | point-in-time restore of one customer, with no effect on anyone else |
      | Data residency | that tenant's database lives in their region, full stop |
      | Per-tenant encryption keys | including customer-managed keys, which some contracts require |
      | Noisy neighbour | contained by construction |
      | Offboarding | hand over a backup, then drop the database |

      | What it costs | Detail |
      | --- | --- |
      | Money | a floor price per database; 2,000 idle tenants still cost 2,000 databases |
      | Migrations | N runs, with partial failure and version skew to manage |
      | Connections | a pool per tenant, so an app instance cannot hold them all open |
      | Onboarding | minutes to provision, not milliseconds |
      | Cross-tenant reporting | needs a separate warehouse — you cannot `GROUP BY` across databases |

      Elastic pools and serverless tiers soften the cost by sharing compute across many small databases, which is what makes this viable at a few thousand tenants rather than a few hundred.
  - term: pooled model
    short: Tenants grouped into a handful of shared-schema databases, with the option to promote a big tenant to its own. Where most SaaS converges.
    see: [ tenant catalogue, shared schema, database per tenant, noisy neighbour ]
    detail: |-
      The insight is that isolation does not have to be uniform. Small tenants share, big or demanding ones do not, and the code is identical in both cases because routing is a catalogue lookup.

      | Decision | Typical |
      | --- | --- |
      | Tenants per shard | 100–1,000, sized by the blast radius you accept |
      | Assignment | least-loaded at signup, not a hash — you want to be able to move tenants |
      | Promotion trigger | a tenant exceeding a share of shard resources, or buying an isolation tier |
      | Migration fan-out | one run per shard — tens, not thousands |
      | Rebalancing | copy, verify, flip the catalogue row, keep the old copy for a day |

      Do not hash tenants to shards. A hash is one line of code and makes moving a tenant impossible without changing the function, which is exactly the operation you will need most. An explicit mapping row is the whole point.

      The price is machinery: the catalogue, a per-shard migration runner, and tooling to move a tenant between shards with verification. Build the catalogue early — even a single-shard system with a catalogue can become a pooled one without touching application code.
  - term: tenant catalogue
    short: The small shared table mapping each tenant to where it lives, plus its plan, region and status. The one piece every strategy needs.
    see: [ pooled model, tenant resolution, provisioning ]
    detail: |-
      It is a routing table, and it is the thing that makes changing strategy later a configuration change rather than a rewrite.

      ```
      tenant_id | slug    | shard      | status    | region  | plan
      ----------+---------+------------+-----------+---------+-------
       a1f2…    | acme    | shard-01   | active    | eu-west | pro
       b3c4…    | globex  | dedicated  | active    | us-east | enterprise
       c5d6…    | initech | shard-02   | suspended | eu-west | free
      ```

      | Operational note | Guidance |
      | --- | --- |
      | It is on every request path | cache it aggressively, with a short TTL and an explicit invalidation on change |
      | It is a single point of failure | replicate it; a catalogue outage is a total outage |
      | It holds no tenant data | just routing and status — keep it that way |
      | `status` is load-bearing | suspended, migrating and read-only all need to be honoured before any query runs |

      Build this on day one even with a single shared database, where every row says `shard-01`. It costs an afternoon, and it is the difference between "add a shard" and "re-architect".
  - term: noisy neighbour
    short: One tenant consuming shared resources and degrading everyone else. The problem isolation is really protecting against.
    see: [ per-tenant limits, pooled model, database per tenant ]
    detail: |-
      It is rarely malice. It is a customer importing three years of history, or running an unbounded report, or integrating badly.

      | Resource | How one tenant exhausts it | Mitigation |
      | --- | --- | --- |
      | Connection pool | a long transaction holds connections | per-tenant concurrency limits, short statement timeouts |
      | CPU and I/O | a big import or a missing index | separate shard, resource governor, async job queue per tenant |
      | Cache | a large tenant evicts everyone else's hot keys | per-tenant cache budgets or key prefixes with separate limits |
      | Background workers | 10,000 queued jobs from one tenant | fair queuing — round-robin across tenants, not FIFO |
      | Rate limits | one tenant uses the global budget | limit per tenant, never globally — see the rate limiting page |

      The one most teams miss is **fair queuing** in background work. A FIFO queue means one tenant's bulk import delays every other tenant's exports for an hour, and no amount of database isolation helps. Round-robin over tenants with a per-tenant cap fixes it.

      Measure per tenant before you need to: queries, CPU seconds, queue depth, storage. Without those metrics the answer to "who is causing this?" is a guess, and the answer to "should this tenant be promoted to its own database?" is unknowable.
  - term: per-tenant migration
    short: Running schema changes across N schemas or N databases. The hidden operational cost that caps how far the isolated models scale.
    see: [ schema per tenant, database per tenant, pooled model ]
    detail: |-
      With a shared schema a release is one migration. With 2,000 tenant databases it is 2,000, some of which will fail, while the application is running code that expects the new shape.

      | Problem | Approach |
      | --- | --- |
      | It takes hours | run in parallel with a bounded worker pool, and make it resumable |
      | Some fail | record a schema version per tenant, retry only the failures |
      | Version skew while it runs | **expand and contract**: deploy code that works with both shapes, migrate, then remove the old path |
      | A tenant is mid-migration | the catalogue `status` gates traffic for that tenant only |
      | New tenants during a release | provision from the latest schema, not from a stale template |

      Expand and contract is not optional here. A release that requires every tenant to be migrated before any request can be served is a release with an outage in it, and with thousands of tenants that outage is measured in hours.

      Track a schema version per tenant in the catalogue and alert on drift. A tenant that silently missed three migrations is a bug report you will receive in six months and will not be able to reproduce.
  - term: restore granularity
    short: Can you restore one tenant to yesterday without touching anyone else? Nobody asks until a customer deletes something important.
    see: [ shared schema, database per tenant, tenant lifecycle ]
    detail: |-
      This is the question that most often changes an architecture decision after the fact, because the answer in a shared schema is genuinely bad.

      | Model | Restoring one tenant |
      | --- | --- |
      | Shared schema | restore the whole backup to a side instance, extract that tenant's rows, reconcile identity columns and foreign keys, re-import. Hours, and risky. |
      | Schema per tenant | restore one schema from a dump. Straightforward. |
      | Database per tenant | point-in-time restore of one database. Minutes, and routine. |
      | Pooled | restore the shard to a side instance, then extract as above — but across hundreds of tenants, not thousands. |

      Two cheap mitigations for a shared schema, worth adding early: **soft deletes** with a retention window, so the common case ("we deleted the wrong project") never needs a restore at all; and a per-tenant **export** endpoint you can also use as the input to a re-import.

      Whatever your model, rehearse it. A restore procedure nobody has run is a document, not a capability, and you will be reading it for the first time during an incident with a customer on the phone.
  - term: data residency
    short: Contractual or legal requirements that a tenant's data stays in a region. A requirement that effectively picks your strategy for you.
    see: [ database per tenant, tenant catalogue, tenant lifecycle ]
    detail: |-
      If one tenant's data must stay in the EU, that tenant cannot share a database with a tenant whose data is in the US. The isolation boundary and the geography boundary have to agree.

      | Requirement | Implies |
      | --- | --- |
      | Region per tenant | at minimum a shard per region; realistically a database per tenant for the strict ones |
      | Customer-managed encryption keys | database per tenant — you cannot key one table by row |
      | "Not physically co-located with competitors" | database per tenant, and a diagram for the auditor |
      | Right to erasure within 30 days | deleting rows is enough, but backups must age out too |

      Keep the region in the tenant catalogue and resolve it before any data access, including in background jobs and in the analytics pipeline — the warehouse is where residency rules are most often quietly broken.

      Watch the edges: logs, traces, metrics, email, exports and support tooling all carry tenant data out of the region if nobody checks. A compliant database behind a global log aggregator is not compliant.
  - term: tenant-aware caching
    short: Every cache key carries the tenant. Miss this and you serve one customer's data to another from memory rather than from the database.
    see: [ per-tenant limits, noisy neighbour, global query filter ]
    detail: |-
      The database defences do not reach the cache. A correct query whose result is cached under `product:42` is a leak the moment a second tenant asks for product 42.

      ```csharp
      // never
      var key = $"invoice:{id}";
      // always
      var key = $"t:{tenant.Id}:invoice:{id}";
      ```

      | Also carries tenant state | Watch for |
      | --- | --- |
      | In-memory caches | a static dictionary with no tenant in the key — the classic |
      | Output and response caches | `VaryBy` must include the tenant |
      | CDN | never cache an authenticated multi-tenant response as `public` |
      | Compiled queries and lookups | reference data that differs per tenant |
      | Background job state | a worker reusing a cached tenant context between jobs |

      Enforce it rather than remembering it: wrap your cache client so the key is composed from ambient tenant context and a raw key cannot be passed in. Then add a test that fails if any key is produced without a tenant prefix.

      The caching strategies page covers key design in general; the multi-tenant addition is simply that the tenant is never optional.
  - term: per-tenant limits
    short: Quotas and rate limits keyed on the tenant, so one customer cannot consume the capacity the others are paying for.
    see: [ noisy neighbour, tenant catalogue, cost per tenant ]
    detail: |-
      A global rate limit protects the system and distributes the pain randomly. A per-tenant limit protects tenants from each other, which is the thing you actually promised.

      | Limit | Keyed on | Typical |
      | --- | --- | --- |
      | API requests | tenant, then plan | 60/min free, 600/min pro, negotiated for enterprise |
      | Concurrent heavy jobs | tenant | 1–5, whatever the plan says |
      | Storage | tenant | soft limit with an alert, hard limit at 2x |
      | Background queue share | tenant | fair round-robin, with a cap per tenant |
      | Query timeout | tenant tier | shorter on shared shards than on dedicated |

      The tenant id is the natural counter key, and the plan from the catalogue is the natural limit — which makes the whole thing a lookup plus a token bucket. The rate limiting page covers the algorithms; here the only addition is that the key must be the tenant and the limit must come from the tenant's plan.

      Return limit headers and expose usage in the product. A tenant that can see it is approaching a limit upgrades; a tenant that is silently throttled files a support ticket saying your product is slow.
  - term: provisioning
    short: Creating everything a new tenant needs. Cheap in a shared schema, a workflow of its own once tenants get their own storage.
    see: [ tenant catalogue, database per tenant, tenant lifecycle ]
    detail: |-
      Onboarding cost is a direct function of the strategy, and it determines whether self-service signup is even possible.

      | Model | Onboarding | Self-service? |
      | --- | --- | --- |
      | Shared schema | an `INSERT` — milliseconds | yes, trivially |
      | Schema per tenant | create schema, run migrations — seconds | yes, with a progress screen |
      | Database per tenant | provision, migrate, seed — minutes | only asynchronously |
      | Pooled | pick a shard, insert — milliseconds | yes |

      Make provisioning idempotent and resumable. It is a multi-step workflow that creates a database, runs migrations, seeds reference data, creates the first admin user and sends an email — and it will fail halfway at some point. A durable workflow fits this exactly.

      Seed data deserves attention: every tenant needs the same reference data, and divergence between what provisioning creates today and what it created two years ago is a long-lived source of bugs. Derive seeds from the same migrations, not from a copied template database.
  - term: tenant lifecycle
    short: Suspend, reactivate, export, delete. The operations nobody designs up front and everybody needs within the first year.
    see: [ tenant catalogue, restore granularity, data residency ]
    detail: |-
      A tenant is not just created. It stops paying, comes back, asks for its data, or demands deletion — and each of those is a code path.

      | State | Behaviour |
      | --- | --- |
      | `active` | normal |
      | `suspended` | no API access, data retained, billing stopped — usually reversible for 30–90 days |
      | `read-only` | past the plan limit or in a payment dispute; exports still work |
      | `migrating` | being moved between shards; writes paused or dual-written |
      | `pending-deletion` | a grace period, then hard delete |

      Honour the status <em>before</em> the query, in the same middleware that resolves the tenant. A suspended tenant whose background jobs keep running is a billing problem and sometimes a legal one.

      Build export early. It is required for GDPR-style portability, it is the best possible answer to "can we have our data?", and it doubles as your per-tenant backup in a shared-schema system where a real restore is hard.

      Deletion must cover backups, logs, caches, search indexes, the warehouse and any third-party processor. "We deleted the rows" is not deletion, and the gap between those two statements is where compliance findings come from.
  - term: cost per tenant
    short: What one tenant costs you per month. The number that decides whether your pricing works and which tenants deserve isolation.
    see: [ pooled model, database per tenant, per-tenant limits ]
    detail: |-
      Isolation is bought with money, so the decision needs an actual figure rather than a preference.

      | Model | Rough floor per tenant per month |
      | --- | --- |
      | Shared schema | cents — storage and a share of compute |
      | Pooled (200 per shard) | a few cents to a euro |
      | Schema per tenant | similar to pooled, plus migration time |
      | Database per tenant (elastic pool) | a few euros |
      | Database per tenant (provisioned) | tens of euros — whether or not the tenant logs in |

      The arithmetic that matters: a free tier on database-per-tenant at, say, €15 a month means 1,000 free tenants cost €15,000 a month before anyone pays you. That single calculation is why free and small tenants live in pools and only paying enterprise customers get dedicated storage.

      Instrument it: storage, queries, CPU seconds, egress and background job time per tenant. Without those, pricing is guesswork and "this customer is unprofitable" is an opinion. The back-of-the-envelope page covers how to turn these per-unit numbers into a monthly figure before you build anything.
commands:
  heading: Code & syntax
  tocLabel: Code & syntax
  groups:
    - group: Resolving the tenant
      items:
        - lang: csharp
          code: |-
            app.Use(async (ctx, next) =>
            {
                var fromToken = ctx.User.FindFirstValue("tid");
                var fromHost  = ctx.Request.Host.Host.Split('.') is [var slug, _, _] ? slug : null;

                if (fromToken is null) { ctx.Response.StatusCode = 401; return; }
                if (fromHost is not null && !string.Equals(fromHost, fromToken, StringComparison.OrdinalIgnoreCase))
                { ctx.Response.StatusCode = 403; return; }          // host and token disagree

                ctx.RequestServices.GetRequiredService<TenantContext>().Set(fromToken);
                await next();
            });
          what: Trust the signed token, treat the URL as a claim to verify. An unresolved tenant is a hard failure, never a default.
        - lang: python
          code: |-
            @asynccontextmanager
            async def tenant_connection(pool, tenant_id: UUID):
                async with pool.connection() as conn:
                    # set once per checkout; every RLS policy reads it on every statement
                    await conn.execute("SELECT set_config('app.tenant_id', %s, false)", (str(tenant_id),))
                    try:
                        yield conn
                    finally:
                        await conn.execute("SELECT set_config('app.tenant_id', '', false)")
          what: "The reset in `finally` is the important half: pooled connections are reused, and a stale `app.tenant_id` is a cross-tenant data leak."
        - lang: python
          code: |-
            current_tenant: ContextVar[Tenant] = ContextVar("current_tenant")

            @app.middleware("http")
            async def resolve_tenant(request: Request, call_next):
                slug = request.headers.get("host", "").split(".")[0]
                tenant = await tenants.get(slug)
                if tenant is None:
                    return JSONResponse({"error": "unknown tenant"}, status_code=404)

                token = current_tenant.set(tenant)      # ContextVar survives await, unlike a global
                try:
                    return await call_next(request)
                finally:
                    current_tenant.reset(token)         # never leak a tenant into the next request
          what: "A `ContextVar` is the asyncio-safe equivalent of an AsyncLocal: a module-level global would leak one tenant’s context into another’s request."
        - lang: csharp
          code: |-
            builder.Services.AddMultiTenant<AppTenantInfo>()
                .WithHostStrategy("__tenant__.*")
                .WithClaimStrategy("tid")
                .WithEFCoreStore<CatalogueDbContext, AppTenantInfo>()
                .WithPerTenantAuthentication();
          what: Finbuckle.MultiTenant packages resolution, the catalogue store and per-tenant options if you would rather not hand-roll it.
    - group: "Shared schema: filter, index, and the database backstop"
      items:
        - lang: csharp
          code: |-
            protected override void OnModelCreating(ModelBuilder b)
            {
                b.Entity<Invoice>().HasQueryFilter(i => i.TenantId == _tenant.Id);
                b.Entity<Invoice>().HasIndex(i => new { i.TenantId, i.CreatedAt });   // tenant first
            }
          what: The filter is applied to every LINQ query. The index order is what keeps it fast with thousands of tenants.
        - lang: csharp
          code: |-
            public override int SaveChanges()
            {
                foreach (var e in ChangeTracker.Entries<ITenantOwned>().Where(e => e.State == EntityState.Added))
                    e.Entity.TenantId = _tenant.Id;                 // never trust the caller to set it
                return base.SaveChanges();
            }
          what: Stamp the tenant on insert. A client-supplied `tenantId` in a request body is an attack, not a convenience.
        - lang: sql
          code: |-
            ALTER TABLE invoices ENABLE ROW LEVEL SECURITY;
            ALTER TABLE invoices FORCE  ROW LEVEL SECURITY;
            CREATE POLICY tenant_isolation ON invoices
              USING (tenant_id = current_setting('app.tenant_id', true)::uuid);
          what: "The backstop: raw SQL, Dapper, a stored procedure or a psql session all get filtered. `FORCE` makes it apply to the table owner too."
        - lang: sql
          code: |-
            -- must run on every pooled connection checkout, not once at startup
            SELECT set_config('app.tenant_id', @tenantId, false);
          what: "The classic row-level-security bug: a pooled connection keeps the previous request's tenant setting."
        - lang: sql
          code: |-
            ALTER TABLE order_lines
              ADD CONSTRAINT fk_order_lines_order
              FOREIGN KEY (tenant_id, order_id) REFERENCES orders (tenant_id, id);
          what: A composite foreign key makes a cross-tenant reference a constraint violation instead of a leak.
    - group: Schema and database per tenant
      items:
        - lang: csharp
          code: |-
            protected override void OnModelCreating(ModelBuilder b)
                => b.HasDefaultSchema(_tenant.Schema);              // "acme", "globex", …
          what: "Schema per tenant: no tenant column and no filter, because the namespace does the work."
        - lang: csharp
          code: |-
            builder.Services.AddDbContext<AppDbContext>((sp, o) =>
            {
                var tenant = sp.GetRequiredService<TenantContext>().Current;
                o.UseNpgsql(tenant.ConnectionString);               // from the catalogue
            });
          what: "Database per tenant: isolation is the connection string, resolved per request from the catalogue."
        - lang: csharp
          code: |-
            await Parallel.ForEachAsync(tenants, new ParallelOptions { MaxDegreeOfParallelism = 8 },
                async (t, ct) =>
                {
                    await using var db = Factory.For(t);
                    await db.Database.MigrateAsync(ct);
                    await catalogue.RecordSchemaVersionAsync(t.Id, CurrentVersion, ct);  // track drift
                });
          what: "The per-tenant migration runner: bounded parallelism, resumable, and a recorded version per tenant so failures can be retried alone."
    - group: The catalogue and pooled routing
      items:
        - lang: sql
          code: |-
            CREATE TABLE tenants (
              tenant_id  uuid PRIMARY KEY,
              slug       text UNIQUE NOT NULL,
              shard      text NOT NULL,              -- 'shard-01' or 'dedicated'
              status     text NOT NULL,              -- active | suspended | read-only | migrating
              region     text NOT NULL,
              plan       text NOT NULL,
              schema_version int NOT NULL
            );
          what: The whole routing layer. Build it on day one, even when every row says `shard-01`.
        - lang: csharp
          code: |-
            var tenant = await cache.GetOrCreateAsync($"tenant:{slug}",
                async _ => await catalogue.FindAsync(slug), TimeSpan.FromMinutes(5));

            if (tenant.Status is "suspended") return Results.StatusCode(402);
            if (tenant.Status is "migrating") return Results.StatusCode(503);
          what: The catalogue is on every request, so cache it — and honour the status before any query runs.
        - code: |-
            # move a tenant between shards
            1. set status = 'migrating'        # writes pause or dual-write
            2. copy rows to the target shard
            3. verify counts and checksums
            4. update shard, set status = 'active'
            5. keep the source rows for 24 h, then drop
          what: The operation that justifies an explicit mapping instead of hashing tenants to shards.
    - group: Everything else that must be tenant-aware
      items:
        - lang: csharp
          code: var key = $"t:{tenant.Id}:invoice:{id}";               // never "invoice:{id}"
          what: The cache does not inherit your query filter. Wrap the cache client so a key without a tenant cannot be built.
        - code: |-
            <rate-limit-by-key calls="600" renewal-period="60"
                counter-key="@(context.Request.Headers.GetValueOrDefault("X-Tenant-Id",""))" />
          what: Limit per tenant, with the number from the tenant's plan. A global limit lets one tenant spend everyone's budget.
        - lang: csharp
          code: |-
            using var _ = logger.BeginScope(new Dictionary<string, object> { ["TenantId"] = tenant.Id });
            Meter.CreateCounter<long>("api.requests").Add(1, new KeyValuePair<string, object?>("tenant", tenant.Id));
          what: Per-tenant logs and metrics are how you answer "who is causing this?" and "should this tenant be promoted?"
        - lang: csharp
          code: |-
            // background jobs have no request, so nothing resolves the tenant for you
            foreach (var tenantId in await catalogue.ActiveTenantIdsAsync(ct))
            {
                using var scope = scopeFactory.CreateScope();
                scope.ServiceProvider.GetRequiredService<TenantContext>().Set(tenantId);
                await DoWorkAsync(scope.ServiceProvider, ct);
            }
          what: "The most common leak after raw SQL: a job running with no tenant in scope, so the filter evaluates against nothing."
prosCons:
  good:
    heading: Pros of sharing more
    items:
      - Cost per tenant falls to cents, which is what makes a free tier and small customers viable.
      - One migration, one backup, one set of dashboards — operations do not grow with the customer count.
      - Onboarding is an `INSERT`, so self-service signup is instant.
      - Cross-tenant reporting and analytics are ordinary queries.
      - Capacity is pooled, so one tenant's quiet week pays for another's busy one.
      - One code path for everybody, so a bug is found once and fixed once.
  bad:
    heading: Cons of sharing more
    items:
      - Isolation rests on a predicate, and one forgotten filter is a cross-tenant data breach.
      - A noisy neighbour degrades everyone, with no structural defence.
      - Restoring a single tenant means extracting rows from a full backup.
      - Per-tenant residency, encryption keys and some compliance answers are simply unavailable.
      - One incident has every customer in its blast radius.
      - Enterprise deals stall on "is our data in the same table as theirs?", and the honest answer is yes.
when:
  note: Start shared, build the catalogue anyway, and isolate the tenants who pay for it.
  good:
    heading: Share more when…
    items:
      - Tenants are numerous and small, and many will never pay you anything.
      - Cost per tenant has to be measured in cents for the pricing to work.
      - Self-service signup must be instant.
      - No contract requires residency, separate keys or physical separation.
      - Cross-tenant analytics are a product feature rather than an afterthought.
      - Your team is small and cannot operate thousands of databases.
  bad:
    heading: Isolate more when…
    items:
      - A contract requires data residency or customer-managed keys. Use **database per tenant**.
      - Tenants differ in size by orders of magnitude. Use **pools plus promotion**.
      - Restoring one customer must be routine. Use **database per tenant**.
      - One incident affecting every customer is unacceptable. Use **sharded pools** to bound it.
      - Tenants are few, large and pay enough to cover the cost. Dedicated storage is affordable and simpler to reason about.
      - Regulation demands a separation you can draw for an auditor. A `WHERE` clause will not survive the meeting.
useCases:
  - title: A new SaaS with a free tier
    body: "Thousands of signups, most of which never become paying customers. Shared schema with row-level security: a tenant costs cents, onboarding is instant, and a free tenant that never logs in again costs nothing. A tenant catalogue is built on day one with every row pointing at the single shard, so pools are a configuration change later."
  - title: Enterprise customer demanding isolation
    body: "A bank will sign a seven-figure contract if its data is in its own database, in the EU, with a customer-managed key. The tenant is promoted from a shard to a dedicated database: the catalogue row changes, the application code does not, and 20,000 other tenants stay pooled."
  - title: The import that took everyone down
    body: "One customer uploads three years of history. A FIFO job queue means every other tenant's exports sit behind it for an hour, and the connection pool is exhausted by long transactions. The fix is per-tenant: fair round-robin queuing, a cap on concurrent heavy jobs, and a statement timeout — none of which is about the database layout."
  - title: "\"Can you restore our data to Tuesday?\""
    body: A customer deletes a project and asks for a restore. In a shared schema this means restoring the full backup to a side instance and extracting one tenant's rows, so the team ships soft deletes with a 30-day window instead — which turns the common case into an `UPDATE` and leaves true restores for genuine disasters.
  - title: Outgrowing one database
    body: At 40,000 tenants one PostgreSQL instance is at its limit and every incident affects every customer. Tenants are split across eight shards of 5,000, assigned least-loaded at signup rather than by hash so they can be moved. Migrations go from one run to eight, and the blast radius of an incident drops by 87%.
gotchas:
  items:
    - mistake: Raw SQL bypassing the query filter
      why: A report needs a window function, so it uses `FromSqlRaw` or Dapper. Global query filters do not apply, nothing errors, and the report quietly returns every tenant's rows to whoever opened it.
      fix: enable row-level security so the database enforces the predicate whatever issued the statement. Failing that, ban raw SQL outside an audited helper that takes the tenant as a required parameter.
    - mistake: Background jobs with no tenant in scope
      why: A nightly job runs outside a request, so nothing resolved a tenant. The filter compares against an empty context and either returns nothing or — worse, with a nullable comparison — everything.
      fix: make tenant context required rather than optional, so an unset tenant throws. Loop over tenants explicitly, creating a scope and setting the tenant for each one.
    - mistake: Row-level security and connection pooling
      why: "`set_config` runs once when the connection opens rather than on every checkout. A pooled connection carries the previous request's tenant, so one tenant occasionally sees another's data — intermittently, under load, and impossible to reproduce locally."
      fix: set the tenant setting on every checkout, in a connection interceptor, and assert it matches the ambient tenant before executing. Test it with a pool size of one and concurrent requests.
    - mistake: Cache keys without the tenant
      why: Every query is correctly filtered, then the result is cached under `product:42`. The second tenant to ask for product 42 gets the first tenant's data out of memory, and no database control can see it happen.
      fix: compose keys from ambient tenant context inside a cache wrapper so a raw key cannot be passed. Add a test asserting every key produced starts with the tenant prefix.
    - mistake: Trusting a tenant id from the request body
      why: An endpoint accepts `tenantId` in the payload "for flexibility". Changing one field in a request now reads or writes another customer's data.
      fix: the tenant comes from the signed token only. Stamp it server-side on insert, ignore it on input, and return `403` when a supplied tenant disagrees with the resolved one.
    - mistake: Indexes without the tenant first
      why: "`CREATE INDEX ON invoices (created_at)` looks right and performs fine with ten tenants. At five thousand, every tenant's query scans everyone else's rows before filtering, and the whole system slows together."
      fix: "`tenant_id` is the first column of essentially every index. Review the plans with production-like tenant counts, not with your seed data."
    - mistake: Hashing tenants to shards
      why: "`shard = hash(tenantId) % 8` is one line and makes moving a tenant impossible without rehashing everyone — which is exactly what you need when one tenant outgrows its shard or buys isolation."
      fix: store the mapping explicitly in the catalogue. Assign least-loaded at signup, and keep the ability to change one row to move one tenant.
    - mistake: No plan for per-tenant migrations
      why: Schema- or database-per-tenant is chosen for isolation, and the first release that touches the schema takes four hours, fails for 3% of tenants and leaves the fleet on two different versions.
      fix: expand and contract so both shapes work during the rollout, a resumable runner with bounded parallelism, a recorded schema version per tenant, and an alert on drift.
    - mistake: Deletion that only deletes rows
      why: A tenant exercises its right to erasure. The rows go, and the data stays in backups, logs, the search index, the warehouse and three third-party processors.
      fix: write down everywhere tenant data lands, and make deletion a workflow across all of them with a backup retention window the contract reflects. Rehearse it before you are asked.
alternatives:
  columns: [ Approach, Best for, Isolation, Cost per tenant, Key difference ]
  rows:
    - cells:
        - "**Shared schema**"
        - many small tenants, free tiers
        - a predicate
        - cents
        - Cheapest and simplest; one forgotten filter is a breach
    - cells:
        - "**Schema per tenant**"
        - a small, bounded tenant count
        - a namespace
        - low
        - Removes the filter, adds N migrations; squeezed from both sides at scale
    - cells:
        - "**Database per tenant**"
        - few, large, regulated tenants
        - a connection
        - tens of euros
        - Residency, per-tenant keys and trivial restores; you pay for idle tenants
    - self: true
      cells:
        - "**Sharded pools**"
        - most SaaS at scale
        - per shard, per tenant
        - cents
        - Blast radius chosen per tenant; needs a catalogue and move tooling
    - cells:
        - "**Single-tenant deployments**"
        - on-premises and air-gapped customers
        - total — whole stack
        - very high
        - "Not multitenancy at all: N installations, N upgrades, N on-call surfaces"
    - cells:
        - "**Cell-based architecture**"
        - very large platforms
        - per cell
        - low
        - Shards the <em>entire stack</em>, not just the database; the ceiling above pools
    - cells:
        - "**Namespace per tenant (Kubernetes)**"
        - isolating compute, not data
        - per namespace
        - medium
        - Solves the noisy neighbour at the compute layer; data isolation is still your problem
  notes:
    - "**Pick shared schema** to start, and add row-level security immediately rather than eventually."
    - "**Pick sharded pools** when one blast radius for every customer stops being acceptable — usually long before you hit a technical limit."
    - "**Pick database per tenant** for the specific customers whose contracts pay for it, not for everyone."
    - "**Consider cell-based architecture** when sharding the database is no longer enough and you need the whole stack partitioned."
    - "**Avoid single-tenant deployments** unless the customer is paying for an installation, because you are agreeing to operate N products."
    - These compose, and the common end state is pools for most tenants, dedicated databases for a handful, and one tenant catalogue routing both.
