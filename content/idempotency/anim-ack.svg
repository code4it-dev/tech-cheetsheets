<svg viewBox="0 0 800 320" role="img" aria-label="A request processed by a receiver whose acknowledgement is lost, leaving the sender unable to distinguish loss from success">
  <defs>
    <marker id="ia-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="ia-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one request, one charge &mdash; and one unreliable network in between</text>

  <rect id="ia-send" x="20" y="60" width="190" height="86" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="115" y="86" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">sender</text>
  <text id="ia-st" x="115" y="108" font-size="10" text-anchor="middle" fill="#5f6f66">about to charge &euro;40</text>
  <text id="ia-st2" x="115" y="126" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="ia-net" x="260" y="60" width="280" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="400" y="86" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">network</text>
  <text id="ia-nt" x="400" y="110" font-size="10.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="ia-nt2" x="400" y="128" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="ia-recv" x="590" y="60" width="190" height="86" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="685" y="86" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">receiver</text>
  <text id="ia-rt" x="685" y="108" font-size="10" text-anchor="middle" fill="#5f6f66">waiting</text>
  <text id="ia-rt2" x="685" y="126" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">charged: &euro;0</text>

  <rect id="ia-panel" x="20" y="172" width="760" height="76" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="194" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">what the sender knows</text>
  <text id="ia-k1" x="40" y="218" font-size="10.5" fill="#5f6f66">it sent a request</text>
  <text id="ia-k2" x="40" y="238" font-size="10.5" fill="#5f6f66">&nbsp;</text>

  <rect id="ia-verd" x="20" y="264" width="760" height="44" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ia-v" x="400" y="290" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">nothing has gone wrong yet</text>
</svg>
