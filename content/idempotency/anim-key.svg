<svg viewBox="0 0 800 320" role="img" aria-label="A client sending an idempotency key, the server recording it, replaying a stored response on retry and blocking a concurrent duplicate">
  <defs>
    <marker id="ik-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="ik-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the key is generated once per <em>operation</em> &mdash; not once per attempt</text>

  <rect id="ik-cli" x="20" y="48" width="180" height="76" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="110" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text id="ik-clit" x="110" y="94" font-size="10" text-anchor="middle" fill="#5f6f66">generating a key</text>
  <text id="ik-clit2" x="110" y="112" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="ik-api" x="240" y="48" width="200" height="76" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="340" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">payments API</text>
  <text id="ik-apit" x="340" y="94" font-size="10" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="ik-apit2" x="340" y="112" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="ik-store" x="480" y="48" width="300" height="76" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="630" y="70" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">idempotency store &mdash; 24 h window</text>
  <text id="ik-s1" x="496" y="92" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">(empty)</text>
  <text id="ik-s2" x="496" y="110" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="ik-eff" x="240" y="152" width="200" height="60" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="340" y="176" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the side effect</text>
  <text id="ik-efft" x="340" y="196" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">charged: &euro;0</text>

  <line x1="204" y1="86" x2="234" y2="86" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ik-arr)"/>
  <line x1="444" y1="86" x2="474" y2="86" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ik-arr)"/>
  <line x1="340" y1="128" x2="340" y2="148" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ik-arr)"/>

  <rect id="ik-panel" x="480" y="152" width="300" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ik-p1" x="496" y="174" font-size="10.5" fill="#5f6f66">attempts received: 0</text>
  <text id="ik-p2" x="496" y="194" font-size="10.5" fill="#5f6f66">charges made: 0</text>

  <rect id="ik-verd" x="20" y="236" width="760" height="68" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ik-v" x="400" y="260" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">the goal: any number of attempts, exactly one charge</text>
  <text id="ik-v2" x="400" y="284" font-size="10.5" text-anchor="middle" fill="#5f6f66">and the same answer returned every time, so the client never has to guess</text>
</svg>
