<svg viewBox="0 0 560 200" role="img" aria-label="A retry arriving inside the dedup window being deduplicated, and one arriving after it being processed again">
  <text x="280" y="22" font-size="11.5" text-anchor="middle" fill="#5f6f66">the window is the correctness boundary, not a storage setting</text>
  <line x1="40" y1="96" x2="520" y2="96" stroke="#a9b5a6" stroke-width="1.5"/>
  <rect id="wn-win" x="40" y="86" width="260" height="20" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
  <text id="wn-wint" x="170" y="100" font-size="9.5" text-anchor="middle" fill="#2f6b3f" font-weight="600">key remembered</text>
  <text x="40" y="124" font-size="9.5" text-anchor="middle" fill="#5f6f66">t=0</text>
  <text x="300" y="124" font-size="9.5" text-anchor="middle" fill="#5f6f66">window ends</text>
  <g id="wn-r1" class="hidden"><circle cx="190" cy="96" r="6" fill="#2f6b3f"/><text x="190" y="76" font-size="9.5" text-anchor="middle" fill="#2f6b3f">retry</text></g>
  <g id="wn-r2" class="hidden"><circle cx="400" cy="96" r="6" fill="#c53b3b"/><text x="400" y="76" font-size="9.5" text-anchor="middle" fill="#c53b3b">retry</text></g>
  <text id="wn-msg" x="280" y="154" font-size="11" text-anchor="middle" fill="#5f6f66">one charge made at t=0, key stored</text>
  <text id="wn-msg2" x="280" y="176" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
</svg>
