<svg viewBox="0 0 800 346" role="img" aria-label="The three delivery semantics, with effectively-once built from at-least-once delivery plus a deduplication store">
  <defs>
    <marker id="id-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">you choose a failure mode, not whether to have one</text>

  <rect x="20" y="40" width="246" height="104" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="143" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">at-most-once</text>
  <text x="143" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">never retry</text>
  <text x="143" y="104" font-size="10.5" text-anchor="middle" fill="#5f6f66">no duplicates, ever</text>
  <text x="143" y="124" font-size="10.5" text-anchor="middle" fill="#c53b3b">silently loses work</text>
  <text x="143" y="138" font-size="9.5" text-anchor="middle" fill="#5f6f66">fine for metrics; never for money</text>

  <rect x="276" y="40" width="246" height="104" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="399" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">at-least-once</text>
  <text x="399" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">retry until acknowledged</text>
  <text x="399" y="104" font-size="10.5" text-anchor="middle" fill="#5f6f66">never loses</text>
  <text x="399" y="124" font-size="10.5" text-anchor="middle" fill="#2f6b3f">duplicates &mdash; and they are detectable</text>
  <text x="399" y="138" font-size="9.5" text-anchor="middle" fill="#5f6f66">the right default</text>

  <rect x="532" y="40" width="248" height="104" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="656" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">exactly-once <em>delivery</em></text>
  <text x="656" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">never lost, never duplicated</text>
  <text x="656" y="110" font-size="13" text-anchor="middle" fill="#c53b3b" font-weight="700">impossible</text>
  <text x="656" y="132" font-size="9.5" text-anchor="middle" fill="#5f6f66">Two Generals &mdash; not an engineering gap</text>

  <text x="400" y="172" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">so build the thing people actually mean</text>
  <line x1="399" y1="148" x2="399" y2="160" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#id-arr)"/>

  <rect x="20" y="186" width="760" height="96" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="400" y="208" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">effectively-once processing</text>
  <rect x="40" y="222" width="212" height="44" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="146" y="240" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">at-least-once delivery</text>
  <text x="146" y="256" font-size="9.5" text-anchor="middle" fill="#5f6f66">retry until acknowledged</text>
  <text x="264" y="248" font-size="13" text-anchor="middle" fill="#5f6f66" font-weight="700">+</text>
  <rect x="280" y="222" width="212" height="44" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="386" y="240" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">a key per operation</text>
  <text x="386" y="256" font-size="9.5" text-anchor="middle" fill="#5f6f66">stable across attempts</text>
  <text x="504" y="248" font-size="13" text-anchor="middle" fill="#5f6f66" font-weight="700">+</text>
  <rect x="520" y="222" width="240" height="44" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="640" y="240" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">a dedup store with a window</text>
  <text x="640" y="256" font-size="9.5" text-anchor="middle" fill="#5f6f66">longer than the retry horizon</text>

  <text class="hand" x="20" y="312" font-size="16" fill="#c53b3b">the delivery is still at-least-once &mdash; you only made the duplicate harmless</text>
  <text x="20" y="336" font-size="10.5" fill="#5f6f66">And the dedup state must be written in the same transaction as the effect, or you have moved the problem rather than solved it.</text>
</svg>
