<svg viewBox="0 0 800 320" role="img" aria-label="A login returning an ID token for the client and an access token for the API, and an ID token being rejected by a correctly configured API">
  <defs>
    <marker id="ot-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="ot-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <text id="ot-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the authorization code flow, with one extra scope: <tspan font-family="Fira Code, monospace">openid</tspan></text>

  <rect id="ot-idp" x="300" y="40" width="200" height="66" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="400" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">identity provider</text>
  <text id="ot-idpt" x="400" y="86" font-size="10" text-anchor="middle" fill="#5f6f66">waiting</text>

  <rect id="ot-app" x="40" y="150" width="200" height="72" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="140" y="174" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">your client app</text>
  <text id="ot-appt" x="140" y="196" font-size="10" text-anchor="middle" fill="#5f6f66">no session yet</text>
  <text id="ot-appt2" x="140" y="212" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="ot-api" x="560" y="150" width="200" height="72" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="660" y="174" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">calendar API</text>
  <text id="ot-apit" x="660" y="196" font-size="10" text-anchor="middle" fill="#5f6f66">expects aud = api://calendar</text>
  <text id="ot-apit2" x="660" y="212" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <g id="ot-id" class="hidden">
    <rect x="40" y="252" width="320" height="46" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text x="200" y="270" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">id_token</text>
    <text id="ot-idt" x="200" y="288" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">aud = your client_id</text>
  </g>
  <g id="ot-at" class="hidden">
    <rect x="440" y="252" width="320" height="46" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
    <text x="600" y="270" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">access_token</text>
    <text id="ot-att" x="600" y="288" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">aud = api://calendar</text>
  </g>

  <line id="ot-a1" class="hidden" x1="340" y1="110" x2="200" y2="146" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ot-arr)"/>
  <line id="ot-a2" class="hidden" x1="460" y1="110" x2="600" y2="146" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ot-arr)"/>
  <g id="ot-bad" class="hidden">
    <line x1="246" y1="186" x2="554" y2="186" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ot-red)"/>
    <text x="400" y="178" font-size="10" text-anchor="middle" fill="#c53b3b" font-weight="600">sending the ID token to the API</text>
  </g>

  <text id="ot-v" x="400" y="130" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-weight="600">one authentication, two credentials with different jobs</text>
</svg>
