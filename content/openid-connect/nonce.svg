<svg viewBox="0 0 560 200" role="img" aria-label="A client checking that the nonce inside an ID token matches the one stored for this login attempt">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">one value, generated by the client, echoed inside the token</text>
  <rect id="nc-cli" x="30" y="46" width="200" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="130" y="68" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">client session</text>
  <text id="nc-clit" x="130" y="88" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">nonce stored: —</text>
  <rect id="nc-tok" x="300" y="46" width="230" height="62" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="415" y="68" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">id_token</text>
  <text id="nc-tokt" x="415" y="88" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">nonce claim: —</text>
  <text id="nc-res" x="280" y="140" font-size="12.5" text-anchor="middle" fill="#5f6f66" font-weight="700">—</text>
  <text id="nc-msg" x="280" y="168" font-size="11" text-anchor="middle" fill="#5f6f66">a fresh random value per login attempt</text>
</svg>
