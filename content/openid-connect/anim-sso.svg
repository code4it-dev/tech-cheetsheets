<svg viewBox="0 0 800 320" role="img" aria-label="One identity provider session giving three applications their own sessions, and the difficulty of logging out of all of them">
  <defs>
    <marker id="os-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="os-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one identity provider, three applications &mdash; and one browser</text>

  <rect id="os-idp" x="290" y="40" width="220" height="74" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="400" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">identity provider</text>
  <text id="os-idpt" x="400" y="86" font-size="10" text-anchor="middle" fill="#5f6f66">no session</text>
  <text id="os-idpt2" x="400" y="102" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="os-a" x="30" y="166" width="220" height="74" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="140" y="190" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">app A &mdash; email</text>
  <text id="os-at" x="140" y="212" font-size="10" text-anchor="middle" fill="#5f6f66">no session</text>

  <rect id="os-b" x="290" y="166" width="220" height="74" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="190" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">app B &mdash; expenses</text>
  <text id="os-bt" x="400" y="212" font-size="10" text-anchor="middle" fill="#5f6f66">no session</text>

  <rect id="os-c" x="550" y="166" width="220" height="74" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="660" y="190" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">app C &mdash; wiki</text>
  <text id="os-ct" x="660" y="212" font-size="10" text-anchor="middle" fill="#5f6f66">no session</text>

  <line id="os-la" class="hidden" x1="340" y1="118" x2="160" y2="162" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#os-arr)"/>
  <line id="os-lb" class="hidden" x1="400" y1="118" x2="400" y2="162" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#os-arr)"/>
  <line id="os-lc" class="hidden" x1="460" y1="118" x2="640" y2="162" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#os-arr)"/>

  <rect id="os-panel" x="30" y="256" width="740" height="52" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="os-p1" x="46" y="278" font-size="11" fill="#23362e" font-weight="700">sessions in existence: 0</text>
  <text id="os-p2" x="46" y="298" font-size="10.5" fill="#5f6f66">nothing has been logged into yet</text>
</svg>
