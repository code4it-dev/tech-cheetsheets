<svg viewBox="0 0 800 342" role="img" aria-label="OpenID Connect shown as a thin identity layer added on top of OAuth 2.0, with the ID token going to the client and the access token to the API">
  <defs>
    <marker id="oi-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">one extra scope, one extra token &mdash; everything underneath is still OAuth</text>

  <rect x="20" y="40" width="760" height="86" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="400" y="62" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">OpenID Connect adds</text>
  <text x="40" y="86" font-size="10.5" fill="#5f6f66"><tspan font-family="Fira Code, monospace">openid</tspan> scope &mdash; turns an authorization request into an authentication request</text>
  <text x="40" y="104" font-size="10.5" fill="#5f6f66"><tspan font-family="Fira Code, monospace">id_token</tspan> &mdash; a signed JWT about <em>the login</em>: who, when, how, for which client</text>
  <text x="440" y="86" font-size="10.5" fill="#5f6f66"><tspan font-family="Fira Code, monospace">nonce</tspan> &nbsp;·&nbsp; UserInfo endpoint &nbsp;·&nbsp; standard claims</text>
  <text x="440" y="104" font-size="10.5" fill="#5f6f66">discovery &nbsp;·&nbsp; JWKS &nbsp;·&nbsp; session management &amp; logout</text>

  <rect x="20" y="138" width="760" height="64" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="160" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">OAuth 2.0 underneath, unchanged</text>
  <text x="400" y="182" font-size="10.5" text-anchor="middle" fill="#5f6f66">authorization code + PKCE &nbsp;·&nbsp; redirect URIs &nbsp;·&nbsp; <tspan font-family="Fira Code, monospace">state</tspan> &nbsp;·&nbsp; token endpoint &nbsp;·&nbsp; refresh tokens &nbsp;·&nbsp; scopes</text>

  <rect x="20" y="222" width="372" height="104" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="206" y="244" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">ID token &rarr; your client</text>
  <text x="36" y="266" font-size="10.5" fill="#5f6f66"><tspan font-family="Fira Code, monospace">aud</tspan> = your client_id</text>
  <text x="36" y="284" font-size="10.5" fill="#5f6f66">answers: who logged in, when, how</text>
  <text x="36" y="302" font-size="10.5" fill="#5f6f66">read it once, create a session, discard it</text>
  <text x="36" y="318" font-size="10.5" fill="#c53b3b">never send it to an API</text>

  <rect x="408" y="222" width="372" height="104" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="594" y="244" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">access token &rarr; the API</text>
  <text x="424" y="266" font-size="10.5" fill="#5f6f66"><tspan font-family="Fira Code, monospace">aud</tspan> = the API's identifier</text>
  <text x="424" y="284" font-size="10.5" fill="#5f6f66">answers: what may the bearer do</text>
  <text x="424" y="302" font-size="10.5" fill="#5f6f66">opaque to your client, by design</text>
  <text x="424" y="318" font-size="10.5" fill="#c53b3b">never parse it for identity</text>
</svg>
