<svg viewBox="0 0 800 300" role="img" aria-label="Clients talk to the Docker daemon, which uses containerd and runc to run containers from local images pulled from a registry">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <g font-size="13" text-anchor="middle" fill="#23362e">
    <rect x="20" y="40" width="140" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="90" y="67">docker CLI</text>
    <rect x="20" y="110" width="140" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="90" y="137">Docker Compose</text>
    <rect x="20" y="180" width="140" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="90" y="207">CI pipeline</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="160" y1="62" x2="213" y2="68"/><line x1="160" y1="132" x2="213" y2="78"/><line x1="160" y1="202" x2="213" y2="86"/>
  </g>
  <text x="90" y="248" font-size="11" text-anchor="middle" fill="#5f6f66">all talk to the daemon's REST API</text>
  <!-- host -->
  <rect x="200" y="15" width="400" height="270" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="34" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Docker host · one Linux kernel</text>
  <g font-size="13" text-anchor="middle" fill="#23362e">
    <rect x="215" y="48" width="170" height="48" rx="6" fill="#f9e3df" stroke="#c53b3b"/><text x="300" y="68" font-weight="600">dockerd</text><text x="300" y="86" font-size="10.5" fill="#5f6f66">images · networks · volumes</text>
    <rect x="215" y="112" width="170" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6"/><text x="300" y="137">containerd</text>
    <rect x="215" y="168" width="170" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6"/><text x="300" y="187">runc</text><text x="300" y="201" font-size="11" fill="#5f6f66">creates the isolated process</text>
    <rect x="215" y="224" width="170" height="46" rx="6" fill="#fbf3c4" stroke="#d9c25a"/><text x="300" y="244">volumes · networks</text><text x="300" y="261" font-size="11" fill="#5f6f66">data and connectivity</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="300" y1="96" x2="300" y2="110"/><line x1="300" y1="152" x2="300" y2="166"/>
  </g>
  <rect x="405" y="48" width="180" height="70" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="495" y="70" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Images</text>
  <g fill="#fbfcf8" stroke="#a9b5a6"><rect x="425" y="80" width="140" height="9"/><rect x="425" y="91" width="140" height="9"/><rect x="425" y="102" width="140" height="9"/></g>
  <rect x="405" y="134" width="180" height="136" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="495" y="155" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Containers</text>
  <g font-size="12" text-anchor="middle" font-family="Fira Code, monospace" fill="#23362e">
    <rect x="420" y="166" width="150" height="26" rx="4" fill="#fbfcf8" stroke="#2f6b3f"/><text x="495" y="184">web (nginx)</text>
    <rect x="420" y="199" width="150" height="26" rx="4" fill="#fbfcf8" stroke="#2f6b3f"/><text x="495" y="217">api (python)</text>
    <rect x="420" y="232" width="150" height="26" rx="4" fill="#fbfcf8" stroke="#2f6b3f"/><text x="495" y="250">cache (redis)</text>
  </g>
  <line x1="385" y1="188" x2="418" y2="200" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- registry -->
  <rect x="630" y="48" width="155" height="70" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="707" y="73" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Registry</text>
  <text x="707" y="92" font-size="11" text-anchor="middle" fill="#5f6f66">Docker Hub, GHCR, ECR, ACR</text>
  <line x1="628" y1="76" x2="587" y2="76" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="587" y1="96" x2="628" y2="96" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="607" y="130" font-size="11" text-anchor="middle" fill="#5f6f66">pull / push</text>
  <text class="hand" x="620" y="200" font-size="16" fill="#c53b3b">image = class</text>
  <text class="hand" x="620" y="222" font-size="16" fill="#c53b3b">container = object</text>
</svg>
