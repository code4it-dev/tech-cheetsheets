<svg viewBox="0 0 800 320" role="img" aria-label="Animated walk-through of docker run">
  <rect id="d-cli" x="20" y="120" width="130" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="85" y="146" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">docker CLI</text>
  <text x="85" y="165" font-size="12" text-anchor="middle" fill="#5f6f66">your terminal</text>
  <rect id="d-daemon" x="200" y="110" width="160" height="80" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="280" y="136" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">dockerd</text>
  <text id="d-daemon-l" x="280" y="172" font-size="12" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">idle</text>
  <rect id="d-reg" x="410" y="15" width="170" height="75" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="495" y="36" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Docker Hub</text>
  <text x="495" y="54" font-size="11" text-anchor="middle" fill="#5f6f66">library/nginx</text>
  <rect id="d-img" x="410" y="110" width="170" height="80" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="495" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Local images</text>
  <text id="d-img-t" x="495" y="180" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">python, redis</text>
  <g id="d-layers" class="hidden" fill="#f6e05e" stroke="#8a6a0c">
    <rect x="440" y="62" width="34" height="14" rx="2"/><rect x="478" y="62" width="34" height="14" rx="2"/><rect x="516" y="62" width="34" height="14" rx="2"/>
  </g>
  <!-- container -->
  <rect id="d-ctr" class="hidden" x="620" y="15" width="165" height="255" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g id="d-ctr-title" class="hidden"><text x="702" y="36" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">container</text></g>
  <g font-size="11.5" text-anchor="middle" fill="#23362e">
    <g id="d-img-l" class="hidden"><rect x="632" y="196" width="141" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="702" y="212">image layers (read-only)</text></g>
    <g id="d-rw" class="hidden"><rect x="632" y="166" width="141" height="24" rx="4" fill="#fbf3c4" stroke="#d9c25a"/><text x="702" y="182">writable layer</text></g>
    <g id="d-ns" class="hidden"><rect x="632" y="50" width="141" height="24" rx="4" fill="#fbfcf8" stroke="#2f6b3f"/><text x="702" y="66" font-size="9.5">namespaces: pid, net, mnt</text></g>
    <g id="d-cg" class="hidden"><rect x="632" y="80" width="141" height="24" rx="4" fill="#fbfcf8" stroke="#2f6b3f"/><text x="702" y="96">cgroups: CPU, memory</text></g>
    <g id="d-proc" class="hidden"><rect x="632" y="120" width="141" height="34" rx="4" fill="#2f6b3f"/><text x="702" y="142" fill="#fbfcf8" font-family="Fira Code, monospace" font-size="12">nginx · PID 1</text></g>
    <g id="d-port" class="hidden"><rect x="632" y="232" width="141" height="26" rx="13" fill="#c53b3b"/><text x="702" y="249" fill="#fbfcf8" font-family="Fira Code, monospace" font-size="11.5">host :8080 → :80</text></g>
  </g>
  <g id="d-cmd" class="hidden">
    <rect x="20" y="205" width="205" height="30" rx="15" fill="#c53b3b"/>
    <text x="122" y="225" font-size="11.5" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">run -p 8080:80 nginx</text>
  </g>
  <text id="d-note" class="hand hidden" x="20" y="300" font-size="16" fill="#c53b3b">curl localhost:8080 → "Welcome to nginx!"</text>
</svg>
