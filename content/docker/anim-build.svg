<svg viewBox="0 0 800 310" role="img" aria-label="Animated walk-through of Dockerfile instructions becoming cached image layers">
  <rect x="20" y="20" width="350" height="250" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="36" y="42" font-size="12" fill="#5f6f66">Dockerfile</text>
  <g font-size="12.5" font-family="Fira Code, monospace" fill="#23362e">
    <rect id="b-l1" x="30" y="52" width="330" height="28" rx="3" fill="#fbfcf8"/><text x="40" y="71">FROM python:3.13-slim</text>
    <rect id="b-l2" x="30" y="86" width="330" height="28" rx="3" fill="#fbfcf8"/><text x="40" y="105">WORKDIR /app</text>
    <rect id="b-l3" x="30" y="120" width="330" height="28" rx="3" fill="#fbfcf8"/><text x="40" y="139">COPY requirements.txt .</text>
    <rect id="b-l4" x="30" y="154" width="330" height="28" rx="3" fill="#fbfcf8"/><text x="40" y="173">RUN pip install -r requirements.txt</text>
    <rect id="b-l5" x="30" y="188" width="330" height="28" rx="3" fill="#fbfcf8"/><text x="40" y="207">COPY . .</text>
    <rect id="b-l6" x="30" y="222" width="330" height="28" rx="3" fill="#fbfcf8"/><text x="40" y="241">CMD ["python", "app.py"]</text>
  </g>
  <text x="605" y="34" font-size="12" text-anchor="middle" fill="#5f6f66">image layers (built bottom-up)</text>
  <g font-size="12" fill="#23362e">
    <g id="b-g1" class="hidden"><rect id="b-L1" x="430" y="230" width="350" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="442" y="250">base image: python:3.13-slim</text><text id="b-s1" x="770" y="250" text-anchor="end" fill="#5f6f66">~45 MB</text></g>
    <g id="b-g2" class="hidden"><rect id="b-L2" x="430" y="195" width="350" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="442" y="215">WORKDIR /app</text><text id="b-s2" x="770" y="215" text-anchor="end" fill="#5f6f66">0 B</text></g>
    <g id="b-g3" class="hidden"><rect id="b-L3" x="430" y="160" width="350" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="442" y="180">requirements.txt</text><text id="b-s3" x="770" y="180" text-anchor="end" fill="#5f6f66">1 KB</text></g>
    <g id="b-g4" class="hidden"><rect id="b-L4" x="430" y="125" width="350" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="442" y="145">installed packages</text><text id="b-s4" x="770" y="145" text-anchor="end" fill="#5f6f66">180 MB · 2 min</text></g>
    <g id="b-g5" class="hidden"><rect id="b-L5" x="430" y="90" width="350" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="442" y="110">your source code</text><text id="b-s5" x="770" y="110" text-anchor="end" fill="#5f6f66">40 KB</text></g>
    <g id="b-g6" class="hidden"><rect id="b-L6" x="430" y="55" width="350" height="30" rx="3" fill="#fbfcf8" stroke="#a9b5a6" stroke-dasharray="4 3"/><text x="442" y="75">CMD (metadata, no files)</text><text id="b-s6" x="770" y="75" text-anchor="end" fill="#5f6f66">0 B</text></g>
  </g>
  <text id="b-edit" class="hand hidden" x="150" y="207" font-size="16" fill="#c53b3b">← you edit app.py</text>
  <text id="b-note" class="hand hidden" x="20" y="298" font-size="16" fill="#c53b3b">put COPY . . before pip install and every edit reinstalls all packages!</text>
</svg>
