<svg viewBox="0 0 560 190" role="img" aria-label="Diagram of host port 8080 forwarded through NAT to container port 80 on the docker bridge network">
  <defs><marker id="pm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker></defs>
  <rect x="10" y="60" width="100" height="50" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="60" y="82" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">browser</text>
  <text x="60" y="99" font-size="10.5" text-anchor="middle" fill="#5f6f66">localhost:8080</text>
  <rect x="140" y="15" width="410" height="160" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="155" y="34" font-size="12" font-weight="600" fill="#23362e">host · 192.168.1.20</text>
  <rect x="160" y="65" width="100" height="40" rx="20" fill="#c53b3b"/>
  <text x="210" y="90" font-size="12" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">:8080</text>
  <rect x="290" y="62" width="90" height="46" rx="6" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="335" y="82" font-size="11" text-anchor="middle" fill="#23362e">NAT rule</text>
  <text x="335" y="98" font-size="10.5" text-anchor="middle" fill="#5f6f66">iptables/nft</text>
  <rect x="400" y="45" width="135" height="110" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="467" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">container</text>
  <text x="467" y="80" font-size="10.5" text-anchor="middle" fill="#5f6f66">172.18.0.2 (bridge)</text>
  <rect x="425" y="92" width="85" height="30" rx="15" fill="#2f6b3f"/>
  <text x="467" y="112" font-size="12" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">nginx :80</text>
  <g stroke="#c53b3b" stroke-width="2" marker-end="url(#pm-arr)" fill="none">
    <line x1="110" y1="85" x2="158" y2="85"/><line x1="260" y1="85" x2="288" y2="85"/><line x1="380" y1="95" x2="423" y2="105"/>
  </g>
  <text x="345" y="148" font-size="13" text-anchor="middle" fill="#c53b3b" font-family="Kalam, cursive">-p 8080:80 = HOST:CONTAINER</text>
</svg>
