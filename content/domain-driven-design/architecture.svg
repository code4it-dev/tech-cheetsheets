<svg viewBox="0 0 800 340" role="img" aria-label="A context map of three bounded contexts with their own models, connected by an anti-corruption layer and a published language">
  <defs>
    <marker id="dd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">three contexts, three models, one business &mdash; the arrows are the real architecture</text>

  <rect x="24" y="44" width="228" height="156" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="40" y="66" font-size="13" font-weight="700" fill="#23362e">Sales &mdash; core domain</text>
  <text x="40" y="88" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">Customer{tier, discount}</text>
  <text x="40" y="108" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">Order{lines, total}</text>
  <text x="40" y="132" font-size="11.5" fill="#5f6f66">language: quote, lead, upsell</text>
  <text x="40" y="154" font-size="11.5" fill="#5f6f66">own team, own schema,</text>
  <text x="40" y="172" font-size="11.5" fill="#5f6f66">own release cadence</text>
  <text x="40" y="192" font-size="11" fill="#2f6b3f" font-weight="600">invest here</text>

  <rect x="286" y="44" width="228" height="156" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="302" y="66" font-size="13" font-weight="700" fill="#23362e">Shipping &mdash; supporting</text>
  <text x="302" y="88" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">Consignee{address, slot}</text>
  <text x="302" y="108" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">Shipment{parcels, carrier}</text>
  <text x="302" y="132" font-size="11.5" fill="#5f6f66">language: parcel, leg, manifest</text>
  <text x="302" y="154" font-size="11.5" fill="#5f6f66">the same person is modelled</text>
  <text x="302" y="172" font-size="11.5" fill="#5f6f66">completely differently here</text>

  <rect x="548" y="44" width="228" height="156" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="564" y="66" font-size="13" font-weight="700" fill="#23362e">Billing &mdash; generic</text>
  <text x="564" y="88" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">Payer{vatId, legalName}</text>
  <text x="564" y="108" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">Invoice{lines, dueDate}</text>
  <text x="564" y="132" font-size="11.5" fill="#5f6f66">language: dunning, credit note</text>
  <text x="564" y="154" font-size="11.5" fill="#5f6f66">buy this, do not build it</text>

  <rect x="252" y="104" width="34" height="56" rx="5" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="269" y="138" font-size="11" text-anchor="middle" fill="#c53b3b" font-weight="700" transform="rotate(-90 269 138)">ACL</text>

  <line x1="514" y1="122" x2="544" y2="122" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#dd-arr)"/>
  <text x="531" y="112" font-size="10" text-anchor="middle" fill="#5f6f66">events</text>

  <rect x="24" y="226" width="752" height="62" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="40" y="246" font-size="12.5" font-weight="700" fill="#23362e">Context map &mdash; the relationship, written down</text>
  <text x="40" y="266" font-size="11" fill="#5f6f66">Sales &rarr; Shipping: customer / supplier, translated by an anti-corruption layer</text>
  <text x="40" y="282" font-size="11" fill="#5f6f66">Sales &rarr; Billing: published language (OrderPlaced) &nbsp;·&nbsp; Billing: conformist &mdash; we bend to the vendor's model</text>

  <text class="hand" x="30" y="316" font-size="16" fill="#c53b3b">one shared "Customer" class across all three is how you get a 90-field god object</text>
</svg>
