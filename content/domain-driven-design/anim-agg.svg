<svg viewBox="0 0 800 320" role="img" aria-label="A command flowing through an application service, repository and aggregate root, enforcing an invariant and raising a domain event">
  <defs>
    <marker id="ag-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <g id="ag-cmd">
    <rect x="20" y="26" width="186" height="34" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text id="ag-cmdt" x="30" y="48" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">AddItem(SKU-91, 3)</text>
  </g>

  <rect id="ag-app" x="20" y="92" width="170" height="78" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="118" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">application service</text>
  <text x="105" y="138" font-size="11" text-anchor="middle" fill="#5f6f66">opens the transaction</text>
  <text x="105" y="156" font-size="11" text-anchor="middle" fill="#5f6f66">holds no business rules</text>

  <line x1="194" y1="131" x2="226" y2="131" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ag-arr)"/>

  <rect id="ag-repo" x="230" y="92" width="140" height="78" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="300" y="118" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">repository</text>
  <text x="300" y="138" font-size="11" text-anchor="middle" fill="#5f6f66">whole aggregate,</text>
  <text x="300" y="156" font-size="11" text-anchor="middle" fill="#5f6f66">by identity only</text>

  <rect id="ag-db" x="230" y="212" width="140" height="62" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="300" y="238" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">database</text>
  <text id="ag-dbt" x="300" y="258" font-size="11" text-anchor="middle" fill="#5f6f66">orders + order_lines</text>
  <line x1="300" y1="174" x2="300" y2="206" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ag-arr)"/>

  <line x1="374" y1="131" x2="406" y2="131" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ag-arr)"/>

  <rect id="ag-aggr" x="410" y="80" width="250" height="194" rx="8" fill="#fbfcf8" stroke="#2f6b3f" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="535" y="100" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">aggregate &mdash; consistency boundary</text>

  <rect id="ag-root" x="426" y="110" width="218" height="34" rx="5" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="535" y="132" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Order #42 &mdash; aggregate root</text>

  <rect id="ag-l1" class="hidden" x="446" y="152" width="178" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="ag-l1t" class="hidden" x="458" y="170" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">2 x SKU-77</text>
  <rect id="ag-l2" class="hidden" x="446" y="184" width="178" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="ag-l2t" class="hidden" x="458" y="202" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">3 x SKU-91</text>

  <text id="ag-inv" x="426" y="236" font-size="10" fill="#5f6f66">invariant: at most 10 items, total under 5000</text>
  <text id="ag-status" x="426" y="258" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">state: 1 line, 2 items</text>

  <line x1="664" y1="131" x2="696" y2="131" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ag-arr)"/>
  <rect id="ag-bus" x="700" y="92" width="92" height="78" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="746" y="118" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">event</text>
  <text x="746" y="134" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">bus</text>
  <text id="ag-bust" x="746" y="156" font-size="10.5" text-anchor="middle" fill="#5f6f66">idle</text>

  <text id="ag-hand" class="hand hidden" x="30" y="300" font-size="16" fill="#c53b3b">the rule lives in the root, not in a validator next to the controller</text>
</svg>
