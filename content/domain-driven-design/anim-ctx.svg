<svg viewBox="0 0 800 300" role="img" aria-label="The word Customer travelling across sales, shipping and billing contexts, meaning something different in each">
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the business says "customer" &mdash; three teams hear three different things</text>

  <rect id="cx-sales" x="24" y="40" width="228" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="138" y="62" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">Sales context</text>
  <text id="cx-s1" x="40" y="90" font-size="11.5" fill="#5f6f66">…</text>
  <text id="cx-s2" x="40" y="112" font-size="11.5" fill="#5f6f66"></text>
  <text id="cx-s3" x="40" y="134" font-size="11.5" fill="#5f6f66"></text>
  <text id="cx-s4" x="40" y="162" font-size="11" fill="#2f6b3f"></text>

  <rect id="cx-ship" x="286" y="40" width="228" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="62" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">Shipping context</text>
  <text id="cx-h1" x="302" y="90" font-size="11.5" fill="#5f6f66">…</text>
  <text id="cx-h2" x="302" y="112" font-size="11.5" fill="#5f6f66"></text>
  <text id="cx-h3" x="302" y="134" font-size="11.5" fill="#5f6f66"></text>
  <text id="cx-h4" x="302" y="162" font-size="11" fill="#2f6b3f"></text>

  <rect id="cx-bill" x="548" y="40" width="228" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="662" y="62" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">Billing context</text>
  <text id="cx-b1" x="564" y="90" font-size="11.5" fill="#5f6f66">…</text>
  <text id="cx-b2" x="564" y="112" font-size="11.5" fill="#5f6f66"></text>
  <text id="cx-b3" x="564" y="134" font-size="11.5" fill="#5f6f66"></text>
  <text id="cx-b4" x="564" y="162" font-size="11" fill="#2f6b3f"></text>

  <g id="cx-word">
    <rect x="70" y="212" width="136" height="34" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text x="138" y="234" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">"customer"</text>
  </g>

  <g id="cx-acl" class="hidden">
    <rect x="252" y="100" width="34" height="56" rx="5" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
    <text x="269" y="134" font-size="11" text-anchor="middle" fill="#c53b3b" font-weight="700" transform="rotate(-90 269 134)">ACL</text>
  </g>

  <text id="cx-msg" x="400" y="276" font-size="12" text-anchor="middle" fill="#5f6f66">one word, about to be pulled in three directions</text>
  <text id="cx-hand" class="hand hidden" x="20" y="238" font-size="16" fill="#c53b3b">translate at the border, never share the class</text>
</svg>
