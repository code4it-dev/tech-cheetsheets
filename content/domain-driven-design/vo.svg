<svg viewBox="0 0 560 200" role="img" aria-label="Two Money value objects compared by value and two customers compared by identity">
  <text x="140" y="28" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">value object</text>
  <rect id="vo-m1" x="40" y="44" width="200" height="40" rx="5" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="140" y="69" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">Money(10, EUR)</text>
  <rect id="vo-m2" x="40" y="96" width="200" height="40" rx="5" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="140" y="121" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">Money(10, EUR)</text>
  <text id="vo-vt" x="140" y="166" font-size="12" text-anchor="middle" fill="#5f6f66">equal?</text>

  <text x="420" y="28" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">entity</text>
  <rect id="vo-e1" x="320" y="44" width="200" height="40" rx="5" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="420" y="69" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">Customer#7 "Ada"</text>
  <rect id="vo-e2" x="320" y="96" width="200" height="40" rx="5" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="420" y="121" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">Customer#9 "Ada"</text>
  <text id="vo-et" x="420" y="166" font-size="12" text-anchor="middle" fill="#5f6f66">equal?</text>
</svg>
