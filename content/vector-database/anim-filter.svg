<svg viewBox="0 0 800 328" role="img" aria-label="Three strategies for combining a selective filter with an approximate nearest neighbour search: post-filtering, pre-filtering with brute force, and filtered graph traversal">
  <text id="fl-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">1,000,000 vectors · the filter <tspan font-family="Fira Code, monospace">tenant = "acme"</tspan> matches 2,000 of them (0.2%)</text>

  <rect id="fl-r1" x="16" y="42" width="768" height="72" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="fl-h1" x="30" y="62" font-size="10.5" fill="#23362e" font-weight="700">A &mdash; post-filter: search first, drop non-matches afterwards</text>
  <text id="fl-a1" x="30" y="82" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="fl-a2" x="30" y="102" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="fl-r2" x="16" y="126" width="768" height="72" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="fl-h2" x="30" y="146" font-size="10.5" fill="#23362e" font-weight="700">B &mdash; pre-filter: find the matching rows, then compare all of them exactly</text>
  <text id="fl-b1" x="30" y="166" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="fl-b2" x="30" y="186" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="fl-r3" x="16" y="210" width="768" height="72" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="fl-h3" x="30" y="230" font-size="10.5" fill="#23362e" font-weight="700">C &mdash; filtered traversal: walk the graph, but only step onto matching nodes</text>
  <text id="fl-c1" x="30" y="250" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="fl-c2" x="30" y="270" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="fl-verd" x="16" y="294" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="fl-v" x="400" y="313" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">selectivity decides which strategy is correct — and good engines switch automatically</text>
</svg>
