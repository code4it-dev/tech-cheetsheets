<svg viewBox="0 0 800 350" role="img" aria-label="A vector database: upserts building segments with an ANN index and a payload store, and queries combining a vector, a filter and a top-k limit">
  <defs>
    <marker id="vd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">a vector, a payload, and an index that only approximately agrees with the truth</text>

  <rect x="16" y="38" width="170" height="124" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="101" y="60" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">upsert</text>
  <text x="101" y="82" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">id: "doc-412#2"</text>
  <text x="101" y="100" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">vector: [1536 floats]</text>
  <text x="101" y="118" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">payload: { tenant,</text>
  <text x="101" y="134" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">  acl, url, text }</text>
  <text x="101" y="152" font-size="9" text-anchor="middle" fill="#2f6b3f">6 KB of vector, 1 KB of payload</text>

  <line x1="190" y1="100" x2="212" y2="100" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#vd-arr)"/>

  <rect x="216" y="38" width="320" height="200" rx="8" fill="#fbfcf8" stroke="#2f6b3f" stroke-width="2"/>
  <text x="376" y="60" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the collection</text>

  <rect x="230" y="72" width="292" height="52" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="376" y="92" font-size="10" text-anchor="middle" fill="#23362e" font-weight="600">ANN index &mdash; in memory</text>
  <text x="376" y="110" font-size="9" text-anchor="middle" fill="#5f6f66">HNSW graph, or IVF lists · quantised copies</text>

  <rect x="230" y="134" width="292" height="44" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="376" y="154" font-size="10" text-anchor="middle" fill="#23362e" font-weight="600">payload store + filter indexes</text>
  <text x="376" y="170" font-size="9" text-anchor="middle" fill="#5f6f66">tenant, acl, date &mdash; usually on disk</text>

  <rect x="230" y="188" width="292" height="38" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="376" y="212" font-size="9.5" text-anchor="middle" fill="#5f6f66">segments · tombstones · compaction · replicas</text>

  <rect x="566" y="38" width="218" height="96" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="675" y="60" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">query</text>
  <text x="675" y="80" font-size="9.5" text-anchor="middle" fill="#5f6f66">vector + filter + k</text>
  <text x="675" y="98" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">ef_search = 100</text>
  <text x="675" y="118" font-size="9.5" text-anchor="middle" fill="#c53b3b">recall ≈ 97%, not 100%</text>
  <line x1="560" y1="86" x2="540" y2="86" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#vd-arr)"/>

  <rect x="566" y="146" width="218" height="92" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="675" y="168" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">results</text>
  <text x="675" y="188" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">id + score + payload</text>
  <text x="675" y="208" font-size="9.5" text-anchor="middle" fill="#5f6f66">2&ndash;20 ms for 1M vectors</text>
  <text x="675" y="228" font-size="9.5" text-anchor="middle" fill="#5f6f66">ordered by distance</text>
  <line x1="540" y1="192" x2="560" y2="192" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#vd-arr)"/>

  <rect x="16" y="252" width="768" height="46" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="272" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">sizing is arithmetic, and worth doing before you pick a product</text>
  <text x="400" y="290" font-size="10" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">1M × 1536 dims × 4 B ≈ 6.1 GB  +  HNSW graph (m=16) ≈ 0.13 GB  →  ~6.9 GB RAM</text>

  <text class="hand" x="400" y="330" fill="#c53b3b" font-size="16" text-anchor="middle">it never errors when recall is bad. it just answers slightly wrong, for ever.</text>
</svg>
