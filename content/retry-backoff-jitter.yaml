title: Retry, backoff & jitter
slug: retry-backoff-jitter
tagline: Retrying is the cheapest way to survive a blip, and the cheapest way to turn one into an outage.
asof: Nov 2026 · examples use Polly 8 and Tenacity; the jitter analysis is AWS's, from 2015
description: "Retry cheatsheet: which errors are worth retrying, why exponential backoff without jitter just rearranges the thundering herd, retry budgets, and how three layers turn one request into twenty-seven."
aliases:
  - Retry
  - retry pattern
  - retries
  - backoff
  - exponential backoff
  - jitter
  - full jitter
  - decorrelated jitter
  - retry budget
  - retry storm
  - thundering herd
keywords:
  - retry
  - exponential backoff
