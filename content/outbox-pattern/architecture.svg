<svg viewBox="0 0 800 330" role="img" aria-label="A service writing state and an outbox row in one transaction, a relay publishing to a broker, and a consumer deduplicating with an inbox table">
  <defs>
    <marker id="ob-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">one transaction on the left, retries in the middle, deduplication on the right</text>

  <rect x="20" y="44" width="150" height="76" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="95" y="72" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">order service</text>
  <text x="95" y="94" font-size="11" text-anchor="middle" fill="#5f6f66">handles PlaceOrder</text>
  <text x="95" y="110" font-size="11" text-anchor="middle" fill="#5f6f66">never calls the broker</text>
  <line x1="174" y1="110" x2="204" y2="134" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ob-arr)"/>

  <rect x="208" y="60" width="224" height="186" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="320" y="82" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">ONE transaction</text>
  <rect x="226" y="96" width="188" height="56" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="320" y="118" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">orders</text>
  <text x="320" y="138" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">INSERT order 42</text>
  <rect x="226" y="164" width="188" height="56" rx="6" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="320" y="186" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">outbox</text>
  <text x="320" y="206" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">INSERT OrderPlaced</text>
  <text x="320" y="238" font-size="11" text-anchor="middle" fill="#2f6b3f">both, or neither</text>

  <line x1="436" y1="153" x2="466" y2="153" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ob-arr)"/>

  <rect x="470" y="110" width="140" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="540" y="136" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">relay</text>
  <text x="540" y="156" font-size="10.5" text-anchor="middle" fill="#5f6f66">poller or CDC</text>
  <text x="540" y="174" font-size="10.5" text-anchor="middle" fill="#5f6f66">retries forever</text>
  <text x="540" y="190" font-size="10.5" text-anchor="middle" fill="#c53b3b">at-least-once</text>

  <line x1="614" y1="153" x2="644" y2="153" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ob-arr)"/>

  <rect x="648" y="44" width="132" height="76" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="714" y="72" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">broker</text>
  <text x="714" y="94" font-size="10.5" text-anchor="middle" fill="#5f6f66">Kafka, SQS,</text>
  <text x="714" y="110" font-size="10.5" text-anchor="middle" fill="#5f6f66">Service Bus…</text>
  <line x1="714" y1="124" x2="714" y2="144" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ob-arr)"/>

  <rect x="648" y="148" width="132" height="98" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="714" y="172" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">consumer</text>
  <text x="714" y="194" font-size="10.5" text-anchor="middle" fill="#5f6f66">inbox table:</text>
  <text x="714" y="210" font-size="10.5" text-anchor="middle" fill="#5f6f66">seen this id?</text>
  <text x="714" y="232" font-size="10.5" text-anchor="middle" fill="#c53b3b">must be idempotent</text>

  <text class="hand" x="26" y="286" font-size="16" fill="#c53b3b">the broker is never called inside your transaction &mdash; that is the whole trick</text>
  <text class="hand" x="26" y="310" font-size="16" fill="#c53b3b">duplicates are normal. losses are not.</text>
</svg>
