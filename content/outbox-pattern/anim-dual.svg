<svg viewBox="0 0 800 300" role="img" aria-label="A service committing to a database and publishing to a broker, failing in both orderings, then fixed with an outbox row">
  <defs>
    <marker id="dw-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="dw-step" x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">attempt A &mdash; commit the database first, then publish</text>

  <rect id="dw-svc" x="20" y="92" width="170" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="122" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">order service</text>
  <text id="dw-svct" x="105" y="146" font-size="11" text-anchor="middle" fill="#5f6f66">handling PlaceOrder</text>
  <text id="dw-svct2" x="105" y="166" font-size="11" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <line x1="194" y1="112" x2="286" y2="112" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#dw-arr)"/>
  <text x="240" y="104" font-size="10.5" text-anchor="middle" fill="#5f6f66">1</text>
  <line x1="194" y1="166" x2="556" y2="166" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#dw-arr)"/>
  <text x="380" y="182" font-size="10.5" text-anchor="middle" fill="#5f6f66">2</text>

  <rect id="dw-db" x="290" y="60" width="230" height="132" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="405" y="84" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">database</text>
  <text id="dw-dbt" x="405" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">orders: empty</text>
  <g id="dw-ob" class="hidden">
    <rect x="306" y="128" width="198" height="46" rx="5" fill="#fbf3c4" stroke="#d9c25a"/>
    <text x="405" y="147" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">outbox</text>
    <text id="dw-obt" x="405" y="165" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  </g>

  <rect id="dw-br" x="560" y="60" width="220" height="132" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="670" y="84" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">broker</text>
  <text id="dw-brt" x="670" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">topic: empty</text>
  <text id="dw-brt2" x="670" y="136" font-size="11" text-anchor="middle" fill="#5f6f66">shipping is waiting</text>

  <rect id="dw-verd" x="20" y="226" width="760" height="54" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="dw-v" x="400" y="250" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">two systems, two commits, no shared transaction</text>
  <text id="dw-vs" x="400" y="270" font-size="11" text-anchor="middle" fill="#5f6f66">whatever order you choose, there is a moment where one has happened and the other has not</text>
</svg>
