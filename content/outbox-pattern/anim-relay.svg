<svg viewBox="0 0 800 320" role="img" aria-label="A relay polling an outbox table, publishing to a broker, crashing before marking sent, and a consumer deduplicating by message id">
  <defs>
    <marker id="rl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <rect id="rl-tbl" x="20" y="44" width="250" height="186" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="145" y="66" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">outbox table</text>
  <g id="rl-r1"><rect x="36" y="80" width="218" height="34" rx="4" fill="#fbfcf8" stroke="#a9b5a6"/><text id="rl-r1t" x="46" y="101" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">1 OrderPlaced  sent=f</text></g>
  <g id="rl-r2"><rect x="36" y="122" width="218" height="34" rx="4" fill="#fbfcf8" stroke="#a9b5a6"/><text id="rl-r2t" x="46" y="143" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">2 ItemAdded    sent=f</text></g>
  <g id="rl-r3"><rect x="36" y="164" width="218" height="34" rx="4" fill="#fbfcf8" stroke="#a9b5a6"/><text id="rl-r3t" x="46" y="185" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">3 OrderShipped sent=f</text></g>
  <text id="rl-lag" x="145" y="218" font-size="10.5" text-anchor="middle" fill="#5f6f66">oldest unsent: 0.2 s</text>

  <line x1="274" y1="130" x2="306" y2="130" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rl-arr)"/>

  <rect id="rl-relay" x="310" y="84" width="150" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="385" y="110" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">relay</text>
  <text id="rl-rt" x="385" y="134" font-size="10.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="rl-rt2" x="385" y="154" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <line x1="464" y1="130" x2="496" y2="130" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rl-arr)"/>

  <rect id="rl-br" x="500" y="84" width="140" height="92" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="570" y="110" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">broker</text>
  <text id="rl-brt" x="570" y="134" font-size="10.5" text-anchor="middle" fill="#5f6f66">empty</text>
  <text id="rl-brt2" x="570" y="154" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <line x1="644" y1="130" x2="676" y2="130" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rl-arr)"/>

  <rect id="rl-cons" x="660" y="44" width="124" height="186" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="722" y="68" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">consumer</text>
  <text x="722" y="92" font-size="10.5" text-anchor="middle" fill="#5f6f66">inbox:</text>
  <text id="rl-in1" x="722" y="112" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="rl-in2" x="722" y="132" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rl-ct" x="722" y="166" font-size="10.5" text-anchor="middle" fill="#5f6f66">shipments: 0</text>
  <text id="rl-ct2" x="722" y="192" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="rl-note" x="20" y="252" width="764" height="52" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="rl-n" x="402" y="275" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">the event is already durable &mdash; everything from here on is just retrying</text>
  <text id="rl-n2" x="402" y="294" font-size="11" text-anchor="middle" fill="#5f6f66">which is why the relay is allowed to be stupid, slow, and restarted at any moment</text>
</svg>
