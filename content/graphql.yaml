title: GraphQL
slug: graphql
tagline: One endpoint, one typed schema, and the client decides what comes back — which moves both the power and the problems to the server.
asof: Nov 2026 · examples use Hot Chocolate (.NET) and Strawberry (Python)
description: "GraphQL cheatsheet: schema and resolvers, the N+1 problem and DataLoader, nullability, pagination, query cost limits, persisted queries and federation."
