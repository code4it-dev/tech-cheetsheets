<svg viewBox="0 0 800 340" role="img" aria-label="A client function starts an orchestrator, which schedules activities through control and work-item queues, with all state in a durable history store">
  <defs>
    <marker id="df-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <rect x="18" y="52" width="140" height="78" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="88" y="78" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Client function</text>
  <text x="88" y="98" font-size="11.5" text-anchor="middle" fill="#5f6f66">HTTP, queue, timer&hellip;</text>
  <text x="88" y="116" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">ScheduleNewAsync</text>

  <line x1="158" y1="91" x2="212" y2="91" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#df-arr)"/>

  <rect x="215" y="40" width="190" height="104" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="310" y="64" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Orchestrator</text>
  <text x="310" y="84" font-size="11.5" text-anchor="middle" fill="#5f6f66">decides what happens next</text>
  <text x="310" y="102" font-size="11.5" text-anchor="middle" fill="#5f6f66">replayed, must be deterministic</text>
  <text x="310" y="124" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-weight="600">no I/O of its own</text>

  <line x1="405" y1="92" x2="462" y2="92" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#df-arr)"/>
  <text x="433" y="82" font-size="10.5" text-anchor="middle" fill="#5f6f66">schedules</text>

  <rect x="465" y="40" width="150" height="104" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="540" y="64" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Activities</text>
  <text x="540" y="84" font-size="11.5" text-anchor="middle" fill="#5f6f66">the actual work</text>
  <text x="540" y="102" font-size="11.5" text-anchor="middle" fill="#5f6f66">DB, HTTP, files, email</text>
  <text x="540" y="124" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="600">at-least-once</text>

  <rect x="630" y="40" width="152" height="104" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="706" y="64" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Entities</text>
  <text x="706" y="84" font-size="11.5" text-anchor="middle" fill="#5f6f66">small, addressable</text>
  <text x="706" y="102" font-size="11.5" text-anchor="middle" fill="#5f6f66">pieces of state</text>
  <text x="706" y="124" font-size="11.5" text-anchor="middle" fill="#5f6f66">one at a time per key</text>

  <path d="M310 144 L310 186" stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#df-arr)"/>
  <path d="M540 144 L540 186" stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#df-arr)"/>

  <rect x="150" y="190" width="520" height="62" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="410" y="213" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Task hub &mdash; control queues + work-item queue</text>
  <text x="410" y="234" font-size="11.5" text-anchor="middle" fill="#5f6f66">every message is one event; partitions decide which worker owns an instance</text>

  <path d="M410 252 L410 278" stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#df-arr)"/>

  <rect x="150" y="282" width="520" height="52" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="410" y="304" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">History store &mdash; the append-only truth</text>
  <text x="410" y="324" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">Azure Storage &middot; Durable Task Scheduler &middot; Netherite &middot; MSSQL</text>

  <text class="hand" x="20" y="186" font-size="16" fill="#c53b3b">the orchestrator holds no state &mdash;</text>
  <text class="hand" x="20" y="206" font-size="16" fill="#c53b3b">the history does</text>
</svg>
