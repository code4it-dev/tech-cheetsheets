<svg viewBox="0 0 560 190" role="img" aria-label="Each replay re-reads the whole history, so total work grows with the square of the number of steps">
  <text x="12" y="20" font-size="12" font-weight="600" fill="#23362e">Every replay re-reads the whole history &mdash; so total work grows with the <tspan fill="#c53b3b">square</tspan> of the steps</text>
  <g font-size="10.5" font-family="Fira Code, monospace" fill="#23362e">
    <text x="12" y="46">execution 1</text><rect x="110" y="34" width="22" height="16" rx="3" fill="#e3eedc" stroke="#2f6b3f"/><text x="460" y="46" fill="#5f6f66">reads 1 event</text>
    <text x="12" y="72">execution 2</text><rect x="110" y="60" width="66" height="16" rx="3" fill="#e3eedc" stroke="#2f6b3f"/><text x="460" y="72" fill="#5f6f66">reads 3 events</text>
    <text x="12" y="98">execution 3</text><rect x="110" y="86" width="110" height="16" rx="3" fill="#e3eedc" stroke="#2f6b3f"/><text x="460" y="98" fill="#5f6f66">reads 5 events</text>
    <text x="12" y="124">execution 50</text><rect x="110" y="112" width="300" height="16" rx="3" fill="#fbf3c4" stroke="#d9c25a"/><text x="460" y="124" fill="#5f6f66">reads 99 events</text>
    <text x="12" y="150">execution 500</text><rect x="110" y="138" width="340" height="16" rx="3" fill="#f9e3df" stroke="#c53b3b"/><text x="460" y="150" fill="#c53b3b">reads 999 events</text>
  </g>
  <text class="hand" x="12" y="180" font-size="15" fill="#c53b3b">this is what ContinueAsNew and sub-orchestrations are for</text>
</svg>
