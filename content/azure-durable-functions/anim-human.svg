<svg viewBox="0 0 800 285" role="img" aria-label="Animated human interaction pattern racing an external event against a durable timer">
  <defs>
    <marker id="hi-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="hi-orch" x="24" y="98" width="164" height="92" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="106" y="124" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Orchestrator</text>
  <text id="hi-orch-sub" x="106" y="146" font-size="10.5" text-anchor="middle" fill="#5f6f66">at the approval step</text>
  <text id="hi-orch-state" x="106" y="168" font-size="11" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">running</text>
  <g stroke="#a9b5a6" stroke-width="1.5" fill="none" marker-end="url(#hi-a)">
    <line x1="188" y1="124" x2="256" y2="88"/><line x1="188" y1="164" x2="256" y2="200"/>
  </g>
  <rect id="hi-evt" x="260" y="56" width="260" height="66" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="390" y="80" font-size="12" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">WaitForExternalEvent("Approved")</text>
  <text id="hi-evt-sub" x="390" y="102" font-size="11" text-anchor="middle" fill="#5f6f66">waiting &mdash; no deadline of its own</text>
  <rect id="hi-timer" x="260" y="168" width="260" height="66" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="390" y="192" font-size="12" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">CreateTimer(now + 3 days)</text>
  <text id="hi-timer-sub" x="390" y="214" font-size="11" text-anchor="middle" fill="#5f6f66">waiting &mdash; a row in a table</text>
  <g stroke="#a9b5a6" stroke-width="1.5" fill="none" marker-end="url(#hi-a)">
    <line x1="520" y1="88" x2="588" y2="128"/><line x1="520" y1="200" x2="588" y2="160"/>
  </g>
  <rect id="hi-any" x="592" y="112" width="184" height="64" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="684" y="136" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">WhenAny</text>
  <text id="hi-any-sub" x="684" y="158" font-size="11" text-anchor="middle" fill="#5f6f66">first one wins</text>
  <text id="hi-clock" x="24" y="222" font-size="12" fill="#5f6f66" font-family="Fira Code, monospace">day 0 &middot; memory in use: none</text>
  <text id="hi-out" x="24" y="248" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">outcome: pending</text>
  <text id="hi-note" class="hand hidden" x="330" y="252" font-size="16" fill="#c53b3b">cancel the loser, or it haunts you for three days</text>
</svg>
