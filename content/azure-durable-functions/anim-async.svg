<svg viewBox="0 0 800 285" role="img" aria-label="Animated async HTTP pattern where the client gets 202 Accepted and polls a status endpoint">
  <defs>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="ah-client" x="24" y="76" width="150" height="90" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="99" y="104" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Caller</text>
  <text id="ah-client-sub" x="99" y="126" font-size="11" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="ah-client-lat" x="99" y="148" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">&nbsp;</text>
  <line x1="174" y1="100" x2="212" y2="100" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#ah-a)"/>
  <rect id="ah-fn" x="216" y="62" width="160" height="62" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="296" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Client function</text>
  <text x="296" y="106" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">ScheduleNewAsync</text>
  <line x1="296" y1="124" x2="296" y2="152" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ah-a)"/>
  <rect id="ah-orch" x="216" y="156" width="160" height="80" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="296" y="180" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Orchestrator</text>
  <text id="ah-orch-sub" x="296" y="202" font-size="10.5" text-anchor="middle" fill="#5f6f66">not started</text>
  <text id="ah-orch-step" x="296" y="222" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <rect x="406" y="48" width="374" height="196" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="420" y="70" font-size="12" font-weight="600" fill="#23362e">HTTP exchange</text>
  <g font-size="11" font-family="Fira Code, monospace" fill="#23362e">
    <text id="ah-l1" class="hidden" x="420" y="94">&rarr; POST /api/orders</text>
    <text id="ah-l2" class="hidden" x="420" y="118">&larr; 202 Accepted  + statusQueryGetUri</text>
    <text id="ah-l3" class="hidden" x="420" y="142">&rarr; GET /runtime/.../instances/order-10427</text>
    <text id="ah-l4" class="hidden" x="420" y="166">&larr; 202  Running  "step 2 of 4: charging card"</text>
    <text id="ah-l5" class="hidden" x="420" y="190">&larr; 202  Running  "step 3 of 4: booking courier"</text>
    <text id="ah-l6" class="hidden" x="420" y="214">&larr; 200  Completed  {"tracking":"TRK-991"}</text>
  </g>
  <text id="ah-note" class="hand hidden" x="30" y="272" font-size="16" fill="#c53b3b">no connection held open, so no gateway timeout to design around</text>
</svg>
