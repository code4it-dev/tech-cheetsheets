<svg viewBox="0 0 800 285" role="img" aria-label="Animated monitor pattern comparing history growth with and without ContinueAsNew">
  <defs>
    <marker id="mo-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="mo-iter" x="24" y="30" font-size="13" font-weight="700" fill="#c53b3b" font-family="Fira Code, monospace">iteration 0</text>
  <g font-size="11" text-anchor="middle">
    <rect id="mo-s1" x="24" y="48" width="150" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="99" y="68" fill="#23362e" font-weight="600">1. PollDevice</text>
    <text id="mo-s1-t" x="99" y="84" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
    <rect id="mo-s2" x="24" y="102" width="150" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="99" y="122" fill="#23362e" font-weight="600">2. is it critical?</text>
    <text id="mo-s2-t" x="99" y="138" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
    <rect id="mo-s3" x="24" y="156" width="150" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="99" y="176" fill="#23362e" font-weight="600">3. CreateTimer</text>
    <text id="mo-s3-t" x="99" y="192" fill="#5f6f66" font-family="Fira Code, monospace">+5 min</text>
    <rect id="mo-s4" x="24" y="210" width="150" height="44" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
    <text x="99" y="230" fill="#23362e" font-weight="600">4. ContinueAsNew</text>
    <text id="mo-s4-t" x="99" y="246" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  </g>
  <path d="M174 232 Q 210 232 210 150 Q 210 70 178 70" stroke="#2f6b3f" stroke-width="1.5" fill="none" marker-end="url(#mo-a)"/>
  <rect x="236" y="44" width="544" height="96" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="250" y="66" font-size="12" font-weight="600" fill="#c53b3b">a plain <tspan font-family="Fira Code, monospace">while</tspan> loop &mdash; one history, forever</text>
  <g>
    <rect id="mo-a1" x="250" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a2" class="hidden" x="300" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a3" class="hidden" x="350" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a4" class="hidden" x="400" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a5" class="hidden" x="450" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a6" class="hidden" x="500" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a7" class="hidden" x="550" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a8" class="hidden" x="600" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a9" class="hidden" x="650" y="78" width="46" height="20" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="mo-a10" class="hidden" x="700" y="78" width="76" height="20" rx="3" fill="#c53b3b" stroke="#c53b3b"/>
  </g>
  <text id="mo-a-t" x="250" y="124" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">history: 0 events &middot; every replay re-reads all of them</text>
  <rect x="236" y="152" width="544" height="96" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="250" y="174" font-size="12" font-weight="600" fill="#2f6b3f">with <tspan font-family="Fira Code, monospace">ContinueAsNew</tspan> &mdash; a fresh history each time</text>
  <g>
    <rect id="mo-b1" x="250" y="186" width="46" height="20" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="mo-b2" class="hidden" x="300" y="186" width="46" height="20" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
  </g>
  <text id="mo-b-t" x="250" y="232" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">history: 0 events</text>
  <text id="mo-note" class="hand hidden" x="236" y="272" font-size="16" fill="#c53b3b">state travels in the input, not in the history</text>
</svg>
