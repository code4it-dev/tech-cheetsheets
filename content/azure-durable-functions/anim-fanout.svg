<svg viewBox="0 0 800 320" role="img" aria-label="Animated fan-out to five parallel activities, one failing and retrying, then fanning in">
  <defs>
    <marker id="fo-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="fo-orch" x="24" y="90" width="180" height="120" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="114" y="116" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Orchestrator</text>
  <text x="114" y="138" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">foreach (file)</text>
  <text x="114" y="156" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">tasks.Add(CallActivity)</text>
  <text id="fo-state" x="114" y="182" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">starting</text>

  <g stroke="#a9b5a6" stroke-width="1.5" fill="none" marker-end="url(#fo-arr)">
    <line x1="204" y1="130" x2="294" y2="56"/><line x1="204" y1="140" x2="294" y2="106"/>
    <line x1="204" y1="150" x2="294" y2="150"/><line x1="204" y1="160" x2="294" y2="196"/>
    <line x1="204" y1="170" x2="294" y2="244"/>
  </g>

  <g font-size="11.5" font-family="Fira Code, monospace">
    <rect id="fo-a1" x="298" y="36" width="190" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text id="fo-t1" x="310" y="61" fill="#23362e">Resize invoice-001.pdf</text>
    <rect id="fo-a2" x="298" y="86" width="190" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text id="fo-t2" x="310" y="111" fill="#23362e">Resize invoice-002.pdf</text>
    <rect id="fo-a3" x="298" y="130" width="190" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text id="fo-t3" x="310" y="155" fill="#23362e">Resize invoice-003.pdf</text>
    <rect id="fo-a4" x="298" y="176" width="190" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text id="fo-t4" x="310" y="201" fill="#23362e">Resize invoice-004.pdf</text>
    <rect id="fo-a5" x="298" y="224" width="190" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text id="fo-t5" x="310" y="249" fill="#23362e">Resize invoice-005.pdf</text>
  </g>
  <text x="393" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">five work items, picked up by any available worker</text>

  <g stroke="#a9b5a6" stroke-width="1.5" fill="none" marker-end="url(#fo-arr)">
    <line x1="488" y1="56" x2="586" y2="130"/><line x1="488" y1="106" x2="586" y2="142"/>
    <line x1="488" y1="150" x2="586" y2="150"/><line x1="488" y1="196" x2="586" y2="158"/>
    <line x1="488" y1="244" x2="586" y2="170"/>
  </g>

  <rect id="fo-sum" x="590" y="100" width="186" height="100" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="683" y="126" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">WhenAll</text>
  <text id="fo-done" x="683" y="150" font-size="12.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">0 / 5 complete</text>
  <text id="fo-result" x="683" y="176" font-size="11.5" text-anchor="middle" fill="#5f6f66">waiting</text>

  <text id="fo-caption" x="400" y="290" font-size="12.5" text-anchor="middle" fill="#23362e">The orchestrator schedules all five, then unloads. Nothing is running in memory.</text>
  <text id="fo-note" class="hand hidden" x="300" y="312" font-size="16" fill="#c53b3b">retries live in the orchestrator, not in your activity</text>
</svg>
