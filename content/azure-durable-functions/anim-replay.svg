<svg viewBox="0 0 800 330" role="img" aria-label="Animated replay cycle of a durable orchestrator with its history table">
  <defs>
    <marker id="rp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <rect id="rp-orch" x="24" y="52" width="296" height="190" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="172" y="76" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Orchestrator function</text>
  <g font-size="11.5" font-family="Fira Code, monospace" fill="#23362e">
    <rect id="rp-l1" x="40" y="92" width="264" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
    <text x="50" y="110">var a = await ctx.CallActivity("Charge");</text>
    <rect id="rp-l2" x="40" y="124" width="264" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
    <text x="50" y="142">var b = await ctx.CallActivity("Ship");</text>
    <rect id="rp-l3" x="40" y="156" width="264" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
    <text x="50" y="174">return new Receipt(a, b);</text>
  </g>
  <text id="rp-state" x="172" y="206" font-size="12.5" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">not started</text>
  <text id="rp-runs" x="172" y="228" font-size="11.5" text-anchor="middle" fill="#5f6f66">executions so far: 0</text>

  <rect id="rp-worker" x="352" y="92" width="120" height="86" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="412" y="118" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Activity</text>
  <text x="412" y="136" font-size="11.5" text-anchor="middle" fill="#5f6f66">worker</text>
  <text id="rp-worker-sub" x="412" y="160" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>

  <line x1="320" y1="120" x2="348" y2="120" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#rp-arr)"/>
  <line x1="472" y1="150" x2="500" y2="150" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#rp-arr)"/>

  <rect x="504" y="44" width="280" height="238" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="644" y="66" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">History (append-only)</text>
  <g font-size="11" font-family="Fira Code, monospace" fill="#23362e">
    <text id="rp-h1" class="hidden" x="518" y="92">1  ExecutionStarted</text>
    <text id="rp-h2" class="hidden" x="518" y="118">2  TaskScheduled: Charge</text>
    <text id="rp-h3" class="hidden" x="518" y="144">3  TaskCompleted: Charge = 42.00</text>
    <text id="rp-h4" class="hidden" x="518" y="170">4  TaskScheduled: Ship</text>
    <text id="rp-h5" class="hidden" x="518" y="196">5  TaskCompleted: Ship = TRK-991</text>
    <text id="rp-h6" class="hidden" x="518" y="222">6  ExecutionCompleted</text>
  </g>
  <text id="rp-hnote" x="644" y="262" font-size="11.5" text-anchor="middle" fill="#5f6f66">this table is the only state there is</text>

  <text id="rp-note" class="hand hidden" x="40" y="306" font-size="16" fill="#c53b3b">3 executions of your code, 1 logical run &mdash; that is why it must be deterministic</text>
</svg>
