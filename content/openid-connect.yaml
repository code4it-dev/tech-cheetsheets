title: OpenID Connect
slug: openid-connect
tagline: OAuth tells an API what you may do. OIDC tells an app who you are — and they are not the same token.
asof: Nov 2026 · OpenID Connect Core 1.0 (2014, errata set 2) · built on OAuth 2.0, certified by the OpenID Foundation
description: "OpenID Connect cheatsheet: the ID token versus the access token, the nonce, discovery and JWKS, single sign-on across apps, and why logging out is the hard part."
aliases:
  - OpenID Connect
  - OIDC
  - ID token
  - id_token
  - UserInfo
  - nonce
  - single sign-on
  - SSO
  - discovery document
  - back-channel logout
keywords:
  - openid connect
  - oidc
  - id token
  - sso
  - authentication
  - identity
  - jwks
  - discovery
  - logout
  - claims
related: [ oauth2, jwt, backend-for-frontend, azure-api-management, multitenancy ]
overview:
  - OAuth 2.0 deliberately says nothing about identity. An access token means "the bearer may read this calendar"; it does not reliably say who the user is, when they authenticated or how. For years everyone built their own answer on top, usually by calling a vendor-specific "who am I" endpoint, and most of those answers were insecure in the same way.
  - "**OpenID Connect** standardises that layer. It adds one scope (`openid`), one new token (the **ID token**, a JWT describing the authentication event), a set of standard claims, a **UserInfo** endpoint, a **discovery** document and a **nonce** to bind the token to the login attempt. Everything else — the redirect, the code, the token endpoint — is still plain OAuth."
  - "The distinction worth keeping in your head: the **ID token is for the client** that asked for the login, and the **access token is for the API**. They have different audiences, different lifetimes and different jobs, and swapping them is the single most common and most serious OIDC mistake. The other hard part is not login at all — it is logout, because a successful SSO leaves you with one session at the identity provider and one at every application."
architecture:
  svg: openid-connect/architecture.svg
  alt: OpenID Connect shown as a thin identity layer added on top of OAuth 2.0, with the ID token going to the client and the access token to the API
  caption: Two tokens come back from one login. Which one you send where is the whole of OIDC security in one sentence.
howItWorks:
  - md: The first animation is the two tokens and the mistake everyone makes with them. The second is single sign-on — and the logout problem it creates.
  - note: the ID token is a receipt for a login, not a key to anything
  - anim:
      id: anim-tokens
      title: 1 · One login, two tokens, two audiences
      svg: openid-connect/anim-tokens.svg
      alt: A login returning an ID token for the client and an access token for the API, and an ID token being rejected by a correctly configured API
      steps:
        - say: "The flow is the OAuth authorization code flow you already know. The only difference is one extra scope: `openid`. That single word turns an authorization request into an authentication request."
          hl: [ ot-idp ]
        - say: The user authenticates at the provider, and the token response now contains <em>two</em> tokens rather than one.
          unhl: [ ot-idp ]
          text:
            ot-idpt: user authenticated · issuing 2 tokens
        - say: "The first is the ID token: a signed JWT about the login itself. Its audience is your client id — it was issued to you, for you to read."
          show: [ ot-id, ot-a1 ]
          hl: [ ot-id ]
          text:
            ot-idt: aud = s6BhdRkqt3 · sub, auth_time, amr, nonce
        - say: The second is the access token, whose audience is the API. It is a credential for calling the calendar — and opaque to your client by contract, even when it happens to decode.
          show: [ ot-at, ot-a2 ]
          hl: [ ot-at ]
          unhl: [ ot-id ]
          text:
            ot-att: aud = api://calendar · scope calendar.read
        - say: Your client validates the ID token — signature, issuer, audience, expiry, nonce — and then creates its own session. After that the ID token has done its job.
          hl: [ ot-app ]
          unhl: [ ot-at ]
          text:
            ot-appt: validated the ID token
            ot-appt2: created its own session cookie
            ot-v: the ID token is a receipt for a login, not a key to anything
        - say: The access token goes to the API, which checks that the audience is its own identifier and that the scope permits the operation.
          hl: [ ot-api ]
          unhl: [ ot-app ]
          text:
            ot-apit2: aud ✓ scope ✓ → 200 OK
          fill:
            ot-apit2: "#2f6b3f"
        - say: Now the mistake. A developer has an ID token in hand, it looks like a JWT, and the API wants a token — so they send the ID token instead.
          show: [ ot-bad ]
          unhl: [ ot-api ]
          text:
            ot-apit2: receiving an id_token…
            ot-v: it is a JWT, it is signed, it is valid — and it is the wrong token
          fill:
            ot-apit2: "#5f6f66"
        - say: "A correctly configured API rejects it: the audience is the client id, not the API. The request fails, which is the <em>good</em> outcome."
          hl: [ ot-api ]
          text:
            ot-apit2: aud = s6BhdRkqt3 ≠ api://calendar → 401
          fill:
            ot-apit2: "#c53b3b"
        - say: The bad outcome is an API that validates only the signature. It accepts the ID token — and now <em>any</em> client of that provider can call your API as any of its users, because every one of them can obtain a validly signed ID token.
          text:
            ot-apit: checks signature only ✗
            ot-apit2: accepted — impersonation is trivial
            ot-v: skipping the audience check turns a login receipt into a master key
          fill:
            ot-apit: "#c53b3b"
        - say: "So the rule, and it is worth memorising: ID token to your client, access token to the API, and always validate the audience on both."
          unhl: [ ot-api ]
          text:
            ot-phase: two tokens, two audiences, never swapped
            ot-apit: expects aud = api://calendar
            ot-apit2: ""
            ot-v: ID token → your app · access token → the API
          fill:
            ot-apit: "#5f6f66"
  - anim:
      id: anim-sso
      title: 2 · Single sign-on, and the logout nobody plans for
      svg: openid-connect/anim-sso.svg
      alt: One identity provider session giving three applications their own sessions, and the difficulty of logging out of all of them
      steps:
        - say: Three applications and one identity provider. Nobody is signed in anywhere yet.
          hl: [ os-idp ]
        - say: The user opens the email app and is redirected to the provider, where they authenticate once.
          hl: [ os-a ]
          unhl: [ os-idp ]
          text:
            os-at: redirecting to the IdP…
            os-idpt: authenticating the user
        - say: Two things now exist. The provider sets <em>its own</em> session cookie on its own domain — and the email app, after validating the ID token, sets its own session cookie on its domain.
          show: [ os-la ]
          unhl: [ os-a ]
          text:
            os-idpt: IdP session ✓ (cookie on login.example.com)
            os-at: app session ✓
            os-p1: "sessions in existence: 2"
            os-p2: one at the provider, one at app A — with different lifetimes
        - say: Now the user opens the expenses app. It redirects to the provider exactly as the first app did.
          hl: [ os-b ]
          text:
            os-bt: redirecting to the IdP…
        - say: But the provider recognises its own cookie. No prompt, no password, no visible page — just an immediate redirect back with a code. That is single sign-on, and it is entirely a property of that one cookie.
          show: [ os-lb ]
          unhl: [ os-b ]
          text:
            os-bt: app session ✓ (no prompt)
            os-idpt2: existing session reused
            os-p1: "sessions in existence: 3"
        - say: "The wiki makes three. Note the arithmetic: three applications, four sessions — each with its own lifetime and its own idea of when it ends."
          show: [ os-lc ]
          text:
            os-ct: app session ✓ (no prompt)
            os-p1: "sessions in existence: 4"
            os-p2: N applications means N+1 sessions — this is the part that bites at logout
        - say: The user clicks "log out" in the email app, and the app clears its own cookie. Most implementations stop here.
          hl: [ os-a ]
          text:
            os-at: local session cleared
            os-p1: "sessions in existence: 3"
            os-p2: the IdP session and apps B and C are untouched
          fill:
            os-at: "#5f6f66"
        - say: Which means the next protected click redirects to the provider, the provider still recognises its cookie, and the user is silently signed straight back in. It looks like logout is broken, and functionally it is.
          show: [ os-la ]
          unhl: [ os-a ]
          text:
            os-at: silently signed back in ✗
            os-p1: "sessions in existence: 4"
            os-p2: clearing your own cookie is not logging out
          fill:
            os-at: "#c53b3b"
            os-p2: "#c53b3b"
        - say: "The first fix is RP-initiated logout: redirect the user to the provider’s end-session endpoint with `id_token_hint`. That ends the IdP session, so no silent re-login."
          hide: [ os-la ]
          hl: [ os-idp ]
          text:
            os-idpt: IdP session ended
            os-idpt2: ""
            os-at: logged out ✓
            os-p1: "sessions in existence: 2"
            os-p2: but apps B and C still have perfectly good sessions of their own
          fill:
            os-at: "#2f6b3f"
            os-p2: "#5f6f66"
        - say: "The second fix is back-channel logout: the provider POSTs a signed logout token to each application’s server, and each destroys its own session. It replaced the old iframe approach, which browsers broke when they blocked third-party cookies."
          hide: [ os-lb, os-lc ]
          unhl: [ os-idp ]
          text:
            os-phase: back-channel logout — server to server, no browser involved
            os-bt: logged out ✓ (notified)
            os-ct: logged out ✓ (notified)
            os-p1: "sessions in existence: 0"
            os-p2: logging in is one redirect; logging out is a distributed systems problem
          fill:
            os-bt: "#2f6b3f"
            os-ct: "#2f6b3f"
concepts:
  - term: ID token
    short: "A signed JWT describing an authentication event: who logged in, when, how, and for which client."
    see: [ Access token, nonce, Claims, Validation ]
    detail: |-
      It is issued <em>to your client</em> — its `aud` is your `client_id` — and it is meant to be read once, validated, and turned into whatever session your application normally uses. It is not a bearer credential, not a cookie and not something to forward anywhere.

      Its distinguishing claims are about the login rather than about permissions: `auth_time` says when the user actually authenticated, `acr`/`amr` say how strongly and by what method.

      #### Claims that matter

      | Claim | Means |
      | --- | --- |
      | `iss` | who issued it — must match your provider exactly |
      | `sub` | stable user id, unique per issuer |
      | `aud` | your client_id — reject anything else |
      | `exp`, `iat` | validity window |
      | `nonce` | binds the token to <em>this</em> login attempt |
      | `auth_time`, `acr`, `amr` | when and how they authenticated |

      #### How it relates

      - The JWT page covers how to validate one without falling into the classic traps.
  - term: Access token
    short: The OAuth credential for calling an API. Present in an OIDC response, but a different token with a different audience.
    see: [ ID token, Audience, UserInfo ]
    detail: |-
      Your client should treat it as opaque even when it happens to be a readable JWT. It was minted for the API, its format is the API's business, and decoding it to find a user id is how applications break the moment the provider changes the token format — which they are entitled to do.

      If your client needs user information, read the ID token or call UserInfo. Never take it from an access token.

      #### Side by side

      |  | ID token | Access token |
      | --- | --- | --- |
      | Audience | your client | the API |
      | Answers | who logged in | what may be done |
      | Format | always a JWT | JWT or opaque |
      | You may parse it | yes | no |
      | Send to an API | never | yes |

      #### How it relates

      - The first animation ends on exactly this confusion and what a correct API does about it.
  - term: openid scope
    short: The one word that turns an OAuth authorization request into an OIDC authentication request.
    see: [ ID token, Claims, UserInfo ]
    detail: |-
      Without `openid` in the scope list you get plain OAuth and no ID token, no matter what the rest of the request says. With it, the provider authenticates the user and issues one.

      The optional companions request standard claim sets: `profile` (name, picture), `email`, `address`, `phone`. `offline_access` is OAuth's, and asks for a refresh token.

      #### Common scope lists

      | Scopes | Gets you |
      | --- | --- |
      | `openid` | an ID token with `sub` only |
      | `openid profile email` | name and email claims too |
      | `openid … api://calendar/read` | login plus an API access token |
      | `… offline_access` | and a refresh token |

      #### How it relates

      - Everything else about the request — PKCE, state, redirect URI — is unchanged OAuth.
  - term: nonce
    short: A random value the client sends and finds echoed inside the ID token, binding that token to this login attempt.
    see: [ ID token, state parameter, Validation ]
    anim:
      key: nonce
      title: Why state is not enough
      svg: openid-connect/nonce.svg
      alt: A client checking that the nonce inside an ID token matches the one stored for this login attempt
      steps:
        - say: Before redirecting, the client generates a random nonce and stores it with the pending login in its own session.
          hl: [ nc-cli ]
          text:
            nc-clit: "nonce stored: n-0S6_WzA2Mj"
        - say: It travels in the authorize request, and the provider copies it into the ID token it mints for this login.
          hl: [ nc-tok ]
          unhl: [ nc-cli ]
          text:
            nc-tokt: "nonce claim: n-0S6_WzA2Mj"
        - say: On the callback the client compares the two. They match, so this token was minted for <em>this</em> login attempt and not some other one.
          unhl: [ nc-tok ]
          text:
            nc-res: match → accept
            nc-msg: the token is bound to the request that asked for it
          fill:
            nc-res: "#2f6b3f"
        - say: Now an attacker replays an ID token captured elsewhere — a log, another session, a different flow. Its signature is valid, the issuer is right, the audience is right, it has not expired.
          hl: [ nc-tok ]
          text:
            nc-tokt: "nonce claim: XyZ-from-another-login"
            nc-res: —
            nc-msg: every other check on this token passes
          fill:
            nc-res: "#5f6f66"
        - say: But the nonce does not match what this session is waiting for, so it is rejected. That is the one check standing between a captured token and a session as somebody else — and `state` would not have caught it, because state protects the callback, not the token.
          unhl: [ nc-tok ]
          text:
            nc-res: mismatch → reject
            nc-msg: state protects the request · nonce protects the token · you need both
          fill:
            nc-res: "#c53b3b"
    detail: |-
      It defeats token replay. Without it, an ID token captured elsewhere — from a log, from another session, from a different flow — could be presented to your callback and accepted, because everything else about it is valid.

      It is easy to confuse with `state`, and you need both: `state` is checked against the <em>request</em> and protects the callback from CSRF; `nonce` is checked inside the <em>token</em> and protects against replay.

      ::anim nonce::

      #### How it relates

      - Any decent OIDC library generates and checks both; hand-rolling is where one of them goes missing.
  - term: Claims
    short: The statements inside the ID token or from UserInfo — name, email, roles, tenant.
    see: [ ID token, UserInfo, Scope ]
    detail: |-
      OIDC standardises a core set so that `email` and `given_name` mean the same thing across providers. Anything beyond that is custom and provider-specific, usually namespaced to avoid collisions.

      Two cautions. `email` is not an identifier — it can change and be reassigned, so key users on `sub`. And `email_verified` matters: an unverified email claim is an account-takeover vector if you use it to match existing accounts.

      #### Standard claims worth knowing

      | Claim | Note |
      | --- | --- |
      | `sub` | the only stable identifier |
      | `email` + `email_verified` | never trust the first without the second |
      | `name`, `given_name`, `picture` | display only |
      | `updated_at` | when the profile last changed |

      #### How it relates

      - In multi-tenant systems the tenant comes from a claim, and must be checked rather than taken from the request.
  - term: UserInfo endpoint
    short: An OAuth-protected endpoint returning claims about the user, called with the access token.
    see: [ Claims, ID token, Access token ]
    detail: |-
      It exists so the ID token can stay small. Providers often put only `sub` and a few essentials in the token and leave the rest — picture, address, large group lists — to be fetched on demand.

      Call it once at login and cache the result in your session. Calling it per request turns the identity provider into a dependency of every page load.

      #### ID token or UserInfo?

      | Need | Source |
      | --- | --- |
      | Who logged in, right now | ID token |
      | Profile details, avatar | UserInfo, cached |
      | Large or volatile claims | UserInfo |
      | Anything on every request | your own session |

      #### How it relates

      - UserInfo takes the <em>access</em> token, which is one of the few places your client uses it directly.
  - term: Discovery
    short: A well-known JSON document describing every endpoint, algorithm and capability of the provider.
    see: [ JWKS, Authorization server, Validation ]
    detail: |-
      `/.well-known/openid-configuration` lists the authorization, token, UserInfo, JWKS and end-session endpoints, the supported scopes and response types, and the signing algorithms. Libraries fetch it at startup and refresh it periodically.

      Hard-coding these instead is how an application breaks when the provider rotates keys or moves an endpoint — both of which they are entitled to do without telling you.

      #### How it relates

      - Discovery plus a cached JWKS is what makes signing-key rotation invisible to you.
  - term: JWKS
    short: The provider's public signing keys, published as JSON so your app can verify tokens without any shared secret.
    see: [ Discovery, ID token, Validation ]
    detail: |-
      Each key has a `kid`; the token header names the `kid` it was signed with, so your library picks the right one. Providers publish the new key before they start using it, which is what allows rotation with no downtime.

      Cache the set, refresh on an unknown `kid`, and rate-limit that refresh — otherwise a stream of tokens with bogus `kid`s becomes a denial-of-service against your provider.

      #### Rules

      | Rule | Why |
      | --- | --- |
      | Cache the JWKS | do not fetch per request |
      | Refresh on unknown `kid` | handles rotation automatically |
      | Rate-limit that refresh | stops a cheap DoS |
      | Pin expected algorithms | never trust the token's own `alg` |

      #### How it relates

      - Trusting the header's `alg` is the classic JWT vulnerability; the JWT page covers it.
  - term: Validation
    short: The ordered set of checks an ID token must pass before you believe a single claim in it.
    see: [ ID token, nonce, JWKS ]
    detail: |-
      Signature first, using a key from the JWKS and an algorithm you chose — not one the token proposed. Then issuer, then audience against your own client id, then expiry and issued-at with a small clock skew allowance, then the nonce against your session.

      If several audiences are present, or an `azp` claim appears, check that `azp` is your client. Skipping that lets a token minted for a different client of the same provider be replayed at your login.

      #### In order

      | # | Check |
      | --- | --- |
      | 1 | signature, with a pinned algorithm |
      | 2 | `iss` exactly matches |
      | 3 | `aud` contains your client_id |
      | 4 | `azp` is you, if present |
      | 5 | `exp` / `iat`, small skew |
      | 6 | `nonce` matches the session |

      #### How it relates

      - Use a certified library. Every one of these has been got wrong in production by someone competent.
  - term: Single sign-on
    short: One authentication at the provider giving the user access to many applications without logging in again.
    see: [ IdP session, prompt, Logout ]
    detail: |-
      It works because the identity provider sets its own cookie on its own domain. When a second application redirects there, the provider recognises the session and immediately redirects back with a code — no prompt, often no visible page.

      The consequence people miss is arithmetic: after signing into three apps there are four sessions, each with its own lifetime and its own idea of when it ends.

      #### What exists after three logins

      | Session | Lives in |
      | --- | --- |
      | IdP session | cookie on the provider's domain |
      | App A, B, C sessions | cookie per application domain |

      #### How it relates

      - The second animation builds exactly this picture and then tries to tear it down.
  - term: prompt & max_age
    short: Parameters that control whether the user is asked to authenticate again, and how recently they must have done so.
    see: [ Single sign-on, ID token, Validation ]
    detail: |-
      `prompt=none` asks the provider to answer without any UI: if a session exists you get a code, otherwise an error. It is how a SPA silently checks whether someone is still signed in. `prompt=login` forces re-authentication regardless of session.

      `max_age` says the authentication must be newer than N seconds — the right tool before a sensitive action, with `auth_time` in the resulting token proving it.

      #### Values

      | Value | Effect |
      | --- | --- |
      | `prompt=none` | silent; errors instead of prompting |
      | `prompt=login` | always re-authenticate |
      | `prompt=consent` | re-ask for scope consent |
      | `max_age=300` | authentication must be < 5 min old |

      #### How it relates

      - Step-up authentication before a payment is `max_age` plus a check on `acr`.
  - term: acr & amr
    short: How strongly and by what method the user authenticated — the basis for step-up authentication.
    see: [ prompt, ID token, Claims ]
    detail: |-
      `amr` lists the methods used (`pwd`, `otp`, `mfa`, `hwk`); `acr` names a context class the provider defines. Together they let an application say "viewing is fine with a password, but transferring money needs MFA in the last five minutes".

      Values beyond the few standard ones are provider-specific, so treat them as configuration rather than constants in your code.

      #### How it relates

      - Requesting a stronger `acr_values` is how you trigger MFA for one operation rather than for every login.
  - term: IdP session
    short: The provider's own session cookie — the thing that actually makes SSO work, and the thing your logout does not touch.
    see: [ Single sign-on, Logout, Back-channel logout ]
    detail: |-
      It lives on the provider's domain and is invisible to your application. You cannot read it, clear it, or know its lifetime. All you can do is ask the provider to end it, by sending the user to the end-session endpoint.

      This is why "log out" in an application that only clears its own cookie puts the user straight back in on the next click: the provider still recognises them and re-issues a code without a prompt.

      #### How it relates

      - Steps 6–9 of the second animation are this problem and the three available answers.
  - term: RP-initiated logout
    short: The application sends the user to the provider's end-session endpoint to terminate the IdP session too.
    see: [ IdP session, Back-channel logout, Single sign-on ]
    detail: |-
      A redirect to `end_session_endpoint` with `id_token_hint` and a registered `post_logout_redirect_uri`. The provider clears its own session and sends the user back to you.

      It ends the IdP session, which stops silent re-login — but it does not by itself end the sessions held by other applications. For that you need one of the logout propagation mechanisms.

      #### How it relates

      - Register the post-logout redirect URI; providers reject unregistered ones, which produces a confusing dead end.
  - term: Back-channel logout
    short: The provider POSTs a signed logout token directly to each application's server, with no browser involved.
    see: [ RP-initiated logout, IdP session, Single sign-on ]
    detail: |-
      The reliable mechanism, and the one to use now. Each application registers a logout endpoint; on logout the provider calls them server-to-server with a logout token identifying the session, and each application destroys its own session.

      It replaced front-channel logout, which worked by loading hidden iframes from every application — a technique that browsers broke when they started blocking third-party cookies.

      #### The three mechanisms

      | Mechanism | Status |
      | --- | --- |
      | Back-channel | reliable; server to server |
      | Front-channel (iframes) | broken by third-party cookie blocking |
      | Session polling | legacy; same problem |

      #### How it relates

      - It needs your session store to be addressable by `sid` or `sub`, which is a design decision to take early.
  - term: Subject identifier
    short: "`sub` — the stable, issuer-scoped user id, and the only claim safe to key your data on."
    see: [ Claims, ID token, Validation ]
    detail: |-
      It is unique within an issuer but means nothing outside it, so the real key is the pair (`iss`, `sub`). With several identity providers, storing `sub` alone eventually produces a collision or a wrong match.

      Providers may also use **pairwise** subjects, giving each client a different `sub` for the same person — good for privacy, and a surprise if you expected to correlate users across applications.

      #### Do not key on

      | Claim | Why not |
      | --- | --- |
      | `email` | changes, and can be reassigned |
      | `name` | not unique, changes |
      | `sub` alone | only unique per issuer |
      | (`iss`, `sub`) | — this is the right key |

      #### How it relates

      - Account linking by unverified email is a well-known takeover path; require `email_verified`.
  - term: Hybrid flow
    short: Returning an ID token in the redirect alongside the code. Legacy, and rarely the right answer now.
    see: [ ID token, Authorization code flow, Validation ]
    detail: |-
      `response_type=code id_token` exists so a client can see who logged in before completing the code exchange. It costs you a token in the front channel — in the URL fragment, the browser history and possibly the referrer.

      With PKCE and a fast token endpoint there is almost no reason to use it. Treat it as something you may meet in an existing integration rather than something to choose.

      #### How it relates

      - If a provider's sample still shows `response_type=id_token token`, it predates the current security guidance.
commands:
  heading: Essential requests & code
  tocLabel: Requests & code
  groups:
    - group: The request, and what comes back
      items:
        - lang: bash
          code: |-
            GET /authorize
              ?response_type=code
              &scope=openid%20profile%20email%20api%3A%2F%2Fcalendar%2Fread
              &client_id=s6BhdRkqt3
              &redirect_uri=https%3A%2F%2Fapp.example%2Fcallback
              &state=af0ifjsldkj               # checked against the request
              &nonce=n-0S6_WzA2Mj               # checked inside the token
              &code_challenge=E9Melhoa2OwvFrEM…&code_challenge_method=S256

            # the openid scope is what makes this an authentication request at all
          what: Identical to an OAuth request plus `openid` and `nonce`. Everything else — PKCE, state, exact redirect URI — still applies.
        - lang: json
          code: |-
            {
              "token_type":    "Bearer",
              "expires_in":    300,
              "access_token":  "eyJhbGciOiJSUzI1NiIs…",   // aud: api://calendar — for the API
              "id_token":      "eyJhbGciOiJSUzI1NiIs…",   // aud: s6BhdRkqt3   — for you
              "refresh_token": "8xLOxBtZp8"
            }
          what: Two tokens, two audiences. The only thing your client parses is the ID token.
        - lang: json
          code: |-
            {
              "iss":       "https://login.example.com",
              "sub":       "248289761001",          // key your user records on (iss, sub)
              "aud":       "s6BhdRkqt3",            // your client_id
              "exp":       1763640000,
              "iat":       1763639700,
              "nonce":     "n-0S6_WzA2Mj",          // must equal what you stored
              "auth_time": 1763639690,              // when they actually authenticated
              "amr":       ["pwd", "otp"],          // how — password plus a one-time code
              "email":     "ada@example.com",
              "email_verified": true                // without this, do not match on email
            }
          what: "The decoded ID token. Note what is absent: no scopes, no permissions — it describes a login, not an authorization."
    - group: Being a relying party
      items:
        - lang: csharp
          code: |-
            builder.Services
                .AddAuthentication(o =>
                {
                    o.DefaultScheme          = CookieAuthenticationDefaults.AuthenticationScheme;
                    o.DefaultChallengeScheme = OpenIdConnectDefaults.AuthenticationScheme;
                })
                .AddCookie(o => o.Cookie.SameSite = SameSiteMode.Lax)
                .AddOpenIdConnect(o =>
                {
                    o.Authority     = "https://login.example.com";   // discovery + JWKS from here
                    o.ClientId      = "s6BhdRkqt3";
                    o.ClientSecret  = builder.Configuration["Oidc:Secret"];
                    o.ResponseType  = "code";                        // not "id_token", not hybrid
                    o.UsePkce       = true;
                    o.SaveTokens    = true;                          // keep them server-side
                    o.GetClaimsFromUserInfoEndpoint = true;          // once, at login
                    o.Scope.Clear();
                    foreach (var s in new[] { "openid", "profile", "email" }) o.Scope.Add(s);

                    o.TokenValidationParameters = new()
                    {
                        ValidateIssuer   = true,
                        ValidateAudience = true,
                        ValidAudience    = "s6BhdRkqt3",             // the ID token is for YOU
                        ClockSkew        = TimeSpan.FromSeconds(30), // not the 5-minute default
                        NameClaimType    = "name",
                        RoleClaimType    = "roles",
                    };
                });
          what: The handler validates signature, issuer, audience, expiry and nonce for you. Tightening `ClockSkew` from the default five minutes is worth doing.
        - lang: python
          code: |-
            from authlib.integrations.starlette_client import OAuth

            oauth = OAuth()
            oauth.register(
                name="idp",
                server_metadata_url="https://login.example.com/.well-known/openid-configuration",
                client_id="s6BhdRkqt3",
                client_secret=os.environ["OIDC_SECRET"],
                client_kwargs={"scope": "openid profile email",
                               "code_challenge_method": "S256"},
            )

            @app.get("/callback")
            async def callback(request: Request):
                token = await oauth.idp.authorize_access_token(request)   # checks state + PKCE
                claims = token["userinfo"]            # Authlib validated iss, aud, exp and nonce
                request.session["user"] = {"iss": claims["iss"], "sub": claims["sub"],
                                           "email": claims.get("email")}
                return RedirectResponse("/")
          what: Authlib reads the discovery document and validates the ID token, nonce included. Store `(iss, sub)` — not the email.
    - group: Logging out properly
      items:
        - lang: csharp
          code: |-
            // 1 — end your own session AND the provider's
            app.MapPost("/logout", async (HttpContext ctx) =>
            {
                await ctx.SignOutAsync(CookieAuthenticationDefaults.AuthenticationScheme);
                await ctx.SignOutAsync(OpenIdConnectDefaults.AuthenticationScheme);  // end_session
            });

            // 2 — accept logout for sessions ended elsewhere
            app.MapPost("/bff/backchannel-logout", async (HttpContext ctx, ILogoutTokenValidator v) =>
            {
                var form  = await ctx.Request.ReadFormAsync();
                var token = await v.ValidateAsync(form["logout_token"]);   // signature, iss, aud, events
                await sessions.RevokeAsync(token.Sub, token.Sid);          // kill this user's session
                return Results.Ok();
            });
          what: "Signing out locally only is the most common logout bug: the IdP session survives and the next click silently signs the user back in."
        - lang: python
          code: |-
            # the same two halves in Python
            @app.post("/logout")
            async def logout(request: Request):
                id_token = request.session.get("id_token")
                request.session.clear()                                   # 1. local session
                meta = await oauth.idp.load_server_metadata()
                return RedirectResponse(                                   # 2. the IdP session
                    f"{meta['end_session_endpoint']}"
                    f"?id_token_hint={id_token}"
                    f"&post_logout_redirect_uri={quote(POST_LOGOUT_URI)}"  # must be registered
                )
          what: "`id_token_hint` tells the provider which session to end, and avoids an \"are you sure?\" interstitial."
    - group: Inspecting a provider
      items:
        - lang: bash
          code: |-
            curl -s https://login.example.com/.well-known/openid-configuration | jq '{
              issuer, authorization_endpoint, token_endpoint, userinfo_endpoint,
              jwks_uri, end_session_endpoint,
              backchannel_logout_supported, code_challenge_methods_supported,
              id_token_signing_alg_values_supported, subject_types_supported
            }'
          what: The fastest way to learn what a provider actually supports — including whether back-channel logout and pairwise subjects are available.
prosCons:
  good:
    heading: Pros
    items:
      - A standard, interoperable answer to "who is this user?", instead of a per-vendor one.
      - The ID token is self-contained and verifiable offline against published keys.
      - Single sign-on across applications with one authentication.
      - Discovery and JWKS make endpoint and key rotation invisible to applications.
      - "`auth_time`, `acr` and `amr` support step-up authentication for sensitive operations."
      - Certified implementations exist for every language, so you need not write the hard parts.
  bad:
    heading: Cons
    items:
      - The ID token / access token distinction is subtle and routinely got wrong.
      - Validation has many steps, and skipping one is usually a vulnerability rather than a bug.
      - "Logout is genuinely hard: N+1 sessions, and front-channel mechanisms broken by browsers."
      - Claims beyond the standard set are provider-specific, so portability is partial.
      - SSO means one compromised identity session reaches every connected application.
      - Local development against a hosted provider is awkward — redirect URIs, HTTPS, cookies.
when:
  note: ID token to your app, access token to the API — get that right and most of the rest follows
  good:
    heading: Use it when…
    items:
      - You need to know who the user is, not just what an app may do.
      - Users should sign in once and reach several applications.
      - You would rather not store passwords at all.
      - Enterprise customers need to bring their own identity provider.
      - You need evidence of how and when someone authenticated.
  bad:
    heading: Avoid it when…
    items:
      - You only need API authorization with no user identity. Use **plain OAuth 2.0**.
      - It is one application with its own users and no SSO. Use **a session cookie** and a password or passkey.
      - Two services need to authenticate to each other. Use **client credentials or mTLS** — there is no user to identify.
      - The customer requires SAML. Use **SAML**, or a provider that bridges it.
      - You are considering writing the provider. Use **an existing one**; this is not a component to build.
useCases:
  - title: "\"Sign in with Google\""
    body: You want identity, not calendar access. Request `openid profile email`, validate the ID token, key the user on `(iss, sub)`, and create your own session. No password to store, no reset flow to build.
  - title: Internal SSO across a dozen apps
    body: One identity provider, twelve applications, one login per day. Each app redirects, the provider recognises its own session, and the user is back in under a second with no prompt.
  - title: Enterprise customers with their own IdP
    body: A B2B product federates to each customer's provider. Users keep their corporate credentials and MFA policy, and the tenant arrives as a claim — which the application validates rather than trusting the subdomain.
  - title: Step-up before a payment
    body: Browsing works with an ordinary session. Confirming a transfer re-runs authorization with `max_age=300` and a stronger `acr_values`, so the provider prompts for MFA and `auth_time` proves it happened.
  - title: Logout that actually logs out
    body: A shared workstation needs "sign out" to mean it. RP-initiated logout ends the IdP session, and back-channel logout notifies the other eleven applications server-to-server so none of them silently resumes.
gotchas:
  items:
    - mistake: Sending the ID token to an API
      why: It is addressed to your client, not to the API. A correct API rejects it on audience — and an API that checks only the signature accepts it, which means any client of that issuer can call you as any of its users.
      fix: ID token to your app, access token to the API. If you need a token for an API, request its scope and use what comes back in `access_token`.
    - mistake: Parsing the access token for identity
      why: It is opaque to you by contract, even when it happens to decode. Providers change the format, and your login breaks for reasons unrelated to your code.
      fix: read identity from the ID token or UserInfo. Treat the access token as a string you forward and nothing else.
    - mistake: No nonce, or never checking it
      why: Without it an ID token captured from another session or another flow can be replayed at your callback, and every other check will pass.
      fix: generate a random nonce per login attempt, store it with the session, and compare it to the token's claim. `state` does not cover this.
    - mistake: Keying users on email
      why: Email addresses change and get reassigned, and an unverified one lets an attacker register the victim's address at a sloppy provider and take over the account.
      fix: key on `(iss, sub)`. If you must match on email for account linking, require `email_verified` and prefer an explicit linking step.
    - mistake: Local logout only
      why: Clearing your own cookie leaves the IdP session intact, so the next protected page silently signs the user straight back in — which looks like logout being broken.
      fix: end both. Sign out locally and redirect to `end_session_endpoint` with `id_token_hint` and a registered post-logout URI.
    - mistake: Relying on front-channel logout
      why: It loads a hidden iframe per application, which depends on third-party cookies — now blocked by default in every major browser. It fails silently, so it looks like it works.
      fix: implement back-channel logout, where the provider POSTs a logout token to each application's server. Test it; silence is not success.
    - mistake: Ignoring azp with multiple audiences
      why: When a token carries several audiences, the `azp` claim names the client it was issued to. Checking only that your id appears in `aud` lets a token minted for a different client be replayed at your login.
      fix: if `azp` is present, require it to equal your client id. Good libraries do this; confirm yours does.
    - mistake: Treating the ID token as a session
      why: Storing it in a cookie and re-reading it on every request turns a short-lived login receipt into a long-lived bearer credential, with no revocation.
      fix: validate once, create your own session with your own lifetime and revocation, and throw the ID token away — except the copy kept for `id_token_hint` at logout.
alternatives:
  columns:
    - Approach
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs OIDC
  rows:
    - self: true
      cells:
        - "**OpenID Connect**"
        - federated identity and SSO
        - Medium
        - free; a provider to run or buy
        - —
    - cells:
        - "**Plain OAuth 2.0**"
        - API authorization only
        - Medium
        - free
        - No ID token and no standard identity — using it for login is the mistake OIDC fixes
    - cells:
        - "**SAML 2.0**"
        - enterprise SSO to web apps
        - High
        - free
        - XML assertions and browser POSTs; entrenched in enterprise, poor fit for mobile and APIs
    - cells:
        - "**Session cookies + passwords**"
        - a single application
        - Low
        - free
        - No federation, no SSO; you own password storage, reset and breach response
    - cells:
        - "**Passkeys / WebAuthn**"
        - phishing-resistant login
        - Medium
        - free
        - An authentication <em>method</em>, not a federation protocol — providers use it behind OIDC
    - cells:
        - "**Magic links**"
        - low-friction consumer login
        - Low
        - email delivery
        - No password, but email becomes the security boundary and delivery becomes a dependency
    - cells:
        - "**mTLS**"
        - service-to-service identity
        - Medium
        - certificate infrastructure
        - Identifies machines, not people; no consent, no claims, no SSO
  notes:
    - "**Pick plain OAuth** when there is no user to identify — machine-to-machine traffic needs no ID token."
    - "**Pick SAML** only when a customer requires it; bridge it at the provider rather than in your application."
    - "**Pick passkeys** as the authentication method <em>inside</em> OIDC, not as a replacement for it."
    - "**Pick session cookies** for a single app with its own users — federation you do not need is pure cost."
