overview:
  - EventStorming is a workshop. Domain experts and developers stand at a wall of paper, write things that happen in the business on orange sticky notes — in the past tense, one per note — and arrange them along a timeline. There is no upfront diagram, no notation to learn before you start, and no single person driving. In a morning a group that could not previously explain the domain has a shared picture of it on the wall.
  - What makes it effective is not the stickies but the format. Starting from <em>events</em> rather than entities keeps the conversation on what the business does instead of what the database stores. An enforced timeline makes gaps and contradictions physically visible. And writing disagreement onto a red **hotspot** rather than resolving it on the spot means the workshop surfaces the things nobody knew, which is usually its most valuable output.
  - "It comes in three levels: **Big Picture** to explore a whole business, **Process Modelling** to design a single flow, and **Design Level** to work out the software for one slice — and at that last level the stickies map one-to-one onto code: commands, aggregates, domain events, policies and read models. That is why it is usually taught alongside Domain-Driven Design, though it is a useful technique on its own."
architecture:
  svg: event-storming/architecture.svg
  alt: The EventStorming grammar connecting actor, command, aggregate, event and policy, with the sticky-note legend and how each colour maps to code
  caption: Seven colours, one timeline, and a rule that every note is a single fact. Everything else about the method is facilitation.
howItWorks:
  - md: "The first animation is a Big Picture session: chaos on a wall becoming a timeline, then boundaries. The second zooms into one slice at Design Level, where the stickies turn into code."
  - note: the goal is not a pretty wall — it is the argument that happens in front of it
  - anim:
      id: anim-wall
      title: 1 · Chaos, then a timeline, then boundaries
      svg: event-storming/anim-wall.svg
      alt: Orange sticky notes scattered on a wall being arranged into a timeline, duplicates merged, a hotspot added and pivotal events marking boundaries
      steps:
        - say: "Phase one: chaotic exploration. Everyone writes domain events on orange stickies — past tense, one fact per note — and puts them on the wall at the same time. No order, no discussion, nobody presenting."
          hl: [ ew-n1, ew-n2, ew-n3 ]
        - say: "Eight minutes of this produces more than two hours of round-table discussion, and it is already valuable: things appear that no single person in the room knew about."
          unhl: [ ew-n1, ew-n2, ew-n3 ]
          text:
            ew-msg: fifteen people writing in parallel — the quiet ones contribute too
        - say: "Phase two: enforce the timeline. The group starts arranging the notes left to right by when things actually happen. This is where the real work — and the real disagreement — begins."
          show: [ ew-axis, ew-axist ]
          hide: [ ew-msg ]
          move:
            ew-n1: [ -16, 120 ]
          text:
            ew-phase: phase 2 — enforce the timeline, left to right
        - say: "Immediately a problem: \"Order Submitted\" and \"Order Placed\" are the same thing with two names. That is the first vocabulary fight, and it is a free discovery about your ubiquitous language."
          hl: [ ew-n1, ew-n3 ]
        - say: Merge it, and write down which word won — because that is the word that will end up in the code. Do not tidy duplicates away during exploration; they are the evidence.
          hide: [ ew-n3 ]
          unhl: [ ew-n1 ]
        - say: "The rest falls into place: payment, stock, shipping, invoicing. A readable spine with messy branches beats a neat diagram that smoothed over an argument."
          move:
            ew-n2: [ -126, 128 ]
            ew-n5: [ -106, 48 ]
            ew-n4: [ 324, 56 ]
            ew-n6: [ -16, 40 ]
        - say: "Then a real disagreement: operations says stock is reserved before payment, finance says after. Nobody is certain. Do <em>not</em> resolve it — one argument can eat a whole workshop."
          hl: [ ew-n2, ew-n5 ]
        - say: Write it on a red hotspot, rotate it so it cannot be missed, give it an owner, move on. Collecting what the business does not know about itself is often the session's most valuable output.
          show: [ ew-hot ]
          unhl: [ ew-n2, ew-n5 ]
          text:
            ew-phase: hotspots — park the argument, keep the wall moving
        - say: "Near the end, mark pivotal events: the moments where the business changes phase. Before and after one, the language changes and usually the people do too."
          show: [ ew-p1, ew-p2 ]
          text:
            ew-phase: pivotal events — where one kind of work becomes another
        - say: Those lines are candidate bounded contexts. Sales, Fulfilment, Billing — found in one morning, before anyone committed them to services, which is when they are still cheap to move.
          show: [ ew-ctx ]
          text:
            ew-phase: candidate boundaries, read off the wall
            ew-axist: time — and three contexts that nobody had written down before today
  - anim:
      id: anim-grammar
      title: 2 · One slice, at design level
      svg: event-storming/anim-grammar.svg
      alt: Building one slice of the EventStorming grammar from an event back to its command, actor, aggregate, read model, external system and policy
      steps:
        - say: "Design level, one slice. Always start from the orange note: `Order Placed`. Everything else is found by asking what had to be true for it to happen."
          hl: [ eq-evt ]
        - say: "First question: what caused it? Usually a command — blue, imperative, `Place Order`. The difference that matters is that a command can be <em>refused</em>; an event cannot be."
          show: [ eq-cmd, eq-a3 ]
          hl: [ eq-cmd ]
          unhl: [ eq-evt ]
          text:
            eq-msg: events are facts · commands are intentions that may fail
        - say: "Second: who issued it? A small yellow actor — a role with a motivation, not a user account. \"A customer who has just compared prices\" tells you more than \"User\"."
          show: [ eq-actor, eq-a1 ]
          hl: [ eq-actor ]
          unhl: [ eq-cmd ]
        - say: "Third: what decides whether the command is allowed? The big yellow aggregate. Leave it nameless at first — just \"the thing that decides\" — until the group can state its rule out loud."
          show: [ eq-aggr, eq-a2 ]
          hl: [ eq-aggr ]
          unhl: [ eq-actor ]
        - say: "Now it earns a name, because the rule is sayable: \"an order cannot exceed ten items\". Naming entities first and inventing rules to fit them is the usual failure this avoids."
          unhl: [ eq-aggr ]
          text:
            eq-aggrt: "rule: max 10 items"
        - say: "Fourth: what was the actor looking at when they decided? A green read model. If nobody can name one, the actor is guessing — and that deserves a hotspot."
          show: [ eq-rm, eq-a5, eq-a6 ]
          hl: [ eq-rm ]
          text:
            eq-msg: every decision needs something to look at
        - say: "Fifth: some events arrive from outside. Pink marks an external system — a payment provider, a carrier, an overnight bank file. You do not control these and cannot change them."
          show: [ eq-ext, eq-a7 ]
          hl: [ eq-ext ]
          unhl: [ eq-rm ]
        - say: "Sixth, and the one that hides the most business logic: the policy. \"Whenever an order is placed, reserve the stock.\" Read it aloud — if it needs an \"if\" or an \"except\", it is two policies."
          show: [ eq-pol, eq-a4 ]
          hl: [ eq-pol ]
          unhl: [ eq-ext ]
        - say: "The policy issues the next command, and the loop closes. That is the entire grammar: actor, command, aggregate, event, policy — with read models feeding decisions and external systems at the edges."
          show: [ eq-loop ]
          unhl: [ eq-pol ]
          text:
            eq-msg: and round it goes — a chain of these across contexts is a saga
        - say: And it is not a drawing exercise. Blue becomes a command handler, big yellow an aggregate root, orange a domain event, lilac a process manager, green a projection, pink an anti-corruption layer. The wall transfers to code almost mechanically.
          hl: [ eq-cmd, eq-aggr, eq-evt, eq-pol, eq-rm, eq-ext ]
          text:
            eq-phase: every colour has a home in the codebase
            eq-msg: which is the strongest argument for running one before a big build
concepts:
  - term: Domain event
    short: Something that happened in the business, written in the past tense on an orange sticky — the atom of the whole method.
    see: [ Chaotic exploration, Command, Timeline ]
    detail: |-
      `Order Placed`, `Payment Declined`, `Parcel Returned`. The past tense is not a style rule: it forces the group to describe facts rather than wishes, screens or tables. "Order management" is not an event; "Order Cancelled" is, and it immediately invites the next question — by whom, and what happens next?

      Events are also the one vocabulary that domain experts and developers already share. Nobody has to learn UML, and nobody gets to hide behind "the system updates the record".

      #### Is it an event?

      | Written | Verdict |
      | --- | --- |
      | `Order Placed` | yes |
      | `Order Management` | no — a noun, not a fact |
      | `Place Order` | no — that is a command |
      | `Order Row Updated` | no — database, not business |
      | `Payment Declined by Issuer` | yes — and a useful one |

      #### How it relates

      - At design level these become the domain events in the code, and the records in an event store.
  - term: Chaotic exploration
    short: "The opening phase: everyone writes events at once, in silence, without agreeing an order or a format first."
    see: [ Domain event, Timeline, Facilitation ]
    detail: |-
      Deliberately unmanaged. Parallel writing means a room of fifteen produces in eight minutes what a round-table discussion would produce in two hours — and because nobody is presenting, quiet people contribute as much as loud ones.

      Resist the urge to tidy. Duplicates, wrong tenses and contradictions are information: a word two people spell differently is a vocabulary problem you were going to discover in production anyway.

      #### Facilitator's rules

      | Rule | Why |
      | --- | --- |
      | Everyone writes simultaneously | parallelism is the point |
      | No discussion yet | discussion serialises the room |
      | Past tense, one fact per note | keeps notes movable |
      | Do not deduplicate | duplicates reveal language gaps |

      #### How it relates

      - Steps 1–2 of the first animation.
  - term: Timeline
    short: Arranging the events left to right in the order they happen — the move that turns a wall of notes into a model.
    see: [ Chaotic exploration, Pivotal event, Hotspot ]
    detail: |-
      Enforcing an order is where the real work starts, because it forces the room to agree on sequence, and sequence is where people discover they disagree. Parallel branches get stacked vertically; alternative outcomes (`Payment Declined` beside `Payment Taken`) sit above or below the happy path.

      Do not try to make it tidy. A wall with a readable spine and messy branches is far more useful than a neat diagram that smoothed over an argument.

      #### Shapes you will see

      | Shape | Means |
      | --- | --- |
      | A long straight spine | the happy path |
      | Vertical stacking | things happening in parallel |
      | A big gap | nobody in the room owns that part |
      | A dense cluster | complexity worth zooming into later |

      #### How it relates

      - Gaps in the timeline are usually missing people, not missing events.
  - term: Hotspot
    short: A red sticky placed on a disagreement, an unknown or a risk — parked rather than resolved.
    see: [ Timeline, Facilitation, Pivotal event ]
    detail: |-
      Two people give different answers about when stock is reserved. The instinct is to settle it; the discipline is to write it on a red note, rotate it 45 degrees so it is impossible to miss, and move on. One argument can consume an entire workshop, and it is rarely the most important one.

      Hotspots are frequently the highest-value output of the session: a list of things the business does not actually know about itself, each one a question to answer before anyone writes code against it.

      #### What earns a red note

      | Trigger | Example |
      | --- | --- |
      | Disagreement | "we reserve before payment" / "after" |
      | Nobody knows | "what happens on a partial refund?" |
      | Hidden complexity | "this is where the 2019 spreadsheet lives" |
      | Missing person | "only compliance can answer this" |

      #### How it relates

      - Photograph the hotspots and turn them into a question list; that list is the agenda for the next session.
  - term: Pivotal event
    short: A moment where the business visibly changes phase — marked with a vertical line that often becomes a boundary.
    see: [ Timeline, Bounded context discovery, Hotspot ]
    anim:
      key: piv
      title: Pivots becoming boundaries
      svg: event-storming/piv.svg
      alt: A timeline of events split by pivotal events into three candidate bounded contexts
      steps:
        - say: Five events on one timeline. Read left to right it is a single flow, and there is no obvious place to cut it.
          hl: [ pv-e1, pv-e2, pv-e3, pv-e4, pv-e5 ]
        - say: "Ask the room: where does this stop being one kind of work and start being another? `Order Placed` is one — before it everything is a negotiation, after it everything is an obligation."
          show: [ pv-l1 ]
          unhl: [ pv-e1, pv-e2, pv-e3, pv-e4, pv-e5 ]
          text:
            pv-msg: "before: persuading · after: delivering"
        - say: "`Parcel Sent` is another: from here the conversation is about money, not goods, and the people talking change completely."
          show: [ pv-l2 ]
          text:
            pv-msg: the vocabulary changes at each line, and so do the people
        - say: Those two lines just produced three candidate bounded contexts, in about ninety seconds, from a wall anyone in the room can read.
          show: [ pv-c ]
          text:
            pv-msg: candidates, not conclusions — boundaries are still a design decision
    detail: |-
      `Order Placed`, `Payment Settled`, `Parcel Delivered`. Before and after a pivotal event the language changes, the people change, and often the rules change. Those are exactly the seams you want your software to break along.

      Choosing them is quick and surprisingly uncontroversial: ask the room "where does this stop being one kind of work and start being another?" and the answers usually agree.

      ::anim piv::

      #### How it relates

      - Pivotal events are the cheapest way to find candidate bounded contexts before committing them to code.
  - term: Command
    short: A blue sticky naming an intention in the imperative — the thing a person or system tried to do.
    see: [ Domain event, Actor, Aggregate ]
    detail: |-
      For every event, ask what caused it. Usually the answer is a command: `Place Order`, `Cancel Booking`, `Approve Invoice`. The crucial difference from an event is that a command can be <em>refused</em> — which is why the next question is always "who decides?".

      Commands are also the cleanest handover to code: one command, one handler, one intention. A command with no corresponding event is suspicious; so is an event with no command, unless it came from outside or from time passing.

      #### Causes of an event

      | Cause | Sticky |
      | --- | --- |
      | Someone did something | command + actor |
      | Another event happened | policy |
      | Something outside | external system |
      | Time passed | a policy on a schedule |

      #### How it relates

      - This is the same command/event distinction CQS and CQRS are built on.
  - term: Actor
    short: A small yellow sticky naming the person or role that issues a command, and why they would.
    see: [ Command, Read model, Policy ]
    detail: |-
      Not a user account — a role with a motivation: "warehouse supervisor chasing a late pick", "customer who has changed their mind". Naming the actor forces the room to ask what that person can actually see before deciding, which is how read models get discovered.

      If a command has no actor, it is probably automatic, which means there is a policy hiding behind it.

      #### How it relates

      - An actor with no **read model** in front of them is guessing — that is a design smell worth a hotspot.
  - term: Aggregate
    short: "A big yellow sticky between a command and its event: the chunk of business that decides whether the command is allowed."
    see: [ Command, Domain event, Design-Level ]
    detail: |-
      Brandolini's trick is to leave it nameless at first — just "the thing that decides". Only once the group can state the rule out loud ("an order cannot exceed ten items") does the sticky get a name. That avoids the usual failure of naming entities first and inventing rules to fit them.

      At Big Picture level you can skip aggregates entirely. They belong to design-level sessions.

      #### How it relates

      - Maps directly onto the DDD aggregate: the consistency boundary where the invariant lives.
  - term: Policy
    short: "A lilac sticky stating a reaction: \"whenever X happened, then do Y\" — the glue between one event and the next command."
    see: [ Domain event, Command, Saga ]
    detail: |-
      Policies are where business logic hides. "Whenever payment is taken, reserve the stock" sounds obvious; "whenever payment is taken <em>and the customer is in the EU and it is before 16:00</em>, reserve the stock" is three policies pretending to be one, and finding that out on a wall is far cheaper than finding it out in a code review.

      Read them aloud. If the sentence needs an "if", or an "except", split the note.

      #### Kinds of policy

      | Trigger | Example |
      | --- | --- |
      | Another event | whenever paid, reserve stock |
      | Time | every night at 02:00, settle |
      | A threshold | whenever stock < 10, reorder |
      | A human decision | "someone looks at it" — name the actor |

      #### How it relates

      - A chain of policies across several contexts is a saga; in code it becomes a process manager.
  - term: Read model
    short: A green sticky naming the information an actor looks at before issuing a command.
    see: [ Actor, Command, CQRS ]
    detail: |-
      "The picker looks at the pick list"; "the approver looks at the customer's credit history". Making this explicit catches a very common design failure: a screen that does not show the one number the decision actually depends on.

      It also hands you your query requirements directly, which is why design-level EventStorming leads so naturally into CQRS.

      #### How it relates

      - Each green sticky is a projection in a CQRS read side.
  - term: External system
    short: A pink sticky for anything outside the boundary that emits or receives events — and that you cannot change.
    see: [ Policy, Domain event, Big Picture ]
    detail: |-
      Payment providers, carriers, the regulator's filing portal, the 1998 mainframe. Marking them pink makes the integration surface visible at a glance, and pink clusters are where schedule risk lives: every one is a contract you do not control, with its own failure modes and its own vocabulary.

      #### How it relates

      - Each pink sticky is a candidate anti-corruption layer in DDD terms.
  - term: Big Picture
    short: "The first level: a whole business or product explored in one session, with the widest possible group of people."
    see: [ Chaotic exploration, Pivotal event, Facilitation ]
    detail: |-
      Four hours, fifteen to thirty people, eight metres of paper. Only orange events, plus red hotspots and maybe pink external systems — no commands, no aggregates. The output is a shared map, a list of unknowns, and candidate boundaries.

      Its real value is usually social: for many organisations it is the first time sales, operations, finance and engineering have described the same process in one room.

      #### Shape of the session

      | Setting | Typical |
      | --- | --- |
      | Duration | 3–4 hours |
      | People | 15–30, mixed roles |
      | Stickies used | orange, red, (pink) |
      | Output | boundaries, hotspots, vocabulary |

      #### How it relates

      - Run this before deciding on services or modules — it is the cheapest boundary-finding tool there is.
  - term: Process Modelling
    short: "The middle level: one end-to-end flow worked out in detail, adding commands, policies, actors and read models."
    see: [ Policy, Command, Design-Level ]
    detail: |-
      Narrower scope, smaller group, more colours. This is where "how does a refund actually work?" gets answered completely, including the branches nobody documents: partial refunds, refunds after the parcel shipped, refunds on a card that has expired.

      The output is close to a specification, and usually good enough to start building from.

      #### How it relates

      - Policies discovered here are what later become sagas or process managers.
  - term: Design-Level
    short: "The deepest level: one aggregate at a time, producing a model you can type in almost directly."
    see: [ Aggregate, Command, Read model ]
    detail: |-
      Three or four people, a couple of hours, one slice. Every command has an aggregate, every aggregate has stated invariants, every actor has a read model. At this point the wall and the code are isomorphic, and the handover is mechanical rather than interpretive.

      Do not try to reach this level for the whole system. Use it on the complex, differentiating parts — the core domain — and leave the rest alone.

      #### Sticky to code

      | Sticky | Code |
      | --- | --- |
      | Command (blue) | command + handler |
      | Aggregate (big yellow) | aggregate root |
      | Event (orange) | domain event |
      | Policy (lilac) | process manager / saga |
      | Read model (green) | projection |
      | External system (pink) | anti-corruption layer |

      #### How it relates

      - Step 9 of the second animation is exactly this table.
  - term: Bounded context discovery
    short: Reading candidate boundaries off the finished wall, where the language and the people change.
    see: [ Pivotal event, Big Picture, Hotspot ]
    detail: |-
      Look for three signals: a pivotal event, a change in vocabulary (the same word meaning something new), and a change in who is talking. Where all three coincide, draw a line — that is a candidate bounded context, and it was found in a morning rather than discovered after six months of building.

      Treat them as candidates, not conclusions. The wall is evidence, and boundaries are still a design decision.

      #### Signals

      | Signal | Strength |
      | --- | --- |
      | Same word, different meaning | strong |
      | Different people talking | strong |
      | Pivotal event | medium |
      | A gap in the timeline | weak — may just be a missing person |

      #### How it relates

      - This is how most teams actually arrive at a context map.
  - term: Unlimited modelling space
    short: The deliberate constraint that the wall must never run out — because scarcity makes people stop writing.
    see: [ Chaotic exploration, Facilitation, Remote ]
    detail: |-
      Brandolini is emphatic about this. A small whiteboard silently tells participants to be selective, and selective is exactly what you do not want during exploration. Eight metres of butcher paper costs almost nothing and changes the behaviour of the room.

      The same applies remotely: give the board far more canvas than the session could possibly use, and never fit the model to a slide.

      #### Practical

      | Setting | Advice |
      | --- | --- |
      | Paper | 6–10 m, at standing height |
      | Chairs | remove them |
      | Remote canvas | effectively infinite; never zoom to fit |

      #### How it relates

      - Standing and a long wall are the two changes with the biggest effect on participation.
  - term: Facilitation
    short: "The small set of behaviours that decide whether the session works: timeboxing, parking arguments, and keeping the loudest person off the wall."
    see: [ Hotspot, Chaotic exploration, Big Picture ]
    detail: |-
      The facilitator does not model. Their job is to keep everyone writing in parallel, to convert arguments into red hotspots, to stop one expert narrating while fourteen people watch, and to keep the timeline moving. A good session feels slightly uncomfortable and ends on time.

      The two most common failures are both social: an authority figure dictating the model, and the group sliding into solution design before the problem is on the wall.

      #### Moves that work

      | Situation | Move |
      | --- | --- |
      | Two people arguing | "that is a hotspot" — write it, move on |
      | One person narrating | hand everyone a pen, restart parallel writing |
      | Drifting into solutions | "what happened?", not "what should we build?" |
      | Wall gone quiet | walk the timeline aloud, end to end |
      | Running out of time | photograph it; hotspots are a valid ending |

      #### How it relates

      - Facilitation, not notation, is what separates a useful session from an expensive one.
commands:
  heading: Running one — the practical bits
  tocLabel: Running one
  groups:
    - group: Materials
      items:
        - code: |-
            8 m  butcher paper, taped at standing height (never a whiteboard)
            500+ orange stickies   domain events      "Order Placed"
            200  blue              commands           "Place Order"
            100  lilac / purple    policies           "whenever... then..."
            100  yellow            aggregates (big) + actors (small)
            100  green             read models
             50  pink              external systems
             50  red               hotspots  - rotate 45 degrees
                 one marker per person, same colour, thick tip
                 NO chairs
          what: "The quantities are not a joke: running out of orange ends the exploration phase early. One marker each means everybody writes."
    - group: A Big Picture run sheet
      items:
        - code: |-
            00:00  framing          what we are exploring, and the one rule: past tense
            00:10  chaotic explore  everyone writes events, in silence, in parallel
            00:35  enforce timeline group arranges left to right; duplicates surface
            01:15  walk the wall    narrate end to end; gaps and hotspots appear
            01:45  break
            02:00  pivotal events   mark phase changes with vertical lines
            02:20  boundaries       where language and people change, draw a line
            02:50  hotspot review   read every red note aloud; assign an owner
            03:20  close            photograph everything, agree the next session
          what: Timeboxed, and the walk-the-wall step is the one never to skip — it is where the gaps become obvious.
        - code: |-
            # facilitator phrases that do most of the work
            "Past tense, please."
            "That's a hotspot — write it red and we'll come back."
            "What happened just before that?"
            "Who did that? What were they looking at when they decided?"
            "Everyone write, nobody talk, for five minutes."
          what: Five sentences cover roughly 90% of facilitation. The rest is keeping time and keeping people standing.
    - group: Remote sessions
      items:
        - code: |-
            canvas      effectively infinite; never "zoom to fit"
            groups      break out into 3-4 people; plenary only to walk the wall
            timing      shorter blocks, more of them - 90 min max per block
            tooling     Miro / Mural / FigJam; lock the legend, not the notes
            camera      everyone on, or the parallel-writing phase dies quietly
          what: Remote loses the standing-and-pointing dynamic, so compensate with smaller groups and shorter, more frequent blocks.
    - group: From wall to code
      items:
        - lang: csharp
          code: |-
            // blue  "Place Order"          -> command + handler
            public sealed record PlaceOrder(Guid CartId, Guid CustomerId);

            // yellow "Order"               -> aggregate root, holding the invariant
            public sealed class Order { public void Place(...) { /* rule here */ } }

            // orange "Order Placed"        -> domain event
            public sealed record OrderPlaced(Guid OrderId, DateTime At);

            // lilac  "whenever placed,     -> process manager / saga
            //         reserve the stock"
            public sealed class ReservationProcess : IHandle<OrderPlaced> { }

            // green  "basket + stock"      -> projection on the read side
            // pink   "payment provider"    -> anti-corruption layer
          what: A design-level wall transfers to code almost mechanically — which is the strongest argument for running one before a big build.
        - lang: python
          code: |-
            # blue  "Place Order"      -> command + handler
            @dataclass(frozen=True)
            class PlaceOrder:
                cart_id: UUID
                customer_id: UUID

            # orange "Order Placed"    -> domain event
            @dataclass(frozen=True)
            class OrderPlaced:
                order_id: UUID
                at: datetime

            # yellow "Order"           -> aggregate root, holding the invariant
            class Order:
                def place(self, cmd: PlaceOrder) -> list[OrderPlaced]: ...

            # lilac  "whenever placed, reserve the stock" -> process manager
            class ReservationProcess:
                def handle(self, event: OrderPlaced) -> None: ...

            # green  "basket + stock"  -> projection      # pink "payment provider" -> ACL
          what: "The wall transfers just as mechanically in Python: frozen dataclasses for commands and events, a class per aggregate, a handler per policy."
        - code: |-
            # what to keep afterwards
            photos/          high-res, overlapping, left to right (the model IS the photo)
            hotspots.md      every red note, with an owner and a date
            glossary.md      the words that won the vocabulary fights
            contexts.md      candidate boundaries + the signal that suggested each
          what: The wall decays within days. These four artefacts are what survives the session and what the next one starts from.
prosCons:
  good:
    heading: Pros
    items:
      - "Extremely fast: a morning produces understanding that weeks of interviews and documents usually do not."
      - No notation to learn, so domain experts contribute directly instead of reviewing someone's diagram.
      - Parallel writing gets contributions from quiet people and avoids the loudest voice setting the model.
      - Surfaces what nobody knew — hotspots are often more valuable than the timeline itself.
      - Finds bounded contexts before you commit them to services, which is when they are cheap to move.
      - At design level the output maps almost mechanically onto code.
  bad:
    heading: Cons
    items:
      - Needs the right people in one room at one time, which is often the hardest part to arrange.
      - "Facilitation-dependent: a weak facilitator produces an expensive, inconclusive meeting."
      - The artefact decays — a wall of stickies is not documentation and will not survive the week.
      - Works poorly remotely without deliberate adaptation.
      - Can drift into solution design the moment someone says "so we'd have a microservice that…".
      - Little value where the domain is genuinely simple or already well understood.
when:
  note: if you can get the right eight people for three hours, it is almost always worth it
  good:
    heading: Use it when…
    items:
      - Nobody can explain the whole process end to end, and the documents disagree.
      - You are about to draw boundaries — services, modules, team ownership.
      - Domain experts and developers are talking past each other.
      - A new team needs to understand a complex domain quickly.
      - A flow is about to be rebuilt and its real branches are undocumented.
  bad:
    heading: Avoid it when…
    items:
      - The domain is simple CRUD and everyone already agrees. Use **a whiteboard and twenty minutes**.
      - You cannot get domain experts in the room. Use **interviews and Domain Storytelling** until you can.
      - The question is about UI or user journeys. Use **user story mapping**.
      - The question is technical, not domain — throughput, storage, deployment. Use **an architecture review or an ADR**.
      - Someone senior has already decided the model and wants it ratified. Use **honesty** — the workshop will not survive a predetermined answer.
useCases:
  - title: Before splitting a monolith
    body: A team is about to carve services out of a monolith and cannot agree where. One Big Picture session shows the language changing at `Order Placed` and again at `Parcel Delivered`, and that the `customers` table is used by three groups who mean different things by "customer". The split follows the wall, not the schema.
  - title: Onboarding into an opaque domain
    body: A new team inherits an insurance product nobody can explain end to end. Three hours with underwriting, claims and finance produces a timeline, nineteen hotspots and a glossary — and the hotspots become the first sprint's questions rather than its bugs.
  - title: Specifying a complex flow
    body: "\"How do refunds work?\" has four different answers in the company. A process-modelling session walks every branch — partial, post-shipment, expired card, goodwill — and the lilac policies turn directly into the process manager that gets built."
  - title: Finding the integration risk early
    body: "Halfway through the wall, the pink stickies cluster: six external systems in one phase, three of them batch-only overnight. The schedule risk is visible on day one instead of in month four."
  - title: Settling a vocabulary war
    body: Two teams have argued for months about "booking" versus "reservation". On the wall it becomes obvious they are different things at different points in the timeline. Both words survive, in different contexts, and the argument ends.
gotchas:
  items:
    - mistake: Not past tense
      why: Once `Order Management` and `Update Customer` appear on orange notes, the wall stops being a timeline and becomes a feature list — and the sequencing step no longer works.
      fix: correct it out loud every time in the first ten minutes. After that the room self-polices, and the rule costs nothing.
    - mistake: Resolving every argument
      why: One contested detail can eat ninety minutes while fifteen people watch two of them debate, and the wall stops growing.
      fix: red hotspot, rotated 45 degrees, owner's name, move on. Collecting the unknowns is a legitimate — often the best — outcome.
    - mistake: Missing the person who actually knows
      why: A beautiful wall built without the one operations specialist is confidently wrong, and the error is discovered after the design is committed.
      fix: before booking, list who must be there and treat absence as a reason to reschedule. A gap in the timeline usually means a missing person, not a missing event.
    - mistake: Designing the solution
      why: Within an hour someone says "so we'd have a service that…" and the room switches from describing the business to designing software, which is a different and much less informed conversation.
      fix: ask "what happened?", never "what should we build?". Park solution ideas on a separate note and off the timeline.
    - mistake: A board that is too small
      why: Limited space silently tells people to be selective, and selectivity is exactly what kills the exploration phase.
      fix: "more paper than you can possibly use, at standing height, and remove the chairs. Remotely: a huge canvas and never \"zoom to fit\"."
    - mistake: Tidying as you go
      why: "Deduplicating early destroys the evidence: two notes with different words for the same thing is the vocabulary problem you came to find."
      fix: let duplicates accumulate during exploration. Merge them later, out loud, and record which word won.
    - mistake: No follow-up
      why: The photos sit in a chat thread, the hotspots are never answered, and in three weeks the session is remembered as a nice day out.
      fix: leave with hotspots written up, each with an owner and a date, plus a glossary and a candidate context list. Book the next session before people leave the room.
    - mistake: Expecting documentation
      why: A wall of stickies is a thinking tool, not an artefact. It falls off the wall, and the photo is unreadable in two months.
      fix: convert the durable parts the same day — glossary, hotspot list, candidate boundaries, and for design-level sessions the code skeleton itself.
alternatives:
  columns:
    - Technique
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs EventStorming
  rows:
    - self: true
      cells:
        - "**EventStorming**"
        - exploring a whole domain fast, finding boundaries
        - Low to run, high to facilitate
        - free; paper and people
        - —
    - cells:
        - "**Domain Storytelling**"
        - understanding one concrete scenario end to end
        - Low
        - free
        - Pictographic story told by one expert; calmer, narrower, easier with few people
    - cells:
        - "**Event Modeling**"
        - turning a flow into a buildable specification
        - Medium
        - free
        - More prescriptive, includes UI wireframes and a strict swimlane layout
    - cells:
        - "**User story mapping**"
        - planning releases around user journeys
        - Low
        - free
        - Organised by user goals and slices, not business events; a planning tool
    - cells:
        - "**Example Mapping**"
        - pinning down the rules of one story
        - Low
        - free
        - Tiny scope, 25 minutes, produces concrete examples and test cases
    - cells:
        - "**Wardley Mapping**"
        - deciding what to build, buy or outsource
        - Medium
        - free
        - Strategy and evolution, not process; answers a different question entirely
    - cells:
        - "**Interviews and documents**"
        - when you cannot get people together
        - Low
        - time
        - Serial, slow, and never surfaces disagreement between experts
  notes:
    - "**Pick Domain Storytelling** when you have one or two experts and one concrete scenario, rather than a crowd and a whole domain."
    - "**Pick Event Modeling** when the goal is a specification to build from, including screens."
    - "**Pick user story mapping** for release planning — it answers \"what do we ship first?\", not \"what does the business do?\"."
    - "**Pick Example Mapping** for the rules of a single story, right before implementation."
    - "**Pick Wardley Mapping** for build-versus-buy and strategic positioning; it pairs well, answering a question EventStorming does not ask."
