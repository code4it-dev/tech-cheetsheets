title: EventStorming
slug: event-storming
tagline: Put everyone who knows something in front of one very long wall, and find out what the business actually does.
asof: Nov 2026 · invented by Alberto Brandolini, 2013 · a workshop format, not a notation
description: "EventStorming cheatsheet: the sticky-note grammar, the three levels, how a wall of orange notes becomes bounded contexts, and how the picture maps one-to-one onto code."
aliases:
  - EventStorming
  - Event Storming
  - event storming
  - Big Picture EventStorming
  - Design-Level EventStorming
  - pivotal event
  - hotspot
keywords:
  - eventstorming
  - event storming
  - ddd
  - workshop
  - domain modelling
