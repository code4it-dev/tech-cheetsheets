<svg viewBox="0 0 800 336" role="img" aria-label="An agent loop: the model requests a tool, the harness dispatches it, appends the result, and calls again until a stop condition fires">
  <defs>
    <marker id="hl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="hl-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">task: &ldquo;which customers are over their credit limit, and by how much?&rdquo;</text>

  <rect id="hl-ctx" x="16" y="46" width="200" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="116" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">the message list</text>
  <text id="hl-ctxt" x="116" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">2 messages</text>

  <rect id="hl-model" x="300" y="46" width="200" height="62" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="400" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">the model</text>
  <text id="hl-modelt" x="400" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">idle</text>

  <rect id="hl-tools" x="584" y="46" width="200" height="62" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="684" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">tools</text>
  <text id="hl-toolst" x="684" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">3 registered</text>

  <line x1="220" y1="77" x2="294" y2="77" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#hl-arr)"/>
  <line x1="504" y1="77" x2="578" y2="77" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#hl-arr)"/>

  <g id="hl-msg" class="hidden">
    <rect x="16" y="114" width="200" height="24" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
    <text id="hl-msgt" x="116" y="130" font-size="8.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  </g>

  <rect id="hl-tr" x="16" y="150" width="440" height="140" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="hl-trt" x="30" y="170" font-size="11" fill="#23362e" font-weight="700">the message list the harness owns</text>
  <text id="hl-t1" x="30" y="190" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="hl-t2" x="30" y="208" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="hl-t3" x="30" y="226" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="hl-t4" x="30" y="244" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="hl-t5" x="30" y="262" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="hl-t6" x="30" y="280" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="hl-bud" x="472" y="150" width="312" height="140" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="hl-bt" x="486" y="170" font-size="11" fill="#23362e" font-weight="700">what the harness is counting</text>
  <text id="hl-b1" x="486" y="192" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">steps:   0 / 12</text>
  <text id="hl-b2" x="486" y="212" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">tokens:  0 / 60,000</text>
  <text id="hl-b3" x="486" y="232" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">wall:    0.0s / 120s</text>
  <text id="hl-b4" x="486" y="252" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">cost:    $0.000</text>
  <text id="hl-b5" x="486" y="272" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="hl-verd" x="16" y="300" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="hl-v" x="400" y="319" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the model never remembers — the list is resent in full, every single call</text>
</svg>
