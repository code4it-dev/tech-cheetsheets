<svg viewBox="0 0 800 364" role="img" aria-label="An agent harness surrounding a model: prompt assembly, the loop, tool dispatch, context management, policy, budgets and observability">
  <defs>
    <marker id="ha-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the model is the small box in the middle</text>

  <rect x="16" y="36" width="768" height="236" rx="10" fill="#fbfcf8" stroke="#2f6b3f" stroke-width="2"/>
  <text x="32" y="58" font-size="11.5" fill="#2f6b3f" font-weight="700">THE HARNESS &mdash; your code</text>

  <rect x="300" y="128" width="200" height="72" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="400" y="154" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">the model</text>
  <text x="400" y="172" font-size="9.5" text-anchor="middle" fill="#5f6f66">messages in, message out</text>
  <text x="400" y="190" font-size="9.5" text-anchor="middle" fill="#5f6f66">stateless, every single call</text>

  <rect x="32" y="72" width="170" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="117" y="92" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">prompt assembly</text>
  <text x="117" y="108" font-size="8.5" text-anchor="middle" fill="#5f6f66">instructions · context · history</text>

  <rect x="216" y="72" width="170" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="301" y="92" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">tool registry</text>
  <text x="301" y="108" font-size="8.5" text-anchor="middle" fill="#5f6f66">local fns · MCP servers</text>

  <rect x="400" y="72" width="170" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="485" y="92" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">policy &amp; approval</text>
  <text x="485" y="108" font-size="8.5" text-anchor="middle" fill="#5f6f66">what needs a human</text>

  <rect x="584" y="72" width="184" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="676" y="92" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">budgets &amp; limits</text>
  <text x="676" y="108" font-size="8.5" text-anchor="middle" fill="#5f6f66">steps · tokens · wall clock</text>

  <rect x="32" y="210" width="170" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="117" y="230" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">context management</text>
  <text x="117" y="246" font-size="8.5" text-anchor="middle" fill="#5f6f66">compaction · pruning</text>

  <rect x="216" y="210" width="170" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="301" y="230" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">tool dispatch</text>
  <text x="301" y="246" font-size="8.5" text-anchor="middle" fill="#5f6f66">validate · run · summarise</text>

  <rect x="400" y="210" width="170" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="485" y="230" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">error handling</text>
  <text x="485" y="246" font-size="8.5" text-anchor="middle" fill="#5f6f66">retry · reframe · give up</text>

  <rect x="584" y="210" width="184" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="676" y="230" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">traces &amp; evals</text>
  <text x="676" y="246" font-size="8.5" text-anchor="middle" fill="#5f6f66">every step, replayable</text>

  <line x1="400" y1="122" x2="400" y2="124" stroke="#5f6f66" stroke-width="1.5"/>
  <path d="M 250 150 L 294 150" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ha-arr)" fill="none"/>
  <path d="M 506 178 L 550 178" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ha-arr)" fill="none"/>
  <path d="M 554 178 L 554 206 L 310 206" stroke="#5f6f66" stroke-width="1.5" fill="none"/>
  <path d="M 246 206 L 246 154 L 294 154" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ha-arr)" fill="none" stroke-dasharray="4 3"/>
  <text x="236" y="186" font-size="9" fill="#5f6f66">loop</text>

  <text class="hand" x="400" y="302" fill="#c53b3b" font-size="16" text-anchor="middle">swap the model and you change the ceiling. swap the harness and you change the floor.</text>
  <text x="400" y="334" font-size="11" text-anchor="middle" fill="#5f6f66">the model holds no state between calls &mdash; the entire &ldquo;memory&rdquo; of an agent is a list the harness maintains</text>
</svg>
