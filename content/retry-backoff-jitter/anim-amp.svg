<svg viewBox="0 0 800 320" role="img" aria-label="Retries at three layers multiplying one user request into twenty-seven database calls">
  <defs>
    <marker id="ra-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="ra-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">every layer is "just being resilient" &mdash; and nobody counts the product</text>

  <rect id="ra-c" x="20" y="48" width="170" height="70" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text id="ra-ct" x="105" y="94" font-size="10" text-anchor="middle" fill="#5f6f66">retry 3&times;</text>
  <text id="ra-cn" x="105" y="110" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">1</text>
  <line x1="194" y1="83" x2="214" y2="83" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ra-arr)"/>

  <rect id="ra-g" x="218" y="48" width="170" height="70" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="303" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">gateway</text>
  <text id="ra-gt" x="303" y="94" font-size="10" text-anchor="middle" fill="#5f6f66">retry 3&times;</text>
  <text id="ra-gn" x="303" y="110" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">—</text>
  <line x1="392" y1="83" x2="412" y2="83" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ra-arr)"/>

  <rect id="ra-s" x="416" y="48" width="170" height="70" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="501" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">orders service</text>
  <text id="ra-st" x="501" y="94" font-size="10" text-anchor="middle" fill="#5f6f66">retry 3&times;</text>
  <text id="ra-sn" x="501" y="110" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">—</text>
  <line x1="590" y1="83" x2="610" y2="83" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ra-arr)"/>

  <rect id="ra-d" x="614" y="48" width="166" height="70" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="697" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">database</text>
  <text id="ra-dt" x="697" y="94" font-size="10" text-anchor="middle" fill="#5f6f66">struggling</text>
  <text id="ra-dn" x="697" y="110" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">—</text>

  <rect id="ra-panel" x="20" y="142" width="760" height="78" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ra-p1" x="36" y="166" font-size="11" fill="#23362e" font-weight="700">calls reaching the database from one user action: 1</text>
  <text id="ra-p2" x="36" y="188" font-size="10.5" fill="#5f6f66">latency the user waits: 1 attempt</text>
  <text id="ra-p3" x="36" y="208" font-size="10.5" fill="#5f6f66">at 1,000 concurrent users: 1,000 calls</text>

  <rect id="ra-verd" x="20" y="236" width="760" height="68" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ra-v" x="400" y="260" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">the database starts failing &mdash; watch the arithmetic</text>
  <text id="ra-v2" x="400" y="284" font-size="10.5" text-anchor="middle" fill="#5f6f66">each layer retries three times, independently, and none of them knows about the others</text>
</svg>
