    <rect x="196" y="220" width="12" height="30" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect x="246" y="228" width="12" height="22" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect x="292" y="222" width="12" height="28" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect x="338" y="230" width="12" height="20" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect x="390" y="224" width="12" height="26" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect x="442" y="228" width="12" height="22" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect x="498" y="232" width="12" height="18" fill="#e3eedc" stroke="#2f6b3f"/>
