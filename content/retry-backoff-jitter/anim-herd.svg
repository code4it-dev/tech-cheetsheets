<svg viewBox="0 0 800 320" role="img" aria-label="A thousand clients retrying in synchronised spikes with plain exponential backoff, then spread smoothly by jitter">
  <text id="hb-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">1,000 clients, one two-second blip &mdash; and everyone fails at the same instant</text>

  <line x1="80" y1="250" x2="770" y2="250" stroke="#a9b5a6" stroke-width="1.5"/>
  <line x1="80" y1="46" x2="80" y2="250" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="72" y="88" font-size="10" text-anchor="end" fill="#5f6f66">1,000</text>
  <text x="72" y="221" font-size="10" text-anchor="end" fill="#5f6f66">200</text>
  <text x="72" y="254" font-size="10" text-anchor="end" fill="#5f6f66">0</text>
  <text x="30" y="150" font-size="10.5" fill="#5f6f66">req/s</text>
  <line x1="80" y1="217" x2="770" y2="217" stroke="#2f6b3f" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="794" y="221" font-size="9.5" text-anchor="end" fill="#2f6b3f">capacity</text>
  <text x="420" y="276" font-size="10.5" text-anchor="middle" fill="#5f6f66">time after the failure &rarr;</text>
  <text x="148" y="266" font-size="9.5" text-anchor="middle" fill="#5f6f66">1 s</text>
  <text x="216" y="266" font-size="9.5" text-anchor="middle" fill="#5f6f66">2 s</text>
  <text x="352" y="266" font-size="9.5" text-anchor="middle" fill="#5f6f66">4 s</text>
  <text x="624" y="266" font-size="9.5" text-anchor="middle" fill="#5f6f66">8 s</text>

  <rect id="hb-s1" class="hidden" x="140" y="83" width="18" height="167" fill="#f9e3df" stroke="#c53b3b"/>
  <rect id="hb-s2" class="hidden" x="208" y="83" width="18" height="167" fill="#f9e3df" stroke="#c53b3b"/>
  <rect id="hb-s3" class="hidden" x="344" y="83" width="18" height="167" fill="#f9e3df" stroke="#c53b3b"/>
  <rect id="hb-s4" class="hidden" x="616" y="83" width="18" height="167" fill="#f9e3df" stroke="#c53b3b"/>

  <g id="hb-jit" class="hidden">
    <rect x="112" y="222" width="12" height="28" fill="#e3eedc" stroke="#2f6b3f"/>
