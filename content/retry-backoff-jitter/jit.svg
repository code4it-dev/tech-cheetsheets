    <rect x="352" y="102" width="6" height="16"/><rect x="386" y="102" width="6" height="16"/>
    <rect x="424" y="102" width="6" height="16"/><rect x="468" y="102" width="6" height="16"/>
  </g>
  <text id="jt-ft" x="110" y="134" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <text x="30" y="174" font-size="10.5" fill="#23362e" font-weight="600">decorr.</text>
  <line x1="110" y1="168" x2="530" y2="168" stroke="#d5dccf"/>
  <g id="jt-d" class="hidden" fill="#2f6b3f">
