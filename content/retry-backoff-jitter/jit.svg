  <line x1="110" y1="52" x2="530" y2="52" stroke="#d5dccf"/>
  <g id="jt-n"><rect x="296" y="42" width="10" height="20" fill="#c53b3b"/></g>
  <text id="jt-nt" x="110" y="76" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <text x="30" y="116" font-size="10.5" fill="#23362e" font-weight="600">full</text>
  <line x1="110" y1="110" x2="530" y2="110" stroke="#d5dccf"/>
  <g id="jt-f" class="hidden" fill="#2f6b3f">
    <rect x="124" y="102" width="6" height="16"/><rect x="158" y="102" width="6" height="16"/>
    <rect x="186" y="102" width="6" height="16"/><rect x="214" y="102" width="6" height="16"/>
