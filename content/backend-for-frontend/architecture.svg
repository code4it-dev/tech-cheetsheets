<svg viewBox="0 0 800 330" role="img" aria-label="Three clients each with their own backend-for-frontend, all calling the same shared downstream services">
  <defs>
    <marker id="bf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">one backend per experience &mdash; shared services underneath</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="20" y="48" width="130" height="52" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/><text x="85" y="70" fill="#23362e">Mobile app</text><text x="85" y="88" font-size="10.5" fill="#5f6f66">150 ms away</text>
    <rect x="20" y="132" width="130" height="52" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/><text x="85" y="154" fill="#23362e">Web SPA</text><text x="85" y="172" font-size="10.5" fill="#5f6f66">20 ms away</text>
    <rect x="20" y="216" width="130" height="52" rx="7" fill="#fbfcf8" stroke="#a9b5a6"/><text x="85" y="238" fill="#23362e">Partner</text><text x="85" y="256" font-size="10.5" fill="#5f6f66">machine to machine</text>
  </g>

  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#bf-arr)">
    <line x1="150" y1="74" x2="194" y2="74"/><line x1="150" y1="158" x2="194" y2="158"/><line x1="150" y1="242" x2="194" y2="242"/>
  </g>

  <g font-size="12.5" text-anchor="middle">
    <rect x="198" y="48" width="160" height="52" rx="7" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/><text x="278" y="70" fill="#23362e">Mobile BFF</text><text x="278" y="88" font-size="10.5" fill="#5f6f66">owned by the app team</text>
    <rect x="198" y="132" width="160" height="52" rx="7" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/><text x="278" y="154" fill="#23362e">Web BFF</text><text x="278" y="172" font-size="10.5" fill="#5f6f66">owned by the web team</text>
    <rect x="198" y="216" width="160" height="52" rx="7" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/><text x="278" y="238" fill="#23362e">Public API</text><text x="278" y="256" font-size="10.5" fill="#5f6f66">versioned, documented</text>
  </g>

  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#bf-arr)">
    <line x1="358" y1="74" x2="446" y2="120"/><line x1="358" y1="158" x2="446" y2="152"/><line x1="358" y1="242" x2="446" y2="190"/>
  </g>
  <text x="402" y="112" font-size="10" text-anchor="middle" fill="#5f6f66">~5 ms</text>

  <rect x="450" y="48" width="330" height="222" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="615" y="70" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Domain services &mdash; shared, client-agnostic</text>
  <g font-size="11" text-anchor="middle" fill="#23362e">
    <rect x="466" y="84" width="140" height="30" rx="5" fill="#e3eedc" stroke="#2f6b3f"/><text x="536" y="103">profile</text>
    <rect x="624" y="84" width="140" height="30" rx="5" fill="#e3eedc" stroke="#2f6b3f"/><text x="694" y="103">basket</text>
    <rect x="466" y="124" width="140" height="30" rx="5" fill="#e3eedc" stroke="#2f6b3f"/><text x="536" y="143">catalogue</text>
    <rect x="624" y="124" width="140" height="30" rx="5" fill="#e3eedc" stroke="#2f6b3f"/><text x="694" y="143">pricing</text>
    <rect x="466" y="164" width="140" height="30" rx="5" fill="#e3eedc" stroke="#2f6b3f"/><text x="536" y="183">loyalty</text>
    <rect x="624" y="164" width="140" height="30" rx="5" fill="#e3eedc" stroke="#2f6b3f"/><text x="694" y="183">recommendations</text>
  </g>
  <text x="615" y="222" font-size="11.5" text-anchor="middle" fill="#5f6f66">they expose domain concepts, not screens</text>
  <text x="615" y="244" font-size="11.5" text-anchor="middle" fill="#5f6f66">and never change for one client's layout</text>

  <text class="hand" x="200" y="302" font-size="16" fill="#c53b3b">the BFF belongs to the client, not to the platform</text>
</svg>
