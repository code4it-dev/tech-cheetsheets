<svg viewBox="0 0 800 310" role="img" aria-label="Animated API gateway aggregating several services by configuration rather than code">
  <defs>
    <marker id="g-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="g-cli" x="24" y="96" width="164" height="112" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="106" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Mobile app</text>
  <text id="g-cli-s" x="106" y="146" font-size="11" text-anchor="middle" fill="#5f6f66">painting the home screen</text>
  <text id="g-cli-o" x="106" y="172" font-size="11" text-anchor="middle" fill="#5f6f66" font-weight="600" font-family="Fira Code, monospace">some logic stays here</text>
  <line id="g-hop" class="hidden" x1="190" y1="140" x2="234" y2="140" stroke="#c53b3b" stroke-width="2" fill="none" marker-end="url(#g-a)"/>
  <text id="g-hop-t" class="hidden" x="212" y="128" font-size="10" text-anchor="middle" fill="#c53b3b">150 ms</text>
  <rect id="g-gw" x="238" y="86" width="186" height="132" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="331" y="110" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">API gateway</text>
  <text id="g-gw-e" x="331" y="132" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">aggregation policy</text>
  <text id="g-gw-s" x="331" y="156" font-size="11" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="g-gw-c" x="331" y="180" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">config, not code</text>
  <text id="g-gw-d" x="331" y="202" font-size="10.5" text-anchor="middle" fill="#8a6a0c" font-family="Fira Code, monospace">owned by the platform team</text>
