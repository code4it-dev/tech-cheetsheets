    <line id="g-l1" class="hidden" x1="426" y1="120" x2="512" y2="50"/>
    <line id="g-l2" class="hidden" x1="426" y1="130" x2="512" y2="88"/>
    <line id="g-l3" class="hidden" x1="426" y1="142" x2="512" y2="126"/>
    <line id="g-l4" class="hidden" x1="426" y1="152" x2="512" y2="164"/>
  </g>
  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="g-s1" x="516" y="34" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="g-t1" x="526" y="54" fill="#23362e">profile</text>
    <rect id="g-s2" x="516" y="72" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="g-t2" x="526" y="92" fill="#23362e">basket</text>
    <rect id="g-s3" x="516" y="110" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="g-t3" x="526" y="130" fill="#23362e">catalogue</text>
    <rect id="g-s4" x="516" y="148" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="g-t4" x="526" y="168" fill="#23362e">pricing</text>
    <rect id="g-s5" x="516" y="186" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="g-t5" x="526" y="206" fill="#5f6f66">loyalty &mdash; needs a rule</text>
    <rect id="g-s6" x="516" y="224" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="g-t6" x="526" y="244" fill="#5f6f66">recommendations &mdash; needs a rule</text>
  </g>
  <text id="g-r1" x="24" y="280" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">round trips: 0 &middot; bytes: 0 KB</text>
