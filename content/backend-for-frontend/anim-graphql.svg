<svg viewBox="0 0 800 310" role="img" aria-label="Animated GraphQL endpoint where the client declares the shape it needs and resolvers fan out">
  <defs>
    <marker id="q-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="q-cli" x="24" y="96" width="164" height="112" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="106" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Mobile app</text>
  <text id="q-cli-s" x="106" y="146" font-size="11" text-anchor="middle" fill="#5f6f66">painting the home screen</text>
  <text id="q-cli-o" x="106" y="172" font-size="11" text-anchor="middle" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">declares the shape</text>
  <text id="q-cli-v" x="106" y="192" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">no backend to deploy</text>
  <line id="q-hop" class="hidden" x1="190" y1="140" x2="234" y2="140" stroke="#c53b3b" stroke-width="2" fill="none" marker-end="url(#q-a)"/>
  <text id="q-hop-t" class="hidden" x="212" y="128" font-size="10" text-anchor="middle" fill="#c53b3b">150 ms</text>
  <rect id="q-srv" x="238" y="86" width="186" height="132" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="331" y="110" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">GraphQL server</text>
  <text id="q-srv-e" x="331" y="132" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">POST /graphql</text>
  <text id="q-srv-s" x="331" y="156" font-size="11" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="q-srv-c" x="331" y="180" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">resolvers per field</text>
  <text id="q-srv-d" x="331" y="202" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">one schema, every client</text>
  <g stroke="#2f6b3f" stroke-width="1.5" fill="none" marker-end="url(#q-a)">
    <line id="q-l1" class="hidden" x1="426" y1="120" x2="512" y2="50"/>
    <line id="q-l2" class="hidden" x1="426" y1="130" x2="512" y2="88"/>
    <line id="q-l3" class="hidden" x1="426" y1="142" x2="512" y2="126"/>
    <line id="q-l4" class="hidden" x1="426" y1="152" x2="512" y2="164"/>
    <line id="q-l5" class="hidden" x1="426" y1="164" x2="512" y2="202"/>
    <line id="q-l6" class="hidden" x1="426" y1="176" x2="512" y2="240"/>
  </g>
  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="q-s1" x="516" y="34" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="q-t1" x="526" y="54" fill="#23362e">profile</text>
    <rect id="q-s2" x="516" y="72" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="q-t2" x="526" y="92" fill="#23362e">basket</text>
    <rect id="q-s3" x="516" y="110" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="q-t3" x="526" y="130" fill="#23362e">catalogue</text>
    <rect id="q-s4" x="516" y="148" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="q-t4" x="526" y="168" fill="#23362e">pricing</text>
    <rect id="q-s5" x="516" y="186" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="q-t5" x="526" y="206" fill="#23362e">loyalty</text>
    <rect id="q-s6" x="516" y="224" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="q-t6" x="526" y="244" fill="#23362e">recommendations</text>
  </g>
  <text id="q-r1" x="24" y="280" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">round trips: 0 &middot; bytes: 0 KB</text>
  <text id="q-r2" x="24" y="300" font-size="12.5" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">time to first paint: &mdash;</text>
  <text id="q-note" class="hand hidden" x="330" y="296" font-size="15" fill="#c53b3b">no BFF to own &mdash; one schema to agree on instead</text>
</svg>
