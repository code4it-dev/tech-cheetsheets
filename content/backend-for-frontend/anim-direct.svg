<svg viewBox="0 0 800 310" role="img" aria-label="Animated mobile client making six round trips directly to a general purpose API">
  <defs>
    <marker id="d-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <rect id="d-cli" x="24" y="96" width="164" height="112" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="106" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Mobile app</text>
  <text id="d-cli-s" x="106" y="146" font-size="11" text-anchor="middle" fill="#5f6f66">painting the home screen</text>
  <text id="d-cli-o" x="106" y="172" font-size="11" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">orchestration: in the app</text>
  <text id="d-cli-v" x="106" y="192" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">ships in the binary</text>
  <text x="350" y="60" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-weight="600">every one of these is a 150 ms round trip</text>
  <g stroke="#c53b3b" stroke-width="1.5" fill="none" marker-end="url(#d-a)">
    <line id="d-l1" class="hidden" x1="190" y1="130" x2="512" y2="50"/>
    <line id="d-l2" class="hidden" x1="190" y1="140" x2="512" y2="88"/>
    <line id="d-l3" class="hidden" x1="190" y1="150" x2="512" y2="126"/>
    <line id="d-l4" class="hidden" x1="190" y1="160" x2="512" y2="164"/>
    <line id="d-l5" class="hidden" x1="190" y1="170" x2="512" y2="202"/>
    <line id="d-l6" class="hidden" x1="190" y1="180" x2="512" y2="240"/>
  </g>
  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="d-s1" x="516" y="34" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="d-t1" x="526" y="54" fill="#23362e">GET /users/me</text>
    <rect id="d-s2" x="516" y="72" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="d-t2" x="526" y="92" fill="#23362e">GET /baskets/current</text>
    <rect id="d-s3" x="516" y="110" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="d-t3" x="526" y="130" fill="#23362e">GET /catalogue/items?ids=...</text>
    <rect id="d-s4" x="516" y="148" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="d-t4" x="526" y="168" fill="#23362e">GET /pricing?ids=...</text>
    <rect id="d-s5" x="516" y="186" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="d-t5" x="526" y="206" fill="#23362e">GET /loyalty/me</text>
    <rect id="d-s6" x="516" y="224" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="d-t6" x="526" y="244" fill="#23362e">GET /recommendations</text>
  </g>
  <text id="d-r1" x="24" y="280" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">round trips: 0 &middot; bytes: 0 KB</text>
  <text id="d-r2" x="24" y="300" font-size="12.5" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">time to first paint: &mdash;</text>
  <text id="d-note" class="hand hidden" x="400" y="296" font-size="15" fill="#c53b3b">the API can't be fixed for mobile without breaking web</text>
</svg>
