<svg viewBox="0 0 800 310" role="img" aria-label="Animated mobile client making one round trip to a BFF that fans out in the datacenter">
  <defs>
    <marker id="b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="b-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3f"/></marker>
  </defs>
  <rect id="b-cli" x="24" y="96" width="164" height="112" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="106" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Mobile app</text>
  <text id="b-cli-s" x="106" y="146" font-size="11" text-anchor="middle" fill="#5f6f66">painting the home screen</text>
  <text id="b-cli-o" x="106" y="172" font-size="11" text-anchor="middle" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">orchestration: server-side</text>
  <text id="b-cli-v" x="106" y="192" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">deployable any time</text>
  <line id="b-hop" class="hidden" x1="190" y1="140" x2="234" y2="140" stroke="#c53b3b" stroke-width="2" fill="none" marker-end="url(#b-a)"/>
  <text id="b-hop-t" class="hidden" x="212" y="128" font-size="10" text-anchor="middle" fill="#c53b3b">150 ms</text>
  <rect id="b-bff" x="238" y="86" width="186" height="132" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="331" y="110" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Mobile BFF</text>
  <text id="b-bff-e" x="331" y="132" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">GET /mobile/home</text>
  <text id="b-bff-s" x="331" y="156" font-size="11" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="b-bff-c" x="331" y="180" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">shapes the response</text>
  <text id="b-bff-d" x="331" y="202" font-size="10.5" text-anchor="middle" fill="#2f6b3f" font-family="Fira Code, monospace">owned by the app team</text>
  <g stroke="#2f6b3f" stroke-width="1.5" fill="none" marker-end="url(#b-g)">
    <line id="b-l1" class="hidden" x1="426" y1="120" x2="512" y2="50"/>
    <line id="b-l2" class="hidden" x1="426" y1="130" x2="512" y2="88"/>
    <line id="b-l3" class="hidden" x1="426" y1="142" x2="512" y2="126"/>
    <line id="b-l4" class="hidden" x1="426" y1="152" x2="512" y2="164"/>
    <line id="b-l5" class="hidden" x1="426" y1="164" x2="512" y2="202"/>
    <line id="b-l6" class="hidden" x1="426" y1="176" x2="512" y2="240"/>
  </g>
  <text id="b-fan" class="hidden" x="470" y="268" font-size="10.5" text-anchor="middle" fill="#2f6b3f">all six in parallel, ~5 ms each</text>
  <g font-size="10.5" font-family="Fira Code, monospace">
    <rect id="b-s1" x="516" y="34" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="b-t1" x="526" y="54" fill="#23362e">profile</text>
    <rect id="b-s2" x="516" y="72" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="b-t2" x="526" y="92" fill="#23362e">basket</text>
    <rect id="b-s3" x="516" y="110" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="b-t3" x="526" y="130" fill="#23362e">catalogue</text>
    <rect id="b-s4" x="516" y="148" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="b-t4" x="526" y="168" fill="#23362e">pricing</text>
    <rect id="b-s5" x="516" y="186" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="b-t5" x="526" y="206" fill="#23362e">loyalty</text>
    <rect id="b-s6" x="516" y="224" width="258" height="32" rx="5" fill="#eef1e8" stroke="#d5dccf"/><text id="b-t6" x="526" y="244" fill="#23362e">recommendations</text>
  </g>
  <text id="b-r1" x="24" y="280" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">round trips: 0 &middot; bytes: 0 KB</text>
  <text id="b-r2" x="24" y="300" font-size="12.5" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">time to first paint: &mdash;</text>
  <text id="b-note" class="hand hidden" x="330" y="296" font-size="15" fill="#c53b3b">you now wait for the slowest of six</text>
</svg>
