<svg viewBox="0 0 800 320" role="img" aria-label="A client generating a PKCE verifier, redirecting the user to authenticate, exchanging the code for tokens and calling the API">
  <defs>
    <marker id="of-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="of-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">an app wants to read your calendar &mdash; and must never see your password</text>

  <rect id="of-user" x="20" y="40" width="170" height="70" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="105" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">user + browser</text>
  <text id="of-usert" x="105" y="86" font-size="10" text-anchor="middle" fill="#5f6f66">not involved yet</text>

  <rect id="of-app" x="210" y="40" width="170" height="70" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="295" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">client app</text>
  <text id="of-appt" x="295" y="86" font-size="10" text-anchor="middle" fill="#5f6f66">idle</text>

  <rect id="of-as" x="400" y="40" width="190" height="70" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="495" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">authorization server</text>
  <text id="of-ast" x="495" y="86" font-size="10" text-anchor="middle" fill="#5f6f66">waiting</text>

  <rect id="of-api" x="610" y="40" width="170" height="70" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="695" y="64" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">calendar API</text>
  <text id="of-apit" x="695" y="86" font-size="10" text-anchor="middle" fill="#5f6f66">rejects anonymous calls</text>

  <g id="of-msg" class="hidden">
    <rect x="20" y="130" width="180" height="30" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text id="of-msgt" x="30" y="150" font-size="10" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  </g>

  <rect id="of-panel" x="20" y="176" width="760" height="76" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="36" y="198" font-size="11" fill="#23362e" font-weight="700">PKCE state &mdash; held only by the client that started the flow</text>
  <text id="of-ver" x="36" y="220" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">code_verifier:  —</text>
  <text id="of-chal" x="36" y="240" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">code_challenge: —</text>
  <text id="of-code" x="420" y="220" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">code:   —</text>
  <text id="of-tok" x="420" y="240" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">tokens: —</text>

  <rect id="of-verd" x="20" y="266" width="760" height="40" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="of-v" x="400" y="291" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">nothing has happened yet &mdash; and the app has no credentials of yours</text>
</svg>
