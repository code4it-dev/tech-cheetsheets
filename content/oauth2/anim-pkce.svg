<svg viewBox="0 0 800 320" role="img" aria-label="A malicious app intercepting an authorization code on a shared custom scheme, succeeding without PKCE and failing with it">
  <defs>
    <marker id="op-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="op-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <text id="op-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">on a phone, more than one app can register <tspan font-family="Fira Code, monospace">myapp://callback</tspan></text>

  <rect id="op-good" x="20" y="44" width="200" height="72" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="120" y="68" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the real app</text>
  <text id="op-goodt" x="120" y="90" font-size="10" text-anchor="middle" fill="#5f6f66">starts the flow</text>
  <text id="op-goodt2" x="120" y="106" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="op-bad" x="20" y="134" width="200" height="72" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="120" y="158" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">malicious app</text>
  <text id="op-badt" x="120" y="180" font-size="10" text-anchor="middle" fill="#5f6f66">same custom scheme</text>
  <text id="op-badt2" x="120" y="196" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="op-as" x="560" y="80" width="220" height="90" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="670" y="106" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">authorization server</text>
  <text id="op-ast" x="670" y="128" font-size="10" text-anchor="middle" fill="#5f6f66">token endpoint</text>
  <text id="op-ast2" x="670" y="146" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <g id="op-a1" class="hidden"><line x1="226" y1="80" x2="554" y2="104" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#op-arr)"/></g>
  <g id="op-a2" class="hidden"><line x1="226" y1="170" x2="554" y2="146" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#op-red)"/></g>

  <g id="op-code" class="hidden">
    <rect x="280" y="98" width="240" height="30" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text id="op-codet" x="400" y="118" font-size="10" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">code=9f1c7a…</text>
  </g>

  <rect id="op-panel" x="20" y="226" width="760" height="48" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="op-p1" x="36" y="248" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">PKCE: off</text>
  <text id="op-p2" x="300" y="248" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="op-p3" x="36" y="266" font-size="10.5" fill="#5f6f66">a public client has no secret, so the server cannot tell the two apps apart</text>

  <rect id="op-verd" x="20" y="286" width="760" height="30" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="op-v" x="400" y="306" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">watch what the attacker can do with a stolen code</text>
</svg>
