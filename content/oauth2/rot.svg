<svg viewBox="0 0 560 200" role="img" aria-label="A refresh token rotating on use, and a stolen old token triggering revocation of the whole family">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">every use mints a new token and kills the old one</text>
  <rect id="rt-cli" x="30" y="46" width="170" height="54" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="115" y="68" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">real client</text>
  <text id="rt-clit" x="115" y="86" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">holds RT1</text>
  <rect id="rt-att" x="30" y="116" width="170" height="54" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="115" y="138" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">attacker</text>
  <text id="rt-attt" x="115" y="156" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">stole a copy of RT1</text>
  <rect id="rt-as" x="340" y="76" width="190" height="64" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="435" y="100" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">authorization server</text>
  <text id="rt-ast" x="435" y="120" font-size="10.5" text-anchor="middle" fill="#5f6f66">family: RT1 active</text>
  <text id="rt-msg" x="280" y="186" font-size="11" text-anchor="middle" fill="#5f6f66">both hold the same token, and nobody knows yet</text>
</svg>
