<svg viewBox="0 0 800 340" role="img" aria-label="The four OAuth roles and the order in which the browser, client, authorization server and resource server exchange a code and a token">
  <defs>
    <marker id="oa-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">the password is exchanged only in the top-right box &mdash; the app never sees it</text>

  <rect x="20" y="44" width="170" height="86" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="105" y="70" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">resource owner</text>
  <text x="105" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">you, with a browser</text>
  <text x="105" y="110" font-size="10.5" text-anchor="middle" fill="#5f6f66">grants consent</text>

  <rect x="230" y="44" width="170" height="86" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="315" y="70" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text x="315" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">the app wanting access</text>
  <text x="315" y="110" font-size="10.5" text-anchor="middle" fill="#c53b3b">public or confidential</text>

  <rect x="440" y="44" width="180" height="86" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="530" y="70" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">authorization server</text>
  <text x="530" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">authenticates, consents,</text>
  <text x="530" y="110" font-size="10.5" text-anchor="middle" fill="#5f6f66">issues tokens</text>

  <rect x="660" y="44" width="120" height="86" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="720" y="70" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">resource</text>
  <text x="720" y="88" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">server</text>
  <text x="720" y="110" font-size="10.5" text-anchor="middle" fill="#5f6f66">the API</text>

  <line x1="194" y1="74" x2="226" y2="74" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#oa-arr)"/>
  <text x="210" y="66" font-size="9.5" text-anchor="middle" fill="#5f6f66">1</text>
  <line x1="404" y1="74" x2="436" y2="74" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#oa-arr)"/>
  <text x="420" y="66" font-size="9.5" text-anchor="middle" fill="#5f6f66">2</text>
  <line x1="624" y1="100" x2="656" y2="100" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#oa-arr)"/>
  <text x="640" y="92" font-size="9.5" text-anchor="middle" fill="#5f6f66">5</text>

  <rect x="20" y="152" width="760" height="80" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="174" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">the exchange, in order</text>
  <text x="36" y="196" font-size="10.5" fill="#5f6f66">1 &middot; app redirects the browser to the authorization server, with a <tspan font-family="Fira Code, monospace">code_challenge</tspan></text>
  <text x="36" y="214" font-size="10.5" fill="#5f6f66">2 &middot; user authenticates and consents &nbsp;&rarr;&nbsp; 3 &middot; browser comes back with a short-lived <tspan font-family="Fira Code, monospace">code</tspan></text>
  <text x="440" y="196" font-size="10.5" fill="#5f6f66">4 &middot; app swaps code + <tspan font-family="Fira Code, monospace">code_verifier</tspan> for tokens</text>
  <text x="440" y="214" font-size="10.5" fill="#5f6f66">5 &middot; app calls the API with <tspan font-family="Fira Code, monospace">Authorization: Bearer</tspan></text>

  <rect x="20" y="246" width="372" height="76" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="206" y="268" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">use these two flows</text>
  <text x="36" y="290" font-size="10.5" fill="#5f6f66">authorization code + PKCE &mdash; anything on behalf of a user</text>
  <text x="36" y="310" font-size="10.5" fill="#5f6f66">client credentials &mdash; machine to machine, no user present</text>

  <rect x="408" y="246" width="372" height="76" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="594" y="268" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">treat these as deleted</text>
  <text x="424" y="290" font-size="10.5" fill="#5f6f66">implicit &mdash; token in the URL; removed in the 2.1 draft</text>
  <text x="424" y="310" font-size="10.5" fill="#5f6f66">password (ROPC) &mdash; the app sees the password; removed</text>
</svg>
