<svg viewBox="0 0 800 352" role="img" aria-label="The anatomy of a queueing system with arrival rate, queue discipline, servers and utilisation, beside the utilisation curve">
  <defs>
    <marker id="qt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">five numbers describe any queue &mdash; and two of them decide how long you wait</text>

  <text x="24" y="60" font-size="11.5" fill="#23362e" font-weight="700">Arrivals</text>
  <text x="24" y="80" font-size="12" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">&lambda; = 100 / s</text>
  <text x="24" y="98" font-size="10.5" fill="#5f6f66">how often work shows up</text>
  <text x="24" y="118" font-size="10.5" fill="#c53b3b">c&#8336; = how bursty</text>
  <line x1="140" y1="88" x2="172" y2="88" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#qt-arr)"/>

  <rect x="176" y="48" width="208" height="104" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="280" y="70" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">queue</text>
  <g fill="#c53b3b">
    <rect x="196" y="82" width="22" height="30" rx="3"/><rect x="224" y="82" width="22" height="30" rx="3"/>
    <rect x="252" y="82" width="22" height="30" rx="3"/><rect x="280" y="82" width="22" height="30" rx="3"/>
  </g>
  <text x="280" y="132" font-size="10.5" text-anchor="middle" fill="#5f6f66">discipline: FIFO · LIFO · priority</text>
  <text x="280" y="146" font-size="10" text-anchor="middle" fill="#5f6f66">waiting time W<tspan baseline-shift="sub" font-size="8">q</tspan></text>
  <line x1="388" y1="88" x2="420" y2="88" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#qt-arr)"/>

  <rect x="424" y="48" width="208" height="104" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="528" y="70" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">servers</text>
  <g fill="#2f6b3f">
    <rect x="454" y="82" width="34" height="30" rx="3"/><rect x="494" y="82" width="34" height="30" rx="3"/>
    <rect x="534" y="82" width="34" height="30" rx="3"/>
  </g>
  <text x="528" y="132" font-size="10.5" text-anchor="middle" fill="#5f6f66">c = 3 &nbsp;·&nbsp; S = 20 ms &nbsp;·&nbsp; &mu; = 50 / s each</text>
  <text x="528" y="146" font-size="10" text-anchor="middle" fill="#c53b3b">c&#8347; = how variable the work is</text>
  <line x1="636" y1="88" x2="668" y2="88" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#qt-arr)"/>
  <text x="676" y="84" font-size="11.5" fill="#23362e" font-weight="700">Done</text>
  <text x="676" y="102" font-size="10.5" fill="#5f6f66">100 / s out</text>

  <rect x="24" y="172" width="356" height="76" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="202" y="194" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">utilisation &mdash; the number that matters</text>
  <text x="202" y="218" font-size="14" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">&rho; = &lambda; / (c&mu;) = 100 / 150 = 0.67</text>
  <text x="202" y="238" font-size="10.5" text-anchor="middle" fill="#5f6f66">at &rho; &ge; 1 the queue grows without limit, forever</text>

  <rect x="24" y="262" width="356" height="76" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="202" y="284" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">Kingman: the wait, in three factors</text>
  <text x="202" y="308" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">W&#8340; &asymp; (&rho;/(1&minus;&rho;)) &times; ((c&#8336;²+c&#8347;²)/2) &times; S</text>
  <text x="202" y="328" font-size="10.5" text-anchor="middle" fill="#5f6f66">utilisation &times; variability &times; service time</text>

  <rect x="400" y="172" width="376" height="166" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="588" y="192" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">W = S / (1 &minus; &rho;) &mdash; the shape to memorise</text>
  <line x1="430" y1="320" x2="756" y2="320" stroke="#a9b5a6"/>
  <line x1="430" y1="204" x2="430" y2="320" stroke="#a9b5a6"/>
  <polyline points="430,314 495,311 560,306 613,298 652,285 678,266 697,240 710,210" fill="none" stroke="#c53b3b" stroke-width="2.5"/>
  <text x="430" y="334" font-size="9.5" text-anchor="middle" fill="#5f6f66">0</text>
  <text x="613" y="334" font-size="9.5" text-anchor="middle" fill="#5f6f66">0.8</text>
  <text x="710" y="334" font-size="9.5" text-anchor="middle" fill="#5f6f66">0.95</text>
  <text x="760" y="334" font-size="9.5" fill="#5f6f66">&rho;</text>
  <text x="424" y="200" font-size="9.5" text-anchor="end" fill="#5f6f66">20&times;</text>
  <text x="726" y="216" font-size="10" fill="#c53b3b" font-weight="600">the cliff</text>
  <text class="hand" x="440" y="246" font-size="15" fill="#c53b3b">the last 10% of capacity</text>
  <text class="hand" x="440" y="264" font-size="15" fill="#c53b3b">costs more than the first 80%</text>
</svg>
