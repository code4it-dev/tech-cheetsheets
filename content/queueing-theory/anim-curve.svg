<svg viewBox="0 0 800 320" role="img" aria-label="The M/M/1 waiting time curve rising vertically as utilisation approaches one">
  <text id="qc-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one server, one queue, service time S = 20 ms &mdash; how long does a request take?</text>

  <line x1="90" y1="260" x2="750" y2="260" stroke="#a9b5a6" stroke-width="1.5"/>
  <line x1="90" y1="44" x2="90" y2="260" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="82" y="54" font-size="10" text-anchor="end" fill="#5f6f66">20&times;</text>
  <text x="82" y="160" font-size="10" text-anchor="end" fill="#5f6f66">10&times;</text>
  <text x="82" y="264" font-size="10" text-anchor="end" fill="#5f6f66">0</text>
  <text x="28" y="150" font-size="10.5" fill="#5f6f66">W / S</text>
  <text x="420" y="286" font-size="10.5" text-anchor="middle" fill="#5f6f66">utilisation &rho; &rarr;</text>
  <text x="415" y="276" font-size="9.5" text-anchor="middle" fill="#5f6f66">0.5</text>
  <text x="610" y="276" font-size="9.5" text-anchor="middle" fill="#5f6f66">0.8</text>
  <text x="675" y="276" font-size="9.5" text-anchor="middle" fill="#5f6f66">0.9</text>
  <text x="730" y="276" font-size="9.5" text-anchor="middle" fill="#5f6f66">0.95</text>

  <polyline id="qc-s1" class="hidden" points="90,250 220,247 350,242 415,239" fill="none" stroke="#2f6b3f" stroke-width="2.5"/>
  <polyline id="qc-s2" class="hidden" points="415,239 480,234 545,225 610,207" fill="none" stroke="#2f6b3f" stroke-width="2.5"/>
  <polyline id="qc-s3" class="hidden" points="610,207 642,190 675,155" fill="none" stroke="#c53b3b" stroke-width="2.5"/>
  <polyline id="qc-s4" class="hidden" points="675,155 694,110 707,50" fill="none" stroke="#c53b3b" stroke-width="2.5"/>

  <g id="qc-m1" class="hidden"><circle cx="415" cy="239" r="4" fill="#2f6b3f"/><line x1="415" y1="239" x2="415" y2="260" stroke="#2f6b3f" stroke-width="1" stroke-dasharray="3 3"/></g>
  <g id="qc-m2" class="hidden"><circle cx="610" cy="207" r="4" fill="#2f6b3f"/><line x1="610" y1="207" x2="610" y2="260" stroke="#2f6b3f" stroke-width="1" stroke-dasharray="3 3"/></g>
  <g id="qc-m3" class="hidden"><circle cx="675" cy="155" r="4" fill="#c53b3b"/><line x1="675" y1="155" x2="675" y2="260" stroke="#c53b3b" stroke-width="1" stroke-dasharray="3 3"/></g>
  <g id="qc-m4" class="hidden"><circle cx="707" cy="50" r="4" fill="#c53b3b"/><line x1="707" y1="50" x2="707" y2="260" stroke="#c53b3b" stroke-width="1" stroke-dasharray="3 3"/></g>

  <text id="qc-off" class="hidden" x="688" y="60" font-size="10.5" text-anchor="end" fill="#c53b3b" font-weight="600">&rho; = 0.99 is 100&times;,</text>
  <text id="qc-off2" class="hidden" x="688" y="76" font-size="10.5" text-anchor="end" fill="#c53b3b" font-weight="600">far off this chart</text>

  <rect id="qc-panel" x="90" y="296" width="660" height="20" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text id="qc-read" x="104" y="311" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">&rho; = 0 · W = S = 20 ms · the server is idle most of the time</text>
</svg>
