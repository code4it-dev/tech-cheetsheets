<svg viewBox="0 0 560 210" role="img" aria-label="A deterministic queue with no waiting compared with an exponential queue at the same utilisation waiting nine times the service time">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">two systems, both &rho; = 0.9, both averaging 10 ms of service</text>
  <rect id="cv-d" x="30" y="44" width="230" height="66" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="145" y="66" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">D/D/1 &mdash; clockwork</text>
  <text id="cv-dt" x="145" y="84" font-size="10" text-anchor="middle" fill="#5f6f66">arrive every 11.1 ms, serve in 10 ms</text>
  <text id="cv-dw" x="145" y="102" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">wait = ?</text>
  <rect id="cv-m" x="300" y="44" width="230" height="66" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="415" y="66" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">M/M/1 &mdash; random</text>
  <text id="cv-mt" x="415" y="84" font-size="10" text-anchor="middle" fill="#5f6f66">same averages, both varying</text>
  <text id="cv-mw" x="415" y="102" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">wait = ?</text>
  <text id="cv-f" x="280" y="146" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">W&#8340; &asymp; (&rho;/(1&minus;&rho;)) × ((c&#8336;²+c&#8347;²)/2) × S</text>
  <text id="cv-msg" x="280" y="176" font-size="11" text-anchor="middle" fill="#5f6f66">identical on every dashboard you own</text>
</svg>
