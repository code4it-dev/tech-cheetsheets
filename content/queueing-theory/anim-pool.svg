<svg viewBox="0 0 800 320" role="img" aria-label="Three dedicated queues each with one server, compared with a single pooled queue feeding three servers">
  <text id="qp-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">300 requests a second, three servers, each able to do 125 a second &mdash; &rho; = 0.8 either way</text>

  <rect id="qp-left" x="20" y="40" width="370" height="212" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="205" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">dedicated queues &mdash; one line each</text>

  <g id="qp-q1"><rect x="36" y="78" width="200" height="34" rx="4" fill="#f9e3df" stroke="#e6b3ad"/><text id="qp-q1t" x="46" y="100" font-size="10" fill="#23362e" font-family="Fira Code, monospace">▮▮▮▮ 4 waiting</text></g>
  <rect id="qp-s1" x="252" y="78" width="120" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text id="qp-s1t" x="312" y="100" font-size="10" text-anchor="middle" fill="#23362e">server A · busy</text>

  <g id="qp-q2"><rect x="36" y="124" width="200" height="34" rx="4" fill="#f9e3df" stroke="#e6b3ad"/><text id="qp-q2t" x="46" y="146" font-size="10" fill="#23362e" font-family="Fira Code, monospace">▮▮ 2 waiting</text></g>
  <rect id="qp-s2" x="252" y="124" width="120" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text id="qp-s2t" x="312" y="146" font-size="10" text-anchor="middle" fill="#23362e">server B · busy</text>

  <g id="qp-q3"><rect x="36" y="170" width="200" height="34" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text id="qp-q3t" x="46" y="192" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">(empty)</text></g>
  <rect id="qp-s3" x="252" y="170" width="120" height="34" rx="4" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="qp-s3t" x="312" y="192" font-size="10" text-anchor="middle" fill="#5f6f66">server C · IDLE</text>

  <text id="qp-lt" x="205" y="228" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">M/M/1 each · W&#8340; = 4.00 × S</text>
  <text id="qp-lt2" x="205" y="244" font-size="10" text-anchor="middle" fill="#5f6f66">six people waiting, one server doing nothing</text>

  <rect id="qp-right" x="410" y="40" width="370" height="212" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="595" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">pooled &mdash; one line, three servers</text>

  <g id="qp-pq" class="hidden"><rect x="426" y="78" width="200" height="126" rx="4" fill="#f9e3df" stroke="#e6b3ad"/><text id="qp-pqt" x="526" y="146" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">▮▮▮▮▮▮ 6 waiting</text></g>
  <g id="qp-ps" class="hidden">
    <rect x="642" y="78" width="122" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <text x="703" y="100" font-size="10" text-anchor="middle" fill="#23362e">server A · busy</text>
    <rect x="642" y="124" width="122" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <text x="703" y="146" font-size="10" text-anchor="middle" fill="#23362e">server B · busy</text>
    <rect x="642" y="170" width="122" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <text id="qp-ps3" x="703" y="192" font-size="10" text-anchor="middle" fill="#23362e">server C · busy</text>
  </g>
  <text id="qp-rt" class="hidden" x="595" y="228" font-size="11" text-anchor="middle" fill="#2f6b3f" font-family="Fira Code, monospace">M/M/3 · W&#8340; = 1.08 × S</text>
  <text id="qp-rt2" class="hidden" x="595" y="244" font-size="10" text-anchor="middle" fill="#5f6f66">no server is ever idle while anyone waits</text>

  <rect id="qp-out" x="20" y="268" width="760" height="42" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="qp-o" x="400" y="294" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">same hardware, same arrival rate, same utilisation &mdash; watch the waiting time</text>
</svg>
