title: Azure API Management
slug: azure-api-management
tagline: One front door for every API you own — and a place to put all the things that are not business logic.
asof: Nov 2026 · classic tiers (Developer, Basic, Standard, Premium) plus the v2 tiers and Consumption
description: "Azure API Management cheatsheet: the policy pipeline animated end to end, products and subscriptions, backend pools with circuit breakers, revisions versus versions, tiers and gotchas."
aliases: [ Azure API Management, API Management, APIM, Azure APIM ]
keywords:
  - azure
  - api gateway
  - apim
  - policies
  - rate limiting
  - api versioning
  - developer portal
  - jwt validation
  - backend
related: [ rate-limiting, caching-strategies ]
overview:
  - "Once you have more than a couple of APIs, the same concerns reappear in every one of them: authentication, rate limits, caching, CORS, request validation, logging, a consistent error shape, a developer-facing catalogue. Azure API Management (APIM) is the managed gateway that takes those concerns out of your services and puts them in one configurable place."
  - "The core of it is the **policy pipeline**: a small XML document, attached at global, product, API or operation scope, that runs on every request in four phases — `inbound`, `backend`, `outbound` and `on-error`. Policies validate a JWT, throttle a caller, look up a cached response, rewrite a URL, add a managed-identity token, transform a payload or return a mock. Your backend sees only what survives all of that."
  - "Around the gateway sit the pieces that make an API a product: **products** group APIs and carry quotas, **subscriptions** issue keys, the **developer portal** publishes documentation and a try-it console, and **revisions** and **versions** let you change an API without breaking the clients already using it."
architecture:
  svg: azure-api-management/architecture.svg
  alt: Clients call the APIM gateway, which runs a policy pipeline before forwarding to backends, with a control plane, developer portal and observability around it
  caption: The gateway is the only public surface. Everything cross-cutting happens in the policy pipeline, so backends stay small and the API contract stays stable even when they change.
howItWorks:
  - anim:
      id: anim-pipeline
      title: One request through the policy pipeline
      svg: azure-api-management/anim-pipeline.svg
      alt: Animated walk-through of a request through the inbound, backend, outbound and on-error policy sections
      steps:
        - say: A client calls `GET /orders/10427` with a subscription key and a bearer token. It reaches the **gateway**, not your API — the backend is not addressable from the internet at all.
          hl: [ pp-client ]
          text:
            pp-client-sub: GET /orders/10427
            pp-client-sub2: key + bearer token
        - say: "**inbound, policy 1.** `validate-jwt` checks the token’s signature against the cached signing keys, plus issuer, audience, expiry and the `orders.read` scope. A bad token stops here with a 401 — no backend call, no cost."
          hl: [ pp-p1 ]
          unhl: [ pp-client ]
          text:
            pp-s2: "jwt: valid, scp=orders.read"
        - say: "**inbound, policy 2.** `rate-limit-by-key` counts this call against the subscription’s allowance of 600 per minute. Over the limit and the caller gets a 429 with `Retry-After` — again, your API never hears about it."
          hl: [ pp-p2 ]
          unhl: [ pp-p1 ]
          text:
            pp-s1: "sub: Pro · 412/600 used"
        - say: "**inbound, policy 3.** `cache-lookup-value` checks the gateway cache. On a **hit**, the pipeline short-circuits: everything below is skipped and execution jumps straight to `outbound`. That is the cheapest possible response."
          hl: [ pp-p3 ]
          unhl: [ pp-p2 ]
          text:
            pp-s3: "cache: MISS"
        - say: This one misses, so we continue. **inbound, policy 4.** `rewrite-uri` maps the public shape onto the internal one, and `authentication-managed-identity` attaches a token for the backend — so no shared secret exists anywhere.
          hl: [ pp-p4 ]
          unhl: [ pp-p3 ]
        - say: "**backend section.** `forward-request` makes the actual call, with a timeout and, if configured, retries and a circuit breaker. This is the only part where your service is involved."
          hl: [ pp-p5, pp-backend ]
          unhl: [ pp-p4 ]
          text:
            pp-backend-sub: GET /api/v3/order?id=10427
            pp-s4: "status: 200 in 38 ms"
        - say: "**outbound.** The response comes back and the pipeline runs in the other direction: `cache-store-value` saves it for 60 seconds, so the next identical call never reaches the backend at all."
          hl: [ pp-p6 ]
          unhl: [ pp-p5, pp-backend ]
          text:
            pp-s3: "cache: stored, 60 s"
        - say: "Still outbound: headers are cleaned up. Internal identifiers, framework banners and anything else you do not want public are deleted here — one policy, applied to every API."
          hl: [ pp-p7 ]
          unhl: [ pp-p6 ]
        - say: Had anything thrown — a backend timeout, a transform failure — the `on-error` section would have run instead, returning one consistent error envelope with a trace id, rather than leaking whatever the backend produced.
          hl: [ pp-p8 ]
          unhl: [ pp-p7 ]
        - say: The client gets its response. Authentication, throttling, caching, URL rewriting, backend credentials, header hygiene and error shaping all happened **outside** your API code — and they apply identically to every service behind this gateway.
          show: [ pp-note ]
          hl: [ pp-client ]
          unhl: [ pp-p8 ]
          text:
            pp-client-sub: 200 OK · 41 ms
            pp-client-sub2: "remaining: 188"
  - anim:
      id: anim-backend
      title: A load-balanced backend pool with a circuit breaker
      svg: azure-api-management/anim-backend.svg
      alt: Animated backend pool where one backend trips its circuit breaker and traffic shifts to the others
      steps:
        - say: The API points at a **backend pool**, not a URL. Two backends share priority 1 with equal weight, so each takes half the traffic; `backend-c` sits at priority 2 and gets nothing while the primaries are healthy.
          hl: [ bp-gw ]
        - say: "`backend-b` starts returning 503 — a bad deploy, a failing dependency, it does not matter. The gateway keeps sending it traffic, because one error is not a pattern."
          unhl: [ bp-gw ]
          text:
            bp-b-t: errors · 2 x 503 in 4 s
            bp-state: counting failures
          fill:
            bp-b: "#fbf3c4"
        - say: The circuit-breaker rule says five 5xx responses within 30 seconds. The fifth arrives, the threshold is crossed, and the breaker **trips**.
          hl: [ bp-b ]
          text:
            bp-b-t: failing · 5 x 503 in 11 s
            bp-b-b: "breaker: OPEN for 60 s"
            bp-state: backend-b tripped
          fill:
            bp-b: "#f9e3df"
        - say: "`backend-b` is removed from rotation for the trip duration. No request is sent to it, so callers stop seeing its errors — and it gets a chance to recover without being hammered."
          unhl: [ bp-b ]
          text:
            bp-f2: 0 /s
            bp-f1: 1,000 /s
            bp-a-t: healthy · p99 96 ms · 2x load
        - say: "Notice what just happened to `backend-a`: its load doubled instantly. This is the moment most pools actually fail — if each backend was sized for exactly its own share, the survivor now tips over too."
          text:
            bp-a-t: degrading · p99 2,400 ms
            bp-state: one backend carrying everything
          fill:
            bp-a: "#fbf3c4"
        - say: "It does: `backend-a` starts timing out and trips as well. With both priority-1 backends out, the pool falls through to the **priority 2** fallback, which is exactly what it was configured for."
          text:
            bp-a-t: failing · timeouts
            bp-a-b: "breaker: OPEN for 60 s"
            bp-f1: 0 /s
            bp-f3: 1,000 /s
            bp-c-t: serving · p99 120 ms
            bp-state: serving from fallback
          fill:
            bp-a: "#f9e3df"
            bp-c: "#e3eedc"
        - say: Sixty seconds later the trip expires and `backend-b` is probed again. The gateway sends it a request; a successful response closes the breaker and puts it back in rotation.
          text:
            bp-b-t: probe ✓ · p99 40 ms
            bp-b-b: "breaker: closed"
            bp-f2: 1,000 /s
            bp-f3: 0 /s
            bp-c-t: idle — lower priority
            bp-state: backend-b restored
          fill:
            bp-b: "#e3eedc"
        - say: "`backend-a` recovers next and the pool returns to a 50/50 split. Two things to remember: the breaker is evaluated **per gateway unit**, so each unit learns about a failure independently — and a pool only helps if the remaining backends can carry the whole load."
          show: [ bp-note ]
          text:
            bp-a-t: healthy · p99 40 ms
            bp-a-b: "breaker: closed"
            bp-b-t: healthy · p99 38 ms
            bp-f1: 500 /s
            bp-f2: 500 /s
            bp-state: all backends serving
          fill:
            bp-a: "#e3eedc"
concepts:
  - term: gateway
    short: The component that actually receives traffic, runs policies and forwards to backends. Everything else in APIM configures it.
    see: [ policy pipeline, tiers and units, self-hosted gateway ]
    detail: |-
      Separate the two planes in your head. The **data plane** is the gateway handling requests; the **control plane** is the management API, Bicep and the portal that configure it. They scale, fail and get secured independently.

      | Property | Detail |
      | --- | --- |
      | Added latency | a few milliseconds for a simple policy set; `validate-jwt` with a cached JWKS adds little |
      | Config propagation | policy changes reach gateways in seconds, not instantly — do not assume atomicity |
      | Network | can be injected into a VNet (classic Premium, v2 tiers) so backends are never public |
      | Scaling | by capacity units; each unit is a fixed throughput envelope, not a CPU percentage |

      A deliberate consequence of putting the gateway in front: backends should refuse traffic that did not come through it. Use private endpoints, VNet integration, or at minimum a shared secret or client certificate the gateway adds — otherwise your policies are a suggestion.
  - term: API and operation
    short: An <em>API</em> is a façade with a base path; an <em>operation</em> is one method and URL template within it. Policies can attach to either.
    see: [ policy pipeline, backend, versions ]
    detail: |-
      The API in APIM is a façade, not your service. It has its own URL, its own schema and its own operations, and the mapping to the backend is something you configure.

      | Piece | Example |
      | --- | --- |
      | API base path | `/orders` on `https://contoso.azure-api.net` |
      | Operation | `GET /orders/{orderId}` |
      | Backend URL | `https://orders-prod.internal/api/v3` |
      | Rewrite | `/orders/{orderId}` → `/api/v3/order?id={orderId}` |

      Import from an OpenAPI document rather than clicking operations into existence — you get schemas, examples and descriptions, and `validate-content` can then enforce the contract. For SOAP backends, import the WSDL and let APIM generate a REST façade.

      Operation-scoped policies are the right place for anything that is genuinely about one endpoint: a longer timeout on a report, a tighter rate limit on search, a mock while the backend is being built.
  - term: policy pipeline
    short: Four sections — `inbound`, `backend`, `outbound`, `on-error` — evaluated in order on every request. This is where APIM does its work.
    see: [ policy expressions, policy scope, response caching, validate-jwt ]
    detail: |-
      A policy document is XML, and the order of elements <em>is</em> the order of execution.

      ```markup
      <policies>
        <inbound>
          <base />                                  <!-- inherit the outer scope first -->
          <validate-jwt header-name="Authorization" failed-validation-httpcode="401">
            <openid-config url="https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration" />
            <required-claims><claim name="scp" match="any"><value>orders.read</value></claim></required-claims>
          </validate-jwt>
          <rate-limit-by-key calls="600" renewal-period="60" counter-key="@(context.Subscription.Id)" />
          <cache-lookup-value key="@($"order-{context.Request.MatchedParameters["orderId"]}")" variable-name="cached" />
          <rewrite-uri template="/api/v3/order?id={orderId}" />
        </inbound>
        <backend><forward-request timeout="20" /></backend>
        <outbound>
          <base />
          <cache-store-value key="..." value="..." duration="60" />
          <set-header name="X-Powered-By" exists-action="delete" />
        </outbound>
        <on-error><base /><return-response><set-status code="502" /></return-response></on-error>
      </policies>
      ```

      | Section | Runs | Typical content |
      | --- | --- | --- |
      | `inbound` | before the backend is called | auth, limits, validation, cache lookup, rewriting |
      | `backend` | the call itself | timeout, retry, circuit breaker, backend selection |
      | `outbound` | after a response is received | transformation, cache store, header stripping |
      | `on-error` | whenever any section throws | a consistent error envelope, logging the real cause |

      If a policy returns a response early — a cache hit, a 429, a mock — the remaining inbound and backend policies are skipped and execution jumps to `outbound`. That short-circuit is the whole point of the first animation on this page.
  - term: policy scope
    short: Policies attach at four levels — global, product, API, operation — and `<base />` decides where the outer level's policies run.
    see: [ policy pipeline, product ]
    figure:
      svg: azure-api-management/figure-policy-scope.svg
      alt: Nested policy scopes from global through product and API to operation
    detail: |-
      Each level has its own document. `<base />` is a placeholder for everything inherited from the level above; omit it and you silently discard the outer policies, which is one of the most common APIM bugs.

      ::figure::

      | Where `<base />` sits | Effect |
      | --- | --- |
      | First in `inbound` | outer policies run first — the usual choice |
      | Last in `inbound` | your policy runs before the inherited ones |
      | Missing | the outer scope is **ignored** entirely, including your global CORS and correlation id |

      In `outbound` and `on-error` the natural order is reversed: put `<base />` last so the inner scope transforms the response before the outer one does.
  - term: policy expressions
    short: Inline C# in `@(...)` or `@{ ... }` with access to `context`. The escape hatch that makes policies programmable.
    see: [ policy pipeline, named values, subscription ]
    detail: |-
      Single-statement expressions use `@(...)`; multi-statement blocks use `@{ ... }` and must `return` a value.

      ```markup
      <set-header name="X-Tenant" exists-action="override">
        <value>@(context.User?.Email?.Split('@')[1] ?? "unknown")</value>
      </set-header>

      <set-variable name="isPremium" value="@{
          var jwt = context.Request.Headers.GetValueOrDefault("Authorization","")
                           .Replace("Bearer ","").AsJwt();
          return jwt?.Claims.GetValueOrDefault("tier") == "premium";
      }" />
      ```

      | Useful `context` members | Gives you |
      | --- | --- |
      | `context.Request` / `context.Response` | method, URL, headers, body, matched parameters |
      | `context.Subscription` | id, name, key — the natural rate-limit counter key |
      | `context.User` | the developer-portal identity, when there is one |
      | `context.Variables` | values passed between policies in one request |
      | `context.LastError` | in `on-error`: what actually went wrong |
      | `.AsJwt()`, `.AsJObject()` | parsing helpers on strings and bodies |

      Reading the body needs `context.Request.Body.As<JObject>(preserveContent: true)`, or the backend receives an empty body. Forgetting `preserveContent` produces a bug that only appears on requests with payloads.

      Keep expressions short. Policies are not a place to write business logic: they are hard to test, hard to debug and invisible to your IDE.
  - term: product
    short: A bundle of APIs with its own terms, policies and quotas, which developers subscribe to. The commercial packaging layer.
    see: [ subscription, policy scope, rate limits and quota ]
    detail: |-
      Products answer "who may call these APIs, and on what terms". An API can belong to several products, and the product's policies apply to every call made with one of its subscription keys.

      | Product | APIs | Policy | Approval |
      | --- | --- | --- | --- |
      | Free | Orders (read) | quota 1,000 / month, 10 / min | automatic |
      | Pro | Orders, Catalogue | quota 1,000,000 / month, 600 / min | automatic |
      | Partner | everything, including write | IP allow-list, mutual TLS, no quota | manual |
      | Internal | everything | JWT only, no subscription key | not published |

      Two flags matter. **Published** makes the product visible in the developer portal. **Requires subscription**, when turned off, makes the APIs callable without a key — occasionally right for a public read API, and a very common accident otherwise.

      Approval workflows put a human in the loop before a key is issued, which is what you want for partner access and rarely what you want for a free tier.
  - term: subscription
    short: A pair of keys issued to a consumer for a product (or a single API, or all APIs). The default unit of identity and throttling.
    see: [ product, rate limits and quota, validate-jwt ]
    detail: |-
      Each subscription has a primary and a secondary key, sent as `Ocp-Apim-Subscription-Key`. Two keys exist so that rotation needs no downtime: switch clients to the secondary, regenerate the primary, switch back.

      | Scope | Use |
      | --- | --- |
      | Product | the normal case — the key carries the product's terms |
      | API | one API without product packaging |
      | All APIs | internal tooling and smoke tests; dangerous if it leaks |

      A subscription key is **not authentication**. It identifies an application for metering and throttling; it says nothing about a user, it travels in a header that ends up in logs, and in a browser app it is visible to anyone who opens the network tab. Use OAuth 2.0 with `validate-jwt` for anything that needs to know <em>who</em> is calling, and keep the subscription key for the quota story.
  - term: validate-jwt
    short: The inbound policy that verifies a bearer token's signature, issuer, audience, expiry and claims — before your backend sees the request.
    see: [ policy pipeline, subscription, backend authentication ]
    detail: |-
      APIM fetches and caches the signing keys from the OpenID configuration endpoint, so validation costs no network call per request.

      ```markup
      <validate-jwt header-name="Authorization" require-scheme="Bearer"
                    failed-validation-httpcode="401"
                    failed-validation-error-message="Invalid or missing token">
        <openid-config url="https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration" />
        <audiences><audience>api://contoso-orders</audience></audiences>
        <issuers><issuer>https://sts.windows.net/{tenant}/</issuer></issuers>
        <required-claims>
          <claim name="scp" match="any"><value>orders.read</value></claim>
        </required-claims>
      </validate-jwt>
      ```

      | Check | Why it matters |
      | --- | --- |
      | `audiences` | without it, a valid token for a <em>different</em> API is accepted |
      | `issuers` | pins the identity provider; note v1 and v2 endpoints issue different issuer values |
      | `required-claims` | coarse authorization at the edge: scope, role, tenant |
      | `failed-validation-httpcode` | 401 for a missing or bad token, 403 for a valid token without the right scope |

      Edge validation is not a substitute for checks in the backend. APIM can confirm the caller holds a valid token with the right scope; only your service knows whether <em>this</em> user may read <em>that</em> order.
  - term: rate limits and quota
    short: "`rate-limit` protects against bursts over seconds; `quota` enforces a volume over days or months. They solve different problems."
    see: [ product, subscription, policy expressions ]
    detail: |-
      Both come in a plain and a `-by-key` form. The `-by-key` variants let you choose the counter yourself, which is almost always what you want.

      ```
      <rate-limit-by-key calls="600" renewal-period="60"
          counter-key="@(context.Subscription?.Id ?? context.Request.IpAddress)"
          remaining-calls-header-name="RateLimit-Remaining"
          retry-after-header-name="Retry-After" />

      <quota-by-key calls="1000000" renewal-period="2592000"
          counter-key="@(context.Subscription.Id)" />
      ```

      |  | `rate-limit` | `quota` |
      | --- | --- | --- |
      | Window | seconds to minutes | days to months |
      | Protects | your capacity | your commercial terms |
      | Response | 429, retry soon | 403, come back next month |
      | Counter | per gateway unit, approximate | per gateway unit, approximate |

      That last row deserves emphasis: counters are **not shared across gateway units or regions**. Scale to four units and a 600/min limit becomes roughly 2,400/min in the worst case. For a hard global cap, keep a single-unit gateway in front, or enforce the real limit downstream — see the dedicated page on rate limiting for the algorithms involved.
  - term: response caching
    short: Either the built-in `cache-lookup` / `cache-store` pair, or fine-grained `cache-lookup-value` for arbitrary values. Served from the gateway, so the backend is never called.
    see: [ policy pipeline, policy expressions, policy scope ]
    detail: |-
      The simple form caches whole responses keyed on URL plus whatever you vary by:

      ```markup
      <inbound>
        <cache-lookup downstream-caching-type="none" must-revalidate="true"
                      vary-by-developer="false" vary-by-developer-groups="false">
          <vary-by-header>Accept-Language</vary-by-header>
          <vary-by-query-parameter>page</vary-by-query-parameter>
        </cache-lookup>
      </inbound>
      <outbound>
        <cache-store duration="60" />
      </outbound>
      ```

      | Cache | Available in | Notes |
      | --- | --- | --- |
      | Built-in | all tiers except Consumption | small, per gateway unit, not shared between units |
      | External Redis | any tier | shared across units and regions; what you want in production |

      `vary-by-developer` defaults matter enormously. Leave it `false` on a response that differs per user and you will serve one caller's data to another — the one APIM mistake that is a security incident rather than a bug.

      The caching patterns themselves — TTLs, stampedes, invalidation — are the same here as anywhere; see the caching strategies page.
  - term: backend
    short: "A named, reusable target: a URL, credentials and optionally a pool with load balancing and a circuit breaker. Referenced by `set-backend-service`."
    see: [ backend authentication, named values, api and operation ]
    detail: |-
      Defining a backend entity rather than hard-coding a URL in each policy gives you one place to change the target, and unlocks pools.

      ```
      <set-backend-service backend-id="orders-pool" />
      ```

      | Pool feature | What it does |
      | --- | --- |
      | `priority` | lower numbers are used first; higher ones are failover targets |
      | `weight` | splits traffic within a priority group — useful for canaries |
      | Circuit breaker | trips a backend out of rotation after N failures in a window |

      Weighted pools are the cheapest canary you can build: send 5% to the new revision of a service and 95% to the old one, with no deployment slot and no client change. The second animation on this page shows a pool reacting to a failing backend.

      Remember the breaker is per gateway unit: on a four-unit gateway, each unit must independently observe the failures before it stops sending traffic.
  - term: backend authentication
    short: "How the gateway proves itself to your API: managed identity, client certificate, or a secret from a named value. Never a key the client supplied."
    see: [ named values, backend, validate-jwt ]
    detail: |-
      The gateway is a confidential client, so it can hold credentials a browser or mobile app cannot. Use that.

      ```markup
      <!-- best: no secret exists anywhere -->
      <authentication-managed-identity resource="api://contoso-orders" />

      <!-- for backends that require mutual TLS -->
      <authentication-certificate thumbprint="{{orders-client-cert}}" />

      <!-- last resort: a secret, stored in Key Vault via a named value -->
      <set-header name="X-Api-Key"><value>{{orders-backend-key}}</value></set-header>
      ```

      | Mechanism | Rotation | Verdict |
      | --- | --- | --- |
      | Managed identity | automatic, nothing to store | the default for Azure backends |
      | Client certificate | manual, on expiry | right for partners and legacy systems |
      | Named value from Key Vault | rotates with the secret | acceptable when nothing better exists |
      | Hard-coded secret in the policy | never | it ends up in source control and in the portal UI |

      Strip inbound credentials before forwarding. The client's subscription key and bearer token should not reach the backend unless it actually needs them: `<set-header name="Ocp-Apim-Subscription-Key" exists-action="delete" />`.
  - term: named values
    short: "The configuration store: plain strings, secrets, or references to Key Vault, usable in any policy as `{{name}}`."
    see: [ backend authentication, policy expressions ]
    detail: |-
      They keep environment-specific values out of policy XML, so the same policy document deploys unchanged to dev, test and production.

      ```markup
      <set-backend-service base-url="{{orders-backend-url}}" />
      <set-header name="X-Api-Key"><value>{{orders-backend-key}}</value></set-header>
      ```

      | Type | Stored | Use for |
      | --- | --- | --- |
      | Plain | visible in the portal and API | URLs, tenant ids, feature switches |
      | Secret | encrypted, masked in the UI | legacy secrets with no better home |
      | Key Vault reference | in Key Vault, fetched by managed identity | everything sensitive — it rotates automatically |

      Key Vault references refresh on a schedule (about every four hours by default), not instantly. After rotating a secret, either wait or force a refresh — otherwise you will debug a backend returning 401 while the vault shows the correct value.
  - term: revisions
    short: Non-breaking changes to an API, staged and tested at `?rev=N` before one of them becomes current. Same URL for clients.
    see: [ versions, policy pipeline ]
    anim:
      key: rev
      title: Staging a revision, then making it current
      svg: azure-api-management/rev.svg
      alt: Animated revision workflow from creation through private testing to becoming current
      steps:
        - say: "Revision 1 is **current**: every client calling `/orders` is served by it."
        - say: You create **revision 2** to add an optional `?include=lines` parameter. It is a full copy of the definition and policies, and it receives no traffic at all.
          show: [ rv-r2, rv-r2-h, rv-r2-t ]
        - say: You can call it directly at `/orders;rev=2` while clients keep hitting revision 1. Same gateway, same keys, completely separate behaviour — this is how you test against production configuration without risking it.
          show: [ rv-url2 ]
        - say: Once it is verified you make revision 2 current, with a change log entry. The switch is instant and clients never change a URL.
          show: [ rv-log ]
          hide: [ rv-url2 ]
          text:
            rv-r1-t: archived · 0 req/s
            rv-r2-t: CURRENT · 1,000 req/s
            rv-url1: clients call /orders → revision 2
          fill:
            rv-r1: "#fbfcf8"
            rv-r2: "#e3eedc"
        - say: If it misbehaves, making revision 1 current again is the same one-click operation. Nothing was deleted, so rollback costs seconds.
          text:
            rv-r2-t: current · rollback available
        - say: "The rule that matters: revisions are for changes clients do not need to know about. The moment you remove a field or change a response shape, that is a **version** — a separate API that lives alongside the old one until you sunset it."
          show: [ rv-note ]
    detail: |-
      A revision is a copy of the API's definition and policies that you can edit and call privately, then promote. Clients keep using the same URL throughout.

      ::anim rev::

      | Use a revision for | Use a version for |
      | --- | --- |
      | adding an optional field or query parameter | removing or renaming a field |
      | a policy change | changing a response shape or status semantics |
      | a backend URL change | anything a client must be told about |

      Making a revision current is instant and reversible: the previous revision is still there, so rolling back is one click. Always fill in the change log — it is published to the developer portal.
  - term: versions
    short: "Breaking changes, exposed deliberately: `/v1` and `/v2` live side by side, with their own policies and lifecycles."
    see: [ revisions, api and operation ]
    detail: |-
      A version set groups the versions of one logical API. Clients choose which they call; you deprecate on a schedule.

      | Scheme | Looks like | Trade-off |
      | --- | --- | --- |
      | Path | `/orders/v2/{id}` | obvious, cache-friendly, easy to route — the usual choice |
      | Query string | `/orders/{id}?api-version=2` | easy to default, but easy to forget and awkward for CDNs |
      | Header | `Api-Version: 2` | keeps URLs clean, invisible in a browser, harder to debug |

      Each version is a full API in APIM: its own operations, its own policies, its own products. That is the point — v1 can keep a legacy backend and a generous rate limit while v2 points at the rewrite.

      Deprecation needs a plan, not a date in a wiki: add a `Deprecation` and `Sunset` header in an outbound policy, watch per-version metrics in Application Insights to see who is still calling, and contact those subscriptions directly before you remove anything.
  - term: developer portal
    short: The auto-generated, customisable site where consumers read the docs, sign up for a product and try calls in the browser.
    see: [ product, subscription ]
    detail: |-
      Generated from your OpenAPI definitions, so the quality of the portal is the quality of your API descriptions and examples.

      | Capability | Detail |
      | --- | --- |
      | Try-it console | real calls with the signed-in developer's key; needs CORS configured at global scope |
      | Sign-up and identity | built-in accounts, Microsoft Entra ID, or Entra External ID |
      | Customisation | a visual editor; the whole portal can also be self-hosted from source |
      | Publishing | edits are **not** live until you publish — and this catches everyone once |

      Two practical notes. The portal is not available in the Consumption tier. And if you have no external consumers, you may not need it at all — an internal API catalogue is usually better served by your existing documentation site, with APIM just exporting the OpenAPI document.
  - term: self-hosted gateway
    short: The gateway as a container you run yourself — on-premises, in another cloud, or in Kubernetes — managed from the same Azure control plane.
    see: [ gateway, tiers and units ]
    detail: |-
      It solves one specific problem: a backend that cannot be reached from Azure, or data that must not leave a location, while you still want one place to manage every API.

      | Property | Detail |
      | --- | --- |
      | Availability | Premium and Developer tiers |
      | Runs as | a container; usually a Deployment on Kubernetes, with the APIM Operator available |
      | Config | pulled from the Azure control plane and cached locally |
      | Control-plane outage | keeps serving traffic with the cached configuration |
      | Telemetry | to Application Insights, or locally via OpenTelemetry |

      You now operate it: scaling, upgrades, certificates and capacity are yours. Take it only when the network topology genuinely requires it, not for the idea of hybrid.
  - term: tiers and units
    short: The pricing tier fixes the feature set (VNet, multi-region, portal, SLA) and the capacity unit fixes throughput. Changing tier later is disruptive.
    see: [ gateway, self-hosted gateway, rate limits and quota ]
    detail: |-
      Choose the tier for its <em>features</em>, not its throughput — throughput is what units are for.

      | Tier | Use for | Watch out |
      | --- | --- | --- |
      | Consumption | spiky, low-volume, serverless APIs; pay per call | no built-in cache, no developer portal, cold starts |
      | Developer | non-production only | **no SLA** — never run production on it, whatever the cost argument |
      | Basic / Standard | ordinary production workloads | no VNet injection on the classic tiers |
      | Premium | VNet, multi-region, self-hosted gateways, workspaces | the expensive one; justify it with a feature you actually use |
      | v2 tiers | faster provisioning and scaling, simpler networking | feature parity with the classic tiers is still not complete — check before committing |

      Two operational facts worth knowing early. Classic-tier deployments and scale operations take tens of minutes, so treat them as planned changes. And a tier change usually means recreating the instance, which means a new IP address — plan for it before clients start allow-listing you.
  - term: diagnostics
    short: "What you can see: Application Insights traces, Azure Monitor metrics, resource logs, and the request trace in the test console."
    see: [ policy pipeline, gateway ]
    detail: |-
      APIM sits between two systems, so it is the natural place to answer "was it us or them". Configure it deliberately rather than relying on defaults.

      | Signal | Gives you |
      | --- | --- |
      | Application Insights | per-request traces, dependency timing for the backend call, failures by operation |
      | Azure Monitor metrics | capacity, requests, duration, by product and subscription |
      | Resource logs (`GatewayLogs`) | the full log, queryable in Log Analytics — the best place for alerting |
      | `Ocp-Apim-Trace` | a step-by-step trace of every policy, for one request, from the test console |

      Set the Application Insights sampling rate explicitly. The default of 100% on a busy gateway produces a surprising bill; 5–10% is usually plenty, with failures sampled at 100%.

      Be careful with request and response body logging: it is invaluable in development and a data-protection problem in production. If you need it, mask the fields that matter in an outbound policy first.
commands:
  heading: Essential commands & syntax
  tocLabel: Commands
  groups:
    - group: Policies you will write on day one
      items:
        - lang: markup
          code: |-
            <cors allow-credentials="false">
              <allowed-origins><origin>https://app.contoso.com</origin></allowed-origins>
              <allowed-methods><method>GET</method><method>POST</method></allowed-methods>
              <allowed-headers><header>*</header></allowed-headers>
            </cors>
          what: Global inbound CORS. The developer portal's try-it console needs this too.
        - lang: markup
          code: |-
            <validate-jwt header-name="Authorization" failed-validation-httpcode="401">
              <openid-config url="https://login.microsoftonline.com/{tenant}/v2.0/.well-known/openid-configuration" />
              <audiences><audience>api://contoso-orders</audience></audiences>
            </validate-jwt>
          what: Rejects unauthenticated calls at the edge. Always set `audiences`.
        - code: |-
            <rate-limit-by-key calls="600" renewal-period="60"
                counter-key="@(context.Subscription?.Id ?? context.Request.IpAddress)"
                retry-after-header-name="Retry-After" />
          what: Per-subscription throttle, falling back to the caller's IP for anonymous APIs.
        - code: |-
            <set-backend-service backend-id="orders-pool" />
            <rewrite-uri template="/api/v3/order?id={orderId}" />
            <authentication-managed-identity resource="api://contoso-orders" />
          what: Routes to a pooled backend, reshapes the URL and authenticates with no stored secret.
        - code: |-
            <set-header name="Ocp-Apim-Subscription-Key" exists-action="delete" />
            <set-header name="Authorization" exists-action="delete" />
          what: Strips the client's credentials so they never reach the backend.
        - lang: markup
          code: |-
            <return-response>
              <set-status code="200" reason="OK" />
              <set-header name="Content-Type"><value>application/json</value></set-header>
              <set-body>{"id":10427,"status":"shipped"}</set-body>
            </return-response>
          what: "A mock response: front-end teams can build against the API before the backend exists."
        - lang: markup
          code: |-
            <on-error>
              <base />
              <return-response>
                <set-status code="502" reason="Bad Gateway" />
                <set-body>@($"{{\"error\":\"upstream\",\"traceId\":\"{context.RequestId}\"}}")</set-body>
              </return-response>
            </on-error>
          what: One error shape for every failure, with a trace id the caller can quote in a support ticket.
    - group: Azure CLI
      items:
        - lang: bash
          code: |-
            az apim create -g rg-apis -n contoso-apim -l westeurope \
              --publisher-email apis@contoso.com --publisher-name Contoso --sku-name Developer
          what: Creates an instance. Classic tiers take 30–45 minutes — start it and go do something else.
        - lang: bash
          code: |-
            az apim api import -g rg-apis -n contoso-apim --path orders \
              --specification-format OpenApi --specification-path ./orders.openapi.json --api-id orders
          what: Imports an API from OpenAPI, bringing operations, schemas and descriptions with it.
        - lang: bash
          code: |-
            az apim api policy import -g rg-apis -n contoso-apim --api-id orders \
              --policy-format xml --value "@policies/orders.xml"
          what: Applies an API-scoped policy document from a file in source control.
        - lang: bash
          code: |-
            az apim nv create -g rg-apis -n contoso-apim --named-value-id orders-backend-key \
              --display-name orders-backend-key --secret true \
              --value-from-key-vault "https://kv-contoso.vault.azure.net/secrets/orders-key"
          what: Creates a Key Vault-backed named value so no secret lives in APIM itself.
        - lang: bash
          code: az apim show -g rg-apis -n contoso-apim --query "publicIPAddresses"
          what: The IP partners will allow-list. It changes if you change tier — keep that in mind.
    - group: Calling and testing
      items:
        - lang: bash
          code: |-
            curl -s https://contoso.azure-api.net/orders/10427 \
              -H "Ocp-Apim-Subscription-Key: $KEY" -H "Authorization: Bearer $TOKEN"
          what: "A normal call: subscription key for metering, bearer token for identity."
        - lang: bash
          code: "curl -s \"https://contoso.azure-api.net/orders;rev=2/10427\" -H \"Ocp-Apim-Subscription-Key: $KEY\""
          what: Calls a non-current revision directly, to test it before promoting.
        - lang: bash
          code: |-
            curl -sD - https://contoso.azure-api.net/orders/10427 -o /dev/null \
              -H "Ocp-Apim-Subscription-Key: $KEY" | grep -iE "ratelimit|retry-after|x-cache"
          what: Checks that your throttle and cache headers actually reach the client.
    - group: Infrastructure as code (Bicep)
      items:
        - lang: bicep
          code: |-
            resource pool 'Microsoft.ApiManagement/service/backends@2023-09-01-preview' = {
              parent: apim
              name: 'orders-pool'
              properties: {
                type: 'Pool'
                pool: { services: [ { id: backendA.id, priority: 1, weight: 50 }
                                    { id: backendB.id, priority: 1, weight: 50 }
                                    { id: backendC.id, priority: 2 } ] }
                circuitBreaker: { rules: [ { name: 'trip5xx', failureCondition: {
                  count: 5, interval: 'PT30S', statusCodeRanges: [ { min: 500, max: 599 } ] },
                  tripDuration: 'PT1M' } ] }
              }
            }
          what: A load-balanced pool with failover and a circuit breaker — the configuration behind the second animation.
        - lang: bash
          code: git clone https://github.com/Azure/apiops
          what: "APIOps: extracts an APIM instance into files and promotes them through environments. The usual answer to \"how do we stop editing production in the portal\"."
prosCons:
  good:
    heading: Pros
    items:
      - Cross-cutting concerns move out of every service into one auditable, versioned place.
      - Auth, throttling, caching and transformation are configuration, not code you maintain per API.
      - A stable public contract in front of backends you are free to rewrite, split or replace.
      - Products, subscriptions and the developer portal turn a set of endpoints into a sellable API product.
      - Backends can stay entirely private, with the gateway as the only internet-facing surface.
      - Mocks, revisions and weighted backend pools make safe rollout and parallel development easy.
  bad:
    heading: Cons
    items:
      - Expensive relative to a plain reverse proxy, and the Premium features are a steep step up.
      - Policy XML with embedded C# is awkward to test, review and debug compared with real code.
      - Classic-tier deployment and scaling are measured in tens of minutes.
      - It is a single point of failure in front of everything, so its blast radius is your whole API estate.
      - Rate-limit and cache state is per gateway unit, which surprises people at scale.
      - "Strong Azure lock-in: policies and products do not port to another gateway."
when:
  note: One API and one consumer? You want a reverse proxy. Many APIs and many consumers? You want this.
  good:
    heading: Use it when…
    items:
      - Several APIs, owned by several teams, need one consistent front door.
      - External consumers need keys, quotas, documentation and self-service sign-up.
      - You want auth, throttling and caching enforced uniformly and provably, not per service.
      - Backends must stay private, or sit in several networks and clouds.
      - You are modernising something legacy and need a stable façade while it changes underneath.
      - Per-consumer usage data is a product or billing requirement.
  bad:
    heading: Avoid it when…
    items:
      - You have one API and one internal client. Use **Azure Front Door** or **Application Gateway** for TLS and routing.
      - The need is purely CDN and WAF. Use **Front Door** or a **CDN**; they are cheaper and closer to the user.
      - All traffic is service-to-service inside one Kubernetes cluster. Use a **service mesh** or an ingress controller.
      - You want to run the gateway anywhere, cheaply, with config in Git. Use **Kong**, **Envoy** or **APISIX**.
      - The budget does not stretch to the tier whose features you actually need. Developer tier has **no SLA** — use something else rather than run production on it.
      - You would be moving real business logic into policies. Keep it in the **service**, where it can be tested.
useCases:
  - title: A monolith being strangled
    body: A legacy ASP.NET monolith is being broken into services. APIM fronts the old application, and as each endpoint is rewritten, `set-backend-service` routes that one operation to the new service. Clients see one unchanging URL throughout, and a weighted pool lets each cut-over start at 5% of traffic.
  - title: Selling an API to partners
    body: A logistics company exposes tracking data. Products define Free, Pro and Partner tiers with different quotas; the developer portal handles sign-up, documentation and key issuance; `quota-by-key` enforces the monthly allowance. Billing reads the per-subscription metrics rather than instrumenting the backend.
  - title: A SOAP backend with modern clients
    body: An insurance core system speaks SOAP and will not change. APIM imports the WSDL, exposes a REST façade, and `xml-to-json` plus a few `set-body` policies convert payloads in both directions. New mobile clients call clean JSON and never learn what is behind it.
  - title: Protecting an LLM endpoint
    body: Calls to a model deployment are expensive and have hard token limits. APIM validates the JWT, applies a token-aware rate limit per subscription, caches identical prompts, and load-balances across several deployments with a circuit breaker so one throttled region does not fail the whole feature.
  - title: One gateway, many teams
    body: Fifteen teams each own APIs. A global policy adds CORS, a correlation id and a standard error envelope; each team owns its own API-scoped policy file in its own repository, promoted by an APIOps pipeline. Nobody edits production in the portal, and every change arrives as a reviewed pull request.
gotchas:
  items:
    - mistake: Forgetting `<base />`
      why: An API-scoped policy without `<base />` silently discards every global and product policy — your CORS, your correlation id, your product quota. Nothing errors; things just stop applying.
      fix: always include `<base />`, first in `inbound` and `backend`, last in `outbound` and `on-error`. Make it a review checklist item.
    - mistake: Treating the subscription key as authentication
      why: It identifies an application for metering, nothing more. In a browser app it is visible in the network tab, and it is frequently pasted into tickets and logs.
      fix: use OAuth 2.0 with `validate-jwt` for identity and keep the subscription key for quotas. Never put a subscription key in client-side code you cannot rotate.
    - mistake: Assuming rate limits are global
      why: Counters are per gateway unit and per region. A 600/min limit on a four-unit gateway admits roughly 2,400/min, which only shows up once you scale out — usually during the incident that made you scale out.
      fix: size the limit per unit deliberately, or enforce the real cap downstream with a shared counter. Document which one your number is.
    - mistake: Caching a personalised response
      why: "`cache-lookup` with `vary-by-developer=\"false\"` on an endpoint that returns the caller's own data serves one customer's response to another. It is a data breach, and it looks exactly like a cache working well."
      fix: vary by every dimension that changes the response, or do not cache authenticated responses at all. Review every `cache-store` as if it were a security change.
    - mistake: Reading the body without `preserveContent`
      why: "`context.Request.Body.As<JObject>()` consumes the stream, so the backend receives an empty body. GETs work perfectly and every POST breaks."
      fix: "`As<JObject>(preserveContent: true)` whenever the body must continue downstream, and the same on the response side."
    - mistake: Editing production in the portal
      why: Policies drift from source control, nobody knows who changed what, and the next infrastructure-as-code deployment reverts a fix somebody made at 2am.
      fix: treat the portal as read-only for production. Keep policies in Git and promote them with APIOps, Bicep or Terraform. Grant portal write access sparingly.
    - mistake: Leaving backends publicly reachable
      why: The gateway enforces auth and limits, but if the backend has a public URL, anyone who finds it bypasses all of it — including your rate limits and your JWT validation.
      fix: private endpoints or VNet integration, plus a gateway-supplied credential (managed identity or a client certificate) that the backend requires.
    - mistake: Running production on the Developer tier
      why: It is the cheapest tier with the full feature set, which makes it tempting. It carries **no SLA** and is taken down for platform maintenance without warning.
      fix: Developer for non-production only. If Basic or Standard is unaffordable, the right answer is a simpler gateway, not an unsupported one.
    - mistake: Expecting a tier change to be in-place
      why: Moving between tiers often means a new instance, a new IP address and a migration — discovered after partners have allow-listed the old address.
      fix: choose the tier from the features you will need within a year, use a custom domain from day one, and never publish the raw `*.azure-api.net` host to partners.
alternatives:
  columns: [ Tool, Best for, Complexity, Cost / license, Key difference vs APIM ]
  rows:
    - self: true
      cells:
        - "**Azure API Management**"
        - many APIs, external consumers, full API product lifecycle
        - Medium–high
        - per instance + units
        - —
    - cells:
        - "**Azure Front Door**"
        - global routing, WAF, CDN, TLS termination
        - Low
        - per GB + requests
        - "Edge network, not an API gateway: no products, keys or policy pipeline"
    - cells:
        - "**Application Gateway**"
        - regional L7 load balancing with WAF
        - Low–medium
        - per hour + capacity
        - Routing and WAF only; no API lifecycle features at all
    - cells:
        - "**Kong**"
        - portable, plugin-rich gateway on any infrastructure
        - Medium
        - OSS or enterprise
        - Runs anywhere, config in Git; you operate it, and the developer portal is a paid add-on
    - cells:
        - "**Envoy / Istio ingress**"
        - service-to-service traffic inside Kubernetes
        - High
        - OSS
        - Mesh-native, extremely fast; no products, subscriptions or portal
    - cells:
        - "**Apache APISIX**"
        - high-throughput open-source gateway
        - Medium
        - OSS
        - Dynamic config, good performance; a smaller managed ecosystem
    - cells:
        - "**Container Apps / AKS ingress**"
        - a single app that only needs routing and TLS
        - Low
        - included
        - Enough when "gateway" really means "reverse proxy"
  notes:
    - "**Pick Front Door** if the requirement is global performance, caching and WAF rather than API lifecycle."
    - "**Pick Application Gateway** if you need regional L7 routing with a WAF and nothing more."
    - "**Pick Kong or APISIX** if the gateway must run outside Azure, or the licence cost matters more than the managed experience."
    - "**Pick a service mesh** if the traffic you are governing is service-to-service inside a cluster."
    - "These stack: Front Door for the edge and WAF, APIM behind it for API concerns, and a mesh inside the cluster is a common and sensible layering."
