title: Queueing theory
slug: queueing-theory
tagline: Waiting is not caused by being out of capacity. It is caused by being nearly out of capacity, at random moments.
asof: Nov 2026 · Erlang 1909, Kendall 1953, Kingman 1961 · the maths behind every capacity decision you make
description: "Queueing theory cheatsheet: why waiting time explodes near full utilisation, how variability multiplies it, Kendall notation, M/M/1 versus M/M/c, and why pooling beats dedicated queues."
aliases:
