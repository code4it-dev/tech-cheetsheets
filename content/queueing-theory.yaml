    title: Queueing theory basics
    why: Kendall notation and the standard M/M/1 and M/M/c results, compactly.
  - url: https://www.cs.cmu.edu/~harchol/PerformanceModeling/book.html
    title: Performance Modeling and Design of Computer Systems (Harchol-Balter)
    why: the best book on this for software people; several chapters are free online.
  - url: https://queue.acm.org/detail.cfm?id=2209336
    title: Controlling Queue Delay (CoDel)
    why: queueing theory applied to real buffers, and why sojourn time is the signal to watch.
  - url: https://sre.google/sre-book/addressing-cascading-failures/
    title: Google SRE — Addressing Cascading Failures
    why: what happens past ρ = 1, where the formulas stop and the outage starts.
  - url: https://www.perfdynamics.com/Manifesto/USLscalability.html
    title: Universal Scalability Law (Gunther)
    why: the companion model for how throughput scales with concurrency.
