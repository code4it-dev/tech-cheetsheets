<svg viewBox="0 0 800 300" role="img" aria-label="Animated utilisation curve showing waiting time exploding as utilisation approaches one">
  <line x1="70" y1="236" x2="760" y2="236" stroke="#5f6f66" stroke-width="1.5"/>
  <line x1="70" y1="44" x2="70" y2="236" stroke="#5f6f66" stroke-width="1.5"/>
  <text x="415" y="262" font-size="12" text-anchor="middle" fill="#5f6f66">utilisation &rho; = &lambda; / &mu;</text>
  <text x="40" y="140" font-size="12" fill="#5f6f66" transform="rotate(-90 40 140)" text-anchor="middle">W</text>
  <g font-size="10.5" fill="#5f6f66" text-anchor="middle">
    <text x="208" y="252">20%</text><text x="346" y="252">50%</text><text x="484" y="252">70%</text>
    <text x="622" y="252">90%</text><text x="725" y="252">100%</text>
  </g>
  <path id="sa-curve" d="M70 224 L208 220 L346 212 L414 204 L484 190 L553 166 L622 124 L673 76 L704 48"
        stroke="#2f6b3f" stroke-width="2.5" fill="none"/>
  <line id="sa-wall" class="hidden" x1="725" y1="40" x2="725" y2="236" stroke="#c53b3b" stroke-width="2" stroke-dasharray="5 4"/>
  <circle id="sa-dot" cx="346" cy="212" r="7" fill="#c53b3b"/>
  <text id="sa-read" x="90" y="70" font-size="13" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">&rho; = 50% &middot; W = 2 &times; service time</text>
  <text id="sa-say" x="90" y="92" font-size="11.5" fill="#5f6f66">the queue is mostly empty</text>
  <text id="sa-l" x="90" y="114" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="sa-note" class="hand hidden" x="90" y="290" font-size="16" fill="#c53b3b">Little's Law still holds here &mdash; it just stops being useful</text>
</svg>
