<svg viewBox="0 0 800 310" role="img" aria-label="Items arriving at rate lambda, spending time W inside a system, leaving at the same rate, with L items inside at any instant">
  <defs>
    <marker id="la-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="24" font-size="12.5" text-anchor="middle" fill="#5f6f66">in steady state, what goes in must come out &mdash; everything else follows from that</text>

  <text x="22" y="112" font-size="13" font-weight="600" fill="#23362e">Arrivals</text>
  <text x="22" y="134" font-size="12.5" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">&lambda; = 100 / s</text>
  <text x="22" y="154" font-size="11" fill="#5f6f66">the rate things show up</text>
  <line x1="130" y1="120" x2="176" y2="120" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#la-arr)"/>

  <rect x="180" y="52" width="430" height="176" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="395" y="74" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">The system &mdash; whatever you drew the box around</text>

  <rect x="196" y="88" width="238" height="124" rx="6" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="315" y="106" font-size="11.5" text-anchor="middle" fill="#5f6f66">waiting</text>
  <g fill="#c53b3b">
    <circle cx="222" cy="134" r="11"/><circle cx="256" cy="134" r="11"/><circle cx="290" cy="134" r="11"/>
    <circle cx="222" cy="168" r="11"/><circle cx="256" cy="168" r="11"/>
  </g>
  <text x="315" y="198" font-size="11" text-anchor="middle" fill="#5f6f66">queue</text>

  <rect x="446" y="88" width="148" height="124" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="520" y="106" font-size="11.5" text-anchor="middle" fill="#5f6f66">being served</text>
  <g fill="#2f6b3f">
    <circle cx="486" cy="140" r="11"/><circle cx="520" cy="140" r="11"/><circle cx="554" cy="140" r="11"/>
  </g>
  <text x="520" y="198" font-size="11" text-anchor="middle" fill="#5f6f66">servers</text>

  <line x1="614" y1="120" x2="660" y2="120" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#la-arr)"/>
  <text x="666" y="112" font-size="13" font-weight="600" fill="#23362e">Departures</text>
  <text x="666" y="134" font-size="12.5" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">100 / s</text>
  <text x="666" y="154" font-size="11" fill="#5f6f66">same rate, or it isn't</text>
  <text x="666" y="170" font-size="11" fill="#5f6f66">steady state</text>

  <rect x="180" y="246" width="430" height="48" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="395" y="268" font-size="14" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">L = &lambda; &times; W</text>
  <text x="395" y="286" font-size="11.5" text-anchor="middle" fill="#5f6f66">8 inside = 100 / s &times; 80 ms</text>

  <text class="hand" x="18" y="212" font-size="16" fill="#c53b3b">W is time in the box,</text>
  <text class="hand" x="18" y="232" font-size="16" fill="#c53b3b">not time being served</text>
</svg>
