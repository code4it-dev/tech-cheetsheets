<svg viewBox="0 0 800 300" role="img" aria-label="Animated queue showing the number in the system settling at arrival rate times time in system">
  <defs>
    <marker id="ll-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="22" y="110" font-size="12.5" font-weight="600" fill="#23362e">Arrivals</text>
  <text id="ll-lam" x="22" y="132" font-size="12.5" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">&lambda; = 100 / s</text>
  <line x1="112" y1="118" x2="156" y2="118" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <rect id="ll-sys" x="160" y="50" width="452" height="166" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="386" y="72" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">inside the system</text>
  <g>
    <circle id="ll-i1" class="hidden" cx="200" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i2" class="hidden" cx="244" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i3" class="hidden" cx="288" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i4" class="hidden" cx="332" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i5" class="hidden" cx="376" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i6" class="hidden" cx="420" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i7" class="hidden" cx="464" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i8" class="hidden" cx="508" cy="108" r="12" fill="#c53b3b"/>
    <circle id="ll-i9" class="hidden" cx="200" cy="152" r="12" fill="#c53b3b"/>
    <circle id="ll-i10" class="hidden" cx="244" cy="152" r="12" fill="#c53b3b"/>
  </g>
  <text id="ll-count" x="386" y="196" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">L = 0 inside</text>
  <line x1="612" y1="118" x2="656" y2="118" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ll-a)"/>
  <text x="662" y="110" font-size="12.5" font-weight="600" fill="#23362e">Departures</text>
  <text id="ll-dep" x="662" y="132" font-size="12.5" fill="#5f6f66" font-weight="700" font-family="Fira Code, monospace">0 / s</text>
  <text id="ll-w" x="22" y="170" font-size="12.5" fill="#5f6f66" font-family="Fira Code, monospace">W = 50 ms</text>
  <text id="ll-eq" x="22" y="252" font-size="14" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">L = &lambda; &times; W = ?</text>
  <text id="ll-note" class="hand hidden" x="360" y="256" font-size="16" fill="#c53b3b">no distribution, no scheduling, no assumptions</text>
  <text id="ll-sub" x="22" y="278" font-size="11.5" fill="#5f6f66">watch one request, then count the room</text>
</svg>
