<svg viewBox="0 0 800 300" role="img" aria-label="Animated walk-through of solving Little's Law for concurrency, for throughput and for latency">
  <text x="400" y="30" font-size="13" text-anchor="middle" fill="#5f6f66">which letter you <tspan font-style="italic">don't</tspan> know decides what you're doing</text>
  <rect id="sv-b1" x="24" y="52" width="240" height="160" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="144" y="76" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Solve for L</text>
  <text x="144" y="96" font-size="11" text-anchor="middle" fill="#5f6f66">"how big a pool?"</text>
  <text id="sv-t1" x="144" y="126" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="sv-t1b" x="144" y="148" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="sv-r1" x="144" y="182" font-size="14" text-anchor="middle" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">&nbsp;</text>
  <rect id="sv-b2" x="280" y="52" width="240" height="160" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="76" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Solve for &lambda;</text>
  <text x="400" y="96" font-size="11" text-anchor="middle" fill="#5f6f66">"what can it sustain?"</text>
  <text id="sv-t2" x="400" y="126" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="sv-t2b" x="400" y="148" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="sv-r2" x="400" y="182" font-size="14" text-anchor="middle" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">&nbsp;</text>
  <rect id="sv-b3" x="536" y="52" width="240" height="160" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="656" y="76" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Solve for W</text>
  <text x="656" y="96" font-size="11" text-anchor="middle" fill="#5f6f66">"why is it slow?"</text>
  <text id="sv-t3" x="656" y="126" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="sv-t3b" x="656" y="148" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&mdash;</text>
  <text id="sv-r3" x="656" y="182" font-size="14" text-anchor="middle" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="sv-say" x="24" y="248" font-size="12.5" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="sv-note" class="hand hidden" x="300" y="282" font-size="16" fill="#c53b3b">you can't tune one without moving another</text>
</svg>
