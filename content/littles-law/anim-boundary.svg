<svg viewBox="0 0 800 300" role="img" aria-label="Animated nested boundaries showing different values of L and W for the same system">
  <defs>
    <marker id="bd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="22" y="118" font-size="12" font-weight="600" fill="#23362e">&lambda; = 500 / s</text>
  <line x1="110" y1="128" x2="152" y2="128" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#bd-a)"/>
  <rect id="bd-whole" x="156" y="48" width="462" height="170" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="387" y="70" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">the whole request</text>
  <rect id="bd-queue" x="176" y="84" width="200" height="118" rx="6" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="276" y="104" font-size="12" text-anchor="middle" fill="#23362e">pool wait</text>
  <text id="bd-qt" x="276" y="126" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">W = 12 ms</text>
  <text id="bd-ql" x="276" y="148" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">L = 6</text>
  <text x="276" y="180" font-size="10.5" text-anchor="middle" fill="#5f6f66">waiting for a connection</text>
  <rect id="bd-srv" x="396" y="84" width="200" height="118" rx="6" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="496" y="104" font-size="12" text-anchor="middle" fill="#23362e">the query itself</text>
  <text id="bd-st" x="496" y="126" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">W = 8 ms</text>
  <text id="bd-sl" x="496" y="148" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">L = 4</text>
  <text x="496" y="180" font-size="10.5" text-anchor="middle" fill="#5f6f66">holding a connection</text>
  <line x1="620" y1="128" x2="662" y2="128" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#bd-a)"/>
  <text x="668" y="118" font-size="12" font-weight="600" fill="#23362e">500 / s</text>
  <text x="668" y="138" font-size="10.5" fill="#5f6f66">same everywhere</text>
  <text id="bd-read" x="22" y="250" font-size="13" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="bd-sub" x="22" y="272" font-size="11.5" fill="#5f6f66">&nbsp;</text>
  <text id="bd-note" class="hand hidden" x="330" y="290" font-size="16" fill="#c53b3b">"100 in flight" means nothing without "in flight where"</text>
</svg>
