title: Sidecar pattern
slug: sidecar-pattern
tagline: Put the cross-cutting concern in a container next door, not in every application's dependency list.
asof: Nov 2026 · Kubernetes native sidecar containers are GA since 1.29; examples use Istio/Envoy, Fluent Bit and Cloud SQL Proxy
description: "Sidecar pattern cheatsheet: a helper container sharing the pod's lifecycle and network, what it moves out of your code, the lifecycle traps it brings, and when sidecarless beats it."
aliases:
  - Sidecar pattern
  - sidecar
  - sidecars
  - sidecar container
  - ambassador pattern
  - adapter pattern
  - service mesh
