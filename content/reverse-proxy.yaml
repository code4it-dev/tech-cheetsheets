title: Reverse proxy
slug: reverse-proxy
tagline: One public door in front of many private rooms — and the only place where "every request" is a thing you can say.
asof: Nov 2026 · examples use nginx, Envoy, Caddy, Traefik and YARP
description: "Reverse proxy cheatsheet: TLS termination, routing, header rewriting, upstream keepalive, buffering, timeouts and the X-Forwarded-For trust chain."
