<svg viewBox="0 0 800 320" role="img" aria-label="Eight dependencies multiplied into a page availability, then reclassified so only two are critical">
  <text id="gm-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one product page, eight service calls, each independently 99.9% available</text>

  <g id="gm-row">
