    <text id="gm-s6" x="556" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
    <rect id="gm-d7" x="608" y="44" width="92" height="52" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="654" y="66" font-size="10" text-anchor="middle" fill="#23362e">loyalty</text>
    <text id="gm-s7" x="654" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
    <rect id="gm-d8" x="706" y="44" width="74" height="52" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="743" y="66" font-size="10" text-anchor="middle" fill="#23362e">recent</text>
    <text id="gm-s8" x="743" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
