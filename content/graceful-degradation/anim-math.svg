    <text id="gm-s4" x="360" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
    <rect id="gm-d5" x="412" y="44" width="92" height="52" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="458" y="66" font-size="10" text-anchor="middle" fill="#23362e">recs</text>
    <text id="gm-s5" x="458" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
    <rect id="gm-d6" x="510" y="44" width="92" height="52" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
