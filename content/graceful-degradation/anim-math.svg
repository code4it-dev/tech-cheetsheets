    <text id="gm-s2" x="164" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
    <rect id="gm-d3" x="216" y="44" width="92" height="52" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="262" y="66" font-size="10" text-anchor="middle" fill="#23362e">stock</text>
    <text id="gm-s3" x="262" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
    <rect id="gm-d4" x="314" y="44" width="92" height="52" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
