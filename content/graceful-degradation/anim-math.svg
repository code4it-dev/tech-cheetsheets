  <text id="gm-eq" x="400" y="134" font-size="15" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">page availability = ?</text>
  <text id="gm-sub" x="400" y="158" font-size="11" text-anchor="middle" fill="#5f6f66">every call is awaited, every failure propagates</text>

  <rect id="gm-bar" x="120" y="180" width="560" height="34" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
