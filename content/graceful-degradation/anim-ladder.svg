<svg viewBox="0 0 800 320" role="img" aria-label="A product page rendering with progressively more fallbacks as dependencies fail">
  <text id="gl-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the same page, rendered as each dependency is taken away</text>

  <rect id="gl-page" x="20" y="40" width="330" height="236" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="185" y="62" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">what the customer sees</text>
  <g id="gl-l1"><rect x="36" y="74" width="298" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text id="gl-t1" x="46" y="92" font-size="10" fill="#23362e">Nikon Z6 III — product details</text></g>
  <g id="gl-l2"><rect x="36" y="106" width="298" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text id="gl-t2" x="46" y="124" font-size="10" fill="#23362e">£1,999 · live price</text></g>
  <g id="gl-l3"><rect x="36" y="138" width="298" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text id="gl-t3" x="46" y="156" font-size="10" fill="#23362e">In stock — 4 left at your store</text></g>
  <g id="gl-l4"><rect x="36" y="170" width="298" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text id="gl-t4" x="46" y="188" font-size="10" fill="#23362e">★★★★☆ 1,284 reviews</text></g>
  <g id="gl-l5"><rect x="36" y="202" width="298" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text id="gl-t5" x="46" y="220" font-size="10" fill="#23362e">Recommended for you — 6 items</text></g>
  <g id="gl-l6"><rect x="36" y="234" width="298" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text id="gl-t6" x="46" y="252" font-size="10" fill="#23362e">Add to basket</text></g>

  <rect id="gl-dep" x="370" y="40" width="410" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="575" y="62" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">dependencies</text>
  <text id="gl-d1" x="386" y="84" font-size="10.5" fill="#5f6f66">catalogue &mdash; healthy &nbsp;·&nbsp; critical</text>
  <text id="gl-d2" x="386" y="104" font-size="10.5" fill="#5f6f66">pricing &mdash; healthy &nbsp;·&nbsp; critical</text>
  <text id="gl-d3" x="386" y="124" font-size="10.5" fill="#5f6f66">stock &mdash; healthy &nbsp;·&nbsp; optional</text>
  <text id="gl-d4" x="386" y="144" font-size="10.5" fill="#5f6f66">reviews &mdash; healthy &nbsp;·&nbsp; optional</text>
  <text id="gl-d5" x="386" y="164" font-size="10.5" fill="#5f6f66">recommendations &mdash; healthy &nbsp;·&nbsp; optional</text>
  <text id="gl-d6" x="386" y="182" font-size="10.5" fill="#2f6b3f">all eight green</text>

  <rect id="gl-out" x="370" y="202" width="410" height="74" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="gl-o1" x="575" y="226" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">full experience</text>
  <text id="gl-o2" x="575" y="246" font-size="10.5" text-anchor="middle" fill="#5f6f66">can the customer still buy this camera?</text>
  <text id="gl-o3" x="575" y="266" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">yes</text>

  <text id="gl-hand" class="hand hidden" x="20" y="300" font-size="16" fill="#c53b3b">five of six panels gone, and the business still works</text>
</svg>
