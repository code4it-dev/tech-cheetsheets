<svg viewBox="0 0 560 210" role="img" aria-label="A control plane failing, breaking a service that fetches config per request while a service using cached config keeps working">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">the failure mode should be "nothing changes", not "nothing works"</text>
  <rect id="ss-cp" x="190" y="40" width="180" height="42" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="280" y="58" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">control plane</text>
  <text id="ss-cpt" x="280" y="74" font-size="10" text-anchor="middle" fill="#5f6f66">healthy</text>
  <rect id="ss-a" x="30" y="112" width="230" height="56" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="145" y="132" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">service A &mdash; fetches per request</text>
  <text id="ss-at" x="145" y="152" font-size="10.5" text-anchor="middle" fill="#5f6f66">serving normally</text>
  <rect id="ss-b" x="300" y="112" width="230" height="56" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="415" y="132" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">service B &mdash; uses cached config</text>
  <text id="ss-bt" x="415" y="152" font-size="10.5" text-anchor="middle" fill="#5f6f66">serving normally</text>
  <text id="ss-msg" x="280" y="194" font-size="11" text-anchor="middle" fill="#5f6f66">both healthy, and indistinguishable from each other</text>
</svg>
