<svg viewBox="0 0 800 352" role="img" aria-label="A page's dependencies split into critical and optional, with a fallback ladder and the availability arithmetic for each design">
  <defs>
    <marker id="gd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">classify every dependency once, and the availability arithmetic changes completely</text>

  <rect x="20" y="42" width="368" height="146" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="204" y="64" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">critical &mdash; without these there is no page</text>
  <rect x="36" y="76" width="166" height="40" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="119" y="94" font-size="11" text-anchor="middle" fill="#23362e">catalogue</text>
  <text x="119" y="109" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
  <rect x="212" y="76" width="166" height="40" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="295" y="94" font-size="11" text-anchor="middle" fill="#23362e">pricing</text>
  <text x="295" y="109" font-size="9.5" text-anchor="middle" fill="#5f6f66">99.9%</text>
  <text x="204" y="140" font-size="11" text-anchor="middle" fill="#5f6f66">hard-fail: show an honest error</text>
  <text x="204" y="162" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">0.999² = 99.80%</text>
  <text x="204" y="180" font-size="10" text-anchor="middle" fill="#5f6f66">the floor you actually have to engineer</text>

  <rect x="412" y="42" width="368" height="146" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="596" y="64" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">optional &mdash; nice, not necessary</text>
  <rect x="428" y="76" width="112" height="40" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="484" y="94" font-size="10" text-anchor="middle" fill="#23362e">reviews</text>
  <text x="484" y="109" font-size="9" text-anchor="middle" fill="#5f6f66">omit</text>
  <rect x="546" y="76" width="112" height="40" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="602" y="94" font-size="10" text-anchor="middle" fill="#23362e">stock level</text>
  <text x="602" y="109" font-size="9" text-anchor="middle" fill="#5f6f66">cached</text>
  <rect x="664" y="76" width="100" height="40" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="714" y="94" font-size="10" text-anchor="middle" fill="#23362e">recs</text>
  <text x="714" y="109" font-size="9" text-anchor="middle" fill="#5f6f66">static list</text>
  <text x="596" y="140" font-size="11" text-anchor="middle" fill="#5f6f66">fail soft: never block the render</text>
  <text x="596" y="162" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">contributes 100%</text>
  <text x="596" y="180" font-size="10" text-anchor="middle" fill="#5f6f66">because their failure is not the page's failure</text>

  <rect x="20" y="206" width="760" height="68" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="228" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">the fallback ladder &mdash; try each rung before giving up</text>
  <rect x="36" y="240" width="134" height="24" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="103" y="257" font-size="10" text-anchor="middle" fill="#23362e">1 · live answer</text>
  <text x="178" y="257" font-size="11" fill="#5f6f66">&rarr;</text>
  <rect x="192" y="240" width="134" height="24" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="259" y="257" font-size="10" text-anchor="middle" fill="#23362e">2 · fresh cache</text>
  <text x="334" y="257" font-size="11" fill="#5f6f66">&rarr;</text>
  <rect x="348" y="240" width="134" height="24" rx="4" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="415" y="257" font-size="10" text-anchor="middle" fill="#23362e">3 · stale cache</text>
  <text x="490" y="257" font-size="11" fill="#5f6f66">&rarr;</text>
  <rect x="504" y="240" width="134" height="24" rx="4" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="571" y="257" font-size="10" text-anchor="middle" fill="#23362e">4 · static default</text>
  <text x="646" y="257" font-size="11" fill="#5f6f66">&rarr;</text>
  <rect x="660" y="240" width="104" height="24" rx="4" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="712" y="257" font-size="10" text-anchor="middle" fill="#23362e">5 · omit it</text>

  <rect x="20" y="288" width="368" height="50" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="36" y="310" font-size="11.5" fill="#23362e" font-weight="700">all eight treated as critical</text>
  <text x="36" y="328" font-size="11" fill="#c53b3b" font-family="Fira Code, monospace">0.999⁸ = 99.20% &mdash; 70 h/year of self-inflicted downtime</text>

  <rect x="412" y="288" width="368" height="50" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="428" y="310" font-size="11.5" fill="#23362e" font-weight="700">two critical, six degradable</text>
  <text x="428" y="328" font-size="11" fill="#2f6b3f" font-family="Fira Code, monospace">0.999² = 99.80% &mdash; same services, four times better</text>
</svg>
