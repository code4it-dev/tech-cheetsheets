<svg viewBox="0 0 800 300" role="img" aria-label="A query retried safely over a flaky network, then a mixed command-query retried and applying its effect twice">
  <defs>
    <marker id="rt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <rect id="rt-cli" x="20" y="90" width="150" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="95" y="118" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text id="rt-clit" x="95" y="140" font-size="10.5" text-anchor="middle" fill="#5f6f66">retry policy: 3 attempts</text>
  <text id="rt-att" x="95" y="160" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">attempt 0</text>

  <rect id="rt-net" x="250" y="90" width="150" height="86" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="325" y="124" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">network</text>
  <text id="rt-nett" x="325" y="148" font-size="10.5" text-anchor="middle" fill="#5f6f66">fine</text>

  <rect id="rt-srv" x="480" y="64" width="240" height="138" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="600" y="90" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">account service</text>
  <text id="rt-bal" x="600" y="124" font-size="15" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">balance = 100</text>
  <text id="rt-log1" x="500" y="152" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rt-log2" x="500" y="172" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rt-log3" x="500" y="192" font-size="10.5" fill="#c53b3b" font-family="Fira Code, monospace">&nbsp;</text>

  <g id="rt-call">
    <rect x="20" y="34" width="250" height="30" rx="5" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
    <text id="rt-callt" x="30" y="54" font-size="11" fill="#23362e" font-family="Fira Code, monospace">GetBalance()</text>
  </g>

  <line x1="174" y1="133" x2="244" y2="133" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rt-arr)"/>
  <line x1="404" y1="133" x2="474" y2="133" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rt-arr)"/>

  <rect id="rt-verd" x="20" y="226" width="700" height="48" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="rt-v" x="370" y="248" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">a query can be retried, cached and reordered freely</text>
  <text id="rt-vs" x="370" y="266" font-size="11" text-anchor="middle" fill="#5f6f66">because calling it zero, one or five times leaves the same world behind</text>
</svg>
