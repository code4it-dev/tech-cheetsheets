<svg viewBox="0 0 800 320" role="img" aria-label="A class whose methods split into commands that return nothing and queries that return values, with a forbidden middle column of mixed methods">
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">every method falls on one side of the line &mdash; the middle is where the bugs live</text>

  <rect x="24" y="44" width="236" height="200" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="142" y="68" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">Commands</text>
  <text x="142" y="88" font-size="11" text-anchor="middle" fill="#5f6f66">change state · return void</text>
  <text x="40" y="118" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">void AddItem(sku, qty)</text>
  <text x="40" y="142" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">void Cancel(reason)</text>
  <text x="40" y="166" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">void Dequeue()</text>
  <text x="40" y="196" font-size="11" fill="#5f6f66">not safe to repeat</text>
  <text x="40" y="214" font-size="11" fill="#5f6f66">not safe to cache</text>
  <text x="40" y="232" font-size="11" fill="#5f6f66">order matters</text>

  <rect x="540" y="44" width="236" height="200" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="658" y="68" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">Queries</text>
  <text x="658" y="88" font-size="11" text-anchor="middle" fill="#5f6f66">return a value · change nothing</text>
  <text x="556" y="118" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">int ItemCount { get; }</text>
  <text x="556" y="142" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">Money Total()</text>
  <text x="556" y="166" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">Job? Peek()</text>
  <text x="556" y="196" font-size="11" fill="#5f6f66">safe to repeat and retry</text>
  <text x="556" y="214" font-size="11" fill="#5f6f66">safe to cache and memoize</text>
  <text x="556" y="232" font-size="11" fill="#5f6f66">safe in a log or a debugger</text>

  <rect x="286" y="60" width="228" height="168" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="400" y="84" font-size="13" text-anchor="middle" fill="#c53b3b" font-weight="700">the forbidden middle</text>
  <text x="400" y="104" font-size="11" text-anchor="middle" fill="#5f6f66">returns a value AND mutates</text>
  <text x="302" y="134" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">Job Pop()</text>
  <text x="302" y="156" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">int NextId()</text>
  <text x="302" y="178" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">bool TryAcquire()</text>
  <text x="302" y="206" font-size="11" fill="#c53b3b">looks like a read at the call site</text>

  <line x1="400" y1="236" x2="400" y2="262" stroke="#5f6f66" stroke-width="1.5"/>
  <rect x="196" y="266" width="408" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="400" y="291" font-size="11.5" text-anchor="middle" fill="#23362e">split it &mdash; or keep it deliberately, name it so, and document why</text>

  <text class="hand" x="30" y="296" font-size="16" fill="#c53b3b">a rule, not a law</text>
</svg>
