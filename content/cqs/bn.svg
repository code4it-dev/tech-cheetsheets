<svg viewBox="0 0 560 200" role="img" aria-label="A total method computing once, caching the result, and returning the same answer on the second call">
  <text x="280" y="26" font-size="11.5" text-anchor="middle" fill="#5f6f66">state changed inside &mdash; but not in a way anyone can observe</text>
  <rect id="bn-call" x="30" y="52" width="150" height="40" rx="5" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="bn-callt" x="105" y="77" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">Total()</text>
  <rect id="bn-calc" x="210" y="44" width="150" height="56" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="285" y="68" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">sum 40 lines</text>
  <text id="bn-calct" x="285" y="88" font-size="10.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <rect id="bn-cache" x="390" y="44" width="150" height="56" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="465" y="68" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">cache</text>
  <text id="bn-cachet" x="465" y="88" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">empty</text>
  <text id="bn-ans" x="280" y="140" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">answer: ?</text>
  <text id="bn-note" x="280" y="166" font-size="11.5" text-anchor="middle" fill="#5f6f66">same answer every time = still a query</text>
</svg>
