<svg viewBox="0 0 800 300" role="img" aria-label="A queue whose Pop method both returns and removes, causing a log statement to silently consume a job">
  <defs>
    <marker id="pp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one method, two responsibilities &mdash; and a call site that hides which one you got</text>

  <rect id="pq-box" x="470" y="44" width="300" height="166" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="620" y="66" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">work queue</text>
  <g id="pq-j1"><rect x="488" y="80" width="264" height="30" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="500" y="100" font-size="11" fill="#23362e" font-family="Fira Code, monospace">job-1 · invoice 1041</text></g>
  <g id="pq-j2"><rect x="488" y="118" width="264" height="30" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="500" y="138" font-size="11" fill="#23362e" font-family="Fira Code, monospace">job-2 · invoice 1042</text></g>
  <g id="pq-j3"><rect x="488" y="156" width="264" height="30" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="500" y="176" font-size="11" fill="#23362e" font-family="Fira Code, monospace">job-3 · invoice 1043</text></g>
  <text id="pq-depth" x="620" y="202" font-size="11" text-anchor="middle" fill="#5f6f66">3 jobs waiting</text>

  <rect id="pq-code" x="24" y="44" width="412" height="118" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="40" y="70" font-size="11.5" fill="#5f6f66">worker.cs</text>
  <text id="pq-c1" x="40" y="96" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">var job = queue.Pop();</text>
  <text id="pq-c2" x="40" y="120" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">Process(job);</text>
  <text id="pq-c3" x="40" y="144" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <line x1="440" y1="104" x2="464" y2="104" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#pp-arr)"/>

  <rect id="pq-out" x="24" y="186" width="412" height="88" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="40" y="210" font-size="11.5" fill="#5f6f66">result</text>
  <text id="pq-r1" x="40" y="236" font-size="11.5" fill="#23362e">processed: &mdash;</text>
  <text id="pq-r2" x="40" y="260" font-size="11.5" fill="#5f6f66">&nbsp;</text>

  <text id="pq-hand" class="hand hidden" x="470" y="246" font-size="16" fill="#c53b3b">the call site looked like a read. it wasn't.</text>
  <text id="pq-msg" x="620" y="272" font-size="11.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
</svg>
