<svg viewBox="0 0 800 342" role="img" aria-label="The A2A task state machine moving from submitted through working, pausing at input-required and auth-required, and ending in a terminal state">
  <defs>
    <marker id="al-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="al-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one task, followed from creation to a terminal state</text>

  <rect id="al-sub" x="16" y="50" width="140" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="86" y="68" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">SUBMITTED</text>
  <text id="al-subt" x="86" y="83" font-size="8.5" text-anchor="middle" fill="#5f6f66">accepted, queued</text>

  <rect id="al-work" x="200" y="50" width="140" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="270" y="68" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">WORKING</text>
  <text id="al-workt" x="270" y="83" font-size="8.5" text-anchor="middle" fill="#5f6f66">—</text>

  <rect id="al-done" x="620" y="50" width="164" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="702" y="68" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">COMPLETED</text>
  <text id="al-donet" x="702" y="83" font-size="8.5" text-anchor="middle" fill="#5f6f66">terminal · artifacts final</text>

  <rect id="al-input" x="200" y="110" width="160" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="280" y="128" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">INPUT_REQUIRED</text>
  <text id="al-inputt" x="280" y="143" font-size="8.5" text-anchor="middle" fill="#5f6f66">paused, waiting for you</text>

  <rect id="al-auth" x="396" y="110" width="160" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="476" y="128" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">AUTH_REQUIRED</text>
  <text id="al-autht" x="476" y="143" font-size="8.5" text-anchor="middle" fill="#5f6f66">needs credentials</text>

  <rect id="al-fail" x="620" y="110" width="164" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="702" y="128" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">FAILED · CANCELED</text>
  <text id="al-failt" x="702" y="143" font-size="8.5" text-anchor="middle" fill="#5f6f66">· REJECTED — terminal</text>

  <line x1="160" y1="70" x2="194" y2="70" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#al-arr)"/>
  <line x1="344" y1="70" x2="614" y2="70" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#al-arr)"/>
  <line x1="270" y1="94" x2="270" y2="106" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#al-arr)"/>
  <line x1="300" y1="106" x2="300" y2="94" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#al-arr)"/>
  <line x1="476" y1="106" x2="400" y2="94" stroke="#5f6f66" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#al-arr)"/>

  <rect id="al-log" x="16" y="176" width="768" height="120" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="al-lt" x="30" y="196" font-size="11" fill="#23362e" font-weight="700">the event stream your client sees</text>
  <text id="al-l1" x="30" y="216" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="al-l2" x="30" y="234" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="al-l3" x="30" y="252" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="al-l4" x="30" y="270" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="al-l5" x="30" y="288" font-size="8.5" fill="#5f6f66">&nbsp;</text>

  <rect id="al-verd" x="16" y="306" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="al-v" x="400" y="325" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">a task is a conversation with a state machine, not a request with a response</text>
</svg>
