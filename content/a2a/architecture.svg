<svg viewBox="0 0 800 356" role="img" aria-label="An A2A client agent discovering and delegating to a remote agent, which internally uses MCP to reach its own tools">
  <defs>
    <marker id="aa-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">two protocols, two directions &mdash; across to peers, down to tools</text>

  <rect x="16" y="40" width="240" height="196" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="136" y="62" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">your agent (A2A client)</text>
  <rect x="30" y="74" width="212" height="48" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="136" y="94" font-size="10" text-anchor="middle" fill="#23362e" font-weight="700">its own loop and model</text>
  <text x="136" y="112" font-size="9" text-anchor="middle" fill="#5f6f66">plans, delegates, assembles</text>
  <rect x="30" y="132" width="212" height="40" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="136" y="156" font-size="9.5" text-anchor="middle" fill="#23362e">MCP &rarr; its own tools</text>
  <rect x="30" y="182" width="212" height="42" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="136" y="200" font-size="9.5" text-anchor="middle" fill="#23362e">A2A &rarr; other agents</text>
  <text x="136" y="216" font-size="9" text-anchor="middle" fill="#5f6f66">peers, not tools</text>

  <text x="330" y="118" font-size="9.5" text-anchor="middle" fill="#5f6f66">1. GET the card</text>
  <text x="330" y="134" font-size="9.5" text-anchor="middle" fill="#5f6f66">2. SendMessage</text>
  <text x="330" y="150" font-size="9.5" text-anchor="middle" fill="#5f6f66">3. follow the task</text>
  <line x1="260" y1="160" x2="400" y2="160" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#aa-arr)"/>
  <line x1="400" y1="178" x2="260" y2="178" stroke="#5f6f66" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aa-arr)"/>
  <text x="330" y="196" font-size="9" text-anchor="middle" fill="#5f6f66">status + artifacts (SSE)</text>

  <rect x="404" y="40" width="240" height="196" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="524" y="62" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">remote agent (A2A server)</text>
  <text x="524" y="82" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">/.well-known/agent-card.json</text>
  <rect x="418" y="94" width="212" height="38" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="524" y="118" font-size="9.5" text-anchor="middle" fill="#23362e">skills · interfaces · security</text>
  <rect x="418" y="142" width="212" height="40" rx="5" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="524" y="160" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="700">its own model and loop</text>
  <text x="524" y="176" font-size="9" text-anchor="middle" fill="#c53b3b">opaque &mdash; you never see it</text>
  <rect x="418" y="192" width="212" height="32" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="524" y="212" font-size="9.5" text-anchor="middle" fill="#23362e">MCP &rarr; its own tools</text>

  <line x1="648" y1="208" x2="668" y2="208" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#aa-arr)"/>
  <rect x="672" y="152" width="112" height="84" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="728" y="180" font-size="9.5" text-anchor="middle" fill="#23362e">its databases,</text>
  <text x="728" y="198" font-size="9.5" text-anchor="middle" fill="#23362e">APIs, credentials</text>
  <text x="728" y="220" font-size="9" text-anchor="middle" fill="#c53b3b">none of it yours</text>

  <rect x="16" y="250" width="768" height="48" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="270" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">the unit of exchange is a Task, not a function call</text>
  <text x="400" y="288" font-size="10" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">taskId · contextId · state · history · artifacts</text>

  <text class="hand" x="400" y="332" fill="#c53b3b" font-size="16" text-anchor="middle">a tool returns a value. an agent returns a task that may take an hour and ask you questions.</text>
</svg>
