<svg viewBox="0 0 800 332" role="img" aria-label="A client agent fetching an agent card, sending a message, and receiving streamed status and artifact updates for a task">
  <defs>
    <marker id="ad-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="ad-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">a travel agent needs a visa assessment it cannot do itself</text>

  <rect id="ad-client" x="16" y="46" width="190" height="62" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="111" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">your agent</text>
  <text id="ad-clientt" x="111" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">A2A client</text>

  <rect id="ad-server" x="300" y="46" width="200" height="62" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="400" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">visa-advisor agent</text>
  <text id="ad-servert" x="400" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">another company, another stack</text>

  <rect id="ad-tools" x="600" y="46" width="184" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="692" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">its own tools</text>
  <text id="ad-toolst" x="692" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">via MCP, invisible to you</text>

  <line x1="210" y1="77" x2="294" y2="77" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ad-arr)"/>
  <line x1="504" y1="77" x2="594" y2="77" stroke="#5f6f66" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ad-arr)"/>

  <g id="ad-msg" class="hidden">
    <rect x="16" y="114" width="190" height="24" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
    <text id="ad-msgt" x="111" y="130" font-size="8.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  </g>

  <rect id="ad-wire" x="16" y="150" width="440" height="136" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ad-wt" x="30" y="170" font-size="11" fill="#23362e" font-weight="700">on the wire</text>
  <text id="ad-w1" x="30" y="190" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-w2" x="30" y="206" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-w3" x="30" y="222" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-w4" x="30" y="238" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-w5" x="30" y="254" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-w6" x="30" y="270" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-w7" x="30" y="284" font-size="8.5" fill="#5f6f66">&nbsp;</text>

  <rect id="ad-state" x="472" y="150" width="312" height="136" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ad-st" x="486" y="170" font-size="11" fill="#23362e" font-weight="700">what your agent now holds</text>
  <text id="ad-s1" x="486" y="192" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-s2" x="486" y="210" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-s3" x="486" y="228" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-s4" x="486" y="246" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="ad-s5" x="486" y="264" font-size="9" fill="#5f6f66">&nbsp;</text>
  <text id="ad-s6" x="486" y="280" font-size="9" fill="#5f6f66">&nbsp;</text>

  <rect id="ad-verd" x="16" y="296" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ad-v" x="400" y="315" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">you learn what it produced, never how it thought</text>
</svg>
