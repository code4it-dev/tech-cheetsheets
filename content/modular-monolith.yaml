title: Modular monolith
slug: modular-monolith
tagline: One deployable, with walls the compiler actually enforces.
asof: Nov 2026 · the pattern is stable; examples are .NET 10 (LTS), ASP.NET Core and EF Core
description: "Modular monolith cheatsheet: modules, public contracts and enforced boundaries, with animated walk-throughs of a layered monolith, an in-process call, in-process events and extracting a module into a service."
aliases: [ Modular monolith, modulith, modular monoliths ]
keywords:
  - architecture
  - modular monolith
  - monolith
  - microservices
  - bounded context
  - ddd
  - boundaries
  - dotnet
  - refactoring
related: [ backend-for-frontend, multitenancy ]
overview:
  - A layered monolith organises code by <em>technical</em> role — controllers, services, repositories — which means a business concept like "billing" is smeared across every layer and nothing stops one feature from reaching into another's data. Over a few years that becomes the big ball of mud everybody has worked in.
  - "Microservices fix the coupling by making boundaries physical: you cannot call another team's class because it is in another process. But you pay for that wall with network latency, partial failure, distributed transactions, a deployment pipeline per service, and an operational burden most teams are not staffed for."
  - A **modular monolith** takes the boundary discipline and leaves out the network. The system is split by <em>business capability</em> — Orders, Billing, Shipping — each module exposing a small public contract and hiding everything else, owning its own tables, and talking to its neighbours only through those contracts. It all compiles into one deployable and runs in one process, so a cross-module call is a method call. The boundary is enforced by the compiler and by architecture tests rather than by a firewall — and when a module genuinely needs to become a service, the contract is already there.
architecture:
  svg: modular-monolith/architecture.svg
  alt: One process containing three modules, each with a public contract, hidden internals and its own database schema
  caption: "Microservice boundaries with monolith mechanics: one process, one transaction, one deploy — and walls the build breaks on."
howItWorks:
  - md: The same three business areas appear in all four animations, so you can see exactly what changes. The first shows what you are escaping; the next two are the two ways modules talk; the last is the migration path that makes the whole pattern worth adopting.
  - note: the goal isn't fewer dependencies — it's dependencies you can see
  - anim:
      id: anim-ball
      title: "1 · Layered monolith: the same areas, no enforced walls"
      svg: modular-monolith/anim-ball.svg
      alt: Animated layered monolith where every class can reach into every other area's internals
      steps:
        - say: The same three business areas, in a system organised by layer. Every class is `public`, there is one `DbContext` mapping every table, and nothing stops any class from using any other.
          hl: [ bm-m1, bm-m2, bm-m3 ]
        - say: A deadline arrives. Orders needs an invoice number, and `LedgerRepo` is right there. One reference, saved an afternoon, approved in review.
          show: [ bm-a1 ]
          unhl: [ bm-m2, bm-m3 ]
          text:
            bm-state: "cross-area references: 1"
        - say: Billing needs the order total, so it reads `OrderRepo` directly rather than asking. Now the dependency goes both ways, and neither module can be understood alone.
          show: [ bm-a2 ]
          text:
            bm-state: "cross-area references: 2 (and now a cycle)"
        - say: Shipping and Billing do the same to each other over the next few sprints. Each step was individually reasonable.
          show: [ bm-a3, bm-a4 ]
          text:
            bm-state: "cross-area references: 4"
        - say: Then a report joins orders to shipments, and Orders reaches straight into Shipping. There are now five crossings and no document that says which are intentional.
          show: [ bm-a5 ]
          unhl: [ bm-m1 ]
          text:
            bm-state: "cross-area references: 5 · all legal, all invisible"
            bm-t2: same tables, no owner
        - say: The damage is not the arrows. It is that changing anything in Billing now means reading Orders and Shipping to find out who depended on the thing you changed — and the compiler will not tell you, because none of this is an error.
          hl: [ bm-i2 ]
          text:
            bm-cost: "cost of moving Billing out: read every call site, first find them"
        - say: "This is how a ball of mud is built: never by a decision, always by forty reasonable shortcuts. A modular monolith does not add new capabilities — it makes exactly these five arrows fail the build."
          show: [ bm-note ]
          unhl: [ bm-i2 ]
  - anim:
      id: anim-call
      title: "2 · Modular monolith: a call through the public contract"
      svg: modular-monolith/anim-call.svg
      alt: Animated in-process call from Orders to Billing through a public contract, with a direct call to internals blocked at compile time
      steps:
        - say: The same two areas, now as real modules. Orders has to charge a card, which is Billing’s job — so it needs something from Billing.
          hl: [ mc-m1 ]
          text:
            mc-t1b: "needs: charge a card"
        - say: "What it references is the **contracts project**: an interface and two records, with no implementation in it at all. That is the only thing Billing makes public."
          hl: [ mc-m3 ]
          unhl: [ mc-m1 ]
        - say: The call itself is an ordinary method call through `IBillingApi`. Same thread, same stack, same transaction — roughly 50 nanoseconds, and a stack trace you can actually read.
          show: [ mc-ok ]
          hl: [ mc-c2 ]
          unhl: [ mc-m3 ]
          text:
            mc-state: "call cost: ~50 ns · same transaction · cannot fail"
            mc-t1b: awaiting ChargeAsync
        - say: "Inside Billing the implementation runs and touches only the `billing` schema. Orders could not read those tables even if it wanted to: its `DbContext` does not map them."
          hl: [ mc-i2 ]
          unhl: [ mc-c2 ]
          text:
            mc-t2: BillingService.ChargeAsync
            mc-t2b: writes billing.invoices only
        - say: Now the shortcut from animation 1. A developer in a hurry tries to construct `BillingService` directly, skipping the interface.
          show: [ mc-bad, mc-badt ]
          hl: [ mc-m1 ]
          unhl: [ mc-i2 ]
        - say: It does not compile. `BillingService` is `internal`, so outside its own assembly the type does not exist. This is the difference between the two architectures, and it costs one keyword.
          text:
            mc-state: "error CS0122: 'BillingService' is inaccessible due to its protection level"
        - say: "The second line of defence catches what the compiler cannot: an architecture test asserting that Orders has no dependency on the `Billing` assembly at all, so nobody can \"fix\" this by adding a project reference."
          hide: [ mc-bad, mc-badt ]
          unhl: [ mc-m1 ]
          text:
            mc-state: "architecture test: Orders -> Billing implementation = FAIL the build"
        - say: "So you get a microservice-grade boundary with method-call mechanics: no serialization, no network, no partial failure, no saga — and a wall that is checked on every single build."
          show: [ mc-note ]
          hl: [ mc-c1, mc-c2 ]
          text:
            mc-t1b: "result: Charged"
  - anim:
      id: anim-event
      title: "3 · Modular monolith: an in-process event"
      svg: modular-monolith/anim-event.svg
      alt: Animated in-process event where Orders publishes OrderPlaced and Billing and Shipping handle it
      steps:
        - say: Sometimes a direct call is the wrong shape. When an order is placed, several modules care — and the list will grow. Orders should not have to know about all of them.
          hl: [ me-m1 ]
        - say: "So Orders publishes a **fact**: `OrderPlaced`. Note what it references to do this — nothing. Not Billing, not Shipping, not their contracts."
          hl: [ me-bus ]
          unhl: [ me-m1 ]
          text:
            me-evt: OrderPlaced(42, 99.00)
            me-t1: published, moved on
            me-t1b: "references: none"
        - say: "The bus dispatches to whoever registered a handler. These are ordinary objects in the same process: no serialization, no broker, no network."
          hl: [ me-m2, me-m3 ]
          unhl: [ me-bus ]
          text:
            me-t2: ChargeOnOrderPlaced
            me-t3: BookCourierOnOrderPlaced
            me-mode: "dispatch: synchronous"
        - say: "With **synchronous** dispatch the handlers run inside the publisher’s transaction. That is a real advantage: if charging the card fails, the order is rolled back too, with no saga and no compensation code."
          text:
            me-tx: "transaction: one, shared"
            me-risk: "failure of a handler: the order rolls back too"
        - say: But it cuts both ways. If the courier API is slow, the customer waits for it. And if a non-essential handler throws, it destroys an order that was otherwise perfectly valid.
          text:
            me-t3: courier API timed out
            me-risk: "failure of a handler: a timeout just lost a good order"
          fill:
            me-m3: "#f9e3df"
        - say: "So switch that one to **deferred** dispatch: the event is written to an outbox inside the same transaction and dispatched after it commits. The order survives; the courier booking is retried."
          text:
            me-mode: "dispatch: after commit"
            me-tx: "transaction: order + outbox row"
            me-risk: "failure of a handler: retried, order unaffected"
            me-t3: retrying, attempt 2
          fill:
            me-m3: "#eef1e8"
        - say: "And now you own the thing a monolith usually spares you: **eventual consistency**. For a moment the order exists and the shipment does not, handlers may run twice, so they must be idempotent."
          text:
            me-t3b: must be idempotent
            me-t2b: stays synchronous — must not be lost
        - say: "The rule that falls out: choose per interaction, not per architecture. Something that must not be lost and must not fail independently stays a synchronous call or a synchronous handler. Something retryable — email, analytics, search indexing — goes through the outbox."
          show: [ me-note ]
          unhl: [ me-m2, me-m3 ]
  - anim:
      id: anim-extract
      title: 4 · Extracting a module into a service
      svg: modular-monolith/anim-extract.svg
      alt: Animated extraction of the Billing module into a separate service behind the same interface
      steps:
        - say: "Six months on, Billing has a problem the others do not: end-of-month runs peg four cores for an hour, and the payments team wants to release without waiting for the monolith’s train."
          hl: [ mx-m2 ]
          text:
            mx-t2b: "schema: billing · CPU-bound at month end"
        - say: "The groundwork is already done: Orders talks to it through `IBillingApi` and has never touched its internals. The seam exists, because you built it in animation 2."
          hl: [ mx-link ]
          unhl: [ mx-m2 ]
        - say: "Step one: write a **second implementation** of the same interface, this time over HTTP. Nothing in Orders changes, because nothing in Orders ever knew which implementation it had."
          unhl: [ mx-link ]
          text:
            mx-reg: "new: internal sealed class HttpBillingApi : IBillingApi"
        - say: "Step two: move the data. The `billing` schema becomes its own database — which is only possible because no other module was ever allowed to query those tables."
          show: [ mx-remote ]
          text:
            mx-rt2: its own database
            mx-t2b: schema moved out
        - say: "Step three: change **one line** in the composition root. That is the entire code change on the calling side."
          show: [ mx-http, mx-http-t ]
          hide: [ mx-link ]
          text:
            mx-reg: "composition root: AddHttpClient<IBillingApi, HttpBillingApi>();"
            mx-m2-h: Billing — moved out
            mx-t2: (now remote)
        - say: "What you bought: Billing scales and deploys on its own schedule, with its own database and its own team."
          text:
            mx-proc-t: the monolith process — now without Billing
            mx-rt3: deploys independently
            mx-cost: "gained: independent scale + deploy"
        - say: "What you now pay, every single call: about 2 milliseconds instead of 50 nanoseconds, a call that can time out or fail, at-least-once delivery, and no shared transaction — so charging a card and saving an order needs a saga with compensation."
          text:
            mx-cost: "call: ~2 ms · can fail · no shared transaction → saga needed"
            mx-t1b: now needs retries + idempotency
          fill:
            mx-remote: "#fbf3c4"
        - say: That bill is unavoidable for a distributed system. The point of the modular monolith is that you **defer** it until you have a reason, and then pay it for one module instead of twelve — and the eleven others keep their transactions, their stack traces and their single deploy.
          show: [ mx-note ]
          text:
            mx-t1b: code unchanged
          fill:
            mx-remote: "#e3eedc"
  - heading: Comparing them
    id: compare-architectures
  - md: The three options are not a scale from bad to good. They are three different places to put the same wall, with different bills attached.
  - table:
      columns: [ "", Layered monolith, Modular monolith, Microservices ]
      rows:
        - cells: [ "**Deployment units**", "1", "1", one per service ]
        - cells:
            - "**Boundary enforced by**"
            - convention and code review
            - "**the compiler** and architecture tests"
            - the network
        - cells:
            - "**Cross-boundary call**"
            - method call, ~50 ns
            - method call, ~50 ns
            - HTTP or queue, 1–20 ms
        - cells:
            - "**Transaction across boundaries**"
            - yes
            - yes
            - no — saga and compensation
        - cells:
            - "**A boundary violation is**"
            - a comment on a pull request
            - a build failure
            - impossible
        - cells:
            - "**Partial failure**"
            - does not exist
            - does not exist
            - the normal case, and yours to handle
        - cells:
            - "**Scaling a hot area**"
            - scale the whole thing
            - scale the whole thing
            - scale just that service
        - cells:
            - "**Moving a boundary**"
            - very hard — it is everywhere
            - "**cheap** — a compile and a rename"
            - expensive — a data migration and a contract change
        - cells: [ "**Teams it supports**", 1–2, roughly 2–10, 10 and up ]
        - self: true
          cells:
            - "**Operational cost**"
            - low
            - low
            - "high: pipelines, tracing, service discovery, on-call"
  - md: |-
      What the table is really saying:

      - **The modular monolith shares a column with the layered one and a column with microservices.** It takes the mechanics of the first (one deploy, one transaction, no partial failure) and the discipline of the second (owned data, explicit contracts). That is the whole trick, and it is why it is a sensible default rather than a compromise.
      - **The row that matters most is "moving a boundary".** Early on you will get the boundaries wrong — everybody does. In a modular monolith that costs a refactor; in microservices it costs a migration and a coordinated release across two teams. Adopt the architecture whose mistakes are cheap.
      - **Microservices buy independent scaling and independent deployment.** If you do not currently need either, you are paying the whole bill for none of the goods — and animation 4 shows you can buy them later, one module at a time.
concepts:
  - term: module
    short: A business capability with its own code, its own data and a small public surface. The unit everything else on this page is about.
    see: [ public contract, internals, module-owned schema, bounded context ]
    detail: |-
      A module is named after something the business would recognise — Orders, Billing, Shipping, Catalogue — never after a technical layer. If you cannot explain a module to someone in sales, it is probably a layer in disguise.

      #### What a healthy module owns

      | Owns | Does not own |
      | --- | --- |
      | its own tables, in its own schema | another module's tables, even for a read |
      | its domain model and rules | the HTTP shape other modules expose |
      | its public contract | the implementation behind someone else's contract |
      | its own tests, runnable alone | shared test fixtures that span modules |

      #### Common sizes

      | System | Modules |
      | --- | --- |
      | Early product, one team | 3–6 |
      | Established SaaS | 8–15 |
      | Large platform | 20–40, often grouped |

      If a module has one class it is not a module, it is a file. If it has four hundred, it is a monolith with a folder.
  - term: public contract
    short: The interface and DTOs a module exposes, usually in a project of their own that contains no implementation. The only legal way in.
    see: [ module, internals, boundary enforcement, extraction path ]
    detail: |-
      Keeping contracts in a separate assembly is what lets other modules reference the <em>shape</em> without being able to reference the <em>code</em>.

      ```csharp
      // Billing.Contracts  (referenced by anyone)
      public interface IBillingApi
      {
          Task<ChargeResult> ChargeAsync(ChargeRequest request, CancellationToken ct);
      }
      public sealed record ChargeRequest(Guid OrderId, decimal Amount, string Currency);
      public sealed record ChargeResult(bool Succeeded, string? TransactionId, string? Reason);

      // Billing  (referenced by nobody but the composition root)
      internal sealed class BillingService : IBillingApi { /* ... */ }
      ```

      | Rule | Why |
      | --- | --- |
      | Contracts reference nothing but primitives and each other | otherwise the dependency leaks through the contract |
      | Use records or DTOs, never your domain entities | an exposed entity makes your internal model a public API |
      | Keep the surface small — a handful of methods | a 40-method contract is the internals with extra steps |
      | Version it like a public API once a module is extracted | at that point it genuinely is one |

      A good test: could you implement this contract a second time, over HTTP, without changing the caller? If not, it is leaking implementation. Animation 4 depends on the answer being yes.
  - term: internals
    short: "Everything behind the contract: services, repositories, entities, mappers. Marked `internal` so other modules physically cannot reference them."
    see: [ public contract, boundary enforcement, module ]
    detail: |-
      In .NET, `internal` is scoped to the assembly, so "one module = one project" is what makes the keyword do real work. This is the cheapest boundary enforcement available: it costs nothing and the compiler never forgets.

      | Visibility | Use for |
      | --- | --- |
      | `public` | only what lives in the contracts project |
      | `internal` | everything else in the module — make this the default |
      | `internal` + `InternalsVisibleTo` | the module's own test project, and nothing else |

      ```markup
      <!-- Billing.csproj -->
      <ItemGroup>
        <InternalsVisibleTo Include="Billing.Tests" />
      </ItemGroup>
      ```

      Watch for the quiet leak: a `public` class added "just for a test" or "just for the controller". Once one exists, the next one is easier. Making `internal` the habit, and the test project the only exception, keeps it honest.
  - term: boundary enforcement
    short: Making a violation fail the build rather than depend on someone noticing it in review. Without this, a modular monolith decays into a layered one.
    see: [ internals, public contract, cyclic dependencies ]
    detail: |-
      Three layers of enforcement, cheapest first. Use all three; they catch different things.

      | Mechanism | Catches | Cost |
      | --- | --- | --- |
      | `internal` + one project per module | any reference to another module's implementation | free |
      | Project reference discipline | a module referencing another module's project at all | free, but needs review |
      | Architecture tests | everything else: namespaces, cycles, layering, naming | a test project |

      ```csharp
      [Fact]
      public void Modules_talk_only_through_contracts()
      {
          var result = Types.InAssembly(typeof(OrderService).Assembly)
              .Should().NotHaveDependencyOn("Billing")      // the implementation
              .GetResult();

          Assert.True(result.IsSuccessful, string.Join(", ", result.FailingTypeNames ?? []));
      }
      ```

      NetArchTest and ArchUnitNET are the usual choices in .NET; ArchUnit in Java; import-linter in Python. Write the first rule on day one, when there is nothing to fix. Retrofitting enforcement onto a year-old codebase means a hundred failures and a decision to disable the test.
  - term: module-owned schema
    short: Each module owns its tables and nobody else reads them directly. The database is where modular monoliths most often leak.
    see: [ module, transaction boundary, extraction path ]
    detail: |-
      Code boundaries are easy to enforce and easy to bypass through the database. If Orders runs `SELECT * FROM billing.invoices`, the modules are coupled no matter how clean the C# looks.

      | Level | How | Strength |
      | --- | --- | --- |
      | Naming convention | table prefixes, `orders_*` | weak — nothing enforces it |
      | Schema per module | `orders.`, `billing.` | good, and it survives extraction |
      | Schema + per-module database user | grants only on its own schema | **strong** — the database refuses the query |
      | Database per module | separate connection strings | strongest, and you lose cross-module transactions |

      ```csharp
      // one DbContext per module, each mapping only its own tables
      protected override void OnModelCreating(ModelBuilder b)
          => b.HasDefaultSchema("billing");
      ```

      Foreign keys across modules are the subtle version of the same leak. Prefer storing the other module's id as a plain value with no database-level constraint — it is the only shape that survives the module becoming a service.
  - term: in-process messaging
    short: Publishing an event instead of calling an interface. Removes the compile-time reference, at the cost of making the flow harder to follow.
    see: [ transaction boundary, public contract, module ]
    detail: |-
      With a direct call, Orders names Billing. With an event, Orders names only the fact that something happened, and the bus decides who cares.

      ```csharp
      // Orders, knowing nothing about who listens
      await _bus.PublishAsync(new OrderPlaced(order.Id, order.Total, order.Currency), ct);

      // Billing, in its own module
      internal sealed class ChargeOnOrderPlaced : INotificationHandler<OrderPlaced>
      {
          public Task Handle(OrderPlaced e, CancellationToken ct) => _billing.ChargeAsync(...);
      }
      ```

      | Use a direct call when | Use an event when |
      | --- | --- |
      | you need the result to continue | you do not care about the outcome |
      | there is exactly one correct handler | several modules react, and the list will grow |
      | the step must be inside the transaction | the step can be retried later |
      | you want a readable stack trace | you want the publisher not to know the subscribers |

      Events are not automatically better. A codebase where every interaction is an event has traded named dependencies for invisible ones, and "what happens when an order is placed?" becomes a search problem. Reach for a contract first and an event when there is genuinely more than one interested party.
  - term: transaction boundary
    short: "The thing a modular monolith still has and microservices do not: several modules writing inside one database transaction."
    see: [ in-process messaging, module-owned schema, extraction path ]
    detail: |-
      This is the single largest practical advantage of staying in one process, and the thing people miss most after splitting.

      | Dispatch | Transaction | On handler failure |
      | --- | --- | --- |
      | Direct call | shared with the caller | everything rolls back |
      | Synchronous event | shared with the publisher | everything rolls back, including the order |
      | Event after commit | separate | the order stands, the handler must be retried |
      | Outbox, then dispatch | the write is in the transaction, the work is not | at-least-once delivery, so handlers must be idempotent |

      Decide this per interaction, not globally. "Reserve stock" probably belongs inside the order's transaction; "send a confirmation email" certainly does not, and putting it there means a mail outage rolls back orders.

      The outbox is worth building early even inside a monolith: it is the only option that is both atomic with your write and safe to retry, and it is exactly what you will need on the day a module leaves the process.
  - term: bounded context
    short: "The DDD idea underneath: a boundary within which a word means exactly one thing. Modules work when they follow these seams."
    see: [ module, anti-corruption layer, shared kernel ]
    detail: |-
      "Customer" means different things in different places, and a design that forces one shared definition produces a model that serves nobody.

      | Context | What "customer" means |
      | --- | --- |
      | Orders | a delivery address and a basket |
      | Billing | a payment method and a tax status |
      | Support | a contact history and an entitlement |
      | Marketing | a consent record and a segment |

      Each module keeps its own small model of the customer, keyed by a shared id. That duplication looks wasteful and is not: it is what lets Billing add a tax field without a conversation with four other teams.

      Finding the seams: look at where the <em>language</em> changes, where different people are accountable, and where change tends to arrive together. Do not look at the entity-relationship diagram — it will tell you everything is connected, because it is.
  - term: vertical slice
    short: Organising a module's code by feature — request, handler, validation, data access together — rather than by technical layer.
    see: [ module, composition root ]
    detail: |-
      Layers inside a module recreate the original problem at a smaller scale. A vertical slice keeps everything one feature needs in one folder.

      ```
      Billing/
        Features/
          ChargeCard/
            ChargeCardCommand.cs      // request
            ChargeCardHandler.cs      // the whole use case
            ChargeCardValidator.cs
          RefundCharge/
            ...
        Contracts/   -> the public surface
        Persistence/ -> the DbContext, shared by the slices
      ```

      | By layer | By feature |
      | --- | --- |
      | a change touches 4 folders | a change touches 1 |
      | abstractions shared by everything | abstractions only where there is a second caller |
      | easy to find "all repositories" | easy to find "everything about refunds" |

      You rarely need to see all the repositories at once. You constantly need to see everything about refunds.
  - term: composition root
    short: The single place that knows every module's implementation and wires it up. The only code allowed to reference everything.
    see: [ public contract, extraction path, module ]
    detail: |-
      Each module exposes one registration method; the host calls them and knows nothing else. This is what keeps the host thin and makes animation 4 a one-line change.

      ```csharp
      // Billing/ModuleRegistration.cs  — the module's only public class besides its contract
      public static class BillingModule
      {
          public static IServiceCollection AddBilling(this IServiceCollection services, IConfiguration cfg)
          {
              services.AddScoped<IBillingApi, BillingService>();          // internal type, registered here
              services.AddDbContext<BillingDbContext>(o => o.UseNpgsql(cfg.GetConnectionString("Default")));
              return services;
          }
      }

      // Program.cs — the composition root
      builder.Services.AddOrders(cfg).AddBilling(cfg).AddShipping(cfg);
      ```

      The host project is the one place with a reference to every module, which is fine — it contains no logic. Your architecture test should assert exactly that: the host may depend on everything, and nothing may depend on the host.
  - term: shared kernel
    short: "The small set of types genuinely common to every module: ids, money, dates, result types. Useful, and the most abused project in the solution."
    see: [ bounded context, anti-corruption layer, cyclic dependencies ]
    detail: |-
      Every solution grows a `Common` or `Shared` project, and it is where modularity goes to die — because everything references it, anything inside it couples every module together.

      | Belongs in the shared kernel | Does not |
      | --- | --- |
      | `Money`, `TenantId`, `Result<T>` | `Customer`, `Order`, `Invoice` |
      | a clock abstraction | a repository base class |
      | cross-cutting attributes | business rules of any kind |
      | strongly-typed id primitives | "helpers" nobody can describe |

      Rule of thumb: if adding a field to a shared type would make you think about more than one module, it does not belong there. Keep it small enough that you could read the whole project in ten minutes, and add an architecture test asserting it depends on nothing.
  - term: anti-corruption layer
    short: A translation layer at a module's edge so another context's model — or a legacy system's — does not leak into yours.
    see: [ bounded context, public contract, shared kernel ]
    detail: |-
      When a module must consume something it does not control, translate at the boundary rather than letting the foreign shape spread inward.

      ```csharp
      // inside Shipping: the legacy courier's model stops here
      internal sealed class CourierAntiCorruption(ILegacyCourierClient legacy) : ICourierGateway
      {
          public async Task<Shipment> BookAsync(ShipmentRequest r, CancellationToken ct)
          {
              var raw = await legacy.CreateConsignmentAsync(ToLegacyDto(r), ct);
              return new Shipment(raw.ConsignmentNo, ParseStatus(raw.Stat), raw.Eta ?? DateOnly.MaxValue);
          }
      }
      ```

      | Put one in front of | Because |
      | --- | --- |
      | a legacy system you are strangling | its model is the thing you are trying to escape |
      | a third-party API | their breaking change should touch one file |
      | another module whose model is a poor fit | translation is cheaper than a shared compromise model |

      The cost is real — a mapping layer nobody enjoys writing. The benefit is that a change in the foreign model produces one compile error in one class instead of forty across the module.
  - term: extraction path
    short: Turning a module into a service by implementing its existing contract remotely. The reason to build a modular monolith even if you believe you will end up distributed.
    see:
      - public contract
      - composition root
      - module-owned schema
      - transaction boundary
    detail: |-
      If the module is genuinely encapsulated, extraction is mechanical rather than archaeological.

      1. Write a second implementation of the contract that calls the remote service.
      2. Move the module's data to its own database; remove any cross-schema queries that have crept in.
      3. Replace the in-process registration with the remote one — one line in the composition root.
      4. Deal with the consequences: timeouts, retries, idempotency, and the transaction you no longer have.

      ```csharp
      // before
      services.AddScoped<IBillingApi, BillingService>();
      // after
      services.AddHttpClient<IBillingApi, HttpBillingApi>(c => c.BaseAddress = new(cfg["Billing:Url"]!));
      ```

      | Step 4 is the hard one | What it costs |
      | --- | --- |
      | the call can now fail or hang | timeouts, retries, a circuit breaker |
      | at-least-once delivery | idempotency keys on every write |
      | no shared transaction | a saga with compensation |

      Note what you are really doing: deferring that bill until you have evidence you need to pay it. Extract when a module has a genuinely different scaling profile, a different release cadence, or a team that needs to ship without you — not because the module count got large.
  - term: cyclic dependencies
    short: Orders needs Billing and Billing needs Orders. The most common sign that two modules are really one, or that one is missing.
    see: [ boundary enforcement, in-process messaging, bounded context ]
    detail: |-
      Project references make cycles impossible to compile in .NET, which is a feature: the compiler refuses before you can create the mess. The question is what to do when you hit one.

      | Fix | When it is right |
      | --- | --- |
      | Invert one direction with an event | the reverse call is a notification, not a question |
      | Move the shared concept into a third module | both really depend on a concept neither owns |
      | Merge the two modules | they change together every single time — the boundary was wrong |
      | Pass data in rather than calling back | the callee only needed a value, not a dependency |

      The one fix to avoid is a shared "Common" project that both reference, holding the logic neither wanted to own. That turns a visible cycle into an invisible one.

      A cycle is information. It is telling you the seam is in the wrong place, and in a modular monolith that is cheap to act on.
  - term: testing per module
    short: Each module gets its own test project that exercises it through its contract, with no other module loaded.
    see: [ public contract, boundary enforcement, module ]
    detail: |-
      If a module's tests need three other modules running, the boundary is decorative. Testability is the most honest measure of modularity you have.

      | Level | Scope | Typical count |
      | --- | --- | --- |
      | Unit | a handler or domain rule, no I/O | hundreds per module |
      | Module integration | the module through its contract, real database | tens per module |
      | Architecture | boundaries, cycles, visibility | a handful, solution-wide |
      | End to end | the whole host, a few critical journeys | as few as you can live with |

      Module integration tests are the sweet spot here and the thing microservices make expensive: a real database with Testcontainers, the module's own registration method, and the contract as the entry point. No HTTP, no other module, no mocking your own code.
  - term: observability per module
    short: Tagging logs, traces and metrics with the module that produced them, so you can answer "which part is slow" without process boundaries to separate them.
    see: [ module, extraction path ]
    detail: |-
      In microservices the service name does this for free. In a monolith you have to add it on purpose, and it is what tells you which module is worth extracting.

      ```csharp
      // one meter and one activity source per module
      static readonly ActivitySource Activity = new("Shop.Billing");
      static readonly Meter Meter = new("Shop.Billing");

      using var span = Activity.StartActivity("ChargeCard");
      span?.SetTag("module", "billing");
      ```

      | Tag everything with | So you can ask |
      | --- | --- |
      | `module` | which module owns this error budget |
      | `module` + endpoint | which module dominates p99 (see the percentiles page) |
      | `module` on database spans | which module is hammering the database |

      Do this early. When someone proposes extracting a module, the honest answer comes from this data — and without it the decision gets made on architecture diagrams and enthusiasm instead.
commands:
  heading: Code & structure
  tocLabel: Code & structure
  groups:
    - group: Solution layout
      items:
        - code: |-
            src/
              Shop.Host/                 // composition root: references every module, contains no logic
              Shop.SharedKernel/         // Money, TenantId, Result<T> — tiny, depends on nothing
              Modules/
                Orders/
                  Orders.Contracts/      // IOrdersApi + DTOs. Referenced by other modules.
                  Orders/                // everything internal. Referenced only by the host.
                  Orders.Tests/
                Billing/
                  Billing.Contracts/
                  Billing/
                  Billing.Tests/
            tests/
              Shop.ArchitectureTests/    // the rules that keep the above true
          what: Two projects per module plus tests. The split between `.Contracts` and the implementation is what makes `internal` meaningful.
        - code: |-
            # setup.cfg — import-linter, run in CI exactly like the C# architecture tests
            [importlinter]
            root_package = shop

            [importlinter:contract:boundaries]
            name = Modules talk only through contracts
            type = forbidden
            source_modules =
                shop.orders
                shop.shipping
            forbidden_modules =
                shop.billing.internal

            # $ lint-imports    ->  non-zero exit the moment someone reaches inside a module
          what: The Python equivalent of an architecture test. Without one, the boundary is a comment, and it will be crossed.
        - lang: python
          code: |-
            # shop/billing/contracts.py — the module's only public surface
            @dataclass(frozen=True)
            class InvoiceDto:
                id: UUID
                total: Decimal

            class Billing(Protocol):              # structural: no inheritance, no import of internals
                async def issue_invoice(self, order_id: UUID) -> InvoiceDto: ...

            # everything under shop/billing/internal/ is private — enforced by the contract below
          what: Python has no `internal` keyword, so the boundary is a package convention plus a `Protocol` — and a test that enforces it.
        - lang: bash
          code: |-
            dotnet new classlib -o src/Modules/Billing/Billing.Contracts
            dotnet new classlib -o src/Modules/Billing/Billing
            dotnet add src/Modules/Billing/Billing reference src/Modules/Billing/Billing.Contracts
            dotnet add src/Modules/Orders/Orders reference src/Modules/Billing/Billing.Contracts
          what: Orders references Billing's <em>contracts</em> only. It must never reference `Billing` itself.
        - lang: markup
          code: |-
            <!-- Directory.Build.props — make internal the default habit -->
            <PropertyGroup>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
              <EnforceCodeStyleInBuild>true</EnforceCodeStyleInBuild>
            </PropertyGroup>
          what: Boundary rules are worth nothing if the build is already full of warnings nobody reads.
    - group: The boundary, in code
      items:
        - lang: csharp
          code: |-
            // Billing.Contracts — public
            public interface IBillingApi
            {
                Task<ChargeResult> ChargeAsync(ChargeRequest request, CancellationToken ct);
            }

            // Billing — internal, invisible to every other module
            internal sealed class BillingService(BillingDbContext db, ILogger<BillingService> log) : IBillingApi
            {
                public async Task<ChargeResult> ChargeAsync(ChargeRequest r, CancellationToken ct) { /* ... */ }
            }
          what: The only type anyone outside Billing can name is the interface.
        - lang: csharp
          code: |-
            public static class BillingModule
            {
                public static IServiceCollection AddBilling(this IServiceCollection s, IConfiguration cfg)
                {
                    s.AddScoped<IBillingApi, BillingService>();
                    s.AddDbContext<BillingDbContext>(o => o.UseNpgsql(cfg.GetConnectionString("Default")));
                    return s;
                }
            }
          what: One registration method per module. The host calls it and learns nothing else about Billing.
        - lang: csharp
          code: |-
            builder.Services
                .AddOrders(builder.Configuration)
                .AddBilling(builder.Configuration)
                .AddShipping(builder.Configuration);
          what: The entire composition root. Swapping a module for a remote implementation is a change on one of these lines.
        - lang: csharp
          code: |-
            protected override void OnModelCreating(ModelBuilder b)
            {
                b.HasDefaultSchema("billing");
                b.ApplyConfigurationsFromAssembly(typeof(BillingDbContext).Assembly);
            }
          what: One `DbContext` per module, each confined to its own schema. No module maps another's tables.
    - group: Architecture tests — the rules that keep it true
      items:
        - lang: bash
          code: dotnet add tests/Shop.ArchitectureTests package NetArchTest.Rules
          what: NetArchTest or ArchUnitNET. Add this on day one, while there is nothing to fix.
        - lang: csharp
          code: |-
            [Fact]
            public void Orders_does_not_depend_on_Billing_internals()
            {
                var result = Types.InAssembly(typeof(OrderService).Assembly)
                    .Should().NotHaveDependencyOn("Shop.Modules.Billing")
                    .GetResult();
                Assert.True(result.IsSuccessful, string.Join(", ", result.FailingTypeNames ?? []));
            }
          what: The rule that makes the whole pattern real. Everything else is a convention.
        - lang: csharp
          code: |-
            [Fact]
            public void Nothing_depends_on_the_host() =>
                Assert.True(Types.InAssemblies(ModuleAssemblies)
                    .Should().NotHaveDependencyOn("Shop.Host").GetResult().IsSuccessful);
          what: The host may know everything; nothing may know the host.
        - lang: csharp
          code: |-
            [Fact]
            public void Module_types_are_internal() =>
                Assert.Empty(Types.InAssembly(typeof(BillingService).Assembly)
                    .That().ArePublic().And().DoNotHaveName(nameof(BillingModule))
                    .GetTypes());
          what: Catches the `public` that someone added "just for a test".
    - group: Events, when a contract is the wrong shape
      items:
        - lang: csharp
          code: |-
            // Orders publishes a fact and names nobody
            await _publisher.Publish(new OrderPlaced(order.Id, order.Total), ct);

            // Billing subscribes, in its own module
            internal sealed class ChargeOnOrderPlaced(IBillingApi billing) : INotificationHandler<OrderPlaced>
            {
                public Task Handle(OrderPlaced e, CancellationToken ct) => billing.ChargeAsync(new(e.OrderId, e.Total, "EUR"), ct);
            }
          what: In-process dispatch, no serialization, no broker. The event type lives in the publisher's contracts project.
        - lang: csharp
          code: |-
            // outbox: atomic with the write, dispatched after commit
            db.Outbox.Add(new OutboxMessage(typeof(OrderPlaced).FullName!, JsonSerializer.Serialize(evt)));
            await db.SaveChangesAsync(ct);    // order + event committed together
          what: The only pattern that is both atomic with your write and safe to retry — and exactly what you need when the module leaves the process.
prosCons:
  good:
    heading: Pros
    items:
      - One build, one deploy, one log stream, one debugger — a new developer is productive in a day.
      - Cross-module work stays inside a single database transaction, so no sagas and no compensation.
      - Boundaries are enforced by the compiler, which never forgets and never approves a pull request anyway.
      - Getting a boundary wrong costs a refactor rather than a data migration and a cross-team release.
      - Calls between modules cost nanoseconds, so there is no fan-out tail to design around.
      - Each module can be extracted later, one at a time, with the contract already in place.
  bad:
    heading: Cons
    items:
      - Discipline is the only thing holding it up — without architecture tests it decays into a layered monolith.
      - You cannot scale or deploy one module independently; a hot module means scaling everything.
      - "One process means one blast radius: a memory leak or a runaway thread takes the whole system down."
      - Everything is in one language and one runtime, so "use Go for this bit" is off the table.
      - Large teams contend on one repository, one pipeline and one release train.
      - The database is a shared resource, and a cross-schema query is always one lazy pull request away.
when:
  note: Pick the architecture whose mistakes are cheapest — you will make some.
  good:
    heading: Use it when…
    items:
      - You have between one and ten teams and no proven need for independent deployment.
      - The domain is still moving and boundaries will need to be redrawn.
      - Business operations span several capabilities and you want them in one transaction.
      - You are breaking up a ball of mud and cannot stop shipping while you do it.
      - Your operational maturity does not yet include tracing, service discovery and a per-service on-call rota.
      - You want the option of microservices later without paying for them now.
  bad:
    heading: Avoid it when…
    items:
      - Parts of the system genuinely need independent scaling or release cadence. Use **microservices** for those parts only.
      - Teams must deploy without coordinating. One pipeline is a real constraint — use **separate services**.
      - Different parts need different runtimes or languages. One process means one runtime.
      - The application is small and will stay small. Use a **layered monolith**; modules would be ceremony.
      - A component has a hard isolation requirement — untrusted plugins, a separate compliance boundary at the process level. Use a **separate process**.
      - Nobody will maintain the architecture tests. Without enforcement this is just a monolith with optimistic folder names.
useCases:
  - title: A startup that expects to grow
    body: Four engineers building a B2B product. Microservices would cost them a pipeline, a service mesh and an on-call rota they cannot staff; a layered monolith would cost them a rewrite in three years. Six modules in one solution, with architecture tests from the first commit, give them boundaries they can move cheaply while the domain is still being discovered.
  - title: Escaping a ball of mud without a rewrite
    body: A ten-year-old ASP.NET application with one 400-table database. Instead of a rewrite, the team draws module boundaries on paper, moves tables into schemas one capability at a time, introduces a contract per capability, and adds an architecture test the moment each module is clean. No big-bang release, and the system stays shippable throughout.
  - title: Retreating from premature microservices
    body: A team of eight is running fourteen services, most deployed together because they change together. They merge the ones that share a release into modules in one host, keeping the existing interfaces as module contracts. Latency drops, the saga code disappears, and the two services that genuinely scale differently stay separate.
  - title: Extracting the one module that needs it
    body: A document-rendering module is CPU-bound and occasionally needs thirty machines for twenty minutes, while the rest of the system is happy on three. It already sits behind `IRenderingApi`, so it is extracted into a service and a queue; the calling code changes on one line of registration. Nothing else is distributed.
  - title: A regulated product with one compliance boundary
    body: Payment data must live in a separately audited store with its own access controls. The Payments module gets its own schema, its own database user and its own audit log while staying in the same process, which satisfies the auditor without forcing the other eleven modules into a distributed architecture.
gotchas:
  items:
    - mistake: Modules named after layers
      why: "`Api`, `Services`, `Data`, `Domain` as \"modules\" is the layered monolith with extra project files. Every feature still touches every module, so nothing has been decoupled."
      fix: name modules after things the business says out loud — Orders, Billing, Shipping. If a typical change touches more than one module, the boundary is in the wrong place.
    - mistake: No architecture tests
      why: The boundaries hold for about four months, then a deadline arrives and someone adds a project reference. Nothing fails, the pull request is approved, and the next shortcut is easier to justify.
      fix: write the dependency rules as tests on day one, while they all pass. A boundary that is not asserted in CI is a preference, not an architecture.
    - mistake: Joining across module schemas
      why: The C# is immaculate and `OrderReportQuery` joins `orders.orders` to `billing.invoices` because it was quicker. The modules are now coupled at the only layer nobody is testing.
      fix: one `DbContext` per module, each mapping only its own schema, and a per-module database user with grants on nothing else. For reports, have the owning module expose the data or build a read model.
    - mistake: A shared kernel that eats the domain
      why: "`Common` starts with `Money` and ends up holding `Customer`, `Order` and a base repository. Everything references it, so every module is transitively coupled to every other."
      fix: keep it to primitives with no business rules, add an architecture test asserting it depends on nothing, and when something looks shared, let both modules keep their own version until the third one appears.
    - mistake: Exposing entities through the contract
      why: "`IBillingApi` returns a `Invoice` entity with lazy-loaded navigation properties. Callers now depend on your schema, and the module cannot be extracted without breaking them."
      fix: "return records built for the contract. The test is animation 4: could you implement this interface over HTTP without changing the caller? If not, it is leaking."
    - mistake: Every interaction becomes an event
      why: Direct calls are replaced with events everywhere "for decoupling". Now no stack trace shows the flow, "what happens when an order is placed" is a grep, and ordering bugs appear under load.
      fix: default to a contract call; use an event only when the publisher genuinely does not care who listens or what happens. Decoupling that you cannot read is not decoupling.
    - mistake: Extracting a module because the count got large
      why: Twelve modules feels like it should be twelve services. The team distributes a system with no scaling problem and acquires sagas, retries, tracing and a deployment matrix in exchange for nothing.
      fix: extract on evidence from your per-module metrics — a different scaling profile, a different release cadence, or a team genuinely blocked. Module count is not evidence.
    - mistake: One `DbContext` for the whole application
      why: It maps every table, so any module can query any other's data with full IntelliSense support. The most convenient possible way to destroy the boundaries.
      fix: a `DbContext` per module, registered by that module, mapping only its own entities. Migrations per module too, so each one owns its schema history.
alternatives:
  columns:
    - Approach
    - Best for
    - Complexity
    - Ops cost
    - Key difference vs a modular monolith
  rows:
    - self: true
      cells: [ "**Modular monolith**", "most products, 1–10 teams", Medium, Low, — ]
    - cells:
        - "**Layered monolith**"
        - small apps, one team, short horizon
        - Low
        - Low
        - No enforced boundaries; faster to start, far harder to change after year two
    - cells:
        - "**Microservices**"
        - many teams, genuinely different scaling
        - High
        - High
        - Independent deploy and scale, bought with network failure and distributed data
    - cells:
        - "**Vertical slice architecture**"
        - organising code <em>inside</em> a module
        - Low
        - Low
        - Not a competitor — it is how you lay out each module internally
    - cells:
        - "**Spring Modulith / modulith frameworks**"
        - teams wanting the pattern with tooling
        - Medium
        - Low
        - Same pattern with built-in verification and documentation; JVM
    - cells:
        - "**Serverless functions**"
        - spiky, event-driven, small units of work
        - Medium
        - Medium
        - Deployment unit per function; excellent for glue, poor for a cohesive domain
    - cells:
        - "**Distributed monolith**"
        - nobody — it is what you get by accident
        - High
        - High
        - "Services that must deploy together: every cost of microservices, none of the benefits"
  notes:
    - "**Pick a layered monolith** if the application is genuinely small and you would rather have speed now than optionality later."
    - "**Pick microservices** when you can name the service, the scaling problem and the team that is blocked — all three."
    - "**Use vertical slices inside** your modules; the two ideas are complementary, not alternatives."
    - "**Watch for the distributed monolith.** If your services always release together, you have one system in several processes and should consider merging them back into modules."
    - The usual healthy end state is a modular monolith plus two or three extracted services — not a choice between the extremes.
