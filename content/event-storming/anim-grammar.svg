<svg viewBox="0 0 800 320" role="img" aria-label="Building one slice of the EventStorming grammar from an event back to its command, actor, aggregate, read model, external system and policy">
  <defs>
    <marker id="eq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="eq-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a48cc4"/></marker>
  </defs>
  <text id="eq-phase" x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">always start from the event &mdash; then ask what had to be true for it to happen</text>

  <g id="eq-actor" class="hidden">
    <rect x="20" y="112" width="104" height="56" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text x="72" y="136" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">customer</text>
    <text x="72" y="154" font-size="9.5" text-anchor="middle" fill="#5f6f66">actor</text>
  </g>
  <line id="eq-a1" class="hidden" x1="128" y1="140" x2="146" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eq-arr)"/>

  <g id="eq-cmd" class="hidden">
    <rect x="150" y="112" width="124" height="56" rx="5" fill="#b9cfe3" stroke="#7fa3c0" stroke-width="1.5"/>
    <text x="212" y="136" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">Place Order</text>
    <text x="212" y="154" font-size="9.5" text-anchor="middle" fill="#5f6f66">command</text>
  </g>
  <line id="eq-a2" class="hidden" x1="278" y1="140" x2="296" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eq-arr)"/>

  <g id="eq-aggr" class="hidden">
    <rect x="300" y="112" width="130" height="56" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
    <text x="365" y="136" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">Order</text>
    <text id="eq-aggrt" x="365" y="154" font-size="9.5" text-anchor="middle" fill="#5f6f66">aggregate &mdash; holds the rule</text>
  </g>
  <line id="eq-a3" class="hidden" x1="434" y1="140" x2="452" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eq-arr)"/>

  <g id="eq-evt">
    <rect x="456" y="112" width="130" height="56" rx="5" fill="#f2c98a" stroke="#d9a45a" stroke-width="1.5"/>
    <text x="521" y="136" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">Order Placed</text>
    <text x="521" y="154" font-size="9.5" text-anchor="middle" fill="#5f6f66">domain event</text>
  </g>
  <line id="eq-a4" class="hidden" x1="590" y1="140" x2="608" y2="140" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eq-arr)"/>

  <g id="eq-pol" class="hidden">
    <rect x="612" y="112" width="168" height="56" rx="5" fill="#cdbde0" stroke="#a48cc4" stroke-width="1.5"/>
    <text x="696" y="134" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">whenever an order is placed,</text>
    <text x="696" y="150" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">reserve the stock</text>
    <text x="696" y="164" font-size="9" text-anchor="middle" fill="#5f6f66">policy</text>
  </g>

  <g id="eq-rm" class="hidden">
    <rect x="150" y="214" width="124" height="52" rx="5" fill="#bfd9b0" stroke="#7fae6b" stroke-width="1.5"/>
    <text x="212" y="236" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">basket + stock</text>
    <text x="212" y="253" font-size="9.5" text-anchor="middle" fill="#5f6f66">read model</text>
  </g>
  <path id="eq-a5" class="hidden" d="M470 172 L470 196 L213 196 L213 210" fill="none" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eq-arr)"/>
  <path id="eq-a6" class="hidden" d="M150 240 L72 240 L72 172" fill="none" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eq-arr)"/>

  <g id="eq-ext" class="hidden">
    <rect x="456" y="214" width="130" height="52" rx="5" fill="#f0bfd0" stroke="#cf8fa9" stroke-width="1.5"/>
    <text x="521" y="236" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">payment provider</text>
    <text x="521" y="253" font-size="9.5" text-anchor="middle" fill="#5f6f66">external system</text>
  </g>
  <line id="eq-a7" class="hidden" x1="540" y1="210" x2="540" y2="174" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eq-arr)"/>

  <path id="eq-loop" class="hidden" d="M696 172 L696 294 L212 294 L212 172" fill="none" stroke="#a48cc4" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#eq-pur)"/>

  <text id="eq-msg" x="400" y="312" font-size="11.5" text-anchor="middle" fill="#5f6f66">one orange note, and six questions that follow from it</text>
</svg>
