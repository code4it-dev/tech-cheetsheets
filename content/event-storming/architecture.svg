<svg viewBox="0 0 800 372" role="img" aria-label="The EventStorming grammar connecting actor, command, aggregate, event and policy, with the sticky-note legend and how each colour maps to code">
  <defs>
    <marker id="eg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="eg-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a48cc4"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">the colours are the grammar &mdash; learn these seven and you can read any wall</text>

  <rect x="20" y="36" width="760" height="130" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="58" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">the grammar &mdash; one slice of a business</text>

  <rect x="34" y="74" width="116" height="48" rx="4" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="92" y="95" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">customer</text>
  <text x="92" y="111" font-size="9" text-anchor="middle" fill="#5f6f66">actor</text>
  <line x1="154" y1="98" x2="172" y2="98" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eg-arr)"/>

  <rect x="176" y="74" width="126" height="48" rx="4" fill="#b9cfe3" stroke="#7fa3c0"/>
  <text x="239" y="95" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">Place Order</text>
  <text x="239" y="111" font-size="9" text-anchor="middle" fill="#5f6f66">command</text>
  <line x1="306" y1="98" x2="324" y2="98" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eg-arr)"/>

  <rect x="328" y="74" width="126" height="48" rx="4" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="391" y="95" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">Order</text>
  <text x="391" y="111" font-size="9" text-anchor="middle" fill="#5f6f66">aggregate &mdash; holds the rule</text>
  <line x1="458" y1="98" x2="476" y2="98" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eg-arr)"/>

  <rect x="480" y="74" width="136" height="48" rx="4" fill="#f2c98a" stroke="#d9a45a"/>
  <text x="548" y="95" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">Order Placed</text>
  <text x="548" y="111" font-size="9" text-anchor="middle" fill="#5f6f66">domain event</text>
  <line x1="620" y1="98" x2="638" y2="98" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#eg-arr)"/>

  <rect x="642" y="74" width="124" height="48" rx="4" fill="#cdbde0" stroke="#a48cc4"/>
  <text x="704" y="95" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">whenever… then…</text>
  <text x="704" y="111" font-size="9" text-anchor="middle" fill="#5f6f66">policy</text>

  <path d="M704 126 L704 142 L239 142 L239 126" fill="none" stroke="#a48cc4" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#eg-pur)"/>
  <text x="400" y="159" font-size="10" text-anchor="middle" fill="#5f6f66">the policy issues the next command &mdash; and round it goes</text>

  <rect x="20" y="180" width="760" height="102" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="201" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">legend</text>

  <rect x="36" y="213" width="22" height="16" rx="3" fill="#f2c98a" stroke="#d9a45a"/>
  <text x="66" y="226" font-size="10.5" fill="#23362e">domain event &mdash; past tense</text>
  <rect x="222" y="213" width="22" height="16" rx="3" fill="#b9cfe3" stroke="#7fa3c0"/>
  <text x="252" y="226" font-size="10.5" fill="#23362e">command &mdash; imperative</text>
  <rect x="408" y="213" width="22" height="16" rx="3" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="438" y="226" font-size="10.5" fill="#23362e">aggregate (big) / actor</text>
  <rect x="594" y="213" width="22" height="16" rx="3" fill="#cdbde0" stroke="#a48cc4"/>
  <text x="624" y="226" font-size="10.5" fill="#23362e">policy &mdash; whenever/then</text>

  <rect x="36" y="243" width="22" height="16" rx="3" fill="#bfd9b0" stroke="#7fae6b"/>
  <text x="66" y="256" font-size="10.5" fill="#23362e">read model &mdash; what you see</text>
  <rect x="222" y="243" width="22" height="16" rx="3" fill="#f0bfd0" stroke="#cf8fa9"/>
  <text x="252" y="256" font-size="10.5" fill="#23362e">external system</text>
  <rect x="408" y="243" width="22" height="16" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="438" y="256" font-size="10.5" fill="#c53b3b" font-weight="600">hotspot &mdash; nobody agrees</text>
  <text x="624" y="256" font-size="10.5" fill="#5f6f66">one fact per note.</text>

  <rect x="20" y="296" width="760" height="62" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="400" y="317" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">and it is not a drawing exercise &mdash; each colour has a home in code</text>
  <text x="36" y="337" font-size="10.5" fill="#5f6f66">command &rarr; command handler &nbsp;·&nbsp; aggregate &rarr; aggregate root &nbsp;·&nbsp; event &rarr; domain event &nbsp;·&nbsp; policy &rarr; process manager or saga</text>
  <text x="36" y="353" font-size="10.5" fill="#5f6f66">read model &rarr; projection &nbsp;·&nbsp; external system &rarr; anti-corruption layer &nbsp;·&nbsp; hotspot &rarr; the question to ask before you build</text>
</svg>
