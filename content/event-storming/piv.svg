<svg viewBox="0 0 560 200" role="img" aria-label="A timeline of events split by pivotal events into three candidate bounded contexts">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">where the language changes, the context changes</text>
  <g>
    <rect id="pv-e1" x="20" y="52" width="92" height="30" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="66" y="72" font-size="9.5" text-anchor="middle" fill="#23362e">Quote Sent</text>
    <rect id="pv-e2" x="118" y="52" width="92" height="30" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="164" y="72" font-size="9.5" text-anchor="middle" fill="#23362e">Order Placed</text>
    <rect id="pv-e3" x="216" y="52" width="92" height="30" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="262" y="72" font-size="9.5" text-anchor="middle" fill="#23362e">Stock Picked</text>
    <rect id="pv-e4" x="314" y="52" width="92" height="30" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="360" y="72" font-size="9.5" text-anchor="middle" fill="#23362e">Parcel Sent</text>
    <rect id="pv-e5" x="412" y="52" width="110" height="30" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="467" y="72" font-size="9.5" text-anchor="middle" fill="#23362e">Invoice Issued</text>
  </g>
  <g id="pv-l1" class="hidden"><line x1="114" y1="42" x2="114" y2="120" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <g id="pv-l2" class="hidden"><line x1="408" y1="42" x2="408" y2="120" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <g id="pv-c" class="hidden">
    <rect x="20" y="126" width="92" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="66" y="144" font-size="9.5" text-anchor="middle" fill="#2f6b3f" font-weight="600">Sales</text>
    <rect x="118" y="126" width="288" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="262" y="144" font-size="9.5" text-anchor="middle" fill="#2f6b3f" font-weight="600">Fulfilment</text>
    <rect x="412" y="126" width="110" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="467" y="144" font-size="9.5" text-anchor="middle" fill="#2f6b3f" font-weight="600">Billing</text>
  </g>
  <text id="pv-msg" x="280" y="178" font-size="11.5" text-anchor="middle" fill="#5f6f66">one timeline, no boundaries yet</text>
</svg>
