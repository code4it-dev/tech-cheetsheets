<svg viewBox="0 0 800 320" role="img" aria-label="Orange sticky notes scattered on a wall being arranged into a timeline, duplicates merged, a hotspot added and pivotal events marking boundaries">
  <defs>
    <marker id="ew-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="ew-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">phase 1 &mdash; chaotic exploration: everyone writes, nobody discusses</text>

  <g id="ew-n1"><rect x="40" y="56" width="140" height="34" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="110" y="78" font-size="10.5" text-anchor="middle" fill="#23362e">Order Placed</text></g>
  <g id="ew-n2"><rect x="300" y="48" width="140" height="34" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="370" y="70" font-size="10.5" text-anchor="middle" fill="#23362e">Payment Taken</text></g>
  <g id="ew-n3"><rect x="560" y="64" width="140" height="34" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="630" y="86" font-size="10.5" text-anchor="middle" fill="#23362e">Order Submitted</text></g>
  <g id="ew-n4"><rect x="150" y="120" width="140" height="34" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="220" y="142" font-size="10.5" text-anchor="middle" fill="#23362e">Parcel Shipped</text></g>
  <g id="ew-n5"><rect x="430" y="128" width="140" height="34" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="500" y="150" font-size="10.5" text-anchor="middle" fill="#23362e">Stock Reserved</text></g>
  <g id="ew-n6"><rect x="640" y="136" width="140" height="34" rx="4" fill="#f2c98a" stroke="#d9a45a"/><text x="710" y="158" font-size="10.5" text-anchor="middle" fill="#23362e">Invoice Issued</text></g>

  <g id="ew-hot" class="hidden">
    <rect x="250" y="126" width="196" height="34" rx="4" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
    <text x="348" y="148" font-size="10" text-anchor="middle" fill="#c53b3b" font-weight="600">before or after payment?</text>
  </g>

  <g id="ew-p1" class="hidden">
    <line x1="166" y1="174" x2="166" y2="256" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="170" y="170" font-size="10" fill="#c53b3b" font-weight="600">pivotal</text>
  </g>
  <g id="ew-p2" class="hidden">
    <line x1="616" y1="174" x2="616" y2="256" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="620" y="170" font-size="10" fill="#c53b3b" font-weight="600">pivotal</text>
  </g>

  <g id="ew-ctx" class="hidden">
    <rect x="16" y="228" width="150" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <text x="91" y="246" font-size="10" text-anchor="middle" fill="#2f6b3f" font-weight="600">Sales</text>
    <rect x="170" y="228" width="442" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <text x="391" y="246" font-size="10" text-anchor="middle" fill="#2f6b3f" font-weight="600">Fulfilment</text>
    <rect x="616" y="228" width="168" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <text x="700" y="246" font-size="10" text-anchor="middle" fill="#2f6b3f" font-weight="600">Billing</text>
  </g>

  <line id="ew-axis" class="hidden" x1="20" y1="286" x2="770" y2="286" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ew-arr)"/>
  <text id="ew-axist" class="hidden" x="400" y="306" font-size="11" text-anchor="middle" fill="#5f6f66">time</text>
  <text id="ew-msg" x="400" y="306" font-size="11.5" text-anchor="middle" fill="#5f6f66">no order, no discussion, no facilitator at the wall</text>
</svg>
