<svg viewBox="0 0 800 300" role="img" aria-label="Animated layered monolith where every class can reach into every other area's internals">
  <defs>
    <marker id="bm-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <rect x="36" y="40" width="728" height="178" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="60" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">one process, organised by layer &mdash; every class is public to every other class</text>
  <rect id="bm-m1" x="50" y="72" width="228" height="130" rx="8" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
  <text x="164" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Orders code</text>
  <rect id="bm-i1" x="60" y="102" width="208" height="88" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="164" y="122" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">public OrderService</text>
  <text x="164" y="140" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">public OrderRepo</text>
  <text id="bm-t1" x="164" y="166" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">one shared DbContext</text>
  <rect id="bm-m2" x="286" y="72" width="228" height="130" rx="8" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
  <text x="400" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Billing code</text>
  <rect id="bm-i2" x="296" y="102" width="208" height="88" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="400" y="122" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">public BillingService</text>
  <text x="400" y="140" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">public LedgerRepo</text>
  <text id="bm-t2" x="400" y="166" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">same tables, no owner</text>
  <rect id="bm-m3" x="522" y="72" width="228" height="130" rx="8" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
  <text x="636" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Shipping code</text>
  <rect id="bm-i3" x="532" y="102" width="208" height="88" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="636" y="122" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">public CourierClient</text>
  <text x="636" y="140" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">public LabelPrinter</text>
  <text id="bm-t3" x="636" y="166" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">anyone can new() this</text>
  <path id="bm-a1" class="hidden" d="M268 116 L292 116" stroke="#c53b3b" stroke-width="1.5" fill="none" marker-end="url(#bm-r)"/>
  <path id="bm-a2" class="hidden" d="M296 152 L272 152" stroke="#c53b3b" stroke-width="1.5" fill="none" marker-end="url(#bm-r)"/>
  <path id="bm-a3" class="hidden" d="M504 116 L528 116" stroke="#c53b3b" stroke-width="1.5" fill="none" marker-end="url(#bm-r)"/>
  <path id="bm-a4" class="hidden" d="M532 152 L508 152" stroke="#c53b3b" stroke-width="1.5" fill="none" marker-end="url(#bm-r)"/>
  <path id="bm-a5" class="hidden" d="M164 192 Q 400 232 636 192" stroke="#c53b3b" stroke-width="1.5" fill="none" marker-end="url(#bm-r)"/>
  <text id="bm-state" x="36" y="248" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">cross-area references: 0</text>
  <text id="bm-cost" x="36" y="270" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">cost of moving Billing out: &mdash;</text>
  <text id="bm-note" class="hand hidden" x="330" y="268" font-size="16" fill="#c53b3b">nobody decided this &mdash; it accumulated</text>
</svg>
