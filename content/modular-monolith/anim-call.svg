<svg viewBox="0 0 800 300" role="img" aria-label="Animated in-process call from Orders to Billing through a public contract, with a direct call to internals blocked at compile time">
  <defs>
    <marker id="mc-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3f"/></marker>
    <marker id="mc-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <rect x="36" y="40" width="728" height="178" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="60" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">one process &mdash; but Billing's internals are invisible outside Billing</text>
  <rect id="mc-m1" x="50" y="72" width="228" height="130" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="164" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Orders</text>
  <rect id="mc-c1" x="60" y="100" width="208" height="24" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="164" y="116" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">IOrdersApi</text>
  <rect id="mc-i1" x="60" y="130" width="208" height="60" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text id="mc-t1" x="164" y="152" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal OrderService</text>
  <text id="mc-t1b" x="164" y="174" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>
  <rect id="mc-m2" x="286" y="72" width="228" height="130" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="400" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Billing</text>
  <rect id="mc-c2" x="296" y="100" width="208" height="24" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="400" y="116" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">IBillingApi &mdash; the only door</text>
  <rect id="mc-i2" x="296" y="130" width="208" height="60" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text id="mc-t2" x="400" y="152" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal BillingService</text>
  <text id="mc-t2b" x="400" y="174" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">schema: billing</text>
  <rect id="mc-m3" x="522" y="72" width="228" height="130" rx="8" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
  <text x="636" y="92" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Contracts project</text>
  <text x="636" y="124" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">IBillingApi</text>
  <text x="636" y="144" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">ChargeRequest / Result</text>
  <text x="636" y="170" font-size="10.5" text-anchor="middle" fill="#2f6b3f" font-family="Fira Code, monospace">no implementation here</text>
  <path id="mc-ok" class="hidden" d="M268 112 L292 112" stroke="#2f6b3f" stroke-width="2" fill="none" marker-end="url(#mc-g)"/>
  <path id="mc-bad" class="hidden" d="M164 192 Q 280 228 396 192" stroke="#c53b3b" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#mc-r)"/>
  <text id="mc-badt" class="hidden" x="280" y="242" font-size="11" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">new BillingService() &mdash; does not compile</text>
  <text id="mc-state" x="36" y="268" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">call cost: &mdash;</text>
  <text id="mc-note" class="hand hidden" x="400" y="286" font-size="16" fill="#c53b3b">a method call with a boundary bolted on</text>
