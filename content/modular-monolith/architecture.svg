<svg viewBox="0 0 800 320" role="img" aria-label="One process containing three modules, each with a public contract, hidden internals and its own database schema">
  <defs>
    <marker id="mm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">split by business capability, not by technical layer</text>

  <rect x="36" y="36" width="728" height="186" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="56" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">one process &middot; one deployable &middot; one build</text>

  <rect x="50" y="68" width="228" height="140" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="164" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Orders</text>
  <rect x="60" y="96" width="208" height="26" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="164" y="113" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">IOrdersApi &mdash; public</text>
  <rect x="60" y="128" width="208" height="70" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="164" y="147" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal: OrderService</text>
  <text x="164" y="164" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal: OrderRepo</text>
  <text x="164" y="187" font-size="10.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">schema: orders</text>

  <rect x="286" y="68" width="228" height="140" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="400" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Billing</text>
  <rect x="296" y="96" width="208" height="26" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="400" y="113" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">IBillingApi &mdash; public</text>
  <rect x="296" y="128" width="208" height="70" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="400" y="147" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal: BillingService</text>
  <text x="400" y="164" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal: Ledger</text>
  <text x="400" y="187" font-size="10.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">schema: billing</text>

  <rect x="522" y="68" width="228" height="140" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="636" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Shipping</text>
  <rect x="532" y="96" width="208" height="26" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="636" y="113" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">IShippingApi &mdash; public</text>
  <rect x="532" y="128" width="208" height="70" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="636" y="147" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal: CourierClient</text>
  <text x="636" y="164" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">internal: LabelPrinter</text>
  <text x="636" y="187" font-size="10.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">schema: shipping</text>

  <path d="M278 109 L292 109" stroke="#2f6b3f" stroke-width="1.5" fill="none" marker-end="url(#mm-arr)"/>
  <path d="M514 109 L528 109" stroke="#2f6b3f" stroke-width="1.5" fill="none" marker-end="url(#mm-arr)"/>

  <rect x="36" y="238" width="360" height="62" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="216" y="260" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Allowed: contract to contract</text>
  <text x="216" y="280" font-size="11" text-anchor="middle" fill="#5f6f66">a plain method call, same thread, same transaction</text>

  <rect x="404" y="238" width="360" height="62" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="584" y="260" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Blocked: anything into internals</text>
  <text x="584" y="280" font-size="11" text-anchor="middle" fill="#5f6f66">a compile error, not a code review comment</text>
</svg>
