<svg viewBox="0 0 800 300" role="img" aria-label="Animated extraction of the Billing module into a separate service behind the same interface">
  <defs>
    <marker id="mx-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="mx-proc" x="36" y="56" width="430" height="152" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="mx-proc-t" x="251" y="76" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">the monolith process</text>
  <rect id="mx-m1" x="50" y="88" width="190" height="106" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="145" y="112" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Orders</text>
  <text id="mx-t1" x="145" y="136" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">calls IBillingApi</text>
  <text id="mx-t1b" x="145" y="162" font-size="10.5" text-anchor="middle" fill="#2f6b3f" font-family="Fira Code, monospace">code unchanged</text>
  <rect id="mx-m2" x="256" y="88" width="196" height="106" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text id="mx-m2-h" x="354" y="112" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Billing module</text>
  <text id="mx-t2" x="354" y="136" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">BillingService</text>
  <text id="mx-t2b" x="354" y="162" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">schema: billing</text>
  <path id="mx-link" d="M240 128 L252 128" stroke="#2f6b3f" stroke-width="2" fill="none" marker-end="url(#mx-a)"/>
  <g id="mx-remote" class="hidden">
    <rect x="556" y="78" width="208" height="112" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
    <text x="660" y="104" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Billing service</text>
    <text id="mx-rt" x="660" y="128" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">its own process</text>
    <text id="mx-rt2" x="660" y="150" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">its own database</text>
    <text id="mx-rt3" x="660" y="172" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">its own deploy</text>
  </g>
  <path id="mx-http" class="hidden" d="M470 134 L550 134" stroke="#5f6f66" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#mx-a)"/>
  <text id="mx-http-t" class="hidden" x="510" y="126" font-size="10" text-anchor="middle" fill="#5f6f66">HTTP</text>
  <text id="mx-reg" x="36" y="238" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">composition root: AddScoped&lt;IBillingApi, BillingService&gt;();</text>
  <text id="mx-cost" x="36" y="262" font-size="12.5" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">call: ~50 ns &middot; cannot fail &middot; one transaction</text>
  <text id="mx-note" class="hand hidden" x="400" y="288" font-size="16" fill="#c53b3b">one line of DI, because the seam was already there</text>
</svg>
