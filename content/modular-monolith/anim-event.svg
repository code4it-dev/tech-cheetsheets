<svg viewBox="0 0 800 300" role="img" aria-label="Animated in-process event where Orders publishes OrderPlaced and Billing and Shipping handle it">
  <defs>
    <marker id="me-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="me-m1" x="36" y="96" width="186" height="104" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="129" y="122" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Orders</text>
  <text id="me-t1" x="129" y="146" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">order saved</text>
  <text id="me-t1b" x="129" y="170" font-size="10.5" text-anchor="middle" fill="#2f6b3f" font-family="Fira Code, monospace">references: none</text>
  <path d="M222 148 L258 148" stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#me-a)"/>
  <rect id="me-bus" x="262" y="108" width="200" height="80" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="362" y="132" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">in-process bus</text>
  <text id="me-evt" x="362" y="156" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>
  <text id="me-mode" x="362" y="176" font-size="10.5" text-anchor="middle" fill="#8a6a0c" font-family="Fira Code, monospace">dispatch: &mdash;</text>
  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#me-a)">
    <line x1="462" y1="132" x2="516" y2="98"/><line x1="462" y1="164" x2="516" y2="198"/>
  </g>
  <rect id="me-m2" x="520" y="56" width="244" height="80" rx="8" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
  <text x="642" y="80" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Billing handler</text>
  <text id="me-t2" x="642" y="104" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">waiting</text>
  <text id="me-t2b" x="642" y="124" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">must not be lost</text>
  <rect id="me-m3" x="520" y="160" width="244" height="80" rx="8" fill="#eef1e8" stroke="#d5dccf" stroke-width="1.5"/>
  <text x="642" y="184" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Shipping handler</text>
  <text id="me-t3" x="642" y="208" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">waiting</text>
  <text id="me-t3b" x="642" y="228" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">retryable</text>
  <text id="me-tx" x="36" y="252" font-size="12.5" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">transaction: one, shared</text>
  <text id="me-risk" x="36" y="274" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">failure of a handler: &mdash;</text>
  <text id="me-note" class="hand hidden" x="400" y="290" font-size="16" fill="#c53b3b">decoupled code, but now you own consistency</text>
</svg>
