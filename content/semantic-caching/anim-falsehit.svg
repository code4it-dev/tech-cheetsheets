<svg viewBox="0 0 800 340" role="img" aria-label="Two different questions with very similar embeddings producing a cache hit that serves the wrong answer, and the three fixes">
  <text id="sf-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">two questions that differ by one word, and mean entirely different things</text>

  <rect id="sf-q1" x="16" y="36" width="368" height="62" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="30" y="56" font-size="10" fill="#23362e" font-weight="700">cached entry, answered yesterday</text>
  <text id="sf-q1t" x="30" y="74" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">"how do I cancel my order?"</text>
  <text id="sf-q1a" x="30" y="90" font-size="9.5" fill="#5f6f66">answer: orders can be cancelled until dispatch…</text>

  <rect id="sf-q2" x="416" y="36" width="368" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="430" y="56" font-size="10" fill="#23362e" font-weight="700">incoming question, right now</text>
  <text id="sf-q2t" x="430" y="74" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">"how do I cancel my subscription?"</text>
  <text id="sf-q2a" x="430" y="90" font-size="9.5" fill="#5f6f66">correct answer: a 30-day notice period applies…</text>

  <rect id="sf-sim" x="250" y="116" width="300" height="52" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text id="sf-simt" x="400" y="138" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">cosine similarity</text>
  <text id="sf-simv" x="400" y="158" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">computing…</text>

  <rect id="sf-thr" x="16" y="186" width="768" height="46" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="sf-t1" x="30" y="206" font-size="10.5" fill="#23362e" font-weight="700">threshold</text>
  <text id="sf-t2" x="30" y="224" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">0.92 — chosen because it gave the best hit rate in a notebook</text>

  <rect id="sf-res" x="16" y="246" width="768" height="54" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="sf-r1" x="30" y="268" font-size="11" fill="#23362e" font-weight="700">outcome</text>
  <text id="sf-r2" x="30" y="288" font-size="10" fill="#5f6f66">&nbsp;</text>

  <rect id="sf-verd" x="16" y="308" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="sf-v" x="400" y="327" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">similar wording is not the same question</text>
</svg>
