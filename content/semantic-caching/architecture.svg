<svg viewBox="0 0 800 340" role="img" aria-label="A semantic cache sitting in front of an LLM pipeline: embed the question, search the cache, serve on a hit, otherwise call the model and store the result">
  <defs>
    <marker id="sa-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one branch, and everything expensive is on the far side of it</text>

  <rect x="16" y="44" width="124" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="78" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">question</text>
  <text x="78" y="86" font-size="9.5" text-anchor="middle" fill="#5f6f66">+ user, tenant</text>

  <rect x="168" y="44" width="124" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="230" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">normalise + embed</text>
  <text x="230" y="86" font-size="9.5" text-anchor="middle" fill="#5f6f66">~8 ms, ~$0.00001</text>

  <rect x="320" y="36" width="164" height="72" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="402" y="60" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">semantic cache</text>
  <text x="402" y="78" font-size="9.5" text-anchor="middle" fill="#5f6f66">ANN over past questions</text>
  <text x="402" y="96" font-size="9.5" text-anchor="middle" fill="#5f6f66">scoped by tenant · model · version</text>

  <line x1="144" y1="72" x2="162" y2="72" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>
  <line x1="296" y1="72" x2="314" y2="72" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>

  <rect x="512" y="36" width="272" height="72" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="648" y="60" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">HIT &mdash; similarity &ge; threshold</text>
  <text x="648" y="78" font-size="9.5" text-anchor="middle" fill="#5f6f66">serve the stored answer verbatim</text>
  <text x="648" y="96" font-size="9.5" text-anchor="middle" fill="#2f6b3f">~25 ms · no generation cost</text>
  <line x1="488" y1="72" x2="506" y2="72" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#sa-arr)"/>

  <line x1="402" y1="112" x2="402" y2="146" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#sa-arr)"/>
  <text x="414" y="134" font-size="9.5" fill="#c53b3b">MISS</text>

  <rect x="16" y="150" width="768" height="104" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="30" y="170" font-size="11" fill="#c53b3b" font-weight="700">MISS &mdash; the expensive path, which is the one you are trying to avoid</text>

  <rect x="30" y="182" width="150" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="105" y="206" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">retrieve (RAG)</text>
  <text x="105" y="224" font-size="9.5" text-anchor="middle" fill="#5f6f66">~120 ms</text>

  <rect x="212" y="182" width="150" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="287" y="206" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">generate</text>
  <text x="287" y="224" font-size="9.5" text-anchor="middle" fill="#5f6f66">~1.8 s · ~$0.004</text>

  <rect x="394" y="182" width="150" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="469" y="206" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">answer</text>
  <text x="469" y="224" font-size="9.5" text-anchor="middle" fill="#5f6f66">to the user</text>

  <rect x="576" y="182" width="192" height="56" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="672" y="206" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">write back to cache</text>
  <text x="672" y="224" font-size="9.5" text-anchor="middle" fill="#5f6f66">question vector + answer + TTL</text>

  <line x1="184" y1="210" x2="206" y2="210" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>
  <line x1="366" y1="210" x2="388" y2="210" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>
  <line x1="548" y1="210" x2="570" y2="210" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sa-arr)"/>

  <text class="hand" x="400" y="286" fill="#c53b3b" font-size="16" text-anchor="middle">the threshold is not a tuning knob. it is the line between a saving and a wrong answer.</text>
  <text x="400" y="318" font-size="11" text-anchor="middle" fill="#5f6f66">every cache entry is keyed by <tspan font-family="Fira Code, monospace">tenant + user-scope + model + prompt version</tspan>, not by the question alone</text>
</svg>
