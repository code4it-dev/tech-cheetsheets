title: gRPC
slug: grpc
tagline: A typed method call that happens to cross a network — with HTTP/2 doing the multiplexing and protobuf doing the bytes.
asof: Nov 2026 · examples use proto3, grpc-dotnet and grpcio
description: "gRPC cheatsheet: protobuf contracts, the four call types, HTTP/2 framing, status codes and trailers, deadlines and cancellation, channels, retries and gRPC-Web."
aliases:
  - gRPC
  - grpc
  - protobuf
  - Protocol Buffers
  - proto3
  - protoc
  - gRPC-Web
  - grpcurl
  - deadline propagation
  - grpc status
keywords:
  - grpc
  - protobuf
  - http2
  - rpc
  - microservices
  - streaming
  - deadlines
  - protocol buffers
  - service mesh
related: [ graphql, load-balancing, reverse-proxy, a2a, retry-backoff-jitter ]
overview:
  - "**gRPC** starts from a `.proto` file: a service, its methods, and the message types they exchange. A code generator turns that into a server base class and a client stub in every language you need, so calling a remote service looks like calling an object — while the contract stays a single file both sides compile against."
  - "Underneath, each call is one HTTP/2 stream. The method is the path (`/orders.OrderService/GetOrder`), metadata are headers, the body is a sequence of length-prefixed protobuf messages, and the outcome arrives in <em>trailers</em> — headers sent after the body — which is how a stream that already began can still report a failure. Because a stream can carry many messages in either direction, four call shapes exist: unary, server streaming, client streaming and bidirectional."
  - "What you gain is speed, small payloads, generated clients in a dozen languages, first-class streaming, and deadlines that propagate through a call chain. What you pay is a build step, a binary wire format you cannot read with curl, awkwardness from browsers, and a load-balancing problem that catches almost everyone: long-lived HTTP/2 connections do not spread across backends by themselves."
architecture:
  svg: grpc/architecture.svg
  alt: "gRPC architecture: one proto file generating client stubs and server skeletons in several languages, with calls travelling as HTTP/2 streams over one channel"
  caption: A contract file, two generated halves, and one long-lived HTTP/2 connection carrying every call as its own stream.
howItWorks:
  - md: The first animation follows a unary call down to the frames, including the trailers that carry the outcome. The second is deadline propagation — the feature that separates a gRPC estate that degrades gracefully from one that collapses.
  - note: the status arrives AFTER the body. that one fact explains most of gRPC's odd corners.
  - anim:
      id: anim-call
      title: 1 · One unary call, down to the frames
      svg: grpc/anim-call.svg
      alt: "A gRPC unary call: the stub serialises a request, a new HTTP/2 stream carries headers, a length-prefixed message and trailers back with the status"
      steps:
        - say: Application code calls a method on a generated stub. It looks and types like a local call — which is the entire point, and also why the costs below are easy to forget.
          show: [ gr-msg ]
          hl: [ gr-client ]
          text:
            gr-msgt: GetOrderRequest { id }
            gr-s1: a typed method, checked at compile time
        - say: "The stub serialises the request to protobuf: field numbers and values, no field names, no whitespace. 24 bytes where the JSON equivalent would be about 110."
          text:
            gr-msgt: 0a 08 4f 52 44 2d 39 38 30 32
            gr-s1: "protobuf: 24 bytes   (JSON: ~110 bytes)"
            gr-s2: no field names on the wire — numbers only
        - say: The channel is already open. One TCP connection, one TLS handshake, both done at startup — so this call pays neither.
          hl: [ gr-chan ]
          unhl: [ gr-client ]
          move:
            gr-msg: [ 214, 0 ]
          text:
            gr-chant: open since startup · READY
            gr-s3: "connection setup: 0 ms (already paid)"
          fill:
            gr-s3: "#2f6b3f"
        - say: A new HTTP/2 stream is opened for this call — number 7. Streams are cheap, independent and concurrent; thousands can be in flight on this one connection.
          hl: [ gr-stream ]
          unhl: [ gr-chan ]
          move:
            gr-msg: [ 414, 0 ]
          text:
            gr-streamt: opened · 1,840 others in flight
            gr-w1: HEADERS  :method POST
            gr-w2: "         :path /orders.v1.OrderService/GetOrder"
            gr-w3: "         content-type: application/grpc"
        - say: The method is the path and the metadata are headers — including `grpc-timeout`, which is how the deadline crosses the wire. HPACK compresses the repeated ones to almost nothing.
          text:
            gr-w4: "         grpc-timeout: 500m        ← the deadline"
            gr-w5: "         authorization: Bearer …   ← HPACK: ~4 bytes after the first call"
            gr-s4: "headers: ~12 bytes on the wire"
          fill:
            gr-s4: "#2f6b3f"
        - say: "Then the body: a DATA frame carrying one compressed-flag byte, a four-byte length, and the message. That five-byte prefix is what lets a stream carry many messages one after another."
          text:
            gr-w6: DATA     00 00 00 00 18 | 0a 08 4f 52 44 …   (flag, length, message)
            gr-s5: the length prefix is why streaming is the same mechanism
        - say: The server — written in Go, which the C# caller neither knows nor cares about — deserialises using the same `.proto`, and its context already carries 500 ms minus the network time.
          hl: [ gr-server ]
          unhl: [ gr-stream ]
          move:
            gr-msg: [ 606, 0 ]
          text:
            gr-msgt: GetOrder(req, ctx)
            gr-servert: "budget: 496 ms remaining"
            gr-wt: HTTP/2 frames on stream 7 — the response
            gr-w1: ← HEADERS  :status 200
            gr-w2: "           content-type: application/grpc"
            gr-w3: "&nbsp;"
            gr-w4: "&nbsp;"
            gr-w5: "&nbsp;"
            gr-w6: "&nbsp;"
        - say: The response headers say 200 and nothing about success. The real outcome has not been decided yet — which is exactly what makes streaming possible.
          text:
            gr-w3: ← DATA     [flag][len][Order protobuf]
            gr-s1: HTTP 200 means "the HTTP exchange worked"
            gr-s2: it says nothing at all about whether the call succeeded
            gr-s3: "&nbsp;"
            gr-s4: "&nbsp;"
            gr-s5: "&nbsp;"
          fill:
            gr-s2: "#c53b3b"
        - say: "The outcome arrives last, in **trailers** — headers sent after the body. `grpc-status: 0` is success; a failure here would be a code and a message, after bytes had already been sent."
          hl: [ gr-stream ]
          unhl: [ gr-server ]
          move:
            gr-msg: [ 414, 0 ]
          text:
            gr-msgt: ← Order + trailers
            gr-w4: "← TRAILERS grpc-status: 0"
            gr-w5: "           grpc-message:"
            gr-s1: trailers are why a server can fail halfway through a stream
            gr-s2: and why browsers need gRPC-Web
            gr-s3: and why proxies must support HTTP/2 trailers
          fill:
            gr-s2: "#5f6f66"
        - say: "The stub deserialises and returns a typed `Order`. End to end: about 1.2 ms, 36 bytes on the wire, no connection setup, and a typed object at both ends."
          hl: [ gr-client ]
          unhl: [ gr-stream ]
          move:
            gr-msg: [ 0, 0 ]
          text:
            gr-msgt: Order
            gr-streamt: closed · slot reused
            gr-s1: "round trip: 1.2 ms"
            gr-s2: "bytes on the wire: 36"
            gr-s3: "allocations: one message, no string parsing"
            gr-s4: "&nbsp;"
            gr-s5: "&nbsp;"
          fill:
            gr-s1: "#2f6b3f"
            gr-s2: "#2f6b3f"
        - say: "And the sting in the tail: all of that travelled on <em>one</em> connection. An L4 load balancer sees one connection and sends every call to one backend, while its dashboards show perfect balance."
          hl: [ gr-chan ]
          unhl: [ gr-client ]
          text:
            gr-phase: one connection, thousands of calls — and a load balancer that cannot see them
            gr-v: balance per request (round_robin, or an L7 proxy), never per connection
          fill:
            gr-verd: "#f9e3df"
            gr-v: "#c53b3b"
  - anim:
      id: anim-deadline
      title: 2 · Deadlines propagate; cancellation flows back
      svg: grpc/anim-deadline.svg
      alt: A deadline set by the caller shrinking as it propagates through three services, and cancellation flowing back through the chain when it expires
      steps:
        - say: A checkout request arrives. The gateway decides the whole thing gets 2 seconds — not per hop, but in total, because that is what the user is actually waiting for.
          hl: [ gw-c ]
          text:
            gw-b1: budget 2000ms
            gw-p1: gateway sets deadline = now + 2000ms
        - say: It calls checkout. The library turns the deadline into a `grpc-timeout` header, so the budget travels with the call rather than living only in the caller.
          hl: [ gw-a ]
          unhl: [ gw-c ]
          text:
            gw-at: "grpc-timeout: 1980m"
            gw-b2: budget 1980ms
            gw-p2: checkout receives 1980ms — 20ms already spent on the network
        - say: Checkout needs pricing. It does <em>not</em> start a fresh timeout — it passes on what is left of the budget it was given.
          hl: [ gw-b ]
          unhl: [ gw-a ]
          text:
            gw-bt: "grpc-timeout: 1890m"
            gw-b3: budget 1890ms
            gw-p3: pricing receives 1890ms — the budget shrinks, it never resets
        - say: "Pricing calls tax, which is having a bad day. Tax gets what remains: 1,820 milliseconds, and it knows it."
          hl: [ gw-d ]
          unhl: [ gw-b ]
          text:
            gw-dt: "grpc-timeout: 1820m · working"
            gw-b4: budget 1820ms
            gw-p4: tax receives 1820ms and starts a query that will take 4 seconds
          fill:
            gw-d: "#fbf3c4"
        - say: At 1,820 ms the deadline expires. Tax’s own context is cancelled, its stream is reset, and it returns `DEADLINE_EXCEEDED` rather than finishing work nobody is waiting for.
          text:
            gw-dt: DEADLINE_EXCEEDED
            gw-b4: expired
            gw-p4: "tax: context cancelled at 1820ms → DEADLINE_EXCEEDED, query abandoned"
          fill:
            gw-d: "#f9e3df"
            gw-dt: "#c53b3b"
        - say: And cancellation flows back up. Pricing’s call fails, checkout’s fails, the gateway returns an error — and every one of those handlers stops working at the same moment.
          hl: [ gw-b, gw-a, gw-c ]
          unhl: [ gw-d ]
          text:
            gw-bt: cancelled
            gw-at: cancelled
            gw-ct: returns 504 at ~1.85s
            gw-p5: one expiry, four handlers stopped — no orphaned work anywhere in the tree
          fill:
            gw-p5: "#2f6b3f"
        - say: Now the version without propagation, which is what you get by default in most codebases. Each service sets its own 2-second timeout, because that seemed reasonable in isolation.
          unhl: [ gw-b, gw-a, gw-c ]
          text:
            gw-phase: the same chain, with each hop inventing its own timeout
            gw-b1: timeout 2000ms
            gw-b2: timeout 2000ms
            gw-b3: timeout 2000ms
            gw-b4: timeout 2000ms
            gw-ct: waits 2000ms
            gw-at: waits 2000ms
            gw-bt: waits 2000ms
            gw-dt: waits 2000ms
            gw-p1: "each hop: \"2 seconds sounds fine\""
            gw-p2: "&nbsp;"
            gw-p3: "&nbsp;"
            gw-p4: "&nbsp;"
            gw-p5: "&nbsp;"
        - say: The gateway gives up after 2 seconds and the user sees an error. But nothing downstream was told, so tax is still running, pricing is still waiting for tax, and checkout is still waiting for pricing.
          hl: [ gw-b, gw-d ]
          text:
            gw-ct: gave up at 2000ms
            gw-p2: "gateway: returns 504 to the user at 2000ms"
            gw-p3: "tax, pricing and checkout: still working, still holding connections"
          fill:
            gw-p3: "#c53b3b"
            gw-d: "#f9e3df"
            gw-b: "#f9e3df"
        - say: Under load that is the whole failure. Every abandoned request still occupies a thread and a connection at three services, so capacity is spent entirely on results nobody will read.
          text:
            gw-p4: at 500 req/s, 2s of orphaned work = 1,000 wasted in-flight calls per service
            gw-p5: the slow dependency did not cause the outage. the missing propagation did.
          fill:
            gw-p4: "#c53b3b"
            gw-p5: "#c53b3b"
        - say: The fix is two habits. Set a deadline on every outbound call — the default is infinity. And derive each one from the budget you were handed, not from a constant.
          unhl: [ gw-b, gw-d ]
          text:
            gw-phase: two habits, and the whole class of failure disappears
            gw-p1: 1. always set a deadline — the default in every language is infinity
            gw-p2: 2. derive it from context.time_remaining() / ServerCallContext.Deadline
            gw-p3: 3. pass the cancellation token into every database and HTTP call you make
            gw-p4: "&nbsp;"
            gw-p5: "&nbsp;"
          fill:
            gw-p1: "#2f6b3f"
            gw-p2: "#2f6b3f"
            gw-p3: "#2f6b3f"
            gw-b: "#e8ece2"
            gw-d: "#e8ece2"
        - say: And remember retries share the budget. Three attempts inside 500 ms is not three 500 ms attempts — it is 500 ms in total, which is usually the right answer and rarely the configured one.
          text:
            gw-b1: budget 2000ms
            gw-b2: budget 1980ms
            gw-b3: budget 1890ms
            gw-b4: budget 1820ms
            gw-p1: a deadline is a budget for the whole subtree, retries included
            gw-v: set one on every call · derive it from the one you were given · honour cancellation
          fill:
            gw-verd: "#e3eedc"
concepts:
  - term: Protocol Buffers
    short: "The IDL and the binary wire format: a schema both sides compile, and bytes neither side can read by eye."
    see: [ Field numbers, Schema evolution, Message size ]
    detail: |-
      A `.proto` file declares messages and services. `protoc` turns it into types and stubs in your language. On the wire each field is a varint tag — field number and wire type — followed by its value, with no field names and no padding, which is why payloads are typically 3–10× smaller than the equivalent JSON and parse several times faster.

      The cost is that a packet capture is unreadable without the schema, and so is a message sitting in a log or a queue. That trade is fine between services you own and poor for anything a human has to debug by eye.

      #### Rough comparison

      |  | JSON | Protobuf |
      | --- | --- | --- |
      | A small order message | ~420 B | ~95 B |
      | Parse speed | baseline | 3–10× faster |
      | Readable in a log | yes | no |
      | Schema required to read | no | yes |

      #### How it relates

      - Protobuf is useful without gRPC — as a message format on **Kafka**, for instance — and gRPC can in principle carry other codecs.
  - term: Field numbers
    short: The small integers that are the real identity of every field — names are only for humans.
    see: [ Protocol Buffers, Schema evolution ]
    detail: |-
      Each field carries its number on the wire, not its name. Renaming a field is therefore a non-event for compatibility; changing its <em>number</em>, or reusing one that used to mean something else, silently reinterprets old data as the new type.

      Numbers 1–15 encode their tag in a single byte, so spend them on the fields present in every message. Always `reserved` the numbers and names of deleted fields, so nobody can accidentally resurrect them.

      #### Common values

      | Range | Tag size | Use for |
      | --- | --- | --- |
      | 1–15 | 1 byte | hot, always-present fields |
      | 16–2047 | 2 bytes | everything else |
      | 19000–19999 | — | reserved by protobuf itself |

      ```
      message Order {
        reserved 4, 7 to 9;              // never reuse these
        reserved "legacy_total";
        string id = 1;
        int64  amount_cents = 2;
      }
      ```

      #### How it relates

      - In proto3 every field is optional on the wire, so adding one is always backward compatible — which is what makes rolling deploys safe.
  - term: The four call types
    short: Unary, server streaming, client streaming and bidirectional — all on one HTTP/2 stream.
    see: [ HTTP/2 streams, Flow control, Deadlines ]
    figure:
      svg: grpc/figure-the-four-call-types.svg
      alt: The four gRPC call types shown as arrows between client and server
    detail: |-
      Because a stream can carry a sequence of messages in each direction, the method signature chooses the shape. Streaming is not an add-on here — it is the same mechanism with different cardinalities, which is why it is so much less painful than bolting streaming onto REST.

      ::figure::

      #### How it relates

      - Streaming calls hold server state and a stream slot for their lifetime, so they need their own limits — they are not free.
  - term: HTTP/2 streams
    short: Each call is an independent stream on a shared connection — which is both the performance story and the load-balancing problem.
    see: [ Channel, The four call types, Load balancing ]
    detail: |-
      One TCP connection, one TLS handshake, and then thousands of concurrent calls as multiplexed streams with no head-of-line blocking at the HTTP layer. Headers are HPACK-compressed, so repeated metadata is nearly free. This is why gRPC is fast in a chatty service mesh.

      It is also why an L4 load balancer fails here: it balances <em>connections</em>, and there is one long-lived connection per client. Three clients can spread perfectly across three backends while 90% of the requests land on one.

      #### Common values

      | Setting | Typical |
      | --- | --- |
      | Max concurrent streams | 100 (often raised) |
      | Max connection age | 30–60 min, to force re-dial |
      | Keepalive ping | ≥ 30 s; too aggressive and the server resets you |
      | Initial window | 64 KB, raised for streaming |

      #### How it relates

      - The full failure mode and its fixes are on the **L4 vs L7 load balancing** page — it is the canonical example.
  - term: Status and trailers
    short: The outcome arrives after the body, in trailers — a design choice with wide consequences.
    see: [ HTTP/2 streams, Metadata, gRPC-Web ]
    detail: |-
      A call ends with a `grpc-status` and optional `grpc-message` in HTTP/2 trailers. The HTTP status is almost always 200, even for failures, because the HTTP exchange itself succeeded. This is what lets a server start streaming results and only later discover an error — it has not committed to an outcome by sending headers.

      The consequences show up everywhere: proxies must support trailers, browsers cannot read them (hence **gRPC-Web**), and monitoring based on HTTP status reports a perfectly healthy service while every call fails with `INTERNAL`.

      #### Codes worth knowing

      | Code | Meaning | Retry? |
      | --- | --- | --- |
      | `OK` (0) | success | — |
      | `INVALID_ARGUMENT` (3) | caller's fault | no |
      | `DEADLINE_EXCEEDED` (4) | budget gone | rarely |
      | `NOT_FOUND` (5) | no such entity | no |
      | `RESOURCE_EXHAUSTED` (8) | quota or rate limit | with backoff |
      | `FAILED_PRECONDITION` (9) | wrong state — do not retry | no |
      | `ABORTED` (10) | conflict — retry higher up | yes |
      | `UNAVAILABLE` (14) | transient | yes |

      #### How it relates

      - Alert on `grpc-status`, never on HTTP status — the same trap GraphQL has with its errors array.
  - term: Metadata
    short: "Key-value pairs sent as HTTP/2 headers: auth tokens, trace context, tenant ids."
    see: [ Status and trailers, Interceptors, Deadlines ]
    detail: |-
      Metadata is the out-of-band channel. Keys ending in `-bin` carry base64-encoded binary values; everything else is ASCII, and keys are lower-cased. Initial metadata goes with the request headers, and trailing metadata can accompany the final status.

      Because HPACK compresses repeated headers on a long-lived connection, metadata that is the same on every call is close to free — which makes it the natural place for tokens, `traceparent` and tenant identifiers.

      #### Common keys

      | Key | Carries |
      | --- | --- |
      | `authorization` | `Bearer …` |
      | `traceparent` | W3C trace context |
      | `grpc-timeout` | the deadline, set by the library |
      | `x-tenant-id` | your own routing keys |
      | `grpc-status-details-bin` | rich typed error details |

      #### How it relates

      - Attach it in an **interceptor**, not at every call site; that is the difference between a convention and a guarantee.
  - term: Deadlines
    short: An absolute point in time, sent with the call and propagated down the chain — not a per-hop timeout.
    see: [ Cancellation, Status and trailers, Retries ]
    detail: |-
      The caller sets a deadline; the library converts it to a `grpc-timeout` header. A server receiving one knows how long it has, and when it calls another service it passes along <em>what is left</em>. The budget shrinks down the tree instead of each hop inventing its own.

      Two rules follow. Always set one — the default in most languages is infinity, which turns a slow dependency into exhausted threads. And always propagate the incoming deadline rather than starting a fresh timeout, or the chain's total can exceed what the caller is still waiting for.

      #### Common values

      | Call | Deadline |
      | --- | --- |
      | Interactive read | 200–500 ms |
      | Write with side effects | 1–3 s |
      | Batch or report | 30–120 s |
      | Streaming | per message, not per stream |

      #### How it relates

      - Deadline propagation is one of the few genuinely distributed features built into the protocol rather than into your code.
  - term: Cancellation
    short: When a caller gives up, the whole subtree finds out and stops working.
    see: [ Deadlines, HTTP/2 streams, Flow control ]
    detail: |-
      A cancelled or expired call resets its HTTP/2 stream, and the server's handler receives a cancelled context or token. If that handler is itself waiting on downstream calls, their streams reset too, and the signal flows all the way to the leaves.

      That only works if your code honours it: pass the cancellation token into every database call, HTTP request and loop. A handler that ignores it keeps burning a connection and a thread for a result nobody will ever read — which under load is how a slow dependency becomes an outage.

      #### How it relates

      - This is the cheapest load-shedding you have: work for abandoned requests stops by itself, for free.
  - term: Channel
    short: The client-side object holding the connection, name resolution and load-balancing policy — expensive, and meant to be shared.
    see: [ HTTP/2 streams, Load balancing, Retries ]
    detail: |-
      A channel resolves a target name to addresses, maintains a subchannel per address, and applies a load-balancing policy across them. Creating one is costly — DNS, TCP, TLS — so create it once per target and keep it for the process lifetime. Creating a channel per call is the classic performance bug, and it also defeats HTTP/2 multiplexing entirely.

      Channels have state: `IDLE`, `CONNECTING`, `READY`, `TRANSIENT_FAILURE`, `SHUTDOWN`. Watching it is useful — a channel stuck in `TRANSIENT_FAILURE` is a resolution or TLS problem, not a server problem.

      #### Common values

      | Setting | Typical |
      | --- | --- |
      | Lifetime | process-wide singleton |
      | Name resolution | `dns:///`, `xds:///`, or a custom resolver |
      | DNS re-resolve | 30 s — not once at startup |
      | LB policy | `pick_first` (default) or `round_robin` |

      #### How it relates

      - In .NET, register it with `AddGrpcClient` so the factory manages lifetime, handler reuse and DNS refresh for you.
  - term: Load balancing
    short: Spreading calls across backends when one connection carries all of them.
    see: [ Channel, HTTP/2 streams, Retries ]
    detail: |-
      The default `pick_first` policy connects to one address and sends everything there. `round_robin` opens a subchannel to every resolved address and alternates — which is what most internal services actually want, and it requires a resolver that returns all the addresses (headless DNS in Kubernetes, not the `Service` VIP).

      The three workable shapes are: client-side balancing with round robin, an L7 proxy or sidecar balancing per request, or a proxyless mesh using xDS. An L4 balancer in front of gRPC is the one that does not work, and it fails invisibly — connection graphs look perfect while one backend takes everything.

      #### Options

      | Approach | Fits |
      | --- | --- |
      | `round_robin` + headless DNS | internal services, no extra hop |
      | Sidecar / L7 proxy | per-request balancing, central policy |
      | xDS (proxyless mesh) | large estates, dynamic config |
      | L4 balancer | does not spread load — avoid |

      #### How it relates

      - If you must stay on L4, set a maximum connection age so clients re-dial and redistribute periodically.
  - term: Retries
    short: Configured declaratively in the service config, with a budget — not hand-written at every call site.
    see: [ Status and trailers, Deadlines, Channel ]
    detail: |-
      gRPC has built-in retry support driven by a service config: which methods, which status codes, how many attempts, the backoff curve, and a <em>retry throttling</em> budget that disables retries when the ratio of failures gets high. That budget is the part hand-rolled retry logic always lacks, and it is what prevents a retry storm from finishing off a struggling service.

      Only retry on codes that are genuinely safe — `UNAVAILABLE`, sometimes `RESOURCE_EXHAUSTED`. Retrying `ABORTED` or `INTERNAL` on a mutation duplicates work unless the method is idempotent.

      ```
      "retryPolicy": {
        "maxAttempts": 3,
        "initialBackoff": "0.1s",
        "maxBackoff": "1s",
        "backoffMultiplier": 2,
        "retryableStatusCodes": ["UNAVAILABLE"]
      }
      ```

      #### How it relates

      - Retries consume the same deadline, so a 200 ms budget with three attempts means each attempt gets less — see **Retry, backoff & jitter**.
  - term: Flow control
    short: HTTP/2 windows stopping a fast producer from overwhelming a slow consumer, per stream and per connection.
    see: [ The four call types, HTTP/2 streams, Message size ]
    detail: |-
      Each stream has a receive window; the sender may only have that many unacknowledged bytes in flight, and the receiver sends `WINDOW_UPDATE` as it consumes. Backpressure is therefore built in: a server streaming faster than a client reads simply blocks, rather than buffering without limit.

      The default 64 KB window is small for high-throughput streaming over a high-latency link, which is the usual cause of "gRPC streaming is slower than I expected". Raising it, or enabling dynamic window sizing, often multiplies throughput.

      #### How it relates

      - This is **backpressure** provided by the transport — but only if your handler actually awaits writes instead of queueing them itself.
  - term: Interceptors
    short: "Middleware for calls: auth, logging, tracing, retries and error mapping in one place."
    see: [ Metadata, Status and trailers, Deadlines ]
    detail: |-
      Interceptors wrap unary and streaming calls on both client and server, so cross-cutting concerns live in one place instead of in every method. The standard set: attach credentials, inject and extract trace context, record metrics per method and status, enforce deadlines, and map domain exceptions to proper status codes.

      The error mapping one matters most. Without it every unhandled exception becomes `UNKNOWN`, and callers cannot tell "you sent nonsense" from "try again later" — which makes correct retry behaviour impossible for them.

      #### How it relates

      - Streaming interceptors run once per stream, not per message; per-message concerns go inside the handler.
  - term: gRPC-Web
    short: How browsers call gRPC at all, and why it cannot be the same protocol.
    see: [ Status and trailers, HTTP/2 streams, JSON transcoding ]
    detail: |-
      Browsers cannot control HTTP/2 frames or read trailers, so native gRPC is impossible from a page. gRPC-Web is a compatible protocol that encodes trailers into the response body and works over HTTP/1.1 or HTTP/2, usually with a proxy translating — Envoy, or middleware in the server itself.

      The limitation to plan around: client streaming and bidirectional streaming are not supported. Server streaming works. If a browser is a first-class client, consider plain HTTP with **JSON transcoding** instead of adding a translation layer.

      #### How it relates

      - CORS, preflight and exposing `grpc-status` headers are all part of this; budget for the configuration, not just the library.
  - term: JSON transcoding
    short: Serving the same service as a REST/JSON API from annotations in the proto file.
    see: [ gRPC-Web, Protocol Buffers, Reflection ]
    detail: |-
      With `google.api.http` annotations, a method can be exposed at a REST path — `GET /v1/orders/{id}` — with JSON in and out, while internal callers keep using native gRPC. The server, or a gateway, handles the translation.

      This is often the right compromise: protobuf efficiency and generated clients between services, an ordinary JSON API for browsers, partners and curl. One contract, two surfaces, no duplicate implementation.

      ```
      rpc GetOrder(GetOrderRequest) returns (Order) {
        option (google.api.http) = { get: "/v1/orders/{id}" };
      }
      ```

      #### How it relates

      - It also gives you OpenAPI generation, which is usually what a partner integration actually needs.
  - term: Reflection
    short: The server describing its own services at runtime, which is what makes grpcurl possible.
    see: [ JSON transcoding, Protocol Buffers ]
    detail: |-
      Without the `.proto` file, a binary request is unconstructable by hand. The reflection service lets a client ask the server for its service descriptors, so tools like `grpcurl` and Postman can list methods and build messages from plain JSON.

      It is enormously useful in development and a free inventory of your internal API in production. The usual posture is on in development and staging, off in production, with descriptors distributed as a file to the tools that need them.

      #### How it relates

      - Pair it with health checking (`grpc.health.v1.Health`), which gives probes and balancers a standard way to ask if you are ready.
  - term: Message size
    short: The 4 MB default receive limit, and why hitting it means you wanted streaming.
    see: [ Flow control, The four call types, Protocol Buffers ]
    detail: |-
      gRPC defaults to a 4 MB maximum received message size. The first instinct is to raise it; the better reaction is usually to switch to server streaming, so the data arrives as many small messages with flow control instead of one buffer that must be fully materialised in memory on both sides.

      A single huge message also cannot be cancelled usefully, cannot report partial progress and allocates a large contiguous buffer. Streaming fixes all three.

      #### Common values

      | Setting | Default | Advice |
      | --- | --- | --- |
      | Max receive size | 4 MB | raise deliberately, not reflexively |
      | Max send size | unlimited (client) | bound it |
      | Streaming chunk | — | 32–256 KB per message |

      #### How it relates

      - For genuinely large binaries, a signed URL to object storage beats both options.
  - term: Schema evolution
    short: Adding fields is safe, changing numbers and types is not, and both sides must be able to deploy independently.
    see: [ Field numbers, Protocol Buffers ]
    detail: |-
      In proto3, unknown fields are preserved rather than rejected, and every field has a default when absent. So adding a field, adding a method or adding an enum value is backward compatible; removing a field, reusing a number, changing a type or renaming an enum value is not.

      The practical discipline is a schema registry or a linter in CI that diffs the proto against the deployed version and fails on breaking changes. `buf breaking` does this well, and it is the gRPC equivalent of a schema diff check in GraphQL.

      #### Breaking or not

      | Change | Safe? |
      | --- | --- |
      | Add a field with a new number | yes |
      | Rename a field | yes on the wire, breaks source |
      | Change a field's type | no |
      | Reuse a deleted field number | no — and silently wrong |
      | Add an RPC | yes |
      | Remove or rename an RPC | no |

      #### How it relates

      - Reserve deleted numbers and names in the message; it turns a silent data corruption into a compile error.
commands:
  heading: Proto & code
  tocLabel: Proto & code
  groups:
    - group: The contract
      items:
        - code: |-
            syntax = "proto3";
            package orders.v1;                       // version in the package: v2 can coexist

            import "google/protobuf/timestamp.proto";

            service OrderService {
              rpc GetOrder       (GetOrderRequest)    returns (Order);                 // unary
              rpc ListOrders     (ListOrdersRequest)  returns (stream Order);          // server streaming
              rpc ImportOrders   (stream Order)       returns (ImportSummary);         // client streaming
              rpc WatchOrders    (stream WatchRequest) returns (stream OrderEvent);    // bidirectional
            }

            message Order {
              reserved 4, 7 to 9;                    // deleted fields: never reuse these numbers
              reserved "legacy_total";

              string id                        = 1;  // 1-15 cost one byte — spend them on hot fields
              string customer_id               = 2;
              int64  total_cents               = 3;  // money as integer minor units, never float
              OrderStatus status               = 5;
              google.protobuf.Timestamp placed = 6;
              repeated OrderLine lines         = 10;
            }

            enum OrderStatus {
              ORDER_STATUS_UNSPECIFIED = 0;          // zero value MUST be the unknown case
              ORDER_STATUS_DRAFT       = 1;
              ORDER_STATUS_PLACED      = 2;
              ORDER_STATUS_SHIPPED     = 3;
            }

            message GetOrderRequest  { string id = 1; }
            message ListOrdersRequest { string customer_id = 1; int32 page_size = 2; string page_token = 3; }
          what: "Four conventions that save years: version in the package, reserved numbers, an `UNSPECIFIED` zero enum value, and money as integers."
    - group: Server and client
      items:
        - lang: csharp
          code: |-
            // C# — the server: override the generated base, map errors to real status codes
            public sealed class OrderServiceImpl(IOrderRepository repo) : OrderService.OrderServiceBase
            {
                public override async Task<Order> GetOrder(GetOrderRequest request, ServerCallContext context)
                {
                    if (string.IsNullOrWhiteSpace(request.Id))
                        throw new RpcException(new Status(StatusCode.InvalidArgument, "id is required"));

                    // honour the caller's deadline and cancellation all the way down
                    var order = await repo.FindAsync(request.Id, context.CancellationToken);

                    return order is null
                        ? throw new RpcException(new Status(StatusCode.NotFound, $"no order {request.Id}"))
                        : order.ToProto();
                }

                public override async Task ListOrders(ListOrdersRequest request,
                    IServerStreamWriter<Order> responseStream, ServerCallContext context)
                {
                    await foreach (var order in repo.StreamAsync(request.CustomerId, context.CancellationToken))
                        await responseStream.WriteAsync(order.ToProto());   // awaiting = flow control works
                }
            }

            // Program.cs
            builder.Services.AddGrpc(o => o.MaxReceiveMessageSize = 4 * 1024 * 1024);
            builder.Services.AddGrpcHealthChecks();
            var app = builder.Build();
            app.MapGrpcService<OrderServiceImpl>();
            app.MapGrpcHealthChecksService();
            if (app.Environment.IsDevelopment()) app.MapGrpcReflectionService();   // dev only
          what: "Two things carry the reliability: mapping exceptions to meaningful status codes, and passing `context.CancellationToken` into every downstream call."
        - lang: csharp
          code: |-
            // C# — the client: ONE channel for the process, with retries and load balancing
            builder.Services
                .AddGrpcClient<OrderService.OrderServiceClient>(o =>
                {
                    o.Address = new Uri("dns:///orders.internal:5001");    // all addresses, not one VIP
                })
                .ConfigureChannel(c =>
                {
                    c.Credentials = ChannelCredentials.SecureSsl;
                    c.ServiceConfig = new ServiceConfig
                    {
                        LoadBalancingConfigs = { new RoundRobinConfig() }, // default is pick_first: ONE backend
                        MethodConfigs =
                        {
                            new MethodConfig
                            {
                                Names = { MethodName.Default },
                                RetryPolicy = new RetryPolicy
                                {
                                    MaxAttempts = 3,
                                    InitialBackoff = TimeSpan.FromMilliseconds(100),
                                    MaxBackoff = TimeSpan.FromSeconds(1),
                                    BackoffMultiplier = 2,
                                    RetryableStatusCodes = { StatusCode.Unavailable },   // NOT Internal, NOT Aborted
                                },
                            },
                        },
                    };
                });

            // at the call site: always a deadline. the default is infinity.
            var order = await client.GetOrderAsync(
                new GetOrderRequest { Id = "ORD-9802" },
                deadline: DateTime.UtcNow.AddMilliseconds(500),
                cancellationToken: ct);
          what: "Three defaults that need changing in every deployment: `pick_first`, no retry policy, and an infinite deadline."
        - lang: python
          code: |-
            # Python — async server and client, same contract
            import grpc
            from grpc import aio
            import orders_pb2, orders_pb2_grpc

            class OrderService(orders_pb2_grpc.OrderServiceServicer):
                async def GetOrder(self, request, context: aio.ServicerContext) -> orders_pb2.Order:
                    if not request.id:
                        await context.abort(grpc.StatusCode.INVALID_ARGUMENT, "id is required")

                    remaining = context.time_remaining()            # the caller's budget, in seconds
                    order = await repo.find(request.id, timeout=remaining)
                    if order is None:
                        await context.abort(grpc.StatusCode.NOT_FOUND, f"no order {request.id}")
                    return order.to_proto()

                async def ListOrders(self, request, context):
                    async for order in repo.stream(request.customer_id):
                        if context.cancelled():                     # the caller gave up: stop working
                            return
                        yield order.to_proto()

            # the client: one channel per target, reused for the process lifetime
            channel = aio.insecure_channel(
                "dns:///orders.internal:5001",
                options=[("grpc.lb_policy_name", "round_robin"),
                         ("grpc.max_receive_message_length", 4 * 1024 * 1024),
                         ("grpc.keepalive_time_ms", 30_000)],
            )
            client = orders_pb2_grpc.OrderServiceStub(channel)

            order = await client.GetOrder(orders_pb2.GetOrderRequest(id="ORD-9802"), timeout=0.5)
          what: "`context.time_remaining()` is the propagated budget — pass it to whatever you call next instead of inventing a new timeout."
    - group: Building and debugging
      items:
        - lang: bash
          code: |-
            # buf: lint, generate, and fail the build on breaking changes
            buf lint
            buf generate
            buf breaking --against '.git#branch=main'     # the CI gate that saves you from silent breakage

            # protoc directly, if you prefer
            protoc --proto_path=proto --csharp_out=src/Generated --grpc_out=src/Generated \
                   --plugin=protoc-gen-grpc=grpc_csharp_plugin proto/orders/v1/orders.proto
            python -m grpc_tools.protoc -Iproto --python_out=. --grpc_python_out=. proto/orders/v1/orders.proto
          what: "`buf breaking` is the one to wire into CI — reusing a field number is otherwise a silent data corruption, not an error."
        - lang: bash
          code: |-
            # grpcurl: curl for gRPC. needs reflection, or a descriptor set.
            grpcurl -plaintext localhost:5001 list
            grpcurl -plaintext localhost:5001 list orders.v1.OrderService
            grpcurl -plaintext localhost:5001 describe orders.v1.Order

            grpcurl -plaintext -d '{"id":"ORD-9802"}' \
                    -H 'authorization: Bearer TOKEN' \
                    -max-time 2 \
                    localhost:5001 orders.v1.OrderService/GetOrder

            # without reflection, compile a descriptor set and point at it
            buf build -o descriptors.binpb
            grpcurl -protoset descriptors.binpb -d '{"id":"ORD-9802"}' orders.internal:5001 orders.v1.OrderService/GetOrder

            # health check — the standard service probes and balancers use
            grpcurl -plaintext localhost:5001 grpc.health.v1.Health/Check
          what: Reflection is what makes gRPC debuggable at all; without it you cannot hand-construct a request, because there are no field names on the wire.
        - lang: bash
          code: |-
            # diagnosing the classic problems
            GRPC_VERBOSITY=debug GRPC_TRACE=http,channel,subchannel ./myclient   # what the channel is doing

            # "gRPC is slow" — is one backend taking everything?
            kubectl exec deploy/client -- grpcurl -plaintext localhost:5001 grpc.health.v1.Health/Check
            kubectl top pods -l app=orders        # 90% CPU on ONE pod and idle on the others = L4 balancing

            # headless Service: returns every pod IP, so round_robin has something to round-robin over
            kubectl get endpoints orders-headless -o wide
          what: If one pod is hot and the rest idle while connection counts look even, it is connection-level balancing — not a capacity problem.
prosCons:
  good:
    heading: Pros
    items:
      - "Small, fast payloads: typically 3–10× smaller than JSON and much quicker to parse."
      - One contract generates typed clients and servers in a dozen languages.
      - "HTTP/2 multiplexing: thousands of concurrent calls over one connection, no head-of-line blocking."
      - Streaming in all four directions is first-class, with transport-level flow control.
      - Deadlines and cancellation propagate through the call tree automatically.
      - Retries, backoff, retry budgets and load-balancing policy are declarative configuration.
      - A rich, precise status code vocabulary that makes correct client behaviour possible.
  bad:
    heading: Cons
    items:
      - "Binary on the wire: no curl, no readable logs, no debugging without the schema."
      - A code-generation step in every build, in every language.
      - Browsers need gRPC-Web, which drops client and bidirectional streaming.
      - L4 load balancers do not spread load, and the failure is invisible on connection metrics.
      - Proxies, gateways and WAFs need explicit HTTP/2 and trailer support.
      - HTTP-status-based monitoring reports healthy while every call fails.
      - Breaking changes to field numbers corrupt data silently rather than failing loudly.
when:
  note: "inside the fence: gRPC. facing the public internet: think hard, then probably REST."
  good:
    heading: Use it when…
    items:
      - Services call each other frequently and latency and payload size matter.
      - Several languages must share one contract, with generated clients.
      - Streaming is part of the problem rather than an afterthought.
      - You want deadlines, cancellation and retry budgets from the platform rather than from your code.
      - Both sides of the wire are yours, so a binary format costs nothing in discoverability.
  bad:
    heading: Avoid it when…
    items:
      - Browsers are a primary client. Use **REST**, or **JSON transcoding** in front of the same service.
      - You are publishing a public API for third parties. Use **REST** — curl and a browser tab are the real onboarding path.
      - Clients need to choose their own response shape. Use **GraphQL**.
      - Traffic is naturally asynchronous and should survive a restart. Use a **message broker**.
      - Your infrastructure cannot do HTTP/2 end to end, including trailers. Fix that first.
      - It is two services and a handful of calls. The build step and tooling will cost more than they save.
useCases:
  - title: Internal service-to-service calls
    body: Twenty services in four languages. One proto repository is the contract, clients are generated, deadlines propagate across the whole call tree, and payloads are a fraction of the JSON equivalent — which at a million calls a minute is real money.
  - title: Streaming a large result set
    body: "An export that would be a 300 MB JSON response becomes a server-streaming call: the client processes records as they arrive, neither side buffers the whole thing, and flow control stops a fast producer from drowning a slow consumer."
  - title: Telemetry ingestion
    body: Thousands of agents each hold one connection and client-stream metrics continuously. One connection per agent, no per-request handshake, and backpressure handled by the transport rather than by an application queue.
  - title: Control planes
    body: "A bidirectional stream between a central controller and every node: config pushed down, state reported up, on one long-lived connection. It is the model xDS uses, and the reason service meshes are built this way."
  - title: One service, two surfaces
    body: Internal callers use native gRPC; the browser and partners get REST and JSON through transcoding annotations in the same proto file. One implementation, one contract, no duplicated handlers.
gotchas:
  items:
    - mistake: No deadline
      why: The default is infinity. A slow dependency means calls that never return, threads and connections held for ever, and an outage that spreads upstream one service at a time.
      fix: set a deadline on every call, propagate the remaining budget downstream instead of starting a fresh timeout, and alert on `DEADLINE_EXCEEDED` rates per method.
    - mistake: A channel per call
      why: Each call does DNS, TCP and TLS, so latency is dominated by setup, ports run out under load, and HTTP/2 multiplexing never happens at all.
      fix: one channel per target for the process lifetime. In .NET use `AddGrpcClient`; in Python create the channel at startup and share it.
    - mistake: Behind an L4 load balancer
      why: Connections distribute perfectly and requests do not distribute at all. One backend sits at 90% CPU, newly scaled pods receive nothing, and every connection-based dashboard looks healthy.
      fix: client-side `round_robin` over a headless DNS name, or an L7 proxy or sidecar balancing per request. If neither is possible, set a maximum connection age so clients re-dial.
    - mistake: Reusing a field number
      why: Field 4 was `legacy_total` and is now `discount_code`. An old client's integer is parsed as a string. No error, no log line — just wrong data in production.
      fix: "`reserved` every deleted number and name, and run `buf breaking` in CI against the deployed schema."
    - mistake: Everything is UNKNOWN
      why: Unhandled exceptions all surface as status 2. Callers cannot distinguish a bad request from a transient failure, so they either retry everything or nothing.
      fix: a server interceptor that maps domain exceptions to proper codes — `INVALID_ARGUMENT`, `NOT_FOUND`, `FAILED_PRECONDITION`, `UNAVAILABLE` — and never leak stack traces in the message.
    - mistake: Retrying unsafe codes
      why: "`INTERNAL` and `ABORTED` are added to the retry policy because they look transient. A mutation that already ran is replayed, and an order is placed twice."
      fix: retry `UNAVAILABLE`, and `RESOURCE_EXHAUSTED` with backoff. Make mutations idempotent with a key, and keep the retry throttling budget enabled.
    - mistake: Ignoring the cancellation token
      why: The caller gave up two seconds ago; the handler is still querying the database and will serialise a response nobody will read. Under load, all the capacity is spent on abandoned work.
      fix: thread `ServerCallContext.CancellationToken` (or check `context.cancelled()`) into every downstream call and loop. It is free load shedding.
    - mistake: Monitoring HTTP status
      why: Every gRPC response is HTTP 200, including failures — the real outcome is in the `grpc-status` trailer. Dashboards show 100% availability during a complete outage.
      fix: instrument on `grpc-status` per method, and make sure your proxy and APM actually read trailers rather than the response line.
    - mistake: Raising the message size limit
      why: A response exceeds 4 MB, so the limit is raised to 100 MB. Now both sides allocate 100 MB buffers, the call cannot report progress, and cancelling it frees nothing.
      fix: switch to server streaming with 32–256 KB messages. Raise the limit only when a single logical message genuinely is that large — and consider object storage with a signed URL instead.
    - mistake: Keepalive that gets you banned
      why: A client pings every five seconds to detect dead connections. The server's keepalive enforcement considers that abusive and sends `GOAWAY` with `ENHANCE_YOUR_CALM`, so connections drop constantly.
      fix: keep client ping intervals at 30 seconds or more, and configure the server's minimum permitted interval to match. Both sides must agree.
alternatives:
  columns:
    - Approach
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs gRPC
  rows:
    - self: true
      cells:
        - "**gRPC**"
        - internal service-to-service, streaming
        - Medium
        - free, Apache 2.0
        - —
    - cells:
        - "**REST + JSON**"
        - public APIs, browsers, anything debuggable
        - Low
        - free
        - Human-readable, cacheable, universal — larger, slower, untyped
    - cells:
        - "**GraphQL**"
        - many clients wanting different shapes
        - Medium–High
        - free
        - Client chooses the response; server-chosen here, and far more predictable
    - cells:
        - "**Message broker**"
        - asynchronous, durable work
        - Medium
        - infrastructure
        - Decoupled and replayable; not a request/response call at all
    - cells:
        - "**WebSocket + custom protocol**"
        - browser-facing real time
        - Medium
        - free
        - Works everywhere in a browser; you invent framing, typing and error handling
    - cells:
        - "**Thrift**"
        - existing Thrift estates
        - Medium
        - free
        - Similar idea, smaller ecosystem, no HTTP/2 streaming story
    - cells:
        - "**Cap'n Proto / FlatBuffers**"
        - zero-copy, latency-critical
        - High
        - free
        - No parse step at all; much smaller ecosystems and tooling
  notes:
    - "**Pick REST** for anything public or browser-facing — or expose both from one proto with JSON transcoding."
    - "**Pick GraphQL** when the problem is clients needing different slices of related data, not raw call efficiency."
    - "**Pick a broker** such as **Kafka** when the work should survive the caller going away."
    - "**Pick WebSockets** when the real-time client is a browser and gRPC-Web's limits bite."
    - "**Use gRPC and REST together**: native gRPC inside, transcoded JSON at the edge. It is the common and comfortable arrangement."
