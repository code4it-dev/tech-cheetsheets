overview:
  - "Almost every \"the database is slow\" incident has the same small set of causes: a query reading far more rows than it returns, an N+1 loop in the application, a connection pool that is the wrong size for the work, or a working set that stopped fitting in RAM. The fixes are cheap and local. The expensive fixes — partitioning, sharding, a second datastore — are the ones teams reach for first, and they rarely address the actual cause."
  - So the useful mental model is a ladder, climbed in order of cost. Add the missing index. Fix the query that cannot use one. Change the schema so the hot path is one row. Cache what is read far more than written. Move reads to a replica. Partition when a single table is too large to maintain. Shard only when one machine genuinely cannot hold the write load — because sharding gives up joins, transactions and most of your operational simplicity.
  - "Underneath all of it is one invariant worth memorising: a query is fast when it touches few pages, and a system is stable when concurrency is bounded. Indexes are about the first. Connection pools are about the second, and are governed by Little's Law rather than by optimism."
architecture:
  svg: database-performance/architecture.svg
  alt: The path of a query from application through pool, planner, buffer cache and disk, beside a ladder of fixes ordered by cost
  caption: Cheap fixes are local and reversible; expensive ones change your data model forever. Work down the list, not up it.
howItWorks:
  - md: "The first animation is step 1 of the ladder: what an index actually does to the number of pages a query touches. The second is step 3, and the reason \"pool exhausted\" is almost never a pool problem."
  - note: rows examined ÷ rows returned is the single most useful ratio in query tuning
  - anim:
      id: anim-idx
      title: 1 · 20 million rows, four page reads
      svg: database-performance/anim-idx.svg
      alt: A query scanning a whole table, then traversing a B-tree index, then using a composite and covering index
      steps:
        - say: An orders table with 20 million rows, about 4 GB on disk. The query wants one customer's recent orders — 36 rows out of 20 million.
          hl: [ ix-heap ]
        - say: "With no usable index the planner has only one option: read every page of the table, test every row, and throw almost all of them away."
          hl: [ ix-plan ]
          text:
            ix-ht: reading all 20,000,000 rows
        - say: That ratio — 555,555 rows examined for every row returned — is the number to look at first in any plan. It says "a structure is missing", regardless of how long the query took today.
          unhl: [ ix-heap, ix-plan ]
        - say: Add a B-tree index on `customer_id`. Each node holds hundreds of keys, so even 20 million entries make a tree only four levels deep.
          show: [ ix-btree, ix-btt, ix-n0 ]
          text:
            ix-ratio: "B-tree depth for 20M rows: 4 levels"
        - say: "The lookup descends: root, then the internal node covering the range containing 4711, then the leaf. Three page reads — and page reads, not rows, are what cost time."
          show: [ ix-n1, ix-n2 ]
          hl: [ ix-n0 ]
        - say: "The leaf holds pointers to the 36 matching rows. The engine fetches those 36 heap pages and nothing else: 2,400 ms becomes 0.8 ms."
          show: [ ix-l1 ]
          hl: [ ix-l1 ]
          unhl: [ ix-n0 ]
          text:
            ix-p1: Index Scan using ix_cust
            ix-p2: "rows examined: 36"
            ix-p3: 0.8 ms
            ix-ht: 36 heap pages read
            ix-ratio: "examined / returned = 1 : 1"
          fill:
            ix-p3: "#2f6b3f"
            ix-ht: "#2f6b3f"
        - say: The second predicate, `placed_at`, is still applied <em>after</em> the fetch. Make the index composite on `(customer_id, placed_at)` and both predicates narrow the tree instead.
          unhl: [ ix-l1 ]
          text:
            ix-btt: B-tree on (customer_id, placed_at)
            ix-p2: "rows examined: 4"
            ix-ht: 4 heap pages read
        - say: Column order is the whole trick. `(customer_id, placed_at)` serves a filter on customer, on customer plus date, and sorting by date within a customer — but never a filter on date alone. That is the leftmost-prefix rule.
          text:
            ix-ratio: "leftmost prefix: (a), (a,b) — never (b) alone"
        - say: "One step further: add the selected columns to the index. Now everything the query needs is in the index, the heap is never touched at all, and this becomes an index-only scan."
          hl: [ ix-btree ]
          text:
            ix-btt: … INCLUDE (total)
            ix-p1: Index Only Scan
            ix-ht: "heap: never touched"
            ix-ht2: returns 4 rows
            ix-ht3: reads 0 table pages
          fill:
            ix-ht: "#2f6b3f"
        - say: And the bill. Every one of these indexes must be updated on every insert, on every delete, and on every update that touches an indexed column — plus it competes with your data for the buffer cache. Index what you query, not what you have.
          show: [ ix-hand ]
          unhl: [ ix-btree ]
          text:
            ix-ratio: reads got 3,000x faster · writes got slower
            ix-cost: drop indexes with zero scans — they are pure tax
  - anim:
      id: anim-pool
      title: 2 · "Pool exhausted" is almost never the pool's fault
      svg: database-performance/anim-pool.svg
      alt: A connection pool of ten saturating when query time rises, with waiters queueing and timing out
      steps:
        - say: A service taking 100 requests a second. Each request holds a database connection for about 50 ms. The pool allows 10.
          hl: [ pl-app ]
        - say: "Little's Law gives the answer directly: 100 per second times 0.05 seconds is 5 connections busy at any moment. Half the pool is idle, and that is a healthy system."
          hl: [ pl-calc ]
          unhl: [ pl-app ]
          fill:
            pl-s1: "#e3eedc"
            pl-s2: "#e3eedc"
            pl-s3: "#e3eedc"
            pl-s4: "#e3eedc"
            pl-s5: "#e3eedc"
        - say: "Now a deploy drops an index, and the same query starts taking 200 ms. Nothing about the traffic changed: the arrival rate is still 100 a second."
          hl: [ pl-db ]
          unhl: [ pl-calc ]
          text:
            pl-dbt: "query time: 200 ms"
            pl-dbs: index dropped by a migration
            pl-t: t = 10 s
          fill:
            pl-dbt: "#c53b3b"
        - say: "But the connections needed quadruple: 100 per second times 0.2 seconds is 20. The pool only has 10, so all ten are busy and the rest of the work queues up inside the pool."
          hl: [ pl-pool ]
          unhl: [ pl-db ]
          text:
            pl-c2: = 100/s × 0.2 s = 20
            pl-c3: need 20, have 10
            pl-waitt: "waiting for a connection: 12"
          fill:
            pl-s6: "#f9e3df"
            pl-s7: "#f9e3df"
            pl-s8: "#f9e3df"
            pl-s9: "#f9e3df"
            pl-s10: "#f9e3df"
            pl-s1: "#f9e3df"
            pl-s2: "#f9e3df"
            pl-s3: "#f9e3df"
            pl-s4: "#f9e3df"
            pl-s5: "#f9e3df"
        - say: The queue cannot drain. Requests arrive at 100 a second; the pool completes 10 ÷ 0.2 = 50 a second. The backlog grows by 50 every second, forever — this is not a spike, it is an unstable system.
          hl: [ pl-wait ]
          unhl: [ pl-pool ]
          text:
            pl-waitt: "waiting: 140 and climbing (+50/s)"
            pl-t: t = 13 s
        - say: Wait times cross the acquisition timeout and the app starts failing with "pool exhausted". The error names the pool, which is why the pool is what gets changed.
          hl: [ pl-app ]
          unhl: [ pl-wait ]
          text:
            pl-errt: "timeouts: 60/s"
            pl-waitt: "waiting: 300 · timing out"
            pl-t: t = 20 s
          fill:
            pl-errt: "#c53b3b"
        - say: "So someone raises the pool to 100. Now 100 queries run at once on 16 cores: context switching, more lock contention, more memory per backend. Each query slows to 600 ms and throughput <em>drops</em>."
          show: [ pl-hand ]
          hl: [ pl-db ]
          unhl: [ pl-app ]
          text:
            pl-dbt: "query time: 600 ms"
            pl-dbs: pool raised to 100 — 100 concurrent queries
            pl-dbs2: 16 cores, all of them thrashing
            pl-c2: = 100/s × 0.6 s = 60
            pl-c3: congestion collapse
          fill:
            pl-c3: "#c53b3b"
        - say: The pool was never the problem. It was doing its real job — bounding concurrency — and the saturation was a symptom of the query that got four times slower.
          unhl: [ pl-db ]
          text:
            pl-dbs: a concurrency limiter, not a bottleneck
        - say: Restore the index. Query time returns to 50 ms, the required connections drop back to 5, the queue drains in seconds and the error rate goes to zero. One revert, no config change.
          text:
            pl-dbt: "query time: 50 ms"
            pl-dbs: index restored
            pl-dbs2: " "
            pl-c2: = 100/s × 0.05 s = 5
            pl-c3: 5 connections busy of 10
            pl-waitt: "waiting for a connection: 0"
            pl-errt: no errors
            pl-t: t = 25 s
          fill:
            pl-dbt: "#23362e"
            pl-c3: "#2f6b3f"
            pl-errt: "#5f6f66"
            pl-s1: "#e3eedc"
            pl-s2: "#e3eedc"
            pl-s3: "#e3eedc"
            pl-s4: "#e3eedc"
            pl-s5: "#e3eedc"
            pl-s6: "#e8ece2"
            pl-s7: "#e8ece2"
            pl-s8: "#e8ece2"
            pl-s9: "#e8ece2"
            pl-s10: "#e8ece2"
        - say: "The rule worth keeping: size the pool from `rate × hold time`, keep it small, fail fast on acquisition, and treat saturation as a pointer to what got slower — never as a number to raise."
          hl: [ pl-calc ]
concepts:
  - term: B-tree index
    short: A balanced tree that turns "find rows matching this value" into a handful of page reads instead of a full table scan.
    see: [ Selectivity, Composite index, Sequential scan ]
    detail: |-
      A B-tree keeps keys sorted, with each node holding hundreds of entries, so the tree stays shallow: even a billion-row table is three to five levels deep. A lookup reads one page per level plus one heap page per matching row — typically four to six page reads in total, against millions for a scan.

      Because the keys are ordered, the same structure also serves range predicates, `ORDER BY` and `MIN`/`MAX` without extra work. The cost is on the write side: every insert, update of an indexed column and delete must maintain every index on the table.

      #### Depth and cost

      | Table rows | B-tree depth | Page reads for one key |
      | --- | --- | --- |
      | 10,000 | 2 | 3 |
      | 1,000,000 | 3 | 4 |
      | 1,000,000,000 | 4–5 | 5–6 |

      #### Index types worth knowing

      | Type | Use for |
      | --- | --- |
      | B-tree | equality, ranges, sorting — the default |
      | Hash | equality only; rarely worth it |
      | GIN / inverted | arrays, JSONB, full text |
      | BRIN | huge, naturally ordered tables (time series) |
      | Partial (`WHERE`) | hot subsets, e.g. `status = 'open'` |
  - term: Selectivity
    short: The fraction of rows a predicate keeps. Low fraction means an index helps; high fraction means it does not.
    see: [ B-tree index, Query plan, Sequential scan ]
    detail: |-
      An index lookup costs a tree descent plus one random heap read per matching row. A sequential scan reads pages in order, which disks and prefetchers love. So beyond roughly 5–10% of the table, scanning sequentially is genuinely faster, and the planner will — correctly — ignore your index.

      This is why indexing a `status` column with three values rarely helps, while indexing `email` always does. For skewed columns a partial index on the rare value gives you the best of both.

      #### Rough guidance

      | Rows matched | Likely plan |
      | --- | --- |
      | Under 1% | index scan — big win |
      | 1–10% | bitmap scan, depends on correlation |
      | Over 10% | sequential scan, and that is correct |

      #### How it relates

      - Bad **statistics** make the planner mis-estimate selectivity, which is the usual cause of a sudden plan flip.
  - term: Composite index
    short: An index on several columns, usable only from the leftmost column onwards — the "leftmost prefix" rule.
    see: [ B-tree index, Covering index, Query plan ]
    detail: |-
      An index on `(customer_id, placed_at, status)` is sorted by `customer_id` first, so it serves queries filtering on `customer_id`, on `customer_id + placed_at`, and on all three. It does <em>not</em> serve a query filtering only on `placed_at`, any more than a phone book sorted by surname helps you find everyone called Ada.

      Column order rules: equality predicates first, then the range or sort column, then anything you only want to carry along. One well-ordered composite index usually replaces three single-column ones and costs less on writes.

      #### What `(a, b, c)` serves

      | Predicate | Uses the index? |
      | --- | --- |
      | `a = ?` | yes |
      | `a = ? AND b = ?` | yes |
      | `a = ? AND c = ?` | partly — only `a` narrows |
      | `b = ?` | no |
      | `a = ? ORDER BY b` | yes, sort is free |

      #### How it relates

      - Steps 5–6 of the first animation add the second column and show the extra filtering it removes.
  - term: Covering index
    short: An index that contains every column the query needs, so the table itself is never read.
    see: [ Composite index, B-tree index, Working set ]
    detail: |-
      Normally an index tells you <em>where</em> the rows are and the engine then fetches them from the heap — one random read each. If the index also carries the selected columns, the engine can answer entirely from the index: an index-only scan. On a query returning many rows that often removes 90% of the I/O.

      PostgreSQL spells it `INCLUDE (...)`, SQL Server the same, MySQL/InnoDB gets it for free because secondary indexes already carry the primary key. The cost is a fatter index: more space, more write amplification, and less of it fitting in cache.

      #### Trade-off

      | Add columns to the index | Effect |
      | --- | --- |
      | Reads | heap never touched — much faster |
      | Writes | more pages to maintain |
      | Memory | index competes for the buffer cache |

      #### How it relates

      - Postgres also needs the visibility map to be current, so an index-only scan on a table that is never vacuumed quietly stops being index-only.
  - term: Query plan
    short: The strategy the planner chose, and the only reliable way to know why a query is slow.
    see: [ Selectivity, Sequential scan, N+1 queries ]
    detail: |-
      `EXPLAIN (ANALYZE, BUFFERS)` shows the plan plus what actually happened. Read it bottom-up and look for two things: a node where `rows` estimated and `rows` actual differ by an order of magnitude (bad statistics), and a node that examines far more rows than it returns (missing or unusable index).

      Plans change on their own as data grows and statistics are resampled. A query that was fast for a year can flip to a scan overnight, which is why plan regressions belong on your dashboards.

      #### What to look for

      | Symptom in the plan | Usually means |
      | --- | --- |
      | Seq Scan on a big table | missing or unusable index |
      | Estimated 10, actual 100,000 | stale or insufficient statistics |
      | Nested Loop with a huge outer | bad join order from bad estimates |
      | Sort spilling to disk | `work_mem` too small |
      | High `shared read` in BUFFERS | working set does not fit in RAM |

      #### How it relates

      - Fix statistics before adding an index — half of "missing index" cases are mis-estimates.
  - term: Sequential scan
    short: Reading every page of a table in order — slow for a needle, and the right choice for a haystack.
    see: [ Selectivity, Query plan, B-tree index ]
    detail: |-
      A sequential scan is not a bug. Reading pages in physical order is far faster per page than random access, so for anything above roughly 10% selectivity, or for a small table, it wins outright. Forcing an index scan there makes the query slower.

      It becomes a problem only when it is used for a highly selective predicate — the 555,555:1 ratio in the first animation — or when several concurrent scans push the working set out of the buffer cache and the whole instance slows down.

      #### When a scan is correct

      | Case | Why |
      | --- | --- |
      | Small table (a few hundred pages) | the whole thing is already cached |
      | Returning most of the rows | sequential I/O beats random |
      | Analytics and aggregation | column scan is the point |
  - term: N+1 queries
    short: One query to fetch a list, then one more per item — the most common application-side performance bug.
    see: [ Query plan, Connection pool, Working set ]
    detail: |-
      Fetch 200 orders, then lazily touch `order.Customer.Name` inside the loop, and the ORM issues 201 round trips. Each one is individually fast, so nothing looks slow in the database; the time is 201 network round trips plus 201 pool acquisitions, and it only appears under load.

      It is also the fastest way to exhaust a connection pool, because each request now holds its connection for far longer than anyone sized for.

      #### Fixes, in order

      | Fix | Note |
      | --- | --- |
      | Eager load / join | `Include`, `selectinload`, `JOIN FETCH` |
      | Batch the second query | one `WHERE id IN (...)` |
      | Project to a DTO | fetch only what the screen needs |
      | Fail the build | assert query count in tests |

      #### How it relates

      - Counting queries per request in tests catches this before production does.
  - term: Connection pool
    short: A bounded set of reusable database connections shared by application threads.
    see: [ Pool sizing, N+1 queries, Lock contention ]
    detail: |-
      Opening a PostgreSQL connection costs milliseconds and a backend process with its own memory; opening thousands costs the server more than the queries do. A pool keeps a small number open and hands them out, which also acts as a concurrency limiter — its most valuable and least appreciated property.

      Treat pool saturation as a signal, not a problem to configure away: it means work is arriving faster than the database completes it, and raising the limit only moves the queue somewhere worse.

      #### Settings that matter

      | Setting | Sensible value |
      | --- | --- |
      | Max pool size | small — see pool sizing |
      | Acquisition timeout | 1–5 s; fail fast, do not pile up |
      | Statement timeout | below the request timeout |
      | Idle timeout | minutes, to release idle backends |
      | Leak detection | on — finds unreturned connections |

      #### How it relates

      - The second animation is a pool saturating because the query got slower, not because the pool was small.
  - term: Pool sizing
    short: "How many connections you actually need: arrival rate times time held, by Little's Law — usually a much smaller number than teams expect."
    see: [ Connection pool, Lock contention ]
    detail: |-
      `connections = requests per second × seconds held`. At 100 requests per second each holding a connection for 50 ms, five are busy on average; a pool of ten has headroom. The famous HikariCP guidance — roughly `cores × 2 + effective spindles` — lands in the same place from the server's side: a 16-core database rarely benefits from more than about 32 concurrent queries, because beyond that they just compete.

      Remember to multiply by instances: ten application pods with a pool of 20 each is 200 connections at the server, which is where "too many clients already" comes from.

      #### Worked examples

      | Rate | Held | Busy connections |
      | --- | --- | --- |
      | 100/s | 50 ms | 5 |
      | 100/s | 200 ms | 20 |
      | 500/s | 20 ms | 10 |
      | 50/s | 2 s | 100 — fix the query |

      #### How it relates

      - This is Little's Law applied to connections; the same arithmetic sizes thread pools and queues.
  - term: Partitioning
    short: Splitting one logical table into physical pieces inside the same database, by range, list or hash.
    see: [ Partition pruning, Sharding, Working set ]
    detail: |-
      Partitioning is a maintenance and locality tool, not primarily a speed tool. Its biggest wins are operational: dropping last year's data becomes `DROP TABLE` on a partition instead of a `DELETE` of 400 million rows; vacuum, index rebuilds and statistics run per partition; and indexes stay small enough to cache.

      Range partitioning by time is the overwhelmingly common case. Hash partitioning spreads writes but gives up pruning on ranges; list partitioning suits tenant or region keys.

      #### Choosing a scheme

      | Scheme | Good for | Watch out for |
      | --- | --- | --- |
      | Range (time) | logs, events, orders | the newest partition is always hot |
      | List (tenant, region) | multitenancy | skew between tenants |
      | Hash | even write spread | no range pruning |

      #### How it relates

      - Partitioning stays inside one database; **sharding** crosses machines and loses transactions.
  - term: Partition pruning
    short: The planner skipping partitions that cannot contain matching rows — where the speed-up actually comes from.
    see: [ Partitioning, Query plan ]
    detail: |-
      A query with `WHERE placed_at >= '2026-11-01'` on a table partitioned by month touches one partition instead of 36. Pruning only works when the partition key appears in the predicate, which is why a partitioned table with queries that filter on something else is all cost and no benefit.

      Check it, do not assume it: the plan should show one partition scanned. Functions wrapped around the key, implicit casts and parameters resolved too late are the usual reasons pruning silently fails.

      #### Pruning works when

      | Query | Pruned? |
      | --- | --- |
      | `WHERE placed_at > '2026-11-01'` | yes |
      | `WHERE date_trunc('day', placed_at) = ?` | often not |
      | `WHERE customer_id = ?` | no — all partitions |

      #### How it relates

      - Partition on what you filter by, or do not partition.
  - term: Sharding
    short: Spreading one dataset across independent databases, each owning a subset of the rows.
    see: [ Shard key, Partitioning, Read replica ]
    anim:
      key: sh
      title: Keys landing on shards, and what resharding costs
      svg: database-performance/sh.svg
      alt: Three keys hashed onto three shards, then a fourth shard added and most keys moving
      steps:
        - say: Three shards and three user ids. A router computes `hash(user_id) % 3` to decide where each row lives — the application never picks a shard by hand.
          hl: [ sh-a, sh-b, sh-c ]
        - say: "The keys land on their shards. Each shard is an entirely separate database: its own storage, its own transactions, its own backups. A join across two of them does not exist."
          unhl: [ sh-a, sh-b, sh-c ]
          move:
            sh-k1: [ 0, 84 ]
            sh-k2: [ -25, 84 ]
            sh-k3: [ -50, 84 ]
          text:
            sh-msg: three independent databases — no cross-shard joins
        - say: Write volume grows, so a fourth shard is added. The divisor changes from 3 to 4.
          show: [ sh-d, sh-dt ]
          text:
            sh-msg: shard = hash(user_id) % 4
        - say: "And with plain modulo, nearly every key now maps somewhere else: 17 moves to B, 42 to C, 99 to D. Resharding means physically moving most of the dataset while it is being written to."
          hl: [ sh-d ]
          move:
            sh-k1: [ 140, 84 ]
            sh-k2: [ 115, 84 ]
            sh-k3: [ 90, 84 ]
          text:
            sh-msg: modulo rehashing moves ~3/4 of the rows
        - say: "That is why real systems use consistent hashing or a lookup table of ranges: adding a shard then moves only about 1/N of the keys. Decide this before the first shard, not during the migration."
          unhl: [ sh-d ]
          text:
            sh-msg: "consistent hashing: only ~1/N of keys move"
    detail: |-
      Sharding is the only way past the write throughput or storage of a single machine, and it is the most expensive step on the ladder. Each shard is a separate database: cross-shard joins disappear, cross-shard transactions require a protocol nobody enjoys, unique constraints become application concerns, and every operational task now happens N times.

      Do it when a single primary genuinely cannot keep up after the cheaper steps — not because the table is large. A well-indexed, partitioned table on a modern machine handles billions of rows.

      ::anim sh::

      #### How it relates

      - Try **read replicas** and **partitioning** first; they keep one logical database.
  - term: Shard key
    short: The column that decides which shard a row lives on — the single most consequential and least reversible choice in a sharded system.
    see: [ Sharding, Partitioning ]
    detail: |-
      A good shard key spreads writes evenly, keeps rows that are queried together on the same shard, and appears in almost every query so the router can avoid fan-out. `tenant_id` and `user_id` usually qualify; a timestamp almost never does, because all of today's writes land on one shard.

      Changing it later means moving every row, so model the top five queries against the candidate key before committing.

      #### Good and bad keys

      | Key | Verdict |
      | --- | --- |
      | `tenant_id` | good — natural locality; watch for whale tenants |
      | `user_id` (hashed) | good — even spread |
      | `created_at` | bad — all writes hit one shard |
      | Auto-increment id | bad — same hot-shard problem |
      | `country` | bad — extreme skew |

      #### How it relates

      - A hot shard is the sharded version of a hot partition: the median looks fine and one tenant is on fire.
  - term: Read replica
    short: A copy of the primary that serves reads, with a replication lag you must design around.
    see: [ Working set, Sharding, Connection pool ]
    detail: |-
      Replicas are the cheapest real scaling step: no schema change, no application rewrite beyond routing. They scale reads only — every replica still applies every write — and they introduce lag, usually single-digit milliseconds but seconds under heavy write load or a long-running query blocking replay.

      The practical rule is the same as for any eventually consistent read: send a user's own data to the primary right after they change it, and everything else to a replica.

      #### What replicas fix

      | Problem | Replica helps? |
      | --- | --- |
      | Too many reads | yes |
      | Reporting disturbing OLTP | yes |
      | Too many writes | no — shard or partition |
      | Slow individual query | no — index it |

      #### How it relates

      - Replication lag is the same read-your-own-writes problem CQRS has, with the same mitigations.
  - term: Lock contention
    short: Transactions waiting on each other's row or table locks — latency that no index will fix.
    see: [ Connection pool, Pool sizing, Query plan ]
    detail: |-
      Two shapes dominate. A **hot row** — a counter, a balance, a sequence table — serialises every transaction that touches it, so throughput is capped at one divided by the lock hold time regardless of hardware. And **long transactions** hold locks far longer than the statement that took them, especially when an HTTP call happens inside one.

      Deadlocks are the loud version and are usually fixed by acquiring rows in a consistent order. The quiet version — everything 50 ms slower — is more common and only visible in lock wait metrics.

      #### Patterns and fixes

      | Pattern | Fix |
      | --- | --- |
      | Hot counter row | sharded counters, or aggregate asynchronously |
      | Long transaction | never call out over the network inside one |
      | Deadlock | consistent lock ordering, short transactions |
      | Lock escalation | batch updates in chunks |

      #### How it relates

      - Lock waits inflate the time a connection is held, which is what saturates the pool.
  - term: Working set
    short: The pages actually touched by your queries. Performance falls off a cliff when it stops fitting in RAM.
    see: [ Covering index, Partitioning, Read replica ]
    detail: |-
      Databases are fast because the hot pages live in the buffer cache: a hit is about 100 nanoseconds, a miss on NVMe is 50–500 microseconds, several hundred times slower. Most tables have a small hot subset — recent orders, active users — so what matters is not the size of the data but the size of the part you keep touching.

      The failure mode is non-linear and sudden: the working set grows just past RAM, hit rate drops, I/O climbs, queries slow, connections are held longer, the pool saturates, and the whole thing looks like a pool incident.

      #### Keeping it small

      | Technique | Effect |
      | --- | --- |
      | Partition by time | cold months stop competing for cache |
      | Narrower rows / TOAST | more rows per page |
      | Partial and covering indexes | fewer pages per query |
      | Archive old data | the only permanent fix |

      #### How it relates

      - Cache hit ratio and `shared read` counts are the early warning; latency percentiles are the late one.
  - term: Bloat & vacuum
    short: Dead row versions left by updates and deletes, and the background work that reclaims them.
    see: [ Working set, Query plan, B-tree index ]
    detail: |-
      In MVCC engines an `UPDATE` writes a new row version and leaves the old one as garbage. Autovacuum reclaims that space and refreshes the visibility map, but it is throttled by default and loses ground on write-heavy tables — so the table grows, scans read more pages, indexes point at dead tuples and index-only scans silently stop being index-only.

      Long-running transactions and abandoned replication slots are the usual culprits: vacuum cannot remove a row version that some old snapshot might still need, so a forgotten session can bloat a table for days.

      #### Symptoms and causes

      | Symptom | Likely cause |
      | --- | --- |
      | Table far bigger than its data | autovacuum falling behind |
      | Index-only scans vanished | visibility map stale |
      | Vacuum never completes | long transaction or stale slot |
      | Growing after a bulk delete | space reclaimed but not returned to the OS |

      #### How it relates

      - Bloat quietly grows the **working set**, which is how a healthy system becomes a slow one without any code change.
commands:
  heading: Essential commands & SQL
  tocLabel: Commands & SQL
  groups:
    - group: Find the problem
      items:
        - lang: sql
          code: |-
            EXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)
            SELECT id, total FROM orders
            WHERE customer_id = 4711 AND placed_at > '2026-01-01';
          what: The plan plus what actually happened. Compare estimated and actual rows, and watch the buffer counts.
        - lang: sql
          code: |-
            SELECT calls, mean_exec_time, total_exec_time, rows, query
            FROM   pg_stat_statements
            ORDER  BY total_exec_time DESC
            LIMIT  20;
          what: "Total time, not mean time: the query that takes 3 ms and runs a million times is usually the real problem."
        - lang: sql
          code: |-
            SELECT relname, seq_scan, seq_tup_read, idx_scan,
                   n_live_tup, n_dead_tup
            FROM   pg_stat_user_tables
            ORDER  BY seq_tup_read DESC LIMIT 20;
          what: Tables being scanned sequentially, and dead-tuple counts that reveal bloat.
        - lang: sql
          code: |-
            SELECT indexrelname, idx_scan, pg_size_pretty(pg_relation_size(indexrelid))
            FROM   pg_stat_user_indexes WHERE idx_scan = 0 ORDER BY 3 DESC;
          what: "Indexes nobody has used: pure write tax and wasted cache. Drop them (after checking every replica)."
        - lang: sql
          code: |-
            SELECT pid, state, wait_event_type, wait_event,
                   now() - xact_start AS age, left(query, 60)
            FROM   pg_stat_activity
            WHERE  state <> 'idle' ORDER BY age DESC;
          what: Live sessions, what they are waiting on, and the long transaction that is blocking vacuum.
    - group: Indexes
      items:
        - lang: sql
          code: |-
            CREATE INDEX CONCURRENTLY ix_orders_cust_date
                ON orders (customer_id, placed_at DESC);
          what: Equality column first, range/sort column second. CONCURRENTLY avoids locking writes — it is slower and can fail, so check validity afterwards.
        - lang: sql
          code: |-
            CREATE INDEX CONCURRENTLY ix_orders_cust_date_inc
                ON orders (customer_id, placed_at DESC) INCLUDE (total, status);

            CREATE INDEX CONCURRENTLY ix_orders_open
                ON orders (placed_at) WHERE status = 'open';
          what: A covering index for an index-only scan, and a partial index that only stores the rare, hot subset.
        - lang: sql
          code: |-
            ANALYZE orders;                                  -- refresh statistics
            ALTER TABLE orders ALTER COLUMN customer_id SET STATISTICS 500;
            REINDEX INDEX CONCURRENTLY ix_orders_cust_date;  -- rebuild a bloated index
          what: Fix the planner's information before adding more indexes — many "missing index" problems are mis-estimates.
    - group: Partitioning
      items:
        - lang: sql
          code: |-
            CREATE TABLE orders (
                id bigint, customer_id bigint, placed_at timestamptz NOT NULL, total numeric
            ) PARTITION BY RANGE (placed_at);

            CREATE TABLE orders_2026_11 PARTITION OF orders
                FOR VALUES FROM ('2026-11-01') TO ('2026-12-01');
          what: "Range partitioning by time: the key must be in the predicate for pruning to work, and in the primary key."
        - lang: sql
          code: |-
            -- retention becomes metadata, not a 400M-row DELETE
            ALTER TABLE orders DETACH PARTITION orders_2025_11;
            DROP TABLE orders_2025_11;

            -- confirm pruning actually happens
            EXPLAIN SELECT count(*) FROM orders WHERE placed_at >= '2026-11-01';
          what: "The real win of partitioning: instant retention, and plans that touch one partition instead of thirty-six."
    - group: Connection pools
      items:
        - code: |-
            # Npgsql (.NET) — small pool, fail fast
            Host=db;Database=app;Maximum Pool Size=15;Minimum Pool Size=2;
            Timeout=5;Command Timeout=10;Connection Idle Lifetime=300
          what: "Remember to multiply by the number of instances: 10 pods x 15 = 150 connections at the server."
        - code: |-
            # HikariCP (JVM)
            maximumPoolSize = 20          # cores * 2 + effective spindles
            connectionTimeout = 3000      # ms — fail fast instead of piling up
            leakDetectionThreshold = 20000
          what: A small pool is a concurrency limiter. Raising it when it saturates moves the queue onto the database.
        - code: |-
            # PgBouncer in transaction mode, in front of Postgres
            [databases]
            app = host=db dbname=app
            [pgbouncer]
            pool_mode = transaction
            default_pool_size = 20
            max_client_conn = 2000
          what: Lets thousands of clients share a few dozen server connections. Transaction mode forbids session state — no server-side prepared statements or advisory locks across statements.
        - lang: csharp
          code: |-
            // dotnet add package Npgsql
            await using var source = NpgsqlDataSource.Create(
                "Host=db;Database=app;Maximum Pool Size=15;Timeout=5;Command Timeout=10");

            await using var conn = await source.OpenConnectionAsync(ct);   // returned on dispose
            await using var cmd  = new NpgsqlCommand("SELECT total FROM orders WHERE id = $1", conn)
            {
                Parameters = { new NpgsqlParameter { Value = orderId } },
            };

            var total = (decimal?)await cmd.ExecuteScalarAsync(ct);
          what: "`NpgsqlDataSource` owns the pool; `await using` returns the connection even on an exception. A leaked connection is a pool of one."
        - lang: python
          code: |-
            from psycopg_pool import ConnectionPool

            pool = ConnectionPool(DSN, min_size=2, max_size=15, timeout=5)

            with pool.connection() as conn:           # always context-managed
                with conn.cursor() as cur:
                    cur.execute("SELECT total FROM orders WHERE id = %s", (order_id,))
          what: A leaked connection is a pool of one. Context managers, and leak detection, are not optional.
    - group: Safety rails
      items:
        - lang: sql
          code: |-
            ALTER ROLE app SET statement_timeout = '10s';
            ALTER ROLE app SET idle_in_transaction_session_timeout = '30s';
            ALTER ROLE app SET lock_timeout = '3s';
          what: Three settings that convert a slow query into a failed request instead of a full outage.
prosCons:
  good:
    heading: Pros of working down the ladder
    items:
      - Indexes and query fixes are reversible, local and usually deliver the largest single improvement.
      - Right-sizing the pool costs one config change and prevents an entire class of cascading failure.
      - Partitioning turns retention and maintenance from multi-hour jobs into metadata operations.
      - Replicas scale reads without touching the schema or the application's data model.
      - Every step keeps one logical database, so joins and transactions still work.
      - "The diagnosis tools are built in: the plan and the statistics views tell you where the time went."
  bad:
    heading: Cons and costs
    items:
      - Every index is a tax on every write and competes for the buffer cache.
      - Partitioning only helps if the partition key is in your predicates; otherwise it is pure overhead.
      - Sharding loses cross-shard joins, transactions and unique constraints, and multiplies all operations.
      - Replicas add lag, so read-your-own-writes has to be handled explicitly.
      - Plans change on their own as data grows — tuning is never finished.
      - Tuning in a staging environment with 1% of the data regularly produces the wrong conclusion.
when:
  note: "measure first: read the plan, then change one thing, then measure again"
  good:
    heading: Reach for each step when…
    items:
      - "**Index**: the plan shows a sequential scan and the predicate keeps under ~5% of the rows."
      - "**Query rewrite**: rows examined vastly exceeds rows returned, or the request issues dozens of round trips."
      - "**Pool sizing**: connection waits appear, or Little's Law says you need more than you have."
      - "**Cache / replica**: reads dominate writes by an order of magnitude and some staleness is acceptable."
      - "**Partition**: a single table has grown past comfortable maintenance, and queries filter on the partition key."
      - "**Shard**: one primary cannot absorb the write volume or the data no longer fits, after everything above."
  bad:
    heading: Avoid when…
    items:
      - Indexing a low-cardinality column for a query that returns half the table. Use **a partial index, or nothing**.
      - Partitioning a table whose queries never filter on the key. Use **better indexes**.
      - Sharding to make queries faster. Use **indexes, caching and replicas** — sharding addresses write and storage limits, not latency.
      - Enlarging the pool because it saturates. Use **a faster query, or load shedding**.
      - Tuning against a staging database with 1% of production data. Use **a production-sized copy** or the real plans.
useCases:
  - title: The 2 a.m. "pool exhausted" page
    body: Errors say the connection pool timed out, so someone raises it from 20 to 100 and latency gets worse. The plan shows a deploy removed an index; queries went from 40 ms to 900 ms, so the number of connections needed went from 4 to 90. Restoring the index fixes the pool incident without touching the pool.
  - title: A list page that got slow as the company grew
    body: "A dashboard query was fine at 200,000 rows and takes 3 seconds at 20 million. The plan shows a sequential scan: the index exists but the query wraps the column in a function, so it cannot be used. Rewriting the predicate restores a 4 ms index scan."
  - title: Retention on an events table
    body: "A nightly `DELETE FROM events WHERE created_at < now() - interval '90 days'` runs for hours, bloats the table and starves autovacuum. Range-partitioning by week turns it into `DROP TABLE` per partition: instant, no bloat, no vacuum debt."
  - title: Reports crushing the transactional database
    body: Analysts run heavy aggregations against the primary and checkout latency rises at month end. Routing those queries to a read replica isolates them completely; the lag of a few hundred milliseconds is irrelevant for a report.
  - title: A multi-tenant table with one enormous tenant
    body: Average query time looks fine while the largest tenant times out. List-partitioning by `tenant_id` with the whales on their own partitions — and per-tenant limits — fixes the tail without sharding the whole system.
gotchas:
  items:
    - mistake: Wrapping an indexed column in a function
      why: "`WHERE lower(email) = ?` or `WHERE date(created_at) = ?` cannot use a plain index on the column, so a perfectly good index sits unused while the table is scanned."
      fix: "index the expression (`CREATE INDEX ... ON t (lower(email))`), or rewrite the predicate as a range: `created_at >= d AND created_at < d + 1`."
    - mistake: Enlarging the pool when it saturates
      why: More connections means more concurrent queries on the same cores, so each gets slower, so each is held longer — the classic congestion collapse.
      fix: keep the pool small, fail fast on acquisition, and fix the thing that made queries slower. A pool is a concurrency limiter, and that is a feature.
    - mistake: One index per column
      why: Six single-column indexes serve fewer queries than two well-ordered composite ones, while costing six times the write amplification and cache.
      fix: design indexes from your actual query shapes, equality columns first. Drop indexes with zero scans in `pg_stat_user_indexes`.
    - mistake: Partitioning on the wrong key
      why: "Partitioning by hash of the id while every query filters by date means no pruning at all: all the maintenance cost, none of the benefit, plus more planning time."
      fix: partition on what the predicates use, verify with EXPLAIN that one partition is scanned, and keep the partition count in the dozens, not thousands.
    - mistake: Choosing a timestamp as the shard key
      why: All of today's writes land on one shard, so you have the complexity of sharding and the throughput of a single machine.
      fix: shard on something with natural locality and even spread (hashed `tenant_id` or `user_id`), and model your top queries against it before committing.
    - mistake: Long transactions holding everything hostage
      why: A transaction opened before an HTTP call keeps locks and blocks vacuum for as long as the remote service takes, which bloats tables and stalls replicas.
      fix: never make a network call inside a transaction, and set `idle_in_transaction_session_timeout` so a stuck session cannot do it anyway.
    - mistake: Trusting averages
      why: A mean query time of 20 ms hides a p99 of 4 seconds, and the p99 is what users and timeouts actually experience.
      fix: alert on percentiles and on `total_exec_time` from `pg_stat_statements`, not on means.
    - mistake: Creating indexes without CONCURRENTLY in production
      why: A plain `CREATE INDEX` takes a lock that blocks writes for the whole build — minutes to hours on a large table.
      fix: use `CREATE INDEX CONCURRENTLY`, and check `pg_index.indisvalid` afterwards, because a concurrent build that fails leaves an invalid index behind.
alternatives:
  columns:
    - Approach
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs indexing and tuning
  rows:
    - self: true
      cells:
        - "**Indexes & query tuning**"
        - almost every slow query
        - Low
        - free; write-side tax
        - —
    - cells:
        - "**Caching**"
        - hot, repeated reads
        - Low
        - a cache node
        - Avoids the database entirely; brings invalidation and staleness instead
    - cells:
        - "**Read replicas**"
        - read scaling, report isolation
        - Low
        - extra instances
        - More capacity for the same queries; adds replication lag, no help for writes
    - cells:
        - "**Partitioning**"
        - very large tables, retention
        - Medium
        - free
        - Maintenance and locality rather than raw speed; needs the key in your predicates
    - cells:
        - "**Sharding**"
        - write volume beyond one machine
        - High
        - free; operational cost large
        - The only way past a single primary; loses joins and transactions
    - cells:
        - "**Bigger machine**"
        - buying a year of runway
        - None
        - linear in cloud spend
        - Changes nothing structurally; often the correct short-term answer
    - cells:
        - "**A different store**"
        - search, time series, analytics
        - Medium–High
        - another system to run
        - Right data model for one access pattern; a second source of truth to keep in sync
  notes:
    - "**Pick caching** when the same answers are read far more often than the data changes."
    - "**Pick read replicas** when the queries are fine but there are too many, or reports are disturbing live traffic."
    - "**Pick partitioning** when retention and maintenance hurt more than query latency does."
    - "**Pick sharding** only when a single primary cannot absorb the writes — and expect to redesign your queries."
    - "**Pick a bigger machine** without shame while you fix the real cause; vertical scaling is cheap compared to a rushed shard."
    - "**Pick a specialised store** (search index, columnar warehouse, time-series DB) when an access pattern is fundamentally alien to a row store."
