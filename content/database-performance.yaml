title: Database performance
slug: database-performance
tagline: Index, then query, then schema, then cache, then replicate, then partition — and only then shard.
asof: Nov 2026 · examples are PostgreSQL 18 flavoured; the principles carry to MySQL, SQL Server and most engines
description: "Database performance cheatsheet: indexes, query plans, partitioning, sharding and connection pools — animated, in the order you should actually try them."
