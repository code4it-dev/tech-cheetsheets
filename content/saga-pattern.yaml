title: Saga pattern
slug: saga-pattern
tagline: You cannot roll back a transaction that already committed in someone else's database. You can only do something that undoes it in business terms.
asof: Nov 2026 · Garcia-Molina & Salem, 1987; examples in C#, Python and workflow engines
description: "Saga pattern cheatsheet: local transactions with compensating actions, choreography versus orchestration, the pivot step, and the isolation anomalies nobody warns you about."
aliases:
  - Saga pattern
  - saga
  - sagas
  - process manager
  - compensating transaction
  - choreography
  - orchestration
  - distributed transaction
keywords:
