  groups:
    - group: Prometheus / PromQL
      items:
        - lang: promql
          code: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))
          what: "The correct fleet-wide p99: sum the buckets across instances <em>first</em>, then take the quantile."
        - lang: promql
          code: histogram_quantile(0.99, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))
          what: p99 per route. Keep `le` in the `by` clause or the query silently returns nothing useful.
        - lang: promql
          code: |-
            sum(rate(http_request_duration_seconds_bucket{le="0.3"}[28d]))
              / sum(rate(http_request_duration_seconds_count[28d]))
          what: "Threshold SLO: the fraction of requests under 300 ms. Easier to alert on than a percentile value."
        - code: |-
            # in the exporter: buckets around the SLO, not the defaults
            buckets = [.005, .01, .025, .05, .1, .2, .3, .5, 1, 2, 5, 10]
          what: A boundary exactly at your SLO threshold (0.3) is what makes the query above exact.
    - group: Azure Monitor / Application Insights (KQL)
      items:
        - code: |-
            requests
            | where timestamp > ago(1d) and name == "GET /orders/{id}"
            | summarize count(), p50=percentile(duration,50), p95=percentile(duration,95),
                        p99=percentile(duration,99) by bin(timestamp, 15m)
            | render timechart
          what: Percentiles over 15-minute bins. Keep `count()` next to them so you can spot bins with too few samples.
        - code: |-
            requests
            | summarize good=countif(duration < 300), total=count()
            | extend slo = 100.0 * good / total
          what: The threshold form of the same SLO, which is what an error budget is computed from.
        - code: requests | where duration > 2000 | project timestamp, name, duration, operation_Id
          what: The point of percentiles is to find these. Take the `operation_Id` into the end-to-end transaction view.
    - group: Python
      items:
        - lang: python
          code: |-
            import numpy as np
            d = np.array(latencies_ms)
            print(np.percentile(d, [50, 90, 95, 99]))     # linear interpolation
            print(np.percentile(d, 99, method="lower"))    # nearest rank, a real observation
          what: Two methods, two answers. `method="lower"` matches what most monitoring tools report.
        - lang: python
          code: |-
            import statistics
            statistics.median(d), statistics.mean(d)       # compare them: the gap is the tail
          what: If the mean is far above the median, the distribution is long-tailed and the mean is the wrong summary.
        - lang: python
          code: |-
            from hdrh.histogram import HdrHistogram
            h = HdrHistogram(1, 60_000, 3)                 # 1 ms .. 60 s, 3 significant digits
            for v in latencies_ms: h.record_value(int(v))
            h.get_value_at_percentile(99.9)
          what: Constant memory, mergeable across threads and processes, accurate deep into the tail.
    - group: .NET
      items:
        - lang: csharp
          code: |-
            static readonly Meter Meter = new("Contoso.Orders");
            static readonly Histogram<double> Duration =
                Meter.CreateHistogram<double>("orders.request.duration", unit: "ms");

            Duration.Record(sw.Elapsed.TotalMilliseconds, new KeyValuePair<string, object?>("route", "orders/{id}"));
          what: Records into a histogram instrument; OpenTelemetry exports the buckets and the backend computes percentiles.
        - code: |-
            .AddView("orders.request.duration", new ExplicitBucketHistogramConfiguration
                { Boundaries = [5, 10, 25, 50, 100, 200, 300, 500, 1000, 2000, 5000] })
          what: Overrides the default buckets so there is a boundary at your SLO threshold.
    - group: SQL
      items:
        - lang: sql
          code: |-
            SELECT DISTINCT
              PERCENTILE_CONT(0.50) WITHIN GROUP (ORDER BY duration_ms) OVER () AS p50,
              PERCENTILE_CONT(0.99) WITHIN GROUP (ORDER BY duration_ms) OVER () AS p99
            FROM request_log WHERE ts > now() - interval '1 day';
          what: "`PERCENTILE_CONT` interpolates; `PERCENTILE_DISC` returns an actual observed row."
        - lang: sql
          code: |-
            SELECT route, count(*) AS n,
                   percentile_disc(0.99) WITHIN GROUP (ORDER BY duration_ms) AS p99
            FROM request_log GROUP BY route HAVING count(*) > 1000;
          what: "The `HAVING` clause is the point: do not report a p99 computed from too few rows."
    - group: Load testing without coordinated omission
      items:
        - lang: bash
          code: wrk2 -t4 -c100 -d60s -R2000 --latency https://api.contoso.com/orders/1
          what: "`-R` fixes the request <em>rate</em> rather than waiting for responses, so queueing delay is actually measured."
        - lang: bash
          code: "k6 run --vus 50 --duration 60s script.js   # then read p(95), p(99) from the summary"
          what: Use a constant-arrival-rate executor rather than a fixed number of iterations, for the same reason.
prosCons:
  good:
    heading: Pros
    items:
      - Every percentile is a real request a real user waited for — not a statistical artefact.
      - "Immune to outliers in the way that matters: one slow request cannot distort p50."
      - Makes SLOs expressible, measurable and arguable in concrete terms.
      - Reading p50 against p99 diagnoses the problem class before you open a trace.
      - "Works on anything with a distribution: latency, payload size, queue depth, GC pauses, cost per request."
      - Computable at scale from mergeable histograms and sketches, in kilobytes.
  bad:
    heading: Cons
    items:
      - They cannot be averaged or combined, which almost every default dashboard gets wrong.
      - High percentiles need large samples; on low-traffic endpoints they are noise.
      - Bucketed and sketched percentiles are approximations, with error that is easy to forget.
      - They describe the distribution but say nothing about <em>which</em> requests were slow — you still need traces.
      - Measurement tools silently distort them through coordinated omission.
      - They are not additive, so they cannot be used for capacity or cost arithmetic.
when:
  note: Describing experience? Percentile. Adding things up? Mean. Never the other way round.
  good:
    heading: Use percentiles when…
    items:
      - "You are describing what users experience: latency, load time, queue wait."
      - The distribution is skewed, which for anything time-related it almost always is.
      - You are setting or reporting an SLO.
      - You need to distinguish "normally slow" from "occasionally terrible".
      - You have enough samples — roughly 1,000 in the window for a credible p99.
      - You want a number that corresponds to an actual request you can go and trace.
  bad:
    heading: Avoid them when…
    items:
      - "You need to add things up: total cost, total CPU, total bytes. Use the **sum or the mean**."
      - There are only a handful of samples. Report the **raw values**, or widen the window.
      - The question is "how often did it fail", not "how slow was it". Use a **rate or a ratio**.
      - You only have per-instance percentiles and cannot merge the distributions. Fix the **pipeline** first; averaging them is worse than nothing.
      - The data is genuinely symmetric and outlier-free. The **mean and standard deviation** say more.
      - You need to know which requests were slow and why. Percentiles point; **traces and profiles** answer.
useCases:
  - title: Catching a regression an average hid
    body: A deploy adds a synchronous audit write on 3% of requests. The mean moves from 94 ms to 101 ms — well inside normal variation — while p95 jumps from 180 ms to 2,100 ms. Only the percentile dashboard shows it, and the shape (a flat p50 with an exploding tail) points straight at a code path rather than a general slowdown.
  - title: Writing a latency SLO that survives review
    body: "\"The API should be fast\" becomes \"99% of `GET /orders/{id}` complete in under 300 ms, measured at the gateway, over 28 days\". A histogram boundary is added at exactly 300 ms, the error budget works out to 43 minutes a month, and alerts fire on burn rate rather than on instantaneous value."
  - title: Sizing a connection pool
    body: A service with p50 20 ms and p99 900 ms at 500 req/s needs enough concurrency for the tail, not the median. Little's Law on the mean (roughly 94 ms) suggests 47 connections; sizing for the tail says far more. The percentile spread is what tells you the pool is the thing that will saturate.
  - title: Diagnosing a bimodal distribution
    body: "A chart shows two clusters: one at 25 ms and one at 2,025 ms, with almost nothing in between. The gap is exactly the 2-second client timeout, so the slow group is retries. Percentiles identified the shape; the fix was retry budgeting and jitter, which is also what the rate limiting page recommends."
  - title: Proving a tail fix actually worked
    body: After adding hedged requests at the p95 delay, p50 is unchanged, p99 falls from 900 ms to 180 ms, and backend load rises by 4%. That is exactly the expected trade, and it is only visible because p50 and p99 were tracked separately — an average would have shown a modest improvement and hidden both the win and its cost.
gotchas:
  items:
    - mistake: Averaging percentiles across instances
      why: "`avg(p99)` over ten pods is not the fleet p99 and is not a percentile of anything. One sick instance with 1% of the traffic can make the whole fleet look broken, or a healthy majority can hide a broken minority."
      fix: sum the histogram buckets (or merge the sketches) first, then compute the quantile once — `histogram_quantile(0.99, sum by (le) (...))`, never `avg(histogram_quantile(...))`.
    - mistake: Reporting p99 from a handful of samples
      why: On an endpoint serving ten requests a minute, the one-minute p99 is just the slowest of ten. It swings wildly, triggers alerts at random, and teaches everyone to ignore the dashboard.
      fix: require roughly 1,000 samples in the window for p99. Widen the window on low-traffic endpoints, and show "insufficient data" rather than a confident wrong number.
    - mistake: Coordinated omission in load tests
      why: A closed-loop generator stops sending while the server is stalled, so the queueing delay never appears in the results. Reported p99s can be ten times better than reality.
      fix: use an open-loop, constant-rate generator (`wrk2 -R`, k6 constant-arrival-rate, Gatling injection profiles), or correct with HdrHistogram's expected-interval recording.
    - mistake: Histogram buckets that end too low
      why: If the top bucket is `le="1.0"` and the real tail is at 8 seconds, every slow request falls into `+Inf` and `histogram_quantile` cannot see past 1 second. Your p99 is pinned to the top bucket and looks suspiciously stable.
      fix: "extend the buckets well past the worst latency you have ever seen, and put a boundary exactly at your SLO threshold. Check `+Inf` minus the top bucket: it should be near zero."
    - mistake: Measuring at the wrong place
      why: The service reports p99 = 80 ms while users see 3 seconds. The service's timer starts after TLS, queueing, load-balancer wait and request parsing, and stops before the response is written.
      fix: measure as close to the user as possible — real user monitoring in the browser, or at least at the edge — and treat per-service numbers as diagnosis, not as the SLI.
    - mistake: Comparing percentiles across different windows
      why: "\"p99 was 300 ms last week and is 900 ms today\" compares a 7-day window with a 5-minute one. Nothing regressed; the windows differ, and shorter windows always look spikier."
      fix: state the window beside every percentile on every dashboard, and compare like with like. Put the sample count next to it too.
    - mistake: Forgetting fan-out when setting targets
      why: Each service hits its 1% tail budget, the page calls ten of them, and 10% of page loads are slow. Every team's dashboard is green and the product is not.
      fix: derive per-service targets from the end-to-end goal and the fan-out factor, and always have one SLO measured on the complete user-visible operation.
    - mistake: Discarding outliers because they look like noise
      why: Trimming the top 1% before charting produces a beautiful, stable graph that has had every incident deleted from it.
      fix: trim only when outliers are measurement artefacts, and never for production experience. Trace the slow requests instead — they are the most informative data you have.
alternatives:
  columns: [ Summary, Best for, Complexity, Cost, Key difference vs percentiles ]
  rows:
    - self: true
      cells:
        - "**Percentiles**"
        - describing experience in a skewed distribution
        - Low
        - cheap with histograms
        - —
    - cells:
        - "**Mean**"
        - "totals: cost, CPU seconds, bytes transferred"
        - Low
        - trivial
        - Additive, so it can be combined and budgeted; distorted by outliers
    - cells:
        - "**Threshold ratio** (\"% under 300 ms\")"
        - SLOs and error budgets
        - Low
        - trivial
        - Counts good events, so it <em>is</em> aggregatable across services and time
    - cells:
        - "**Full histogram / heatmap**"
        - spotting bimodality and shape changes
        - Medium
        - more storage
        - Shows the whole distribution instead of three points on it
    - cells:
        - "**Max**"
        - hard real-time deadlines
        - Low
        - trivial
        - One bad sample defines it forever; useful only with a strict deadline
    - cells:
        - "**Apdex**"
        - a single executive-facing satisfaction score
        - Low
        - trivial
        - Folds latency into one 0–1 number; easy to report, hard to debug from
    - cells:
        - "**Distributed traces**"
        - finding out <em>why</em> a request was slow
        - Medium
        - sampling cost
        - Per-request detail rather than a summary; the natural follow-up to a bad p99
  notes:
    - "**Pick the mean** when the quantity is additive — money, bytes, CPU seconds."
    - "**Pick a threshold ratio** for SLOs: it aggregates cleanly and converts directly into an error budget."
    - "**Pick a heatmap** when you suspect two populations; percentiles average the bimodality away."
    - "**Pick traces** the moment a percentile tells you something is wrong — percentiles find the problem, traces explain it."
    - "The usual production set is: a threshold-based SLO, p50 and p99 on the dashboard, a heatmap for shape, and traces for the outliers."
