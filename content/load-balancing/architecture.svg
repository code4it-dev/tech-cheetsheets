<svg viewBox="0 0 800 346" role="img" aria-label="A request shown as nested layers, with what an L4 balancer can see compared with an L7 balancer">
  <defs>
    <marker id="lb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">the same request, and the two very different amounts of it a balancer may look at</text>

  <rect x="20" y="40" width="760" height="96" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <rect x="34" y="54" width="732" height="68" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="46" y="72" font-size="10" fill="#2f6b3f" font-weight="600">TCP &mdash; visible to L4</text>
  <text x="46" y="90" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">src 203.0.113.9:51882 &rarr; dst 10.0.0.5:443 &nbsp;·&nbsp; proto TCP</text>
  <rect x="250" y="96" width="504" height="20" rx="4" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="262" y="110" font-size="9.5" fill="#23362e">TLS &mdash; must be terminated before anything below can be read</text>
  <text x="46" y="110" font-size="9.5" fill="#5f6f66">(opaque bytes)</text>

  <rect x="20" y="146" width="372" height="110" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="206" y="168" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">L4 &mdash; transport</text>
  <text x="36" y="190" font-size="10.5" fill="#5f6f66">sees: IPs, ports, protocol &mdash; and nothing else</text>
  <text x="36" y="208" font-size="10.5" fill="#5f6f66">decides: once, per connection</text>
  <text x="36" y="226" font-size="10.5" fill="#5f6f66">speed: millions of pps, kernel or hardware</text>
  <text x="36" y="246" font-size="10.5" fill="#2f6b3f">any protocol, including ones you have not met</text>

  <rect x="408" y="146" width="372" height="110" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="594" y="168" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">L7 &mdash; application</text>
  <text x="424" y="190" font-size="10.5" fill="#5f6f66">sees: host, path, method, headers, cookies</text>
  <text x="424" y="208" font-size="10.5" fill="#5f6f66">decides: per <em>request</em>, not per connection</text>
  <text x="424" y="226" font-size="10.5" fill="#5f6f66">can: route, retry, rewrite, rate limit, cache</text>
  <text x="424" y="246" font-size="10.5" fill="#c53b3b">costs: TLS work, CPU, state, latency</text>

  <rect x="20" y="270" width="760" height="62" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="292" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">and in practice, both &mdash; in that order</text>
  <text x="400" y="314" font-size="10.5" text-anchor="middle" fill="#5f6f66">client &rarr; DNS/anycast &rarr; <tspan font-weight="600">L4</tspan> (volume, DDoS, any protocol) &rarr; <tspan font-weight="600">L7</tspan> (routing, retries, per-request) &rarr; your service</text>
</svg>
