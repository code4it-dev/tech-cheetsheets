<svg viewBox="0 0 800 320" role="img" aria-label="An L4 balancer distributing connections evenly but requests unevenly because HTTP/2 multiplexes many requests onto one connection">
  <defs>
    <marker id="lh-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="lh-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">three clients, three backends, and a balancer spreading connections perfectly evenly</text>

  <rect id="lh-c1" x="20" y="48" width="150" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="95" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">gateway A</text>
  <text id="lh-c1t" x="95" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">1 connection</text>
  <rect id="lh-c2" x="20" y="106" width="150" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="95" y="126" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">gateway B</text>
  <text id="lh-c2t" x="95" y="142" font-size="9.5" text-anchor="middle" fill="#5f6f66">1 connection</text>
  <rect id="lh-c3" x="20" y="164" width="150" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="95" y="184" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">gateway C</text>
  <text id="lh-c3t" x="95" y="200" font-size="9.5" text-anchor="middle" fill="#5f6f66">1 connection</text>

  <rect id="lh-lb" x="250" y="90" width="180" height="80" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text id="lh-lbt" x="340" y="116" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">L4 balancer</text>
  <text id="lh-lbt2" x="340" y="138" font-size="10" text-anchor="middle" fill="#5f6f66">balances connections</text>
  <text id="lh-lbt3" x="340" y="156" font-size="10" text-anchor="middle" fill="#5f6f66">3 conns → 3 backends ✓</text>

  <line x1="174" y1="110" x2="244" y2="120" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#lh-arr)"/>
  <line x1="174" y1="129" x2="244" y2="129" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#lh-arr)"/>
  <line x1="174" y1="180" x2="244" y2="146" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#lh-arr)"/>

  <rect id="lh-b1" x="520" y="48" width="260" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="590" y="76" font-size="10.5" fill="#23362e" font-weight="600">backend 1</text>
  <text id="lh-b1t" x="766" y="76" font-size="10.5" text-anchor="end" fill="#5f6f66" font-family="Fira Code, monospace">—</text>
  <rect id="lh-b2" x="520" y="106" width="260" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="590" y="134" font-size="10.5" fill="#23362e" font-weight="600">backend 2</text>
  <text id="lh-b2t" x="766" y="134" font-size="10.5" text-anchor="end" fill="#5f6f66" font-family="Fira Code, monospace">—</text>
  <rect id="lh-b3" x="520" y="164" width="260" height="46" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="590" y="192" font-size="10.5" fill="#23362e" font-weight="600">backend 3</text>
  <text id="lh-b3t" x="766" y="192" font-size="10.5" text-anchor="end" fill="#5f6f66" font-family="Fira Code, monospace">—</text>

  <line x1="434" y1="110" x2="514" y2="80" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#lh-arr)"/>
  <line x1="434" y1="129" x2="514" y2="129" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#lh-arr)"/>
  <line x1="434" y1="150" x2="514" y2="180" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#lh-arr)"/>

  <rect id="lh-panel" x="20" y="232" width="760" height="76" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="lh-p1" x="36" y="254" font-size="11" fill="#23362e" font-weight="700">connections: 1 / 1 / 1 — perfectly balanced</text>
  <text id="lh-p2" x="36" y="276" font-size="10.5" fill="#5f6f66">requests per second: — / — / —</text>
  <text id="lh-p3" x="36" y="296" font-size="10.5" fill="#5f6f66">under HTTP/1.1 this works fine, which is why nobody notices until it does not</text>
</svg>
