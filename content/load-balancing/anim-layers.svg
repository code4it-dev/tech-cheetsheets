<svg viewBox="0 0 800 320" role="img" aria-label="A request routed by an L4 balancer using the five-tuple, then by an L7 balancer using the path and headers">
  <defs>
    <marker id="ll-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="ll-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">a browser requests <tspan font-family="Fira Code, monospace">GET /api/orders</tspan> over TLS</text>

  <rect id="ll-req" x="20" y="40" width="300" height="110" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="170" y="60" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">what is on the wire</text>
  <text id="ll-r1" x="34" y="82" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">src 203.0.113.9:51882</text>
  <text id="ll-r2" x="34" y="99" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">dst 10.0.0.5:443 · TCP</text>
  <text id="ll-r3" x="34" y="118" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">TLS · encrypted payload</text>
  <text id="ll-r4" x="34" y="136" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="ll-lb" x="356" y="40" width="240" height="110" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text id="ll-lbt" x="476" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">L4 balancer</text>
  <text id="ll-lb1" x="476" y="86" font-size="10" text-anchor="middle" fill="#5f6f66">can read: the 5-tuple</text>
  <text id="ll-lb2" x="476" y="104" font-size="10" text-anchor="middle" fill="#5f6f66">decision: hash(5-tuple) % 3</text>
  <text id="ll-lb3" x="476" y="124" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <text id="ll-lb4" x="476" y="142" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <line x1="324" y1="95" x2="350" y2="95" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ll-arr)"/>
  <line x1="600" y1="95" x2="626" y2="95" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ll-arr)"/>

  <rect id="ll-b1" x="630" y="40" width="150" height="32" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="ll-b1t" x="705" y="61" font-size="10" text-anchor="middle" fill="#23362e">api pool</text>
  <rect id="ll-b2" x="630" y="79" width="150" height="32" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="ll-b2t" x="705" y="100" font-size="10" text-anchor="middle" fill="#23362e">static pool</text>
  <rect id="ll-b3" x="630" y="118" width="150" height="32" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="ll-b3t" x="705" y="139" font-size="10" text-anchor="middle" fill="#23362e">checkout pool</text>

  <rect id="ll-cap" x="20" y="174" width="760" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ll-c1" x="36" y="196" font-size="11" fill="#23362e" font-weight="700">what this balancer can do</text>
  <text id="ll-c2" x="36" y="218" font-size="10.5" fill="#5f6f66">forward packets, very fast, for any protocol</text>
  <text id="ll-c3" x="36" y="238" font-size="10.5" fill="#c53b3b">cannot: route by path · retry · read a cookie · add a header</text>
  <text id="ll-c4" x="420" y="218" font-size="10.5" fill="#5f6f66">&nbsp;</text>
  <text id="ll-c5" x="420" y="238" font-size="10.5" fill="#5f6f66">&nbsp;</text>

  <rect id="ll-verd" x="20" y="274" width="760" height="34" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ll-v" x="400" y="296" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">one decision, made once, on information that fits in 13 bytes</text>
</svg>
