title: Circuit breaker
slug: circuit-breaker
tagline: Stop calling the thing that is broken. You are not helping it, and it is destroying you.
asof: Nov 2026 · named by Michael Nygard in <em>Release It!</em>, 2007 · examples use Polly, Resilience4j and Envoy
description: "Circuit breaker cheatsheet: closed, open and half-open states, what counts as a failure, bulkheads, and how a breaker stops one slow dependency taking a whole service down."
aliases:
  - Circuit breaker
  - circuit breakers
  - breaker
  - half-open
  - bulkhead
  - outlier detection
  - fail fast
keywords:
  - circuit breaker
  - resilience
  - bulkhead
  - cascading failure
  - timeout
  - fallback
  - polly
  - resilience4j
  - envoy
  - microservices
related:
  - load-shedding
  - backpressure
  - graceful-degradation
  - sidecar-pattern
  - saga-pattern
overview:
  - When a dependency starts failing, the instinct of most code is to keep calling it — and to retry. Each call now costs a full timeout instead of 20 milliseconds, so the caller's threads, connections and memory fill up with work that is guaranteed to fail. Within a minute the caller is also unavailable, including for requests that never needed the broken dependency at all. That is a cascading failure, and it is how one small outage becomes a site-wide one.
  - "A **circuit breaker** is a small state machine wrapped around a dependency. While calls succeed it is **closed** and traffic flows. When the failure rate crosses a threshold it **opens**, and every subsequent call fails immediately without touching the network — one millisecond instead of two seconds. After a cooldown it goes **half-open**, letting a handful of trial calls through: if they succeed it closes again, and if they fail it reopens."
  - "Note what it does <em>not</em> do: it does not fix the dependency, and it does not make your feature work. It converts a slow, expensive, resource-consuming failure into a fast, cheap, predictable one — which is precisely what you need in order to do something sensible instead, whether that is a fallback value, a cached answer or a degraded page. Its natural partner is the **bulkhead**, which bounds how much of your capacity any one dependency can occupy in the first place."
architecture:
  svg: circuit-breaker/architecture.svg
  alt: The closed, open and half-open states of a circuit breaker with the transitions between them, and a bulkhead bounding concurrency per dependency
  caption: A breaker converts a slow failure into a fast one. A bulkhead limits how much of you any single dependency can consume while it decides to fail.
howItWorks:
  - md: "The first animation runs the state machine through a real outage and back. The second is why it exists: one slow dependency taking down a service that mostly does not need it."
  - note: a breaker never fixes anything — it buys you a fast, predictable failure to build on
  - anim:
      id: anim-states
      title: 1 · Trip, cool down, probe, recover
      svg: circuit-breaker/anim-states.svg
      alt: A circuit breaker counting failures, tripping open, failing fast, probing in half-open and closing again
      steps:
        - say: "Closed is the normal state: calls go through and every outcome is recorded in a rolling window. The breaker is doing nothing except counting."
          hl: [ cs-closed ]
        - say: The dependency starts to degrade. Failures appear in the window — two out of ten so far, which is nowhere near the threshold.
          unhl: [ cs-closed ]
          text:
            cs-rate: "failures: 20%"
            cs-cost: "call latency: 2,000 ms (timeouts)"
            cs-dep: "dependency load: struggling"
            cs-note: failures accumulating, breaker still closed
          fill:
            cs-c3: "#f9e3df"
            cs-c7: "#f9e3df"
        - say: "It gets worse: seven of the last ten calls fail. The rate is 70%, past the 50% threshold — and the window has more than the twenty-call minimum, so the sample means something."
          text:
            cs-rate: "failures: 70% — trip"
            cs-note: each of those cost a full 2-second timeout before being counted
          fill:
            cs-c1: "#f9e3df"
            cs-c4: "#f9e3df"
            cs-c5: "#f9e3df"
            cs-c8: "#f9e3df"
            cs-c10: "#f9e3df"
            cs-rate: "#c53b3b"
        - say: The breaker trips to OPEN. From now on calls fail immediately without touching the network at all.
          hl: [ cs-open ]
          text:
            cs-ct2: " "
            cs-ot: every call fails instantly
            cs-ot2: current state
            cs-cost: "call latency: 1 ms"
            cs-dep: "dependency load: zero"
            cs-timer: "break: 30 s"
            cs-v: OPEN — fast failure, and silence downstream
            cs-note: two things improved at once
          fill:
            cs-open: "#f9e3df"
            cs-closed: "#fbfcf8"
            cs-cost: "#2f6b3f"
            cs-v: "#c53b3b"
            cs-verd: "#f9e3df"
        - say: Two benefits, and both matter. The caller gets its workers back instead of holding them for two seconds each — and the dependency receives nothing, which is frequently what it needs to drain its backlog.
          text:
            cs-note: a service being hammered by retries cannot recover; this one now can
        - say: After the break duration the breaker moves to HALF-OPEN and allows a strictly limited number of trial calls — here, three.
          hl: [ cs-half ]
          unhl: [ cs-open ]
          text:
            cs-ot: —
            cs-ot2: " "
            cs-ht: 3 probes allowed
            cs-ht2: current state
            cs-timer: "probes: 0 / 3"
            cs-v: HALF-OPEN — testing the water with three calls
            cs-note: everything else still fails fast while the probes run
          fill:
            cs-open: "#fbfcf8"
            cs-half: "#fbf3c4"
            cs-v: "#23362e"
            cs-verd: "#fbf3c4"
        - say: The limit is the whole trick. If the breaker simply closed and released full traffic, a barely-recovered service would be flattened instantly and the breaker would reopen — a flapping loop that never ends.
          text:
            cs-timer: "probes: 3 / 3"
            cs-note: three calls is a test; a thousand a second is another outage
        - say: All three probes succeed. The breaker closes and the counters reset.
          hl: [ cs-closed ]
          unhl: [ cs-half ]
          text:
            cs-ht: —
            cs-ht2: " "
            cs-ct2: current state
            cs-rate: "failures: 0%"
            cs-cost: "call latency: 20 ms"
            cs-dep: "dependency load: normal"
            cs-timer: " "
            cs-v: CLOSED — recovered, counters reset
          fill:
            cs-c1: "#e3eedc"
            cs-c3: "#e3eedc"
            cs-c4: "#e3eedc"
            cs-c5: "#e3eedc"
            cs-c7: "#e3eedc"
            cs-c8: "#e3eedc"
            cs-c10: "#e3eedc"
            cs-rate: "#2f6b3f"
            cs-half: "#fbfcf8"
            cs-closed: "#e3eedc"
            cs-v: "#2f6b3f"
            cs-verd: "#e3eedc"
            cs-cost: "#5f6f66"
        - say: Had a probe failed instead, the breaker would go straight back to OPEN — usually for longer than before, so repeated failures back off rather than pulsing on a fixed cycle.
          text:
            cs-note: a failed probe → open again, with an increased break duration
        - say: "And notice what the breaker never did: it did not repair anything. It converted a slow, expensive, worker-consuming failure into a fast, cheap, predictable one — which is exactly what a fallback needs in order to exist."
          text:
            cs-phase: the breaker buys you a fast failure; the fallback is what makes it useful
            cs-v: without a fallback, you have only made the error arrive sooner
            cs-note: stale cache · a default · omit the section · an honest message
  - anim:
      id: anim-cascade
      title: 2 · One slow dependency, or a whole service
      svg: circuit-breaker/anim-cascade.svg
      alt: A service whose worker pool fills with calls to a slow dependency until unrelated requests also fail, then the same service protected by a bulkhead and a breaker
      steps:
        - say: "Service A has twenty workers. It serves 1,000 requests a second: 980 of them hit `/home`, which needs only the catalogue, and 20 hit `/profile`, which needs payments."
          hl: [ cc-a ]
        - say: Everything is fast, so each worker is free again in 25 ms and only a couple are ever busy at once. 98% of traffic does not touch payments at all.
          unhl: [ cc-a ]
          text:
            cc-pool: 2 / 20 busy
        - say: "Now payments breaks: calls hang until a two-second timeout. Note the catalogue is entirely healthy — nothing about `/home` has changed."
          hl: [ cc-pay ]
          text:
            cc-payt: 2,000 ms · timing out
            cc-phase: payments starts timing out — the catalogue is untouched
          fill:
            cc-pay: "#f9e3df"
            cc-payt: "#c53b3b"
        - say: Each `/profile` call now holds a worker for two seconds. By Little's Law, 20 requests a second × 2 seconds means 40 workers are needed — and only 20 exist.
          unhl: [ cc-pay ]
          text:
            cc-pool: 10 / 20 busy — all on payments
            cc-m2: "/profile: slow, 2,000 ms"
          fill:
            cc-w1: "#f9e3df"
            cc-w2: "#f9e3df"
            cc-w3: "#f9e3df"
            cc-w4: "#f9e3df"
            cc-w5: "#f9e3df"
            cc-w6: "#f9e3df"
            cc-w7: "#f9e3df"
            cc-w8: "#f9e3df"
            cc-w9: "#f9e3df"
            cc-w10: "#f9e3df"
        - say: Within seconds every worker is blocked on payments. The pool is gone.
          text:
            cc-pool: 20 / 20 busy — all on payments
          fill:
            cc-w11: "#f9e3df"
            cc-w12: "#f9e3df"
            cc-w13: "#f9e3df"
            cc-w14: "#f9e3df"
            cc-w15: "#f9e3df"
            cc-w16: "#f9e3df"
            cc-w17: "#f9e3df"
            cc-w18: "#f9e3df"
            cc-w19: "#f9e3df"
            cc-w20: "#f9e3df"
        - say: "And now the real damage: `/home` starts failing. Those requests never needed payments, but there is no worker left to run them. Service A is down because payments is down."
          hl: [ cc-cli ]
          text:
            cc-u1: /home 980 / s ✗
            cc-u2: /profile 20 / s ✗
            cc-m1: "/home: 503 / timeout"
            cc-m3: "blast radius: the entire service"
            cc-note: 98% of traffic is failing because of a dependency it never calls
            cc-v: cascading failure — one broken dependency, one dead service
          fill:
            cc-u1: "#c53b3b"
            cc-u2: "#c53b3b"
            cc-m1: "#c53b3b"
            cc-m3: "#c53b3b"
            cc-note: "#c53b3b"
            cc-v: "#c53b3b"
            cc-verd: "#f9e3df"
        - say: "First fix: a bulkhead. Give payments its own five slots out of the twenty. At most five workers can ever be stuck on it, whatever it does."
          hl: [ cc-a ]
          unhl: [ cc-cli ]
          text:
            cc-phase: "bulkhead: payments may occupy at most 5 of the 20 workers"
            cc-pool: 5 / 20 busy — bulkhead holding
            cc-u1: /home 980 / s ✓
            cc-m1: "/home: 200 OK, 25 ms"
            cc-m3: "blast radius: /profile only"
            cc-note: fifteen workers remain for everything that does not need payments
            cc-v: the leak is contained — but /profile still hangs for 2 seconds
          fill:
            cc-w6: "#e3eedc"
            cc-w7: "#e3eedc"
            cc-w8: "#e3eedc"
            cc-w9: "#e3eedc"
            cc-w10: "#e3eedc"
            cc-w11: "#e3eedc"
            cc-w12: "#e3eedc"
            cc-w13: "#e3eedc"
            cc-w14: "#e3eedc"
            cc-w15: "#e3eedc"
            cc-w16: "#e3eedc"
            cc-w17: "#e3eedc"
            cc-w18: "#e3eedc"
            cc-w19: "#e3eedc"
            cc-w20: "#e3eedc"
        - say: "`/home` is fine again. But `/profile` still takes two seconds to fail, and those five workers are still being burned on calls that are certain to fail."
          unhl: [ cc-a ]
          text:
            cc-m2: "/profile: still 2,000 ms then fails"
            cc-u2: /profile 20 / s ✗ (slow)
          fill:
            cc-u1: "#2f6b3f"
            cc-m1: "#2f6b3f"
            cc-m3: "#5f6f66"
            cc-note: "#5f6f66"
            cc-v: "#23362e"
            cc-verd: "#fbf3c4"
        - say: "Second fix: the circuit breaker. After the failure threshold it opens, and payments calls now fail in about a millisecond without leaving the process. Even the five bulkhead workers are released."
          hl: [ cc-pay ]
          text:
            cc-phase: "breaker open: payments fails in ~1 ms instead of 2,000"
            cc-pool: 2 / 20 busy — normal
            cc-m2: "/profile: fast fail, 1 ms → degraded view"
            cc-u2: /profile 20 / s ⚠ degraded
            cc-payt: receiving 0 / s · recovering
          fill:
            cc-w1: "#e3eedc"
            cc-w2: "#e3eedc"
            cc-w3: "#e3eedc"
            cc-w4: "#e3eedc"
            cc-w5: "#e3eedc"
        - say: "The result: `/home` untouched, `/profile` degraded instantly rather than hanging, and payments gets the silence it needs to recover. The bulkhead contained the damage; the breaker ended it."
          unhl: [ cc-pay ]
          text:
            cc-m3: "blast radius: one degraded feature"
            cc-note: timeout bounds one call · bulkhead bounds the damage · breaker ends it
            cc-v: contained, fast, and recoverable — all three layers doing one job each
          fill:
            cc-v: "#2f6b3f"
            cc-verd: "#e3eedc"
            cc-u2: "#5f6f66"
concepts:
  - term: Circuit breaker
    short: A state machine around a dependency that stops calling it once it is clearly failing, and probes later to see whether it recovered.
    see: [ Closed, Open, Half-open, Bulkhead ]
    detail: |-
      Borrowed from electrical engineering, where a breaker trips to protect the <em>circuit</em>, not the fault. The software version protects the caller: it stops you spending threads, connections and time on calls that are going to fail anyway, and incidentally gives the struggling dependency some quiet.

      It is deliberately simple — three states, two thresholds and a timer — and almost all the value comes from the fast failure rather than from any cleverness in the counting.

      #### Who it protects

      | Mechanism | Protects | From |
      | --- | --- | --- |
      | Circuit breaker | the caller | a failing dependency |
      | Load shedding | yourself | your own overload |
      | Rate limiting | you and other tenants | one noisy client |
      | Backpressure | the whole chain | unbounded queueing |

      #### How it relates

      - Pair it with a fallback: a fast failure is only useful if you have something to do with it.
  - term: Closed
    short: "The normal state: calls pass through and their outcomes are recorded in a rolling window."
    see: [ Failure threshold, Rolling window, Open ]
    detail: |-
      Closed is not "not monitoring". Every call's outcome feeds a window, and the breaker evaluates the failure rate continuously. The cost is a couple of atomic operations per call, which is why breakers can sit in front of every dependency without being noticeable.

      The important design decision in this state is what counts as a failure — get that wrong and the breaker either never trips or trips constantly.

      #### How it relates

      - A breaker that has never opened in production is usually misconfigured, not lucky.
  - term: Open
    short: "The tripped state: calls fail immediately without touching the dependency."
    see: [ Closed, Half-open, Break duration, Fallback ]
    detail: |-
      Two things happen at once. The caller stops paying a timeout per call, so its threads and connections are returned immediately; and the dependency stops receiving traffic, which is frequently what it needs to recover — a service being hammered by retries cannot drain its own backlog.

      From the caller's perspective the failure is now fast and <em>deterministic</em>: it knows instantly that the feature is unavailable, which is what makes a sensible fallback possible.

      #### What changes when it opens

      |  | Closed and failing | Open |
      | --- | --- | --- |
      | Latency per call | 2,000 ms | ~1 ms |
      | Workers occupied | all of them | none |
      | Load on dependency | full, plus retries | zero |
      | Caller's other features | starved | unaffected |

      #### How it relates

      - Open is where graceful degradation takes over — the breaker hands it a clean signal.
  - term: Half-open
    short: "The trial state: a strictly limited number of calls are allowed through to test whether the dependency has recovered."
    see: [ Open, Probe limit, Break duration ]
    anim:
      key: probe
      title: Why the probe limit exists
      svg: circuit-breaker/probe.svg
      alt: A recovering service hit by full traffic when the breaker closes, versus a limited number of trial calls in half-open
      steps:
        - say: The breaker has been open for thirty seconds. A thousand calls a second are being rejected instantly, and the service downstream has received nothing at all.
          hl: [ pb-br ]
        - say: It has used that quiet to drain its backlog. It is nearly healthy — but it is not yet ready for a thousand requests a second.
          hl: [ pb-svc ]
          unhl: [ pb-br ]
          text:
            pb-svct: backlog drained · fragile
        - say: The naive move is to close the breaker when the timer expires. All thousand requests a second arrive in the same instant.
          unhl: [ pb-svc ]
          text:
            pb-brt: CLOSED · full traffic released
            pb-flow: 1,000 / s
            pb-svct: overwhelmed again
            pb-msg: the recovering service is flattened immediately
          fill:
            pb-flow: "#c53b3b"
            pb-svct: "#c53b3b"
            pb-msg: "#c53b3b"
            pb-svc: "#f9e3df"
        - say: It fails, the breaker reopens, and thirty seconds later exactly the same thing happens. A flapping loop that can continue for hours — and with fifty caller instances, all probing in unison, it is guaranteed.
          text:
            pb-brt: OPEN again · and again · and again
            pb-msg: recovery itself is what keeps breaking it
            pb-msg2: fifty instances probing in unison makes it certain
        - say: "Half-open fixes it: allow three trial calls, keep rejecting everything else. Three succeed, the breaker closes, and the service was never exposed to more than it could handle. Jitter the break duration too, so the fleet does not probe in lockstep."
          text:
            pb-brt: HALF-OPEN · 3 probes
            pb-flow: 3 calls
            pb-svct: answers all three · healthy
            pb-msg: a test, not a reopening
            pb-msg2: cap the probes · jitter the cooldown · back off on repeated failure
          fill:
            pb-flow: "#2f6b3f"
            pb-svct: "#2f6b3f"
            pb-msg: "#2f6b3f"
            pb-svc: "#e3eedc"
    detail: |-
      The limit is the entire point. If the breaker simply closed after the cooldown, a recovering service would receive the full traffic rate in one instant and fall straight over, tripping the breaker again — a flapping loop that can continue indefinitely.

      Allowing two or three concurrent probes while everything else keeps failing fast lets you learn whether it is healthy at almost no cost to it.

      ::anim probe::

      #### How it relates

      - Same reasoning as hysteresis in load shedding: never flip state on a single observation.
  - term: Failure threshold
    short: The rate and volume of failures that trip the breaker — expressed as a percentage over a minimum number of calls.
    see: [ Rolling window, Minimum throughput, Closed ]
    detail: |-
      Use a rate rather than a count: "5 consecutive failures" behaves completely differently at 10 requests a second and at 10,000. Fifty percent over a window of twenty calls is a reasonable starting point for most internal dependencies.

      Lower thresholds for dependencies that are optional (fail fast and degrade), higher for ones you cannot do without (if the breaker opens the feature is dead anyway, so give it more chances).

      #### Starting points

      | Dependency | Threshold | Break |
      | --- | --- | --- |
      | Optional enrichment | 25% of 20 | 10 s |
      | Normal internal service | 50% of 20 | 30 s |
      | Critical, no fallback | 70% of 50 | 5 s |
      | Third-party API | 50% of 20 | 60 s |

      #### How it relates

      - Tune from your actual error-rate distribution, not from a blog post's defaults — including this one.
  - term: Minimum throughput
    short: The requirement that enough calls have been seen before the breaker is allowed to trip.
    see: [ Failure threshold, Rolling window ]
    detail: |-
      Without it, one failure out of two calls is a 50% failure rate and trips the breaker on a quiet endpoint. With a minimum of twenty calls per window, the breaker ignores statistically meaningless samples — which matters most at night, when traffic is low and a single blip would otherwise disable a feature until morning.

      #### How it relates

      - Low-traffic dependencies may need active health checks instead; a breaker needs volume to see anything.
  - term: Rolling window
    short: The recent history the failure rate is computed over — by count or by time.
    see: [ Failure threshold, Minimum throughput ]
    detail: |-
      A count-based window ("the last 100 calls") reacts consistently regardless of traffic but can hold stale information on a quiet endpoint. A time-based window ("the last 10 seconds") always reflects the present but may contain too few samples to be meaningful. Most libraries offer both; time-based with a minimum-throughput guard is the safer default.

      #### Trade-off

      |  | Count-based | Time-based |
      | --- | --- | --- |
      | Consistent sample size | yes | no |
      | Always current | no | yes |
      | Needs min-throughput guard | less | yes |

      #### How it relates

      - Window length also sets how fast the breaker can close again after recovery.
  - term: What counts as a failure
    short: The most consequential configuration choice, and the one most often left at its default.
    see: [ Failure threshold, Slow-call breaker, Timeout ]
    detail: |-
      Timeouts, connection errors and 5xx responses are failures. A `404` or a `400` is not — the dependency answered correctly, and counting those means a client sending bad input can trip your breaker and disable a feature for everybody. A `429` is a judgement call: it usually means you should back off, which is breaker-like behaviour, but it also means the service is alive.

      And business exceptions must never count. "Insufficient funds" is a successful call with an unwelcome answer.

      #### Classification

      | Outcome | Failure? |
      | --- | --- |
      | Timeout, connection refused | yes |
      | 500, 502, 503, 504 | yes |
      | Call slower than the limit | yes — slow is broken |
      | 400, 404, 409, 422 | no |
      | 429 | usually no; back off instead |
      | Business exception | never |

      #### How it relates

      - Counting 4xx as failures is the most common way a breaker becomes an outage amplifier.
  - term: Slow-call breaker
    short: Tripping on latency as well as errors, because a dependency that answers in eight seconds is broken even if it answers correctly.
    see: [ What counts as a failure, Timeout, Bulkhead ]
    detail: |-
      The dangerous failure mode is not the one that throws — it is the one that slowly succeeds. A dependency returning 200s at eight seconds each will fill every worker you own without ever incrementing an error counter, so an error-only breaker sits closed throughout the outage.

      Resilience4j calls this the slow-call rate threshold; Polly expresses it through a timeout strategy that converts slowness into a failure the breaker can see.

      #### Typical settings

      | Setting | Example |
      | --- | --- |
      | Slow-call duration | 2× the p99 |
      | Slow-call rate threshold | 50% |
      | Timeout | below the caller's own deadline |

      #### How it relates

      - Without a timeout there is no slow-call signal at all, which is why timeouts come first.
  - term: Timeout
    short: "The prerequisite: a breaker cannot count a failure that never finishes."
    see: [ Slow-call breaker, What counts as a failure, Bulkhead ]
    detail: |-
      A call with no timeout can hang for the lifetime of the connection, and many HTTP clients default to no timeout at all. The breaker sees neither a success nor a failure — just a worker that never comes back — so it stays closed while the service dies.

      Set the timeout below the caller's own deadline, and make sure it covers connect, TLS, send, and read — "connection timeout" alone is not enough.

      #### Order to apply

      | # | Layer |
      | --- | --- |
      | 1 | Timeout — bound every call |
      | 2 | Bulkhead — bound concurrency |
      | 3 | Circuit breaker — stop calling |
      | 4 | Retry — only outside the breaker |
      | 5 | Fallback — do something useful |

      #### How it relates

      - Getting this order wrong — especially retry inside the breaker — produces surprising behaviour.
  - term: Bulkhead
    short: A bounded pool per dependency, so no single one can occupy all your workers while it fails.
    see: [ Circuit breaker, Timeout, Open ]
    detail: |-
      Named after ship compartments: flooding one should not sink the vessel. Give payments five concurrent slots out of twenty, and a payments outage can consume at most a quarter of your capacity — the other fifteen workers keep serving everything that does not need payments.

      It is the half of the pattern that works <em>before</em> the breaker trips, during the window when failures are accumulating but the threshold has not been reached. Many cascading failures happen entirely inside that window.

      #### Sizing

      | Dependency | Share of the pool |
      | --- | --- |
      | Critical, most requests use it | large |
      | Optional enrichment | small — 10–20% |
      | Known-flaky third party | small, plus a tight timeout |

      #### How it relates

      - Bulkheads apply the same idea as per-queue separation against head-of-line blocking.
  - term: Fallback
    short: What you actually do when the breaker is open — the part that turns a fast failure into a working product.
    see: [ Open, Graceful degradation, Circuit breaker ]
    detail: |-
      A breaker with no fallback converts a slow error into a fast error, which helps your infrastructure and not your user. The valuable version substitutes something: a cached value, a stale-but-acceptable answer, a default, a reduced feature set, or an honest "unavailable right now" that the UI handles well.

      Fallbacks must be cheap and must not depend on the thing that is broken — a fallback that calls a second service in the same failing cluster is not a fallback.

      #### Fallbacks, best first

      | Fallback | Good for |
      | --- | --- |
      | Serve stale from cache | catalogue, prices, profiles |
      | A sensible default | recommendations, ranking |
      | Omit the section | optional page content |
      | Queue for later | writes that can be async |
      | Honest error | payments — never fake a success |

      #### How it relates

      - The graceful degradation page is about designing these fallbacks as a product, not an afterthought.
  - term: Breaker per dependency
    short: One breaker per downstream service — and often per endpoint — never one global breaker.
    see: [ Bulkhead, Circuit breaker, Outlier detection ]
    detail: |-
      A shared breaker means a failing recommendations service can disable your payments calls. Scope each breaker to the thing that can fail independently: usually per service, and per endpoint when one route is much heavier or more fragile than the others.

      Per-<em>instance</em> scoping matters too: if one of six replicas is bad, a service-level breaker sees a 17% failure rate and never trips, while the bad instance keeps failing a sixth of your traffic. That is what outlier detection solves.

      #### Scope

      | Scope | Verdict |
      | --- | --- |
      | Global | never — unrelated failures couple |
      | Per service | the default |
      | Per endpoint | when costs differ a lot |
      | Per instance | outlier detection, usually in a proxy |

      #### How it relates

      - Envoy's outlier detection ejects individual bad hosts, which a client-side breaker cannot see.
  - term: Outlier detection
    short: "Passive per-instance health checking: eject the single bad replica instead of tripping on the whole service."
    see: [ Breaker per dependency, Sidecar, Circuit breaker ]
    detail: |-
      Service meshes watch per-host error rates and remove a misbehaving instance from the load-balancing pool for a while, returning it gradually. This handles the very common case that a breaker is bad at: one unhealthy pod out of many, which never produces a high enough aggregate failure rate to trip anything.

      It composes well — outlier detection for instance-level problems, a breaker for service-level ones.

      #### Typical Envoy settings

      | Setting | Meaning |
      | --- | --- |
      | `consecutive_5xx` | errors before ejecting a host |
      | `base_ejection_time` | how long it stays out |
      | `max_ejection_percent` | never eject the whole pool |

      #### How it relates

      - In a mesh this is free; without one, client-side load balancers often provide something similar.
  - term: Retries and breakers
    short: They interact badly unless you decide which sits inside which.
    see: [ Timeout, Circuit breaker, Failure threshold ]
    detail: |-
      If the retry is <em>inside</em> the breaker, one logical call produces three recorded failures and the breaker trips three times faster than you configured. If the retry is <em>outside</em>, it will dutifully retry the breaker's instant rejections, converting a fast failure into a fast loop.

      The usual arrangement: timeout, then retry, then breaker — so the breaker records one outcome per logical operation — and the retry policy must treat the breaker's open-circuit exception as non-retryable.

      #### Rules

      | Rule | Why |
      | --- | --- |
      | One outcome per logical call | thresholds mean what you set |
      | Never retry an open circuit | otherwise it is a busy loop |
      | Retry only idempotent calls | a timeout may have succeeded |
      | Budget retries globally | caps amplification |

      #### How it relates

      - Retry amplification is covered in detail on the backpressure page.
  - term: Half-open stampede
    short: The failure where recovery itself re-breaks the dependency, over and over.
    see: [ Half-open, Probe limit, Break duration ]
    detail: |-
      Fifty caller instances each open a breaker at the same moment, and thirty seconds later all fifty probe simultaneously. The recovering service receives a synchronised burst, falls over, and every breaker reopens — forever, on a thirty-second cycle.

      Fixes: cap concurrent probes per instance, jitter the break duration, and increase the cooldown after each failed probe so the system backs off instead of pulsing.

      #### Defences

      | Defence | Effect |
      | --- | --- |
      | Probe limit (1–3) | tiny load per instance |
      | Jittered break duration | desynchronises the fleet |
      | Exponential break increase | backs off after repeated failures |
      | Ramp traffic on close | no instant full load |

      #### How it relates

      - The animation inside **half-open** walks this failure and its fix.
  - term: Observability
    short: State transitions are incidents in their own right, and should be visible as events rather than inferred from error graphs.
    see: [ Circuit breaker, Open, Fallback ]
    detail: |-
      Export the current state per breaker, a counter of transitions, the rolling failure rate, and how many calls were rejected while open. A breaker opening is one of the highest-signal events in a distributed system — it means something downstream is genuinely broken, and it usually precedes the user-visible symptoms.

      It is also worth alerting on breakers that have <em>never</em> opened: usually a sign of a threshold that cannot be reached, which means the protection does not exist.

      #### Metrics

      | Metric | Use |
      | --- | --- |
      | `breaker_state` | dashboard, per dependency |
      | `breaker_transitions_total` | flapping detection |
      | `breaker_rejected_total` | blast radius while open |
      | `fallback_used_total` | is the fallback actually working? |

      #### How it relates

      - Rejections while open are shed requests — count them separately from errors, as on the load-shedding page.
commands:
  heading: Essential code patterns
  tocLabel: Code patterns
  groups:
    - group: The whole stack, in order (.NET / Polly)
      items:
        - lang: csharp
          code: |-
            var pipeline = new ResiliencePipelineBuilder<HttpResponseMessage>()
                // 5 — do something useful when it fails
                .AddFallback(new FallbackStrategyOptions<HttpResponseMessage> {
                    FallbackAction = _ => Outcome.FromResultAsValueTask(CachedCatalogue()) })
                // 3 — stop calling once it is clearly broken
                .AddCircuitBreaker(new CircuitBreakerStrategyOptions<HttpResponseMessage> {
                    FailureRatio      = 0.5,                        // 50% …
                    MinimumThroughput = 20,                         // … of at least 20 calls
                    SamplingDuration  = TimeSpan.FromSeconds(30),
                    BreakDuration     = TimeSpan.FromSeconds(30),
                    ShouldHandle      = args => ValueTask.FromResult(IsTransient(args.Outcome)),
                })
                // 2 — bound how much of me this dependency may occupy
                .AddConcurrencyLimiter(permitLimit: 5)
                // 1 — a call that never ends is never counted
                .AddTimeout(TimeSpan.FromSeconds(2))
                .Build();
          what: "Polly applies strategies outermost-first, so this reads bottom-up at execution time: timeout, bulkhead, breaker, fallback."
        - lang: csharp
          code: |-
            static bool IsTransient(Outcome<HttpResponseMessage> o) =>
                o.Exception is TimeoutRejectedException or HttpRequestException
                || (int?)o.Result?.StatusCode >= 500;      // 5xx only

            // NOT failures: 400, 404, 409, 422 — the dependency answered correctly.
            // Counting those lets one client with bad input disable a feature for everyone.
          what: The single most important line of breaker configuration, and the one most often left at a permissive default.
    - group: Slow calls are failures (Java / Resilience4j)
      items:
        - code: |-
            CircuitBreakerConfig.custom()
                .slidingWindowType(SlidingWindowType.TIME_BASED)
                .slidingWindowSize(30)                 // seconds
                .minimumNumberOfCalls(20)
                .failureRateThreshold(50)              // percent
                .slowCallRateThreshold(50)             // percent …
                .slowCallDurationThreshold(Duration.ofSeconds(2))   // … slower than this
                .waitDurationInOpenState(Duration.ofSeconds(30))
                .permittedNumberOfCallsInHalfOpenState(3)           // the probe limit
                .build();
          what: A dependency returning 200s in eight seconds will exhaust your workers without raising a single error. The slow-call threshold is what catches it.
    - group: Go
      items:
        - code: |-
            cb := gobreaker.NewCircuitBreaker(gobreaker.Settings{
                Name:        "payments",
                MaxRequests: 3,                         // probes allowed in half-open
                Interval:    30 * time.Second,          // rolling window
                Timeout:     30 * time.Second,          // break duration
                ReadyToTrip: func(c gobreaker.Counts) bool {
                    return c.Requests >= 20 &&
                        float64(c.TotalFailures)/float64(c.Requests) > 0.5
                },
                OnStateChange: func(name string, from, to gobreaker.State) {
                    log.Warn("breaker", "dep", name, "from", from, "to", to)   // alert on this
                },
            })

            resp, err := cb.Execute(func() (any, error) { return client.Do(req) })
            if errors.Is(err, gobreaker.ErrOpenState) { return cachedCatalogue(), nil }
          what: "`MaxRequests` is the probe limit, and `ReadyToTrip` carries the minimum-throughput guard that stops a quiet endpoint tripping on one bad call."
    - group: "In the mesh: eject bad instances"
      items:
        - code: |-
            # Envoy — a breaker trips on the whole service; this ejects one bad host
            outlier_detection:
              consecutive_5xx: 5
              interval: 10s
              base_ejection_time: 30s
              max_ejection_percent: 50        # never eject everything

            circuit_breakers:                  # Envoy's "breaker" is really a bulkhead
              thresholds:
                - priority: DEFAULT
                  max_connections: 100
                  max_pending_requests: 50
                  max_requests: 100
                  max_retries: 3               # caps retry amplification at the proxy
          what: One unhealthy pod out of six produces a 17% error rate — too low to trip a service-level breaker, and exactly what outlier detection is for.
    - group: Retry and breaker, arranged correctly
      items:
        - lang: python
          code: |-
            # retry INSIDE the breaker  → 3 retries = 3 recorded failures = trips 3× too fast
            # retry OUTSIDE the breaker → retries the instant rejections = a busy loop

            # correct: one recorded outcome per logical call, and never retry an open circuit
            if isinstance(err, CircuitOpenError):
                raise                      # non-retryable by policy
          what: Most "my breaker trips immediately" reports are a retry policy sitting on the wrong side of it.
    - group: What to export
      items:
        - code: |-
            breaker_state{dep="payments"}              # 0 closed, 1 open, 2 half-open
            breaker_transitions_total{to="open"}       # alert on this — it is a real event
            breaker_rejected_total{dep="payments"}     # blast radius while open
            breaker_failure_rate{dep="payments"}
            fallback_used_total{dep="payments"}        # is the fallback actually working?

            # also alert on the opposite: a breaker that has NEVER opened in production
            # usually has a threshold it cannot reach.
          what: A breaker opening is one of the highest-signal events available — it almost always precedes the user-visible symptoms.
prosCons:
  good:
    heading: Pros
    items:
      - Stops a failing dependency from consuming the caller's threads, connections and memory.
      - "Contains the blast radius: one broken feature instead of a whole service."
      - Gives the struggling dependency silence, which is often what it needs to recover.
      - Produces a fast, deterministic failure that a fallback or degraded mode can rely on.
      - State transitions are high-signal alerts that usually precede user-visible symptoms.
      - Available as a few lines of configuration in every mainstream library and proxy.
  bad:
    heading: Cons
    items:
      - Fixes nothing on its own — without a fallback it just fails faster.
      - Misconfigured thresholds either never trip or disable healthy features.
      - Counting 4xx as failures lets one client's bad input break everybody's feature.
      - Needs enough traffic to see a rate; quiet endpoints need health checks instead.
      - Half-open probes can stampede a recovering service across a large fleet.
      - Interacts badly with retries unless the ordering is deliberate.
when:
  note: timeout first, then bulkhead, then breaker — a breaker without a timeout protects nothing
  good:
    heading: Use it when…
    items:
      - You call a remote dependency that can fail or slow down independently of you.
      - A dependency's failure would otherwise exhaust your threads, connections or pool.
      - There is something sensible to do instead — a cache, a default, a reduced feature.
      - The dependency benefits from being left alone while it recovers.
      - Traffic is high enough that a failure <em>rate</em> is statistically meaningful.
  bad:
    heading: Avoid it when…
    items:
      - The call is local and in-process. Use **ordinary error handling**.
      - Traffic is too low to compute a rate. Use **active health checks and timeouts**.
      - The dependency is slow rather than failing, and you can simply go slower. Use **backpressure**.
      - The problem is your own overload, not theirs. Use **load shedding**.
      - One instance is bad rather than the whole service. Use **outlier detection** in the proxy or load balancer.
      - There is no possible fallback and the feature is critical. Use **a breaker with a short break** and accept that it only protects the caller.
useCases:
  - title: A payment provider degrading
    body: The provider starts timing out at two seconds. Without a breaker every worker fills with payment calls and the whole storefront stops. With one, payment calls fail in a millisecond, browsing is untouched, and checkout shows an honest "try again shortly" instead of hanging.
  - title: One bad pod out of six
    body: A single replica has a corrupted cache and returns 500s. The aggregate error rate is 17% — too low to trip a breaker. Outlier detection in the mesh ejects that instance for thirty seconds and the error rate returns to zero without anyone being paged.
  - title: Optional enrichment on a hot path
    body: A personalisation service is nice to have and frequently slow. A tight timeout, a bulkhead of three, and an aggressive breaker mean it either answers in 50 ms or is skipped entirely — and the page renders either way.
  - title: Letting a database recover
    body: A database is overwhelmed and every query times out. Retrying keeps it pinned. The breaker opens, queries stop entirely for thirty seconds, the backlog drains, and a probe finds it healthy — a recovery that could not have happened under continuous load.
  - title: Third-party API with a monthly incident
    body: A shipping-rates API fails for twenty minutes every few weeks. The breaker opens, a cached rate table serves as the fallback, and customers see slightly stale shipping prices instead of a broken checkout. Nobody is paged.
gotchas:
  items:
    - mistake: No timeout underneath it
      why: A breaker can only count calls that finish. With no timeout — the default in several HTTP clients — calls hang indefinitely, the breaker stays closed, and your workers disappear one by one.
      fix: set a timeout on every call, covering connect, TLS, send and read, and keep it below your own deadline. The breaker is the third layer, not the first.
    - mistake: Counting 4xx as failures
      why: One client sending malformed requests drives the failure rate past the threshold, the breaker opens, and a perfectly healthy dependency becomes unavailable for every other caller.
      fix: only timeouts, connection errors, 5xx and slow calls count. 400, 404, 409 and 422 mean the dependency answered correctly.
    - mistake: Ignoring slow successes
      why: An error-only breaker sits closed while a dependency returns 200s in eight seconds and quietly consumes every worker you have. This is the most common cascading failure in practice.
      fix: add a slow-call threshold, or a timeout that converts slowness into a countable failure. Slow is broken.
    - mistake: A breaker with no fallback
      why: You have replaced a slow error with a fast error. Your infrastructure is happier; the user sees the same broken page.
      fix: decide the fallback before configuring the breaker — stale cache, a default, or omitting the section. If there genuinely is none, say so explicitly in the UI.
    - mistake: Half-open stampede
      why: Fifty instances trip together and probe together thirty seconds later. The recovering service is hit by a synchronised burst, dies, and the cycle repeats indefinitely.
      fix: cap concurrent probes at one to three per instance, jitter the break duration, and lengthen it after each failed probe.
    - mistake: Retry on the wrong side
      why: Retries inside the breaker make it trip three times faster than configured; retries outside it loop on instant rejections.
      fix: record one outcome per logical call, and mark the open-circuit exception as non-retryable in your retry policy.
    - mistake: One breaker for everything
      why: A shared breaker couples unrelated dependencies, so a failing recommendations service disables your payment calls.
      fix: one breaker per dependency, and per endpoint when their cost or reliability differ. Add outlier detection for per-instance problems.
    - mistake: Tripping on a quiet endpoint
      why: At 02:00 an endpoint gets two calls, one fails, and a 50% failure rate disables the feature until the morning.
      fix: require a minimum throughput — typically twenty calls — before the breaker may trip at all.
alternatives:
  columns:
    - Mechanism
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs a circuit breaker
  rows:
    - self: true
      cells:
        - "**Circuit breaker**"
        - a dependency that is failing or slow
        - Low
        - free
        - —
    - cells:
        - "**Timeout alone**"
        - the minimum viable protection
        - Very low
        - free
        - Bounds one call; does nothing about the thousandth consecutive failure
    - cells:
        - "**Bulkhead**"
        - containing blast radius
        - Low
        - free
        - Caps how much you lose while failing; does not stop calling. Use both
    - cells:
        - "**Outlier detection**"
        - one bad instance among many
        - Low
        - mesh or LB feature
        - Per-host ejection; sees what an aggregate breaker cannot
    - cells:
        - "**Load shedding**"
        - your own overload
        - Medium
        - free
        - Refuses inbound work; a breaker refuses outbound calls
    - cells:
        - "**Backpressure**"
        - a dependency that is slow, not broken
        - Low
        - free
        - Keeps flowing at a lower rate instead of stopping entirely
    - cells:
        - "**Retry with backoff**"
        - brief, transient blips
        - Low
        - free
        - Assumes the next attempt may work; makes a sustained outage worse
  notes:
    - "**Pick a timeout** first, always — it is the foundation everything else is built on."
    - "**Pick a bulkhead** alongside the breaker; it protects you during the window before the threshold is reached."
    - "**Pick outlier detection** when failures are concentrated in one instance rather than the service."
    - "**Pick backpressure** when the dependency still works and you can simply go at its pace."
    - "**Pick retries** only for short transient errors, with jitter and a budget — and never inside the breaker."
