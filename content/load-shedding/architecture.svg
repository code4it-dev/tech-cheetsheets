<svg viewBox="0 0 800 346" role="img" aria-label="Incoming traffic classified by priority, admitted up to capacity and shed beyond it, with the cost of a rejection compared to a timeout">
  <defs>
    <marker id="ls-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="ls-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">admission control sits in front of capacity and answers one question: is this request worth a slot?</text>

  <rect x="20" y="44" width="150" height="110" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="95" y="68" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">offered load</text>
  <text x="95" y="92" font-size="14" text-anchor="middle" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">3,000 / s</text>
  <text x="95" y="114" font-size="10.5" text-anchor="middle" fill="#5f6f66">more than you have</text>
  <text x="95" y="134" font-size="10.5" text-anchor="middle" fill="#5f6f66">and that is a given</text>
  <line x1="174" y1="99" x2="198" y2="99" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ls-arr)"/>

  <rect x="202" y="44" width="228" height="110" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="316" y="66" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">admission control</text>
  <text x="216" y="88" font-size="10.5" fill="#5f6f66">1 &middot; classify &mdash; how valuable?</text>
  <text x="216" y="106" font-size="10.5" fill="#5f6f66">2 &middot; check the signal &mdash; am I full?</text>
  <text x="216" y="124" font-size="10.5" fill="#5f6f66">3 &middot; admit or refuse, in ~0.1 ms</text>
  <text x="216" y="144" font-size="10.5" fill="#2f6b3f">before any expensive work happens</text>

  <line x1="434" y1="78" x2="458" y2="78" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ls-arr)"/>
  <line x1="434" y1="126" x2="458" y2="126" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#ls-red)"/>

  <rect x="462" y="44" width="318" height="52" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="478" y="66" font-size="11.5" fill="#23362e" font-weight="700">admitted &mdash; 1,000 / s</text>
  <text x="478" y="85" font-size="10.5" fill="#5f6f66">served properly, at normal latency, inside the SLO</text>

  <rect x="462" y="102" width="318" height="52" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="478" y="124" font-size="11.5" fill="#23362e" font-weight="700">shed &mdash; 2,000 / s</text>
  <text x="478" y="143" font-size="10.5" fill="#5f6f66">503 + Retry-After, immediately, costing almost nothing</text>

  <rect x="20" y="176" width="372" height="146" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="206" y="198" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">shed from the bottom up</text>
  <rect x="36" y="210" width="340" height="24" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="46" y="227" font-size="10.5" fill="#23362e">critical &mdash; checkout, payments &nbsp;·&nbsp; never shed</text>
  <rect x="36" y="238" width="340" height="24" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="46" y="255" font-size="10.5" fill="#23362e">standard &mdash; browse, search &nbsp;·&nbsp; shed last</text>
  <rect x="36" y="266" width="340" height="24" rx="4" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="46" y="283" font-size="10.5" fill="#23362e">background &mdash; recommendations &nbsp;·&nbsp; shed first</text>
  <rect x="36" y="294" width="340" height="24" rx="4" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="46" y="311" font-size="10.5" fill="#23362e">batch &mdash; exports, reindex &nbsp;·&nbsp; shed first, retry later</text>

  <rect x="408" y="176" width="372" height="146" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="594" y="198" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">why it works at all</text>
  <text x="424" y="224" font-size="11" fill="#5f6f66">cost of refusing a request</text>
  <text x="760" y="224" font-size="11.5" text-anchor="end" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">~0.1 ms</text>
  <text x="424" y="248" font-size="11" fill="#5f6f66">cost of a request that times out</text>
  <text x="760" y="248" font-size="11.5" text-anchor="end" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">~2,000 ms</text>
  <line x1="424" y1="260" x2="760" y2="260" stroke="#d5dccf"/>
  <text x="424" y="282" font-size="11" fill="#23362e" font-weight="600">one server can refuse ~20,000 / s</text>
  <text x="424" y="302" font-size="10.5" fill="#5f6f66">while serving its full capacity of real work</text>

  <text class="hand" x="408" y="340" font-size="16" fill="#c53b3b">saying no is 20,000x cheaper than failing slowly</text>
</svg>
