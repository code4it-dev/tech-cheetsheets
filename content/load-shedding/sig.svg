<svg viewBox="0 0 560 200" role="img" aria-label="A queue whose depth stays constant while its sojourn time doubles after capacity halves">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">same queue, same depth &mdash; and a completely different experience</text>
  <rect id="sg-q" x="30" y="48" width="230" height="56" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="145" y="70" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">work queue</text>
  <text id="sg-qt" x="145" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">depth 40 · drain 800/s</text>
  <rect id="sg-rule1" x="290" y="48" width="240" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="sg-r1" x="410" y="66" font-size="10.5" text-anchor="middle" fill="#5f6f66">rule A: shed if depth &gt; 100</text>
  <rect id="sg-rule2" x="290" y="80" width="240" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="sg-r2" x="410" y="98" font-size="10.5" text-anchor="middle" fill="#5f6f66">rule B: shed if waiting &gt; 50 ms</text>
  <text id="sg-w" x="280" y="138" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">sojourn = 50 ms</text>
  <text id="sg-msg" x="280" y="166" font-size="11" text-anchor="middle" fill="#5f6f66">both rules agree: nothing to do</text>
</svg>
