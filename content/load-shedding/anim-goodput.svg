<svg viewBox="0 0 800 320" role="img" aria-label="A chart of goodput against offered load showing collapse past capacity without shedding and a plateau with shedding">
  <text id="gp-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">capacity is 1,000 requests a second &mdash; what happens beyond it?</text>

  <line x1="90" y1="250" x2="750" y2="250" stroke="#a9b5a6" stroke-width="1.5"/>
  <line x1="90" y1="50" x2="90" y2="250" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="82" y="96" font-size="10" text-anchor="end" fill="#5f6f66">1,000</text>
  <text x="82" y="254" font-size="10" text-anchor="end" fill="#5f6f66">0</text>
  <text x="30" y="150" font-size="10.5" fill="#5f6f66">goodput</text>
  <text x="420" y="276" font-size="10.5" text-anchor="middle" fill="#5f6f66">offered load &rarr;</text>
  <text x="307" y="266" font-size="10" text-anchor="middle" fill="#5f6f66">1,000</text>
  <text x="523" y="266" font-size="10" text-anchor="middle" fill="#5f6f66">2,000</text>
  <text x="740" y="266" font-size="10" text-anchor="middle" fill="#5f6f66">3,000</text>

  <line x1="90" y1="92" x2="750" y2="92" stroke="#2f6b3f" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="756" y="96" font-size="10" fill="#2f6b3f">capacity</text>
  <line x1="307" y1="50" x2="307" y2="250" stroke="#a9b5a6" stroke-width="1" stroke-dasharray="3 3"/>

  <polyline id="gp-rise" class="hidden" points="90,250 307,92" fill="none" stroke="#2f6b3f" stroke-width="2.5"/>
  <polyline id="gp-bad" class="hidden" points="307,92 360,104 420,132 470,166 523,196 630,228 740,243" fill="none" stroke="#c53b3b" stroke-width="2.5"/>
  <polyline id="gp-good" class="hidden" points="307,92 420,92 523,92 630,92 740,92" fill="none" stroke="#2f6b3f" stroke-width="2.5"/>

  <text id="gp-badl" class="hidden" x="620" y="216" font-size="10.5" fill="#c53b3b" font-weight="600">no shedding</text>
  <text id="gp-goodl" class="hidden" x="620" y="82" font-size="10.5" fill="#2f6b3f" font-weight="600">with shedding</text>

  <rect id="gp-panel" x="90" y="286" width="660" height="26" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text id="gp-read" x="104" y="304" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">offered 0 · goodput 0 · shed 0</text>
  <text id="gp-note" x="736" y="304" font-size="10.5" text-anchor="end" fill="#5f6f66">below capacity, nothing to decide</text>
</svg>
