<svg viewBox="0 0 800 320" role="img" aria-label="Four classes of traffic admitted or shed by priority until capacity is full">
  <text id="pr-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">3,000 / s arriving &nbsp;·&nbsp; 1,000 / s of capacity &nbsp;·&nbsp; two thirds has to go</text>

  <g id="pr-r1">
    <rect x="20" y="44" width="470" height="48" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="36" y="64" font-size="11.5" fill="#23362e" font-weight="700">checkout &amp; payments</text>
    <text x="36" y="82" font-size="10" fill="#5f6f66">400 / s &nbsp;·&nbsp; critical</text>
    <text id="pr-v1" x="474" y="74" font-size="11" text-anchor="end" fill="#5f6f66">waiting</text>
  </g>
  <g id="pr-r2">
    <rect x="20" y="100" width="470" height="48" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="36" y="120" font-size="11.5" fill="#23362e" font-weight="700">browse &amp; search</text>
    <text x="36" y="138" font-size="10" fill="#5f6f66">600 / s &nbsp;·&nbsp; standard</text>
    <text id="pr-v2" x="474" y="130" font-size="11" text-anchor="end" fill="#5f6f66">waiting</text>
  </g>
  <g id="pr-r3">
    <rect x="20" y="156" width="470" height="48" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="36" y="176" font-size="11.5" fill="#23362e" font-weight="700">recommendations</text>
    <text x="36" y="194" font-size="10" fill="#5f6f66">1,200 / s &nbsp;·&nbsp; background</text>
    <text id="pr-v3" x="474" y="186" font-size="11" text-anchor="end" fill="#5f6f66">waiting</text>
  </g>
  <g id="pr-r4">
    <rect x="20" y="212" width="470" height="48" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
    <text x="36" y="232" font-size="11.5" fill="#23362e" font-weight="700">bulk export</text>
    <text x="36" y="250" font-size="10" fill="#5f6f66">800 / s &nbsp;·&nbsp; batch</text>
    <text id="pr-v4" x="474" y="242" font-size="11" text-anchor="end" fill="#5f6f66">waiting</text>
  </g>

  <rect id="pr-cap" x="520" y="44" width="260" height="216" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="650" y="66" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">capacity &mdash; 1,000 / s</text>
  <rect x="548" y="80" width="204" height="150" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <rect id="pr-fill1" class="hidden" x="548" y="170" width="204" height="60" fill="#e3eedc" stroke="#2f6b3f"/>
  <rect id="pr-fill2" class="hidden" x="548" y="80" width="204" height="90" fill="#e3eedc" stroke="#2f6b3f"/>
  <text id="pr-capt" x="650" y="250" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">0 / 1,000 used</text>

  <rect id="pr-out" x="20" y="272" width="760" height="40" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="pr-o" x="400" y="296" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">priority is a business decision, written down before the incident</text>
</svg>
