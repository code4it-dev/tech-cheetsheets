  <text x="131" y="194" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">sparse · BM25 over tokens</text>
  <text id="rh-k1" x="30" y="216" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rh-k2" x="30" y="234" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rh-k3" x="30" y="252" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
