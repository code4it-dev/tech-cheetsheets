<svg viewBox="0 0 800 330" role="img" aria-label="Dense vector search returns semantically similar but wrong chunks while BM25 finds the exact identifier, and reciprocal rank fusion combines both">
  <text id="rh-phase" x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">the query contains an exact identifier: <tspan font-family="Fira Code, monospace">INV-8841</tspan></text>

