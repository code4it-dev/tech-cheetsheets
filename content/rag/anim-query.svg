<svg viewBox="0 0 800 330" role="img" aria-label="A question is embedded, searched against an index, reranked, assembled into a prompt and answered with citations">
  <defs>
    <marker id="rq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="rq-phase" x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">a support agent asks a question about one specific invoice</text>

  <rect id="rq-s1" x="16" y="56" width="130" height="52" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="81" y="78" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">question</text>
  <text id="rq-s1t" x="81" y="96" font-size="9.5" text-anchor="middle" fill="#5f6f66">raw text</text>

  <rect id="rq-s2" x="166" y="56" width="130" height="52" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="231" y="78" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">embed</text>
  <text id="rq-s2t" x="231" y="96" font-size="9.5" text-anchor="middle" fill="#5f6f66">1536 floats</text>

  <rect id="rq-s3" x="316" y="56" width="150" height="52" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="391" y="78" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">retrieve</text>
  <text id="rq-s3t" x="391" y="96" font-size="9.5" text-anchor="middle" fill="#5f6f66">ANN + BM25 · k=50</text>

  <rect id="rq-s4" x="486" y="56" width="130" height="52" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="551" y="78" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">rerank</text>
  <text id="rq-s4t" x="551" y="96" font-size="9.5" text-anchor="middle" fill="#5f6f66">cross-encoder</text>

  <rect id="rq-s5" x="636" y="56" width="148" height="52" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="710" y="78" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">LLM</text>
  <text id="rq-s5t" x="710" y="96" font-size="9.5" text-anchor="middle" fill="#5f6f66">generate + cite</text>

  <line x1="150" y1="82" x2="162" y2="82" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rq-arr)"/>
  <line x1="300" y1="82" x2="312" y2="82" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rq-arr)"/>
  <line x1="470" y1="82" x2="482" y2="82" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rq-arr)"/>
  <line x1="620" y1="82" x2="632" y2="82" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rq-arr)"/>

  <g id="rq-msg" class="hidden">
    <rect x="16" y="120" width="130" height="26" rx="5" fill="#fbf3c4" stroke="#d9c25a"/>
    <text id="rq-msgt" x="81" y="137" font-size="9" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">invoice 8841?</text>
  </g>

  <rect id="rq-pa" x="16" y="160" width="430" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rq-pat" x="30" y="180" font-size="11" fill="#23362e" font-weight="700">candidates</text>
  <text id="rq-a1" x="30" y="202" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-a2" x="30" y="222" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-a3" x="30" y="242" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-a4" x="30" y="262" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-a5" x="30" y="282" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-a6" x="30" y="302" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="rq-pb" x="466" y="160" width="318" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="rq-pbt" x="480" y="180" font-size="11" fill="#23362e" font-weight="700">the prompt the model actually sees</text>
  <text id="rq-b1" x="480" y="202" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-b2" x="480" y="220" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-b3" x="480" y="238" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-b4" x="480" y="256" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="rq-b5" x="480" y="276" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="rq-b6" x="480" y="296" font-size="9.5" fill="#5f6f66">&nbsp;</text>
</svg>
