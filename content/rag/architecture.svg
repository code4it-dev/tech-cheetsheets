<svg viewBox="0 0 800 358" role="img" aria-label="RAG architecture: an offline ingestion pipeline writing into an index, and an online query pipeline reading from it and calling an LLM">
  <defs>
    <marker id="rg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">two pipelines that meet in one index</text>

  <rect x="16" y="36" width="768" height="112" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="30" y="56" font-size="11" fill="#2f6b3f" font-weight="700">INGESTION &mdash; offline, batch or on change</text>

  <rect x="30" y="66" width="120" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="90" y="92" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">sources</text>
  <text x="90" y="110" font-size="9.5" text-anchor="middle" fill="#5f6f66">pdf · wiki · tickets</text>

  <rect x="182" y="66" width="120" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="242" y="92" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">parse + chunk</text>
  <text x="242" y="110" font-size="9.5" text-anchor="middle" fill="#5f6f66">~500 tok · 15% overlap</text>

  <rect x="334" y="66" width="120" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="394" y="92" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">embed</text>
  <text x="394" y="110" font-size="9.5" text-anchor="middle" fill="#5f6f66">1536-dim vector</text>

  <rect x="486" y="66" width="120" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="546" y="92" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">enrich</text>
  <text x="546" y="110" font-size="9.5" text-anchor="middle" fill="#5f6f66">acl · tenant · date</text>

  <rect x="638" y="66" width="132" height="62" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="704" y="92" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">index</text>
  <text x="704" y="110" font-size="9.5" text-anchor="middle" fill="#5f6f66">vectors + text + BM25</text>

  <line x1="154" y1="97" x2="176" y2="97" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>
  <line x1="306" y1="97" x2="328" y2="97" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>
  <line x1="458" y1="97" x2="480" y2="97" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>
  <line x1="610" y1="97" x2="632" y2="97" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>

  <line x1="704" y1="152" x2="704" y2="196" stroke="#2f6b3f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rg-arr)"/>
  <text x="716" y="178" font-size="9.5" fill="#2f6b3f">read</text>

  <rect x="16" y="196" width="768" height="112" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="30" y="216" font-size="11" fill="#c53b3b" font-weight="700">QUERY &mdash; online, per request, on a latency budget</text>

  <rect x="30" y="226" width="112" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="86" y="252" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">question</text>
  <text x="86" y="270" font-size="9.5" text-anchor="middle" fill="#5f6f66">+ rewrite</text>

  <rect x="174" y="226" width="112" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="230" y="252" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">retrieve</text>
  <text x="230" y="270" font-size="9.5" text-anchor="middle" fill="#5f6f66">dense + BM25, k=50</text>

  <rect x="318" y="226" width="112" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="374" y="252" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">rerank</text>
  <text x="374" y="270" font-size="9.5" text-anchor="middle" fill="#5f6f66">50 &rarr; 5</text>

  <rect x="462" y="226" width="112" height="62" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="518" y="252" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">assemble</text>
  <text x="518" y="270" font-size="9.5" text-anchor="middle" fill="#5f6f66">context + question</text>

  <rect x="606" y="226" width="164" height="62" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="688" y="252" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">LLM &rarr; answer + citations</text>
  <text x="688" y="270" font-size="9.5" text-anchor="middle" fill="#5f6f66">grounded in those 5 chunks</text>

  <line x1="146" y1="257" x2="168" y2="257" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>
  <line x1="290" y1="257" x2="312" y2="257" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>
  <line x1="434" y1="257" x2="456" y2="257" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>
  <line x1="578" y1="257" x2="600" y2="257" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rg-arr)"/>

  <text class="hand" x="400" y="334" fill="#c53b3b" font-size="16" text-anchor="middle">if the chunk isn't retrieved, the answer cannot exist. everything else is decoration.</text>
</svg>
