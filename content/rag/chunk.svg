<svg viewBox="0 0 560 210" role="img" aria-label="A document split into overlapping chunks, showing how overlap rescues a sentence that straddles a boundary">
  <text id="ck-phase" x="280" y="18" font-size="11" text-anchor="middle" fill="#5f6f66">one section of a refund policy</text>
  <rect x="20" y="34" width="520" height="40" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="30" y="52" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">…refunds are issued to the original method. The window</text>
  <text x="30" y="68" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">for a refund request is 30 days from delivery…</text>
  <rect id="ck-c1" class="hidden" x="20" y="92" width="230" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text id="ck-c1t" class="hidden" x="135" y="109" font-size="9" text-anchor="middle" fill="#23362e">chunk 1</text>
  <rect id="ck-c2" class="hidden" x="266" y="92" width="274" height="26" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text id="ck-c2t" class="hidden" x="403" y="109" font-size="9" text-anchor="middle" fill="#23362e">chunk 2</text>
  <rect id="ck-ov" class="hidden" x="196" y="92" width="110" height="26" rx="4" fill="#fbf3c4" stroke="#d9c25a"/>
  <text id="ck-ovt" class="hidden" x="251" y="109" font-size="9" text-anchor="middle" fill="#23362e">overlap</text>
  <rect x="20" y="134" width="520" height="62" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text id="ck-n1" x="32" y="154" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="ck-n2" x="32" y="172" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="ck-n3" x="32" y="190" font-size="9.5" fill="#5f6f66">&nbsp;</text>
</svg>
