<svg viewBox="0 0 800 332" role="img" aria-label="A client discovering an MCP server's tools and then calling one, with the JSON-RPC messages shown">
  <defs>
    <marker id="mt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="mt-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">a user asks: &ldquo;how many orders are still unpaid?&rdquo;</text>

  <rect id="mt-host" x="16" y="46" width="180" height="62" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="106" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">host + model</text>
  <text id="mt-hostt" x="106" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">knows no tools yet</text>

  <rect id="mt-client" x="226" y="46" width="160" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="306" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">MCP client</text>
  <text id="mt-clientt" x="306" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">1 client ↔ 1 server</text>

  <rect id="mt-server" x="416" y="46" width="180" height="62" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="506" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">MCP server</text>
  <text id="mt-servert" x="506" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">orders-db</text>

  <rect id="mt-db" x="626" y="46" width="158" height="62" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="705" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">Postgres</text>
  <text id="mt-dbt" x="705" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">read-only role</text>

  <line x1="200" y1="77" x2="220" y2="77" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mt-arr)"/>
  <line x1="390" y1="77" x2="410" y2="77" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mt-arr)"/>
  <line x1="600" y1="77" x2="620" y2="77" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mt-arr)"/>

  <g id="mt-msg" class="hidden">
    <rect x="16" y="112" width="180" height="24" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
    <text id="mt-msgt" x="106" y="128" font-size="8.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  </g>

  <rect id="mt-wire" x="16" y="146" width="440" height="138" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="mt-wt" x="30" y="166" font-size="11" fill="#23362e" font-weight="700">on the wire</text>
  <text id="mt-w1" x="30" y="186" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="mt-w2" x="30" y="202" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="mt-w3" x="30" y="218" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="mt-w4" x="30" y="234" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="mt-w5" x="30" y="250" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="mt-w6" x="30" y="266" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="mt-w7" x="30" y="280" font-size="8.5" fill="#5f6f66">&nbsp;</text>

  <rect id="mt-ctx" x="472" y="146" width="312" height="138" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="mt-ct" x="486" y="166" font-size="11" fill="#23362e" font-weight="700">what the model is shown</text>
  <text id="mt-c1" x="486" y="188" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="mt-c2" x="486" y="208" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="mt-c3" x="486" y="228" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="mt-c4" x="486" y="248" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="mt-c5" x="486" y="268" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="mt-verd" x="16" y="294" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="mt-v" x="400" y="313" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the model never touches the database — it asks the server to</text>
</svg>
