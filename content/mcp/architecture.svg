<svg viewBox="0 0 800 358" role="img" aria-label="MCP architecture: a host containing one client per server, each client talking JSON-RPC to one MCP server which fronts a real system">
  <defs>
    <marker id="mc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one client per server, and the host is the only thing that sees them all</text>

  <rect x="16" y="36" width="250" height="238" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="141" y="58" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">HOST</text>
  <text x="141" y="76" font-size="9.5" text-anchor="middle" fill="#5f6f66">IDE, chat app, agent runtime</text>

  <rect x="30" y="88" width="222" height="56" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="141" y="110" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">the model + the loop</text>
  <text x="141" y="128" font-size="9.5" text-anchor="middle" fill="#5f6f66">decides which tool, and when</text>

  <rect x="30" y="156" width="222" height="34" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="141" y="177" font-size="10" text-anchor="middle" fill="#23362e">client 1</text>
  <rect x="30" y="198" width="222" height="34" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="141" y="219" font-size="10" text-anchor="middle" fill="#23362e">client 2</text>
  <rect x="30" y="240" width="222" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="141" y="258" font-size="10" text-anchor="middle" fill="#5f6f66">client 3 …</text>

  <text x="340" y="150" font-size="9.5" text-anchor="middle" fill="#5f6f66">JSON-RPC 2.0</text>
  <text x="340" y="166" font-size="9.5" text-anchor="middle" fill="#5f6f66">stdio / HTTP</text>
  <line x1="258" y1="173" x2="420" y2="173" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mc-arr)"/>
  <line x1="258" y1="215" x2="420" y2="215" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mc-arr)"/>
  <line x1="258" y1="253" x2="420" y2="253" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mc-arr)"/>

  <rect x="424" y="140" width="190" height="66" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="519" y="162" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">MCP server: postgres</text>
  <text x="519" y="180" font-size="9" text-anchor="middle" fill="#5f6f66">tools · resources · prompts</text>
  <text x="519" y="196" font-size="9" text-anchor="middle" fill="#5f6f66">local process over stdio</text>

  <rect x="424" y="214" width="190" height="60" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="519" y="236" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">MCP server: github</text>
  <text x="519" y="254" font-size="9" text-anchor="middle" fill="#5f6f66">remote, Streamable HTTP + OAuth</text>

  <rect x="640" y="140" width="144" height="66" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="712" y="168" font-size="10" text-anchor="middle" fill="#23362e">your database</text>
  <text x="712" y="186" font-size="9" text-anchor="middle" fill="#5f6f66">real credentials live here</text>

  <rect x="640" y="214" width="144" height="60" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="712" y="240" font-size="10" text-anchor="middle" fill="#23362e">the GitHub API</text>
  <text x="712" y="258" font-size="9" text-anchor="middle" fill="#5f6f66">scoped access token</text>

  <line x1="618" y1="173" x2="634" y2="173" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mc-arr)"/>
  <line x1="618" y1="244" x2="634" y2="244" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#mc-arr)"/>

  <text class="hand" x="400" y="302" fill="#c53b3b" font-size="16" text-anchor="middle">the server is a boundary, not a library. it decides what the model may do &mdash; not the model.</text>
  <text x="400" y="334" font-size="11" text-anchor="middle" fill="#5f6f66">since 2026-07-28 there is no session: each request carries its own version and capabilities in <tspan font-family="Fira Code, monospace">_meta</tspan></text>
</svg>
