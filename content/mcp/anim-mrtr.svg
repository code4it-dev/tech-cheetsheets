<svg viewBox="0 0 800 330" role="img" aria-label="A multi round-trip request: the server returns input_required, the client collects input from the user, and retries the same request with the responses attached">
  <defs>
    <marker id="me-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="me-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the server cannot finish without a confirmation from the human</text>

  <rect id="me-client" x="16" y="46" width="200" height="64" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="116" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">MCP client</text>
  <text id="me-clientt" x="116" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">inside the host</text>

  <rect id="me-server" x="300" y="46" width="200" height="64" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="400" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">MCP server</text>
  <text id="me-servert" x="400" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">refunds</text>

  <rect id="me-user" x="584" y="46" width="200" height="64" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="684" y="70" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">the human</text>
  <text id="me-usert" x="684" y="90" font-size="9.5" text-anchor="middle" fill="#5f6f66">not asked yet</text>

  <line x1="220" y1="78" x2="294" y2="78" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#me-arr)"/>
  <line x1="504" y1="78" x2="578" y2="78" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#me-arr)"/>

  <g id="me-msg" class="hidden">
    <rect x="16" y="114" width="200" height="24" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
    <text id="me-msgt" x="116" y="130" font-size="8.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  </g>

  <rect id="me-panel" x="16" y="150" width="768" height="132" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="me-pt" x="30" y="170" font-size="11" fill="#23362e" font-weight="700">the exchange</text>
  <text id="me-p1" x="30" y="192" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="me-p2" x="30" y="210" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="me-p3" x="30" y="228" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="me-p4" x="30" y="246" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="me-p5" x="30" y="264" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="me-p6" x="30" y="278" font-size="9" fill="#5f6f66">&nbsp;</text>

  <rect id="me-verd" x="16" y="292" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="me-v" x="400" y="311" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the client always initiates — even when the server is the one that needs something</text>
</svg>
