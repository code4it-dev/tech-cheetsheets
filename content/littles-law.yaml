    title: AWS Builders' Library — Using load shedding to avoid overload
    why: what to do when the steady-state assumption fails.
  - url: https://www.infoq.com/presentations/latency-pitfalls/
    title: Gil Tene — How NOT to measure latency
    why: why the mean that Little's Law needs is not the latency you should report to users.
