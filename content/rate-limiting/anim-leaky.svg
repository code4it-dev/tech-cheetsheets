<svg viewBox="0 0 800 265" role="img" aria-label="Animated queueing leaky bucket delaying requests instead of rejecting them">
  <text x="20" y="18" font-size="11" fill="#5f6f66">limit 5 / minute &middot; key = api-key:acme &middot; the same nine arrivals in every algorithm</text>
  <g font-size="11" text-anchor="middle">
    <circle id="lb-q1" cx="70" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="70" y="52" fill="#23362e">1</text><text x="70" y="76" font-size="9.5" fill="#5f6f66">00:10</text>
    <circle id="lb-q2" cx="150" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="150" y="52" fill="#23362e">2</text><text x="150" y="76" font-size="9.5" fill="#5f6f66">00:20</text>
    <circle id="lb-q3" cx="230" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="230" y="52" fill="#23362e">3</text><text x="230" y="76" font-size="9.5" fill="#5f6f66">00:30</text>
    <circle id="lb-q4" cx="310" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="310" y="52" fill="#23362e">4</text><text x="310" y="76" font-size="9.5" fill="#5f6f66">00:58</text>
    <circle id="lb-q5" cx="390" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="390" y="52" fill="#23362e">5</text><text x="390" y="76" font-size="9.5" fill="#5f6f66">00:59</text>
    <circle id="lb-q6" cx="470" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="470" y="52" fill="#23362e">6</text><text x="470" y="76" font-size="9.5" fill="#5f6f66">00:59.5</text>
    <circle id="lb-q7" cx="550" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="550" y="52" fill="#23362e">7</text><text x="550" y="76" font-size="9.5" fill="#5f6f66">01:00</text>
    <circle id="lb-q8" cx="630" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="630" y="52" fill="#23362e">8</text><text x="630" y="76" font-size="9.5" fill="#5f6f66">01:01</text>
    <circle id="lb-q9" cx="710" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="710" y="52" fill="#23362e">9</text><text x="710" y="76" font-size="9.5" fill="#5f6f66">01:02</text>
  </g>
  <line x1="510" y1="26" x2="510" y2="86" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="22" font-size="9.5" text-anchor="middle" fill="#5f6f66">(no window here either)</text>
  <rect x="56" y="100" width="688" height="112" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="76" y="122" font-size="11.5" fill="#5f6f66">queue capacity 5 &middot; drains at a constant 1 request every 12 s</text>
  <g>
    <rect id="lb-s1" x="76" y="140" width="56" height="30" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
    <rect id="lb-s2" x="138" y="140" width="56" height="30" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
    <rect id="lb-s3" x="200" y="140" width="56" height="30" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
    <rect id="lb-s4" x="262" y="140" width="56" height="30" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
    <rect id="lb-s5" x="324" y="140" width="56" height="30" rx="5" fill="#fbfcf8" stroke="#d5dccf"/>
  </g>
  <text id="lb-depth" x="76" y="194" font-size="12.5" fill="#23362e" font-family="Fira Code, monospace">queue depth 0 / 5</text>
  <text id="lb-out" x="430" y="152" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">output: idle</text>
  <text id="lb-delay" x="430" y="178" font-size="14" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">added delay: 0 s</text>
  <text id="lb-tally" x="56" y="240" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">served 0 &middot; dropped 0</text>
  <text id="lb-note" class="hand hidden" x="300" y="244" font-size="15" fill="#c53b3b">nobody got an error &mdash; request 9 waited 56 seconds</text>
</svg>
