<svg viewBox="0 0 800 265" role="img" aria-label="Animated sliding window counter weighting the previous minute by its overlap">
  <text x="20" y="18" font-size="11" fill="#5f6f66">limit 5 / minute &middot; key = api-key:acme &middot; the same nine arrivals in every algorithm</text>
  <g font-size="11" text-anchor="middle">
    <circle id="wc-q1" cx="70" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="70" y="52" fill="#23362e">1</text><text x="70" y="76" font-size="9.5" fill="#5f6f66">00:10</text>
    <circle id="wc-q2" cx="150" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="150" y="52" fill="#23362e">2</text><text x="150" y="76" font-size="9.5" fill="#5f6f66">00:20</text>
    <circle id="wc-q3" cx="230" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="230" y="52" fill="#23362e">3</text><text x="230" y="76" font-size="9.5" fill="#5f6f66">00:30</text>
    <circle id="wc-q4" cx="310" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="310" y="52" fill="#23362e">4</text><text x="310" y="76" font-size="9.5" fill="#5f6f66">00:58</text>
    <circle id="wc-q5" cx="390" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="390" y="52" fill="#23362e">5</text><text x="390" y="76" font-size="9.5" fill="#5f6f66">00:59</text>
    <circle id="wc-q6" cx="470" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="470" y="52" fill="#23362e">6</text><text x="470" y="76" font-size="9.5" fill="#5f6f66">00:59.5</text>
    <circle id="wc-q7" cx="550" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="550" y="52" fill="#23362e">7</text><text x="550" y="76" font-size="9.5" fill="#5f6f66">01:00</text>
    <circle id="wc-q8" cx="630" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="630" y="52" fill="#23362e">8</text><text x="630" y="76" font-size="9.5" fill="#5f6f66">01:01</text>
    <circle id="wc-q9" cx="710" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="710" y="52" fill="#23362e">9</text><text x="710" y="76" font-size="9.5" fill="#5f6f66">01:02</text>
  </g>
  <line x1="510" y1="26" x2="510" y2="86" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="22" font-size="9.5" text-anchor="middle" fill="#c53b3b">minute boundary</text>
  <rect x="56" y="100" width="688" height="112" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="76" y="122" font-size="11.5" fill="#5f6f66">two counters, and one weight &mdash; the fixed window with the boundary filed off</text>
  <text id="wc-prev" x="76" y="150" font-size="12" fill="#23362e" font-family="Fira Code, monospace">prev minute = 0</text>
  <text id="wc-curr" x="76" y="174" font-size="12" fill="#23362e" font-family="Fira Code, monospace">curr minute = 0</text>
  <text id="wc-ovl" x="76" y="198" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">overlap = (60 - elapsed) / 60</text>
  <text id="wc-calc" x="420" y="162" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">estimate = prev x overlap + curr</text>
  <text id="wc-est" x="420" y="190" font-size="14" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">= 0.00</text>
  <text id="wc-tally" x="56" y="240" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">allowed 0 &middot; rejected 0</text>
  <text id="wc-note" class="hand hidden" x="300" y="244" font-size="15" fill="#c53b3b">99% of the log's accuracy, for two integers</text>
</svg>
