<svg viewBox="0 0 800 265" role="img" aria-label="Animated fixed window counter evaluating nine requests across a minute boundary">
  <text x="20" y="18" font-size="11" fill="#5f6f66">limit 5 / minute &middot; key = api-key:acme &middot; the same nine arrivals in every algorithm</text>
  <g font-size="11" text-anchor="middle">
    <circle id="fw-q1" cx="70" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="70" y="52" fill="#23362e">1</text><text x="70" y="76" font-size="9.5" fill="#5f6f66">00:10</text>
    <circle id="fw-q2" cx="150" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="150" y="52" fill="#23362e">2</text><text x="150" y="76" font-size="9.5" fill="#5f6f66">00:20</text>
    <circle id="fw-q3" cx="230" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="230" y="52" fill="#23362e">3</text><text x="230" y="76" font-size="9.5" fill="#5f6f66">00:30</text>
    <circle id="fw-q4" cx="310" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="310" y="52" fill="#23362e">4</text><text x="310" y="76" font-size="9.5" fill="#5f6f66">00:58</text>
    <circle id="fw-q5" cx="390" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="390" y="52" fill="#23362e">5</text><text x="390" y="76" font-size="9.5" fill="#5f6f66">00:59</text>
    <circle id="fw-q6" cx="470" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="470" y="52" fill="#23362e">6</text><text x="470" y="76" font-size="9.5" fill="#5f6f66">00:59.5</text>
    <circle id="fw-q7" cx="550" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="550" y="52" fill="#23362e">7</text><text x="550" y="76" font-size="9.5" fill="#5f6f66">01:00</text>
    <circle id="fw-q8" cx="630" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="630" y="52" fill="#23362e">8</text><text x="630" y="76" font-size="9.5" fill="#5f6f66">01:01</text>
    <circle id="fw-q9" cx="710" cy="48" r="13" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="710" y="52" fill="#23362e">9</text><text x="710" y="76" font-size="9.5" fill="#5f6f66">01:02</text>
  </g>
  <line x1="510" y1="26" x2="510" y2="86" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="22" font-size="9.5" text-anchor="middle" fill="#c53b3b">minute boundary</text>
  <rect x="56" y="100" width="688" height="112" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="400" y="120" font-size="11.5" text-anchor="middle" fill="#5f6f66">one counter per clock minute &mdash; the key name <tspan font-style="italic">is</tspan> the window</text>
  <rect id="fw-wa" x="76" y="130" width="310" height="66" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="231" y="149" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">rl:acme:00</text>
  <text id="fw-ca" x="231" y="172" font-size="14" text-anchor="middle" fill="#c53b3b" font-weight="700" font-family="Fira Code, monospace">counter 0 / 5</text>
  <text id="fw-na" x="231" y="189" font-size="10" text-anchor="middle" fill="#5f6f66">created by the first request</text>
  <rect id="fw-wb" x="414" y="130" width="310" height="66" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="569" y="149" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">rl:acme:01</text>
  <text id="fw-cb" x="569" y="172" font-size="14" text-anchor="middle" fill="#5f6f66" font-weight="700" font-family="Fira Code, monospace">does not exist</text>
  <text id="fw-nb" x="569" y="189" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <text id="fw-tally" x="56" y="240" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">allowed 0 &middot; rejected 0</text>
  <text id="fw-note" class="hand hidden" x="300" y="244" font-size="15" fill="#c53b3b">5 of them landed in a 4-second span</text>
</svg>
