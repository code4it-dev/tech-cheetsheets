<svg viewBox="0 0 800 320" role="img" aria-label="Clients pass through an edge limiter and an application limiter, both reading a shared counter store, before reaching the service">
  <defs>
    <marker id="rl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="rl-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <g font-size="13" text-anchor="middle">
    <rect x="15" y="40" width="110" height="36" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="70" y="63" fill="#23362e">Mobile app</text>
    <rect x="15" y="88" width="110" height="36" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="70" y="111" fill="#23362e">Partner key</text>
    <rect x="15" y="136" width="110" height="36" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="70" y="159" fill="#23362e">Scraper bot</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#rl-arr)">
    <line x1="125" y1="58" x2="178" y2="95"/><line x1="125" y1="106" x2="178" y2="106"/><line x1="125" y1="154" x2="178" y2="118"/>
  </g>
  <rect x="180" y="35" width="150" height="150" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="255" y="58" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Edge limiter</text>
  <text x="255" y="76" font-size="11.5" text-anchor="middle" fill="#5f6f66">CDN &middot; gateway &middot; nginx</text>
  <text x="255" y="102" font-size="11.5" text-anchor="middle" fill="#5f6f66">key = IP / ASN</text>
  <text x="255" y="120" font-size="11.5" text-anchor="middle" fill="#5f6f66">coarse, very cheap</text>
  <text x="255" y="148" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600">stops floods</text>
  <text x="255" y="166" font-size="11.5" text-anchor="middle" fill="#5f6f66">before they cost you</text>
  <line x1="330" y1="110" x2="388" y2="110" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rl-arr)"/>
  <rect x="390" y="35" width="170" height="150" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="475" y="58" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">App limiter</text>
  <text x="475" y="76" font-size="11.5" text-anchor="middle" fill="#5f6f66">middleware &middot; library</text>
  <text x="475" y="102" font-size="11.5" text-anchor="middle" fill="#5f6f66">key = user / tenant / route</text>
  <text x="475" y="120" font-size="11.5" text-anchor="middle" fill="#5f6f66">knows plans and quotas</text>
  <text x="475" y="148" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600">enforces fairness</text>
  <text x="475" y="166" font-size="11.5" text-anchor="middle" fill="#5f6f66">per paying customer</text>
  <line x1="560" y1="110" x2="618" y2="110" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rl-arr)"/>
  <rect x="620" y="60" width="165" height="100" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="702" y="92" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Your service</text>
  <text x="702" y="114" font-size="11.5" text-anchor="middle" fill="#5f6f66">sees only traffic</text>
  <text x="702" y="132" font-size="11.5" text-anchor="middle" fill="#5f6f66">it can actually serve</text>
  <path d="M475 185 L475 232" stroke="#5f6f66" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#rl-arr)"/>
  <path d="M255 185 L255 232" stroke="#5f6f66" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#rl-arr)"/>
  <rect x="180" y="235" width="380" height="62" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="370" y="258" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Shared counter store (Redis)</text>
  <text x="370" y="278" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">rl:{user:42}:2026-11-10T10:05 &rarr; 37</text>
  <path d="M608 198 L492 152" stroke="#c53b3b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#rl-arr-r)"/>
  <text x="612" y="214" font-size="12.5" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">429 + Retry-After</text>
  <text class="hand" x="436" y="312" font-size="16" fill="#c53b3b">rejecting costs ~0.1 ms. Serving costs 100x that.</text>
</svg>
