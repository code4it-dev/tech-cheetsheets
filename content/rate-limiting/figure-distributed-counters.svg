<svg viewBox="0 0 560 190" role="img" aria-label="Two instances both read the counter at 99 and both allow, letting the limit be exceeded">
  <text x="12" y="20" font-size="12" font-weight="600" fill="#23362e">Read, decide, write &mdash; in two round trips, against a limit of 100</text>
  <rect x="12" y="34" width="150" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="87" y="52" font-size="11.5" text-anchor="middle" fill="#23362e">instance A</text>
  <text x="87" y="69" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">GET &rarr; 99</text>
  <rect x="12" y="110" width="150" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="87" y="128" font-size="11.5" text-anchor="middle" fill="#23362e">instance B</text>
  <text x="87" y="145" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">GET &rarr; 99</text>
  <path d="M162 56 L236 84" stroke="#5f6f66" stroke-width="1.5" fill="none"/>
  <path d="M162 132 L236 104" stroke="#5f6f66" stroke-width="1.5" fill="none"/>
  <rect x="240" y="72" width="120" height="44" rx="6" fill="#f9e3df" stroke="#c53b3b"/>
  <text x="300" y="90" font-size="11.5" text-anchor="middle" fill="#23362e">Redis</text>
  <text x="300" y="107" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">counter = 99</text>
  <path d="M360 84 L430 56" stroke="#c53b3b" stroke-width="1.5" fill="none"/>
  <path d="M360 104 L430 132" stroke="#c53b3b" stroke-width="1.5" fill="none"/>
  <rect x="434" y="34" width="114" height="44" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="491" y="60" font-size="11.5" text-anchor="middle" fill="#23362e">A: allow (100)</text>
  <rect x="434" y="110" width="114" height="44" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="491" y="136" font-size="11.5" text-anchor="middle" fill="#23362e">B: allow (101)</text>
  <text class="hand" x="12" y="182" font-size="15" fill="#c53b3b">the race is as wide as a network round trip &mdash; so it happens constantly</text>
</svg>
