<svg viewBox="0 0 800 320" role="img" aria-label="A producer outpacing a consumer, an unbounded queue growing until memory runs out, then a bounded queue applying backpressure">
  <defs>
    <marker id="bq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="bq-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">producer 1,000 / s &nbsp;&middot;&nbsp; consumer 800 / s &nbsp;&middot;&nbsp; mismatch 200 / s</text>

  <rect id="bq-prod" x="20" y="54" width="150" height="76" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="95" y="80" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">producer</text>
  <text id="bq-prodt" x="95" y="102" font-size="10.5" text-anchor="middle" fill="#5f6f66">sending 1,000 / s</text>
  <text id="bq-prodt2" x="95" y="120" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <line x1="174" y1="92" x2="196" y2="92" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#bq-arr)"/>

  <rect id="bq-q" x="200" y="54" width="382" height="76" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="bq-qt" x="391" y="74" font-size="11" text-anchor="middle" fill="#5f6f66">queue &mdash; unbounded</text>
  <g>
    <rect id="bq-s1" class="hidden" x="212" y="84" width="32" height="36" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="bq-s2" class="hidden" x="248" y="84" width="32" height="36" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="bq-s3" class="hidden" x="284" y="84" width="32" height="36" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="bq-s4" class="hidden" x="320" y="84" width="32" height="36" rx="3" fill="#fbf3c4" stroke="#d9c25a"/>
    <rect id="bq-s5" class="hidden" x="356" y="84" width="32" height="36" rx="3" fill="#fbf3c4" stroke="#d9c25a"/>
    <rect id="bq-s6" class="hidden" x="392" y="84" width="32" height="36" rx="3" fill="#fbf3c4" stroke="#d9c25a"/>
    <rect id="bq-s7" class="hidden" x="428" y="84" width="32" height="36" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="bq-s8" class="hidden" x="464" y="84" width="32" height="36" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="bq-s9" class="hidden" x="500" y="84" width="32" height="36" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
    <rect id="bq-s10" class="hidden" x="536" y="84" width="32" height="36" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
  </g>
  <line x1="586" y1="92" x2="608" y2="92" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#bq-arr)"/>

  <rect id="bq-cons" x="612" y="54" width="168" height="76" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="696" y="80" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">consumer</text>
  <text id="bq-const" x="696" y="102" font-size="10.5" text-anchor="middle" fill="#5f6f66">800 / s, flat out</text>
  <text id="bq-const2" x="696" y="120" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="bq-panel" x="20" y="154" width="760" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="bq-time" x="40" y="178" font-size="11.5" fill="#23362e" font-weight="700">t = 0 s</text>
  <text id="bq-l" x="40" y="202" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">queue depth L = 0</text>
  <text id="bq-w" x="300" y="202" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">wait W = L / 800 = 0 ms</text>
  <text id="bq-mem" x="600" y="202" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">heap: 40 MB</text>
  <text id="bq-note" x="40" y="226" font-size="11" fill="#5f6f66">no errors, no alerts, nothing to see</text>

  <rect id="bq-verd" x="20" y="256" width="760" height="48" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="bq-v" x="400" y="278" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">a queue does not add capacity &mdash; it only decides where the mismatch accumulates</text>
  <text id="bq-v2" x="400" y="296" font-size="10.5" text-anchor="middle" fill="#5f6f66">watch what it costs to find out slowly</text>
</svg>
