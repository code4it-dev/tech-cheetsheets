<svg viewBox="0 0 800 320" role="img" aria-label="A four layer request chain where a slow database causes queues at every layer, then the same chain applying backpressure to the edge">
  <defs>
    <marker id="bc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="bc-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <text id="bc-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">four layers, four queues &mdash; and only one of them can talk to the client</text>

  <rect id="bc-b1" x="20" y="60" width="165" height="72" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="102" y="84" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text id="bc-t1" x="102" y="106" font-size="10.5" text-anchor="middle" fill="#5f6f66">timeout 2 s</text>
  <text id="bc-q1" x="102" y="124" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <line x1="189" y1="96" x2="207" y2="96" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#bc-arr)"/>

  <rect id="bc-b2" x="211" y="60" width="165" height="72" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="293" y="84" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">edge / API</text>
  <text id="bc-t2" x="293" y="106" font-size="10.5" text-anchor="middle" fill="#5f6f66">queue: empty</text>
  <text id="bc-q2" x="293" y="124" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <line x1="380" y1="96" x2="398" y2="96" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#bc-arr)"/>

  <rect id="bc-b3" x="402" y="60" width="165" height="72" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="484" y="84" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">orders service</text>
  <text id="bc-t3" x="484" y="106" font-size="10.5" text-anchor="middle" fill="#5f6f66">pool: 2 / 20 busy</text>
  <text id="bc-q3" x="484" y="124" font-size="10" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <line x1="571" y1="96" x2="589" y2="96" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#bc-arr)"/>

  <rect id="bc-b4" x="593" y="60" width="165" height="72" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="675" y="84" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">database</text>
  <text id="bc-t4" x="675" y="106" font-size="10.5" text-anchor="middle" fill="#5f6f66">20 ms</text>
  <text id="bc-q4" x="675" y="124" font-size="10" text-anchor="middle" fill="#5f6f66">healthy</text>

  <g id="bc-sig" class="hidden">
    <path d="M593 152 L293 152 L293 138" fill="none" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#bc-red)"/>
    <text x="443" y="166" font-size="10.5" text-anchor="middle" fill="#c53b3b" font-weight="600">"full" propagates to the edge</text>
  </g>

  <rect id="bc-panel" x="20" y="186" width="760" height="58" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="bc-lat" x="40" y="210" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">client latency: 60 ms</text>
  <text id="bc-good" x="330" y="210" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">goodput: 1,000 / s</text>
  <text id="bc-rate" x="600" y="210" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">arrivals: 1,000 / s</text>
  <text id="bc-note" x="40" y="232" font-size="11" fill="#5f6f66">everything is fine, which is the only time to design this</text>

  <rect id="bc-verd" x="20" y="258" width="760" height="46" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="bc-v" x="400" y="286" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">a healthy chain &mdash; now slow the database down</text>
</svg>
