<svg viewBox="0 0 560 200" role="img" aria-label="A consumer granting credits to a producer, which may only send as many items as it has been granted">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">the producer may send exactly what it has been granted, and not one more</text>
  <rect id="cr-prod" x="30" y="52" width="150" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="74" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">producer</text>
  <text id="cr-prodt" x="105" y="94" font-size="10.5" text-anchor="middle" fill="#5f6f66">1,000 ready to send</text>
  <rect id="cr-mid" x="205" y="52" width="150" height="56" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text id="cr-credit" x="280" y="76" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">credit = 0</text>
  <text id="cr-sent" x="280" y="96" font-size="10.5" text-anchor="middle" fill="#5f6f66">in flight: 0</text>
  <rect id="cr-cons" x="380" y="52" width="150" height="56" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="455" y="74" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">consumer</text>
  <text id="cr-const" x="455" y="94" font-size="10.5" text-anchor="middle" fill="#5f6f66">room for 4</text>
  <text id="cr-msg" x="280" y="146" font-size="11.5" text-anchor="middle" fill="#5f6f66">the queue can never exceed what was asked for</text>
  <text id="cr-msg2" x="280" y="170" font-size="10.5" text-anchor="middle" fill="#5f6f66">the bound is enforced by the protocol, not by hope</text>
</svg>
