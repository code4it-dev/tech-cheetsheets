<svg viewBox="0 0 800 300" role="img" aria-label="A user placing an order then being redirected to a list served by a read model that has not caught up yet">
  <defs>
    <marker id="lg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <rect id="lg-br" x="20" y="44" width="210" height="160" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="125" y="66" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">browser</text>
  <text id="lg-b1" x="36" y="94" font-size="11.5" fill="#5f6f66">cart: 2 items</text>
  <text id="lg-b2" x="36" y="118" font-size="11.5" fill="#5f6f66">&nbsp;</text>
  <text id="lg-b3" x="36" y="142" font-size="11.5" fill="#5f6f66">&nbsp;</text>
  <text id="lg-b4" x="36" y="166" font-size="11.5" fill="#c53b3b">&nbsp;</text>
  <text id="lg-b5" x="36" y="190" font-size="11.5" fill="#5f6f66">&nbsp;</text>

  <rect id="lg-w" x="268" y="44" width="190" height="66" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="363" y="68" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">write store</text>
  <text id="lg-wt" x="363" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">41 orders</text>

  <rect id="lg-r" x="268" y="158" width="190" height="66" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="363" y="182" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">read store</text>
  <text id="lg-rt" x="363" y="204" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">41 rows · caught up</text>

  <line x1="363" y1="114" x2="363" y2="154" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#lg-arr)"/>
  <text id="lg-lag" x="372" y="140" font-size="10.5" fill="#5f6f66">projector</text>

  <rect id="lg-fix" x="498" y="44" width="282" height="180" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="639" y="66" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">how teams handle the window</text>
  <text id="lg-f1" class="hidden" x="514" y="94" font-size="11" fill="#5f6f66">1 · command returns the data; UI renders it</text>
  <text id="lg-f2" class="hidden" x="514" y="120" font-size="11" fill="#5f6f66">2 · version token; query waits for it</text>
  <text id="lg-f3" class="hidden" x="514" y="146" font-size="11" fill="#5f6f66">3 · own data read from the write store</text>
  <text id="lg-f4" class="hidden" x="514" y="172" font-size="11" fill="#5f6f66">4 · design the UI for "processing"</text>
  <text id="lg-f5" class="hidden" x="514" y="200" font-size="11" fill="#2f6b3f">pick per screen, not per system</text>

  <text id="lg-t" x="400" y="266" font-size="12.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">t = 0 ms</text>
  <text id="lg-hand" class="hand hidden" x="30" y="246" font-size="16" fill="#c53b3b">the lag is not a bug, it is the price &mdash; but it must be a decision</text>
</svg>
