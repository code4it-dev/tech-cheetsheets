<svg viewBox="0 0 800 320" role="img" aria-label="A command travelling through the write model to a normalised store, projected into a denormalised read store that a query then reads">
  <defs>
    <marker id="cq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <g id="cq-cmd">
    <rect x="16" y="96" width="160" height="20" rx="4" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
    <text id="cq-cmdt" x="24" y="110" font-size="10" fill="#23362e" font-family="Fira Code, monospace">PlaceOrder(cart)</text>
  </g>

  <rect id="cq-ch" x="196" y="34" width="156" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="274" y="58" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">command handler</text>
  <text x="274" y="78" font-size="10.5" text-anchor="middle" fill="#5f6f66">aggregate + invariants</text>
  <line x1="356" y1="64" x2="386" y2="64" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cq-arr)"/>

  <rect id="cq-wdb" x="390" y="34" width="190" height="60" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="485" y="56" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">write store &mdash; normalised</text>
  <text id="cq-wdbt" x="485" y="78" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">orders · order_lines · customers</text>

  <g id="cq-evt" class="hidden">
    <rect x="390" y="118" width="190" height="32" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text x="485" y="139" font-size="11" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">OrderPlaced(42, …)</text>
  </g>
  <line id="cq-a1" class="hidden" x1="485" y1="98" x2="485" y2="114" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cq-arr)"/>

  <rect id="cq-proj" x="620" y="110" width="160" height="60" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="700" y="134" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">projector</text>
  <text id="cq-projt" x="700" y="154" font-size="10.5" text-anchor="middle" fill="#5f6f66">idle · offset 41</text>
  <line id="cq-a2" class="hidden" x1="584" y1="134" x2="614" y2="134" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cq-arr)"/>
  <path id="cq-a3" class="hidden" d="M700 174 L700 206 L584 206" fill="none" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cq-arr)"/>

  <rect id="cq-rdb" x="390" y="186" width="190" height="78" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="485" y="208" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">read store &mdash; denormalised</text>
  <text x="485" y="228" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">order_list_view</text>
  <text id="cq-rdbt" x="485" y="248" font-size="10.5" text-anchor="middle" fill="#5f6f66">3 rows</text>

  <rect id="cq-qh" x="196" y="196" width="156" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="274" y="220" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">query handler</text>
  <text x="274" y="240" font-size="10.5" text-anchor="middle" fill="#5f6f66">DTO, no domain model</text>
  <line x1="386" y1="226" x2="358" y2="226" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cq-arr)"/>

  <g id="cq-q" class="hidden">
    <rect x="16" y="210" width="160" height="32" rx="5" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
    <text id="cq-qt" x="24" y="231" font-size="11" fill="#23362e" font-family="Fira Code, monospace">GET /orders</text>
  </g>

  <text id="cq-msg" x="400" y="296" font-size="12" text-anchor="middle" fill="#5f6f66">two paths, one database engine or two &mdash; that part is a later decision</text>
  <text id="cq-hand" class="hand hidden" x="20" y="290" font-size="16" fill="#c53b3b">the read side never calls the domain</text>
</svg>
