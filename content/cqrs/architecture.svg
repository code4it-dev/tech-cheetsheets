<svg viewBox="0 0 800 330" role="img" aria-label="Commands flowing through a write model to a normalised store, events projected into a denormalised read store serving queries">
  <defs>
    <marker id="cr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">one client, two paths that never meet &mdash; and only one of them is allowed to change anything</text>

  <rect x="20" y="118" width="120" height="96" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="80" y="156" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text x="80" y="178" font-size="11" text-anchor="middle" fill="#5f6f66">commands</text>
  <text x="80" y="194" font-size="11" text-anchor="middle" fill="#5f6f66">and queries</text>

  <line x1="144" y1="140" x2="182" y2="104" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cr-arr)"/>
  <line x1="144" y1="192" x2="182" y2="228" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cr-arr)"/>

  <rect x="186" y="46" width="250" height="110" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="311" y="68" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">write side</text>
  <text x="311" y="90" font-size="11.5" text-anchor="middle" fill="#5f6f66">commands &rarr; aggregates</text>
  <text x="311" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66">invariants, transactions</text>
  <text x="311" y="132" font-size="11.5" text-anchor="middle" fill="#5f6f66">normalised, no joins for screens</text>

  <rect x="186" y="186" width="250" height="110" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="311" y="208" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">read side</text>
  <text x="311" y="230" font-size="11.5" text-anchor="middle" fill="#5f6f66">queries &rarr; DTOs</text>
  <text x="311" y="250" font-size="11.5" text-anchor="middle" fill="#5f6f66">no domain model, no ORM graph</text>
  <text x="311" y="272" font-size="11.5" text-anchor="middle" fill="#5f6f66">denormalised, one row per screen</text>

  <line x1="440" y1="101" x2="478" y2="101" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cr-arr)"/>
  <line x1="440" y1="241" x2="478" y2="241" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cr-arr)"/>

  <rect x="482" y="60" width="150" height="82" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="557" y="90" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">write store</text>
  <text x="557" y="112" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">orders, lines,</text>
  <text x="557" y="128" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">customers</text>

  <rect x="482" y="200" width="150" height="82" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="557" y="230" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">read store</text>
  <text x="557" y="252" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">order_list_view</text>
  <text x="557" y="268" font-size="10.5" text-anchor="middle" fill="#5f6f66">pre-joined, indexed</text>

  <rect x="664" y="128" width="116" height="86" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="722" y="158" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">projector</text>
  <text x="722" y="178" font-size="10.5" text-anchor="middle" fill="#5f6f66">events &rarr; rows</text>
  <text x="722" y="194" font-size="10.5" text-anchor="middle" fill="#5f6f66">replayable</text>

  <path d="M636 101 L722 101 L722 124" fill="none" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cr-arr)"/>
  <path d="M722 218 L722 241 L636 241" fill="none" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cr-arr)"/>

  <text class="hand" x="20" y="318" font-size="16" fill="#c53b3b">the gap between the two stores is the eventual consistency window &mdash; name it, measure it, design for it</text>
</svg>
