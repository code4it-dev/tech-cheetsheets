title: Domain-Driven Design
slug: domain-driven-design
tagline: Model the business, not the database — and stop pretending one word means the same thing everywhere.
asof: Nov 2026 · Eric Evans, 2003; examples in C# and Python, framework-agnostic
description: "Domain-Driven Design cheatsheet: bounded contexts and context maps on the strategic side, aggregates, value objects and domain events on the tactical side — animated."
