title: Graceful degradation
slug: graceful-degradation
tagline: Most of your page is optional. An outage should cost the user those parts, not all of them.
asof: Nov 2026 · the product half of resilience engineering; examples in C# and TypeScript
description: "Graceful degradation cheatsheet: critical versus optional dependencies, fallback ladders, feature flags and static stability — how to serve a smaller product instead of an error page."
aliases:
  - Graceful degradation
  - degraded mode
  - fallback
  - static stability
  - feature flags
  - fail soft
  - brownout
keywords:
  - graceful degradation
  - resilience
  - fallback
  - static stability
  - feature flags
  - availability
