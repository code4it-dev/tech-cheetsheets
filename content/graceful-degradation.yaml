  - sli-slo-sla
overview:
  - "A product page calls eight services: catalogue, pricing, stock, reviews, recommendations, personalisation, loyalty points and recently-viewed. Written naively, the page needs all eight, so its availability is the product of theirs — eight dependencies at 99.9% give 99.2%, which is six hours of downtime a year caused entirely by multiplication. Yet only two of those services are needed to sell anything."
  - "**Graceful degradation** is the discipline of deciding, in advance, which parts of a feature are <em>critical</em> and which are <em>optional</em>, and making the optional ones fail invisibly. The reviews service going down should remove a reviews panel, not a revenue stream. Done well, the page's availability stops being the product of eight numbers and becomes the product of two."
  - It is the layer above the mechanics. A **circuit breaker** turns a slow failure into a fast one; **load shedding** decides which requests to refuse; **backpressure** bounds the queues. Graceful degradation decides what the user actually sees when those fire — and that is a product decision, which is why it fails most often not for technical reasons but because nobody ever asked the question.
architecture:
  svg: graceful-degradation/architecture.svg
  alt: A page's dependencies split into critical and optional, with a fallback ladder and the availability arithmetic for each design
  caption: No extra hardware, no new replicas. The improvement comes entirely from deciding which failures are allowed to be the page's failure.
howItWorks:
  - md: "The first animation is the arithmetic: what treating every dependency as critical costs you. The second renders one page through a real outage, rung by rung."
  - note: "\"is this dependency critical?\" is a product question — ask it in daylight, not at 3 a.m."
  - anim:
      id: anim-math
      title: 1 · Eight dependencies, two designs
      svg: graceful-degradation/anim-math.svg
      alt: Eight dependencies multiplied into a page availability, then reclassified so only two are critical
      steps:
        - say: A product page makes eight service calls. Each service is independently 99.9% available — genuinely good numbers that any team would be pleased with.
          hl: [ gm-row ]
        - say: Written the obvious way, every call is awaited and any failure propagates. So the page needs all eight to be up at the same moment.
          unhl: [ gm-row ]
          text:
            gm-sub: every call awaited, every failure propagates — all eight must be up
        - say: "Which means the availabilities multiply. Two dependencies already costs you a nine: 0.999² is 99.80%."
          text:
            gm-eq: 0.999² = 99.80%
            gm-p1: "two dependencies: 17.5 hours a year"
        - say: Four gives 99.60%. The decline is not gentle — each mandatory dependency you add is a straight subtraction from your own reliability.
          text:
            gm-eq: 0.999⁴ = 99.60%
            gm-p1: "four dependencies: 35 hours a year"
        - say: "All eight: 99.20%. That is roughly seventy hours a year of downtime, and <em>none</em> of it is caused by anything being badly built. It is caused by multiplication."
          show: [ gm-fill ]
          text:
            gm-eq: 0.999⁸ = 99.20%
            gm-bart: 99.20% — about 70 hours a year
            gm-p1: "eight dependencies: 70 hours a year"
            gm-p2: every service met its own 99.9% target; the page still missed by a mile
            gm-p3: this is self-inflicted, and it is the default
          fill:
            gm-fill: "#f9e3df"
            gm-eq: "#c53b3b"
            gm-bart: "#c53b3b"
        - say: "Now ask the only question that matters: which of these does a customer need in order to buy the camera?"
          text:
            gm-phase: which of these are actually required to complete a purchase?
            gm-p1: " "
            gm-p2: " "
            gm-p3: " "
        - say: Two. You cannot sell an unnamed item at an unknown price, so catalogue and pricing are critical.
          hl: [ gm-d1, gm-d2 ]
          text:
            gm-p1: "critical: catalogue, pricing"
          fill:
            gm-d1: "#e3eedc"
            gm-d2: "#e3eedc"
        - say: The other six are decoration. Missing reviews, recommendations, personalisation, loyalty points, recently-viewed or an exact stock count does not prevent a single sale.
          unhl: [ gm-d1, gm-d2 ]
          text:
            gm-s3: optional
            gm-s4: optional
            gm-s5: optional
            gm-s6: optional
            gm-s7: optional
            gm-s8: optional
            gm-p2: "optional: stock, reviews, recs, personalisation, loyalty, recently-viewed"
          fill:
            gm-d3: "#fbf3c4"
            gm-d4: "#fbf3c4"
            gm-d5: "#fbf3c4"
            gm-d6: "#fbf3c4"
            gm-d7: "#fbf3c4"
            gm-d8: "#fbf3c4"
        - say: Give each of those six its own timeout, its own breaker and a result that may be empty, and their failures stop being the page's failure. They drop out of the multiplication entirely.
          text:
            gm-eq: 0.999² = 99.80%
            gm-bart: 99.80% — about 17.5 hours a year
            gm-p3: six dependencies removed from the product — not from the page
          fill:
            gm-fill: "#e3eedc"
            gm-eq: "#2f6b3f"
            gm-bart: "#2f6b3f"
        - say: Four times better, from the same eight services on the same hardware. No replicas, no regions, no rewrite — just deciding which failures are allowed to be yours. It is the cheapest availability work most teams can do.
          text:
            gm-phase: same services · same infrastructure · four times the availability
            gm-p1: "before: 0.999⁸ = 99.20% — 70 h/year"
            gm-p2: "after:  0.999² = 99.80% — 17.5 h/year"
            gm-p3: the entire change was a classification and some error handling
  - anim:
      id: anim-ladder
      title: 2 · One page, descending the ladder
      svg: graceful-degradation/anim-ladder.svg
      alt: A product page rendering with progressively more fallbacks as dependencies fail
      steps:
        - say: "The healthy page: product details, a live price, a precise stock figure, reviews, recommendations, and a working basket button. Everything green."
          hl: [ gl-page ]
        - say: "Recommendations fail first. The breaker opens, the call returns nothing in a millisecond, and the panel simply is not rendered. Rung five of the ladder: omit it."
          hide: [ gl-l5 ]
          unhl: [ gl-page ]
          text:
            gl-d5: recommendations — DOWN · breaker open
            gl-d6: "degraded: 1 panel missing"
            gl-o1: reduced — recommendations omitted
            gl-phase: "recommendations fail · fallback: omit the panel"
          fill:
            gl-d5: "#c53b3b"
            gl-d6: "#5f6f66"
            gl-o1: "#23362e"
            gl-out: "#fbf3c4"
        - say: Most customers will not notice a missing carousel, so nothing is said. Silent degradation is right when the absence cannot lead to a bad decision.
          text:
            gl-o2: silent — nobody acts differently without a carousel
        - say: "Reviews go next. Same treatment, same outcome: the panel disappears and the page is shorter."
          hide: [ gl-l4 ]
          text:
            gl-d4: reviews — DOWN
            gl-d6: "degraded: 2 panels missing"
            gl-phase: "reviews fail · fallback: omit the panel"
          fill:
            gl-d4: "#c53b3b"
        - say: "Now stock. This one has a better rung available than \"omit\": serve the cached count. But a cached stock figure <em>can</em> make someone act wrongly, so it gets labelled."
          text:
            gl-t3: In stock — availability may be out of date
            gl-d3: stock — DOWN · serving cache
            gl-d6: "degraded: 2 omitted, 1 stale"
            gl-o2: labelled — the customer could act on this one
            gl-phase: "stock fails · fallback: stale cache, clearly labelled"
          fill:
            gl-l3: "#fbf3c4"
            gl-d3: "#c53b3b"
        - say: Then pricing. This is critical — but critical does not mean "no fallback". A price from forty minutes ago is far better than no page at all, so we serve it with a timestamp.
          text:
            gl-t2: £1,999 · price as of 14:02
            gl-d2: pricing — DOWN · cache, 40 min old
            gl-o2: a stale price beats no page — up to a stated limit
            gl-phase: "pricing fails · fallback: stale cache within one hour"
          fill:
            gl-l2: "#fbf3c4"
            gl-d2: "#c53b3b"
        - say: Critically, the basket still works. Four dependencies are down and the customer can still buy the camera — which is the only test that actually matters.
          show: [ gl-hand ]
          text:
            gl-o1: minimal — critical path only
            gl-o3: yes
            gl-d6: four dependencies down
        - say: Now push past the limit. The cached price ages beyond one hour, and stale stops being acceptable. Here we hard-fail rather than show a price that might be wrong — the buy button goes.
          hide: [ gl-l6 ]
          text:
            gl-t2: price unavailable
            gl-d2: pricing — DOWN · cache older than 1 h
            gl-o1: cannot complete a purchase
            gl-o3: no — and we say so honestly
            gl-phase: past the staleness limit · hard fail rather than guess
          fill:
            gl-l2: "#f9e3df"
            gl-o3: "#c53b3b"
            gl-out: "#f9e3df"
            gl-o1: "#c53b3b"
        - say: That boundary is the whole discipline. Inventing a price would be worse than showing none, so the ladder stops. Correctness-critical paths fail closed; convenience paths fail open.
          text:
            gl-o2: never fall back to an answer that could be wrong in a way that costs money
        - say: "And the catalogue recovers, so everything climbs back up. Note what this page never did: return a 500 because its recommendation engine was unwell."
          show: [ gl-l3, gl-l4, gl-l5, gl-l6 ]
          text:
            gl-t2: £1,999 · live price
            gl-t3: In stock — 4 left at your store
            gl-d2: pricing — healthy · critical
            gl-d3: stock — healthy · optional
            gl-d4: reviews — healthy · optional
            gl-d5: recommendations — healthy · optional
            gl-d6: all eight green
            gl-o1: full experience
            gl-o2: six degradation steps, one honest stop
            gl-o3: yes
            gl-phase: the same page survived four outages without ever returning an error
          fill:
            gl-l2: "#e3eedc"
            gl-l3: "#e3eedc"
            gl-d2: "#5f6f66"
            gl-d3: "#5f6f66"
            gl-d4: "#5f6f66"
            gl-d5: "#5f6f66"
            gl-d6: "#2f6b3f"
            gl-o1: "#2f6b3f"
            gl-o3: "#2f6b3f"
            gl-out: "#e3eedc"
concepts:
  - term: Graceful degradation
    short: Designing a feature so that losing part of it costs the user that part, rather than the whole thing.
    see: [ Critical dependency, Optional dependency, Fallback ladder ]
    detail: |-
      The opposite is not "ungraceful degradation" but <em>binary availability</em>: the page works perfectly or it returns a 500. Almost every system is built that way by accident, because `await` makes every dependency look equally mandatory.

      It is a product discipline supported by technical mechanisms. The breaker, the timeout and the shedder produce a signal; graceful degradation is the decision about what that signal means for the person looking at the screen.

      #### Where it sits

      | Layer | Job |
      | --- | --- |
      | Timeout | bound one call |
      | Circuit breaker | fail fast and deterministically |
      | Load shedding | choose which requests to refuse |
      | Graceful degradation | decide what the user still gets |

      #### How it relates

      - It is the only one of the four that a non-engineer has an opinion about — which is why it needs one.
  - term: Critical dependency
    short: One whose failure genuinely means the feature cannot work — and the list is almost always shorter than the code implies.
    see: [ Optional dependency, Availability multiplication, Hard fail ]
    detail: |-
      The test is blunt: if this returns nothing, can the user still accomplish the thing they came for? For a product page, catalogue and price are critical — you cannot sell an unnamed item at an unknown price. Everything else is decoration, however nice.

      Critical dependencies get the real engineering: replication, caching, fallbacks of their own, and an honest error page when all of it fails. Pretending something is critical when it is not simply buys you its downtime.

      #### The test

      | Question | If no… |
      | --- | --- |
      | Can the user complete the task without it? | critical |
      | Would a plausible default be wrong or unsafe? | critical |
      | Would the user notice within a week? | probably optional |

      #### How it relates

      - Each critical dependency multiplies into your achievable SLO; see composite availability on the SLI/SLO page.
  - term: Optional dependency
    short: One whose failure should change the page and not break it — the large majority, once you look.
    see: [ Critical dependency, Fail soft, Fallback ladder ]
    detail: |-
      Reviews, recommendations, personalisation, loyalty balances, recently-viewed, social proof, A/B assignment, analytics beacons. Each one is a service that can go down, and each one is a panel that can be absent without anyone being unable to buy anything.

      The engineering requirement is that the call must be unable to break the render: its own timeout, its own breaker, and a result type that permits absence. A null check is not a design.

      #### Typical treatment

      | Dependency | On failure |
      | --- | --- |
      | Reviews | omit the panel entirely |
      | Recommendations | static bestsellers |
      | Stock level | cached figure, or hide the count |
      | Loyalty points | hide the row |
      | Analytics | fire and forget, never await |

      #### How it relates

      - An optional dependency that can break the page is the single most common degradation bug.
  - term: Availability multiplication
    short: "The arithmetic that makes this worth doing: mandatory dependencies in series multiply, and the result falls fast."
    see: [ Critical dependency, Optional dependency ]
    detail: |-
      Eight dependencies at 99.9% give 0.999⁸ = 99.20%, which is about seventy hours a year. Reclassify six of them as optional and the page inherits only 0.999² = 99.80% — four times better, with no change to any service's own reliability.

      This is the cheapest availability improvement available to most teams: it costs a day of classification and some error handling, rather than replicas, regions or rewrites.

      #### Mandatory dependencies in series

      | Count at 99.9% | Combined | Per year |
      | --- | --- | --- |
      | 1 | 99.90% | 8.8 h |
      | 2 | 99.80% | 17.5 h |
      | 4 | 99.60% | 35 h |
      | 8 | 99.20% | 70 h |

      #### How it relates

      - The first animation is this table, built one dependency at a time.
  - term: Fallback ladder
    short: An ordered list of progressively worse but still useful answers, tried in turn before giving up.
    see: [ Stale-while-error, Static default, Fail soft ]
    detail: |-
      Live answer, then fresh cache, then stale cache, then a static default, then omit the element. Most teams implement rung one and rung five and nothing in between, which throws away the most valuable options — a ten-minute-old price is enormously better than no price.

      Write the ladder down per dependency, including how stale is too stale. "Serve a cached price up to one hour old, then hide the buy button" is a decision; "catch and log" is not.

      #### The rungs

      | # | Rung | Cost |
      | --- | --- | --- |
      | 1 | Live call | normal |
      | 2 | Fresh cache | none |
      | 3 | Stale cache | accuracy |
      | 4 | Static default | relevance |
      | 5 | Omit | the feature |

      #### How it relates

      - The second animation descends this ladder one rung at a time on a real page.
  - term: Stale-while-error
    short: Serving the last known good value when the source is unavailable — usually the highest-value rung on the ladder.
    see: [ Fallback ladder, Static stability, Caching ]
    detail: |-
      An ordinary cache expires data and then goes to the origin. A degradation-aware cache keeps the expired entry and serves it when the origin fails — the HTTP `stale-if-error` directive formalises exactly this. The user sees a slightly old answer instead of an error, which is almost always the better trade.

      Two rules: label staleness where it matters ("as of 14:02"), and set a maximum age beyond which stale becomes dangerous — an hour-old price is fine, an hour-old fraud decision is not.

      #### Tolerance by data type

      | Data | Acceptable staleness |
      | --- | --- |
      | Product description | days |
      | Price | minutes to an hour |
      | Stock count | minutes, shown as approximate |
      | Account balance | seconds, clearly labelled |
      | Auth / permissions | none — never serve stale |

      #### How it relates

      - This is why a cache is a resilience component, not only a performance one.
  - term: Static stability
    short: Designing so that a failure causes the system to keep doing what it was already doing, rather than needing something to work.
    see: [ Stale-while-error, Fail soft, Fallback ladder ]
    anim:
      key: ss
      title: Two services, one control-plane outage
      svg: graceful-degradation/ss.svg
      alt: A control plane failing, breaking a service that fetches config per request while a service using cached config keeps working
      steps:
        - say: Two services, both reading configuration from the same control plane. On a good day they look identical, which is exactly why this difference goes unnoticed until an incident.
          hl: [ ss-cp ]
        - say: The control plane fails. It is not on anybody's critical path, so nobody expects this to matter.
          unhl: [ ss-cp ]
          text:
            ss-cpt: DOWN
            ss-msg: a component neither service "depends on" for serving traffic
          fill:
            ss-cp: "#f9e3df"
            ss-cpt: "#c53b3b"
        - say: Service A fetches its config on every request, so every request now fails. It needed something to work in order to keep working — that is the unstable design.
          hl: [ ss-a ]
          text:
            ss-at: every request fails
            ss-msg: A needed the control plane to be up in order to do nothing new
          fill:
            ss-a: "#f9e3df"
            ss-at: "#c53b3b"
        - say: Service B carries on with the config it already had. Nothing changed, so nothing broke. It cannot pick up <em>new</em> configuration, but it keeps serving traffic exactly as before.
          hl: [ ss-b ]
          unhl: [ ss-a ]
          text:
            ss-bt: serving normally — on cached config
            ss-msg: B cannot learn anything new, and does not need to
          fill:
            ss-b: "#e3eedc"
            ss-bt: "#2f6b3f"
        - say: "That is static stability: arrange things so a failure freezes the system rather than emptying it. Pre-provision capacity, cache the config, keep the last known good host list — and an outage costs you change, not service."
          unhl: [ ss-b ]
          text:
            ss-msg: pre-provision · cache the config · keep the last known good state
    detail: |-
      Amazon's term for a powerful idea: the failure mode should be "no change" rather than "no service". A load balancer that keeps its last known healthy host list when the control plane is down is statically stable; one that needs the control plane to route is not.

      Applied to features: pre-compute and cache what the page needs so that an outage freezes the content instead of emptying it. The site keeps working on yesterday's data, which beats working on nothing.

      #### Stable or not

      | Design | On control-plane failure |
      | --- | --- |
      | Cached config, used as-is | keeps working — stable |
      | Config fetched per request | stops — unstable |
      | Pre-provisioned capacity | keeps serving |
      | Scale-up required to serve | fails during the incident |

      ::anim ss::

      #### How it relates

      - The strongest version of degradation: nothing degrades, because nothing had to change.
  - term: Fail soft
    short: "The implementation rule for optional dependencies: their failure must be unable to reach the response."
    see: [ Optional dependency, Timeout, Fallback ladder ]
    detail: |-
      In practice this means every optional call is wrapped: its own short timeout, its own breaker, its own try/catch, and a return type that can be empty. The template must then handle absence — a panel that throws on a null list has merely moved the failure.

      The subtle version is latency: an optional call with no timeout will not fail your page, it will just make it take eight seconds, which users experience as failure anyway.

      #### Checklist per optional call

      | Control | Typical |
      | --- | --- |
      | Timeout | well below the page budget — 100–300 ms |
      | Breaker | aggressive; it is optional |
      | Result type | nullable or empty collection |
      | Template | renders correctly with nothing |
      | Never | retry on the user's critical path |

      #### How it relates

      - A circuit breaker supplies the fast failure; fail-soft handling is what turns it into a working page.
  - term: Degradation levels
    short: Named, testable modes — full, reduced, minimal, read-only — rather than an unbounded space of partial failures.
    see: [ Feature flags, Fail soft, Load shedding ]
    detail: |-
      With eight optional dependencies there are 256 combinations, and you cannot test 256 things. Defining three or four named levels collapses that: <em>full</em>, <em>reduced</em> (optional panels off), <em>minimal</em> (critical path only), <em>read-only</em> (writes disabled). Each is a state you can enter deliberately, screenshot, and test.

      Read-only deserves special mention: for many systems, disabling writes while keeping reads is the difference between a degraded hour and a total outage.

      #### A workable ladder

      | Level | What is off | Trigger |
      | --- | --- | --- |
      | Full | nothing | normal |
      | Reduced | recs, personalisation | load or a breaker |
      | Minimal | all optional panels | heavy overload |
      | Read-only | writes | database failover |

      #### How it relates

      - Levels make degradation a thing you can rehearse, which is what makes it work when it matters.
  - term: Feature flags
    short: "The manual control: turning expensive features off deliberately during an incident, rather than waiting for them to fail."
    see: [ Degradation levels, Load shedding, Kill switch ]
    detail: |-
      Automatic degradation handles dependencies that fail. Flags handle the ones that are merely expensive: an operator can switch off the heavy search ranker, the personalisation model or the live stock lookup and reclaim capacity immediately.

      For this to be useful the flag must take effect in seconds without a deploy, must be visible in the incident channel, and must be rehearsed — a kill switch nobody has ever pulled is a kill switch that will not work.

      #### Requirements

      | Requirement | Why |
      | --- | --- |
      | Takes effect in seconds | deploys are too slow mid-incident |
      | Works when its own backend is down | cached default, statically stable |
      | Audited and announced | others must know what changed |
      | Exercised regularly | untested switches fail |

      #### How it relates

      - Flags plus named levels give you a degradation runbook rather than improvisation.
  - term: Hard fail
    short: The decision to show an honest error rather than a plausible-looking wrong answer.
    see: [ Critical dependency, Fallback ladder, Honest signalling ]
    detail: |-
      Degradation has a limit. If the fraud check is unavailable, approving the payment is not degradation — it is a security incident with better manners. If the price service is down, inventing a price is worse than showing nothing.

      The rule: never fall back to an answer that could be <em>wrong in a way that costs money or safety</em>. Correctness-critical paths fail closed; convenience paths fail open.

      #### Fail open or closed?

      | Dependency | On failure |
      | --- | --- |
      | Recommendations | fail open — omit |
      | Reviews | fail open — omit |
      | Price | stale, or hard fail — never guess |
      | Fraud / authorisation | fail closed — always |
      | Rate limiter | judgement — usually fail open |

      #### How it relates

      - "Fail open or closed?" should be answered per dependency and written next to its classification.
  - term: Honest signalling
    short: Telling the user what is missing, in their terms, instead of silently showing less.
    see: [ Hard fail, Fail soft, Degradation levels ]
    detail: |-
      Silent degradation is right for things the user never knew existed — a missing recommendation carousel needs no apology. It is wrong for things they are relying on: a stock figure that is quietly an hour old, or a balance that is quietly stale, erodes trust far more than a small label would.

      The useful distinction is whether the absence could lead to a bad decision. If it could, say so: "Stock levels may be out of date" costs one line and prevents a complaint.

      #### Say something or not?

      | Situation | Signal |
      | --- | --- |
      | Recommendations missing | silent |
      | Reviews missing | silent, or a quiet note |
      | Stock figure stale | label it |
      | Balance stale | label with a timestamp |
      | Cannot take the order | explicit, with what to do next |

      #### How it relates

      - Error copy is part of the design; writing it during an incident produces the worst version.
  - term: Progressive enhancement
    short: "The front-end sibling: build the working baseline first, then layer improvements that may not arrive."
    see: [ Graceful degradation, Fail soft, Optional dependency ]
    detail: |-
      Strictly these are opposites in direction — progressive enhancement starts from the floor and adds, degradation starts from the ceiling and removes — but they produce the same system. A form that posts without JavaScript and is enhanced with client-side validation keeps working when the bundle fails to load.

      The practical value today is less about ancient browsers and more about failure: a third-party script timing out, a CDN region down, a flaky mobile connection.

      #### Baseline first

      | Enhancement | Baseline that must work |
      | --- | --- |
      | Client-side validation | server-side validation |
      | Async "add to basket" | a real form post |
      | Infinite scroll | paginated links |
      | Web font | a readable fallback stack |

      #### How it relates

      - Third-party scripts are optional dependencies; load them async and never block render on them.
  - term: Testing degradation
    short: Degraded paths only work if they are exercised — and they are the least exercised code you own.
    see: [ Degradation levels, Fail soft, Game day ]
    detail: |-
      The fallback written eighteen months ago and never executed will fail: the cached shape has drifted, the template throws on an empty list, the static default references a deleted product. The only defence is to run it regularly — in tests, in staging, and in production.

      Make each named level a test fixture and assert that the critical path still works. Then do it in production, deliberately, on a Tuesday afternoon.

      #### Ways to exercise it

      | Method | Catches |
      | --- | --- |
      | Unit tests per fallback | shape and null handling |
      | Integration test per level | template and layout breaks |
      | Fault injection in staging | timeout and breaker config |
      | Game day in production | everything the others miss |

      #### How it relates

      - An untested fallback is a second bug waiting for the worst possible moment.
  - term: Game day
    short: Deliberately breaking a dependency in production, with everyone watching, to find out what actually happens.
    see: [ Testing degradation, Degradation levels, Chaos engineering ]
    detail: |-
      Turn off the reviews service at 14:00 on a Tuesday and observe. Teams reliably discover that an "optional" dependency was awaited on the critical path, that a timeout was never configured, or that the empty-state template was never written.

      Start small and announced: one optional dependency, in one region, with a rollback ready. The goal is information, not heroism.

      #### Running one

      | Step | Note |
      | --- | --- |
      | Pick one optional dependency | never a critical one first |
      | State the hypothesis | "the page renders without reviews" |
      | Announce it | so alerts are not mistaken for an incident |
      | Break it, watch the SLI | short window, rollback ready |
      | Write down what surprised you | that is the whole output |

      #### How it relates

      - Spend error budget on this deliberately — it is exactly what the budget is for.
  - term: Measuring degradation
    short: Tracking which mode you are in, so "degraded" is a state you can see rather than infer.
    see: [ Degradation levels, SLI, Honest signalling ]
    detail: |-
      Count renders per level, fallback usage per dependency, and — most importantly — whether the critical journey still succeeds. A page that renders in reduced mode is a success for availability and a partial failure for experience, and your SLI should say which you are measuring.

      A good practice is two SLIs: "the user could complete the task" and "the user got the full experience". The first protects the business; the second stops permanent silent degradation.

      #### What to export

      | Metric | Tells you |
      | --- | --- |
      | `render_level{level="reduced"}` | how often you degrade |
      | `fallback_used{dep=...}` | which rung, per dependency |
      | Critical-journey SLI | did the business still work |
      | Full-experience SLI | silent long-term degradation |

      #### How it relates

      - Without the second SLI, a feature can be quietly broken for months and look perfectly healthy.
commands:
  heading: Essential code patterns
  tocLabel: Code patterns
  groups:
    - group: Separate the critical from the optional
      items:
        - lang: csharp
          code: |-
            // critical: if these fail, there is no page — so let them throw
            var product = await _catalogue.GetAsync(id, ct);
            var price   = await _pricing.GetAsync(id, ct);

            // optional: each one isolated, and unable to break the render
            var reviews = await Optional(() => _reviews.GetAsync(id, ct));
            var recs    = await Optional(() => _recs.GetAsync(id, ct),  fallback: Bestsellers);
            var stock   = await Optional(() => _stock.GetAsync(id, ct), fallback: CachedStock);

            return View(new ProductPage(product, price, reviews, recs, stock));
          what: The classification is visible in the code. A reviewer can see at a glance which failures are allowed to reach the user.
        - lang: csharp
          code: |-
            static async Task<T?> Optional<T>(Func<Task<T>> call, Func<T>? fallback = null)
            {
                try
                {
                    using var cts = new CancellationTokenSource(TimeSpan.FromMilliseconds(200));
                    return await call();                        // its own tight budget
                }
                catch (Exception ex)                            // timeout, breaker-open, anything
                {
                    Metrics.FallbackUsed.WithLabels(typeof(T).Name).Inc();
                    Log.Information(ex, "optional dependency degraded");   // information, not error
                    return fallback is null ? default : fallback();
                }
            }
          what: "A 200 ms budget matters as much as the catch: an optional call with no timeout does not break the page, it just makes it slow — which users experience as broken anyway."
        - lang: python
          code: |-
            async def optional(coro, *, fallback=None, timeout=0.2):
                """An optional dependency: may be absent, may never break the render."""
                try:
                    return await asyncio.wait_for(coro, timeout)   # its own tight budget
                except Exception as exc:                            # timeout, breaker open, anything
                    metrics.fallback_used.labels(type(exc).__name__).inc()
                    log.info("optional dependency degraded", exc_info=exc)
                    return fallback

            # critical: let these propagate — without them there is no page
            product, price = await asyncio.gather(catalogue.get(sku), pricing.get(sku))

            # optional: each isolated, none able to break the render
            reviews = await optional(reviews_api.get(sku))
            recs    = await optional(recs_api.get(sku), fallback=BESTSELLERS)
          what: "The timeout matters as much as the `except`: an optional call with no budget does not break the page, it just makes it slow."
    - group: The fallback ladder
      items:
        - lang: csharp
          code: |-
            async Task<Price?> GetPrice(string sku, CancellationToken ct)
            {
                if (await _cache.TryGetFresh(sku) is { } fresh) return fresh;   // 2 · fresh cache

                try { return await _pricing.GetAsync(sku, ct); }                // 1 · live
                catch (Exception)
                {
                    if (await _cache.TryGetStale(sku, maxAge: TimeSpan.FromHours(1)) is { } stale)
                        return stale with { IsStale = true };                   // 3 · stale cache
                    return null;                                                // 5 · hide the price
                }
            }
            // note: no rung 4 here. Inventing a price would be worse than showing none.
          what: Most code implements rung 1 and rung 5 only, and throws away the most valuable options in between.
        - code: |-
            # HTTP does rungs 2 and 3 for you
            Cache-Control: max-age=60, stale-while-revalidate=600, stale-if-error=3600

            # stale-if-error: if the origin fails, keep serving the cached copy
            # for up to an hour rather than returning an error page
          what: One header turns a CDN into a degradation layer. `stale-if-error` is the highest-value rung for read-heavy sites.
    - group: Named levels, not 256 combinations
      items:
        - lang: csharp
          code: |-
            public enum RenderLevel { Full, Reduced, Minimal, ReadOnly }

            RenderLevel Current() =>
                _db.IsFailingOver          ? RenderLevel.ReadOnly :
                _load.InFlight > 0.90 * _limit ? RenderLevel.Minimal  :
                _flags.IsOff("recs") || _recsBreaker.IsOpen ? RenderLevel.Reduced :
                RenderLevel.Full;

            Metrics.RenderLevel.WithLabels(level.ToString()).Inc();   // see it, don't infer it
          what: Four named states you can screenshot, test and rehearse — instead of an unbounded space of partial failures nobody has ever seen.
    - group: Never block the render on the front end
      items:
        - lang: csharp
          code: |-
            // critical data is server-rendered; optional panels arrive later, or never
            const reviews = useQuery({
              queryKey: ['reviews', sku],
              queryFn:  () => fetchReviews(sku, { signal: AbortSignal.timeout(2000) }),
              retry: false,                 // never retry on a user's critical path
            });

            if (reviews.isError) return null;      // the panel disappears; the page does not
          what: Returning null is the design. A panel that throws on an empty list has moved the failure rather than handled it.
        - lang: markup
          code: |-
            <!-- third-party scripts are optional dependencies too -->
            <script src="https://cdn.example/widget.js" async defer
                    onerror="window.__widgetUnavailable = true"></script>
            <!-- never render-blocking, never awaited, never on the critical path -->
          what: A synchronous third-party tag makes an external vendor a critical dependency of your checkout, usually without anyone deciding that.
    - group: Prove it works
      items:
        - lang: csharp
          code: |-
            [Theory]
            [InlineData("reviews")] [InlineData("recs")]
            [InlineData("stock")]   [InlineData("loyalty")]
            public async Task Page_still_sells_when_optional_dependency_is_down(string dep)
            {
                _harness.Break(dep);                       // fault injection

                var page = await _client.GetAsync("/p/nikon-z6-iii");

                page.StatusCode.Should().Be(HttpStatusCode.OK);
                page.Should().Contain("Add to basket");    // the critical path survives
                page.Should().Contain("£1,999");
            }
          what: One test per optional dependency. This is the cheapest insurance in the whole pattern, and the thing almost nobody writes.
        - lang: bash
          code: |-
            # and then do it for real, announced, on a Tuesday afternoon
            kubectl scale deploy/reviews --replicas=0
            # watch: render_level, fallback_used, and the critical-journey SLI
            kubectl scale deploy/reviews --replicas=6
          what: A fallback that has never actually executed in production is a hypothesis, not a safety net.
    - group: What to measure
      items:
        - code: |-
            render_level_total{level="full|reduced|minimal|readonly"}
            fallback_used_total{dep="reviews",rung="omit"}
            sli_journey_success{journey="purchase"}      # could the user still buy?
            sli_experience_full{journey="purchase"}      # did they get everything?

            # alert: render_level{level!="full"} sustained for > 1 h
            # (otherwise a feature stays quietly degraded for months)
          what: Two SLIs, deliberately. The first protects the business; the second stops permanent silent degradation nobody notices.
prosCons:
  good:
    heading: Pros
    items:
      - "Breaks the availability multiplication: your page stops inheriting every dependency's downtime."
      - Far cheaper than the alternative — classification and error handling instead of replicas and regions.
      - Turns most incidents into partial, survivable events rather than outages.
      - Protects revenue specifically, because the critical path is identified and defended.
      - Gives operators deliberate levers (flags, levels) during an incident.
      - Forces a useful conversation about what the product actually needs.
  bad:
    heading: Cons
    items:
      - Degraded paths are rarely executed, so they rot silently unless tested.
      - More code paths and more states to reason about and screenshot.
      - Requires product decisions that engineering cannot make alone.
      - Silent degradation can hide a broken feature for months.
      - Stale data is wrong data — acceptable for a price, dangerous for a balance.
      - "Tempting to over-apply: some things genuinely must fail loudly."
when:
  note: list your dependencies, mark each critical or optional — that one-hour exercise is most of the value
  good:
    heading: Use it when…
    items:
      - A feature calls more than two services, so availability multiplication is working against you.
      - Some of what you show is genuinely optional — which is nearly always true of a page.
      - Partial service is meaningfully better than no service for the business.
      - You have expensive features that could be switched off to reclaim capacity.
      - Your SLO is higher than the product of your dependencies' SLOs.
  bad:
    heading: Avoid it when…
    items:
      - A wrong answer is worse than no answer. Use **a hard fail** — fraud, authorisation, payments.
      - Everything in the response is genuinely required. Use **redundancy** and accept the multiplication.
      - The problem is your own overload, not a dependency. Use **load shedding** — though degrading first is usually kinder.
      - You cannot test the degraded paths. Use **fewer fallbacks**, well exercised, rather than many that rot.
      - It would hide a chronic failure. Use **alerting on degraded mode** so silent degradation cannot become permanent.
useCases:
  - title: Reviews down, sales unaffected
    body: The reviews service fails for forty minutes. Previously this returned a 500 on every product page. With the panel marked optional and wrapped in a 200 ms timeout, pages render without a reviews section and conversion is statistically unchanged. Nobody is paged.
  - title: Pricing degraded, not dead
    body: The pricing service becomes slow. The page serves prices from cache up to an hour old with a small "prices updated 14:02" note. Customers keep buying at prices that are correct to within an hour, instead of seeing an error page.
  - title: "Database failover: read-only mode"
    body: "A primary fails over, taking writes out for three minutes. The site enters read-only: browsing, search and account viewing all work; the basket shows \"we can't take orders for a few minutes\". Three minutes of partial service instead of three minutes of nothing."
  - title: Capacity reclaimed by switching features off
    body: During a traffic spike, operators flip flags to disable the heavy search ranker and personalisation. Effective capacity rises roughly 40% within seconds, and the site serves everyone with slightly less relevant results — a far better outcome than shedding a third of users.
  - title: A third-party tag taking down checkout
    body: An analytics vendor's CDN stalls and the synchronous script tag blocks rendering on every page. Moving it to async with an error handler converts a vendor outage from a site outage into a gap in the analytics data.
gotchas:
  items:
    - mistake: Optional dependencies that can break the page
      why: Marked optional in the design document and awaited without a timeout in the code, so its failure still returns a 500. This is the single most common degradation bug.
      fix: wrap every optional call — its own timeout, its own breaker, a nullable result — and add one test per dependency asserting the critical path still works.
    - mistake: No timeout on an optional call
      why: It does not fail your page; it makes it take eight seconds. Users cannot tell the difference between slow and broken, so you got the worst of both.
      fix: give optional calls a tight budget — 100–300 ms — and treat exceeding it as absence. Slow is a failure mode too.
    - mistake: Fallbacks that were never executed
      why: The static default references a product deleted a year ago, the cached shape has drifted, and the empty-state template throws. Discovered at the worst possible moment.
      fix: unit-test each fallback, integration-test each named level, inject faults in staging, and run an announced game day in production.
    - mistake: Degrading something correctness-critical
      why: The fraud check times out, so the code "degrades" by approving the payment. That is not resilience; it is a security incident with good manners.
      fix: decide fail-open or fail-closed per dependency and write it next to the classification. Correctness paths fail closed, always.
    - mistake: Silent permanent degradation
      why: A panel breaks, the fallback hides it, nobody notices for four months — and the dashboards show 100% availability the whole time.
      fix: alert when degraded mode persists beyond an hour, and keep a second SLI for "got the full experience" alongside "completed the task".
    - mistake: Stale data with no label and no limit
      why: An hour-old price is fine. An hour-old account balance shown as current is a support ticket, and an hour-old permission check is a breach.
      fix: set a maximum staleness per data type, label it where a user might act on it, and never serve stale authorisation data at all.
    - mistake: Too many modes to test
      why: Eight optional dependencies give 256 combinations. Nobody tests 256 things, so in practice none of them are tested.
      fix: collapse to three or four named levels, make each a test fixture, and assert the critical journey in every one.
    - mistake: Third-party scripts as hidden critical dependencies
      why: A synchronous vendor tag makes an external CDN a blocking dependency of your checkout, and nobody ever decided that it should be.
      fix: load third-party scripts async with an error handler, never block render on them, and audit the tags on your critical pages.
alternatives:
  columns:
    - Approach
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs graceful degradation
  rows:
    - self: true
      cells:
        - "**Graceful degradation**"
        - features with optional parts
        - Medium
        - free; cost is testing
        - —
    - cells:
        - "**Redundancy**"
        - critical dependencies
        - Medium
        - more infrastructure
        - Makes the dependency more available instead of needing it less; the only option when nothing is optional
    - cells:
        - "**Circuit breaker**"
        - failing dependencies
        - Low
        - free
        - Supplies the fast, clean failure that degradation then acts on — a prerequisite, not an alternative
    - cells:
        - "**Load shedding**"
        - your own overload
        - Medium
        - free
        - Refuses whole requests; degradation serves a smaller response to everyone
    - cells:
        - "**Caching**"
        - read-heavy data
        - Low
        - a cache node
        - Provides the stale rungs of the ladder; `stale-if-error` is degradation in a header
    - cells:
        - "**Hard fail**"
        - correctness-critical paths
        - Very low
        - free
        - The correct answer when a wrong result costs money or safety
    - cells:
        - "**Queue it for later**"
        - writes that can be async
        - Medium
        - free
        - Accepts now, completes later; only works when the user does not need the result immediately
  notes:
    - "**Pick redundancy** for the two or three genuinely critical dependencies — there is nothing to degrade to."
    - "**Pick a circuit breaker** underneath this: degradation needs a fast, deterministic failure to react to."
    - "**Pick caching** as the mechanism for the middle rungs; `stale-if-error` is the cheapest win available."
    - "**Pick load shedding** when the problem is volume rather than a broken dependency — but degrade before you shed."
    - "**Pick a hard fail** whenever a plausible-looking wrong answer would be worse than an honest error."
