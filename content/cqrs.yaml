title: CQRS
slug: cqrs
tagline: Writes and reads want opposite things from a schema. Stop making one model do both jobs badly.
asof: Nov 2026 · named by Greg Young, 2010; examples in C#, SQL and Python
description: "CQRS cheatsheet: separate write and read models, projections, the eventual consistency window and the read-your-own-writes problem — animated, with the levels you can stop at."
aliases:
