<svg viewBox="0 0 800 330" role="img" aria-label="Animated walk-through of applying a Deployment">
  <rect id="k-cli" x="20" y="130" width="130" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="85" y="156" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">kubectl</text>
  <text x="85" y="175" font-size="12" text-anchor="middle" fill="#5f6f66">apply -f web.yaml</text>
  <rect id="k-api" x="180" y="120" width="160" height="80" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="260" y="146" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">API server</text>
  <text id="k-api-l" x="260" y="180" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">idle</text>
  <rect id="k-etcd" x="180" y="245" width="160" height="65" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="260" y="268" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">etcd</text>
  <text id="k-etcd-t" x="260" y="292" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">no "web" yet</text>
  <rect id="k-ctrl" x="180" y="15" width="160" height="80" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="260" y="40" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Deployment controller</text>
  <text id="k-ctrl-t" x="260" y="70" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">watching</text>
  <rect id="k-sched" x="370" y="15" width="160" height="80" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="450" y="40" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Scheduler</text>
  <text id="k-sched-t" x="450" y="70" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">watching</text>
  <rect id="k-pending" class="hidden" x="370" y="120" width="160" height="190" rx="8" fill="none" stroke="#a9b5a6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text id="k-pending-t" class="hidden" x="450" y="140" font-size="12" text-anchor="middle" fill="#5f6f66">Pending pods</text>
  <rect id="k-n1" x="560" y="15" width="225" height="140" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="575" y="36" font-size="13" font-weight="600" fill="#23362e">node-1</text><text x="770" y="36" font-size="11" text-anchor="end" fill="#5f6f66">3.2 vCPU free</text>
  <rect id="k-n2" x="560" y="175" width="225" height="140" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="575" y="196" font-size="13" font-weight="600" fill="#23362e">node-2</text><text x="770" y="196" font-size="11" text-anchor="end" fill="#5f6f66">0.6 vCPU free</text>
  <g id="k-p1" class="hidden"><rect id="k-p1-r" x="385" y="150" width="130" height="38" rx="6" fill="#fbf3c4" stroke="#d9c25a"/><text x="395" y="166" font-size="11.5" font-weight="600" fill="#23362e" font-family="Fira Code, monospace">web-7d9-a</text><text id="k-p1-t" x="395" y="181" font-size="11" fill="#5f6f66">Pending</text></g>
  <g id="k-p2" class="hidden"><rect id="k-p2-r" x="385" y="196" width="130" height="38" rx="6" fill="#fbf3c4" stroke="#d9c25a"/><text x="395" y="212" font-size="11.5" font-weight="600" fill="#23362e" font-family="Fira Code, monospace">web-7d9-b</text><text id="k-p2-t" x="395" y="227" font-size="11" fill="#5f6f66">Pending</text></g>
  <g id="k-p3" class="hidden"><rect id="k-p3-r" x="385" y="242" width="130" height="38" rx="6" fill="#fbf3c4" stroke="#d9c25a"/><text x="395" y="258" font-size="11.5" font-weight="600" fill="#23362e" font-family="Fira Code, monospace">web-7d9-c</text><text id="k-p3-t" x="395" y="273" font-size="11" fill="#5f6f66">Pending</text></g>
  <g id="k-yaml" class="hidden"><rect x="20" y="205" width="150" height="30" rx="15" fill="#c53b3b"/><text x="95" y="225" font-size="11.5" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">replicas: 3 · web:1.4</text></g>
  <text id="k-note" class="hand hidden" x="20" y="300" font-size="16" fill="#c53b3b">…and it keeps checking, forever</text>
</svg>
