<svg viewBox="0 0 560 250" role="img" aria-label="Animated example of CPU requests filling a 4 vCPU node and a limit throttling a pod">
  <text x="20" y="22" font-size="12" font-weight="600" fill="#23362e">node-1 · 4 vCPU = 4000m</text>
  <rect x="20" y="32" width="520" height="40" rx="4" fill="#fbfcf8" stroke="#a9b5a6"/>
  <rect x="514" y="32" width="26" height="40" fill="#d5dccf"/>
  <g font-size="10.5" fill="#5f6f66" text-anchor="middle"><text x="20" y="86">0</text><text x="150" y="86">1000m</text><text x="280" y="86">2000m</text><text x="410" y="86">3000m</text><text x="527" y="86">sys</text></g>
  <g font-size="11" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">
    <g id="v-api" class="hidden"><rect x="20" y="32" width="65" height="40" fill="#e3eedc" stroke="#2f6b3f"/><text x="52" y="56">api</text></g>
    <g id="v-web" class="hidden"><rect x="85" y="32" width="32" height="40" fill="#e3eedc" stroke="#2f6b3f"/><rect x="117" y="32" width="33" height="40" fill="#e3eedc" stroke="#2f6b3f"/><text x="117" y="56" font-size="10">web×2</text></g>
    <g id="v-worker" class="hidden"><rect x="150" y="32" width="195" height="40" fill="#f9e3df" stroke="#c53b3b"/><text x="247" y="56">worker 1500m</text></g>
    <g id="v-new" class="hidden"><rect x="345" y="104" width="195" height="34" rx="4" fill="#fbf3c4" stroke="#c53b3b" stroke-dasharray="4 3"/><text x="442" y="126">new pod 1500m</text></g>
  </g>
  <text id="v-free" x="430" y="56" font-size="11" text-anchor="middle" fill="#5f6f66">free: 3800m</text>
  <text id="v-new-t" class="hidden" x="345" y="155" font-size="11.5" fill="#c53b3b">only 1300m free → Pending</text>
  <g id="v-usage" class="hidden">
    <text x="20" y="190" font-size="12" font-weight="600" fill="#23362e">worker CPU usage</text>
    <rect x="150" y="200" width="260" height="26" fill="#c53b3b"/>
    <rect id="v-cover" x="268" y="199" width="290" height="28" fill="#fbfcf8"/>
    <rect x="150" y="200" width="260" height="26" fill="none" stroke="#23362e"/>
    <line x1="345" y1="194" x2="345" y2="232" stroke="#2f6b3f" stroke-width="2"/>
    <text x="341" y="192" font-size="10.5" text-anchor="end" fill="#2f6b3f">request 1500m</text>
    <text x="410" y="244" font-size="10.5" text-anchor="middle" fill="#23362e">limit 2000m</text>
  </g>
  <text id="v-thr" class="hand hidden" x="420" y="218" font-size="15" fill="#c53b3b">throttled!</text>
</svg>
