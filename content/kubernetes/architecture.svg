<svg viewBox="0 0 800 320" role="img" aria-label="A control plane with API server, etcd, scheduler and controller manager manages worker nodes running kubelet, kube-proxy, a container runtime and pods; a Service load-balances to pods">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect x="20" y="15" width="300" height="220" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="170" y="36" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Control plane</text>
  <g font-size="13" text-anchor="middle" fill="#23362e">
    <rect x="35" y="48" width="270" height="44" rx="6" fill="#fbfcf8" stroke="#c53b3b" stroke-width="1.5"/><text x="170" y="68" font-weight="600">kube-apiserver</text><text x="170" y="84" font-size="11" fill="#5f6f66">the only door: everything talks to it</text>
    <rect x="35" y="106" width="125" height="50" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="97" y="128" font-weight="600">etcd</text><text x="97" y="145" font-size="11" fill="#5f6f66">stores cluster state</text>
    <rect x="180" y="106" width="125" height="50" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="242" y="128" font-weight="600">scheduler</text><text x="242" y="145" font-size="11" fill="#5f6f66">picks a node per pod</text>
    <rect x="35" y="170" width="270" height="50" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="170" y="192" font-weight="600">controller manager</text><text x="170" y="209" font-size="11" fill="#5f6f66">Deployment, ReplicaSet, Node… reconcile loops</text>
  </g>
  <rect x="20" y="255" width="300" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-dasharray="5 3"/>
  <text x="170" y="282" font-size="13" text-anchor="middle" fill="#23362e">kubectl · CI/CD · GitOps (Argo CD)</text>
  <line x1="170" y1="253" x2="170" y2="237" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- nodes -->
  <g font-size="13" text-anchor="middle" fill="#23362e">
    <rect x="360" y="15" width="200" height="205" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="460" y="36" font-weight="600">Node 1 (VM)</text>
    <rect x="585" y="15" width="200" height="205" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/><text x="685" y="36" font-weight="600">Node 2 (VM)</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#23362e">
    <rect x="375" y="46" width="170" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="460" y="62">kubelet</text>
    <rect x="375" y="76" width="170" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="460" y="92">kube-proxy</text>
    <rect x="375" y="106" width="170" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="460" y="122">containerd</text>
    <rect x="600" y="46" width="170" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="685" y="62">kubelet</text>
    <rect x="600" y="76" width="170" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="685" y="92">kube-proxy</text>
    <rect x="600" y="106" width="170" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="685" y="122">containerd</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#23362e">
    <rect x="375" y="145" width="80" height="58" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="415" y="168" font-weight="600">pod</text><text x="415" y="186" font-size="11" fill="#5f6f66">web</text>
    <rect x="465" y="145" width="80" height="58" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="505" y="168" font-weight="600">pod</text><text x="505" y="186" font-size="11" fill="#5f6f66">api</text>
    <rect x="600" y="145" width="80" height="58" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="640" y="168" font-weight="600">pod</text><text x="640" y="186" font-size="11" fill="#5f6f66">web</text>
    <rect x="690" y="145" width="80" height="58" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="730" y="168" font-weight="600">pod</text><text x="730" y="186" font-size="11" fill="#5f6f66">redis</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="305" y1="66" x2="373" y2="58"/>
    <path d="M305,78 C 340,78 340,140 470,140 S 590,100 598,64" fill="none"/>
  </g>
  <!-- service -->
  <rect x="360" y="240" width="425" height="40" rx="20" fill="#2f6b3f"/>
  <text x="572" y="265" font-size="13" text-anchor="middle" fill="#fbfcf8">Service "web": one stable IP and DNS name → all Ready web pods</text>
  <g stroke="#2f6b3f" stroke-width="1.5" stroke-dasharray="4 3"><line x1="415" y1="238" x2="415" y2="205"/><line x1="640" y1="238" x2="640" y2="205"/></g>
  <text class="hand" x="360" y="308" font-size="16" fill="#c53b3b">you declare WHAT; controllers keep making it so</text>
</svg>
