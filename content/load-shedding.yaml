title: Load shedding
slug: load-shedding
tagline: Past capacity you will fail some requests whatever you do. Shedding is choosing which ones, instead of letting the overload choose for you.
asof: Nov 2026 · examples in C#, Go, Envoy and Python; the arithmetic is from queueing theory
description: "Load shedding cheatsheet: why goodput collapses past capacity, how to choose what to drop by priority and cost, and which signal to shed on — animated."
aliases:
  - Load shedding
  - load shed
  - shedding
  - admission control
  - overload protection
  - brownout
  - goodput
keywords:
  - load shedding
  - admission control
  - overload
  - goodput
  - congestion collapse
  - priority
