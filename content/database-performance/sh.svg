  <g id="sh-k2"><rect x="200" y="40" width="100" height="28" rx="4" fill="#fbf3c4" stroke="#d9c25a"/><text x="250" y="59" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">user:42</text></g>
