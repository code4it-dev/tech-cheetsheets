<svg viewBox="0 0 800 320" role="img" aria-label="A query scanning a whole table, then traversing a B-tree index, then using a composite and covering index">
  <defs>
    <marker id="ix-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <g id="ix-q">
    <rect x="20" y="26" width="500" height="32" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text id="ix-qt" x="30" y="47" font-size="11" fill="#23362e" font-family="Fira Code, monospace">WHERE customer_id = 4711 AND placed_at &gt; '2026-01-01'</text>
  </g>

  <rect id="ix-plan" x="20" y="80" width="214" height="104" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="127" y="102" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">plan</text>
  <text id="ix-p1" x="34" y="126" font-size="11" fill="#23362e" font-family="Fira Code, monospace">Seq Scan on orders</text>
  <text id="ix-p2" x="34" y="148" font-size="11" fill="#5f6f66">rows examined: 20,000,000</text>
  <text id="ix-p3" x="34" y="170" font-size="11" fill="#c53b3b" font-weight="600">2,400 ms</text>

  <rect id="ix-btree" class="hidden" x="258" y="76" width="276" height="162" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text id="ix-btt" class="hidden" x="396" y="96" font-size="11.5" text-anchor="middle" fill="#5f6f66">B-tree on (customer_id)</text>
  <g id="ix-n0" class="hidden"><rect x="346" y="106" width="100" height="28" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="396" y="125" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">root</text></g>
  <g id="ix-n1" class="hidden"><rect x="276" y="150" width="100" height="28" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="326" y="169" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">1 – 9999</text></g>
  <g id="ix-n2" class="hidden"><rect x="416" y="150" width="100" height="28" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="466" y="169" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">10000 +</text></g>
  <g id="ix-l1" class="hidden"><rect x="276" y="194" width="100" height="28" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="326" y="213" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">4711 → ptrs</text></g>

  <rect id="ix-heap" x="562" y="76" width="216" height="162" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="670" y="98" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">orders (heap)</text>
  <text x="670" y="120" font-size="11" text-anchor="middle" fill="#5f6f66">20,000,000 rows</text>
  <text x="670" y="140" font-size="11" text-anchor="middle" fill="#5f6f66">~4 GB on disk</text>
  <text id="ix-ht" x="670" y="172" font-size="11.5" text-anchor="middle" fill="#c53b3b" font-weight="600">reading every page</text>
  <text id="ix-ht2" x="670" y="196" font-size="11" text-anchor="middle" fill="#5f6f66">returns 36 rows</text>
  <text id="ix-ht3" x="670" y="220" font-size="11" text-anchor="middle" fill="#5f6f66">discards 19,999,964</text>

  <text id="ix-ratio" x="400" y="266" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">examined / returned = 555,555 : 1</text>
  <text id="ix-cost" x="400" y="290" font-size="11.5" text-anchor="middle" fill="#5f6f66">the only number that matters when tuning a query</text>
  <text id="ix-hand" class="hand hidden" x="26" y="214" font-size="16" fill="#c53b3b">indexes tax every write</text>
</svg>
