<svg viewBox="0 0 800 340" role="img" aria-label="The path of a query from application through pool, planner, buffer cache and disk, beside a ladder of fixes ordered by cost">
  <defs>
    <marker id="db-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">where the time goes (left) and what to try about it, cheapest first (right)</text>

  <rect x="24" y="42" width="190" height="48" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="119" y="63" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">application</text>
  <text x="119" y="81" font-size="10.5" text-anchor="middle" fill="#5f6f66">N+1 loops live here</text>
  <line x1="119" y1="92" x2="119" y2="106" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <rect x="24" y="110" width="190" height="48" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="119" y="131" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">connection pool</text>
  <text x="119" y="149" font-size="10.5" text-anchor="middle" fill="#5f6f66">queueing and timeouts live here</text>
  <line x1="119" y1="160" x2="119" y2="174" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <rect x="24" y="178" width="190" height="48" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="119" y="199" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">planner</text>
  <text x="119" y="217" font-size="10.5" text-anchor="middle" fill="#5f6f66">statistics decide the plan</text>
  <line x1="119" y1="228" x2="119" y2="242" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <rect x="24" y="246" width="190" height="48" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="119" y="267" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">buffer cache (RAM)</text>
  <text x="119" y="285" font-size="10.5" text-anchor="middle" fill="#5f6f66">hit = ~100 ns</text>

  <rect x="236" y="246" width="150" height="48" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="311" y="267" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">disk</text>
  <text x="311" y="285" font-size="10.5" text-anchor="middle" fill="#5f6f66">miss = 50&ndash;500 &micro;s on NVMe</text>
  <line x1="218" y1="270" x2="232" y2="270" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <rect x="236" y="42" width="150" height="184" rx="6" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="311" y="64" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">one rule</text>
  <text x="311" y="92" font-size="11" text-anchor="middle" fill="#5f6f66">a query is fast</text>
  <text x="311" y="110" font-size="11" text-anchor="middle" fill="#5f6f66">when it touches</text>
  <text x="311" y="128" font-size="11" text-anchor="middle" fill="#5f6f66">few pages</text>
  <text x="311" y="158" font-size="11" text-anchor="middle" fill="#5f6f66">a system is stable</text>
  <text x="311" y="176" font-size="11" text-anchor="middle" fill="#5f6f66">when concurrency</text>
  <text x="311" y="194" font-size="11" text-anchor="middle" fill="#5f6f66">is bounded</text>

  <rect x="412" y="42" width="364" height="252" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="594" y="64" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">the ladder &mdash; climb in this order</text>
  <text x="432" y="92" font-size="11.5" fill="#2f6b3f" font-weight="600">1 &nbsp;add the missing index</text>
  <text x="432" y="114" font-size="11.5" fill="#2f6b3f" font-weight="600">2 &nbsp;rewrite the query / kill the N+1</text>
  <text x="432" y="136" font-size="11.5" fill="#2f6b3f" font-weight="600">3 &nbsp;right-size the connection pool</text>
  <text x="432" y="158" font-size="11.5" fill="#5f6f66">4 &nbsp;change the schema for the hot path</text>
  <text x="432" y="180" font-size="11.5" fill="#5f6f66">5 &nbsp;cache what is read far more than written</text>
  <text x="432" y="202" font-size="11.5" fill="#5f6f66">6 &nbsp;move reads to a replica</text>
  <text x="432" y="224" font-size="11.5" fill="#c53b3b">7 &nbsp;partition the table</text>
  <text x="432" y="246" font-size="11.5" fill="#c53b3b">8 &nbsp;shard &mdash; give up joins and transactions</text>
  <text x="432" y="274" font-size="11" fill="#5f6f66">each step costs roughly ten times the one above it</text>

  <text class="hand" x="30" y="326" font-size="16" fill="#c53b3b">90% of incidents are solved on steps 1&ndash;3 &mdash; measure before you climb</text>
</svg>
