<svg viewBox="0 0 800 320" role="img" aria-label="A connection pool of ten saturating when query time rises, with waiters queueing and timing out">
  <defs>
    <marker id="pl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <rect id="pl-app" x="20" y="74" width="160" height="96" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="100" y="100" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">application</text>
  <text id="pl-arrt" x="100" y="126" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">100 req/s</text>
  <text id="pl-errt" x="100" y="150" font-size="11" text-anchor="middle" fill="#5f6f66">no errors</text>
  <line x1="184" y1="122" x2="214" y2="122" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#pl-arr)"/>

  <rect id="pl-pool" x="218" y="56" width="236" height="132" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="336" y="78" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">connection pool &mdash; max 10</text>
  <circle id="pl-s1" cx="254" cy="110" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s2" cx="292" cy="110" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s3" cx="330" cy="110" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s4" cx="368" cy="110" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s5" cx="406" cy="110" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s6" cx="254" cy="152" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s7" cx="292" cy="152" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s8" cx="330" cy="152" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s9" cx="368" cy="152" r="12" fill="#e8ece2" stroke="#a9b5a6"/>
  <circle id="pl-s10" cx="406" cy="152" r="12" fill="#e8ece2" stroke="#a9b5a6"/>

  <rect id="pl-wait" x="218" y="204" width="236" height="46" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="pl-waitt" x="336" y="232" font-size="11.5" text-anchor="middle" fill="#5f6f66">waiting for a connection: 0</text>

  <line x1="458" y1="122" x2="488" y2="122" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#pl-arr)"/>
  <rect id="pl-db" x="492" y="56" width="286" height="132" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="635" y="80" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">database &mdash; 16 cores</text>
  <text id="pl-dbt" x="635" y="110" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">query time: 50 ms</text>
  <text id="pl-dbs" x="635" y="136" font-size="11" text-anchor="middle" fill="#5f6f66">healthy, mostly idle</text>
  <text id="pl-dbs2" x="635" y="162" font-size="11" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="pl-calc" x="492" y="204" width="286" height="94" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="pl-c1" x="508" y="228" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">L = λ × W</text>
  <text id="pl-c2" x="508" y="252" font-size="11.5" fill="#5f6f66" font-family="Fira Code, monospace">= 100/s × 0.05 s = 5</text>
  <text id="pl-c3" x="508" y="276" font-size="11.5" fill="#2f6b3f" font-weight="600">5 connections busy of 10</text>

  <text id="pl-hand" class="hand hidden" x="26" y="276" font-size="16" fill="#c53b3b">a bigger pool just moves the queue onto the database</text>
  <text id="pl-t" x="100" y="196" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">t = 0 s</text>
</svg>
