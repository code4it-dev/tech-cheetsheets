<svg viewBox="0 0 800 310" role="img" aria-label="Producers write to a Kafka cluster of three brokers holding replicated partitions of the orders topic, coordinated by a KRaft controller quorum; two consumer groups read independently">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <g font-size="13" text-anchor="middle" fill="#23362e">
    <rect x="20" y="70" width="140" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="90" y="97">order-service</text>
    <rect x="20" y="150" width="140" height="44" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="90" y="177">payment-service</text>
  </g>
  <text x="90" y="56" font-size="11" text-anchor="middle" fill="#5f6f66">producers</text>
  <g stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="160" y1="92" x2="188" y2="110"/><line x1="160" y1="172" x2="188" y2="150"/>
  </g>
  <!-- cluster -->
  <rect x="190" y="15" width="430" height="270" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="405" y="38" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Kafka cluster · topic "orders", 3 partitions, replication factor 3</text>
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">
    <rect x="205" y="52" width="125" height="130" rx="6" fill="#eef1e8" stroke="#d5dccf"/><text x="267" y="72">Broker 1</text>
    <rect x="342" y="52" width="125" height="130" rx="6" fill="#eef1e8" stroke="#d5dccf"/><text x="404" y="72">Broker 2</text>
    <rect x="479" y="52" width="125" height="130" rx="6" fill="#eef1e8" stroke="#d5dccf"/><text x="541" y="72">Broker 3</text>
  </g>
  <g font-size="12" text-anchor="middle" font-family="Fira Code, monospace" fill="#23362e">
    <rect x="215" y="84" width="105" height="26" rx="4" fill="#f9e3df" stroke="#c53b3b"/><text x="267" y="102">P0 ★</text>
    <rect x="215" y="116" width="105" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="267" y="134">P1</text>
    <rect x="215" y="148" width="105" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="267" y="166">P2</text>
    <rect x="352" y="84" width="105" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="404" y="102">P0</text>
    <rect x="352" y="116" width="105" height="26" rx="4" fill="#f9e3df" stroke="#c53b3b"/><text x="404" y="134">P1 ★</text>
    <rect x="352" y="148" width="105" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="404" y="166">P2</text>
    <rect x="489" y="84" width="105" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="541" y="102">P0</text>
    <rect x="489" y="116" width="105" height="26" rx="4" fill="#e8ece2" stroke="#a9b5a6"/><text x="541" y="134">P1</text>
    <rect x="489" y="148" width="105" height="26" rx="4" fill="#f9e3df" stroke="#c53b3b"/><text x="541" y="166">P2 ★</text>
  </g>
  <text x="405" y="194" font-size="10.5" text-anchor="middle" fill="#5f6f66">★ = partition leader (reads and writes) · grey = follower replica</text>
  <rect x="205" y="215" width="399" height="56" rx="6" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="405" y="238" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">KRaft controller quorum</text>
  <text x="405" y="257" font-size="11" text-anchor="middle" fill="#5f6f66">cluster metadata, leader election · replaces ZooKeeper (removed in 4.0)</text>
  <!-- consumers -->
  <g stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="620" y1="90" x2="648" y2="80"/><line x1="620" y1="150" x2="648" y2="168"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#23362e">
    <rect x="650" y="50" width="135" height="60" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="717" y="75" font-weight="600">group: billing</text><text x="717" y="94" font-size="11" fill="#5f6f66">2 consumers</text>
    <rect x="650" y="138" width="135" height="60" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="717" y="163" font-weight="600">group: analytics</text><text x="717" y="182" font-size="11" fill="#5f6f66">1 consumer</text>
  </g>
  <text class="hand" x="638" y="236" font-size="16" fill="#c53b3b">each group gets</text>
  <text class="hand" x="638" y="256" font-size="16" fill="#c53b3b">every record ↑</text>
</svg>
