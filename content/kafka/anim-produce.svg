<svg viewBox="0 0 800 330" role="img" aria-label="Animated walk-through of producing a keyed record to a partition, replicating it and acknowledging it">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <!-- producer -->
  <rect id="p-prod" x="20" y="110" width="140" height="70" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="90" y="140" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Producer</text>
  <text x="90" y="160" font-size="12" text-anchor="middle" fill="#5f6f66">order-service</text>
  <line x1="160" y1="145" x2="218" y2="145" stroke="#a9b5a6" stroke-width="1.5"/>
  <!-- partitioner -->
  <rect id="p-part" x="220" y="100" width="175" height="100" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="307" y="125" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Partitioner</text>
  <text x="307" y="143" font-size="11.5" text-anchor="middle" fill="#5f6f66">inside the producer client</text>
  <text id="p-part-label" x="307" y="178" font-size="12" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">idle</text>
  <line id="p-arrow" class="hidden" x1="395" y1="140" x2="430" y2="120" stroke="#c53b3b" stroke-width="2" marker-end="url(#arr2)"/>
  <!-- topic -->
  <rect x="420" y="15" width="365" height="190" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="602" y="36" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">topic: orders</text>
  <rect id="p-row-0" x="432" y="48" width="342" height="42" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
  <rect id="p-row-1" x="432" y="98" width="342" height="42" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
  <rect id="p-row-2" x="432" y="148" width="342" height="42" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
  <g font-size="13" font-weight="600" fill="#23362e">
    <text x="442" y="67">P0</text><text x="442" y="117">P1</text><text x="442" y="167">P2</text>
  </g>
  <g font-size="11" fill="#5f6f66">
    <text x="442" y="82">leader B1</text><text x="442" y="132">leader B2</text><text x="442" y="182">leader B3</text>
  </g>
  <g font-size="12" text-anchor="middle" font-family="Fira Code, monospace" fill="#23362e">
    <rect x="520" y="54" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="542" y="74">0</text>
    <rect x="570" y="54" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="592" y="74">1</text>
    <rect x="620" y="54" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="642" y="74">2</text>
    <rect x="670" y="54" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="692" y="74">3</text>
    <rect x="520" y="104" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="542" y="124">0</text>
    <rect x="570" y="104" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="592" y="124">1</text>
    <rect x="620" y="104" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="642" y="124">2</text>
    <rect x="670" y="104" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="692" y="124">3</text>
    <rect x="520" y="154" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="542" y="174">0</text>
    <rect x="570" y="154" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="592" y="174">1</text>
    <rect x="620" y="154" width="44" height="30" rx="3" fill="#e8ece2" stroke="#a9b5a6"/><text x="642" y="174">2</text>
    <g id="p-new" class="hidden"><rect x="720" y="104" width="44" height="30" rx="3" fill="#f6e05e" stroke="#c53b3b" stroke-width="2"/><text x="742" y="124">4</text></g>
  </g>
  <!-- followers -->
  <line id="p-rep-arrow" class="hidden" x1="742" y1="140" x2="742" y2="226" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <rect x="420" y="228" width="365" height="94" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="440" y="250" font-size="13" font-weight="600" fill="#23362e">Follower replicas of P1</text>
  <rect id="p-f1" x="440" y="260" width="280" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="p-f1-t" x="452" y="277" font-size="12" font-family="Fira Code, monospace" fill="#23362e">B1 · offsets 0…3</text>
  <rect id="p-f3" x="440" y="290" width="280" height="24" rx="4" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="p-f3-t" x="452" y="307" font-size="12" font-family="Fira Code, monospace" fill="#23362e">B3 · offsets 0…3</text>
  <!-- record -->
  <g id="p-msg" class="hidden">
    <rect x="20" y="210" width="175" height="32" rx="16" fill="#c53b3b"/>
    <text x="107" y="231" font-size="12" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">key=user-42 "paid"</text>
  </g>
  <g id="p-ack" class="hidden">
    <rect x="230" y="270" width="175" height="32" rx="16" fill="#2f6b3f"/>
    <text x="317" y="291" font-size="12" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">ack · P1 @ offset 4</text>
  </g>
  <text id="p-note" class="hand hidden" x="20" y="322" font-size="16" fill="#c53b3b">reading never deletes anything!</text>
</svg>
