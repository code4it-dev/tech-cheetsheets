    <g id="c-r3"><rect id="c-r3-r" x="248" y="50" width="70" height="50" rx="4" fill="#fbfcf8" stroke="#a9b5a6"/><text x="283" y="70">user-3</text><text x="283" y="88" fill="#5f6f66">Lima</text></g>
    <g id="c-r4"><rect id="c-r4-r" x="324" y="50" width="70" height="50" rx="4" fill="#fbfcf8" stroke="#a9b5a6"/><text x="359" y="70">user-2</text><text x="359" y="88" fill="#5f6f66">Bern</text></g>
