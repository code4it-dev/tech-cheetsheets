<svg viewBox="0 0 800 310" role="img" aria-label="Animated walk-through of a consumer group sharing partitions, committing offsets and rebalancing">
  <!-- partitions -->
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">
    <rect id="g-p0" x="30" y="30" width="190" height="60" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/><text x="125" y="54">orders · P0</text>
    <rect id="g-p1" x="30" y="120" width="190" height="60" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/><text x="125" y="144">orders · P1</text>
    <rect id="g-p2" x="30" y="210" width="190" height="60" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/><text x="125" y="234">orders · P2</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">
    <text id="g-p0-off" x="125" y="76">committed: 12</text>
    <text id="g-p1-off" x="125" y="166">committed: 40</text>
    <text id="g-p2-off" x="125" y="256">committed: 30</text>
  </g>
  <!-- assignments -->
  <g stroke="#2f6b3f" stroke-width="3" stroke-linecap="round">
    <line id="g-a-p0-c1" class="hidden" x1="220" y1="60" x2="545" y2="72"/>
    <line id="g-a-p1-c1" class="hidden" x1="220" y1="150" x2="545" y2="72"/>
    <line id="g-a-p2-c2" class="hidden" x1="220" y1="240" x2="545" y2="162"/>
    <line id="g-a-p1-c3" class="hidden" x1="220" y1="150" x2="545" y2="252"/>
    <line id="g-a-p2-c1" class="hidden" x1="220" y1="240" x2="545" y2="72"/>
  </g>
  <text id="g-commit" class="hidden" x="380" y="22" font-size="12" text-anchor="middle" fill="#2f6b3f" font-family="Fira Code, monospace">commit P0 → 15  (__consumer_offsets)</text>
  <!-- group -->
  <rect id="g-group" x="525" y="15" width="255" height="285" rx="8" fill="none" stroke="#a9b5a6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="652" y="34" font-size="12" text-anchor="middle" fill="#5f6f66">consumer group "billing"</text>
  <rect id="g-c1" x="545" y="45" width="215" height="55" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="565" y="68" font-size="14" font-weight="600" fill="#23362e">C1</text>
  <text id="g-c1-sub" x="565" y="88" font-size="12" fill="#5f6f66">reads P0, P1</text>
  <rect id="g-c2" x="545" y="135" width="215" height="55" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="g-c2-title" x="565" y="158" font-size="14" font-weight="600" fill="#23362e">C2</text>
  <text id="g-c2-sub" x="565" y="178" font-size="12" fill="#5f6f66">reads P2</text>
  <g id="g-c3" class="hidden">
    <rect x="545" y="225" width="215" height="55" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
    <text x="565" y="248" font-size="14" font-weight="600" fill="#23362e">C3 (new)</text>
    <text id="g-c3-sub" x="565" y="268" font-size="12" fill="#5f6f66">waiting for assignment</text>
  </g>
  <text id="g-note" class="hand hidden" x="235" y="300" font-size="16" fill="#c53b3b">a 4th consumer would just sit idle</text>
</svg>
