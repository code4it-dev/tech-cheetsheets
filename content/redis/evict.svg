<svg viewBox="0 0 560 240" role="img" aria-label="Animated LRU eviction when Redis memory is full">
  <text id="e-mem" x="20" y="28" font-size="12.5" font-weight="600" fill="#c53b3b" font-family="Fira Code, monospace">used 100 MB / maxmemory 100 MB</text>
  <g font-size="11" fill="#23362e" font-family="Fira Code, monospace">
    <g id="e-k1"><rect id="e-k1-r" x="20" y="50" width="98" height="56" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/><text x="28" y="72">session:a</text><text x="28" y="92" fill="#5f6f66">idle 3 s</text></g>
    <g id="e-k2"><rect id="e-k2-r" x="126" y="50" width="98" height="56" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/><text x="134" y="72">cart:7</text><text x="134" y="92" fill="#5f6f66">idle 40 min</text></g>
    <g id="e-k3"><rect id="e-k3-r" x="232" y="50" width="98" height="56" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/><text x="240" y="72">user:1</text><text x="240" y="92" fill="#5f6f66">idle 5 s</text></g>
    <g id="e-k4"><rect id="e-k4-r" x="338" y="50" width="98" height="56" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/><text x="346" y="72">views:home</text><text x="346" y="92" fill="#5f6f66">idle 1 s</text></g>
    <g id="e-k5"><rect id="e-k5-r" x="444" y="50" width="98" height="56" rx="5" fill="#fbfcf8" stroke="#a9b5a6"/><text x="452" y="72">rl:ip9</text><text x="452" y="92" fill="#5f6f66">idle 12 min</text></g>
    <g id="e-new" class="hidden"><rect id="e-new-r" x="126" y="150" width="98" height="56" rx="5" fill="#fbf3c4" stroke="#c53b3b"/><text x="134" y="172">product:42</text><text id="e-new-t" x="134" y="192" fill="#5f6f66">waiting…</text></g>
  </g>
  <text id="e-new-cmd" class="hidden" x="240" y="182" font-size="12" fill="#23362e" font-family="Fira Code, monospace">← SET product:42 "{…}"</text>
  <text id="e-note" class="hand hidden" x="20" y="232" font-size="15" fill="#c53b3b">with noeviction this SET would fail with an OOM error</text>
</svg>
