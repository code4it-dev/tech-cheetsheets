<svg viewBox="0 0 800 310" role="img" aria-label="Animated walk-through of a SET command">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <!-- client -->
  <rect id="s-client" x="20" y="100" width="140" height="70" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="90" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Your app</text>
  <text x="90" y="150" font-size="12" text-anchor="middle" fill="#5f6f66">redis-py client</text>
  <line x1="160" y1="135" x2="248" y2="135" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#arr2)"/>
  <!-- event loop -->
  <rect id="s-loop" x="250" y="80" width="200" height="110" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="350" y="106" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Event loop</text>
  <text x="350" y="124" font-size="11" text-anchor="middle" fill="#5f6f66">single thread, one at a time</text>
  <text id="s-loop-label" x="350" y="164" font-size="12.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">idle</text>
  <line x1="450" y1="115" x2="528" y2="105" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line id="s-arrow-disk" class="hidden" x1="450" y1="170" x2="528" y2="250" stroke="#8a6a0c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <!-- RAM keyspace -->
  <rect id="s-mem" x="530" y="15" width="250" height="185" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="655" y="38" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">RAM · keyspace (hash table)</text>
  <g font-size="12" font-family="Fira Code, monospace" fill="#23362e">
    <rect id="s-slot-0" x="545" y="50" width="220" height="30" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
    <text x="555" y="70">0 │ session:9f → "…"</text>
    <rect id="s-slot-1" x="545" y="85" width="220" height="30" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
    <text x="555" y="105">1 │ cart:7 → [3 items]</text>
    <rect id="s-slot-2" x="545" y="120" width="220" height="30" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
    <text id="s-slot-2-t" x="555" y="140" fill="#23362e">2 │ (empty)</text>
    <rect id="s-slot-3" x="545" y="155" width="220" height="30" rx="4" fill="#fbfcf8" stroke="#d5dccf"/>
    <text x="555" y="175">3 │ views:home → 1042</text>
  </g>
  <!-- disk -->
  <rect id="s-disk" x="530" y="225" width="250" height="70" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="655" y="249" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Disk · appendonly.aof</text>
  <text id="s-aof" x="655" y="275" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">… INCR views:home</text>
  <!-- moving command -->
  <g id="s-msg" class="hidden">
    <rect x="20" y="205" width="170" height="32" rx="16" fill="#c53b3b"/>
    <text x="105" y="226" font-size="13" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">SET user:1 "Ada"</text>
  </g>
  <!-- reply -->
  <g id="s-reply" class="hidden">
    <rect x="270" y="255" width="90" height="32" rx="16" fill="#2f6b3f"/>
    <text x="315" y="276" font-size="13" text-anchor="middle" fill="#fbfcf8" font-family="Fira Code, monospace">+OK</text>
  </g>
</svg>
