<svg viewBox="0 0 800 300" role="img" aria-label="Animated cache-aside pattern between an app, Redis and a database">
  <!-- app -->
  <rect id="c-app" x="20" y="110" width="110" height="70" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="75" y="140" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Your app</text>
  <text x="75" y="160" font-size="12" text-anchor="middle" fill="#5f6f66">product page</text>
  <!-- paths -->
  <g stroke="#d5dccf" stroke-width="2" fill="none">
    <line x1="130" y1="145" x2="250" y2="145"/>
    <line x1="250" y1="145" x2="380" y2="65"/>
    <line x1="250" y1="145" x2="380" y2="235"/>
  </g>
  <!-- redis -->
  <rect id="c-redis" x="380" y="20" width="220" height="90" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="490" y="46" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Redis (cache, RAM)</text>
  <text id="c-redis-state" x="490" y="80" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">(no product:42)</text>
  <!-- db -->
  <rect id="c-db" x="380" y="190" width="220" height="90" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="490" y="216" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">PostgreSQL</text>
  <text x="490" y="250" font-size="12" text-anchor="middle" fill="#5f6f66">products table, on disk</text>
  <!-- latency readout -->
  <text x="700" y="120" font-size="12" text-anchor="middle" fill="#5f6f66">Response time</text>
  <text id="c-lat" x="700" y="152" font-size="26" font-weight="700" text-anchor="middle" fill="#23362e">—</text>
  <text id="c-lat-sub" x="700" y="176" font-size="12" text-anchor="middle" fill="#5f6f66"></text>
  <!-- packet: starts at (250,145); label sits left of the dot -->
  <g id="c-pkt" class="hidden">
    <circle cx="250" cy="145" r="9" fill="#c53b3b"/>
    <text id="c-pkt-label" x="236" y="149" font-size="12" text-anchor="end" fill="#23362e" font-family="Fira Code, monospace">GET product:42</text>
  </g>
</svg>
