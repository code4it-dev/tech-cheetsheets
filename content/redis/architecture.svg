<svg viewBox="0 0 800 300" role="img" aria-label="Clients connect to a Redis primary that holds data structures in RAM, persists to disk, replicates to read-only replicas and is watched by Sentinel or organised as a Cluster">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <!-- clients -->
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="45" width="120" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="80" y="70" fill="#23362e">Web app</text>
    <rect x="20" y="110" width="120" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="80" y="135" fill="#23362e">Worker</text>
    <rect x="20" y="175" width="120" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="80" y="200" fill="#23362e">redis-cli</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="140" y1="65" x2="198" y2="100"/><line x1="140" y1="130" x2="198" y2="130"/><line x1="140" y1="195" x2="198" y2="160"/>
  </g>
  <text x="169" y="240" font-size="11" fill="#5f6f66" text-anchor="middle">TCP :6379</text>
  <!-- primary -->
  <rect x="200" y="20" width="270" height="205" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="335" y="44" font-size="15" font-weight="600" text-anchor="middle" fill="#23362e">Redis primary</text>
  <text x="335" y="62" font-size="11.5" text-anchor="middle" fill="#5f6f66">one thread executes commands, in order</text>
  <g font-size="12.5" text-anchor="middle" fill="#23362e">
    <rect x="215" y="76" width="115" height="28" rx="5" fill="#fbfcf8" stroke="#d5dccf"/><text x="272" y="95">String</text>
    <rect x="340" y="76" width="115" height="28" rx="5" fill="#fbfcf8" stroke="#d5dccf"/><text x="397" y="95">Hash</text>
    <rect x="215" y="110" width="115" height="28" rx="5" fill="#fbfcf8" stroke="#d5dccf"/><text x="272" y="129">List</text>
    <rect x="340" y="110" width="115" height="28" rx="5" fill="#fbfcf8" stroke="#d5dccf"/><text x="397" y="129">Set</text>
    <rect x="215" y="144" width="115" height="28" rx="5" fill="#fbfcf8" stroke="#d5dccf"/><text x="272" y="163">Sorted set</text>
    <rect x="340" y="144" width="115" height="28" rx="5" fill="#fbfcf8" stroke="#d5dccf"/><text x="397" y="163">Stream · JSON · …</text>
  </g>
  <text x="335" y="200" font-size="12.5" text-anchor="middle" fill="#c53b3b" font-weight="600">Keyspace lives in RAM</text>
  <text x="335" y="216" font-size="11.5" text-anchor="middle" fill="#5f6f66">maxmemory + eviction policy cap it</text>
  <text class="hand" x="18" y="268" font-size="16" fill="#c53b3b">RAM is the whole trick ↗</text>
  <!-- disk -->
  <line x1="335" y1="225" x2="335" y2="243" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="245" width="270" height="45" rx="8" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="335" y="265" font-size="13" text-anchor="middle" fill="#23362e">Disk: RDB snapshots + AOF log</text>
  <text x="335" y="281" font-size="11" text-anchor="middle" fill="#5f6f66">optional persistence, for restarts</text>
  <!-- replicas -->
  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="470" y1="70" x2="548" y2="62"/><line x1="470" y1="110" x2="548" y2="132"/>
  </g>
  <text x="509" y="98" font-size="11" text-anchor="middle" fill="#5f6f66">async</text>
  <g font-size="13" text-anchor="middle" fill="#23362e">
    <rect x="550" y="35" width="230" height="50" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="665" y="57">Replica 1</text><text x="665" y="74" font-size="11" fill="#5f6f66">read-only copy</text>
    <rect x="550" y="105" width="230" height="50" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="665" y="127">Replica 2</text><text x="665" y="144" font-size="11" fill="#5f6f66">read-only copy</text>
  </g>
  <!-- sentinel / cluster -->
  <rect x="550" y="185" width="230" height="70" rx="6" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="665" y="207" font-size="13" text-anchor="middle" fill="#23362e" font-weight="600">Sentinel or Cluster</text>
  <text x="665" y="225" font-size="11" text-anchor="middle" fill="#5f6f66">Sentinel: health checks + failover</text>
  <text x="665" y="241" font-size="11" text-anchor="middle" fill="#5f6f66">Cluster: shards keys over 16,384 slots</text>
  <line x1="548" y1="215" x2="472" y2="185" stroke="#8a6a0c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
