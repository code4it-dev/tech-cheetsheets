<svg viewBox="0 0 800 340" role="img" aria-label="A pod containing an application container and a sidecar sharing a network namespace and a volume, configured by a control plane">
  <defs>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">same pod, same lifecycle, same network namespace &mdash; different image, different team</text>

  <rect x="24" y="118" width="110" height="64" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="79" y="146" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text x="79" y="166" font-size="10.5" text-anchor="middle" fill="#5f6f66">pod IP :443</text>
  <line x1="138" y1="150" x2="172" y2="150" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sc-arr)"/>

  <rect x="176" y="80" width="420" height="190" rx="10" fill="#fbfcf8" stroke="#2f6b3f" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="386" y="102" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">one pod &mdash; one IP, one lifecycle</text>

  <rect x="194" y="116" width="178" height="96" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="283" y="140" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">sidecar</text>
  <text x="283" y="160" font-size="10.5" text-anchor="middle" fill="#5f6f66">mTLS · retries · metrics</text>
  <text x="283" y="178" font-size="10.5" text-anchor="middle" fill="#5f6f66">traces · policy</text>
  <text x="283" y="198" font-size="10.5" text-anchor="middle" fill="#c53b3b">someone else's image</text>

  <rect x="400" y="116" width="178" height="96" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="489" y="140" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">application</text>
  <text x="489" y="160" font-size="10.5" text-anchor="middle" fill="#5f6f66">plain HTTP on :8080</text>
  <text x="489" y="178" font-size="10.5" text-anchor="middle" fill="#5f6f66">no TLS, no retry code</text>
  <text x="489" y="198" font-size="10.5" text-anchor="middle" fill="#2f6b3f">your image</text>

  <line x1="376" y1="152" x2="396" y2="152" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <text x="386" y="236" font-size="10.5" text-anchor="middle" fill="#5f6f66">localhost</text>

  <rect x="194" y="228" width="384" height="30" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="300" y="248" font-size="10.5" text-anchor="middle" fill="#5f6f66">shared volume: /var/log, /secrets</text>
  <text x="480" y="248" font-size="10.5" text-anchor="middle" fill="#5f6f66">shared netns: 127.0.0.1</text>

  <line x1="600" y1="150" x2="634" y2="150" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sc-arr)"/>
  <rect x="638" y="118" width="138" height="64" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="707" y="146" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">upstream</text>
  <text x="707" y="166" font-size="10.5" text-anchor="middle" fill="#5f6f66">its own sidecar</text>

  <rect x="638" y="222" width="138" height="62" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="707" y="246" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">control plane</text>
  <text x="707" y="266" font-size="10.5" text-anchor="middle" fill="#5f6f66">policy as config</text>
  <path d="M638 253 L600 253 L600 190 L283 190 L283 216" fill="none" stroke="#e6b3ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#sc-arr)"/>

  <text class="hand" x="30" y="296" font-size="16" fill="#c53b3b">change the retry policy for 300 services with a config push, not 300 releases</text>
  <text class="hand" x="30" y="320" font-size="16" fill="#c53b3b">…and pay for 300 extra containers while you do it</text>
</svg>
