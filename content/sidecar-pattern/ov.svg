<svg viewBox="0 0 560 200" role="img" aria-label="Per-pod sidecar cost multiplied across a fleet of pods">
  <text x="280" y="26" font-size="11.5" text-anchor="middle" fill="#5f6f66">harmless per pod, substantial per cluster</text>
  <rect id="ov-pod" x="40" y="48" width="200" height="60" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="140" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">one sidecar</text>
  <text id="ov-podt" x="140" y="92" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">100 mCPU · 128 MiB</text>
  <text id="ov-x" x="280" y="84" font-size="16" text-anchor="middle" fill="#23362e" font-weight="700">×</text>
  <rect id="ov-fleet" x="320" y="48" width="200" height="60" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="ov-fleett" x="420" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">pods</text>
  <text id="ov-fleett2" x="420" y="92" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">?</text>
  <text id="ov-sum" x="280" y="146" font-size="14" text-anchor="middle" fill="#23362e" font-weight="700" font-family="Fira Code, monospace">= ?</text>
  <text id="ov-note" x="280" y="172" font-size="11.5" text-anchor="middle" fill="#5f6f66">this is why sidecarless meshes exist</text>
</svg>
