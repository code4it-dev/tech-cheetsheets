<svg viewBox="0 0 800 320" role="img" aria-label="A request intercepted by a sidecar proxy, forwarded over localhost to the application, and an outbound call handled by the same sidecar">
  <defs>
    <marker id="rq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <g id="rq-msg">
    <rect x="16" y="26" width="230" height="30" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
    <text id="rq-msgt" x="26" y="46" font-size="10.5" fill="#23362e" font-family="Fira Code, monospace">GET /orders · mTLS</text>
  </g>

  <rect id="rq-cli" x="20" y="120" width="120" height="76" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="80" y="150" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">client</text>
  <text x="80" y="172" font-size="10.5" text-anchor="middle" fill="#5f6f66">pod IP :443</text>

  <line x1="144" y1="158" x2="174" y2="158" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rq-arr)"/>

  <rect x="178" y="84" width="420" height="162" rx="10" fill="#fbfcf8" stroke="#2f6b3f" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="388" y="104" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">pod</text>

  <rect id="rq-car" x="194" y="116" width="182" height="110" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="285" y="138" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">sidecar proxy</text>
  <text id="rq-c1" x="285" y="160" font-size="10.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="rq-c2" x="285" y="180" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <text id="rq-c3" x="285" y="200" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>
  <text id="rq-c4" x="285" y="218" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <line x1="380" y1="170" x2="400" y2="170" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rq-arr)"/>
  <text id="rq-loop" x="390" y="238" font-size="10" text-anchor="middle" fill="#5f6f66">localhost</text>

  <rect id="rq-app" x="404" y="116" width="182" height="110" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="495" y="138" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">application</text>
  <text id="rq-a1" x="495" y="160" font-size="10.5" text-anchor="middle" fill="#5f6f66">listening on :8080</text>
  <text id="rq-a2" x="495" y="180" font-size="10.5" text-anchor="middle" fill="#5f6f66">plain HTTP</text>
  <text id="rq-a3" x="495" y="200" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <line x1="602" y1="158" x2="632" y2="158" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#rq-arr)"/>
  <rect id="rq-up" x="636" y="120" width="144" height="76" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="708" y="150" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">payments</text>
  <text id="rq-upt" x="708" y="172" font-size="10.5" text-anchor="middle" fill="#5f6f66">healthy</text>

  <rect id="rq-note" x="20" y="266" width="760" height="40" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="rq-n" x="400" y="291" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">the application's code knows nothing about any of this</text>
</svg>
