<svg viewBox="0 0 800 300" role="img" aria-label="Startup and shutdown races between an application container and a sidecar, fixed by native sidecar containers">
  <text id="lf-phase" x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">startup &mdash; both containers start at the same moment</text>

  <rect x="40" y="48" width="720" height="140" rx="10" fill="#fbfcf8" stroke="#2f6b3f" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="400" y="68" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="700">pod</text>

  <rect id="lf-car" x="70" y="84" width="300" height="84" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="220" y="108" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">sidecar proxy</text>
  <text id="lf-cart" x="220" y="130" font-size="11" text-anchor="middle" fill="#5f6f66">starting · pulling config</text>
  <text id="lf-cart2" x="220" y="152" font-size="11" text-anchor="middle" fill="#5f6f66">ready in ~2 s</text>

  <rect id="lf-app" x="430" y="84" width="300" height="84" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="580" y="108" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">application</text>
  <text id="lf-appt" x="580" y="130" font-size="11" text-anchor="middle" fill="#5f6f66">starting</text>
  <text id="lf-appt2" x="580" y="152" font-size="11" text-anchor="middle" fill="#5f6f66">ready in ~300 ms</text>

  <text id="lf-t" x="400" y="212" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">t = 0 ms</text>

  <rect id="lf-out" x="40" y="228" width="720" height="56" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="lf-o" x="400" y="252" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">two containers, one lifecycle &mdash; and no ordering guarantees by default</text>
  <text id="lf-o2" x="400" y="272" font-size="11" text-anchor="middle" fill="#5f6f66">which is where most sidecar incidents come from</text>
</svg>
