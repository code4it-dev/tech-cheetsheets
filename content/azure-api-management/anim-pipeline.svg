<svg viewBox="0 0 800 330" role="img" aria-label="Animated walk-through of a request through the inbound, backend, outbound and on-error policy sections">
  <defs>
    <marker id="pp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <rect id="pp-client" x="16" y="124" width="112" height="74" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="72" y="150" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Client</text>
  <text id="pp-client-sub" x="72" y="170" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle</text>
  <text id="pp-client-sub2" x="72" y="187" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <line x1="128" y1="160" x2="160" y2="160" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#pp-arr)"/>

  <rect x="164" y="26" width="416" height="282" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="372" y="46" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Policy pipeline</text>

  <rect x="176" y="56" width="392" height="98" rx="6" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="186" y="72" font-size="11" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">&lt;inbound&gt;</text>
  <g font-size="11" font-family="Fira Code, monospace" fill="#23362e">
    <rect id="pp-p1" x="186" y="78" width="372" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/><text x="192" y="91">&lt;validate-jwt require-scheme="Bearer" /&gt;</text>
    <rect id="pp-p2" x="186" y="97" width="372" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/><text x="192" y="110">&lt;rate-limit-by-key calls="600" renewal-period="60" /&gt;</text>
    <rect id="pp-p3" x="186" y="116" width="372" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/><text x="192" y="129">&lt;cache-lookup-value key="..." /&gt;</text>
    <rect id="pp-p4" x="186" y="135" width="372" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/><text x="192" y="148">&lt;rewrite-uri&gt; + &lt;authentication-managed-identity&gt;</text>
  </g>

  <rect x="176" y="160" width="392" height="38" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="186" y="176" font-size="11" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">&lt;backend&gt;</text>
  <rect id="pp-p5" x="186" y="177" width="372" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="192" y="190" font-size="11" font-family="Fira Code, monospace" fill="#23362e">&lt;forward-request timeout="20" /&gt;</text>

  <rect x="176" y="204" width="392" height="60" rx="6" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="186" y="220" font-size="11" fill="#8a6a0c" font-weight="600" font-family="Fira Code, monospace">&lt;outbound&gt;</text>
  <g font-size="11" font-family="Fira Code, monospace" fill="#23362e">
    <rect id="pp-p6" x="186" y="224" width="372" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/><text x="192" y="237">&lt;cache-store-value duration="60" /&gt;</text>
    <rect id="pp-p7" x="186" y="243" width="372" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/><text x="192" y="256">&lt;set-header name="X-Powered-By" exists-action="delete" /&gt;</text>
  </g>

  <rect x="176" y="270" width="392" height="30" rx="6" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="186" y="286" font-size="11" fill="#5f6f66" font-weight="600" font-family="Fira Code, monospace">&lt;on-error&gt;</text>
  <rect id="pp-p8" x="280" y="274" width="278" height="17" rx="3" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="286" y="287" font-size="11" font-family="Fira Code, monospace" fill="#23362e">&lt;return-response&gt; one error envelope</text>

  <line x1="580" y1="178" x2="614" y2="178" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#pp-arr)"/>
  <rect id="pp-backend" x="618" y="146" width="166" height="66" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="701" y="170" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Your API</text>
  <text id="pp-backend-sub" x="701" y="190" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">never called yet</text>

  <rect x="618" y="30" width="166" height="100" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="701" y="50" font-size="12" font-weight="600" text-anchor="middle" fill="#23362e">Request state</text>
  <g font-size="10.5" font-family="Fira Code, monospace" fill="#5f6f66">
    <text id="pp-s1" x="628" y="70">sub: (unchecked)</text>
    <text id="pp-s2" x="628" y="88">jwt: (unchecked)</text>
    <text id="pp-s3" x="628" y="106">cache: (unchecked)</text>
    <text id="pp-s4" x="628" y="124">status: &mdash;</text>
  </g>
  <text id="pp-note" class="hand hidden" x="300" y="324" font-size="16" fill="#c53b3b">your API never saw the token, the limit or the cache</text>
</svg>
