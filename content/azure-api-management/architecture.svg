<svg viewBox="0 0 800 340" role="img" aria-label="Clients call the APIM gateway, which runs a policy pipeline before forwarding to backends, with a control plane, developer portal and observability around it">
  <defs>
    <marker id="am-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>

  <g font-size="12.5" text-anchor="middle">
    <rect x="14" y="56" width="112" height="34" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="70" y="78" fill="#23362e">Mobile / SPA</text>
    <rect x="14" y="100" width="112" height="34" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="70" y="122" fill="#23362e">Partner system</text>
    <rect x="14" y="144" width="112" height="34" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="70" y="166" fill="#23362e">Internal service</text>
  </g>
  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#am-arr)">
    <line x1="126" y1="73" x2="172" y2="105"/><line x1="126" y1="117" x2="172" y2="117"/><line x1="126" y1="161" x2="172" y2="129"/>
  </g>

  <rect x="175" y="40" width="250" height="176" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="300" y="63" font-size="14" font-weight="600" text-anchor="middle" fill="#23362e">Gateway</text>
  <text x="300" y="80" font-size="11" text-anchor="middle" fill="#5f6f66">the only thing exposed publicly</text>
  <g font-size="11.5" text-anchor="middle" fill="#23362e">
    <rect x="191" y="90" width="218" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="300" y="108">inbound &mdash; auth, limits, cache lookup</text>
    <rect x="191" y="120" width="218" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="300" y="138">backend &mdash; forward, retry, breaker</text>
    <rect x="191" y="150" width="218" height="26" rx="4" fill="#fbfcf8" stroke="#d5dccf"/><text x="300" y="168">outbound &mdash; transform, cache store</text>
    <rect x="191" y="180" width="218" height="26" rx="4" fill="#fbf3c4" stroke="#d9c25a"/><text x="300" y="198">on-error &mdash; one error shape</text>
  </g>

  <line x1="425" y1="128" x2="478" y2="128" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#am-arr)"/>

  <g font-size="12" text-anchor="middle">
    <rect x="482" y="48" width="150" height="40" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="557" y="73" fill="#23362e">App Service API</text>
    <rect x="482" y="96" width="150" height="40" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="557" y="121" fill="#23362e">Azure Functions</text>
    <rect x="482" y="144" width="150" height="40" rx="6" fill="#e3eedc" stroke="#2f6b3f"/><text x="557" y="169" fill="#23362e">AKS service</text>
    <rect x="482" y="192" width="150" height="40" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/><text x="557" y="217" fill="#23362e">Legacy SOAP</text>
  </g>
  <text x="557" y="248" font-size="11" text-anchor="middle" fill="#5f6f66">private endpoints / VNet &mdash; not reachable directly</text>

  <rect x="648" y="48" width="138" height="88" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="717" y="70" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Control plane</text>
  <text x="717" y="90" font-size="11" text-anchor="middle" fill="#5f6f66">Bicep / Terraform</text>
  <text x="717" y="107" font-size="11" text-anchor="middle" fill="#5f6f66">APIOps pipeline</text>
  <text x="717" y="124" font-size="11" text-anchor="middle" fill="#5f6f66">portal (last resort)</text>

  <rect x="648" y="146" width="138" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="717" y="168" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Developer portal</text>
  <text x="717" y="188" font-size="11" text-anchor="middle" fill="#5f6f66">docs + try-it console</text>
  <text x="717" y="205" font-size="11" text-anchor="middle" fill="#5f6f66">self-service sign-up</text>
  <text x="717" y="222" font-size="11" text-anchor="middle" fill="#5f6f66">subscription keys</text>

  <rect x="175" y="252" width="457" height="52" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="403" y="274" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">Products, subscriptions and quotas</text>
  <text x="403" y="294" font-size="11" text-anchor="middle" fill="#5f6f66">Free: 1,000 calls/month &middot; Pro: 1,000,000 &middot; Partner: unlimited + IP allow-list</text>
  <path d="M300 216 L300 248" stroke="#5f6f66" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#am-arr)"/>

  <text class="hand" x="14" y="212" font-size="16" fill="#c53b3b">if it isn't business logic,</text>
  <text class="hand" x="14" y="232" font-size="16" fill="#c53b3b">it probably belongs here</text>
</svg>
