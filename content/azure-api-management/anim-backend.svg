<svg viewBox="0 0 800 300" role="img" aria-label="Animated backend pool where one backend trips its circuit breaker and traffic shifts to the others">
  <defs>
    <marker id="bp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="bp-gw" x="24" y="110" width="150" height="90" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="99" y="138" font-size="13" font-weight="600" text-anchor="middle" fill="#23362e">Gateway</text>
  <text x="99" y="158" font-size="11" text-anchor="middle" fill="#5f6f66">backend pool</text>
  <text id="bp-gw-sub" x="99" y="178" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">1,000 req/s in</text>

  <g stroke="#a9b5a6" stroke-width="1.5" fill="none" marker-end="url(#bp-arr)">
    <line id="bp-l1" x1="174" y1="140" x2="316" y2="68"/>
    <line id="bp-l2" x1="174" y1="155" x2="316" y2="152"/>
    <line id="bp-l3" x1="174" y1="175" x2="316" y2="238"/>
  </g>
  <text id="bp-f1" x="248" y="94" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">500 /s</text>
  <text id="bp-f2" x="248" y="168" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">500 /s</text>
  <text id="bp-f3" x="248" y="226" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">0 /s</text>

  <rect id="bp-a" x="320" y="36" width="250" height="66" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="445" y="58" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">backend-a &middot; priority 1, weight 50</text>
  <text id="bp-a-t" x="445" y="78" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">healthy &middot; p99 40 ms</text>
  <text id="bp-a-b" x="445" y="94" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">breaker: closed</text>

  <rect id="bp-b" x="320" y="118" width="250" height="66" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="445" y="140" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">backend-b &middot; priority 1, weight 50</text>
  <text id="bp-b-t" x="445" y="160" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">healthy &middot; p99 38 ms</text>
  <text id="bp-b-b" x="445" y="176" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">breaker: closed</text>

  <rect id="bp-c" x="320" y="200" width="250" height="66" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="445" y="222" font-size="12.5" font-weight="600" text-anchor="middle" fill="#23362e">backend-c &middot; priority 2 (fallback)</text>
  <text id="bp-c-t" x="445" y="242" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">idle &mdash; lower priority</text>
  <text id="bp-c-b" x="445" y="258" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">breaker: closed</text>

  <rect x="596" y="86" width="188" height="118" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="690" y="108" font-size="12" font-weight="600" text-anchor="middle" fill="#23362e">Breaker rule</text>
  <g font-size="10.5" font-family="Fira Code, monospace" fill="#5f6f66">
    <text x="606" y="128">failureCount: 5</text>
    <text x="606" y="146">interval: 30 s</text>
    <text x="606" y="164">statusCode: 5xx</text>
    <text x="606" y="182">tripDuration: 60 s</text>
  </g>
  <text id="bp-state" x="690" y="224" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">all backends serving</text>
  <text id="bp-note" class="hand hidden" x="180" y="290" font-size="16" fill="#c53b3b">the breaker is per gateway unit &mdash; scale out and each one learns separately</text>
</svg>
