<svg viewBox="0 0 560 190" role="img" aria-label="Nested policy scopes from global through product and API to operation">
  <rect x="8" y="12" width="544" height="168" rx="8" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="20" y="32" font-size="12" font-weight="600" fill="#c53b3b" font-family="Fira Code, monospace">All APIs (global)</text>
  <text x="20" y="48" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">cors &middot; set-header X-Correlation-Id &middot; global rate-limit</text>
  <rect x="26" y="56" width="508" height="116" rx="7" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="38" y="76" font-size="12" font-weight="600" fill="#c53b3b" font-family="Fira Code, monospace">Product: Pro</text>
  <text x="38" y="92" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">quota 1,000,000 / month &middot; rate-limit 600 / min</text>
  <rect x="44" y="100" width="472" height="64" rx="6" fill="#fbf3c4" stroke="#d9c25a"/>
  <text x="56" y="119" font-size="12" font-weight="600" fill="#8a6a0c" font-family="Fira Code, monospace">API: Orders</text>
  <text x="56" y="134" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">validate-jwt &middot; set-backend-service</text>
  <rect x="62" y="140" width="436" height="18" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="72" y="153" font-size="10.5" fill="#2f6b3f" font-family="Fira Code, monospace">Operation GET /orders/{id}: cache-lookup &middot; timeout 5s</text>
</svg>
