<svg viewBox="0 0 560 240" role="img" aria-label="Animated revision workflow from creation through private testing to becoming current">
  <text x="12" y="24" font-size="12" font-weight="600" fill="#23362e" font-family="Fira Code, monospace">API: Orders &mdash; https://contoso.azure-api.net/orders</text>
  <rect id="rv-r1" x="12" y="40" width="256" height="62" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="140" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">Revision 1</text>
  <text id="rv-r1-t" x="140" y="82" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">CURRENT &middot; 1,000 req/s</text>
  <rect id="rv-r2" class="hidden" x="292" y="40" width="256" height="62" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text id="rv-r2-h" class="hidden" x="420" y="62" font-size="12" text-anchor="middle" fill="#23362e" font-weight="600">Revision 2</text>
  <text id="rv-r2-t" class="hidden" x="420" y="82" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">draft &middot; 0 req/s</text>
  <text id="rv-url1" x="12" y="128" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">clients call /orders &rarr; revision 1</text>
  <text id="rv-url2" class="hidden" x="12" y="150" font-size="11" fill="#c53b3b" font-family="Fira Code, monospace">you call /orders;rev=2 &rarr; revision 2 only</text>
  <text id="rv-log" class="hidden" x="12" y="186" font-size="11" fill="#2f6b3f" font-family="Fira Code, monospace">change log: "added ?include=lines, no breaking change"</text>
  <text id="rv-note" class="hand hidden" x="12" y="224" font-size="15" fill="#c53b3b">breaking change? That's a version, not a revision.</text>
</svg>
