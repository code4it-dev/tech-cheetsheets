title: RAG
slug: rag
tagline: The model does not know your data. RAG is the machinery that puts the right paragraph in front of it, just in time.
asof: Nov 2026 · examples use Microsoft.Extensions.AI, pgvector and Azure AI Search
description: "RAG cheatsheet: chunking, embeddings, hybrid retrieval, reranking and prompt assembly — why retrieval quality, not the model, decides whether the answer is right."
