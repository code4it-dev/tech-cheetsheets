<svg viewBox="0 0 800 318" role="img" aria-label="A deeply nested cyclic GraphQL query multiplying into millions of field resolutions, and the defences that stop it">
  <text id="gd-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the schema has a cycle: a user has posts, a post has an author, an author has posts…</text>

  <rect id="gd-q" x="16" y="40" width="420" height="170" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gd-g1" x="30" y="64" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
