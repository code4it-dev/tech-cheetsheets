  <text id="gd-g3" x="30" y="104" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gd-g4" x="30" y="124" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gd-g5" x="30" y="144" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gd-g6" x="30" y="164" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gd-g7" x="30" y="184" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gd-g8" x="30" y="202" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="gd-meter" x="452" y="40" width="332" height="90" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gd-mt" x="466" y="62" font-size="10.5" fill="#23362e" font-weight="700">what the server agreed to</text>
  <text id="gd-m1" x="466" y="84" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">depth:  —</text>
  <text id="gd-m2" x="466" y="104" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">fields: —</text>
  <text id="gd-m3" x="466" y="122" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="gd-def" x="452" y="140" width="332" height="130" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gd-dt" x="466" y="162" font-size="10.5" fill="#23362e" font-weight="700">defences, in the order they fire</text>
  <text id="gd-d1" x="466" y="184" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gd-d2" x="466" y="204" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gd-d3" x="466" y="224" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gd-d4" x="466" y="244" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gd-d5" x="466" y="262" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="gd-note" x="16" y="222" width="420" height="48" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gd-n1" x="30" y="242" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gd-n2" x="30" y="260" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="gd-verd" x="16" y="282" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gd-v" x="400" y="301" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">in REST the server chooses the work. in GraphQL the client does — unless you take it back.</text>
</svg>
