<svg viewBox="0 0 800 352" role="img" aria-label="GraphQL architecture: clients sending queries to one endpoint, parsed and validated against a schema, executed field by field through resolvers backed by several data sources">
  <defs>
    <marker id="ga-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one endpoint, one schema, and a response shaped exactly like the request</text>

  <rect x="16" y="40" width="150" height="146" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="91" y="62" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">clients</text>
  <text x="91" y="84" font-size="9.5" text-anchor="middle" fill="#5f6f66">web asks for 12 fields</text>
  <text x="91" y="104" font-size="9.5" text-anchor="middle" fill="#5f6f66">mobile asks for 4</text>
  <text x="91" y="124" font-size="9.5" text-anchor="middle" fill="#5f6f66">watch asks for 1</text>
  <text x="91" y="150" font-size="9.5" text-anchor="middle" fill="#2f6b3f">no new endpoint</text>
  <text x="91" y="168" font-size="9.5" text-anchor="middle" fill="#2f6b3f">for any of them</text>

  <line x1="170" y1="110" x2="192" y2="110" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ga-arr)"/>
  <text x="181" y="100" font-size="9" text-anchor="middle" fill="#5f6f66">POST /graphql</text>

  <rect x="196" y="40" width="372" height="236" rx="8" fill="#fbfcf8" stroke="#2f6b3f" stroke-width="2"/>
  <text x="382" y="62" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the GraphQL server</text>

  <rect x="210" y="74" width="344" height="34" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="382" y="95" font-size="9.5" text-anchor="middle" fill="#23362e">parse &rarr; validate against the schema &rarr; (cost check)</text>

  <rect x="210" y="116" width="344" height="52" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="382" y="136" font-size="10" text-anchor="middle" fill="#23362e" font-weight="700">execute, field by field</text>
  <text x="382" y="154" font-size="9" text-anchor="middle" fill="#5f6f66">one resolver per field · siblings in parallel · children after parents</text>

  <rect x="210" y="176" width="344" height="40" rx="5" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="382" y="194" font-size="9.5" text-anchor="middle" fill="#23362e" font-weight="600">DataLoader &mdash; batch + dedupe per request</text>
  <text x="382" y="210" font-size="9" text-anchor="middle" fill="#c53b3b">without this layer, every list is an N+1</text>

  <rect x="210" y="224" width="344" height="38" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="382" y="248" font-size="9.5" text-anchor="middle" fill="#23362e">assemble &rarr; <tspan font-family="Fira Code, monospace">{ "data": {…}, "errors": [...] }</tspan> &mdash; HTTP 200</text>

  <line x1="572" y1="150" x2="594" y2="150" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#ga-arr)"/>

  <rect x="598" y="74" width="186" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="691" y="99" font-size="9.5" text-anchor="middle" fill="#23362e">Postgres</text>
  <rect x="598" y="122" width="186" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="691" y="147" font-size="9.5" text-anchor="middle" fill="#23362e">internal REST services</text>
  <rect x="598" y="170" width="186" height="40" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="691" y="195" font-size="9.5" text-anchor="middle" fill="#23362e">search · cache · queues</text>
  <rect x="598" y="218" width="186" height="44" rx="6" fill="#e8ece2" stroke="#a9b5a6"/>
  <text x="691" y="240" font-size="9.5" text-anchor="middle" fill="#5f6f66">the graph is a facade;</text>
  <text x="691" y="256" font-size="9.5" text-anchor="middle" fill="#5f6f66">nothing behind it changed</text>

  <text class="hand" x="400" y="306" fill="#c53b3b" font-size="16" text-anchor="middle">the client stopped guessing which endpoint to call. the server started guessing how much work it just agreed to.</text>
  <text x="400" y="336" font-size="11" text-anchor="middle" fill="#5f6f66">every GraphQL problem in production is a version of that second sentence</text>
</svg>
