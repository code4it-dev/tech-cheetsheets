<svg viewBox="0 0 800 332" role="img" aria-label="A GraphQL query executing field by field, producing one database query per user, then the same query batched by a DataLoader">
  <defs>
    <marker id="gq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="gq-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">three lines of query, and the number of database round trips they imply</text>

  <rect id="gq-query" x="16" y="40" width="250" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="30" y="60" font-size="10.5" fill="#23362e" font-weight="700">the query</text>
  <text id="gq-q1" x="30" y="80" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">{</text>
  <text id="gq-q2" x="30" y="96" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">  users(first: 3) {</text>
  <text id="gq-q3" x="30" y="112" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">    name</text>
  <text id="gq-q4" x="30" y="128" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">    posts(first: 2) {</text>
  <text id="gq-q5" x="30" y="144" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">      title</text>
  <text id="gq-q6" x="30" y="160" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">    }</text>
  <text id="gq-q7" x="30" y="176" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">  }</text>
  <text id="gq-q8" x="160" y="176" font-size="9" fill="#5f6f66" font-family="Fira Code, monospace">}</text>

  <rect id="gq-n0" x="290" y="46" width="100" height="28" rx="5" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gq-n0t" x="340" y="65" font-size="9.5" text-anchor="middle" fill="#23362e">Query</text>
  <rect id="gq-n1" x="290" y="84" width="100" height="28" rx="5" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gq-n1t" x="340" y="103" font-size="9.5" text-anchor="middle" fill="#23362e">users</text>

  <rect id="gq-u1" x="420" y="84" width="90" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="gq-u1t" x="465" y="101" font-size="9" text-anchor="middle" fill="#23362e">User 1</text>
  <rect id="gq-u2" x="420" y="118" width="90" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="gq-u2t" x="465" y="135" font-size="9" text-anchor="middle" fill="#23362e">User 2</text>
  <rect id="gq-u3" x="420" y="152" width="90" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="gq-u3t" x="465" y="169" font-size="9" text-anchor="middle" fill="#23362e">User 3</text>

  <rect id="gq-p1" x="528" y="84" width="104" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="gq-p1t" x="580" y="101" font-size="9" text-anchor="middle" fill="#5f6f66">posts</text>
  <rect id="gq-p2" x="528" y="118" width="104" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="gq-p2t" x="580" y="135" font-size="9" text-anchor="middle" fill="#5f6f66">posts</text>
  <rect id="gq-p3" x="528" y="152" width="104" height="26" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
  <text id="gq-p3t" x="580" y="169" font-size="9" text-anchor="middle" fill="#5f6f66">posts</text>

  <line x1="340" y1="78" x2="340" y2="82" stroke="#5f6f66" stroke-width="1.5"/>
  <line x1="394" y1="97" x2="414" y2="97" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gq-arr)"/>
  <line x1="514" y1="97" x2="522" y2="97" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gq-arr)"/>
  <line x1="514" y1="131" x2="522" y2="131" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gq-arr)"/>
  <line x1="514" y1="165" x2="522" y2="165" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gq-arr)"/>

  <rect id="gq-db" x="646" y="40" width="138" height="150" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="715" y="62" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">database</text>
  <text id="gq-d1" x="715" y="86" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gq-d2" x="715" y="104" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gq-d3" x="715" y="122" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gq-d4" x="715" y="140" font-size="9" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gq-d5" x="715" y="164" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">0 queries</text>
  <text id="gq-d6" x="715" y="182" font-size="9" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="gq-log" x="16" y="200" width="768" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gq-l1" x="30" y="222" font-size="10.5" fill="#23362e" font-weight="700">&nbsp;</text>
  <text id="gq-l2" x="30" y="242" font-size="10" fill="#5f6f66">&nbsp;</text>
  <text id="gq-l3" x="30" y="262" font-size="10" fill="#5f6f66">&nbsp;</text>
  <text id="gq-l4" x="30" y="280" font-size="10" fill="#5f6f66">&nbsp;</text>

  <rect id="gq-verd" x="16" y="296" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gq-v" x="400" y="315" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">resolvers are called per object, not per query — which is the whole problem and the whole design</text>
</svg>
