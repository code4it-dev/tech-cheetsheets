<svg viewBox="0 0 800 340" role="img" aria-label="The closed, open and half-open states of a circuit breaker with the transitions between them, and a bulkhead bounding concurrency per dependency">
  <defs>
    <marker id="cb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="cb-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
    <marker id="cb-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3f"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">three states, and the only interesting one is the one in the middle of recovering</text>

  <rect x="20" y="48" width="220" height="104" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="130" y="72" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">CLOSED</text>
  <text x="130" y="94" font-size="10.5" text-anchor="middle" fill="#5f6f66">calls pass through normally</text>
  <text x="130" y="112" font-size="10.5" text-anchor="middle" fill="#5f6f66">outcomes counted in a window</text>
  <text x="130" y="134" font-size="10.5" text-anchor="middle" fill="#2f6b3f">the healthy steady state</text>

  <path d="M244 84 L286 84" fill="none" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#cb-red)"/>
  <text x="265" y="76" font-size="9.5" text-anchor="middle" fill="#c53b3b">trip</text>

  <rect x="290" y="48" width="220" height="104" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="2"/>
  <text x="400" y="72" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">OPEN</text>
  <text x="400" y="94" font-size="10.5" text-anchor="middle" fill="#5f6f66">every call fails instantly</text>
  <text x="400" y="112" font-size="10.5" text-anchor="middle" fill="#5f6f66">the dependency is not touched</text>
  <text x="400" y="134" font-size="10.5" text-anchor="middle" fill="#c53b3b">~1 ms instead of a 2 s timeout</text>

  <path d="M514 84 L556 84" fill="none" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#cb-arr)"/>
  <text x="535" y="76" font-size="9.5" text-anchor="middle" fill="#5f6f66">after 30 s</text>

  <rect x="560" y="48" width="220" height="104" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="670" y="72" font-size="13" text-anchor="middle" fill="#23362e" font-weight="700">HALF-OPEN</text>
  <text x="670" y="94" font-size="10.5" text-anchor="middle" fill="#5f6f66">a few trial calls allowed</text>
  <text x="670" y="112" font-size="10.5" text-anchor="middle" fill="#5f6f66">everything else still fails fast</text>
  <text x="670" y="134" font-size="10.5" text-anchor="middle" fill="#23362e">the probe limit is the whole trick</text>

  <path d="M670 156 L670 176 L130 176 L130 156" fill="none" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#cb-grn)"/>
  <text x="400" y="172" font-size="10" text-anchor="middle" fill="#2f6b3f">probes succeed &rarr; close, reset the counters</text>

  <path d="M700 156 L700 196 L400 196 L400 156" fill="none" stroke="#c53b3b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#cb-red)"/>
  <text x="548" y="192" font-size="10" text-anchor="middle" fill="#c53b3b">a probe fails &rarr; open again, usually for longer</text>

  <rect x="20" y="218" width="372" height="102" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="206" y="240" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">what trips it</text>
  <text x="36" y="262" font-size="10.5" fill="#5f6f66">failure rate over a rolling window &nbsp;&mdash;&nbsp; e.g. &gt; 50% of 20 calls</text>
  <text x="36" y="280" font-size="10.5" fill="#5f6f66">minimum throughput first, so 1 of 2 cannot trip it</text>
  <text x="36" y="298" font-size="10.5" fill="#5f6f66">slow calls count as failures &mdash; slow <em>is</em> broken</text>
  <text x="36" y="314" font-size="10.5" fill="#c53b3b">a 404 is not a failure; a timeout is</text>

  <rect x="408" y="218" width="372" height="102" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="594" y="240" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">bulkhead &mdash; the other half</text>
  <text x="424" y="262" font-size="10.5" fill="#5f6f66">one bounded pool per dependency, so a slow one</text>
  <text x="424" y="280" font-size="10.5" fill="#5f6f66">cannot occupy every worker you own</text>
  <rect x="424" y="290" width="104" height="18" rx="3" fill="#f9e3df" stroke="#e6b3ad"/>
  <text x="476" y="303" font-size="9.5" text-anchor="middle" fill="#c53b3b">payments: 5</text>
  <rect x="534" y="290" width="104" height="18" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="586" y="303" font-size="9.5" text-anchor="middle" fill="#2f6b3f">catalogue: 10</text>
  <rect x="644" y="290" width="104" height="18" rx="3" fill="#e3eedc" stroke="#2f6b3f"/>
  <text x="696" y="303" font-size="9.5" text-anchor="middle" fill="#2f6b3f">search: 5</text>
</svg>
