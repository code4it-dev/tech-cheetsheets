<svg viewBox="0 0 800 320" role="img" aria-label="A circuit breaker counting failures, tripping open, failing fast, probing in half-open and closing again">
  <text id="cs-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">threshold: more than 50% failures over a rolling window of 20 calls</text>

  <rect id="cs-closed" x="20" y="44" width="230" height="74" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="135" y="68" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">CLOSED</text>
  <text id="cs-ct" x="135" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">calls passing through</text>
  <text id="cs-ct2" x="135" y="108" font-size="10.5" text-anchor="middle" fill="#2f6b3f">current state</text>

  <rect id="cs-open" x="285" y="44" width="230" height="74" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="68" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">OPEN</text>
  <text id="cs-ot" x="400" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">&mdash;</text>
  <text id="cs-ot2" x="400" y="108" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <rect id="cs-half" x="550" y="44" width="230" height="74" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="665" y="68" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">HALF-OPEN</text>
  <text id="cs-ht" x="665" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">&mdash;</text>
  <text id="cs-ht2" x="665" y="108" font-size="10.5" text-anchor="middle" fill="#5f6f66">&nbsp;</text>

  <text x="20" y="148" font-size="11" fill="#5f6f66">recent calls &mdash; oldest on the left</text>
  <g>
    <rect id="cs-c1" x="20" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c2" x="72" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c3" x="124" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c4" x="176" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c5" x="228" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c6" x="280" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c7" x="332" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c8" x="384" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c9" x="436" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
    <rect id="cs-c10" x="488" y="158" width="46" height="34" rx="4" fill="#e3eedc" stroke="#2f6b3f"/>
  </g>
  <text id="cs-rate" x="556" y="180" font-size="12" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">failures: 0%</text>

  <rect id="cs-panel" x="20" y="212" width="760" height="54" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="cs-cost" x="36" y="234" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">call latency: 20 ms</text>
  <text id="cs-dep" x="330" y="234" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">dependency load: normal</text>
  <text id="cs-timer" x="610" y="234" font-size="11" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="cs-note" x="36" y="256" font-size="10.5" fill="#5f6f66">everything healthy</text>

  <rect id="cs-verd" x="20" y="278" width="760" height="34" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text id="cs-v" x="400" y="300" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="700">closed and quiet &mdash; the breaker is just counting</text>
</svg>
