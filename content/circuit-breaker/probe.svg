<svg viewBox="0 0 560 200" role="img" aria-label="A recovering service hit by full traffic when the breaker closes, versus a limited number of trial calls in half-open">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">the cooldown has just ended &mdash; what happens next decides everything</text>
  <rect id="pb-br" x="30" y="48" width="180" height="56" rx="6" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="120" y="70" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">breaker</text>
  <text id="pb-brt" x="120" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">OPEN · 1,000 / s fast-failed</text>
  <rect id="pb-svc" x="330" y="48" width="200" height="56" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="430" y="70" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="600">recovering service</text>
  <text id="pb-svct" x="430" y="90" font-size="10.5" text-anchor="middle" fill="#5f6f66">receiving 0 / s · draining</text>
  <text id="pb-flow" x="270" y="82" font-size="11" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">0 / s</text>
  <text id="pb-msg" x="280" y="142" font-size="11.5" text-anchor="middle" fill="#5f6f66">it has had thirty seconds of quiet</text>
  <text id="pb-msg2" x="280" y="166" font-size="10.5" text-anchor="middle" fill="#5f6f66">and it is nearly, but not quite, ready</text>
</svg>
