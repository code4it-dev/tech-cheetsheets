<svg viewBox="0 0 800 346" role="img" aria-label="The three segments of a JWT, what each contains, and the order of the validation checks">
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">three Base64URL segments, two dots &mdash; and only the third one makes the others trustworthy</text>

  <rect x="20" y="40" width="190" height="34" rx="5" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="115" y="62" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">eyJhbGciOiJSUzI1…</text>
  <text x="216" y="62" font-size="14" fill="#5f6f66" font-weight="700">.</text>
  <rect x="226" y="40" width="330" height="34" rx="5" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="391" y="62" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">eyJzdWIiOiIyNDgyODk3NjEwMDEiLCJhdWQ…</text>
  <text x="562" y="62" font-size="14" fill="#5f6f66" font-weight="700">.</text>
  <rect x="572" y="40" width="208" height="34" rx="5" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="676" y="62" font-size="10.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">SflKxwRJSMeKKF2QT4…</text>

  <rect x="20" y="88" width="190" height="96" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="115" y="108" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">header</text>
  <text x="34" y="130" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">"alg": "RS256"</text>
  <text x="34" y="148" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">"kid": "a1b2c3"</text>
  <text x="34" y="166" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">"typ": "JWT"</text>
  <text x="34" y="180" font-size="9.5" fill="#c53b3b">never trust alg</text>

  <rect x="226" y="88" width="330" height="96" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="391" y="108" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">payload &mdash; readable by anyone</text>
  <text x="240" y="130" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">"iss": "https://login.example.com"</text>
  <text x="240" y="148" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">"sub": "248289761001"   "aud": "api://orders"</text>
  <text x="240" y="166" font-size="10" fill="#5f6f66" font-family="Fira Code, monospace">"exp": 1763640000       "scope": "orders.read"</text>
  <text x="240" y="180" font-size="9.5" fill="#c53b3b">base64, not encryption &mdash; put no secrets here</text>

  <rect x="572" y="88" width="208" height="96" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="676" y="108" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">signature</text>
  <text x="676" y="130" font-size="10" text-anchor="middle" fill="#5f6f66">over header + payload</text>
  <text x="676" y="148" font-size="10" text-anchor="middle" fill="#5f6f66">private key signs,</text>
  <text x="676" y="166" font-size="10" text-anchor="middle" fill="#5f6f66">public key verifies</text>
  <text x="676" y="180" font-size="9.5" text-anchor="middle" fill="#2f6b3f">the only thing stopping edits</text>

  <rect x="20" y="200" width="760" height="94" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="400" y="222" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">validate in this order &mdash; every one of these has been skipped in production</text>
  <text x="40" y="246" font-size="10.5" fill="#5f6f66">1 &middot; signature, with <em>your</em> pinned algorithm list</text>
  <text x="40" y="266" font-size="10.5" fill="#5f6f66">2 &middot; <tspan font-family="Fira Code, monospace">iss</tspan> &mdash; exactly the issuer you expect</text>
  <text x="40" y="286" font-size="10.5" fill="#5f6f66">3 &middot; <tspan font-family="Fira Code, monospace">aud</tspan> &mdash; minted for <em>this</em> service</text>
  <text x="420" y="246" font-size="10.5" fill="#5f6f66">4 &middot; <tspan font-family="Fira Code, monospace">exp</tspan> / <tspan font-family="Fira Code, monospace">nbf</tspan> &mdash; with a small skew allowance</text>
  <text x="420" y="266" font-size="10.5" fill="#5f6f66">5 &middot; <tspan font-family="Fira Code, monospace">scope</tspan> / <tspan font-family="Fira Code, monospace">roles</tspan> &mdash; may it do this?</text>
  <text x="420" y="286" font-size="10.5" fill="#5f6f66">6 &middot; your own rules &mdash; may <em>this user</em> touch <em>this record</em>?</text>

  <text class="hand" x="20" y="326" font-size="16" fill="#c53b3b">nothing in a JWT says "still valid" &mdash; it only says "not yet expired"</text>
</svg>
