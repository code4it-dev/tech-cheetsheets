<svg viewBox="0 0 800 320" role="img" aria-label="An attacker forging a token using alg none and algorithm confusion, defeated by pinning the algorithm">
  <text id="jg-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">the API verifies RS256: the issuer signs with a private key, everyone verifies with the public one</text>

  <rect id="jg-keys" x="20" y="40" width="360" height="76" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="200" y="62" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the keys</text>
  <text id="jg-k1" x="36" y="84" font-size="10.5" fill="#5f6f66">private key &mdash; issuer only, signs tokens</text>
  <text id="jg-k2" x="36" y="104" font-size="10.5" fill="#c53b3b">public key &mdash; published at /jwks, anyone can fetch it</text>

  <rect id="jg-api" x="420" y="40" width="360" height="76" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="600" y="62" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the API's verifier</text>
  <text id="jg-cfg" x="436" y="84" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">algorithm: taken from the token header</text>
  <text id="jg-cfg2" x="436" y="104" font-size="10.5" fill="#5f6f66">"whatever it says it is, that's what we check"</text>

  <rect id="jg-tok" x="20" y="140" width="760" height="76" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="400" y="162" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">the token the attacker sends</text>
  <text id="jg-t1" x="36" y="184" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">header:  { "alg": "RS256", "kid": "a1b2c3" }</text>
  <text id="jg-t2" x="36" y="204" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">payload: { "sub": "ada", "role": "user" }</text>
  <text id="jg-t3" x="440" y="184" font-size="10.5" fill="#5f6f66" font-family="Fira Code, monospace">signature: valid, from the issuer</text>
  <text id="jg-t4" x="440" y="204" font-size="10.5" fill="#5f6f66">a perfectly ordinary token</text>

  <rect id="jg-verd" x="20" y="238" width="760" height="64" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="jg-v" x="400" y="262" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">the attacker wants role: admin — and cannot sign RS256</text>
  <text id="jg-v2" x="400" y="284" font-size="10.5" text-anchor="middle" fill="#5f6f66">they have the public key, the token, and the header is theirs to edit</text>
</svg>
