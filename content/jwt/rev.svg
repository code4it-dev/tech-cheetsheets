<svg viewBox="0 0 560 200" role="img" aria-label="A token remaining valid after the user is deactivated, until it expires">
  <text x="280" y="24" font-size="11.5" text-anchor="middle" fill="#5f6f66">nothing you do server-side reaches an already-issued token</text>
  <line x1="40" y1="110" x2="520" y2="110" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="40" y="132" font-size="10" text-anchor="middle" fill="#5f6f66">10:00</text>
  <text x="200" y="132" font-size="10" text-anchor="middle" fill="#5f6f66">10:05</text>
  <text x="520" y="132" font-size="10" text-anchor="middle" fill="#5f6f66">10:15</text>
  <g id="rv-iss"><circle cx="40" cy="110" r="5" fill="#2f6b3f"/><text x="40" y="96" font-size="10" text-anchor="middle" fill="#2f6b3f">issued</text></g>
  <g id="rv-rev" class="hidden"><circle cx="200" cy="110" r="5" fill="#c53b3b"/><text x="200" y="96" font-size="10" text-anchor="middle" fill="#c53b3b">user deactivated</text></g>
  <g id="rv-exp" class="hidden"><circle cx="520" cy="110" r="5" fill="#5f6f66"/><text x="520" y="96" font-size="10" text-anchor="middle" fill="#5f6f66">exp</text></g>
  <rect id="rv-gap" class="hidden" x="200" y="146" width="320" height="22" rx="4" fill="#f9e3df" stroke="#e6b3ad"/>
  <text id="rv-gapt" class="hidden" x="360" y="161" font-size="10" text-anchor="middle" fill="#c53b3b" font-weight="600">still accepted everywhere</text>
  <text id="rv-msg" x="280" y="186" font-size="11" text-anchor="middle" fill="#5f6f66">a token is a bearer credential with a fixed end date</text>
</svg>
