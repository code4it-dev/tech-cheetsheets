  heading: Essential code patterns
  tocLabel: Code patterns
  groups:
    - group: The table
      items:
        - lang: sql
          code: |-
            CREATE TABLE outbox (
                id            bigserial PRIMARY KEY,       -- publication order
                message_id    uuid        NOT NULL UNIQUE, -- consumer dedup key
                aggregate_id  uuid        NOT NULL,        -- partition key
                type          text        NOT NULL,
                payload       jsonb       NOT NULL,
                occurred_at   timestamptz NOT NULL DEFAULT now(),
                sent_at       timestamptz,
                attempts      int         NOT NULL DEFAULT 0
            );

            CREATE INDEX ix_outbox_unsent ON outbox (id) WHERE sent_at IS NULL;
          what: A partial index on unsent rows keeps the relay's query fast even when the table holds millions of published rows.
        - lang: sql
          code: |-
            BEGIN;
              INSERT INTO orders (id, customer_id, total) VALUES (...);
              INSERT INTO outbox (message_id, aggregate_id, type, payload)
                   VALUES (gen_random_uuid(), $order_id, 'OrderPlaced', $payload);
            COMMIT;        -- both rows, or neither. no broker involved.
          what: "The entire pattern in four lines: the message becomes data, committed atomically with the state it describes."
    - group: The relay
      items:
        - lang: sql
          code: |-
            BEGIN;
            SELECT id, message_id, aggregate_id, type, payload
            FROM   outbox
            WHERE  sent_at IS NULL
            ORDER  BY id
            LIMIT  100
            FOR UPDATE SKIP LOCKED;     -- lets several relay instances run safely
            -- publish each row, then:
            UPDATE outbox SET sent_at = now() WHERE id = ANY($ids);
            COMMIT;
          what: Publish first, mark second. A crash in between republishes — at-least-once, which is the guarantee you want.
        - code: |-
            -- wake the relay immediately instead of waiting for the next poll
            NOTIFY outbox_new;
            -- relay: LISTEN outbox_new, and keep a 1s poll as a safety net
          what: Removes polling latency without removing the poll — the poll is what recovers after a missed notification.
        - lang: sql
          code: |-
            -- the metric that matters
            SELECT now() - min(occurred_at) AS oldest_unsent
            FROM   outbox WHERE sent_at IS NULL;
          what: Alert on the age of the oldest unsent row. Everything else can look healthy while nothing is being delivered.
        - lang: sql
          code: |-
            -- retention: delete published rows in small batches
            DELETE FROM outbox
            WHERE id IN (SELECT id FROM outbox
                         WHERE sent_at < now() - interval '7 days' LIMIT 10000);
          what: Or partition the outbox by day and drop partitions — instant, and no vacuum debt.
    - group: C#
      items:
        - lang: csharp
          code: |-
            public async Task Handle(PlaceOrder cmd, CancellationToken ct)
            {
                var order = Order.Place(cmd.CartId, cmd.CustomerId);
                db.Orders.Add(order);

                foreach (var e in order.ReleaseEvents())
                    db.Outbox.Add(new OutboxRow {
                        MessageId   = Guid.CreateVersion7(),
                        AggregateId = order.Id,
                        Type        = e.GetType().Name,
                        Payload     = JsonSerializer.Serialize(e),
                    });

                await db.SaveChangesAsync(ct);   // ONE transaction — no broker call here
            }
          what: The handler never touches the broker. An EF Core SaveChanges interceptor can add the outbox rows automatically so nobody can forget.
    - group: "Consumer side: the inbox"
      items:
        - lang: sql
          code: |-
            CREATE TABLE inbox (
                message_id   uuid PRIMARY KEY,
                processed_at timestamptz NOT NULL DEFAULT now()
            );
          what: "One column does the work: the primary key is the deduplication."
        - lang: python
          code: |-
            def handle(msg, conn):
                with conn.transaction():
                    inserted = conn.execute(
                        "INSERT INTO inbox (message_id) VALUES (%s) ON CONFLICT DO NOTHING",
                        (msg.message_id,),
                    ).rowcount
                    if not inserted:
                        return                      # already processed — ack and move on
                    create_shipment(conn, msg)      # same transaction as the dedup marker
          what: Dedup marker and business change commit together, which turns at-least-once delivery into exactly-once processing.
    - group: "No relay at all: CDC"
      items:
        - code: |-
            {
              "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
              "table.include.list": "public.outbox",
              "transforms": "outbox",
              "transforms.outbox.type":
                  "io.debezium.transforms.outbox.EventRouter",
              "transforms.outbox.route.by.field": "type",
              "transforms.outbox.table.field.event.key": "aggregate_id"
            }
          what: Debezium's outbox event router tails the WAL, unwraps each row into a proper event and keys it by aggregate — no polling, millisecond latency, no relay code.
prosCons:
  good:
    heading: Pros
    items:
      - No event is ever lost and no event is ever published for work that rolled back.
      - Uses only a local transaction — no distributed protocol, no 2PC, no new guarantees from the broker.
      - The service keeps working when the broker is down; messages drain when it returns.
      - The broker call leaves the request path, so latency and tail latency improve.
      - Works with any broker and any database that has transactions.
      - The outbox doubles as an audit trail and a replay source while rows are retained.
  bad:
    heading: Cons
    items:
      - Delivery becomes at-least-once, so every consumer must be idempotent — including ones other teams own.
      - "Another moving part to run, monitor and alert on: the relay and its lag."
      - Publication latency grows by the poll interval unless you use CDC or notifications.
      - The table grows fast and needs real retention, or it becomes your largest table.
      - Strict ordering needs care once more than one relay instance runs.
      - Does not help across two databases — that is a saga, not an outbox.
when:
  note: if a commit and a publish appear in the same method, you already need this
  good:
    heading: Use it when…
    items:
      - A state change in your database must reliably result in a message to someone else.
      - Losing an event would cause real, hard-to-detect inconsistency — money, stock, shipments.
      - You want to stay available when the broker is not.
      - You are feeding a read model or a projection that must not miss anything.
      - You already have a transactional database next to the thing emitting events.
  bad:
    heading: Avoid it when…
    items:
      - Losing the occasional message is genuinely fine — metrics, analytics pings. Use **fire-and-forget publishing**.
      - The service has no database. Use **the broker as the system of record**, or an idempotent retry from the caller.
      - You are event-sourced already. Use **the event store as the outbox**; a second copy adds nothing.
      - The work spans two services' databases and must be undone on failure. Use **a saga with compensating actions**.
      - Consumers genuinely cannot be made idempotent and duplicates are unacceptable. Use **a broker with transactional producers** within one cluster, and accept the narrower scope.
useCases:
  - title: Orders that never reached shipping
    body: A handful of orders a week are paid for and never shipped. The handler commits the order and then publishes, and the gap between those two statements is exactly where the pod gets rescheduled. An outbox row written in the same transaction removes the gap entirely.
  - title: Shipments for orders that do not exist
    body: "The opposite bug: the service publishes first so the event is never lost, and then a unique-constraint violation rolls the order back. Downstream, a shipment and an invoice already exist for nothing. The outbox makes a rolled-back transaction leave no trace."
  - title: Broker outage without an incident
    body: Kafka is unavailable for twenty minutes. Because nothing in the request path talks to it, the API keeps serving 200s and the outbox simply grows; when the broker returns the relay drains the backlog in order. The only visible signal was the lag metric.
  - title: Feeding a CQRS read model
    body: A projection must never miss an event or it is permanently wrong. Reading from the outbox (directly or via CDC) guarantees the projector sees every committed change, and the message id gives it a free deduplication key.
  - title: Tail latency in the request path
    body: p99 checkout latency is dominated by an occasional slow broker publish. Moving the publish out of the transaction and into the relay takes the broker off the critical path; p99 drops to the database's own numbers.
gotchas:
  items:
    - mistake: Publishing inside the transaction
      why: "Calling the broker before `COMMIT` feels atomic and is not: the publish can succeed and the transaction still roll back, and meanwhile the broker's latency is holding your database locks."
      fix: never call the broker inside a transaction. Write the row, commit, and let the relay do the network work.
    - mistake: Generating the message id at publish time
      why: A republished row then carries a new id, so consumers cannot recognise the duplicate and every at-least-once delivery becomes a real duplicate.
      fix: generate the id when the outbox row is written, inside the business transaction, and never change it — including on replay from a dead-letter table.
    - mistake: Assuming consumers are idempotent
      why: The pattern guarantees delivery, not deduplication. A consumer that increments a balance will drift quietly after every relay restart.
      fix: make it an explicit contract. Ship an inbox table or upsert-by-key in every consumer, and test by replaying the same message twice.
    - mistake: No retention policy
      why: The outbox becomes the biggest table in the database, the relay's own query slows down, backups grow, and autovacuum falls behind.
      fix: delete published rows in batches after a few days, or partition by day and drop partitions. Decide this on day one.
    - mistake: Not monitoring lag
      why: "Every other signal stays green while the relay is crash-looping: the API returns 200, the database commits, the business logic is fine — and nobody downstream has heard anything for an hour."
      fix: alert on the age of the oldest unsent row. It is the only metric that observes this failure.
    - mistake: One poison row blocking everything
      why: A payload the broker rejects is retried forever, and strict ordering means the entire backlog stops behind it while error counts look constant.
      fix: bound the retries, move the row to a dead-letter table with the error, alert, and keep going.
    - mistake: Several relays destroying ordering
      why: Two instances publish rows 5 and 6 concurrently, and the consumer sees `OrderShipped` before `OrderPlaced`.
      fix: partition relay work by aggregate id, or make handlers tolerate out-of-order arrival with version checks. `SKIP LOCKED` prevents collisions, not reordering.
    - mistake: Expecting it to coordinate two services
      why: An outbox makes <em>your</em> database and your messages atomic. It does nothing about a remote service that accepted a call and then failed.
      fix: for multi-service workflows use a saga with explicit compensating actions; the outbox is how each step of that saga publishes reliably.
alternatives:
  columns:
    - Approach
    - Best for
    - Complexity
    - Cost / license
    - Key difference vs the outbox
  rows:
    - self: true
      cells:
        - "**Transactional outbox**"
        - reliable events from a service that owns a database
        - Medium
        - free; a relay to run
        - —
    - cells:
        - "**Dual write**"
        - nothing, honestly
        - Low
        - free
        - Simplest and silently wrong; loses or invents events
    - cells:
        - "**Two-phase commit (XA)**"
        - legacy brokers and XA databases
        - High
        - free; heavy
        - True atomicity, at the cost of latency, blocking and coupled availability
    - cells:
        - "**Change data capture only**"
        - publishing from existing tables
        - Medium
        - a connector cluster
        - No outbox table; events mirror rows, so you publish your schema rather than your intent
    - cells:
        - "**Event sourcing**"
        - services where history is the model
        - High
        - free; real ops cost
        - The event store <em>is</em> the outbox; no second write at all
    - cells:
        - "**Broker transactions**"
        - Kafka-to-Kafka pipelines
        - Medium
        - free
        - Atomic within one broker cluster; does not include your database
    - cells:
        - "**Listen to yourself**"
        - event-driven cores
        - Medium
        - free
        - Only the event is written; own state becomes eventually consistent
  notes:
    - "**Pick CDC on your business tables** if you only need to mirror data and can live with publishing your schema shape."
    - "**Pick event sourcing** if you already store events — then skip the outbox entirely."
    - "**Pick broker transactions** for read-process-write pipelines that never leave the broker."
    - "**Pick a saga** when the problem is coordinating several services, not publishing reliably from one."
    - "**Pick 2PC** only if you are already in an XA world and cannot make consumers idempotent."
