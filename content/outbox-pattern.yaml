title: Outbox pattern
slug: outbox-pattern
tagline: You cannot commit a database and a broker together. So write the message as a row, and let it ride along.
asof: Nov 2026 · examples use PostgreSQL, Kafka and Debezium; the idea is engine-agnostic
description: "Transactional outbox cheatsheet: why the dual write loses or invents events, how one table and a relay fix it, and what at-least-once delivery then demands of consumers."
aliases:
  - Outbox pattern
  - transactional outbox
  - outbox
  - dual write
  - dual-write problem
  - inbox pattern
  - idempotent consumer
keywords:
