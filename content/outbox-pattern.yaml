overview:
  - "Almost every service that owns data also has to tell someone about it: save the order <em>and</em> publish `OrderPlaced`. These are two different systems with two different transaction managers, so \"do both or neither\" is not something you can simply write down. This is the **dual write problem**, and left alone it produces two failures that are both silent: an event that was never published, and an event published for work that then rolled back."
  - The transactional outbox removes the second system from the critical path. The event is written as an ordinary row into an `outbox` table in the <em>same transaction</em> as the state change, so it is atomic by construction — one commit, one database, no new guarantees needed. A separate **relay** then reads that table and publishes to the broker, retrying until it succeeds.
  - "What you buy is that no event is ever lost and no event is ever invented. What you pay is that delivery becomes **at-least-once**: the relay can crash after publishing and before marking the row sent, so every consumer must be idempotent. That trade — duplicates instead of losses — is almost always the right one, because duplicates can be detected and losses cannot."
architecture:
  svg: outbox-pattern/architecture.svg
  alt: A service writing state and an outbox row in one transaction, a relay publishing to a broker, and a consumer deduplicating with an inbox table
  caption: The message becomes data first and a message second. Everything after the commit is retryable, because the fact is already durable.
howItWorks:
  - md: "The first animation is the problem: both orderings of a dual write fail, in different and equally silent ways. The second is the relay doing its job, and what at-least-once then demands from everyone downstream."
  - note: there is no ordering of two commits that is safe — stop looking for one
  - anim:
      id: anim-dual
      title: 1 · Both ways of doing a dual write are broken
      svg: outbox-pattern/anim-dual.svg
      alt: A service committing to a database and publishing to a broker, failing in both orderings, then fixed with an outbox row
      steps:
        - say: "The order service must do two things when an order is placed: store it, and tell the shipping service. Two systems, two transaction managers, no way to commit them together."
          hl: [ dw-svc ]
        - say: "Attempt A: commit the database first. Order 42 is now durable — whatever happens next, the order exists."
          hl: [ dw-db ]
          unhl: [ dw-svc ]
          text:
            dw-dbt: "orders: 42 ✓"
            dw-svct2: about to publish…
          fill:
            dw-dbt: "#2f6b3f"
        - say: "The pod is rescheduled before the publish call. The order exists and nobody will ever be told about it: no shipment, no invoice, no error anywhere. The customer finds out instead of you."
          hl: [ dw-br ]
          unhl: [ dw-db ]
          text:
            dw-svct: process killed
            dw-svct2: publish never happened
            dw-brt: "topic: empty"
            dw-v: "attempt A: the event is lost, silently and permanently"
          fill:
            dw-svct: "#c53b3b"
            dw-v: "#c53b3b"
            dw-verd: "#f9e3df"
        - say: "So try the other order. Attempt B: publish first, so the event can never be lost."
          unhl: [ dw-br ]
          text:
            dw-step: attempt B — publish first, then commit the database
            dw-dbt: "orders: empty"
            dw-brt: "topic: OrderPlaced(42) ✓"
            dw-svct: handling PlaceOrder
            dw-svct2: published, now committing…
            dw-v: two systems, two commits, no shared transaction
          fill:
            dw-dbt: "#5f6f66"
            dw-brt: "#2f6b3f"
            dw-svct: "#5f6f66"
            dw-v: "#23362e"
            dw-verd: "#e8ece2"
        - say: The transaction then fails — a unique violation, a deadlock, a timeout — and rolls back. Shipping now creates a shipment for an order that does not exist. This is worse than losing it, because the damage spreads.
          hl: [ dw-db ]
          text:
            dw-dbt: ROLLBACK — no order 42
            dw-brt2: shipping already reacted
            dw-v: "attempt B: a phantom event for work that never happened"
          fill:
            dw-dbt: "#c53b3b"
            dw-brt2: "#c53b3b"
            dw-v: "#c53b3b"
            dw-verd: "#f9e3df"
        - say: "There is no third ordering. Publishing <em>inside</em> the transaction is worse still: the broker's latency is now holding your row locks, and if the broker is down your database writes fail with it."
          unhl: [ dw-db ]
          text:
            dw-v: and publishing inside the transaction couples your availability to the broker
        - say: Two-phase commit would solve it in theory. In practice Kafka has no XA, the protocol blocks when the coordinator dies, and it ties your uptime to the broker's. Almost nobody chooses it.
          text:
            dw-v: "2PC: real atomicity, at a price nearly everyone refuses"
        - say: "The outbox sidesteps the whole problem: write the message as a <em>row</em>, in your own database, in the same transaction as the order. One commit, one system — atomic by construction, no new protocol."
          show: [ dw-ob ]
          hl: [ dw-db ]
          text:
            dw-dbt: "orders: 42 ✓"
            dw-obt: OrderPlaced(42) unsent
            dw-step: the outbox — one transaction, one database
            dw-brt: "topic: empty"
            dw-brt2: not involved yet
            dw-v: both rows commit together, or neither does
          fill:
            dw-dbt: "#2f6b3f"
            dw-brt: "#5f6f66"
            dw-brt2: "#5f6f66"
            dw-v: "#2f6b3f"
            dw-verd: "#e3eedc"
        - say: A separate relay publishes that row afterwards and retries until it succeeds. If it crashes, the row is still sitting there. The fact was durable the moment the order committed — everything after is just delivery.
          hl: [ dw-br ]
          unhl: [ dw-db ]
          text:
            dw-obt: OrderPlaced(42) sent ✓
            dw-brt: "topic: OrderPlaced(42) ✓"
            dw-brt2: shipping reacts — correctly
            dw-v: nothing lost, nothing invented — at the cost of possible duplicates
          fill:
            dw-brt: "#2f6b3f"
  - anim:
      id: anim-relay
      title: 2 · The relay, duplicates, and the inbox that absorbs them
      svg: outbox-pattern/anim-relay.svg
      alt: A relay polling an outbox table, publishing to a broker, crashing before marking sent, and a consumer deduplicating by message id
      steps:
        - say: Three rows sit in the outbox, all unsent. They were written by three different business transactions that have already committed, so these facts are durable regardless of what happens next.
          hl: [ rl-tbl ]
        - say: The relay polls for unsent rows in id order, claiming a batch with `FOR UPDATE SKIP LOCKED` — which is what lets a second relay instance take different rows instead of blocking on these.
          hl: [ rl-relay ]
          unhl: [ rl-tbl ]
          text:
            rl-rt: claimed row 1
            rl-rt2: SKIP LOCKED batch
        - say: It publishes row 1 to the broker, keyed by aggregate id so every event for order 42 lands on the same partition and stays in order.
          hl: [ rl-br ]
          unhl: [ rl-relay ]
          text:
            rl-brt: OrderPlaced(42)
            rl-brt2: key = order 42
        - say: "Then — and only then — it marks the row sent. Publish first, mark second: the ordering is deliberate, and it is why nothing can be lost."
          unhl: [ rl-br ]
          text:
            rl-r1t: 1 OrderPlaced  sent=t
            rl-rt: marked row 1 sent
          fill:
            rl-r1t: "#2f6b3f"
        - say: Now the failure that defines the pattern. The relay publishes row 2 — and dies before the UPDATE lands.
          hl: [ rl-relay ]
          text:
            rl-brt: ItemAdded(42)
            rl-rt: crashed
            rl-rt2: before marking sent
          fill:
            rl-rt: "#c53b3b"
        - say: On restart, row 2 is still `sent=f`, so it is published again. The consumer receives `ItemAdded` twice. This gap cannot be closed — closing it would need exactly the dual-write guarantee we gave up.
          hl: [ rl-br ]
          unhl: [ rl-relay ]
          text:
            rl-rt: restarted
            rl-rt2: republishing row 2
            rl-brt2: ItemAdded delivered twice
          fill:
            rl-rt: "#5f6f66"
            rl-brt2: "#c53b3b"
            rl-n: "at-least-once: never lost, sometimes duplicated"
        - say: So the consumer absorbs it. Each message id is inserted into an inbox table in the <em>same transaction</em> as the business change; the second insert conflicts, the handler returns early, and the shipment is created exactly once.
          hl: [ rl-cons ]
          unhl: [ rl-br ]
          text:
            rl-in1: msg a1b2 ✓
            rl-in2: c3d4 ✓ dup
            rl-ct: "shipments: 1"
            rl-ct2: duplicate ignored
            rl-n: at-least-once delivery + idempotent consumer = exactly-once processing
          fill:
            rl-ct2: "#2f6b3f"
            rl-n: "#2f6b3f"
        - say: "Row 3 goes out normally and the backlog drains. Note what never happened: no business code called the broker, and no transaction waited on the network."
          unhl: [ rl-cons ]
          text:
            rl-r2t: 2 ItemAdded    sent=t
            rl-r3t: 3 OrderShipped sent=t
            rl-brt: OrderShipped(42)
            rl-brt2: all delivered
            rl-ct: "shipments: 1 · shipped"
            rl-lag: "oldest unsent: none"
          fill:
            rl-r2t: "#2f6b3f"
            rl-r3t: "#2f6b3f"
            rl-brt2: "#5f6f66"
        - say: "If the broker had been down, nothing visible would have broken: the API keeps returning 200 and the rows simply accumulate. That is the pattern's best property and its most dangerous one."
          hl: [ rl-tbl ]
          text:
            rl-r1t: … 40,000 rows unsent
            rl-lag: "oldest unsent: 22 min"
            rl-n: everything looks healthy while nobody downstream hears anything
          fill:
            rl-lag: "#c53b3b"
            rl-n: "#c53b3b"
            rl-note: "#f9e3df"
        - say: "Hence the one metric to alert on: the age of the oldest unsent row. And the one chore not to skip: delete published rows, or the outbox becomes the largest table you own."
          unhl: [ rl-tbl ]
          text:
            rl-r1t: 1 OrderPlaced  sent=t
            rl-lag: "alert: oldest unsent > 60 s"
            rl-n: monitor the lag · bound the retries · delete the sent rows
            rl-n2: the relay may be stupid and slow — it may not be silent
          fill:
            rl-note: "#e3eedc"
            rl-n: "#2f6b3f"
            rl-lag: "#5f6f66"
concepts:
  - term: Dual write
    short: Writing to two systems that cannot share a transaction — the problem the outbox exists to remove.
    see: [ Outbox table, Two-phase commit, Relay ]
    detail: |-
      Save the row, then publish the message. Or publish, then save. Either way there is a window in which one has happened and the other has not, and a crash, a timeout or a rollback inside that window leaves the two systems permanently disagreeing.

      What makes it dangerous is that both failure modes are silent: nothing throws, no alert fires, and the inconsistency is discovered days later by a customer. Retrying does not help, because the process that would retry is the one that died.

      #### Both orderings fail

      | Order | Failure | Result |
      | --- | --- | --- |
      | Commit, then publish | crash before publish | event lost — nobody reacts |
      | Publish, then commit | transaction rolls back | phantom event — others react to nothing |
      | Publish inside the transaction | broker slow or down | long transaction, locks held, both fail together |

      #### How it relates

      - The first animation walks through all three.
  - term: Outbox table
    short: An ordinary table in the service's own database where outgoing messages are inserted inside the business transaction.
    see: [ Dual write, Relay, Retention ]
    detail: |-
      Keep it boring: a monotonic id for ordering, a stable message id for deduplication, the aggregate id for partitioning, a type, a JSON payload, a timestamp, and either a `sent_at` column or nothing at all if you are using change data capture.

      Because it is in the same database as the state, the insert joins the same transaction automatically. There is no new protocol and no new failure mode — if the business change commits, the message exists; if it rolls back, the message never existed.

      #### Columns that earn their place

      | Column | Why |
      | --- | --- |
      | `id bigserial` | publication order |
      | `message_id uuid` | consumer deduplication key |
      | `aggregate_id` | partition key — preserves per-entity order |
      | `type`, `payload jsonb` | routing and body |
      | `occurred_at`, `sent_at` | lag metric and cleanup |

      #### How it relates

      - In an event-sourced service the event store already <em>is</em> the outbox.
  - term: Relay
    short: The separate process that reads unsent outbox rows and publishes them to the broker, retrying until it succeeds.
    see: [ Polling publisher, Change data capture, At-least-once ]
    detail: |-
      The relay is deliberately dumb: it has no business logic, it is restartable at any moment, and its only state is "which rows have I published". That is what makes the pattern robust — the durable fact is already committed, so the relay failing is an availability problem, never a correctness one.

      Run it either as a sidecar beside the service, as a separate deployment, or not at all if you use CDC and let the connector be your relay.

      #### Where to run it

      | Option | Trade-off |
      | --- | --- |
      | In the service process | simplest; competes for the same resources |
      | Sidecar container | isolated, scales with the pod |
      | Separate deployment | scaled independently; one more thing to run |
      | CDC connector | no code at all; a platform dependency |

      #### How it relates

      - Several relay instances can run safely with `SKIP LOCKED`, shown in the **polling publisher** animation.
  - term: Polling publisher
    short: "The simplest relay: periodically select unsent rows, publish them, mark them sent."
    see: [ Relay, Change data capture, Lag ]
    anim:
      key: sk
      title: Two relays, one table, no collisions
      svg: outbox-pattern/sk.svg
      alt: Two relay workers claiming different batches of outbox rows using SKIP LOCKED
      steps:
        - say: Three unsent rows and two relay instances, both polling the same table at the same moment.
          hl: [ sk-w1, sk-w2 ]
        - say: Relay A opens a transaction and claims rows 1 and 2 with `SELECT … FOR UPDATE`. Those rows are now locked.
          hl: [ sk-r1, sk-r2 ]
          unhl: [ sk-w1, sk-w2 ]
          text:
            sk-r1t: row 1 · locked by A
            sk-r2t: row 2 · locked by A
            sk-w1t: publishing 1, 2
        - say: Without `SKIP LOCKED`, relay B would block here waiting for A to finish — two workers, the throughput of one.
          text:
            sk-w2t: "plain FOR UPDATE: blocked"
          fill:
            sk-w2t: "#c53b3b"
        - say: With `SKIP LOCKED` it simply steps over the locked rows and takes row 3 instead. Both relays work in parallel and neither publishes the same row twice.
          hl: [ sk-r3 ]
          unhl: [ sk-r1, sk-r2 ]
          text:
            sk-r3t: row 3 · locked by B
            sk-w2t: publishing 3
          fill:
            sk-w2t: "#2f6b3f"
        - say: "One caveat: this prevents collisions, not reordering. If order matters for an aggregate, partition the relays by aggregate id rather than letting both touch the same entity."
          unhl: [ sk-r3 ]
          text:
            sk-r1t: row 1 · sent
            sk-r2t: row 2 · sent
            sk-r3t: row 3 · sent
            sk-w1t: idle
            sk-w2t: idle
          fill:
            sk-w2t: "#5f6f66"
    detail: |-
      A loop with `SELECT ... WHERE sent_at IS NULL ORDER BY id LIMIT 100 FOR UPDATE SKIP LOCKED` is enough for most systems. `SKIP LOCKED` is what lets several relay instances run concurrently without stepping on each other — each grabs a different batch instead of blocking.

      Polling adds latency equal to half the poll interval, and constant query load even when idle. `LISTEN`/`NOTIFY` (or an in-process signal after commit) removes the latency while keeping the poll as a safety net.

      ::anim sk::

      #### How it relates

      - Batch size and poll interval are the two knobs that trade throughput against latency.
  - term: Change data capture
    short: Tailing the database's own replication log instead of polling, so the outbox is published with no extra queries.
    see: [ Relay, Polling publisher, Outbox table ]
    detail: |-
      Debezium and similar connectors read the write-ahead log and emit a message for every committed row change. Point one at your outbox table and the relay disappears: no polling load, latency in the low milliseconds, and ordering guaranteed by the log itself. Debezium even ships an "outbox event router" that unwraps the row into a properly shaped event.

      The cost is a platform dependency — Kafka Connect or equivalent — plus replication slots that will quietly bloat your database if a connector stops consuming.

      #### Polling versus CDC

      |  | Polling | CDC |
      | --- | --- | --- |
      | Latency | half the interval | milliseconds |
      | DB load | constant queries | log reading only |
      | Ops cost | a loop you own | a connector cluster |
      | Risk | slow when backlogged | stale slot bloats the DB |

      #### How it relates

      - CDC is also how read-model projections are commonly fed.
  - term: At-least-once
    short: "The delivery guarantee an outbox gives you: every message arrives, and some arrive more than once."
    see: [ Idempotent consumer, Inbox table, Relay ]
    detail: |-
      The relay publishes, then marks the row sent. If it dies between those two steps the row is still unsent, so after restart it publishes again. That gap cannot be closed — closing it would require exactly the dual-write guarantee the pattern was invented to avoid.

      So duplicates are not an edge case to be surprised by; they are part of the contract. The good news is that a duplicate is detectable (the message id is the same) while a lost message is not.

      #### The guarantees

      | Guarantee | Means |
      | --- | --- |
      | At-most-once | never duplicated, may be lost |
      | At-least-once | never lost, may be duplicated |
      | "Exactly-once" | at-least-once plus deduplication at the consumer |

      #### How it relates

      - "Exactly-once processing" is achievable; exactly-once <em>delivery</em> is not.
  - term: Idempotent consumer
    short: A consumer for which processing the same message twice has the same effect as processing it once.
    see: [ At-least-once, Inbox table, Message id ]
    detail: |-
      This is non-negotiable with an outbox. The cheapest version is a naturally idempotent handler: setting a status to `shipped` is safe to repeat, incrementing a counter is not. When the operation is not naturally idempotent, record the message id and skip anything already seen.

      Idempotency must cover side effects too. A handler that sends an email is not idempotent just because its database write is.

      #### Making a handler safe

      | Operation | Approach |
      | --- | --- |
      | Set a status | already idempotent |
      | Insert a row | upsert on a natural key |
      | Increment a total | inbox table, or store absolute values |
      | Send an email / charge a card | idempotency key at the provider |

      #### How it relates

      - The last steps of the second animation show a duplicate hitting an inbox and being dropped.
  - term: Inbox table
    short: "The mirror image of the outbox: the consumer records processed message ids, in the same transaction as its own state change."
    see: [ Idempotent consumer, Message id, Outbox table ]
    detail: |-
      On receipt, insert the message id into `inbox`; if the insert violates the primary key, this message has already been handled and you acknowledge it without doing anything. Doing that insert in the same transaction as the business change is what makes "process exactly once" true in effect, even though delivery was at-least-once.

      Give the table a retention policy — typically a few days, longer than any plausible redelivery — or it grows forever.

      #### Shape

      | Column | Note |
      | --- | --- |
      | `message_id` PK | the deduplication key |
      | `processed_at` | for retention |
      | `handler` | if several handlers consume the same topic |

      #### How it relates

      - Outbox plus inbox is the full "transactional messaging" pair.
  - term: Message id
    short: A stable identifier generated once, when the outbox row is written — never when it is published.
    see: [ Inbox table, Idempotent consumer, At-least-once ]
    detail: |-
      If the relay generated the id at publish time, a republished row would carry a new id and no consumer could tell it was a duplicate. Generating it inside the business transaction makes the id part of the durable fact.

      Prefer a UUIDv7 or similar time-ordered identifier: unique, sortable, and it doubles as a debugging handle you can trace from the producing transaction to the consuming one.

      #### Also worth carrying

      | Field | Use |
      | --- | --- |
      | `message_id` | deduplication |
      | `correlation_id` | tracing across services |
      | `causation_id` | which message caused this one |
      | `schema version` | safe payload evolution |

      #### How it relates

      - Propagating trace context through the outbox is the only way distributed tracing survives the asynchronous hop.
  - term: Ordering
    short: Messages are published in outbox id order, and keyed by aggregate id so a consumer sees one entity's events in sequence.
    see: [ Outbox table, Relay, Message id ]
    detail: |-
      Global ordering across a whole service is neither achievable nor useful. Per-aggregate ordering is both: publish with `aggregate_id` as the partition key so `OrderPlaced` always reaches a consumer before `OrderShipped` for that order.

      Two things quietly break this: running several relay instances that publish concurrently across the same aggregate, and retries that reorder a failed message behind a later one. Partition the relay by aggregate, or accept out-of-order delivery and make handlers tolerate it.

      #### Ordering choices

      | Scope | Feasible | Cost |
      | --- | --- | --- |
      | Per aggregate | yes | partition key |
      | Per topic | only with one partition | no parallelism |
      | Global | effectively no | — |

      #### How it relates

      - Handlers that tolerate out-of-order arrival (version checks, state machines) are far cheaper than strict ordering.
  - term: Lag
    short: The age of the oldest unsent outbox row — the one metric that tells you the pattern is working.
    see: [ Relay, Retention, Poison message ]
    detail: |-
      Everything else can look healthy while the relay is dead: the API returns 200, the database commits, the business logic is fine. Only the outbox backlog reveals that nobody downstream has heard anything for twenty minutes.

      Alert on the <em>age</em> of the oldest unsent row rather than the row count, because a slow trickle of unsendable messages matters more than a large burst that is draining normally.

      #### What to export

      | Metric | Healthy |
      | --- | --- |
      | Age of oldest unsent row | under a few seconds |
      | Unsent row count | bounded, draining |
      | Publish errors per minute | zero, or retrying |
      | Table size | flat — cleanup is running |

      #### How it relates

      - Rising lag with zero errors usually means a poison message at the head of the queue.
  - term: Poison message
    short: A row the relay can never publish, which blocks everything behind it if the relay insists on order.
    see: [ Lag, Relay, Ordering ]
    detail: |-
      A payload too large for the broker, an unserialisable field, a topic that no longer exists. The relay retries, fails, retries — and if it publishes strictly in id order, the whole outbox stops behind one bad row while lag climbs and errors stay constant.

      Give up after a bounded number of attempts: move the row to a dead-letter table, record why, alert, and continue. Losing ordering for one aggregate is better than losing delivery for all of them.

      #### Handling

      | Step | Action |
      | --- | --- |
      | Retry | exponential backoff, bounded |
      | Give up | move to `outbox_dead` with the error |
      | Alert | a human must see it |
      | Replay | fix and re-insert, keeping the message id |

      #### How it relates

      - Keeping the original message id on replay means consumers still deduplicate correctly.
  - term: Retention
    short: Deleting published rows, so the outbox does not quietly become the largest table in the database.
    see: [ Outbox table, Lag ]
    detail: |-
      A busy service writes millions of outbox rows a week. Left alone they bloat the table, slow the relay's own query, and inflate backups. Delete or archive rows once they are published and old enough to be past any replay you would realistically want.

      Deleting in small batches avoids long locks; partitioning the outbox by day turns cleanup into dropping a partition, which is instant.

      #### Approaches

      | Approach | Note |
      | --- | --- |
      | Delete sent rows after N days | batch it; watch for bloat |
      | Partition by day and drop | instant, no vacuum debt |
      | Delete immediately after publish | simplest; no replay possible |
      | Archive to object storage | when the events have audit value |

      #### How it relates

      - Partitioned retention is the same trick used on any large append-only table.
  - term: Two-phase commit
    short: The distributed protocol that would make a dual write atomic — and the reason almost nobody uses one.
    see: [ Dual write, Outbox table ]
    detail: |-
      XA/2PC genuinely solves the problem: a coordinator asks both resource managers to prepare, then tells both to commit. In practice it is slow, requires locks held across a network round trip, is unsupported by most modern brokers (Kafka has no XA), and has a blocking failure mode when the coordinator dies mid-protocol.

      Worse, it couples availability: if the broker is down, your database writes fail too. The outbox deliberately refuses that coupling — your service keeps working and the messages go out when the broker returns.

      #### Why the outbox wins

      |  | 2PC | Outbox |
      | --- | --- | --- |
      | Broker support | rare | any |
      | Latency | high | unchanged |
      | Availability coupling | yes | no |
      | Duplicates | no | yes — handled at the consumer |

      #### How it relates

      - The outbox trades a strong guarantee for a weaker one plus a cheap consumer-side fix.
  - term: Listen to yourself
    short: A variant where the producing service also consumes its own published event, instead of updating state directly.
    see: [ Outbox table, Idempotent consumer, Relay ]
    detail: |-
      Rather than writing state and an outbox row, the service writes only the event, publishes it, and updates its own state when it consumes it back. Every service — including the producer — then runs the same code path, and there is exactly one source of truth for "what happened".

      The price is that the producer's own state is eventually consistent with its own API, which surprises callers who expect to read back what they just wrote. It fits command-heavy, event-driven systems and fits poorly behind a synchronous CRUD API.

      #### Compared

      |  | Outbox | Listen to yourself |
      | --- | --- | --- |
      | Own state after commit | immediately current | eventually current |
      | Code paths | two | one |
      | Fits | most services | event-driven cores |

      #### How it relates

      - It has the same read-your-own-writes consequences as a CQRS read model.
