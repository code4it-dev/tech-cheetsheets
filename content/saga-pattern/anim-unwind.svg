<svg viewBox="0 0 800 320" role="img" aria-label="A trip booking saga committing three local transactions, failing on the fourth, and compensating in reverse order">
  <defs>
    <marker id="uw-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="uw-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <text id="uw-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">booking a trip across four services &mdash; and no distributed transaction anywhere</text>

  <rect id="uw-s1" x="20" y="48" width="170" height="64" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Orders</text>
  <text id="uw-s1t" x="105" y="92" font-size="10.5" text-anchor="middle" fill="#5f6f66">waiting</text>
  <line x1="194" y1="80" x2="214" y2="80" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#uw-arr)"/>

  <rect id="uw-s2" x="218" y="48" width="170" height="64" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="303" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Hotel</text>
  <text id="uw-s2t" x="303" y="92" font-size="10.5" text-anchor="middle" fill="#5f6f66">waiting</text>
  <line x1="392" y1="80" x2="412" y2="80" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#uw-arr)"/>

  <rect id="uw-s3" x="416" y="48" width="170" height="64" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="501" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Payment</text>
  <text id="uw-s3t" x="501" y="92" font-size="10.5" text-anchor="middle" fill="#5f6f66">waiting</text>
  <line x1="590" y1="80" x2="610" y2="80" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#uw-arr)"/>

  <rect id="uw-s4" x="614" y="48" width="166" height="64" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="697" y="72" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Flights</text>
  <text id="uw-s4t" x="697" y="92" font-size="10.5" text-anchor="middle" fill="#5f6f66">waiting</text>

  <g id="uw-c3" class="hidden">
    <line x1="501" y1="182" x2="501" y2="120" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#uw-red)"/>
    <rect x="416" y="186" width="170" height="56" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
    <text x="501" y="208" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">refund &euro;840</text>
    <text x="501" y="226" font-size="10" text-anchor="middle" fill="#5f6f66">a new charge, not an undo</text>
  </g>
  <g id="uw-c2" class="hidden">
    <line x1="303" y1="182" x2="303" y2="120" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#uw-red)"/>
    <rect x="218" y="186" width="170" height="56" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
    <text x="303" y="208" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">cancel reservation</text>
    <text id="uw-c2t" x="303" y="226" font-size="10" text-anchor="middle" fill="#5f6f66">&euro;25 cancellation fee</text>
  </g>
  <g id="uw-c1" class="hidden">
    <line x1="105" y1="182" x2="105" y2="120" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#uw-red)"/>
    <rect x="20" y="186" width="170" height="56" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
    <text x="105" y="208" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">mark order failed</text>
    <text x="105" y="226" font-size="10" text-anchor="middle" fill="#5f6f66">the row stays, with history</text>
  </g>

  <rect id="uw-state" x="20" y="262" width="760" height="46" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="uw-st" x="400" y="283" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">saga 7c21 &mdash; not started</text>
  <text id="uw-st2" x="400" y="301" font-size="10.5" text-anchor="middle" fill="#5f6f66">each step commits for real, visible to everyone, the moment it happens</text>
</svg>
