<svg viewBox="0 0 800 320" role="img" aria-label="The same flow run by services reacting to each other's events, then by a central orchestrator issuing commands">
  <defs>
    <marker id="sy-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="sy-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3f"/></marker>
  </defs>
  <text id="sy-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">choreography &mdash; every service listens for the previous one's event</text>

  <g id="sy-orch" class="hidden">
    <rect x="230" y="40" width="340" height="60" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
    <text x="400" y="64" font-size="12" text-anchor="middle" fill="#23362e" font-weight="700">booking orchestrator &mdash; one state machine</text>
    <text id="sy-orcht" x="400" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">state: awaiting hotel · step 2 of 4</text>
  </g>

  <rect id="sy-s1" x="20" y="150" width="170" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="176" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Orders</text>
  <text id="sy-s1t" x="105" y="196" font-size="10" text-anchor="middle" fill="#5f6f66">knows about Hotel</text>

  <rect id="sy-s2" x="218" y="150" width="170" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="303" y="176" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Hotel</text>
  <text id="sy-s2t" x="303" y="196" font-size="10" text-anchor="middle" fill="#5f6f66">knows about Payment</text>

  <rect id="sy-s3" x="416" y="150" width="170" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="501" y="176" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Payment</text>
  <text id="sy-s3t" x="501" y="196" font-size="10" text-anchor="middle" fill="#5f6f66">knows about Flights</text>

  <rect id="sy-s4" x="614" y="150" width="166" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="697" y="176" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">Flights</text>
  <text id="sy-s4t" x="697" y="196" font-size="10" text-anchor="middle" fill="#5f6f66">knows about Orders</text>

  <g id="sy-e1" class="hidden"><path d="M190 180 L214 180" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sy-arr)"/><text x="202" y="234" font-size="9.5" text-anchor="middle" fill="#5f6f66">OrderCreated</text></g>
  <g id="sy-e2" class="hidden"><path d="M388 180 L412 180" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sy-arr)"/><text x="400" y="234" font-size="9.5" text-anchor="middle" fill="#5f6f66">HotelReserved</text></g>
  <g id="sy-e3" class="hidden"><path d="M586 180 L610 180" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sy-arr)"/><text x="598" y="234" font-size="9.5" text-anchor="middle" fill="#5f6f66">CardCharged</text></g>

  <g id="sy-o1" class="hidden">
    <path d="M300 104 L105 104 L105 146" fill="none" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#sy-pur)"/>
    <path d="M340 104 L303 104 L303 146" fill="none" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#sy-pur)"/>
    <path d="M460 104 L501 104 L501 146" fill="none" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#sy-pur)"/>
    <path d="M500 104 L697 104 L697 146" fill="none" stroke="#2f6b3f" stroke-width="1.5" marker-end="url(#sy-pur)"/>
  </g>

  <rect id="sy-q" x="20" y="252" width="760" height="56" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="sy-qt" x="400" y="274" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="700">no coordinator, no single point of failure, full team autonomy</text>
  <text id="sy-qt2" x="400" y="294" font-size="10.5" text-anchor="middle" fill="#5f6f66">four services, four subscriptions, and nothing in the middle</text>
</svg>
