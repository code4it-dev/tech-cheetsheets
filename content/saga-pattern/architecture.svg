<svg viewBox="0 0 800 340" role="img" aria-label="A saga of four local transactions, each with a compensating action beneath it, and a pivot step after which there is no going back">
  <defs>
    <marker id="sg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="sg-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <text x="400" y="22" font-size="12.5" text-anchor="middle" fill="#5f6f66">forwards in local transactions, backwards in business facts &mdash; never in a rollback</text>

  <text x="20" y="58" font-size="11.5" fill="#5f6f66">forward path &mdash; each step commits in its own database</text>

  <rect x="20" y="70" width="166" height="58" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="103" y="94" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">1 · Order</text>
  <text x="103" y="114" font-size="10.5" text-anchor="middle" fill="#5f6f66">create (pending)</text>
  <line x1="190" y1="99" x2="210" y2="99" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <rect x="214" y="70" width="166" height="58" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="297" y="94" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">2 · Hotel</text>
  <text x="297" y="114" font-size="10.5" text-anchor="middle" fill="#5f6f66">reserve room</text>
  <line x1="384" y1="99" x2="404" y2="99" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <rect x="408" y="70" width="166" height="58" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="491" y="94" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">3 · Payment</text>
  <text x="491" y="114" font-size="10.5" text-anchor="middle" fill="#5f6f66">charge card &mdash; the pivot</text>
  <line x1="578" y1="99" x2="598" y2="99" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <rect x="602" y="70" width="178" height="58" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="691" y="94" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">4 · Ticketing</text>
  <text x="691" y="114" font-size="10.5" text-anchor="middle" fill="#5f6f66">retry-only, never undone</text>

  <line x1="103" y1="176" x2="103" y2="134" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#sg-red)"/>
  <line x1="297" y1="176" x2="297" y2="134" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#sg-red)"/>
  <line x1="491" y1="176" x2="491" y2="134" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#sg-red)"/>

  <text x="20" y="166" font-size="11.5" fill="#c53b3b">compensation &mdash; runs in reverse, and is itself a new business fact</text>

  <rect x="20" y="180" width="166" height="54" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="103" y="202" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">mark failed</text>
  <text x="103" y="220" font-size="10" text-anchor="middle" fill="#5f6f66">not deleted</text>

  <rect x="214" y="180" width="166" height="54" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="297" y="202" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">cancel reservation</text>
  <text x="297" y="220" font-size="10" text-anchor="middle" fill="#5f6f66">may cost a fee</text>

  <rect x="408" y="180" width="166" height="54" rx="8" fill="#f9e3df" stroke="#e6b3ad" stroke-width="1.5"/>
  <text x="491" y="202" font-size="11" text-anchor="middle" fill="#23362e" font-weight="600">refund card</text>
  <text x="491" y="220" font-size="10" text-anchor="middle" fill="#5f6f66">a second line on the statement</text>

  <rect x="602" y="180" width="178" height="54" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="691" y="202" font-size="11" text-anchor="middle" fill="#5f6f66">no compensation</text>
  <text x="691" y="220" font-size="10" text-anchor="middle" fill="#5f6f66">must only ever retry</text>

  <rect x="20" y="256" width="760" height="56" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="36" y="278" font-size="11.5" fill="#23362e" font-weight="700">the pivot divides the saga in two</text>
  <text x="36" y="298" font-size="11" fill="#5f6f66">before it, every step must be compensatable &nbsp;·&nbsp; after it, every step must be retriable until it succeeds &nbsp;·&nbsp; put the irreversible things last</text>

  <text class="hand" x="20" y="332" font-size="16" fill="#c53b3b">a compensation that fails has nothing to compensate it</text>
</svg>
