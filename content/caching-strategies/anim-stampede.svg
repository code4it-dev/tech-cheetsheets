<svg viewBox="0 0 800 320" role="img" aria-label="Animated cache stampede where an expiring key sends all concurrent requests to the database">
  <defs>
    <marker id="sp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="sp-clients" x="24" y="70" width="150" height="130" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="99" y="96" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Traffic</text>
  <text id="sp-rps" x="99" y="124" font-size="12.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">5,000 req/s</text>
  <text x="99" y="146" font-size="11.5" text-anchor="middle" fill="#5f6f66">all asking for</text>
  <text x="99" y="164" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">product:42</text>
  <text id="sp-clients-sub" x="99" y="186" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="600">served from cache</text>
  <line x1="174" y1="135" x2="286" y2="135" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#sp-arr)"/>
  <rect id="sp-cache" x="290" y="60" width="200" height="150" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="390" y="86" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Cache</text>
  <text id="sp-key" x="390" y="112" font-size="12" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">product:42 &rarr; {...}</text>
  <text id="sp-ttl" x="390" y="136" font-size="12.5" text-anchor="middle" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">TTL 300 s</text>
  <text id="sp-hit" x="390" y="162" font-size="12" text-anchor="middle" fill="#5f6f66">hit ratio 99.98%</text>
  <rect id="sp-lock" class="hidden" x="306" y="172" width="168" height="28" rx="5" fill="#fbf3c4" stroke="#d9c25a"/>
  <text id="sp-lock-t" class="hidden" x="390" y="191" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">lock held by req #1</text>
  <line id="sp-link" x1="490" y1="135" x2="596" y2="135" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#sp-arr)"/>
  <text id="sp-flow" x="543" y="124" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">~1 /s</text>
  <rect id="sp-db" x="600" y="60" width="176" height="150" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="688" y="86" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Database</text>
  <text id="sp-dbload" x="688" y="116" font-size="13" text-anchor="middle" fill="#2f6b3f" font-weight="700" font-family="Fira Code, monospace">load: 2%</text>
  <text id="sp-dblat" x="688" y="140" font-size="12" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">p99 12 ms</text>
  <text id="sp-dbpool" x="688" y="166" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">pool 3 / 100</text>
  <text id="sp-dbstate" x="688" y="190" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="600">healthy</text>
  <text id="sp-caption" x="400" y="248" font-size="13" text-anchor="middle" fill="#23362e">Steady state: the database barely notices the traffic.</text>
  <g id="sp-fix" class="hidden">
    <rect x="70" y="264" width="660" height="30" rx="6" fill="#e3eedc" stroke="#2f6b3f"/>
    <text id="sp-fix-t" x="400" y="284" font-size="12.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">single-flight: one request refreshes, the other 499 wait on the same task</text>
  </g>
  <text id="sp-note" class="hand hidden" x="300" y="312" font-size="16" fill="#c53b3b">the higher the hit ratio, the harder the fall</text>
</svg>
