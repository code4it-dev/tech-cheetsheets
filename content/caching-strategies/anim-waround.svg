<svg viewBox="0 0 800 270" role="img" aria-label="Animated write-around where the application writes to the database and deletes the cache key">
  <defs>
    <marker id="wa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="wa-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53b3b"/></marker>
  </defs>
  <rect id="wa-app" x="30" y="60" width="150" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Your app</text>
  <text id="wa-app-sub" x="105" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="wa-app-lat" x="105" y="131" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">&nbsp;</text>
  <path id="wa-arc" d="M105 146 Q 400 230 690 146" stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#wa-a)"/>
  <text x="400" y="212" font-size="10.5" text-anchor="middle" fill="#5f6f66">1. the write goes straight past the cache</text>
  <line id="wa-del" class="hidden" x1="180" y1="86" x2="296" y2="86" stroke="#c53b3b" stroke-width="1.5" marker-end="url(#wa-r)"/>
  <text id="wa-del-t" class="hidden" x="238" y="78" font-size="10.5" text-anchor="middle" fill="#c53b3b" font-family="Fira Code, monospace">2. DEL</text>
  <rect id="wa-cache" x="300" y="50" width="190" height="106" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="395" y="78" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Cache</text>
  <text id="wa-cache-val" x="395" y="102" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">product:42 &rarr; 99 (stale)</text>
  <text id="wa-cache-sub" x="395" y="126" font-size="10.5" text-anchor="middle" fill="#5f6f66">not in the write path at all</text>
  <rect id="wa-db" x="610" y="60" width="160" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="690" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">PostgreSQL</text>
  <text id="wa-db-sub" x="690" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">price = 99</text>
  <text id="wa-db-hits" x="690" y="131" font-size="11" text-anchor="middle" fill="#5f6f66">the system of record</text>
  <text id="wa-score" x="30" y="248" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">client waited: &mdash;</text>
  <text id="wa-note" class="hand hidden" x="330" y="252" font-size="15" fill="#c53b3b">DEL, never SET &mdash; a delete can't be stale</text>
</svg>
