<svg viewBox="0 0 560 190" role="img" aria-label="Latency ladder from in-process cache to a cross-region database call">
  <text x="12" y="20" font-size="12" font-weight="600" fill="#23362e">Typical cost of one lookup, log scale in spirit, not to scale</text>
  <rect x="12" y="32" width="40" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="60" y="48" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">in-process dictionary ~ 100 ns</text>
  <rect x="12" y="62" width="80" height="22" rx="4" fill="#e3eedc" stroke="#2f6b3f"/><text x="100" y="78" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">local Redis ~ 0.3 ms  (3,000x)</text>
  <rect x="12" y="92" width="150" height="22" rx="4" fill="#fbf3c4" stroke="#d9c25a"/><text x="170" y="108" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">indexed DB query ~ 5 ms</text>
  <rect x="12" y="122" width="260" height="22" rx="4" fill="#f9e3df" stroke="#c53b3b"/><text x="280" y="138" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">join + sort ~ 50 ms</text>
  <rect x="12" y="152" width="400" height="22" rx="4" fill="#f9e3df" stroke="#c53b3b"/><text x="420" y="168" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">cross-region ~ 150 ms</text>
</svg>
