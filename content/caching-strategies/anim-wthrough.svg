<svg viewBox="0 0 800 270" role="img" aria-label="Animated write-through where the cache synchronously writes to the database before acknowledging">
  <defs>
    <marker id="wt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="wt-app" x="30" y="60" width="150" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Your app</text>
  <text id="wt-app-sub" x="105" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="wt-app-lat" x="105" y="131" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">&nbsp;</text>
  <line x1="180" y1="92" x2="296" y2="92" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#wt-a)"/>
  <text x="238" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">write price = 79</text>
  <rect id="wt-cache" x="300" y="50" width="190" height="106" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="395" y="76" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Cache</text>
  <text id="wt-cache-val" x="395" y="100" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">product:42 &rarr; 99</text>
  <text id="wt-cache-sub" x="395" y="124" font-size="10.5" text-anchor="middle" fill="#5f6f66">forwards every write, and waits</text>
  <line id="wt-link" x1="490" y1="103" x2="606" y2="103" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#wt-a)"/>
  <text id="wt-link-t" x="548" y="95" font-size="10.5" text-anchor="middle" fill="#5f6f66">synchronous</text>
  <rect id="wt-db" x="610" y="60" width="160" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="690" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">PostgreSQL</text>
  <text id="wt-db-sub" x="690" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">price = 99</text>
  <text id="wt-db-hits" x="690" y="131" font-size="11" text-anchor="middle" fill="#5f6f66">committed: no</text>
  <text id="wt-agree" x="30" y="200" font-size="12.5" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">cache and database agree: yes</text>
  <text id="wt-score" x="30" y="248" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">client waited: &mdash;</text>
  <text id="wt-note" class="hand hidden" x="330" y="252" font-size="15" fill="#c53b3b">never wrong, never fast, and full of unread data</text>
</svg>
