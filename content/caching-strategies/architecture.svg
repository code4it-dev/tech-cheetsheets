<svg viewBox="0 0 800 330" role="img" aria-label="Layers of caching from browser through CDN, in-process cache and distributed cache to the database, with typical latency and hit ratio at each layer">
  <defs>
    <marker id="ca-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="22" font-size="13" text-anchor="middle" fill="#5f6f66">each layer answers what it can and passes the rest down &mdash; a miss is only a miss for that layer</text>

  <rect x="18" y="42" width="140" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="88" y="66" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Browser</text>
  <text x="88" y="86" font-size="11.5" text-anchor="middle" fill="#5f6f66">Cache-Control</text>
  <text x="88" y="103" font-size="11.5" text-anchor="middle" fill="#5f6f66">ETag revalidation</text>
  <text x="88" y="124" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="600">0 ms</text>

  <rect x="178" y="42" width="140" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="248" y="66" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">CDN / edge</text>
  <text x="248" y="86" font-size="11.5" text-anchor="middle" fill="#5f6f66">shared, per POP</text>
  <text x="248" y="103" font-size="11.5" text-anchor="middle" fill="#5f6f66">purge by tag</text>
  <text x="248" y="124" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="600">5&ndash;30 ms</text>

  <rect x="338" y="42" width="140" height="92" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="1.5"/>
  <text x="408" y="66" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">In-process</text>
  <text x="408" y="86" font-size="11.5" text-anchor="middle" fill="#5f6f66">per instance, not shared</text>
  <text x="408" y="103" font-size="11.5" text-anchor="middle" fill="#5f6f66">MemoryCache</text>
  <text x="408" y="124" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="600">~0.1 &micro;s</text>

  <rect x="498" y="42" width="140" height="92" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="568" y="66" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Distributed</text>
  <text x="568" y="86" font-size="11.5" text-anchor="middle" fill="#5f6f66">Redis &mdash; one truth</text>
  <text x="568" y="103" font-size="11.5" text-anchor="middle" fill="#5f6f66">for the whole fleet</text>
  <text x="568" y="124" font-size="12" text-anchor="middle" fill="#2f6b3f" font-weight="600">0.3&ndash;1 ms</text>

  <rect x="658" y="42" width="124" height="92" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="720" y="66" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Database</text>
  <text x="720" y="86" font-size="11.5" text-anchor="middle" fill="#5f6f66">system of record</text>
  <text x="720" y="103" font-size="11.5" text-anchor="middle" fill="#5f6f66">always correct</text>
  <text x="720" y="124" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600">5&ndash;100 ms</text>

  <g stroke="#5f6f66" stroke-width="1.5" fill="none" marker-end="url(#ca-arr)">
    <line x1="158" y1="88" x2="174" y2="88"/><line x1="318" y1="88" x2="334" y2="88"/>
    <line x1="478" y1="88" x2="494" y2="88"/><line x1="638" y1="88" x2="654" y2="88"/>
  </g>

  <text x="400" y="166" font-size="12.5" text-anchor="middle" fill="#23362e" font-weight="600">a 95% hit ratio sends 1 request in 20 down to the next layer</text>

  <rect x="18" y="184" width="764" height="88" rx="8" fill="#fbfcf8" stroke="#d5dccf"/>
  <text x="34" y="206" font-size="12.5" font-weight="600" fill="#23362e">The four decisions that make up a caching strategy</text>
  <g font-size="12" fill="#5f6f66">
    <text x="34" y="228"><tspan fill="#c53b3b" font-weight="600">1. Who fills it?</tspan>  cache-aside (your code) &middot; read-through (the cache) &middot; refresh-ahead (a timer)</text>
    <text x="34" y="246"><tspan fill="#c53b3b" font-weight="600">2. What happens on write?</tspan>  write-through &middot; write-behind &middot; write-around &middot; invalidate-only</text>
    <text x="34" y="264"><tspan fill="#c53b3b" font-weight="600">3. When do entries die?</tspan>  TTL &middot; eviction under memory pressure &middot; explicit invalidation</text>
  </g>
  <text x="34" y="296" font-size="12" fill="#5f6f66"><tspan fill="#c53b3b" font-weight="600">4. How stale is too stale?</tspan>  the staleness budget is a product decision, not a technical one</text>
  <text class="hand" x="430" y="320" font-size="16" fill="#c53b3b">answer #4 first &mdash; the other three follow from it</text>
</svg>
