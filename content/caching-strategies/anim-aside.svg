<svg viewBox="0 0 800 270" role="img" aria-label="Animated cache-aside read where the application itself queries the database and populates the cache">
  <defs>
    <marker id="ca-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="ca-app" x="30" y="60" width="150" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Your app</text>
  <text id="ca-app-sub" x="105" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="ca-app-lat" x="105" y="131" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">&nbsp;</text>
  <line x1="180" y1="92" x2="296" y2="92" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#ca-a)"/>
  <text x="238" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">1. look</text>
  <path id="ca-arc" d="M105 146 Q 400 230 690 146" stroke="#c53b3b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ca-a)"/>
  <text x="400" y="212" font-size="10.5" text-anchor="middle" fill="#c53b3b">2. on a miss, the app queries the database itself</text>
  <rect id="ca-cache" x="300" y="50" width="190" height="106" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="395" y="76" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Cache</text>
  <text id="ca-cache-val" x="395" y="100" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">product:42 &rarr; (nil)</text>
  <text id="ca-cache-sub" x="395" y="122" font-size="10.5" text-anchor="middle" fill="#5f6f66">knows nothing about the database</text>
  <text id="ca-cache-ttl" x="395" y="142" font-size="10.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <rect id="ca-db" x="610" y="60" width="160" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="690" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">PostgreSQL</text>
  <text id="ca-db-sub" x="690" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">price = 99</text>
  <text id="ca-db-hits" x="690" y="131" font-size="11" text-anchor="middle" fill="#5f6f66">queries: 0</text>
  <text id="ca-score" x="30" y="248" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">client waited: &mdash;</text>
  <text id="ca-note" class="hand hidden" x="330" y="252" font-size="15" fill="#c53b3b">a miss costs you the lookup *and* the query</text>
</svg>
