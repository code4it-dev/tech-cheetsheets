<svg viewBox="0 0 560 250" role="img" aria-label="Animated race between a slow reader and a writer that leaves a stale value in the cache">
  <text x="12" y="22" font-size="12" font-weight="600" fill="#5f6f66">Timeline</text>
  <text id="iv-s1" class="hidden" x="12" y="48" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">A: miss &rarr; SELECT price &rarr; reads 99</text>
  <text id="iv-s2" class="hidden" x="12" y="76" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">B: UPDATE price = 79</text>
  <text id="iv-s3" class="hidden" x="12" y="104" font-size="11.5" fill="#23362e" font-family="Fira Code, monospace">B: DEL product:42</text>
  <text id="iv-s4" class="hidden" x="12" y="132" font-size="11.5" fill="#c53b3b" font-family="Fira Code, monospace">A: SET product:42 = 99  (stale!)</text>
  <text id="iv-s5" class="hidden" x="12" y="160" font-size="11.5" fill="#c53b3b" font-family="Fira Code, monospace">C: GET product:42 &rarr; 99 for the next 5 min</text>
  <rect x="330" y="30" width="218" height="46" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="439" y="50" font-size="11.5" text-anchor="middle" fill="#5f6f66">Cache</text>
  <text id="iv-cache" x="439" y="68" font-size="12.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">(empty)</text>
  <rect x="330" y="92" width="218" height="46" rx="6" fill="#fbfcf8" stroke="#a9b5a6"/>
  <text x="439" y="112" font-size="11.5" text-anchor="middle" fill="#5f6f66">Database</text>
  <text id="iv-db" x="439" y="130" font-size="12.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">price = 99</text>
  <text id="iv-verdict" class="hidden" x="439" y="162" font-size="12.5" text-anchor="middle" fill="#c53b3b" font-weight="700">cache and DB disagree</text>
  <text id="iv-fix" class="hidden" x="12" y="196" font-size="11.5" fill="#2f6b3f" font-family="Fira Code, monospace">fix: short TTL + delete-on-write, or a version check on SET</text>
  <text id="iv-note" class="hand hidden" x="12" y="232" font-size="15" fill="#c53b3b">the window is tiny. Your traffic is not.</text>
</svg>
