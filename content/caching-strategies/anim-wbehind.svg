<svg viewBox="0 0 800 270" role="img" aria-label="Animated write-behind where the cache acknowledges immediately and flushes to the database later">
  <defs>
    <marker id="wb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <rect id="wb-app" x="30" y="60" width="150" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Your app</text>
  <text id="wb-app-sub" x="105" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="wb-app-lat" x="105" y="131" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">&nbsp;</text>
  <line x1="180" y1="92" x2="296" y2="92" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#wb-a)"/>
  <text x="238" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">write price = 79</text>
  <rect id="wb-cache" x="300" y="50" width="190" height="106" rx="8" fill="#f9e3df" stroke="#c53b3b" stroke-width="1.5"/>
  <text x="395" y="74" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Cache</text>
  <text id="wb-cache-val" x="395" y="96" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">product:42 &rarr; 99</text>
  <rect id="wb-dirty-box" class="hidden" x="316" y="110" width="158" height="34" rx="5" fill="#fbf3c4" stroke="#d9c25a"/>
  <text id="wb-dirty" class="hidden" x="395" y="132" font-size="11" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">dirty buffer: empty</text>
  <line id="wb-link" x1="490" y1="103" x2="606" y2="103" stroke="#d9c25a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wb-a)"/>
  <text id="wb-link-t" x="548" y="95" font-size="10.5" text-anchor="middle" fill="#8a6a0c">every 200 ms</text>
  <rect id="wb-db" x="610" y="60" width="160" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="690" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">PostgreSQL</text>
  <text id="wb-db-sub" x="690" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">price = 99</text>
  <text id="wb-db-hits" x="690" y="131" font-size="11" text-anchor="middle" fill="#5f6f66">writes: 0</text>
  <text id="wb-agree" x="30" y="200" font-size="12.5" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">cache and database agree: yes</text>
  <g id="wb-crash" class="hidden">
    <rect x="300" y="50" width="190" height="106" rx="8" fill="none" stroke="#c53b3b" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="395" y="174" font-size="12.5" text-anchor="middle" fill="#c53b3b" font-weight="700">node dies</text>
  </g>
  <text id="wb-score" x="30" y="248" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">client waited: &mdash;</text>
  <text id="wb-note" class="hand hidden" x="330" y="252" font-size="15" fill="#c53b3b">50x faster, and it can lose the write it acknowledged</text>
</svg>
