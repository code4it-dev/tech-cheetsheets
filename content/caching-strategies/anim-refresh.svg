<svg viewBox="0 0 800 270" role="img" aria-label="Animated refresh-ahead where a background task recomputes a hot entry before it expires">
  <defs>
    <marker id="ra-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
    <marker id="ra-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3f"/></marker>
  </defs>
  <rect id="ra-app" x="30" y="60" width="150" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="105" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Your app</text>
  <text id="ra-app-sub" x="105" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66">idle</text>
  <text id="ra-app-lat" x="105" y="131" font-size="12" text-anchor="middle" fill="#c53b3b" font-weight="600" font-family="Fira Code, monospace">&nbsp;</text>
  <line x1="180" y1="92" x2="296" y2="92" stroke="#a9b5a6" stroke-width="1.5" marker-end="url(#ra-a)"/>
  <text x="238" y="84" font-size="10.5" text-anchor="middle" fill="#5f6f66">always a hit</text>
  <rect id="ra-cache" x="300" y="50" width="190" height="106" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="395" y="74" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">Cache</text>
  <text id="ra-cache-val" x="395" y="97" font-size="11.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">product:42 &rarr; 99</text>
  <text id="ra-cache-ttl" x="395" y="118" font-size="11.5" text-anchor="middle" fill="#2f6b3f" font-weight="600" font-family="Fira Code, monospace">TTL 300 s</text>
  <text id="ra-cache-sub" x="395" y="140" font-size="10.5" text-anchor="middle" fill="#5f6f66">nobody is waiting on this entry</text>
  <line id="ra-link" class="hidden" x1="490" y1="103" x2="606" y2="103" stroke="#2f6b3f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ra-g)"/>
  <text id="ra-link-t" class="hidden" x="548" y="95" font-size="10.5" text-anchor="middle" fill="#2f6b3f">background</text>
  <rect id="ra-db" x="610" y="60" width="160" height="86" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="690" y="88" font-size="13.5" font-weight="600" text-anchor="middle" fill="#23362e">PostgreSQL</text>
  <text id="ra-db-sub" x="690" y="110" font-size="11.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">price = 99</text>
  <text id="ra-db-hits" x="690" y="131" font-size="11" text-anchor="middle" fill="#5f6f66">queries: 0</text>
  <text id="ra-clock" x="30" y="200" font-size="12" fill="#5f6f66" font-family="Fira Code, monospace">t = 0:00 since the entry was written</text>
  <text id="ra-score" x="30" y="248" font-size="13" fill="#23362e" font-weight="600" font-family="Fira Code, monospace">client waited: &mdash;</text>
  <text id="ra-note" class="hand hidden" x="330" y="252" font-size="15" fill="#c53b3b">no user ever pays for a miss &mdash; someone else does</text>
</svg>
