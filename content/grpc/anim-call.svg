<svg viewBox="0 0 800 336" role="img" aria-label="A gRPC unary call: the stub serialises a request, a new HTTP/2 stream carries headers, a length-prefixed message and trailers back with the status">
  <defs>
    <marker id="gr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="gr-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">application code calls <tspan font-family="Fira Code, monospace">client.GetOrderAsync(new GetOrderRequest { Id = "ORD-9802" })</tspan></text>

  <rect id="gr-client" x="16" y="46" width="170" height="60" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="101" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">generated stub</text>
  <text id="gr-clientt" x="101" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">a typed method</text>

  <rect id="gr-chan" x="230" y="46" width="170" height="60" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="315" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">channel</text>
  <text id="gr-chant" x="315" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">HTTP/2, already open</text>

  <rect id="gr-stream" x="430" y="46" width="170" height="60" rx="6" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="515" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">stream 7</text>
  <text id="gr-streamt" x="515" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">one call = one stream</text>

  <rect id="gr-server" x="630" y="46" width="154" height="60" rx="6" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="707" y="68" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="700">OrderService</text>
  <text id="gr-servert" x="707" y="88" font-size="9.5" text-anchor="middle" fill="#5f6f66">Go, as it happens</text>

  <line x1="190" y1="76" x2="224" y2="76" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gr-arr)"/>
  <line x1="404" y1="76" x2="424" y2="76" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gr-arr)"/>
  <line x1="604" y1="76" x2="624" y2="76" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gr-arr)"/>

  <g id="gr-msg" class="hidden">
    <rect x="16" y="118" width="170" height="24" rx="5" fill="#e8ece2" stroke="#a9b5a6"/>
    <text id="gr-msgt" x="101" y="134" font-size="8.5" text-anchor="middle" fill="#23362e" font-family="Fira Code, monospace">&nbsp;</text>
  </g>

  <rect id="gr-wire" x="16" y="152" width="460" height="140" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gr-wt" x="30" y="172" font-size="11" fill="#23362e" font-weight="700">HTTP/2 frames on stream 7</text>
  <text id="gr-w1" x="30" y="192" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-w2" x="30" y="210" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-w3" x="30" y="228" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-w4" x="30" y="246" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-w5" x="30" y="264" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-w6" x="30" y="282" font-size="8.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="gr-side" x="492" y="152" width="292" height="140" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gr-sd" x="506" y="172" font-size="11" fill="#23362e" font-weight="700">what it costs</text>
  <text id="gr-s1" x="506" y="194" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-s2" x="506" y="214" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-s3" x="506" y="234" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-s4" x="506" y="254" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gr-s5" x="506" y="276" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="gr-verd" x="16" y="300" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gr-v" x="400" y="319" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">a method call in the source, a multiplexed stream on the wire</text>
</svg>
