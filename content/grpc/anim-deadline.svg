<svg viewBox="0 0 800 324" role="img" aria-label="A deadline set by the caller shrinking as it propagates through three services, and cancellation flowing back through the chain when it expires">
  <defs>
    <marker id="gw-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text id="gw-phase" x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">a checkout request with a 2-second budget, through three services</text>

  <rect id="gw-c" x="16" y="50" width="160" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="96" y="72" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">gateway</text>
  <text id="gw-ct" x="96" y="92" font-size="9" text-anchor="middle" fill="#5f6f66">sets the budget</text>

  <rect id="gw-a" x="216" y="50" width="160" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="296" y="72" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">checkout</text>
  <text id="gw-at" x="296" y="92" font-size="9" text-anchor="middle" fill="#5f6f66">&mdash;</text>

  <rect id="gw-b" x="416" y="50" width="160" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="496" y="72" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">pricing</text>
  <text id="gw-bt" x="496" y="92" font-size="9" text-anchor="middle" fill="#5f6f66">&mdash;</text>

  <rect id="gw-d" x="616" y="50" width="168" height="56" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="700" y="72" font-size="10.5" text-anchor="middle" fill="#23362e" font-weight="600">tax (slow today)</text>
  <text id="gw-dt" x="700" y="92" font-size="9" text-anchor="middle" fill="#5f6f66">&mdash;</text>

  <line x1="180" y1="78" x2="210" y2="78" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gw-arr)"/>
  <line x1="380" y1="78" x2="410" y2="78" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gw-arr)"/>
  <line x1="580" y1="78" x2="610" y2="78" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gw-arr)"/>

  <text id="gw-b1" x="96" y="126" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gw-b2" x="296" y="126" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gw-b3" x="496" y="126" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>
  <text id="gw-b4" x="700" y="126" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">&nbsp;</text>

  <rect id="gw-panel" x="16" y="146" width="768" height="130" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gw-pt" x="30" y="166" font-size="11" fill="#23362e" font-weight="700">what happens</text>
  <text id="gw-p1" x="30" y="188" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gw-p2" x="30" y="208" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gw-p3" x="30" y="228" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gw-p4" x="30" y="248" font-size="9.5" fill="#5f6f66">&nbsp;</text>
  <text id="gw-p5" x="30" y="268" font-size="9.5" fill="#5f6f66">&nbsp;</text>

  <rect id="gw-verd" x="16" y="288" width="768" height="28" rx="6" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text id="gw-v" x="400" y="307" font-size="11.5" text-anchor="middle" fill="#23362e" font-weight="700">a deadline is a budget for the whole tree, not a timeout for one hop</text>
</svg>
