<svg viewBox="0 0 800 358" role="img" aria-label="gRPC architecture: one proto file generating client stubs and server skeletons in several languages, with calls travelling as HTTP/2 streams over one channel">
  <defs>
    <marker id="gc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6f66"/></marker>
  </defs>
  <text x="400" y="20" font-size="12.5" text-anchor="middle" fill="#5f6f66">one file is the contract; everything else is generated from it</text>

  <rect x="300" y="36" width="200" height="56" rx="8" fill="#fbf3c4" stroke="#d9c25a" stroke-width="2"/>
  <text x="400" y="58" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">orders.proto</text>
  <text x="400" y="78" font-size="9.5" text-anchor="middle" fill="#5f6f66">service + messages + field numbers</text>

  <line x1="340" y1="96" x2="240" y2="122" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gc-arr)"/>
  <line x1="460" y1="96" x2="560" y2="122" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gc-arr)"/>
  <text x="400" y="110" font-size="9" text-anchor="middle" fill="#5f6f66">protoc</text>

  <rect x="16" y="128" width="300" height="106" rx="8" fill="#e8ece2" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="166" y="150" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">generated client stub</text>
  <text x="166" y="172" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">client.GetOrderAsync(req)</text>
  <text x="166" y="192" font-size="9.5" text-anchor="middle" fill="#5f6f66">C# · Python · Go · Java · Kotlin · Rust</text>
  <text x="166" y="214" font-size="9.5" text-anchor="middle" fill="#2f6b3f">typed, with completion, at compile time</text>

  <rect x="484" y="128" width="300" height="106" rx="8" fill="#e3eedc" stroke="#2f6b3f" stroke-width="2"/>
  <text x="634" y="150" font-size="11" text-anchor="middle" fill="#23362e" font-weight="700">generated server base</text>
  <text x="634" y="172" font-size="9.5" text-anchor="middle" fill="#5f6f66" font-family="Fira Code, monospace">override GetOrder(req, ctx)</text>
  <text x="634" y="192" font-size="9.5" text-anchor="middle" fill="#5f6f66">you write only the method bodies</text>
  <text x="634" y="214" font-size="9.5" text-anchor="middle" fill="#2f6b3f">any language, same contract</text>

  <rect x="332" y="128" width="136" height="106" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="400" y="150" font-size="10" text-anchor="middle" fill="#23362e" font-weight="700">one channel</text>
  <text x="400" y="170" font-size="9" text-anchor="middle" fill="#5f6f66">HTTP/2, TLS</text>
  <text x="400" y="188" font-size="9" text-anchor="middle" fill="#5f6f66">long-lived</text>
  <text x="400" y="208" font-size="9" text-anchor="middle" fill="#c53b3b">many streams</text>
  <text x="400" y="224" font-size="9" text-anchor="middle" fill="#c53b3b">one connection</text>
  <line x1="320" y1="181" x2="328" y2="181" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gc-arr)"/>
  <line x1="472" y1="181" x2="480" y2="181" stroke="#5f6f66" stroke-width="1.5" marker-end="url(#gc-arr)"/>

  <rect x="16" y="250" width="768" height="60" rx="8" fill="#fbfcf8" stroke="#a9b5a6" stroke-width="1.5"/>
  <text x="30" y="270" font-size="10.5" fill="#23362e" font-weight="700">what is actually on the wire, per call</text>
  <text x="30" y="290" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">HEADERS  :path /orders.OrderService/GetOrder · grpc-timeout: 2S · content-type: application/grpc</text>
  <text x="30" y="304" font-size="9.5" fill="#5f6f66" font-family="Fira Code, monospace">DATA     [1 byte compressed flag][4 byte length][protobuf bytes] …   TRAILERS  grpc-status: 0</text>

  <text class="hand" x="400" y="340" fill="#c53b3b" font-size="16" text-anchor="middle">one connection, thousands of calls. great for latency, terrible for a layer-4 load balancer.</text>
</svg>
