<svg viewBox="0 0 560 190" role="img" aria-label="The four gRPC call types shown as arrows between client and server">
  <text x="12" y="20" font-size="10" fill="#23362e" font-weight="700">unary</text>
  <line x1="120" y1="16" x2="300" y2="16" stroke="#5f6f66" stroke-width="1.5"/><circle cx="300" cy="16" r="3" fill="#5f6f66"/>
  <line x1="300" y1="28" x2="120" y2="28" stroke="#2f6b3f" stroke-width="1.5"/><circle cx="120" cy="28" r="3" fill="#2f6b3f"/>
  <text x="330" y="26" font-size="9" fill="#5f6f66">1 → 1 · an ordinary call</text>

  <text x="12" y="65" font-size="10" fill="#23362e" font-weight="700">server stream</text>
  <line x1="120" y1="61" x2="300" y2="61" stroke="#5f6f66" stroke-width="1.5"/><circle cx="300" cy="61" r="3" fill="#5f6f66"/>
  <line x1="300" y1="73" x2="120" y2="73" stroke="#2f6b3f" stroke-width="1.5"/><circle cx="120" cy="73" r="3" fill="#2f6b3f"/>
  <line x1="300" y1="83" x2="120" y2="83" stroke="#2f6b3f" stroke-width="1.5"/><circle cx="120" cy="83" r="3" fill="#2f6b3f"/>
  <text x="330" y="76" font-size="9" fill="#5f6f66">1 → N · feeds, large result sets</text>

  <text x="12" y="120" font-size="10" fill="#23362e" font-weight="700">client stream</text>
  <line x1="120" y1="112" x2="300" y2="112" stroke="#5f6f66" stroke-width="1.5"/><circle cx="300" cy="112" r="3" fill="#5f6f66"/>
  <line x1="120" y1="122" x2="300" y2="122" stroke="#5f6f66" stroke-width="1.5"/><circle cx="300" cy="122" r="3" fill="#5f6f66"/>
  <line x1="300" y1="134" x2="120" y2="134" stroke="#2f6b3f" stroke-width="1.5"/><circle cx="120" cy="134" r="3" fill="#2f6b3f"/>
  <text x="330" y="126" font-size="9" fill="#5f6f66">N → 1 · uploads, telemetry</text>

  <text x="12" y="172" font-size="10" fill="#23362e" font-weight="700">bidirectional</text>
  <line x1="120" y1="162" x2="300" y2="162" stroke="#5f6f66" stroke-width="1.5"/><circle cx="300" cy="162" r="3" fill="#5f6f66"/>
  <line x1="300" y1="172" x2="120" y2="172" stroke="#2f6b3f" stroke-width="1.5"/><circle cx="120" cy="172" r="3" fill="#2f6b3f"/>
  <line x1="120" y1="182" x2="300" y2="182" stroke="#5f6f66" stroke-width="1.5"/><circle cx="300" cy="182" r="3" fill="#5f6f66"/>
  <text x="330" y="176" font-size="9" fill="#5f6f66">N ↔ N · chat, control planes</text>
  <text class="hand" x="280" y="150" fill="#c53b3b" font-size="14" text-anchor="middle">same stream, different cardinality</text>
</svg>
