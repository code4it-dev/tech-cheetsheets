title: JWT & token handling
slug: jwt
tagline: Signed, not secret. Verifiable, not revocable. Everything else follows from those two facts.
asof: Nov 2026 · RFC 7519 (JWT), RFC 7515 (JWS), RFC 7517 (JWK), RFC 8725 (BCP) · examples in C# and Python
description: "JWT cheatsheet: the three segments, the validation checks in order, the alg-confusion and none attacks, the revocation problem, and where to store a token."
