# content/<slug>.yaml — the whole page. No HTML: the renderer builds it.
# Text fields are Markdown (`code`, **bold**, _em_, [link](url), lists, tables, ``` fences).
# Diagrams live beside this file in content/<slug>/*.svg.

title: "{{Tech}}"
slug: "{{slug}}"
tagline: "{{one line, rendered as a handwritten note}}"
asof: "{{Mon YYYY}} · {{latest version / release line}}"
description: "{{Tech}} cheatsheet: {{one sentence on what the page covers}}"
aliases: [ "{{Tech}}", "{{other names the page is mentioned by}}" ]
keywords: [ "{{5-10 tags: category, synonyms, related tech}}" ]
# related: [ {{slugs related even though neither page mentions the other}} ]

overview:
  - "{{what problem it solves}}"
  - "{{how it solves it}}"
  - "{{who uses it, where it fits, license}}"
# footnote: "{{rare: a disambiguating note under the overview}}"

architecture:
  svg: "{{slug}}/architecture.svg"
  alt: "{{what the diagram shows, for screen readers}}"
  caption: "{{one-line mental model}}"

# An ordered sequence. Most pages are one note plus two animations; a page that compares
# several approaches may add headings, prose and a table between them.
howItWorks:
  - note: "{{optional red-pen aside}}"
  - anim:
      id: anim-1
      title: "{{what this animation shows}}"
      svg: "{{slug}}/anim-1.svg"
      alt: "{{description}}"
      steps:
        - say: "{{what happens and **why**}}"
          show: [ "{{element-id}}" ]
          hl: [ "{{element-id}}" ]
        - say: "{{next step}}"
          move: { "{{element-id}}": [ 240, 0 ] }
          text: { "{{element-id}}": "{{new label}}" }
          fill: { "{{element-id}}": "#e3eedc" }
  # - heading: "{{section heading}}"
  #   id: compare-approaches
  # - md: "{{prose that ties the animations together}}"
  # - table:
  #     columns: [ "{{Approach}}", "{{Best for}}" ]
  #     rows:
  #       - cells: [ "{{a}}", "{{b}}" ]
  #       - self: true
  #         cells: [ "{{this page's subject}}", "{{b}}" ]

# 8-18 cards, fundamental -> advanced. Every one gets a deep dive.
concepts:
  - term: "{{term}}"
    short: "{{one or two sentences}}"
    see: [ "{{other term on this page}}" ]
    detail: |
      {{80-250 words: what it is, how it works under the hood}}

      #### Common values
      | {{setting}} | {{typical value / when}} |
      | --- | --- |
      | {{a}} | {{b}} |

      #### How it relates
      - {{how it connects to the terms in `see`}}
    # A panel may hold one picture or one animation; put ::figure:: or ::anim <key>::
    # on its own line in `detail` to say where.
    # figure: { svg: "{{slug}}/figure-{{term}}.svg", alt: "{{description}}" }
    # anim:
    #   key: "{{key}}"
    #   title: "{{title}}"
    #   svg: "{{slug}}/{{key}}.svg"
    #   alt: "{{description}}"
    #   steps: [ { say: "…" } ]

commands:
  heading: "Essential commands & syntax"   # or "Essential code patterns", "Essential formulas", …
  tocLabel: "Commands"                     # the short form for the sidebar
  # note: "{{optional red-pen aside above the groups}}"
  groups:
    - group: "{{Setup / Everyday / Debug}}"
      items:
        - lang: csharp                     # omit for output, formulas, directory trees
          code: |
            {{C# first, then the Python equivalent as its own item}}
          what: "{{what it does}}"

prosCons:
  good: { heading: Pros, items: [ "{{4-7 specific bullets}}" ] }
  bad:  { heading: Cons, items: [ "{{4-7 specific bullets}}" ] }

useCases:
  - title: "{{Scenario}}"
    body: "{{who, what problem, how the tech solves it}}"

when:
  note: "{{rule of thumb in one handwritten line}}"
  good: { heading: "Use it when…",   items: [ "{{condition}}" ] }
  bad:  { heading: "Avoid it when…", items: [ "{{condition}}. Use **{{X}}**." ] }

gotchas:
  items:
    - mistake: "{{mistake}}"
      why: "{{why it bites}}"
      fix: "{{fix}}"

alternatives:
  columns: [ Tool, Best for, Complexity, "Cost / license", "Key difference vs {{Tech}}" ]
  rows:
    - self: true
      cells: [ "**{{Tech}}**", "{{best for}}", "{{complexity}}", "{{license}}", "—" ]
    - cells: [ "**{{alt}}**", "{{best for}}", "{{complexity}}", "{{license}}", "{{difference}}" ]
  notes:
    - "**Pick {{alt}}** if {{condition}}."

resources:
  - url: "{{url}}"
    title: "{{title}}"
    why: "{{why it's useful}}"
